# Program skeletons. sk.generic is the unchanged fallback. Further skeletons
# are drafts for owner review.
version: 1
status: draft
sources:
  - {design: docs/research/2026-10-21-program-library.md, anchor: "### Overview"}
notes: Draft stage patterns for owner review. sk.generic is unchanged.
skeletons:
  - id: sk.generic
    label: Generic stage sequence
    stages: [investigation, concept_design, approval_documentation, construction_documentation,
             approvals, procurement, construction, completion, defects]
    links:
      - {from: investigation, to: concept_design, type: FS, lag: null}
      - {from: concept_design, to: approval_documentation, type: FS, lag: null}
      - {from: approval_documentation, to: construction_documentation, type: FS, lag: null}
      - {from: construction_documentation, to: approvals, type: FS, lag: null}
      - {from: approvals, to: procurement, type: FS, lag: null}
      - {from: procurement, to: construction, type: FS, lag: null}
      - {from: construction, to: completion, type: FS, lag: null}
      - {from: completion, to: defects, type: FS, lag: null}
    status: draft
    sources:
      - {design: docs/plans/2026-10-18-program.md, anchor: "### 4.1 `skeletons.yaml` — stage patterns"}
  - id: sk.new-traditional-da
    label: "New building, traditional procurement, development consent"
    applies_when:
      all:
        - {det: work_type, eq: new}
        - {cond: procurement_route, eq: traditional}
        - {cond: planning, any_of: [da, planning_permit]}
    stages: [investigation, concept_design, approval_documentation, approvals, construction_documentation, procurement, construction, completion, defects]
    links: []
    status: draft
    sources:
      - {design: docs/research/2026-10-21-program-library.md, anchor: "### sk.new-traditional-da"}
  - id: sk.new-traditional-cdc
