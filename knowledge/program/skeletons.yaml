# Program skeletons. sk.generic is the unchanged fallback. Further skeletons
# are drafts for owner review.
version: 1
status: draft
sources:
  - {design: docs/research/2026-10-21-program-library.md, anchor: "### Overview"}
notes: Draft stage patterns for owner review. Stages are the seven project stages (works/stages.yaml).
skeletons:
  - id: sk.generic
    label: Generic stage sequence
    stages: [brief_concept, schematic_design, planning, design_development, tender_documentation, design_finalisation, delivery]
    # As traditional, the commonest route: documentation before the tender.
    fragment_stages: {design_finalisation: design_development}
    links:
      - {from: brief_concept, to: schematic_design, type: FS, lag: null}
      - {from: schematic_design, to: planning, type: FS, lag: null}
      - {from: planning, to: design_development, type: FS, lag: null}
      - {from: design_development, to: tender_documentation, type: FS, lag: null}
      - {from: tender_documentation, to: design_finalisation, type: FS, lag: null}
      - {from: design_finalisation, to: delivery, type: FS, lag: null}
    status: draft
    sources:
      - {design: docs/plans/2026-10-18-program.md, anchor: "### 4.1 `skeletons.yaml` — stage patterns"}
  - id: sk.new-traditional-da
    label: "New building, traditional procurement, development consent"
    applies_when:
      all:
        - {det: work_type, eq: new}
        - {cond: procurement_route, eq: traditional}
        - {cond: planning, any_of: [da, planning_permit]}
    stages: [brief_concept, schematic_design, planning, design_development, tender_documentation, design_finalisation, delivery]
    # Traditional: the library's construction documentation (signed off for
    # tender) and the construction certificate come before the tender, so
    # they sit in design development; design finalisation keeps the
    # for-construction issue.
    fragment_stages: {design_finalisation: design_development}
    links: []
    status: draft
    sources:
      - {design: docs/research/2026-10-21-program-library.md, anchor: "### sk.new-traditional-da"}
