    also: [trees, arborist, arboricultural, vegetation, tree protection zone, canopy]
  - word: asbestos
    also: [hazardous materials, hazmat, acm, lead paint, synthetic mineral fibre]
  - word: rock
    also: [sandstone, excavation in rock, rock excavation, shale]
  - word: latent condition
    also: [latent conditions, unforeseen conditions, site conditions]
  - word: contingency
    also: [contingencies, contingency sum]
  - word: after hours
    also: [after-hours, out of hours, outside normal hours, night works, weekend works]
  - word: working hours
    also: [hours of work, construction hours, permitted hours]
  - word: bms
    also: [building management system, building management and control system, bmcs]
  - word: carpet
    also: [carpet tile, floor coverings, soft flooring]
  - word: construction certificate
    also: [prior to the issue of a construction certificate, before the construction certificate, cc]
  - word: contamination
    also: [contaminated land, remediation, site audit]
  - word: flood
    also: [flooding, flood planning level, overland flow]
  - word: heritage
