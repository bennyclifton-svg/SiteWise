# Construction synonyms the chat's document search is widened with
# (docs/plans/2026-11-15-chat-agent.md, review change 5). When a search
# names one word of a group, Go searches for every word of the group and
# tells the PM which words were searched. Written by the chat build from
# general construction usage; the owner has not reviewed it.
version: 1
status: draft
synonyms:
