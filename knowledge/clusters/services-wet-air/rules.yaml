version: 1
rules:
- id: rule.ncc.habitable-room-ventilation
  title: Ventilation of habitable rooms
  instrument: NCC 2022 Volume One and Volume Two
  clause: Vol 1 Part F4.5; Vol 2 Part 3.8.5 (seed numbering; NCC 2019). residential-construction-guide
    gives Vol 2 Part 13.5 (conflict)
  clause_verified: false
  systems:
  - mechanical.ventilation
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - 1a
      - 1b
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  requires: Every habitable room is ventilated either naturally, by openable windows or doors opening
    directly to outside air, or mechanically in accordance with AS 1668.2 (or AS 1668.4 for natural ventilation
    design).
  evidence:
    type: noul
    instructions: Using `text`, does this passage state how habitable rooms are ventilated, either by
      openable windows or doors or by a mechanical ventilation system?
    criteria:
      true: It states the ventilation method for habitable rooms, such as openable window area, natural
        cross-ventilation, or mechanical outdoor-air supply to AS 1668.2.
      false: It does not state how habitable rooms are ventilated, or it only describes air-conditioning
        without saying how outdoor air is provided.
    runs_on:
    - mechanical.ventilation
  numbers:
  - claim: Natural ventilation needs openable area of not less than 5% of the room floor area
    verified: false
  related_rules:
  - rule.as1668-2.outdoor-air-rates
  - rule.basix.ventilation-commitment
  notes: A recirculating split system is not ventilation (mechanical-services-guide). NCC 2022 renumbered
    light and ventilation to Part F6 (Vol 1).
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Ventilation Requirements and Ceiling Heights'
  - seed: multi-residential-apartments-guide.md
    anchor: '### Mechanical Ventilation in Apartments'
  - seed: residential-construction-guide.md
    anchor: '## Residential Services — Hydraulic, Electrical, and Mechanical'
  - seed: mechanical-services-guide.md
    anchor: '### Outdoor air and indoor air quality'
- id: rule.ncc.sanitary-laundry-exhaust
  title: Exhaust ventilation of bathrooms, sanitary compartments and laundries
  instrument: NCC 2022 Volume One and Volume Two
  clause: Vol 1 Part F4.5 and Vol 2 Part 3.8.5 (ncc-reference-guide); Vol 2 H6.3 (mep-residential) (seed
    numbering; NCC 2019)
  clause_verified: false
  systems:
  - mechanical.local-exhaust
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - 1a
      - 1b
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  requires: Bathrooms, ensuites, sanitary compartments and laundries that are not naturally ventilated
    by an openable window have mechanical exhaust at the minimum extract rate.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify mechanical exhaust for a bathroom, ensuite,
      toilet, sanitary compartment or laundry?
    criteria:
      true: It specifies an exhaust fan or exhaust system for at least one bathroom, ensuite, toilet,
        sanitary compartment or laundry, with or without a stated airflow rate.
      false: It does not specify exhaust for any of these rooms, or it only mentions kitchen rangehoods
        or general ventilation.
    runs_on:
    - mechanical.local-exhaust
  numbers:
  - claim: Bathroom exhaust minimum 25 L/s (mep-residential, NCC Vol 2 H6.3)
    verified: false
  - claim: 'Bathrooms: openable window of at least 5% of floor area or mechanical exhaust of 25 L/s per
      fixture (ncc-reference-guide)'
    verified: false
  - claim: Sanitary compartments ventilated at 25 L/s per compartment (ncc-reference-guide)
    verified: false
  - claim: AS 1668.2 typical extract 25 L/s for a bathroom and 20 L/s for a toilet (multi-residential-apartments-guide)
    verified: false
  related_rules:
  - rule.ncc.exhaust-discharge-to-outside
  notes: Seeds disagree on the toilet rate (25 L/s vs 20 L/s) and on per-fixture vs per-compartment wording.
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Ventilation Requirements and Ceiling Heights'
  - seed: mep-residential.md
    anchor: '### Wet area exhaust'
  - seed: multi-residential-apartments-guide.md
    anchor: '### Mechanical Ventilation in Apartments'
- id: rule.ncc.exhaust-discharge-to-outside
  title: Exhaust discharges to outside air, not into concealed spaces
  instrument: NCC 2022 Volume Two
  clause: Vol 2 H6.3 (mep-residential; seed numbering)
  clause_verified: false
  systems:
  - mechanical.local-exhaust
  requires: Exhaust from bathrooms, toilets, laundries and ducted rangehoods is discharged to outside
    air, not into the roof space, ceiling void or other concealed building space.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state where an exhaust fan or rangehood discharges?
    criteria:
      true: It states the discharge point of an exhaust fan or rangehood, for example ducted to outside
        through the roof or wall, or into the roof space.
      false: It does not state where any exhaust discharges.
    runs_on:
    - mechanical.local-exhaust
  numbers: []
  related_rules:
  - rule.ncc.sanitary-laundry-exhaust
  notes: The seed condensation-management section covers envelope vapour control only; NCC 2022 condensation
    exhaust clauses (Vol 1 F8, Vol 2 Part 10.8) are for the verifier to confirm.
  status: draft
  sources:
  - seed: mep-residential.md
    anchor: '### Wet area exhaust'
  - seed: residential-construction-guide.md
    anchor: '## Residential Services — Hydraulic, Electrical, and Mechanical'
  - seed: mechanical-services-guide.md
    anchor: '### Local exhaust'
- id: rule.as1668-2.outdoor-air-rates
  title: Minimum outdoor air rates and filtration for mechanical ventilation
  instrument: AS 1668.2:2012
  clause: AS 1668.2
  clause_verified: false
  systems:
  - mechanical.ventilation
  - mechanical.air-conditioning
  applies_when:
    all:
    - system_present: mechanical.ventilation
  requires: Mechanically ventilated spaces receive at least the AS 1668.2 minimum outdoor air rate for
    their use, combining a per-person and a per-area component, with filtration to the stated minimum.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state an outdoor air rate or the outdoor air design
      basis for a space or system?
    criteria:
      true: It states an outdoor air quantity (for example L/s per person or L/s per m2) or states that
        outdoor air is designed to AS 1668.2 for named spaces.
      false: It does not state an outdoor air rate or design basis; supply airflow for cooling alone does
        not count.
    runs_on:
    - mechanical.ventilation
    - mechanical.air-conditioning
  numbers:
  - claim: Offices 10 L/s per person plus 1.0 L/s per m2
    verified: false
  - claim: Classrooms 10 L/s per person plus 0.5 L/s per m2
    verified: false
  - claim: Retail 10 L/s per person plus 0.5 L/s per m2
    verified: false
  - claim: Restaurants 10 L/s per person plus 1.0 L/s per m2
    verified: false
  - claim: Hospital wards 10 L/s per person plus 2.0 L/s per m2
    verified: false
  - claim: Minimum filtration MERV 8 for most commercial applications; MERV 13 or higher for hospitals
      and laboratories
    verified: false
  related_rules:
  - rule.ncc.habitable-room-ventilation
  - rule.ncc.hvac-energy-efficiency
  notes: The seed per-person plus per-area format should be checked against AS 1668.2 itself.
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 1668 Series — Ventilation and Air-Conditioning'
  - seed: commercial-construction-guide.md
    anchor: '## Commercial HVAC and Mechanical Services'
- id: rule.as1668-2.intake-separation
  title: Outdoor-air intakes separated from exhausts and contaminant sources
  instrument: AS 1668.2:2012
  clause: AS 1668.2 (seed cites the standard, no clause)
  clause_verified: false
  systems:
  - mechanical.ventilation
  - mechanical.local-exhaust
  - mechanical.cooling-towers
  applies_when:
    all:
    - system_present: mechanical.ventilation
  requires: Outdoor-air intakes are located and separated from exhaust discharges, cooling towers, vehicle
    traffic and other contaminant sources so that contaminated air is not drawn back into the building.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state the location of an outdoor-air intake relative
      to an exhaust discharge, cooling tower, vent, flue or vehicle area?
    criteria:
      true: It states where an outdoor-air intake is, or a separation distance, in relation to an exhaust,
        cooling tower, plumbing vent, gas flue or traffic source.
      false: It does not relate any outdoor-air intake to a contaminant source.
    runs_on:
    - mechanical.ventilation
    - mechanical.local-exhaust
    - mechanical.cooling-towers
  numbers:
  - claim: Cooling tower air intakes (seed wording) at least 6 m from building fresh air intakes (AS/NZS
      3666.1)
    verified: false
  related_rules:
  - rule.asnzs3666.cooling-tower-microbial-control
  status: draft
  sources:
  - seed: mechanical-services-guide.md
    anchor: '### Outdoor air and indoor air quality'
  - seed: mechanical-services-guide.md
    anchor: '### Concept and schematic design [concept]'
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 3666 Series — Air-Handling and Water Systems — Microbial Control'
  - seed: mixed-use-construction-guide.md
    anchor: '## Stratification, cores and separate services'
- id: rule.as1668.carpark-ventilation
  title: Ventilation of enclosed car parks
  instrument: AS 1668.1:2015 and AS 1668.2:2012
  clause: AS 1668.1 Section 6 (as-standards-reference); commercial guide cites AS 1668.1 and AS 1668.2
  clause_verified: false
  systems:
  - mechanical.carpark-ventilation
  applies_when:
    any:
    - det: ncc_class
      any_of:
      - 7a
    - system_present: mechanical.carpark-ventilation
  requires: An enclosed car park that does not qualify as naturally ventilated has mechanical ventilation
    at the prescribed rate, commonly controlled by carbon monoxide monitoring, and switchable to smoke
    exhaust on fire detection where the fire strategy requires it.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state whether an enclosed car park or loading area is
      naturally ventilated or mechanically ventilated?
    criteria:
      true: It states the ventilation method for a car park or enclosed vehicle area (natural ventilation,
        mechanical exhaust or supply fans, jet fans, or CO-controlled ventilation).
      false: It does not state how any car park or enclosed vehicle area is ventilated.
    runs_on:
    - mechanical.carpark-ventilation
  numbers:
  - claim: Enclosed car parks 7.5 L/s per m2 (seed attributes to AS 1668.1 Section 6)
    verified: false
  related_rules:
  - rule.as1668-1.air-handling-fire-mode
  notes: Seed places normal car-park ventilation rate in AS 1668.1; normal ventilation is usually AS 1668.2.
    Verify.
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 1668 Series — Ventilation and Air-Conditioning'
  - seed: commercial-construction-guide.md
    anchor: '## Carpark Design for Commercial Buildings'
  - seed: mechanical-services-guide.md
    anchor: '### Car-park and enclosed-vehicle areas'
- id: rule.as1668-1.air-handling-fire-mode
  title: Fire-mode operation of air-handling and smoke-control equipment
  instrument: AS 1668.1:2015
  clause: AS 1668.1 Clause 4.6 (stair pressurisation door force), Section 5 (zone smoke control), Section
    6 (car parks)
  clause_verified: false
  systems:
  - mechanical.fire-mode-air-systems
  - mechanical.controls-bms
  - fire-active
  applies_when:
    any:
    - system_present: mechanical.fire-mode-air-systems
    - system_present: mechanical.carpark-ventilation
  requires: Air-handling systems have a defined fire mode (shutdown, smoke exhaust, zone pressurisation
    or stair pressurisation) that starts automatically on fire detection, runs on an essential power supply,
    overrides energy-saving controls, and is commissioned by pressure-differential testing.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify what an air-handling system, fan or damper does
      in fire mode?
    criteria:
      true: It specifies a fire-mode action such as fan shutdown, smoke exhaust, stair or zone pressurisation,
        damper closure or opening, or a cause-and-effect entry for mechanical plant.
      false: It does not describe any fire-mode behaviour of mechanical plant.
    runs_on:
    - mechanical.fire-mode-air-systems
    - mechanical.carpark-ventilation
    - mechanical.controls-bms
  numbers:
  - claim: Stair pressurisation minimum 50 Pa differential with all doors closed
    verified: false
  - claim: Door opening force not exceeding 110 N (AS 1668.1 Clause 4.6)
    verified: false
  - claim: Stair pressurisation required where effective height exceeds 25 m (NCC Part E2.2, seed numbering;
      fire cluster rule)
    verified: false
  related_rules:
  - rule.as1668.carpark-ventilation
  notes: The fire cluster owns smoke control as fire strategy and the NCC E2 trigger; this rule covers
    the mechanical equipment's fire mode.
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 1668 Series — Ventilation and Air-Conditioning'
  - seed: mechanical-services-guide.md
    anchor: '### Smoke control and fire interfaces'
  - seed: ncc-reference-guide.md
    anchor: '### Fire-Isolated Exits, Emergency Lighting, and Accessible Egress'
- id: rule.as1668-1.kitchen-exhaust-fire-rated-duct
  title: Commercial kitchen exhaust in fire-rated ductwork
  instrument: AS 1668.1:2015
  clause: AS 1668.1 (commercial-construction-guide; no clause given)
  clause_verified: false
  systems:
  - mechanical.local-exhaust
  - fire-passive
  applies_when:
    all:
    - det: commercial_kitchen
      is: true
  requires: Commercial kitchen exhaust systems use fire-rated ductwork and meet state planning requirements
    for odour and noise at the discharge.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify fire-rated ductwork or a fire-rated shaft for
      a commercial kitchen exhaust?
    criteria:
      true: It specifies a fire rating, fire-rated duct, fire-rated enclosure or shaft for kitchen exhaust
        ductwork.
      false: It does not state any fire rating for kitchen exhaust ductwork, or the kitchen is a domestic
        kitchen.
    runs_on:
    - mechanical.local-exhaust
  numbers: []
  related_rules:
  - rule.ncc.penetration-protection
  status: draft
  sources:
  - seed: commercial-construction-guide.md
    anchor: '## Commercial HVAC and Mechanical Services'
- id: rule.as4254.ductwork-construction
  title: Ductwork construction, installation and sealing
  instrument: AS 4254.1:2012 and AS 4254.2:2012
  clause: AS 4254.1 (flexible); AS 4254.2 (rigid), Section 5 (leakage)
  clause_verified: false
  systems:
  - mechanical.air-distribution
  applies_when:
    all:
    - system_present: mechanical.air-distribution
  requires: Flexible ductwork is fully extended, supported and within the maximum run length; rigid ductwork
    uses the gauge, joints and stiffening for its size and pressure class; all ductwork is sealed to its
    leakage class.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state a ductwork construction requirement such as duct
      material or gauge, leakage class, sealing, support spacing, insulation or flexible-duct length?
    criteria:
      true: It states at least one ductwork construction or installation requirement, or cites AS 4254.
      false: It only shows duct routes or sizes without any construction, sealing or installation requirement.
    runs_on:
    - mechanical.air-distribution
  numbers:
  - claim: Flexible duct maximum installed length 6 m per run, excluding 1.5 m factory tails
    verified: false
  - claim: Flexible duct minimum bend radius one duct diameter
    verified: false
  - claim: Flexible duct support spacing not more than 1.5 m, with support within 300 mm of each connection
    verified: false
  - claim: Compressed flexible duct increases pressure drop by up to 400% per metre
    verified: false
  - claim: Flexible duct insulation typically R1.0 minimum inside the building, R1.5 in roof spaces
    verified: false
  - claim: 'Rectangular duct up to 750 mm: minimum 0.60 mm galvanised steel for low pressure (up to 500
      Pa), 0.80 mm for medium pressure (500-1000 Pa)'
    verified: false
  - claim: Rectangular duct support spacing maximum 2.5 m up to 750 mm, 1.5 m for larger sizes
    verified: false
  - claim: Class A leakage maximum 0.009 x p^0.65 L/s per m2 of duct surface; Class B 3x Class A; Class
      C 1/3 of Class A
    verified: false
  - claim: Unsealed joints in commercial systems can leak 15-25% of total airflow
    verified: false
  - claim: Equal-friction sizing typically 1.0-1.5 Pa/m; velocity maximum 5 m/s in occupied spaces reducing
      to 3 m/s near diffusers
    verified: false
  related_rules:
  - rule.as1682.fire-damper-installation
  - rule.ncc.hvac-energy-efficiency
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 4254 Series — Ductwork for Air-Handling Systems in Buildings'
- id: rule.as1682.fire-damper-installation
  title: Fire dampers where ducts penetrate fire-resisting construction
  instrument: AS 1682.1 and AS 1682.2; NCC 2022 Volume One
  clause: NCC Part C3 (seed numbering; NCC 2019); NCC Spec C3.15 cited by AS 4254 seed
  clause_verified: false
  systems:
  - fire-passive.openings
  - mechanical.air-distribution
  applies_when:
    all:
    - system_present: mechanical.air-distribution
    - det: ncc_class
      any_of:
      - '2'
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  requires: Where air-handling ducts pass through fire-resisting construction, fire dampers are fitted
    and installed strictly in the manufacturer's tested and listed configuration, with access for inspection
    and maintenance.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify fire dampers where ductwork passes through a
      fire-resisting wall, floor or shaft?
    criteria:
      true: It specifies fire dampers, fire-rated dampers or combination fire and smoke dampers at duct
        penetrations of fire-resisting construction, or cites AS 1682.
      false: It does not mention fire dampers at any duct penetration.
    runs_on:
    - mechanical.air-distribution
    - mechanical.local-exhaust
    - fire-passive.openings
  numbers: []
  related_rules:
  - rule.ncc.penetration-protection
  - rule.as4254.ductwork-construction
  notes: May overlap a fire-cluster rule on openings; lead to reconcile ids.
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Protection of Openings in Fire-Resisting Construction'
  - seed: as-standards-reference.md
    anchor: '## AS 4254 Series — Ductwork for Air-Handling Systems in Buildings'
- id: rule.ncc.hvac-energy-efficiency
  title: Energy efficiency of air-conditioning and ventilation systems
  instrument: NCC 2022 Volume One
  clause: Part J5 (as-standards-reference; NCC 2019 numbering); Part J3 (ncc-reference-guide); Part J6
    (mechanical-services-guide; NCC 2022 numbering)
  clause_verified: false
  systems:
  - mechanical.air-conditioning
  - mechanical.central-plant
  - mechanical.ventilation
  - mechanical.air-distribution
  - mechanical.controls-bms
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '2'
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  requires: Air-conditioning and ventilation systems meet the Section J minimum equipment efficiencies
    and control requirements (economy cycles, heat recovery, variable-speed drives, demand-controlled
    ventilation, time control), and ductwork and pipework are insulated and sealed. For Class 2 buildings
    this applies to common-area systems.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state NCC Section J requirements or compliance for air-conditioning
      or ventilation systems?
    criteria:
      true: It states Section J HVAC requirements, equipment efficiency requirements, required energy
        controls (economy cycle, heat recovery, VSD, time switching) or duct and pipe insulation to meet
        Section J.
      false: It does not refer to energy efficiency of air-conditioning or ventilation, or only discusses
        envelope or lighting.
    runs_on:
    - mechanical.air-conditioning
    - mechanical.central-plant
    - mechanical.ventilation
    - mechanical.controls-bms
  numbers: []
  related_rules:
  - rule.ncc.jv3-verification-hvac-inputs
  - rule.gems.air-conditioner-registration
  notes: Three seeds give three Part numbers. commercial-construction-guide also wrongly attributes energy
    efficiency to 'NCC Section F'.
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Section J DTS Provisions (J1-J6)'
  - seed: as-standards-reference.md
    anchor: '## AS 1668 Series — Ventilation and Air-Conditioning'
  - seed: mechanical-services-guide.md
    anchor: '## Current authoritative verification points'
  - seed: multi-residential-apartments-guide.md
    anchor: '### NCC Energy Efficiency Requirements for Class 2'
- id: rule.ncc.jv3-verification-hvac-inputs
  title: JV3 energy modelling reflects the installed HVAC and controls
  instrument: NCC 2022 Volume One
  clause: Verification Method JV3
  clause_verified: false
  systems:
  - mechanical.air-conditioning
  - mechanical.controls-bms
  - envelope
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  requires: Where JV3 is used, the proposed building's modelled greenhouse gas emissions do not exceed
    the DTS reference building, and the HVAC system and control strategy modelled are the ones designed
    and installed.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state that NCC Section J compliance is shown by JV3
      or by energy simulation against a reference building?
    criteria:
      true: It states that JV3, a reference-building comparison or energy simulation is the Section J
        compliance pathway.
      false: It does not state a JV3 or simulation pathway, or it states a DTS pathway.
    runs_on:
    - mechanical.air-conditioning
    - mechanical.controls-bms
    - envelope
  numbers: []
  related_rules:
  - rule.ncc.hvac-energy-efficiency
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### JV3 Verification Method (Performance-Based Compliance)'
  - seed: non-residential-sustainability-energy-guide.md
    anchor: '## NCC energy-efficiency coordination'
- id: rule.asnzs3666.cooling-tower-microbial-control
  title: Microbial (Legionella) control of cooling towers
  instrument: AS/NZS 3666.1:2011, AS/NZS 3666.2:2011; NCC 2022 Volume One
  clause: NCC Part F2.5 (seed numbering; NCC 2019); AS/NZS 3666.1 (design), 3666.2 (operation and maintenance)
  clause_verified: false
  systems:
  - mechanical.cooling-towers
  applies_when:
    all:
    - system_present: mechanical.cooling-towers
  requires: Cooling towers are designed, installed and commissioned to AS/NZS 3666.1 (drift eliminators,
    no stagnant zones or dead legs, access for cleaning, separation from outdoor-air intakes) and operated
    to AS/NZS 3666.2 with biocide treatment and microbiological testing.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify Legionella or microbial control for a cooling
      tower?
    criteria:
      true: It specifies AS/NZS 3666 compliance, water treatment, biocide dosing, drift eliminators, microbiological
        testing or a Legionella management plan for a cooling tower.
      false: It mentions a cooling tower without any microbial control measure, or does not mention a
        cooling tower.
    runs_on:
    - mechanical.cooling-towers
  numbers:
  - claim: Drift eliminators limit drift to less than 0.002% of circulating flow
    verified: false
  - claim: Cooling tower air intakes (seed wording) at least 6 m from building fresh air intakes
    verified: false
  - claim: Target heterotrophic colony count below 100,000 CFU/mL
    verified: false
  - claim: Target Legionella below 10 CFU/mL
    verified: false
  - claim: Legionella above 1000 CFU/mL requires shutdown and decontamination
    verified: false
  - claim: Hyperchlorination at 10 mg/L free chlorine for at least 1 hour
    verified: false
  related_rules:
  - rule.state.cooling-tower-registration
  - rule.as1668-2.intake-separation
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 3666 Series — Air-Handling and Water Systems — Microbial Control'
  - seed: ncc-reference-guide.md
    anchor: '### Accessible Facilities and Microbial Control'
- id: rule.state.cooling-tower-registration
  title: Registration of cooling towers with the state health authority
  instrument: 'State public health legislation: Public Health Act 2010 (NSW); Public Health and Wellbeing
    Act 2008 (VIC); Public Health Act 2005 (QLD)'
  clause: Registration provisions (seed gives Acts, no sections)
  clause_verified: false
  systems:
  - mechanical.cooling-towers
  applies_when:
    all:
    - system_present: mechanical.cooling-towers
  requires: Cooling towers are registered with the local council or state health authority; VIC requires
    annual audits and QLD requires a risk management plan; treatment, testing and maintenance records
    are kept.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state that a cooling tower is to be registered with
      a council or health authority?
    criteria:
