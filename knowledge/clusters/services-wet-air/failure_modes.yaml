version: 1
failure_modes:
- id: fm.condensate-to-hydraulic-drainage
  attaches_to:
    interface: if.condensate-to-hydraulic-drainage
  severity: durability
  detector:
    type: noul
    instructions: Using `text`, does this passage explicitly state condensate discharged into a ceiling
      cavity?
    criteria:
      true: It explicitly states condensate discharged into a ceiling cavity.
      false: It does not state this; a general mention of the system is insufficient.
    runs_on:
    - mechanical.refrigerant-condensate
    - hydraulic.sanitary
  flag_when: true
  status: draft
  sources:
  - seed: mechanical-services-guide.md
    anchor: '### Refrigerant, condensate and water interfaces'
