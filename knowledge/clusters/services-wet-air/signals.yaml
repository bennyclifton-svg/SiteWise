version: 1
signals:
- id: sig.water-authority-connection-application-stated
  type: noul
  instructions: Using `text`, does the passage state that an application to the water authority for the
    building's water connection has been lodged or approved?
  criteria:
    'true': It says an application for the water connection has been lodged or approved.
    'false': It does not mention the application, or only says one will be needed.
  runs_on:
  - hydraulic.cold-water
  status: draft
  sources:
  - seed: hydraulic-services-guide.md
    anchor: '## Design review and coordination controls'
- id: sig.trade-waste-approval-stated
  type: noul
