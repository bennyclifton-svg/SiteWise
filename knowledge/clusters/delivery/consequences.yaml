      all:
        - {"det": "state", "any_of": ["NSW"]}
        - {"det": "ncc_class", "any_of": ["1a", "1b", "2", "4"]}
        - {"works": {"action": ["new", "alter", "replace", "upgrade", "repair", "remove"], "system": ["substructure", "structure", "envelope", "interiors", "fire-active", "fire-passive", "mechanical", "hydraulic", "electrical"]}}
    propose:
      - {"kind": "hold_point", "label": "Review statutory work category, contract value and entity to establish NSW licensing, contract and insurance requirements and exemptions"}
    signals: []
