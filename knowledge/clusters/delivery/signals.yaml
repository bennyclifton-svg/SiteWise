# Delivery signals: Jev questions that ask what a passage states about programme,
# contract, authority, site or handover facts. Same authoring rules as SCHEMA.md Questions.
version: 1
signals:
  - id: sig.plant-access-or-lift-study-stated
    type: noul
    instructions: "Using `text`, does the passage state a lift study, crane selection or plant access assessment for the site?"
    criteria:
      "true": "It states that a lift study, crane selection or plant access assessment was carried out or is held."
      "false": "It does not mention one, or only says one is required."
    runs_on: ["site"]
    status: draft
    sources:
      - {"seed": "program-scheduling-guide.md", "anchor": "## Program Risk Assessment"}
  - id: sig.vehicle-swept-path-check-stated
    type: noul
    instructions: "Using `text`, does the passage state a swept path or turning path check for vehicles on the site?"
    criteria:
      "true": "It states a swept path or turning path check, drawing or analysis."
      "false": "It does not mention one, or only says vehicles must be able to turn."
    runs_on: ["site"]
    status: draft
    sources:
      - {"seed": "program-scheduling-guide.md", "anchor": "## Program Risk Assessment"}
  - id: sig.product-certificate-stated
    type: noul
    instructions: "Using `text`, does the passage state a test report, certificate of conformity or product certification for a named product?"
    criteria:
      "true": "It names a test report, certificate or certification held for a named product."
      "false": "It does not name one, or only says products must comply or be certified."
    runs_on: ["fire-passive", "envelope"]
    status: draft
    sources:
      - {"seed": "ncc-reference-guide.md", "anchor": "## 7. The certifier's role"}
  - id: sig.mandatory-inspections-stated
    type: noul
    instructions: "Using `text`, does the passage list mandatory inspections or hold points that must be passed before the next stage of work?"
    criteria:
      "true": "It lists one or more inspections or hold points, or names a stage that cannot proceed until an inspection is passed."
      "false": "It does not list inspections or hold points, or only says work will be inspected."
    runs_on: ["site"]
    status: draft
    sources:
      - {"seed": "ncc-reference-guide.md", "anchor": "## 7. The certifier's role"}
  - id: sig.completion-certificates-requirement-stated
    type: noul
    instructions: "Using `text`, does the passage state certificates or compliance documentation that must be given to the certifier at completion?"
    criteria:
      "true": "It names certificates or documentation required for final inspection or an occupation certificate."
      "false": "It does not name any, or only says the building must comply."
    runs_on: ["site"]
    status: draft
    sources:
      - {"seed": "ncc-reference-guide.md", "anchor": "## 7. The certifier's role"}
  - id: sig.consent-conditions-stated
