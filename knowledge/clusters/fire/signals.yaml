  status: draft
  sources:
  - seed: fire-life-safety-guide.md
    anchor: '## Passive fire protection'
- id: sig.installed-penetration-system-recorded-stated
  type: noul
  instructions: Using `text`, does the passage state that the fire-stopping systems actually installed
    are recorded on the essential safety measures or maintenance schedule?
  criteria:
    'true': It states installed systems are recorded on the schedule.
    'false': It does not say; a requirement to record them is not a statement that they are recorded.
