version: 1
signals:
- id: sig.fire-water-authority-capacity-advice-stated
  type: noul
  instructions: Using `text`, does the passage state the water authority's advice on the mains flow or
    pressure available at the site?
  criteria:
    'true': It states advice, a letter or a result from the water authority on available mains flow or
      pressure.
    'false': It does not state authority advice; an intention to apply for advice or to test is not advice.
  runs_on:
  - fire-active.fire-water
  - fire-active.hydrants
  - site.services-connections
  status: draft
  sources:
  - seed: fire-life-safety-guide.md
    anchor: '## Active systems and water supply'
- id: sig.detector-isolation-during-works-stated
  type: noul
  instructions: Using `text`, does the passage state how fire detectors are covered, isolated or otherwise
    handled during dusty works?
  criteria:
    'true': It states a method for covering, isolating or otherwise handling detectors during works.
    'false': It does not state a method; a general mention of dust control or of the fire alarm is not
      enough.
  runs_on:
  - fire-active.detection
  status: draft
  sources:
  - seed: fire-life-safety-guide.md
    anchor: '## Existing buildings, refurbishment and remediation'
- id: sig.performance-solution-acceptance-stated
  type: noul
  instructions: Using `text`, does the passage state that the certifier or authority has accepted or approved
    the fire engineering performance solution?
  criteria:
    'true': It states acceptance or approval of the performance solution by the certifier or authority.
    'false': It does not state acceptance; a solution that is proposed, submitted or under review is not
      accepted.
  runs_on:
  - fire-passive
  - fire-active
  status: draft
  sources:
  - seed: fire-life-safety-guide.md
    anchor: '## Passive fire protection'
- id: sig.fire-alarm-staging-plan-stated
  type: noul
  instructions: Using `text`, does the passage state how the fire alarm stays active, or what temporary
    cover is provided, while the existing alarm is replaced?
  criteria:
    'true': It states how the alarm stays active or what temporary cover is provided during replacement.
    'false': It does not state this; a general mention of replacing the fire alarm is not enough.
  runs_on:
  - fire-active.detection
  status: draft
  sources:
  - seed: fire-life-safety-guide.md
    anchor: '## Existing buildings, refurbishment and remediation'
- id: sig.existing-exit-stair-isolation-stated
  type: noul
  instructions: Using `text`, does the passage state that the existing exit stair is enclosed in fire-rated
    construction separating it from the storeys it serves?
  criteria:
    'true': It states the stair is enclosed or fire-isolated from the floors.
    'false': It does not say; an intention to confirm isolation is not a statement.
  runs_on:
  - access-egress.stairs-and-ramps
  - fire-passive.compartments
  status: draft
  sources:
  - seed: fire-life-safety-guide.md
    anchor: '## Existing buildings, refurbishment and remediation'
- id: sig.floor-level-at-smoke-door-stated
  type: noul
  instructions: Using `text`, does the passage state a level survey or measured floor fall at a smoke
    door?
  criteria:
    'true': It states a measured floor level or fall at the door.
    'false': It does not state a measurement; a note that the floor is uneven is not a measurement.
  runs_on:
  - fire-passive.openings
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Protection of Openings in Fire-Resisting Construction'
- id: sig.existing-fire-door-frame-condition-stated
  type: noul
  instructions: Using `text`, does the passage state the condition of existing fire door frames, such
    as out of square or a dropped leaf?
  criteria:
    'true': It states the condition of the existing frames or leaves.
    'false': It does not state their condition.
  runs_on:
  - fire-passive.openings
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Protection of Openings in Fire-Resisting Construction'
- id: sig.rated-ceiling-build-up-stated
  type: noul
  instructions: Using `text`, does the passage state the build-up of an existing ceiling that the fire
    strategy relies on for a fire rating?
  criteria:
    'true': It states the construction of the existing ceiling and ties it to the rating relied on.
    'false': It does not describe the ceiling build-up.
