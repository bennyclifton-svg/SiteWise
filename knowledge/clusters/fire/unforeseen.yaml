  de_risk:
    kind: approval
    label: Early review of the fire engineering performance solution with the certifier and fire authority
      before design is fixed
  contract: Design risk stays with the fire engineer; programme allowance for authority review and resubmission.
  effect:
  - programme
  - cost
  - compliance
  severity: compliance
  discovered_at:
  - design
  - construction
  status: draft
  sources:
  - dataset: batch1
    row: B1-0354
  - seed: fire-life-safety-guide.md
    anchor: '## Passive fire protection'
  notes: Applies only where a performance solution is relied on. The works predicate is broad because
    no determinant yet records that a performance solution is in use.
