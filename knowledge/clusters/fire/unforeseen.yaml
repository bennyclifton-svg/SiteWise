version: 1
unforeseen:
- id: uc.existing-fire-water-fails-flow-test
  kind: unforeseen_condition
  category: existing_systems_on_test
  attaches_to:
    system: fire-active.fire-water
  when:
    all:
    - works:
        action:
        - new
        - upgrade
        - alter
        system:
        - fire-active.sprinklers
        - fire-active.hydrants
    - det: existing_building
      is: true
  signals:
  - sig.existing-fire-water-test-results-stated
  de_risk:
    kind: investigation
    label: Flow and pressure test of the existing fire water supply before design
  contract: Provisional sum or separable portion for any supply upgrade.
  effect:
  - cost
  - programme
  - compliance
  severity: life-safety
  discovered_at:
  - design
  - testing_commissioning
  status: draft
  sources:
  - seed: fire-life-safety-guide.md
    anchor: '## Active systems and water supply'
  notes: Illustrative record fixing the shape (K0). A stated test result is the signal that the condition
    is already known, so the proposal can be dropped. No frequency or cost is recorded because no source
    states one.
- id: uc.street-main-below-fire-flow-demand
  kind: unforeseen_condition
  category: existing_systems_on_test
  attaches_to:
    system: fire-active.hydrants
  when:
    all:
    - &id001
      works:
        action:
        - new
        - upgrade
        - alter
        system:
        - fire-active.sprinklers
        - fire-active.hydrants
  signals:
  - sig.existing-fire-water-test-results-stated
  de_risk:
    kind: investigation
    label: Hydrant flow and pressure test of the street main at the connection point before design
  contract: Provisional sum or separable portion for a booster, tank or pump if the main falls short.
  effect:
  - cost
  - programme
  - compliance
  severity: life-safety
  discovered_at:
  - design
  - testing_commissioning
  status: draft
  sources:
  - dataset: batch1
    row: B1-0365
  - seed: fire-life-safety-guide.md
    anchor: '## Active systems and water supply'
  - seed: as-standards-reference.md
    anchor: '## AS 2419 Series — Fire Hydrant Installations'
  notes: New-build counterpart of uc.existing-fire-water-fails-flow-test; no existing building is needed.
    A stated test result is the signal that the condition is already known.
- id: uc.authority-requires-water-main-upgrade
  kind: process_authority_supply_weather
  category: authorities_and_utilities
  attaches_to:
    stage: approvals
  when:
    all:
    - *id001
  signals:
  - sig.fire-water-authority-capacity-advice-stated
  de_risk:
    kind: approval
    label: Water authority advice on available mains capacity and any required main upgrade, sought before
      design is fixed
  contract: Authority-required augmentation is a client cost and programme item; do not include it in
    the lump sum.
  effect:
  - cost
  - programme
  severity: cost
  discovered_at:
  - design
  - construction
  status: draft
  sources:
  - dataset: batch1
    row: B1-0333
  - seed: fire-life-safety-guide.md
    anchor: '## Active systems and water supply'
  notes: Fire flow demand can exceed the existing main; the authority then requires an upgrade as a condition
    of the connection.
- id: uc.dust-sets-off-fire-detectors
  kind: process_authority_supply_weather
  category: supply_and_site_operations
  attaches_to:
    stage: construction
  when:
    all:
    - works:
        action:
        - alter
        - upgrade
        - replace
        - repair
        - remove
    - det: existing_building
      is: true
  signals:
  - sig.detector-isolation-during-works-stated
  de_risk:
    kind: obligation
    label: Dust control and a managed detector isolation arrangement for the occupied building during
      dusty works
  contract: Contractor obligation for dust control and for reinstating isolated detectors; false alarm
    call-outs are not a variation.
  effect:
  - programme
  - cost
  - safety
  severity: programme
  discovered_at:
  - construction
  status: draft
  sources:
  - dataset: batch1
    row: B1-0340
  - seed: fire-life-safety-guide.md
    anchor: '## Existing buildings, refurbishment and remediation'
  notes: Isolating detectors is itself an impairment of a fire measure; see fm.fire-impairment-without-temporary-protection.
- id: uc.performance-solution-rejected-by-authority
  kind: process_authority_supply_weather
  category: authorities_and_utilities
  attaches_to:
    stage: approvals
  when:
    all:
    - works:
        action:
        - new
        - alter
        - upgrade
        system:
        - fire-passive.compartments
        - fire-passive.rated-elements
        - fire-active.smoke-control
  signals:
  - sig.performance-solution-acceptance-stated
  de_risk:
    kind: approval
    label: Early review of the fire engineering performance solution with the certifier and fire authority
      before design is fixed
  contract: Design risk stays with the fire engineer; programme allowance for authority review and resubmission.
  effect:
  - programme
  - cost
  - compliance
  severity: compliance
  discovered_at:
  - design
  - construction
  status: draft
  sources:
  - dataset: batch1
    row: B1-0354
  - seed: fire-life-safety-guide.md
    anchor: '## Passive fire protection'
  notes: Applies only where a performance solution is relied on. The works predicate is broad because
    no determinant yet records that a performance solution is in use.
- id: uc.fire-alarm-replacement-needs-occupant-shutdown
  kind: process_authority_supply_weather
  category: third_parties_and_occupation
  attaches_to:
    stage: construction
  when:
    all:
    - works:
        action:
        - replace
        - upgrade
        - alter
        system:
        - fire-active.detection
    - det: existing_building
      is: true
  signals:
  - sig.fire-alarm-staging-plan-stated
  de_risk:
    kind: obligation
    label: Staging plan keeping the fire alarm active or providing temporary cover while the existing
      alarm is replaced
  contract: Separable portion with out-of-hours or staged working allowance; temporary cover is a contractor
    obligation.
  effect:
  - programme
  - cost
  - safety
  severity: life-safety
  discovered_at:
  - design
  - construction
  status: draft
  sources:
  - dataset: batch1
    row: B1-0686
  - seed: fire-life-safety-guide.md
    anchor: '## Existing buildings, refurbishment and remediation'
  notes: Compare fm.fire-impairment-without-temporary-protection, which flags a measure isolated without
    its temporary protection.
