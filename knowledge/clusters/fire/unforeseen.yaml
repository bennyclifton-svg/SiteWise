- id: uc.authority-requires-water-main-upgrade
  kind: process_authority_supply_weather
  category: authorities_and_utilities
  attaches_to:
    stage: approvals
  when:
    all:
    - *id001
  signals:
  - sig.fire-water-authority-capacity-advice-stated
  de_risk:
    kind: approval
    label: Water authority advice on available mains capacity and any required main upgrade, sought before
      design is fixed
  contract: Authority-required augmentation is a client cost and programme item; do not include it in
    the lump sum.
  effect:
  - cost
  - programme
  severity: cost
  discovered_at:
  - design
  - construction
  status: draft
  sources:
  - dataset: batch1
    row: B1-0333
  - seed: fire-life-safety-guide.md
    anchor: '## Active systems and water supply'
  notes: Fire flow demand can exceed the existing main; the authority then requires an upgrade as a condition
    of the connection.
- id: uc.dust-sets-off-fire-detectors
  kind: process_authority_supply_weather
  category: supply_and_site_operations
  attaches_to:
    stage: construction
  when:
    all:
    - works:
        action:
        - alter
        - upgrade
        - replace
        - repair
        - remove
    - det: existing_building
      is: true
  signals:
  - sig.detector-isolation-during-works-stated
  de_risk:
    kind: obligation
    label: Dust control and a managed detector isolation arrangement for the occupied building during
      dusty works
  contract: Contractor obligation for dust control and for reinstating isolated detectors; false alarm
    call-outs are not a variation.
  effect:
  - programme
  - cost
  - safety
  severity: programme
  discovered_at:
  - construction
  status: draft
  sources:
  - dataset: batch1
    row: B1-0340
  - seed: fire-life-safety-guide.md
    anchor: '## Existing buildings, refurbishment and remediation'
  notes: Isolating detectors is itself an impairment of a fire measure; see fm.fire-impairment-without-temporary-protection.
- id: uc.performance-solution-rejected-by-authority
  kind: process_authority_supply_weather
  category: authorities_and_utilities
  attaches_to:
