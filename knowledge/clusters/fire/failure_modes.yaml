version: 1
failure_modes:
- id: fm.plastic-pipe-without-fire-collar
  attaches_to:
    interface: if.services-penetrate-fire-rated-construction
  severity: life-safety
  detector:
    type: noul
    instructions: Using `text`, does this passage show or describe a plastic pipe passing through a fire-resisting
      wall or floor without a fire collar or other tested penetration protection?
    criteria:
      true: It describes a plastic pipe through fire-rated construction and states or shows no collar
        or tested protection at that penetration.
      false: It does not describe such a penetration, or the penetration it describes is protected.
    runs_on:
    - fire-passive.penetrations
    - hydraulic
  flag_when: true
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### SOU Separation and Service Penetrations'
  - dataset: batch1
    row: B1-0301
- id: fm.fire-water-supply-assessed-late
  attaches_to:
    interface: if.fire-water-supplies-sprinklers
  severity: cost
  detector:
    type: noul
    instructions: Using `text`, does this passage explicitly state that issued fire-system design, tender
      or installation relies on a water supply that has not been verified?
    criteria:
      true: It explicitly says the issued design, tender or installation relies on an outstanding, excluded
        or overdue supply assessment, flow test or hydraulic calculation.
      false: A future assessment in an early plan, a general outstanding task without this dependency,
        silence, or completed verification is insufficient.
    runs_on:
    - fire-active.fire-water
    - fire-active.sprinklers
    - hydraulic
  flag_when: true
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 2118 Series — Automatic Fire Sprinkler Systems'
  notes: Pending evidence alone is not a late-assessment defect. The passage must explicitly tie unverified
    supply to an issued design, tender or installation relying on it.
- id: fm.fire-door-hold-open-not-released-on-alarm
  attaches_to:
    system: fire-passive.openings
  severity: life-safety
  detector:
    type: noul
    instructions: Using `text`, does this passage explicitly state a fire-door hold-open device that fails
      to release on alarm?
    criteria:
      true: It explicitly states a fire-door hold-open device that fails to release on alarm.
      false: It does not state this; a general mention of the system is insufficient.
    runs_on:
    - fire-passive.openings
    - fire-active.detection
  flag_when: true
  notes: This detector requires an explicit failure statement. Missing release evidence is a review gap,
    not proof of failed hardware.
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Protection of Openings in Fire-Resisting Construction'
