version: 1
rules:
- id: rule.ncc.type-of-construction
  title: Type of Construction required
  instrument: NCC 2022 Volume One
  clause: C2D2, Table C2D2
  clause_verified: true
  systems:
  - fire-passive.rated-elements
  - structure
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '2'
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  derives:
    table: type_of_construction
    inputs:
    - ncc_class
    - rise_in_storeys
    gives: type_of_construction
  requires: Use the baseline class/rise lookup only within its recorded scope; apply relevant exceptions
    and jurisdictional provisions separately. Mixed classifications require C2D4 assessment before lookup.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state the building's Type of Construction (Type A, Type
      B or Type C)?
    criteria:
      true: It names Type A, Type B or Type C construction for the building or a part of it.
      false: It does not name a Type of Construction, or only explains what the types mean in general.
    runs_on:
    - fire-passive
    - structure
  numbers:
  - claim: 'Baseline Table C2D2: Class 2, 3 and 9 at rises 4+, 3, 2, 1 map to A, A, B, C.'
    verified: true
    primary_source: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/c-fire-resistance/part-c2-fire-resistance-and-stability
  - claim: 'Baseline Table C2D2: Class 5, 6, 7 and 8 at rises 4+, 3, 2, 1 map to A, B, C, C.'
    verified: true
    primary_source: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/c-fire-resistance/part-c2-fire-resistance-and-stability
  related_rules:
  - rule.ncc.sprinkler-concession-type-of-construction
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Types of Construction (A, B, C)'
  primary_source: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/c-fire-resistance/part-c2-fire-resistance-and-stability
  checked_on: '2026-09-29'
  notes: Primary correction replaces the seed blanket Type B claim for rises 2 or 3. See determinants/VERIFICATION.md.
    Table is draft; scope/exclusions must be checked before computation.
- id: rule.ncc.sprinkler-concession-type-of-construction
  title: Sprinkler concession for Type of Construction
  instrument: NCC 2022 Volume One
  clause: C1.6, Specification 17 (seed numbering; NCC 2019)
  clause_verified: false
  systems:
  - fire-passive.rated-elements
  - fire-active.sprinklers
  applies_when:
    all:
    - det: sprinklered
      is: true
  requires: Record the exact approved provision or performance solution supporting any sprinkler-dependent
    concession. The seed claim of a generic construction-type reduction is unverified and must not be
    applied as a rule.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state that a sprinkler concession or sprinkler trade-off
      is used to reduce the Type of Construction, fire resistance levels, compartment size or travel distances?
    criteria:
      true: It states that the design relies on sprinklers to reduce a fire requirement (Type of Construction,
        FRL, compartment size or travel distance).
      false: It mentions sprinklers without saying another fire requirement was reduced because of them.
    runs_on:
    - fire-passive
    - fire-active.sprinklers
  numbers:
  - claim: A 4-storey Class 5 building needing Type A may use Type B if fully sprinklered
    verified: false
  related_rules:
  - rule.ncc.type-of-construction
  - rule.as1851.fire-system-maintenance
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Sprinkler Concessions for Type of Construction'
  notes: 'Rejected generic seed proposition: 2019 C1.6 maps to C2D7 (Class 4 parts), not a general Class
    5 sprinkler downgrade. Do not compute a reduction. Only record the exact approved concession or Performance
    Solution. Primary check: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/c-fire-resistance/part-c2-fire-resistance-and-stability'
- id: rule.ncc.penetration-protection
  title: Protection of service penetrations through fire-resisting construction
  instrument: NCC 2022 Volume One
  clause: C4D15
  clause_verified: true
  systems:
  - fire-passive.penetrations
  requires: 'Protect applicable service openings in elements requiring fire integrity or insulation using
    the appropriate C4D15 route: tested systems, prescribed duct provisions or Specification 13 where
    permitted. Confirm the installation and clause scope; do not infer compliance from a product name.'
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify how service penetrations through fire-resisting
      walls or floors are protected?
    criteria:
      true: It names a protection method for penetrations (fire collar, wrap, sealant, damper or a tested
        system) or requires one.
      false: It does not address penetration protection, or only states the wall or floor's fire rating
        without saying how penetrations are protected.
    runs_on:
    - fire-passive
    - hydraulic
    - mechanical
    - electrical
  related_rules: []
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### SOU Separation and Service Penetrations'
  primary_source: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/c-fire-resistance/part-c4-protection-openings
  checked_on: '2026-09-29'
  notes: Primary locator is C4D15, formerly C3.15. Seed C4.5 is incorrect. Clause verification does not
    verify a particular product or installation.
- id: rule.as1851.fire-system-maintenance
  title: Routine service of fire protection systems
  instrument: AS 1851:2012 (Amdt 1, 2016)
  clause: AS 1851
  clause_verified: false
  systems:
  - fire-active
  requires: Installed fire protection systems must be serviced to AS 1851 schedules by licensed personnel,
    with defects rectified and an annual fire safety statement lodged under state legislation.
  numbers:
  - claim: Non-critical defects rectified within 30 days
    verified: false
  related_rules: []
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 1851 — Routine Service of Fire Protection Systems'
- id: rule.ncc.fire-element-frl
  title: Fire resistance of complete elements
  instrument: NCC 2022 Volume One
  clause: Specification C1.1 (seed numbering; NCC 2019)
  clause_verified: false
  systems: &id001
  - fire-passive.rated-elements
  - fire-passive.structural-fire-protection
  requires: Establish the required fire resistance for each element and its connections from the applicable
    construction type, classification and element conditions.
  evidence:
    type: noul
    instructions: Using `text`, does this passage explicitly state the required FRL for a building element?
    criteria:
      true: It explicitly states the required FRL for a building element.
      false: It does not state this, or only mentions the system generally.
    runs_on: *id001
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Fire Resistance Level (FRL) Requirements'
- id: rule.ncc.fire-compartment-limits
  title: Fire compartment limits
  instrument: NCC 2022 Volume One
  clause: C3D3, Table C3D3
  clause_verified: true
  systems: &id002
  - fire-passive.compartments
  requires: Assess compartment area and volume using the applicable instrument table; the conflicting
    seed sprinkler-based limits are not a design basis.
  evidence:
    type: noul
    instructions: Using `text`, does this passage explicitly state the floor area of a fire compartment?
    criteria:
      true: It explicitly states the floor area of a fire compartment.
      false: It does not state this, or only mentions the system generally.
    runs_on: *id002
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Fire Compartment Sizes and Classification Separation'
  numbers:
  - claim: 'Baseline Table C3D3, Class 5 Type B: maximum area 5500 m2 and volume 33000 m3; not a universal
      unsprinklered limit.'
    verified: true
    primary_source: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/c-fire-resistance/part-c3-compartmentation-and-separation
  primary_source: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/c-fire-resistance/part-c3-compartmentation-and-separation
  checked_on: '2026-09-29'
  notes: Verified rows are in knowledge/tables/compartment_limits.yaml. Both conflicting seed figures
    are rejected as universal Class 5 limits; see determinants/VERIFICATION.md. Exceptions and mixed-class
    calculations are outside the baseline table.
