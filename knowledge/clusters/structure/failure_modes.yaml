version: 1
failure_modes:
- id: fm.ground-model-informs-foundations
  attaches_to:
    interface: if.ground-model-informs-foundations
  severity: life-safety
  detector:
    type: noul
    instructions: Using `text`, does this passage explicitly state the geotechnical investigation does
      not reach the proposed founding depth?
    criteria:
      true: It explicitly states the geotechnical investigation does not reach the proposed founding depth.
      false: It does not state this, only discusses the topic generally, or states the opposite.
    runs_on:
    - substructure.footings
    - substructure.piles
    - site.ground-conditions
  flag_when: true
  status: draft
  sources:
  - seed: structural-commercial-industrial-guide.md
    anchor: '## Common failures and low-confidence flags'
