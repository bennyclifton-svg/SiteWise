# Signal questions for the structure cluster (K4 Pass B). A true answer means the passage states the thing,
# never that a condition exists. Same authoring rules as SCHEMA.md Questions.
version: 1
signals:
- id: sig.founding-level-ground-data-stated
  type: noul
  instructions: Using `text`, does the passage state ground conditions recorded at the proposed founding
    depth from a borehole or test pit?
  criteria:
    'true': It states ground conditions recorded at the proposed founding depth from a borehole or test
      pit.
    'false': It does not state this; a requirement, recommendation or intention is not a statement of
      fact.
  runs_on:
  - substructure.footings
  - substructure.piles
  - site.ground-conditions
  status: draft
  sources:
  - seed: geotechnical-guide.md
    anchor: '## Common failures and low-confidence flags'
