version: 1
consequences:
  - id: cq.pre-2004-fabric-hazardous-materials-survey
    when:
      all:
        - works: {action: [alter, replace, upgrade, repair, remove]}
        - {det: existing_building_year, lt: 2004}
    propose:
      - {kind: investigation, label: Hazardous materials survey of areas affected by the works}
    signals: [sig.hazardous-materials-survey-stated]   # a stated survey already answers the proposal
    governed_by: []          # rule written and verified in K3
    clause_verified: false
    severity: life-safety
    status: draft
    sources:
      - {seed: remediation-due-diligence-guide.md, anchor: "## Asbestos Assessment and Management in Construction"}
    notes: >-
      Illustrative record fixing the shape (K0). The year threshold comes from
      the seed and the plan's example, not the instrument; it stays unverified
      until K3 reads the source.
  - id: cq.existing-structural-intervention-sequence-review
    when:
      all:
        - works: {action: [alter, replace, upgrade, remove], system: [structure, substructure]}
        - {det: existing_building, is: true}
    propose:
      - {kind: hold_point, label: Review load paths and temporary support before existing structural intervention}
    signals: []
    governed_by: []
    clause_verified: false
    severity: life-safety
    status: draft
    sources:
      - {seed: renovation-guide.md, anchor: "## Structural intervention"}
    notes: >-
      Draft planning review of load paths, sequencing, temporary support and
      inspection evidence with the responsible designer before affected work.
      It does not design propping, prescribe structural changes, certify adequacy
      or assert that temporary support is always required. Acceptance creates
      an undated review milestone, not physical works or statutory approval.
      New structure, retained scope and repair-only work are outside this bounded
      trigger. Document titles alone do not establish that the review is complete.
