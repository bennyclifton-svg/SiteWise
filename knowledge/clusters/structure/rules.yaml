version: 1
rules:
- id: rule.ncc.structural-design-basis
  title: Structural design basis
  instrument: NCC 2022 Volumes One and Two
  clause: Part B1, Specification B1.1; Volume Two Part 2.1 (seed numbering; NCC 2019)
  clause_verified: false
  systems:
  - structure.design-basis
  requires: Document the actions, importance level and structural design standards adopted for the building.
  evidence:
    type: noul
    instructions: Using `text`, does this passage explicitly state the adopted structural importance level?
    criteria:
      true: It explicitly states the adopted structural importance level.
      false: It does not state this, only discusses the topic generally, or states the opposite.
    runs_on:
    - structure.design-basis
  numbers: []
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Performance Requirements and Importance Levels'
- id: rule.as1170.structural-actions
  title: Permanent and imposed actions
  instrument: AS/NZS 1170 series
  clause: Specific clause pending primary-instrument verification
  clause_verified: false
  systems:
  - structure.design-basis
  requires: Design for permanent and imposed actions using the applicable combinations, including distributed
    and concentrated load cases.
  evidence:
    type: noul
    instructions: Using `text`, does this passage explicitly state a concentrated imposed load case?
    criteria:
      true: It explicitly states a concentrated imposed load case.
      false: It does not state this, only discusses the topic generally, or states the opposite.
    runs_on:
    - structure.design-basis
  numbers:
  - claim: Seed residential imposed floor load 1.5 kPa; balcony 2.0 kPa (conflicts with residential structural
      seed 3.0 kPa).
    verified: false
  - claim: Seed office load 3.0 kPa, retail 4.0 kPa, assembly 4.0–5.0 kPa; not design defaults.
    verified: false
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 1170 Series — Structural Design Actions'
