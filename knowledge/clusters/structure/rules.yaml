    type: noul
    instructions: Using `text`, does this passage explicitly state the exposure classification for a concrete
      element?
    criteria:
      true: It explicitly states the exposure classification for a concrete element.
      false: It does not state this, only discusses the topic generally, or states the opposite.
    runs_on:
    - structure.concrete
    - substructure.footings
    - substructure.slab-on-ground
    - substructure.piles
  numbers:
  - claim: 'Seed A1: 25 MPa and 20 mm cover; B1: 32 MPa and 40 mm; B2: 40 MPa and 45 mm; C: 50 MPa and
      50 mm. Do not use as a lookup table.'
    verified: false
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 3600 — Concrete Structures'
