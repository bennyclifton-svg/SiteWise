- id: uc.colour-or-dye-batch-variation
  notes: 'K4 source review, 6 October 2026: B1-0230, B1-0717 and B1-0727 describe batch-related
    appearance variation in cladding, tiles and carpet. Retain the common supply mechanism.
    Single-batch ordering is a draft proposed procurement control, not a source-verified universal
    requirement or a guarantee of matching appearance. Project-specific acceptance, feasibility
    and the generated contract wording still need owner review. See
    docs/unforeseen/k4-envelope-merge-review.json.'
