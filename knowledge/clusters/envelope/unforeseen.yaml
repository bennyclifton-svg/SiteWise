version: 1
unforeseen:
- id: uc.heritage-wall-opening-conflicts-with-fabric
  kind: unforeseen_condition
  category: existing_structure
  attaches_to:
    system: envelope.external-walls
  when:
    all:
    - works:
        action:
        - alter
        - upgrade
        system:
        - envelope.external-walls
    - &id001
      det: existing_building
      is: true
    - det: heritage_status
      any_of:
      - conservation_area
      - local_item
      - state_register
  signals:
  - sig.envelope-heritage-fabric-significance-stated
  de_risk:
    kind: investigation
    label: Heritage fabric assessment before the opening is designed
  contract: Provisional sum for heritage-approved opening works; separable portion for conservation repairs.
  effect:
  - cost
  - programme
  - compliance
  severity: compliance
  discovered_at:
  - design
  - demolition_strip_out
  status: draft
  sources:
  - dataset: batch1
    row: B1-0166
