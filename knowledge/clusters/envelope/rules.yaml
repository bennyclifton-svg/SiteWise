- id: rule.as3671.road-traffic-noise-intrusion
  title: Facade designed against road traffic noise
  instrument: AS 3671:1989 (and state road noise policies)
  clause: AS 3671
  clause_verified: false
  systems:
  - envelope.facade-acoustics
  - envelope.windows-doors
  applies_when:
    any:
    - det: noise_affected_site
      is: true
  requires: On noise-affected sites the facade (walls, windows, roof and ceiling) reduces external noise
    to the internal targets with windows closed, and a ventilation strategy works with windows closed;
    state EPA or road noise policies may set stricter criteria.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state a required acoustic rating (Rw or Rw + Ctr) for
      windows or glazing on the facade?
    criteria:
      true: It states an Rw or Rw + Ctr rating, acoustic glazing make-up or acoustic seals for facade
        windows or doors.
      false: It does not state an acoustic rating for facade glazing.
    runs_on:
    - envelope.facade-acoustics
    - envelope.windows-doors
  numbers:
  - claim: Bedrooms at most 35 dBA L10 and living areas 40 dBA L10 with windows closed
    verified: false
  - claim: 65 dBA L10 facade level needs about 30 dB reduction, achievable with brick veneer and closed
      windows
    verified: false
  - claim: 70-80 dBA common within 50 m of major arterial roads
    verified: false
  - claim: 6-8-6 mm IGU for Rw 30+; 10-12-6 mm for Rw 35+
    verified: false
  - claim: Metal roof with plasterboard ceiling about Rw 35; with R3.5 batts and 13 mm plasterboard about
      Rw 45
    verified: false
  - claim: State policies trigger treatment at 55-60 dBA Lden or L10(18hr)
    verified: false
  - claim: Field performance typically 5-10 dB below laboratory ratings
    verified: false
  - claim: Rw overestimates traffic noise performance by 5-10 dB without Ctr
    verified: false
  related_rules:
  - rule.as2107.design-sound-levels
  - rule.ncc.natural-light
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 3671 — Acoustics — Road Traffic Noise Intrusion — Building Siting and Construction'
