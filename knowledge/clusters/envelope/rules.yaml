  requires: 'External wall cladding, reveals and eaves meet the BAL: non-combustible or bushfire-resistant
    cladding at lower BALs, FRL-rated or tested wall systems at BAL-29 and above, enclosed eaves and non-combustible
    reveals at BAL-40, and specialist design (usually a Performance Solution) at BAL-FZ.'
