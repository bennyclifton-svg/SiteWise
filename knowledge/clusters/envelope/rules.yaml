- id: rule.ncc.sou-wall-sound-insulation
  title: Airborne sound insulation of walls between sole-occupancy units
  instrument: NCC 2022 Volume One
  clause: Part F5 (seed numbering; NCC 2019); finishes seed says Specification 43
  clause_verified: false
  systems:
  - interiors.acoustic-separation
  applies_when:
    any:
    - det: ncc_class
      any_of:
      - '2'
      - '3'
      - 9c
  derives:
    pending: true
    reason: Primary instrument and full applicability inputs must be verified before this table can be
      implemented; return unknown.
    table: sound_insulation_requirements
    inputs:
    - ncc_class
    gives: sou_wall_min_rw_ctr
  requires: Walls between sole-occupancy units, and between units and common areas, achieve the required
    airborne sound insulation rating and are built and sealed so the as-built wall performs as rated.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state an Rw or Rw + Ctr rating for a wall between sole-occupancy
      units or tenancies?
    criteria:
      true: It states an Rw or Rw + Ctr value, or an acoustic wall type with its rating, for a separating
        wall.
      false: It does not state an airborne sound rating for a separating wall.
    runs_on:
    - interiors.acoustic-separation
  numbers:
  - claim: Walls between SOUs Rw + Ctr at least 50
    verified: false
  - claim: Office inter-tenancy walls typically Rw 45, Rw 50-55 where confidential spaces adjoin common
      areas
    verified: false
  notes: AS 2107 seed section wrongly says NCC F5 references AS/NZS 2107 for SOU sound insulation; the
    rating standard is AS/NZS ISO 717.1.
  related_rules:
  - rule.ncc.sou-floor-airborne-sound
  - rule.ncc.sou-floor-impact-sound
  status: draft
  sources:
  - seed: multi-residential-apartments-guide.md
    anchor: '### SOU Separation — Fire and Acoustic'
  - seed: commercial-construction-guide.md
    anchor: '## Acoustics in Commercial Buildings'
