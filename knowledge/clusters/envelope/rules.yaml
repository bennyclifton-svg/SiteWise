- id: rule.as2107.design-sound-levels
  title: Design sound levels inside rooms
  instrument: AS/NZS 2107:2016
  clause: AS/NZS 2107
  clause_verified: false
  systems:
  - interiors.room-acoustics
  requires: The combined noise from building services and intruding external noise in each room stays
    within the recommended design sound level range for the room type.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state a design or maximum internal sound level (dBA
      or LAeq) for a room type?
    criteria:
      true: It states an internal noise criterion in dBA, LAeq or L10 for a room or room type.
      false: It does not state an internal noise criterion.
    runs_on:
    - interiors.room-acoustics
    - envelope.facade-acoustics
  numbers:
  - claim: Private offices 35-40 dBA; open-plan offices 40-45 dBA
    verified: false
  - claim: Residential living rooms 30-40 dBA; bedrooms 25-35 dBA
    verified: false
  - claim: Teaching spaces 35-45 dBA; hospital wards 35-40 dBA; operating theatres 40-45 dBA
    verified: false
  - claim: Libraries 35-45 dBA; courtrooms 30-35 dBA; concert halls 20-25 dBA
    verified: false
  - claim: Office open-plan 35-40 dB(A) and private offices 30-35 dB(A) (commercial seed)
    verified: false
  notes: The commercial seed's office levels are 5 dB lower than the AS seed's.
  related_rules:
  - rule.as2107.reverberation-time
  - rule.as3671.road-traffic-noise-intrusion
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 2107 — Acoustics — Recommended Design Sound Levels and Reverberation Times for
      Building Interiors'
  - seed: commercial-construction-guide.md
    anchor: '## Acoustics in Commercial Buildings'
