version: 1
rules:
- id: rule.ncc.rising-damp-protection
  title: Rising damp protection (damp-proof course and slab membrane)
  instrument: NCC 2022 Volumes One and Two
  clause: Vol 1 F1.1; Vol 2 3.4.1 (seed numbering; NCC 2019)
  clause_verified: false
  systems:
  - envelope.flashings-seals
  - envelope.external-walls
  - substructure
  requires: Masonry walls have a continuous damp-proof course above finished external ground level that
    laps with the damp-proof membrane under the slab on ground, forming an unbroken moisture barrier.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify a damp-proof course in external walls or its
      position relative to finished ground level?
    criteria:
      true: It specifies a damp-proof course (DPC) in walls, its height above ground or paving, or its
        lap with the slab membrane.
      false: It does not mention a damp-proof course, or mentions only the under-slab membrane.
    runs_on:
    - envelope.flashings-seals
    - envelope.external-walls
    - substructure
  numbers:
  - claim: DPC at not less than 150 mm above finished external ground level
    verified: false
  related_rules:
  - rule.ncc.external-weatherproofing
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Rising Damp Protection and External Weatherproofing'
  - seed: finishes-residential.md
    anchor: '### Brick veneer'
- id: rule.ncc.external-weatherproofing
  title: Roofs and external walls prevent rainwater penetration
  instrument: NCC 2022 Volumes One and Two
  clause: Vol 1 F1.4-F1.7; Vol 2 Part 3.5 (seed numbering; NCC 2019)
  clause_verified: false
  systems:
  - envelope.external-walls
  - envelope.roof-coverings
  - envelope.flashings-seals
  - envelope.curtain-wall
  requires: Roofs and external walls prevent rainwater penetration using suitable coverings, cladding,
    sarking or weather-resistant membranes, flashings, sealants and gutters and downpipes.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify how the external wall or roof is made weatherproof
      (cladding system, drained cavity, flashings, weather-resistant membrane or sealants)?
    criteria:
      true: It names the weatherproofing method or components for a wall or roof (for example drained
        cavity, flashings, wall wrap, sarking, sealant joints).
      false: It describes the wall or roof without saying how water is kept out.
    runs_on:
    - envelope.external-walls
    - envelope.roof-coverings
    - envelope.flashings-seals
    - envelope.curtain-wall
  related_rules:
  - rule.ncc.roof-sarking
  - rule.as4200.pliable-membranes
  - rule.as4284.facade-testing
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Rising Damp Protection and External Weatherproofing'
  - seed: multi-residential-apartments-guide.md
    anchor: '### Weatherproofing and Facade Defects'
- id: rule.ncc.roof-sarking
  title: Sarking under roof coverings
  instrument: NCC 2022 Volumes One and Two
  clause: Vol 1 F1.4-F1.7; Vol 2 Part 3.5 (seed numbering; NCC 2019)
  clause_verified: false
  systems:
  - envelope.pliable-membranes
  - envelope.roof-coverings
  requires: Sarking is provided beneath roof cladding where the climate zone, roof pitch or energy provisions
    require it, lapped and taped, draped to drain to the gutter and laid before battens.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify sarking or a roof underlay beneath the roof
      covering?
    criteria:
      true: It specifies sarking, reflective foil sarking or a roof underlay under tiles or metal roofing.
      false: It does not mention sarking or a roof underlay.
    runs_on:
    - envelope.pliable-membranes
    - envelope.roof-coverings
  numbers:
  - claim: Roof sarking overlaps minimum 150 mm at horizontal joints and 100 mm at end joints (AS 4200.2)
    verified: false
  - claim: Roof sarking supported by battens at maximum 1200 mm spacing (AS 4200.2)
    verified: false
  notes: 'Seeds disagree on when sarking is required: "required under tiles in most climate zones" (finishes)
    versus "beneath metal roof cladding in certain climate zones and below minimum pitch" (NCC guide).'
  related_rules:
  - rule.as4200.pliable-membranes
  status: draft
  sources:
  - seed: finishes-residential.md
    anchor: '### Roof tile systems'
  - seed: ncc-reference-guide.md
    anchor: '### Rising Damp Protection and External Weatherproofing'
  - seed: trade-interfaces-coordination-guide.md
    anchor: '## Interface 1: Frame to roof'
- id: rule.as2050.roof-tile-fixing
  title: Roof tiles, ridges, hips and valleys mechanically fixed
  instrument: AS 2050 (Installation of roof tiles)
  clause: AS 2050
  clause_verified: false
  systems:
  - envelope.roof-coverings
  requires: Ridge, hip and valley tiles are mechanically fixed, not only mortar-bedded, and tiling battens
    are fixed to every rafter at the spacing the tile manufacturer specifies.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify how ridge, hip or valley tiles are fixed?
    criteria:
      true: It states a fixing method for ridge, hip or valley tiles (mechanical fixing, dry-fix with
        clips or foam closures, or mortar bedding and pointing).
      false: It does not state how ridge, hip or valley tiles are fixed.
    runs_on:
    - envelope.roof-coverings
  numbers:
  - claim: Terracotta tiles weigh approximately 45-55 kg/m2
    verified: false
  - claim: Metal sheet roofing weighs approximately 5-8 kg/m2
    verified: false
  related_rules:
  - rule.ncc.external-weatherproofing
  status: draft
  sources:
  - seed: finishes-residential.md
    anchor: '### Roof tile systems'
- id: rule.ncc.metal-roof-installation
  title: Metal roof cladding installed to profile limits
  instrument: NCC 2022 Volume Two
  clause: Part 3.5 (seed numbering; NCC 2019); manufacturer's installation specification
  clause_verified: false
  systems:
  - envelope.roof-coverings
  requires: Metal roof sheeting is laid at or above the minimum pitch for its profile, lapped in the direction
    of water flow, fixed to allow thermal movement, and flashed at all penetrations and abutments with
    flashings matching the profile.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state the roof pitch or the minimum pitch for the metal
      roof sheet profile?
    criteria:
      true: It states a roof pitch in degrees or a ratio, or the manufacturer's minimum pitch for the
        specified metal roof profile.
      false: It does not state a roof pitch or a minimum pitch for the profile.
    runs_on:
    - envelope.roof-coverings
  numbers:
  - claim: Flat and low-pitch roofs below 5 degrees require a waterproof membrane
    verified: false
  related_rules:
  - rule.ncc.external-weatherproofing
  status: draft
  sources:
  - seed: finishes-residential.md
    anchor: '### Metal sheet roofing (Colorbond / Zincalume)'
  - seed: finishes-residential.md
    anchor: '### Flat roofs and membrane systems'
- id: rule.as4773.masonry-veneer-construction
  title: Masonry veneer cavity, ties, weepholes and control joints
  instrument: AS 4773.1-2015 / AS 3700-2018
  clause: AS 4773.1; AS 3700 (seed gives both)
  clause_verified: false
  systems:
  - envelope.external-walls
  - envelope.flashings-seals
  requires: Brick veneer has a clear drained cavity, wall ties at specified centres, cavity flashings
    and open weepholes at the base and above openings, lintels over openings and vertical control joints
    at specified spacings and changes of direction.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify brick ties, cavity width, weepholes or control
      joints for masonry veneer?
    criteria:
      true: 'It specifies at least one of: wall tie type or spacing, cavity width, weephole spacing, cavity
        flashing, or masonry control joint spacing.'
      false: It mentions brick or masonry cladding without any of those details.
    runs_on:
    - envelope.external-walls
    - envelope.flashings-seals
  numbers:
  - claim: Brick ties typically at 600 mm vertical and 900 mm horizontal centres
    verified: false
  - claim: Minimum 25 mm clear cavity between brick and frame (finishes seed)
    verified: false
  - claim: Minimum 40 mm clear cavity (residential construction seed)
    verified: false
  - claim: Weepholes at maximum 1200 mm centres
    verified: false
  - claim: Vertical expansion joints at maximum 6-8 m centres for clay brick
    verified: false
  - claim: Brick cracks wider than 3 mm or stepped may be structural
    verified: false
  notes: Seeds contradict on minimum cavity width (25 mm vs 40 mm).
  related_rules:
  - rule.ncc.rising-damp-protection
  status: draft
  sources:
  - seed: finishes-residential.md
    anchor: '### Brick veneer'
  - seed: residential-construction-guide.md
    anchor: '## Building Envelope and Weatherproofing'
- id: rule.as1604.timber-cladding-durability
  title: Treated or durable timber for external cladding
  instrument: AS 1604 (Preservative-treated wood)
  clause: AS 1604
  clause_verified: false
  systems:
  - envelope.external-walls
  requires: Timber weatherboards and cladding exposed externally are treated pine or hardwood of the required
    hazard class, back-primed, and kept clear of the ground and roof cladding.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state the hazard class or durability class of timber
      cladding or weatherboards?
    criteria:
      true: It states a hazard class (such as H3 or H4) or durability class for external timber cladding.
      false: It does not state a hazard or durability class for external timber.
    runs_on:
    - envelope.external-walls
  numbers:
  - claim: External timber cladding to hazard class H3 or H4
    verified: false
  related_rules: []
  status: draft
  sources:
  - seed: finishes-residential.md
    anchor: '### Weatherboard / timber cladding'
- id: rule.as4200.pliable-membranes
  title: Pliable building membranes selected and installed to AS 4200
  instrument: AS 4200.1:2017; AS 4200.2:2017
  clause: AS 4200.1; AS 4200.2
  clause_verified: false
  systems:
  - envelope.pliable-membranes
  requires: Sarking, wall wrap and vapour barriers are classified for vapour permeance and installed with
    the specified laps, the vapour-permeable face outward, sealing at penetrations, integration with window
    and door head flashings, and a drainage cavity between wall wrap and cladding.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify the vapour permeance class of a wall wrap, sarking
      or vapour barrier?
    criteria:
      true: It states the membrane is vapour permeable, vapour impermeable, a vapour retarder or vapour
        barrier, or cites an AS 4200 classification.
      false: It mentions sarking or wrap without its vapour classification, or does not mention them.
    runs_on:
    - envelope.pliable-membranes
  numbers:
  - claim: Vapour permeable membranes have water vapour permeance above 1.14 ug/N.s
    verified: false
  - claim: Membrane flammability index not exceeding 5 (AS 1530.2)
    verified: false
  - claim: Water resistance minimum 300 mm hydrostatic head (ISO 811)
    verified: false
  - claim: Wall wrap lapped minimum 150 mm horizontally and 100 mm vertically
    verified: false
  - claim: Minimum 20 mm drainage cavity between wall wrap and cladding
    verified: false
  - claim: Vapour barriers have permeance below 56.5 ng/Pa.s.m2 (AS 4859 seed section)
    verified: false
  related_rules:
  - rule.ncc.condensation-management
  - rule.ncc.roof-sarking
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 4200 Series — Pliable Building Membranes and Underlays'
- id: rule.ncc.condensation-management
  title: Condensation management in the envelope
  instrument: NCC 2022 Volumes One and Two
  clause: Vol 1 Part F6 (NCC guide) or F8 (AS guide); Vol 2 Part 3.8.7, Part 3.12 or Part 13.4 (seeds
    disagree; unverified) (seed numbering; NCC 2019)
  clause_verified: false
  systems:
  - envelope.pliable-membranes
  - envelope.thermal-insulation
  applies_when:
    any:
    - det: climate_zone
      any_of:
      - '6'
      - '7'
      - '8'
  requires: 'In cool climate zones the envelope is designed to manage interstitial and surface condensation:
    vapour control on the warm side of the insulation, vapour-permeable membranes outside, ventilated
    cavities or roof spaces, and a condensation risk assessment.'
  evidence:
    type: noul
    instructions: Using `text`, does this passage describe a condensation risk assessment or a condensation
      management measure for the walls or roof?
    criteria:
      true: It describes a condensation risk assessment (Glaser method or hygrothermal modelling) or a
        measure such as a vapour barrier position, vapour-permeable wrap or ventilated roof space for
        condensation control.
      false: It does not address condensation in the envelope.
    runs_on:
    - envelope.pliable-membranes
    - envelope.thermal-insulation
  numbers:
  - claim: Condensation DTS provisions apply in climate zones 6, 7 and 8
    verified: false
  - claim: Condensation increasingly important in climate zones 5-8 (AS 4859 seed section)
    verified: false
  notes: Seeds give four different clause locations. The predicate uses zones 6-8; one seed says 5-8.
    Climate zone option ids are assumed to be "1" to "8".
  related_rules:
  - rule.as4200.pliable-membranes
  - rule.as4859.insulation-product-r-value
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Condensation Management'
  - seed: as-standards-reference.md
    anchor: '## AS 4200 Series — Pliable Building Membranes and Underlays'
  - seed: residential-construction-guide.md
    anchor: '## Energy Efficiency and Thermal Performance'
- id: rule.ncc.wet-area-waterproofing
  title: Wet areas waterproofed to AS 3740
  instrument: NCC 2022 Volumes One and Two
  clause: Vol 1 F1.7; Vol 2 3.4.2 or 3.8.1 (seeds disagree; NCC 2019 numbering) (seed numbering; NCC 2019)
  clause_verified: false
  systems:
  - interiors.wet-area-waterproofing
  requires: Bathrooms, showers, laundries, toilets and other internal wet areas are waterproofed in accordance
    with AS 3740.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify waterproofing of an internal wet area such as
      a bathroom, shower, laundry or toilet?
    criteria:
      true: It specifies a waterproofing membrane or waterproofing standard for an internal wet area.
      false: It does not specify waterproofing for an internal wet area, or only covers balconies or roofs.
    runs_on:
    - interiors.wet-area-waterproofing
  related_rules:
  - rule.as3740.membrane-extent
  - rule.as3740.membrane-installation
  - rule.as4858.wet-area-membrane-material
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Wet Area Waterproofing (AS 3740)'
  - seed: finishes-residential.md
    anchor: '### Regulatory requirement'
- id: rule.as3740.membrane-extent
  title: Extent and heights of wet-area membranes
  instrument: AS 3740:2021
  clause: AS 3740
  clause_verified: false
  systems:
  - interiors.wet-area-waterproofing
  requires: The membrane covers the whole shower floor and extends up shower walls to the required height,
    covers the whole floor of the bathroom and laundry with upstands at walls, extends around baths, and
    for hobless showers extends the required distance beyond the shower rose.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state the height or extent of the waterproofing membrane
      in a shower or wet area?
    criteria:
      true: It states a membrane height up shower walls, a wall upstand height, a floor coverage extent,
        or an extent beyond a shower rose or screen.
      false: It requires waterproofing without stating any height or extent.
    runs_on:
    - interiors.wet-area-waterproofing
  numbers:
  - claim: Shower wall membrane to minimum 1800 mm above finished floor level (AS 3740:2021)
    verified: false
  - claim: Shower wall membrane height was 1500 mm in AS 3740-2010
    verified: false
  - claim: Bathroom and laundry floor membrane with 150 mm wall upstands
    verified: false
  - claim: Bath membrane turned up 150 mm above the bath rim overflow
    verified: false
  - claim: Hobless shower membrane extends at least 1500 mm from the shower rose (AS seed)
    verified: false
  - claim: Hobless shower floor membrane extends to the screen line and at least 150 mm beyond (finishes
      seed)
    verified: false
  - claim: Shower hob or threshold minimum 5 mm step-down from bathroom floor
    verified: false
  notes: Seeds disagree on the hobless-shower extent (1500 mm from rose vs 150 mm beyond screen).
  related_rules:
  - rule.ncc.wet-area-waterproofing
  - rule.as3740.falls-to-floor-waste
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 3740 — Waterproofing of Domestic Wet Areas'
  - seed: finishes-residential.md
    anchor: '### Regulatory requirement'
  - seed: residential-construction-guide.md
    anchor: '## Wet Area Construction and Waterproofing'
  - seed: multi-residential-apartments-guide.md
    anchor: '### Wet Area Waterproofing'
- id: rule.as3740.falls-to-floor-waste
  title: Wet-area floors fall to the floor waste
  instrument: AS 3740:2021; AS 3958.1
  clause: AS 3740; AS 3958.1 (seeds attribute the fall to both)
  clause_verified: false
  systems:
  - interiors.wet-area-waterproofing
  - interiors.tiling
  requires: Shower and wet-area floors are graded to fall to the floor waste with no flat or reverse falls,
    with the fall formed in the slab or a screed under the membrane.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state a fall or grade for a shower or wet-area floor
      to the floor waste?
    criteria:
      true: It states a fall ratio or percentage, or requires the floor to be graded to the floor waste.
      false: It does not mention the fall of the wet-area floor.
    runs_on:
    - interiors.wet-area-waterproofing
    - interiors.tiling
  numbers:
  - claim: Minimum fall 1:80 (1.25%) to floor waste (AS 3740 seed sections)
    verified: false
  - claim: Minimum tile fall 1:100 to floor waste (trade interfaces seed, citing AS 3958)
    verified: false
  notes: 'Seeds contradict: 1:80 vs 1:100.'
  related_rules:
  - rule.as3740.membrane-extent
  status: draft
  sources:
  - seed: trade-interfaces-coordination-guide.md
    anchor: '## Interface 5: Wet area floor waste and tile falls'
  - seed: as-standards-reference.md
    anchor: '## AS 3740 — Waterproofing of Domestic Wet Areas'
  - seed: multi-residential-apartments-guide.md
    anchor: '### Wet Area Waterproofing'
- id: rule.as3740.membrane-installation
  title: Wet-area membrane application, junctions and substrate
  instrument: AS 3740:2021
  clause: AS 3740 (substrate preparation seed-cited as Clause 4)
  clause_verified: false
  systems:
  - interiors.wet-area-waterproofing
  - interiors.walls-linings
  requires: Membranes are applied to a sound, cured, primed substrate; liquid membranes in multiple coats
    to the minimum dry film thickness; bond breakers or junction strips at internal corners and changes
    of plane; flashing collars or reinforcing at penetrations; and full cure before tiling.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify treatment of internal corners, junctions or
      penetrations in a wet-area membrane?
    criteria:
      true: It specifies bond-breaker tape, fabric reinforcing strips, junction strips, puddle flanges
        or flashing collars at corners, junctions or penetrations.
      false: It does not specify how corners, junctions or penetrations are treated.
    runs_on:
    - interiors.wet-area-waterproofing
  numbers:
  - claim: Liquid-applied membrane minimum 1.0 mm dry film thickness in multiple coats
    verified: false
  - claim: Sheet membranes minimum 0.2 mm polyethylene or 0.5 mm other
    verified: false
  - claim: Penetration collars or reinforcing extend 75 mm beyond the penetration
    verified: false
  - claim: Concrete and render substrates cured minimum 28 days (7 days for moisture-tolerant systems)
    verified: false
  - claim: Substrate cracks wider than 0.5 mm repaired
    verified: false
  - claim: Fibre cement substrate minimum 6 mm, fixed at 150 mm edge and 200 mm field centres
    verified: false
  - claim: Membrane cure before tiling typically 24-48 hours (finishes seed) or 24-72 hours (residential
      seed)
    verified: false
  - claim: Two-coat minimum for sheet membranes; flood-coat minimum for liquid-applied (finishes seed)
    verified: false
  notes: The finishes seed's "two-coat minimum for sheet membranes; flood-coat minimum for liquid" looks
    inverted against the AS 3740 seed section (liquid membranes need multiple coats).
  related_rules:
  - rule.as3740.membrane-extent
  - rule.as4858.wet-area-membrane-material
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 3740 — Waterproofing of Domestic Wet Areas'
  - seed: finishes-residential.md
    anchor: '### Application requirements'
  - seed: residential-construction-guide.md
    anchor: '## Wet Area Construction and Waterproofing'
- id: rule.as4858.wet-area-membrane-material
  title: Wet-area membrane material complies with AS 4858
  instrument: AS 4858 (Wet area membranes)
  clause: AS 4858
  clause_verified: false
  systems:
  - interiors.wet-area-waterproofing
  requires: Wet-area membrane products are tested and classified to AS 4858, and membrane, substrate and
    tile adhesive are compatible under the manufacturer's system specification.
  evidence:
    type: noul
    instructions: Using `text`, does this passage name the waterproofing membrane product or state its
      compliance with AS 4858?
    criteria:
      true: It names a membrane product or system, or states the membrane complies with AS 4858.
      false: It does not identify the membrane product or its material standard.
    runs_on:
    - interiors.wet-area-waterproofing
  notes: One seed calls AS 4858 an installation standard; the others call it a materials standard. The
    seed cites AS 4858-2004.
  related_rules:
  - rule.as3740.membrane-installation
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Wet Area Waterproofing (AS 3740)'
  - seed: multi-residential-apartments-guide.md
    anchor: '### Wet Area Waterproofing'
- id: rule.state.licensed-waterproofer
  title: Wet-area waterproofing by a licensed waterproofer
  instrument: State home building licensing legislation (NSW, QLD, VIC and most other jurisdictions)
  clause: State licensing legislation (not named in seeds)
  clause_verified: false
  systems:
  - interiors.wet-area-waterproofing
  applies_when:
    any:
    - det: state
      any_of:
      - NSW
      - QLD
      - VIC
  requires: Wet-area waterproofing is installed by a licensed waterproofer, who provides a statement or
    certificate of compliance for the installed membrane.
  evidence:
    type: noul
    instructions: Using `text`, does this passage require the waterproofing to be installed by a licensed
      waterproofer, or give the waterproofer's licence details?
    criteria:
      true: It requires a licensed waterproofer or states a waterproofer's licence number or licensed
        status.
      false: It does not mention the installer's licence.
    runs_on:
    - interiors.wet-area-waterproofing
  notes: State option ids assumed to be NSW, QLD, VIC; seeds say most other jurisdictions too.
  related_rules:
  - rule.ncc.wet-area-waterproofing
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Wet Area Waterproofing (AS 3740)'
- id: rule.state.waterproofing-inspection-before-tiling
  title: Wet-area waterproofing inspected before tiling
  instrument: EP&A Act 1979 and EP&A Regulation 2021 (NSW) mandatory inspection stages
  clause: Critical stage inspections (seed does not give the clause)
  clause_verified: false
  systems:
  - interiors.wet-area-waterproofing
  - interiors.tiling
  applies_when:
    all:
    - det: state
      any_of:
      - NSW
  requires: The wet-area membrane is inspected and accepted at a mandatory inspection stage before tiling
    or any covering is applied.
  evidence:
    type: noul
    instructions: Using `text`, does this passage require or record an inspection of the wet-area waterproofing
      before tiling?
    criteria:
      true: It requires, schedules or records a waterproofing inspection, certificate or statement of
        compliance before tiles are laid.
      false: It does not mention an inspection of the waterproofing before tiling.
    runs_on:
    - interiors.wet-area-waterproofing
    - interiors.tiling
  notes: 'Seeds disagree on who inspects: the finishes and trade-interfaces seeds say the certifier must
    inspect; the new-dwelling inspection table says "Certifier or installer" with the waterproofer''s
    statement of compliance as evidence. The residential seed calls it mandatory in all states.'
  related_rules:
  - rule.ncc.wet-area-waterproofing
  status: draft
  sources:
  - seed: finishes-residential.md
    anchor: '### Inspection gate'
  - seed: trade-interfaces-coordination-guide.md
    anchor: '## Interface 2: Wet area waterproofing to tiling'
  - seed: new-dwelling-guide.md
    anchor: '## Structural inspection gates — Class 1a new dwelling'
- id: rule.as4654.external-membrane-materials
  title: External above-ground membranes classified for use
  instrument: AS 4654.1:2012
  clause: AS 4654.1
  clause_verified: false
  systems:
  - envelope.external-waterproofing
  requires: Balcony, podium, roof terrace and planter membranes are materials classified for external
    use and trafficability (foot, light vehicle, heavy vehicle), with UV resistance and the required design
    life; an internal wet-area (AS 3740 only) membrane is not used externally.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify the membrane system for a balcony, podium, roof
      terrace, flat roof or planter box?
    criteria:
      true: It names the external membrane type or product (for example polyurethane, torch-on bitumen,
        TPO or PVC sheet) or cites AS 4654 for it.
