version: 1
rules:
- id: rule.ncc.lighting-power-density
  title: Maximum illumination power density for artificial lighting
  instrument: NCC 2022 Volume One
  clause: Part J4 (Artificial lighting and power) (seed numbering; seed labels NCC 2022 but NCC 2019 uses
    Part J6)
  clause_verified: false
  systems:
  - electrical.lighting
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  requires: Artificial lighting must not exceed the maximum illumination power density (W/m2) set for
    each space type or classification.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state an illumination power density (lighting watts
      per square metre) for a space, or a maximum illumination power density that the lighting design
      must meet?
    criteria:
      true: It states a lighting power density value or limit in W/m2, or states that the lighting was
        checked against the NCC Section J maximum illumination power density.
      false: It does not mention lighting power density, or only states illuminance in lux without any
        power density.
    runs_on:
    - electrical.lighting
  numbers: []
  related_rules:
  - rule.ncc.lighting-controls
  - rule.as1680.interior-lighting
  notes: 'Class 2 common areas are also subject to Section J per the apartments seed; the NCC guide lists
    Class 3-9 only. Table of limits needed: illumination_power_density (by space type), not a building-level
    determinant.'
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Section J DTS Provisions (J1-J6)'
  - seed: commercial-construction-guide.md
    anchor: '## Commercial Electrical Services'
- id: rule.ncc.lighting-controls
  title: Lighting controls for energy efficiency
  instrument: NCC 2022 Volume One
  clause: Part J4 (Artificial lighting and power) (seed numbering; seed labels NCC 2022 but NCC 2019 uses
    Part J6)
  clause_verified: false
  systems:
  - electrical.lighting
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  requires: Lighting controls (occupancy sensors, daylight dimming, time scheduling) are required in most
    spaces.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify automatic lighting controls such as occupancy
      or motion sensors, daylight dimming or time scheduling?
    criteria:
      true: It specifies occupancy or motion sensors, daylight-linked dimming, time clocks or schedules,
        or a lighting control system that switches or dims lights automatically.
      false: It does not mention lighting controls, or mentions only manual switches.
    runs_on:
    - electrical.lighting
  numbers: []
  related_rules:
  - rule.ncc.lighting-power-density
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Section J DTS Provisions (J1-J6)'
  - seed: electrical-services-guide.md
    anchor: '## Lighting and controls'
- id: rule.ncc.energy-monitoring
  title: Energy monitoring and sub-metering by end use
  instrument: NCC 2022 Volume One
  clause: Part J6 (Energy monitoring) (seed numbering; NCC 2019 uses Part J8)
  clause_verified: false
  systems:
  - electrical.metering
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  derives:
    table: energy_monitoring_facilities
    inputs:
    - ncc_class
    - floor_area
    gives: energy_monitoring_required
    pending: true
    reason: Primary instrument and full applicability inputs must be verified before this table can be
      implemented; return unknown.
  requires: Buildings above certain sizes must sub-meter energy consumption by end use (lighting, HVAC,
    plug loads) so operators can find energy waste.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify energy sub-meters that separately measure end
      uses such as lighting, air-conditioning, power or other major loads?
    criteria:
      true: It specifies sub-meters, a meter schedule or a metering hierarchy that separates energy use
        by end use, system or tenancy.
      false: It does not mention sub-metering, or mentions only the utility revenue meter.
    runs_on:
    - electrical.metering
    - mechanical
  numbers: []
  related_rules: []
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### NCC 2022 New Provisions (J5, J6, Renewable and EV Readiness)'
  - seed: non-residential-sustainability-energy-guide.md
    anchor: '## Metering, controls and operational performance'
- id: rule.ncc.ev-charging-readiness
  title: EV charging readiness for car parks
  instrument: NCC 2022 Volume One
  clause: Section J renewable energy and EV readiness provisions (seed gives no clause number)
  clause_verified: false
  systems:
  - electrical.ev-charging
  - electrical.switchboards
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
    - det: car_parking_provided
      is: true
  derives:
    table: ev_charging_readiness
    inputs:
    - ncc_class
    - car_parking_provided
    gives: ev_readiness_required
    pending: true
    reason: Primary instrument and full applicability inputs must be verified before this table can be
      implemented; return unknown.
  requires: Car parking must be provided with electrical capacity and conduit to parking areas to support
    future EV charging.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify electrical capacity, distribution boards, conduits
      or cable routes provided for current or future electric vehicle charging in the car park?
    criteria:
      true: It specifies EV chargers, EV-ready circuits or distribution boards, spare capacity reserved
        for EV charging, or conduit or cable routes to parking spaces for EV charging.
      false: It does not mention EV charging, or only says EV charging may be considered later without
        any provision.
    runs_on:
    - electrical.ev-charging
    - electrical.switchboards
  numbers: []
  related_rules:
  - rule.ncc.ev-readiness-class-1
  notes: The NCC guide scopes Section J to Class 3-9; apartments seed says Section J applies to Class
    2. Class 2 car parks may need adding once verified against NCC 2022.
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### NCC 2022 New Provisions (J5, J6, Renewable and EV Readiness)'
  - seed: commercial-construction-guide.md
    anchor: '## Carpark Design for Commercial Buildings'
- id: rule.ncc.solar-pv-readiness
  title: On-site renewable energy (solar PV) readiness
  instrument: NCC 2022 Volume One
  clause: Section J renewable energy and EV readiness provisions (seed gives no clause number)
  clause_verified: false
  systems:
  - electrical.solar-pv
  - structure
  - envelope
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
  requires: The building must include provisions (conduit and structural capacity) so solar PV can be
    installed later.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify provisions for future solar PV, such as roof
      area set aside, conduit from the roof to the switchboard, switchboard space or roof structural capacity
      for PV?
    criteria:
      true: 'It specifies a PV-ready provision: reserved roof area, conduit or cable route for PV, switchboard
        space for a future inverter, or roof structure designed for a future array.'
      false: It does not mention future PV provisions, or describes only a PV system installed now.
    runs_on:
    - electrical.solar-pv
    - structure
    - envelope
  numbers: []
  related_rules:
  - rule.as5033.pv-arrays
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### NCC 2022 New Provisions (J5, J6, Renewable and EV Readiness)'
- id: rule.ncc.ev-readiness-class-1
  title: EV readiness for new houses with a garage or carport
  instrument: NCC 2022 Volume Two
  clause: Section 13 (Energy efficiency — elemental provisions) (seed attribution; unverified)
  clause_verified: false
  systems:
  - electrical.ev-charging
  - electrical.switchboards
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - 1a
    - det: car_parking_provided
      is: true
    - det: existing_building
      is: false
  requires: A new Class 1 dwelling with a garage or carport must have an appropriately rated circuit and
    wiring infrastructure for future EV charging.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify an EV charging circuit, spare circuit-breaker
      position or conduit from the switchboard to the garage or carport?
    criteria:
      true: It specifies an EV charger, a dedicated EV circuit, a spare switchboard position for EV charging,
        or conduit or cable from the switchboard to the garage or carport for EV charging.
      false: It does not mention EV charging provisions for the dwelling.
    runs_on:
    - electrical.ev-charging
    - electrical.switchboards
    - electrical.cabling-wiring
  numbers:
  - claim: A conduit stub to the garage plus a spare 32 A circuit-breaker position is a low-cost EV provision
    verified: false
  related_rules:
  - rule.ncc.ev-charging-readiness
  notes: The NCC guide says 'Electric vehicle readiness provisions require new Class 1 dwellings with
    a garage or carport'; mep-residential calls EV provision a 'growing expectation', not a requirement.
    Verify whether the NCC 2022 provision is mandatory and in which states it is adopted.
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Elemental Provisions Pathway and EV Readiness'
  - seed: mep-residential.md
    anchor: '### EV charging provision'
- id: rule.ncc.whole-of-home-pv-offset
  title: Whole-of-home energy budget and on-site PV
  instrument: NCC 2022 Volume Two
  clause: Part 13.5 (Whole-of-home provisions) (seed numbering; unverified)
  clause_verified: false
  systems:
  - electrical.solar-pv
  - hydraulic
  - electrical.lighting
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - 1a
      - '2'
  requires: Class 1 dwellings and Class 2 sole-occupancy units must meet a whole-of-home energy budget
    covering fixed appliances, lighting and on-site renewable generation. PV can offset the budget but
    cannot take the envelope below 7 stars.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state a solar PV system size that is counted in a whole-of-home,
      NatHERS or BASIX energy assessment?
    criteria:
      true: It states a PV capacity (for example in kW) as an input to, or commitment in, a whole-of-home,
        NatHERS or BASIX energy assessment or certificate.
      false: It does not link a PV system to an energy assessment, or mentions PV without stating a size.
    runs_on:
    - electrical.solar-pv
  numbers:
  - claim: NatHERS component cannot be traded below 7 stars
    verified: false
  related_rules:
  - rule.basix.pv-commitment
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Whole-of-Home Energy Budget'
- id: rule.ncc.accessible-lift-required
  title: Accessible lift required to serve storeys of an accessible building
  instrument: NCC 2022 Volume One
  clause: Part E3.6 (seed numbering; NCC 2019)
  clause_verified: false
  systems:
  - vertical-transport.passenger-lifts
  - access-egress
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '2'
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
    - det: rise_in_storeys
      gte: 2
  derives:
    table: accessible_lift_requirement
    inputs:
    - ncc_class
    - rise_in_storeys
    - floor_area
    gives: accessible_lift_required
    pending: true
    reason: Primary instrument and full applicability inputs must be verified before this table can be
      implemented; return unknown.
  requires: Buildings required to be accessible with more than one storey must provide at least one accessible
    lift complying with AS 1735.12 unless an exemption applies.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state that a lift complying with AS 1735.12, or an accessible
      lift, is provided?
    criteria:
      true: It states that a lift is accessible, complies with AS 1735.12, or is provided for access for
        people with a disability.
      false: It does not mention an accessible lift, or mentions lifts without any accessibility statement.
    runs_on:
    - vertical-transport
    - access-egress
  numbers:
  - claim: 'Exemption: Class 5-8 buildings not exceeding three storeys with floor area not exceeding 200
      m2 per storey'
    verified: false
  related_rules:
  - rule.as1735.lift-accessibility
  notes: Seed wording is 'Class 2-9 buildings with an entrance accessible to the public and more than
    one storey'; the exemption wording is unverified.
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 1735 Series — Lifts, Escalators and Moving Walks'
  - seed: ncc-reference-guide.md
    anchor: '### Accessible Entrances and Paths of Travel'
- id: rule.ncc.stretcher-lift
  title: Stretcher-capable lift car
  instrument: NCC 2022 Volume One
  clause: Clause E3.3 (seed numbering; seed contradicts itself on trigger; unverified)
  clause_verified: false
  systems:
  - vertical-transport.passenger-lifts
  applies_when:
    all:
    - system_present: vertical-transport.passenger-lifts
  requires: Where required, at least one lift must accommodate a stretcher, which needs a car about 2000
    mm deep.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state that a lift car is sized to take a stretcher?
    criteria:
      true: It states that a lift is stretcher-capable, a stretcher lift, or has a car depth stated as
        suitable for a stretcher.
      false: It does not mention stretcher provision in any lift.
    runs_on:
    - vertical-transport.passenger-lifts
  numbers:
  - claim: Stretcher lift car depth 2000 mm
    verified: false
  related_rules:
  - rule.as1735.lifts-general
  notes: as-standards-reference says NCC E3.3 requires a stretcher lift for Class 2 and 3 buildings; commercial-construction-guide
    says stretcher lifts are required where Class 9a uses are present. In NCC 2019 the stretcher facility
    is E3.2 and E3.3 is the warning against lift use in fire, triggered by effective height (agent recollection,
    not seed). The verifier should set applies_when from the NCC 2022 text.
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS 1735 Series — Lifts, Escalators and Moving Walks'
  - seed: commercial-construction-guide.md
    anchor: '## Vertical Transport — Lifts and Escalators'
- id: rule.ncc.emergency-lifts
  title: Emergency (firefighter) lifts
  instrument: NCC 2022 Volume One
  clause: Not stated in seed (seed cites AS 1735.1.2; agent recollection NCC 2019 E3.4; unverified)
  clause_verified: false
  systems:
  - vertical-transport.lift-fire-service
  - electrical.standby-power
  applies_when:
    all:
    - system_present: vertical-transport.passenger-lifts
  requires: Buildings where the NCC requires it must have at least one emergency (firefighter) lift for
    fire brigade use, with the lift's controls, power and protection that role needs.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state that a lift is an emergency lift or firefighter
      lift?
    criteria:
      true: It designates a lift as an emergency lift, firefighter lift or fire service lift for brigade
        use.
      false: It does not designate any lift for firefighter use; fire recall of ordinary lifts alone is
        not enough.
    runs_on:
    - vertical-transport
  numbers: []
  related_rules:
  - rule.as1735.lifts-general
  notes: 'The seeds give no trigger. Agent recollection: NCC 2019 E3.4 requires emergency lifts where
    effective height exceeds 25 m (and some Class 9a and 9c cases). Verify and add an applies_when on
    effective_height.'
  status: draft
  sources:
  - seed: commercial-construction-guide.md
    anchor: '## Vertical Transport — Lifts and Escalators'
- id: rule.ncc.hearing-augmentation
  title: Hearing augmentation where there is an inbuilt amplification system
  instrument: NCC 2022 Volume One
  clause: Part D3.7 (seed numbering; NCC 2019); AS 1428.5
  clause_verified: false
  systems:
  - comms-security.audiovisual
  applies_when:
    all:
    - det: ncc_class
      any_of:
      - '2'
      - '3'
      - '5'
      - '6'
      - 7a
      - 7b
      - '8'
      - 9a
      - 9b
      - 9c
    - system_present: comms-security.audiovisual
  requires: Rooms or spaces with an inbuilt amplification system must have a hearing augmentation system
    complying with AS 1428.5.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify a hearing augmentation system (hearing loop,
      infrared or FM assistive listening)?
    criteria:
      true: It specifies a hearing loop, induction loop, infrared or FM assistive listening system, or
        hearing augmentation for a room.
      false: It does not mention hearing augmentation or assistive listening.
    runs_on:
    - comms-security.audiovisual
    - access-egress
  numbers: []
  related_rules: []
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Accessible Sanitary Facilities, Signage, and Hearing Augmentation'
- id: rule.as3000.wiring-rules
  title: Electrical installation to the Wiring Rules
  instrument: AS/NZS 3000:2018
  clause: AS/NZS 3000
  clause_verified: false
  systems:
  - electrical
  requires: Electrical installations from the point of supply to final subcircuits must be designed, constructed
    and verified to AS/NZS 3000, including protection against electric shock by insulation, earthing and
    bonding, automatic disconnection and RCD protection.
  evidence:
    type: noul
    instructions: Using `text`, does this passage require the electrical installation or electrical work
      to comply with AS/NZS 3000 (the Wiring Rules)?
    criteria:
      true: It names AS/NZS 3000 or the Wiring Rules as a requirement for the electrical design or installation.
      false: It does not name AS/NZS 3000 or the Wiring Rules.
    runs_on:
    - electrical
  numbers: []
  related_rules:
  - rule.as3017.verification
  - rule.as3008.cable-selection
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 3000 — Wiring Rules'
  - seed: mep-residential.md
    anchor: '### Key compliance'
- id: rule.as3000.rcd-protection
  title: RCD (safety switch) protection of circuits
  instrument: AS/NZS 3000:2018
  clause: Clause 2.6.3.2 (seed numbering)
  clause_verified: false
  systems:
  - electrical.cabling-wiring
  - electrical.switchboards
  requires: 30 mA RCD protection is required on socket-outlet circuits up to 20 A, on all lighting circuits
    in domestic installations, and on bathroom, laundry, outdoor and swimming pool circuits.
  evidence:
    type: noul
    instructions: Using `text`, does this passage specify RCD or safety switch protection for lighting
      circuits?
    criteria:
      true: It states that lighting circuits are protected by RCDs, safety switches or RCBOs, or that
        all final subcircuits including lighting are RCD protected.
      false: It does not mention RCD protection of lighting circuits, or mentions RCDs only on power circuits.
    runs_on:
    - electrical.cabling-wiring
    - electrical.switchboards
  numbers:
  - claim: RCDs are rated 30 mA
    verified: false
  - claim: RCD protection on all socket-outlet circuits up to 20 A
    verified: false
  - claim: RCD protection of domestic lighting circuits is new in the 2018 edition
    verified: false
  related_rules:
  - rule.as3000.wiring-rules
  notes: Evidence targets lighting circuits because that is the 2018 change most often missed. mep-residential
    says RCDs are required on all final subcircuits in Class 1a and calls them 'Type 2 RCDs'; the standards
    seed lists specific circuit types. Verify scope and RCD type.
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 3000 — Wiring Rules'
  - seed: mep-residential.md
    anchor: '### Safety switches (RCDs)'
  - seed: residential-construction-guide.md
    anchor: '## Residential Services — Hydraulic, Electrical, and Mechanical'
- id: rule.as3000.maximum-demand
  title: Maximum demand calculation
  instrument: AS/NZS 3000:2018
  clause: Appendix C (seed numbering)
  clause_verified: false
  systems:
  - electrical.utility-supply
  - electrical.switchboards
  requires: Maximum demand is calculated with diversity and demand factors by load category, and must
    include every connected load the supply serves (tenant fitout, mechanical plant, lifts, pumps, EV
    charging, common area services).
  evidence:
    type: noul
    instructions: Using `text`, does this passage state a maximum demand figure for the building's electrical
      supply?
    criteria:
      true: It states a maximum demand value (for example in kVA, kW or amps per phase) for the building,
        a switchboard or the supply application.
      false: It does not state a maximum demand value, or only says maximum demand is to be calculated.
    runs_on:
    - electrical.utility-supply
    - electrical.switchboards
  numbers: []
  related_rules:
  - rule.dnsp.connection-application
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 3000 — Wiring Rules'
  - seed: commercial-construction-guide.md
    anchor: '## Commercial Electrical Services'
  - seed: electrical-services-guide.md
    anchor: '### Conditions of consent and design development [design_development]'
- id: rule.as3000.voltage-drop
  title: Voltage drop limit
  instrument: AS/NZS 3000:2018
  clause: AS/NZS 3000 (voltage drop; seed gives no clause)
  clause_verified: false
  systems:
  - electrical.cabling-wiring
  requires: Voltage drop from the point of supply to the most remote point must not exceed the stated
    limit, including during motor starting.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state a voltage drop value or a voltage drop limit for
      submains or circuits?
    criteria:
      true: It states a voltage drop percentage or volts, or a voltage drop limit or allocation, for a
        cable, submain or circuit.
      false: It does not mention voltage drop.
    runs_on:
    - electrical.cabling-wiring
  numbers:
  - claim: Total voltage drop not to exceed 5% from point of supply to the most remote point
    verified: false
  - claim: Typical allocation 3% submains plus 2% final subcircuit
    verified: false
  - claim: A 32 A single-phase circuit on a 50 m run in 4 mm2 cable drops about 17.6 V (7.7% of 230 V)
    verified: false
  related_rules:
  - rule.as3008.cable-selection
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 3000 — Wiring Rules'
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 3008 Series — Electrical Installations — Selection of Cables'
- id: rule.as3000.switchboard-clearances
  title: Access clearances around switchboards
  instrument: AS/NZS 3000:2018
  clause: Clause 2.3 (seed numbering)
  clause_verified: false
  systems:
  - electrical.switchboards
  requires: Switchboards need minimum clearances around them for operation, maintenance, cable entry and
    escape.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state the access clearance or working space in front
      of or around a switchboard?
    criteria:
      true: It states a clearance, working space or egress path dimension for a switchboard or switchroom,
        or requires AS/NZS 3000 switchboard clearances.
      false: It does not mention switchboard clearances.
    runs_on:
    - electrical.switchboards
  numbers: []
  related_rules:
  - rule.as61439.switchboard-assemblies
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 61439 Series — Low-Voltage Switchgear and Controlgear Assemblies'
  - seed: electrical-services-guide.md
    anchor: '## Distribution, protection and access'
- id: rule.as3000.wet-area-zones
  title: Electrical equipment in bathroom zones
  instrument: AS/NZS 3000:2018
  clause: Section 6.2 (seed numbering)
  clause_verified: false
  systems:
  - electrical.cabling-wiring
  - interiors
  requires: Electrical equipment in bathroom zones 0 to 2 must have the IP rating required for its zone.
  evidence:
    type: noul
    instructions: Using `text`, does this passage state the IP rating of electrical equipment or luminaires
      located in a bathroom, shower or wet area?
    criteria:
      true: It states an IP rating (for example IPX4) for a luminaire, fan, outlet or other electrical
        equipment in a bathroom, shower or wet area, or refers to AS/NZS 3000 bathroom zones.
      false: It does not state IP ratings or zones for wet-area electrical equipment.
    runs_on:
    - electrical.cabling-wiring
    - electrical.lighting
    - interiors
  numbers:
  - claim: Minimum IPX4 in Zone 2
    verified: false
  related_rules: []
  status: draft
  sources:
  - seed: as-standards-reference.md
    anchor: '## AS/NZS 3000 — Wiring Rules'
- id: rule.as3000.pool-bonding
  title: Swimming pool and spa equipotential bonding
