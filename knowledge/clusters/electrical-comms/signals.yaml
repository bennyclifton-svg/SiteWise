- id: sig.lift-shaft-readiness-stated
  type: noul
  instructions: Using `text`, does the passage state that the lift shaft or core has been handed over
    ready for the lift installer?
  criteria:
    'true': It states the shaft or core is ready or handed over for lift installation.
    'false': It does not say so; a planned date or intention to hand over is not a handover.
  runs_on:
  - vertical-transport.lift-shafts-pits
  status: draft
  sources:
  - dataset: batch1
    row: B1-0560
  - seed: as-standards-reference.md
    anchor: '## AS 1735 Series — Lifts, Escalators and Moving Walks'
