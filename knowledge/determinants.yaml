- id: sprinklered
  label: Building protected by an automatic sprinkler system
  value: boolean
  extraction: choice
  question:
    type: choice
    instructions: Using `text`, does the passage explicitly state that the described building or part
      is protected throughout by sprinklers? A requirement, proposed option or future installation is
      not proof of existing protection; choose not_stated for those cases.
    criteria:
      stated_true: The passage explicitly affirms this condition for the identified building, part or
        site.
      stated_false: The passage explicitly denies this condition for the identified building, part or
        site.
      not_stated: No explicit conclusion is given, the condition is optional, or the passage contradicts
        itself.
    runs_on:
    - fire-active
    - fire-passive
  triggers:
  - 'sprinkler'
  stated_in:
  - {kind: report, discipline: consultant.bca, label: BCA or NCC compliance report}
  profile_group: fire
  status: draft
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Sprinkler Concessions for Type of Construction'
  notes: Extract actual stated protection separately from a requirement to install it. A design requirement
    does not establish existing sprinkler protection.
