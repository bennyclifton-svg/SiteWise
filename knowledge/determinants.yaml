version: 1
determinants:
- id: ncc_class
  label: NCC building classification(s)
  value: multi_choice
  extraction: choice
  options:
  - id: 1a
    describes: A single dwelling, or attached dwellings each separated by a fire-resisting wall (house,
      townhouse, terrace).
  - id: 1b
    describes: A small boarding house, guest house or hostel below the Class 3 size limits.
  - id: '2'
    describes: A building of two or more sole-occupancy units, each a separate dwelling (apartments).
  - id: '3'
    describes: Long-term or transient residential accommodation for unrelated people (hotel, motel, boarding
      house, dormitory, residential care not Class 9c).
  - id: '4'
    describes: A single dwelling within a building of Class 5 to 9.
  - id: '5'
    describes: An office building for professional or commercial purposes.
  - id: '6'
    describes: A shop or other building selling goods or services to the public, including cafes and restaurants.
  - id: 7a
    describes: A car park.
  - id: 7b
    describes: A storage building or warehouse, or a building for display of goods or produce for wholesale.
  - id: '8'
    describes: A laboratory or a building for production, assembly, repair or processing of goods (factory).
  - id: 9a
    describes: A health-care building.
  - id: 9b
    describes: An assembly building (school, theatre, sports venue, place of worship, early childhood
      centre).
  - id: 9c
    describes: A residential care building.
  - id: 10a
    describes: A non-habitable building such as a private garage, carport or shed.
  - id: 10b
    describes: A structure such as a fence, mast, antenna, retaining or free-standing wall, or swimming
      pool.
  - id: 10c
    describes: A private bushfire shelter.
  question:
    type: choice
    instructions: Using `text`, which NCC building classification does this passage state for the building
      or part of the building?
    criteria: {}
    runs_on:
    - fire-passive
    - access-egress
    - structure
  triggers:
  - '\bclass(ification)?\s*(1a|1b|7a|7b|9a|9b|9c|10a|10b|10c)\b'
  - '\b(bca|ncc|building)\s+class(ification)?\b'
  - '\bclass\s*[2-8]\s+(building|part|occupancy|portion|use)\b'
  stated_in:
  - {kind: report, discipline: consultant.bca, label: BCA or NCC compliance report}
  profile_group: classification
  status: draft
  notes: Extract explicit class labels only; descriptions are draft aids, not a legal classification algorithm.
    Keep building-part scope. Compile one option-presence question per option in one fan-out.
  sources:
  - seed: ncc-reference-guide.md
    anchor: '### Classification Definitions (Classes 1-10)'
