# The spaces a building provides after the works: the Accommodation
# schedule on the Profile (docs/plans/2026-11-11-accommodation-schedule-lines.md).
# One catalogue for every building type. Draft; owner review pending.
#
# Each space:
#   label    the space type, as the add menu and a capped line name it
#   line     one line's name; rooms are numbered when there are several
#            ("Office 1", "Office 2")
#   kind     room: one line each. setting: one line, its count in the
#            comment (workstations, WCs, showers, car spaces)
#   unit     the plural a comment uses ("42 workstations", "200 guest rooms")
#   pattern  finds the space's name in a passage (case-insensitive). Code
#            offers the counts, areas, capacities and levels beside it; Jev
#            only says whether the project provides the space and picks a
#            candidate or none. A space with no pattern is never read from
#            documents: it comes from a typical list or a card count.
#   count_from  the card's counts that give the number of lines (the first
#            stated wins). The card stays the count RFPs use; a difference
#            shows in words under the table.
#
# Apartments, townhouses and tenancies stay on the card (unit mix, tenancies):
# a dwelling is not a space here.
version: 2
status: draft
spaces:
  # Arrival
  - id: entry
    label: Entry
    line: Entry
    kind: room
    unit: entries
    # Not "entry suite": Meridian's "Level 3 entry suite with secure
    # reception" is its reception.
    pattern: \b(?:entry|entrance)\s+(?:halls?|foyers?|vestibules?)\b|\bvestibules?\b
  - id: lobby
    label: Lobby or foyer
    line: Lobby
    kind: room
    unit: lobbies
    pattern: \blobb(?:y|ies)\b|\bfoyers?\b
  - id: reception
    label: Reception and waiting
    line: Reception
    kind: room
    unit: reception areas
    pattern: \breception(?:\s+(?:areas?|desks?|counters?))?\b|\b(?:client\s+)?waiting(?:\s+(?:areas?|rooms?))?\b
  # Workplace
  - id: workstations
    label: Workstations
    line: Open-plan workspace
    kind: setting
    unit: workstations
    pattern: \b(?:work\s*stations?|desks?|work\s*points?|hot[- ]desks?)\b
    count_from: [hdr.scale.desks]
  - id: offices
    label: Enclosed offices
    line: Office
    kind: room
    unit: offices
    pattern: \b(?:enclosed|private|partners?'?|executive|directors?'?s?|managers?'?s?|individual|cellular)\s+offices?\b|\b\d+\s+offices\b
    count_from: [hdr.scale.private_offices]
  - id: meeting_rooms
    label: Meeting rooms
    line: Meeting room
    kind: room
    unit: meeting rooms
    pattern: \b(?:meeting|conference|interview|seminar)\s+(?:rooms?|suites?)\b|\bmeeting\s+(?:spaces?|pods?)\b
    count_from: [hdr.scale.meeting_rooms]
  - id: boardroom
    label: Boardroom
    line: Boardroom
    kind: room
    unit: boardrooms
    pattern: \bboard\s*rooms?\b
  - id: quiet_rooms
    label: Quiet rooms and booths
    line: Quiet room
    kind: room
    unit: quiet rooms
    pattern: \b(?:quiet|focus|phone|wellness|parents'?|mothers'?)\s+(?:rooms?|booths?|pods?)\b
  - id: library
    label: Library
    line: Library
    kind: room
    unit: libraries
    pattern: \blibrar(?:y|ies)\b
  - id: print_copy
    label: Print and copy
    line: Print and copy
    kind: room
    unit: print rooms
    pattern: \bprint(?:ing)?\s*(?:/|and|&)?\s*(?:copy(?:ing)?\s+)?(?:rooms?|areas?|bays?|hubs?|stations?)\b|\bcopy\s+rooms?\b
  - id: records_room
    label: Records or file room
    line: Records room
    kind: room
    unit: records rooms
    pattern: \brecords\b(?:\s+(?:rooms?|stores?|storage))?|\brecord\s+(?:rooms?|stores?)\b|\bfil(?:e|ing)\s+(?:rooms?|stores?)\b|\barchive\s+rooms?\b
  - id: breakout
    label: Breakout or staff room
    line: Breakout
    kind: room
    unit: breakout spaces
    pattern: \bbreak[- ]?out(?:\s+(?:areas?|spaces?|rooms?))?\b|\b(?:staff|lunch|tea)\s*rooms?\b
  - id: kitchen
    label: Kitchen
    line: Kitchen
    kind: room
    unit: kitchens
    pattern: \bkitchens?\b
  - id: kitchenette
    label: Kitchenette
    line: Kitchenette
    kind: room
    unit: kitchenettes
    pattern: \bkitchenettes?\b|\btea\s+points?\b
  - id: pantry
    label: Pantry
    line: Pantry
    kind: room
    unit: pantries
    pattern: \b(?:butler'?s'?\s+|walk[- ]in\s+)?pantr(?:y|ies)\b
  # Dwellings
  - id: living
    label: Living areas
    line: Living
    kind: room
    unit: living areas
    pattern: \bliving(?:\s+(?:rooms?|areas?|spaces?))?\b|\b(?:lounge|family|media)\s+rooms?\b|\brumpus(?:\s+rooms?)?\b
  - id: dining
    label: Dining
    line: Dining
    kind: room
    unit: dining areas
