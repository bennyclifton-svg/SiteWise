  - id: laboratories
    label: Laboratories
    line: Laboratory
    kind: room
    unit: laboratories
    pattern: \blaborator(?:y|ies)\b|\bscience\s+labs?\b
    count_from: [hdr.scale.labs]
  - id: hall
    label: Hall or gymnasium
    line: Hall
    kind: room
    unit: halls
    pattern: \b(?:multi-?purpose|assembly|school|community|sports?)\s+halls?\b|\bgymnasium\b
    count_from: [hdr.scale.halls_gyms]
  - id: playrooms
    label: Playrooms
    line: Playroom
    kind: room
    unit: playrooms
    pattern: \bplay\s*rooms?\b|\b(?:children'?s'?\s+)?activity\s+rooms?\b|\b(?:babies|baby|toddlers?|preschool|nursery)\s+rooms?\b
  - id: sleep_room
    label: Sleep rooms
    line: Sleep room
    kind: room
    unit: sleep rooms
    pattern: \b(?:sleep|cot|rest)\s*rooms?\b
  - id: nappy_change
    label: Nappy change
    line: Nappy change
    kind: room
    unit: nappy change areas
    pattern: \bnappy[- ]chang(?:e|ing)\b
  - id: bottle_prep
    label: Bottle preparation
    line: Bottle preparation
    kind: room
    unit: bottle preparation areas
    pattern: \bbottle[- ]prep(?:aration)?\b
  - id: sick_bay
    label: Sick bay or first aid
    line: Sick bay
    kind: room
    unit: sick bays
    pattern: \bsick\s*bays?\b|\bfirst[- ]aid\s+rooms?\b
  - id: canteen
    label: Canteen
    line: Canteen
    kind: room
    unit: canteens
    pattern: \bcanteens?\b|\btuck\s*shops?\b
  - id: cola
    label: Covered outdoor learning area
    line: COLA
    kind: room
    unit: COLAs
    pattern: \bCOLAs?\b|\bcovered\s+outdoor\s+(?:learning\s+)?areas?\b
  - id: outdoor_play
    label: Outdoor play space
    line: Outdoor play
    kind: room
    unit: outdoor play spaces
    pattern: \boutdoor\s+play(?:\s*(?:areas?|spaces?|grounds?))?\b|\bplaygrounds?\b
  # Health
