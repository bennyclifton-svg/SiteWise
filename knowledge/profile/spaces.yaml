    pattern: \bemergency\s+(?:departments?|units?)\b
  - id: operating_suite
    label: Operating theatres
    line: Operating theatre
    kind: room
    unit: operating theatres
    pattern: \boperating\s+(?:theatres?|suites?|rooms?)\b|\bday\s+surgery\s+(?:units?|suites?)\b
