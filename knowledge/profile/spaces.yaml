    pattern: \balfresco\b|\bdecks?\b|\bbalcon(?:y|ies)\b|\bterraces?\b
  # Shared residential
  - id: guest_rooms
    label: Guest rooms
    line: Guest room
    kind: room
    unit: guest rooms
    count_from: [hdr.scale.rooms, hdr.scale.hotel_rooms]
  - id: student_rooms
    label: Student rooms
    line: Student room
    kind: room
    unit: student rooms
    count_from: [hdr.scale.beds]
  - id: resident_rooms
    label: Resident rooms
    line: Resident room
    kind: room
    unit: resident rooms
    count_from: [hdr.scale.beds, hdr.scale.aged_care_beds]
  - id: communal_room
    label: Communal rooms
    line: Communal room
    kind: room
    unit: communal rooms
    pattern: \bcommunal\s+(?:rooms?|lounges?|dining|kitchens?|spaces?)\b|\bresidents'?\s+(?:lounges?|rooms?)\b|\bcommon\s+rooms?\b
  - id: communal_open_space
    label: Communal open space
    line: Communal open space
    kind: room
    unit: communal open spaces
    pattern: \bcommunal\s+open\s+spaces?\b|\bcommunal\s+(?:gardens?|terraces?|courtyards?)\b|\brooftop\s+(?:gardens?|terraces?)\b
  - id: mail_room
    label: Mail and parcel room
    line: Mail room
    kind: room
    unit: mail rooms
    pattern: \bmail\s*rooms?\b|\bparcel\s+(?:rooms?|lockers?)\b
  - id: gym
    label: Gym
    line: Gym
    kind: room
    unit: gyms
    pattern: \bgyms?\b|\bfitness\s+(?:rooms?|centres?|studios?)\b
  - id: nurse_station
    label: Nurse stations
    line: Nurse station
    kind: room
    unit: nurse stations
    pattern: \bnurses?'?\s+stations?\b|\bstaff\s+bases?\b
  # Education
  - id: classrooms
    label: Classrooms and teaching spaces
    line: Classroom
    kind: room
    unit: classrooms
    pattern: \bclassrooms?\b|\b(?:learning|teaching)\s+(?:spaces?|areas?|rooms?)\b
    count_from: [hdr.scale.classrooms]
  - id: lecture_theatre
    label: Lecture theatres
    line: Lecture theatre
    kind: room
    unit: lecture theatres
    pattern: \blecture\s+(?:theatres?|halls?|rooms?)\b|\bauditori(?:um|ums|a)\b
