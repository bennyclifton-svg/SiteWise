  - id: bedroom
    label: Bedrooms
    line: Bedroom
    kind: room
    unit: bedrooms
    count_from: [hdr.scale.bedrooms]
  - id: bathroom
    label: Bathrooms
    line: Bathroom
    kind: room
    unit: bathrooms
    count_from: [hdr.scale.bathrooms]
  - id: study
    label: Study
    line: Study
    kind: room
    unit: studies
    pattern: \bstudy(?:\s+(?:rooms?|nook))?\b|\bhome\s+office\b
  - id: laundry
    label: Laundry
    line: Laundry
    kind: room
    unit: laundries
