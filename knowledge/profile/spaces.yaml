    unit: imaging suites
    pattern: \bmedical\s+imaging\b|\bradiology\b|\bimaging\s+(?:suites?|rooms?|departments?)\b|\bx-?ray\s+rooms?\b
    count_from: [hdr.scale.imaging_suites]
  - id: outpatients
    label: Outpatients
    line: Outpatients
    kind: room
    unit: outpatient clinics
    pattern: \boutpatients?(?:\s+(?:clinics?|departments?|units?))?\b
  - id: pharmacy
    label: Pharmacy
    line: Pharmacy
    kind: room
    unit: pharmacies
    pattern: \bpharmac(?:y|ies)\b|\bdispensar(?:y|ies)\b
  - id: utility_rooms
    label: Clean and dirty utility
    line: Utility room
    kind: room
    unit: utility rooms
    pattern: \b(?:clean|dirty)\s+utility(?:\s+rooms?)?\b|\bsluice\s+rooms?\b
  - id: sterilisation
    label: Sterilisation room
    line: Sterilisation room
    kind: room
    unit: sterilisation rooms
    pattern: \bsteril(?:is|iz)(?:ation|ing)\s+(?:rooms?|bays?|areas?|departments?)\b|\breprocessing\s+rooms?\b
  # Hospitality, retail and assembly
  - id: sales_floor
    label: Sales floor
    line: Sales floor
    kind: room
    unit: sales floors
    pattern: \b(?:sales|retail|shop|trading)\s+(?:floor|areas?)\b
  - id: restaurant
    label: Restaurant or cafe
    line: Restaurant
    kind: room
    unit: restaurants
    pattern: \brestaurants?\b|\bbistros?\b|\bcaf[eé]s?\b
  - id: bar
    label: Bar
    line: Bar
    kind: room
    unit: bars
    pattern: \b(?:cocktail|lobby|wine|public|sports)\s+bars?\b|\bbar\s+(?:areas?|counters?|lounges?)\b
  - id: function_room
    label: Function rooms
    line: Function room
    kind: room
    unit: function rooms
    pattern: \bfunction\s+(?:rooms?|spaces?|halls?|centres?)\b|\bballrooms?\b
  - id: worship_space
    label: Worship space
    line: Worship space
    kind: room
    unit: worship spaces
    pattern: \b(?:worship|prayer)\s+(?:halls?|spaces?|rooms?)\b|\bsanctuary\b|\bnave\b|\bchapels?\b
  - id: cool_room
    label: Cool rooms
    line: Cool room
    kind: room
    unit: cool rooms
    pattern: \b(?:cool|cold|freezer)\s*rooms?\b|\bwalk[- ]in\s+(?:coolers?|freezers?|fridges?)\b
  # Industrial and technical
  - id: warehouse_floor
    label: Warehouse floor
    line: Warehouse
    kind: room
    unit: warehouse areas
    pattern: \bwarehouse\s+(?:floor|areas?|space|component)\b
  - id: production_floor
    label: Production floor
    line: Production area
    kind: room
    unit: production areas
    pattern: \b(?:production|manufacturing|factory|processing)\s+(?:floor|areas?|halls?|space)\b
  - id: data_hall
    label: Data halls
    line: Data hall
    kind: room
    unit: data halls
    pattern: \bdata\s+halls?\b|\bwhite\s+space\b
  - id: electrical_room
    label: Electrical rooms
    line: Electrical room
    kind: room
    unit: electrical rooms
    pattern: \b(?:electrical|UPS|battery)\s+rooms?\b|\bswitch\s*rooms?\b|\bsubstations?\b
  - id: security_room
    label: Security room
    line: Security room
    kind: room
    unit: security rooms
    pattern: \bsecurity\s+(?:rooms?|offices?)\b|\bcontrol\s+rooms?\b|\bgatehouses?\b
  - id: loading_dock
    label: Loading dock
    line: Loading dock
    kind: room
    unit: loading docks
    pattern: \bloading\s+(?:docks?|bays?|areas?|zones?)\b
  - id: hardstand
    label: Hardstand
    line: Hardstand
    kind: room
    unit: hardstands
    pattern: \bhardstands?\b
  # Amenities
  - id: toilets
    label: Toilets
    line: Toilets
    kind: setting
    unit: WCs
    pattern: \btoilets?\b|\bWCs?\b|\bwater\s+closets?\b|\bamenities\b
  - id: accessible_toilets
    label: Accessible toilets
    line: Accessible WC
    kind: room
    unit: accessible WCs
    pattern: \b(?:accessible|disabled|ambulant)\s+(?:WCs?|toilets?|amenities|bathrooms?)\b
  - id: showers
    label: Showers
    line: Showers
    kind: setting
    unit: showers
    pattern: \bshowers?\b
  - id: change_rooms
    label: Change rooms
    line: Change room
    kind: room
    unit: change rooms
    pattern: \b(?:change|changing|locker)\s*rooms?\b
  - id: end_of_trip
    label: End-of-trip facilities
    line: End-of-trip facility
    kind: room
    unit: end-of-trip facilities
    pattern: \bend[- ]of[- ]trip\b|\bbicycle\s+parking\b|\bbike\s+(?:parking|storage|racks?)\b
  # Back of house
  - id: storage
    label: Store rooms
    line: Store room
    kind: room
    unit: store rooms
    pattern: \bstore\s*rooms?\b|\bstorage\s+(?:rooms?|areas?|cages?)\b
  - id: comms_room
    label: Comms or server room
    line: Comms room
    kind: room
    unit: comms rooms
    pattern: \b(?:comms|communications?|server|MDF|IDF)\s+(?:rooms?|cupboards?)\b|\bcomms\b
  - id: plant_room
    label: Plant rooms
    line: Plant room
    kind: room
    unit: plant rooms
    pattern: \bplant\s*(?:rooms?|areas?|decks?)\b
  - id: waste_room
    label: Waste or bin room
    line: Waste room
    kind: room
    unit: waste rooms
    pattern: \b(?:waste|bin|garbage|refuse)\s+(?:rooms?|stores?|storage|areas?|enclosures?)\b
  - id: cleaners
    label: Cleaner's room
    line: Cleaner's room
    kind: room
    unit: cleaner's rooms
    pattern: \bcleaner'?s'?\s+(?:rooms?|cupboards?|stores?)\b

# Requirement phrases a line's comment may carry. Code finds the words on a
# space's clause; Jev says whether the passage requires them of that space.
requirements:
  - id: av_ready
    label: AV-ready
    pattern: (?-i:\bAV\b)|\baudio[- ]?visual\b|\bvideo[- ]?conferenc(?:e|ing)\b
  - id: acoustic
    label: acoustic separation
    pattern: \bacoustic(?:ally)?\s+(?:separat|rat|treat|privacy|isolat|seal)\w*|\bsound[- ]?proof\w*|\bspeech\s+privacy\b
  - id: secure
    label: secure
    pattern: \bsecure(?:d)?\b|\b(?:swipe|access)[- ]control(?:led)?\b|\blockable\b
  - id: natural_light
    label: natural light
    pattern: \bnatural\s+(?:light|daylight)\b|\bdaylit\b|\bdaylighting\b
  - id: sink
    label: sink
    pattern: \bsinks?\b|\bwater\s+points?\b|\bhand\s*basins?\b
  - id: operable_wall
    label: operable wall
    pattern: \boperable\s+(?:walls?|partitions?)\b|\bfolding\s+(?:walls?|partitions?)\b
  - id: dedicated_cooling
    label: dedicated cooling
    pattern: \bdedicated\s+(?:cooling|air[- ]?con\w*|HVAC)\b|\b24/7\s+(?:cooling|air[- ]?con\w*)\b|\bsupplementary\s+cooling\b
  - id: compactus
    label: compactus shelving
    pattern: \bcompactus\b|\bmobile\s+shelving\b
  - id: fire_rated
    label: fire-rated
    pattern: \bfire[- ]rated\b|\bfire[- ]isolated\b
  - id: glazed
    label: glazed front
    pattern: \bglazed\s+(?:fronts?|walls?|partitions?|screens?)\b|\bfull[- ]height\s+glaz\w*

# Typical spaces per building type: the schedule's placeholders, names only.
# `subclasses` are the card's building types; `classes` are the fallback when
# the type is unknown or Other. `new_build` is added for new buildings: a
# fit-out, refurbishment or extension gets the tenancy spaces only. An entry
# is a space id, or {space, line} to name its line for this building type.
# basis: guide (a published guide lists these spaces) or practice.
schedules:
  - id: workplace
    subclasses: [office, serviced_office_coworking, government_civic]
    classes: [commercial]
    basis: practice
    spaces: [reception, workstations, offices, meeting_rooms, boardroom, quiet_rooms, print_copy, breakout, kitchenette, storage, comms_room]
    new_build: [lobby, toilets, accessible_toilets, showers, end_of_trip, plant_room, waste_room, cleaners, loading_dock]
  - id: house
    subclasses: [house]
    classes: [residential]
    basis: practice
    spaces: [entry, living, dining, kitchen, pantry, bedroom, bathroom, study, laundry, garage, outdoor_living]
  - id: apartment_common
    subclasses: [apartments, btr, social_affordable_housing, residential_retail, residential_commercial, hotel_residential, btr_retail, townhouses]
    basis: guide
    source: NSW Apartment Design Guide, Part 4 (common circulation, communal open space, storage, waste, bicycle parking); dwellings are the card's unit mix
    spaces: [lobby, mail_room, communal_room, communal_open_space, gym, storage, end_of_trip, waste_room, plant_room, comms_room]
  - id: student_housing
    subclasses: [student_housing]
    basis: practice
    spaces: [reception, student_rooms, communal_room, kitchen, {space: classrooms, line: Study room}, laundry, gym, end_of_trip, waste_room, plant_room]
  - id: aged_care
    subclasses: [residential_aged_care, retirement_living, vertical_village]
    basis: guide
    source: National Aged Care Design Principles and Guidelines (households with private bedrooms and bathrooms, a kitchen beside the dining area, living and outdoor space), https://www.health.gov.au/sites/default/files/2025-03/national_aged_care_design_principles_and_guidelines_summary.pdf
    spaces: [reception, resident_rooms, living, dining, kitchen, {space: communal_room, line: Activity room}, nurse_station, utility_rooms, laundry, {space: breakout, line: Staff room}, offices, accessible_toilets, storage, {space: outdoor_living, line: Garden}]
  - id: retail
    subclasses: [retail_shopping_centre, retail_standalone, retail_office, residential_retail, btr_retail]
    basis: practice
    spaces: [sales_floor, storage, {space: breakout, line: Staff room}, offices, toilets, loading_dock, waste_room]
  - id: food_beverage
    subclasses: [food_beverage]
    basis: practice
    spaces: [dining, bar, kitchen, cool_room, storage, toilets, accessible_toilets, {space: breakout, line: Staff room}, waste_room]
  - id: hotel
    subclasses: [hotel, hotel_residential]
    basis: practice
    spaces: [lobby, reception, guest_rooms, restaurant, bar, kitchen, function_room, meeting_rooms, gym, laundry, {space: breakout, line: Staff room}, storage, loading_dock, plant_room, waste_room]
  - id: industrial
    subclasses: [warehouse, logistics_ecommerce, cold_storage, dangerous_goods]
    classes: [industrial]
    basis: practice
    spaces: [warehouse_floor, {space: offices, line: Office}, {space: breakout, line: Lunch room}, toilets, accessible_toilets, loading_dock, hardstand]
    new_build: [plant_room, waste_room]
  - id: manufacturing
    subclasses: [manufacturing, heavy_manufacturing, food_processing, pharmaceutical_gmp, cleanroom, battery_manufacturing, waste_to_energy]
    basis: practice
    spaces: [production_floor, storage, {space: offices, line: Office}, {space: breakout, line: Lunch room}, change_rooms, toilets, loading_dock]
    new_build: [plant_room, electrical_room, waste_room]
  - id: data_centre
    subclasses: [data_centre]
    basis: practice
    spaces: [data_hall, electrical_room, plant_room, security_room, {space: offices, line: Office}, loading_dock, storage, toilets]
  - id: early_learning
    subclasses: [education_early_childhood]
    basis: guide
    source: Education and Care Services National Regulations, regs 106 to 115 by heading (laundry and hygiene, toilets, administrative space, nappy change); Education Standards Board (SA) "Creating safe facilities", https://www.esb.sa.gov.au/creating-safe-facilities-guide-building-and-renovating-education-and-care-services
    spaces: [entry, reception, playrooms, sleep_room, nappy_change, bottle_prep, toilets, kitchen, laundry, {space: offices, line: Office}, {space: breakout, line: Staff room}, storage, outdoor_play]
  - id: school
    subclasses: [education_primary_secondary]
    classes: [institution]
    basis: guide
    source: NSW Educational Facilities Standards and Guidelines, primary accommodation summary, https://efsg.det.nsw.edu.au/primary/acc.html
    spaces: [classrooms, library, hall, cola, {space: offices, line: Office}, {space: breakout, line: Staff room}, sick_bay, canteen, toilets, accessible_toilets, storage, comms_room, outdoor_play]
  - id: tertiary
    subclasses: [education_tertiary]
    basis: practice
