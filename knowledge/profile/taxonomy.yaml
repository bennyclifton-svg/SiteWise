# taxonomy.yaml: see knowledge/SCHEMA.md 'Project profile additions'. Draft; owner review pending.
version: 1
status: draft
sources:
- clerk_file: data/taxonomy/building-classes.json
- clerk_file: data/taxonomy/complexity-dimensions.json
notes: Transcribed from Clerk data. Cost-uplift text removed from labels. Bushfire, flood, heritage, contamination
  and water source are left to determinants.
work_types:
- id: new
  label: New build
- id: refurb
  label: Refurbishment
- id: extend
  label: Extension / addition
- id: remediation
  label: Remediation / rectification
- id: advisory
  label: Advisory services
building_classes:
- id: residential
  label: Residential
  work_types:
  - new
  - refurb
  - extend
  - remediation
  - advisory
  subclasses:
  - id: house
    label: House (Class 1a)
    ncc_class: 1a
    scale_fields:
    - key: site_sqm
      label: Site sqm
      type: number
      unit: m2
      basis_required: true
      triggers: &id001
      - site area
      - \blot size\b
      typical: 200-2000 sqm
    - key: gfa_sqm
      label: GFA sqm
      type: number
      unit: m2
      basis_required: true
      triggers: &id003
      - \bgfa\b
      - gross floor area
      typical: 50-800 sqm
    - key: storeys
      label: Storeys
      type: integer
      triggers: &id002
      - \b(\d+|single|double|two|three|four|five)[ -]?stor(e)?y
      - \bstoreys?\b
      typical: 1-3
    - key: bedrooms
      label: Bedrooms
      type: integer
      triggers:
      - \bbed(room)?s?\b
      typical: 2-6
    - key: garage_spaces
      label: Garage spaces
      type: integer
      triggers:
      - \bgarage\b
      - \bcar spaces?\b
  - id: apartments
    label: Apartments (Class 2)
    ncc_class: '2'
    scale_fields:
    - key: site_sqm
      label: Site sqm
      type: number
      unit: m2
      basis_required: true
      triggers: *id001
    - key: storeys
      label: Storeys
      type: integer
      triggers: *id002
      typical: Low-rise 1-3, mid-rise 4-12, high-rise 13-40, super-tall 40+
    - key: gfa_sqm
      label: GFA sqm
      type: number
      unit: m2
      basis_required: true
      triggers: *id003
    - key: units
      label: Units
      type: integer
      triggers: &id004
      - \b\d+\s+(units|apartments|dwellings)\b
      - apartment mix
    - key: avg_unit_size_sqm
      label: Average unit size sqm
      type: number
      unit: m2
      typical: 50-150 sqm/unit
  - id: townhouses
    label: Townhouses (Class 1a)
