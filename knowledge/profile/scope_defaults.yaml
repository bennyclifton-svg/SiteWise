# Words a document uses for the works that imply systems, as suggestions
# (Walsh review, 2026-10-27). A matched passage of a read document suggests
# each system with the passage's words in the note; it is never evidence,
# and the user's out is final. Draft; owner review pending.
implied_by:
- id: wet-room
  label: bathroom, ensuite, laundry, shower or toilet
  # Showers and WCs added for fit-outs ("shower on Level 4", "1 × accessible
  # WC"), Meridian 2026-11-11.
  pattern: \b(?:bath(?:room)?s?|ensuites?|laundr(?:y|ies)|powder rooms?|showers?|toilets?|WCs?)\b
  systems:
  - interiors.wet-area-waterproofing
  - interiors.tiling
  - hydraulic.sanitary
  - hydraulic.cold-water
  - hydraulic.hot-water
  - mechanical.local-exhaust
- id: kitchen
  label: kitchen or kitchenette
  pattern: \bkitchen(?:s|ettes?)?\b
  systems:
  - interiors.joinery
  - hydraulic.sanitary
  - hydraulic.cold-water
  - hydraulic.hot-water
  - mechanical.local-exhaust
- id: robe
  label: robe or wardrobe
  pattern: \b(?:walk-in robes?|wardrobes?|built-in robes?)\b
  systems:
  - interiors.joinery
- id: bedroom
  label: new rooms
  pattern: \b(?:bedrooms?|study|studies)\b
  systems:
  - interiors.internal-doors
- id: stair
  label: stair
  pattern: \b(?:internal )?stair(?:s|case|cases)?\b
  systems:
  - access-egress.stairs-and-ramps
- id: party-wall
  label: party wall
  pattern: \b(?:party|separating|common) walls?\b
  systems:
  - site.adjoining-structures
  - fire-passive.compartments
  - interiors.acoustic-separation
- id: strip-out
  label: strip-out or demolition
  pattern: \bstrip[- ]?out\b|\bdemoli(?:tion|sh)\b
  systems:
  - site.demolition
- id: masonry
  label: masonry work
  pattern: \bmasonry\b|\bre-?point(?:ing)?\b|\bbrickwork\b
  systems:
  - structure.masonry
- id: energy-rating
  label: BASIX or NatHERS
  pattern: \bBASIX\b|\bNatHERS\b
  systems:
  - envelope.thermal-performance
# A fit-out names its trades as words, not systems: "Partitions, ceilings,
# finishes, joinery, lighting, tenant switchboard extension, data cabling,
# AV, security access control, kitchen fit-out, signage" (Meridian tenant
# brief, 2026-11-11). On a refurbishment an included system the documents
# also call existing does not reach scope without an action, so these
# words suggest it. Suggestions only; the user's out is final.
- id: mezzanine
  label: mezzanine
  pattern: \bmezzanines?\b
  systems:
  - structure.alterations
  - fire-passive.compartments
  - access-egress.stairs-and-ramps
- id: partitions
  label: partitions
  pattern: \bpartition(?:s|ing)?\b
  systems:
  - interiors.walls-linings
- id: acoustic-partitions
  label: acoustic partitions or separation
  pattern: \bacoustic\s+(?:partitions?|separation|walls?|treatment)\b
  systems:
  - interiors.acoustic-separation
- id: ceilings
  label: ceilings
  pattern: \bceilings\b|\bsuspended\s+ceilings?\b|\bceiling\s+(?:tiles?|grid|linings?)\b
  systems:
  - interiors.ceilings
- id: finishes
  label: finishes, carpet or flooring
  pattern: \bfinishes\b|\bfloor\s+(?:finish(?:es)?|coverings?)\b|\bcarpet(?:s|ing)?\b|\bvinyl\s+flooring\b
  systems:
  - interiors.floor-finishes
  - interiors.painting
- id: lighting
  label: lighting
  pattern: \blighting\b|\blight\s+fittings?\b|\bluminaires?\b
  systems:
  - electrical.lighting
- id: switchboard
  label: switchboard or supply upgrade
  pattern: \b(?:switch|sub-?)boards?\b|\bkVA\b
  systems:
  - electrical.switchboards
- id: final-circuits
  label: power circuits
  pattern: \bfinal\s+circuits?\b|\bpower\s+(?:outlets?|points?|circuits?)\b|\bGPOs?\b
  systems:
  - electrical.cabling-wiring
- id: signage
  label: signage
  pattern: \bsignage\b
  systems:
  - site.signage
- id: smoke-control
  label: smoke control
  pattern: \bsmoke\s+(?:control|exhaust|management)\b
  systems:
  - fire-active.smoke-control
- id: sprinklers
  label: sprinklers
  pattern: \bsprinklers?\b
  systems:
  - fire-active.sprinklers
- id: penetrations
  label: slab penetrations or core drilling
  pattern: \b(?:slab|floor)\s+penetrations?\b|\bcore[- ]drill(?:ing|ed)?\b
  systems:
  - fire-passive.penetrations
- id: data-cabling
  label: data cabling
  pattern: \b(?:data|structured)\s+cabling\b
  systems:
  - comms-security.structured-cabling
