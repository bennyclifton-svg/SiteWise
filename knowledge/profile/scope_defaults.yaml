notes: Scope defaults for the project profile (docs/design/2026-10-03-profile-scope.md). New build and extension start from
  the building class list for that work type, else the class new-build list, else the building category list. Refurbishment
  / fit-out / upgrade, remediation and advisory start empty; the picker offers presets. Defaults are suggestions, never evidence.
  Category lists and the fit-out preset are drafted from the class lists; owner review pending.
