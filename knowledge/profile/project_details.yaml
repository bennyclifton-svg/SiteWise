# Facts about the project that the user can state once; every consultant RFP
# reads them from Profile. Shape: knowledge/SCHEMA.md "Project details".
# A detail with `extraction: pre_parsed` is also read from the documents the
# profile reads: code finds candidate values (internal/profile/details.go),
# Jev picks one or none, and the user's own word always wins. A detail
# without `extraction` is never asked of Jev. Labels follow
# knowledge/rfp/skeleton.yaml so Profile and the RFP use the same words.
# RFP flags with no determinant are stored as proj.flag.<flag key>; those
# read from documents are listed in flag_readings.yaml.
version: 1
status: draft
details:
  - key: client
    label: Client
    value: text
    scope: project
    extraction: pre_parsed
    triggers:
      - '\b(?:principal|client|owner|proponent|applicant|developer|landowner)\b(?:\s*\([^)]{0,40}\))?\s*[:–]'
      - 'prepared for\s'
      - 'commissioned by\s'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as this project's client:
      the principal, owner or proponent the works are for? Select none when absent, or when the candidate is
      a contractor, consultant, authority, neighbour or tenant.
  - key: lga
    label: Local government area
    value: text
    scope: site
    extraction: pre_parsed
    triggers:
      - 'local government area'
      - '\blga\b'
      - '\bcouncil\b'
      - '\b(?:city|shire|municipality|town|borough) of\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the local government area
      (council area) this project's site is in? Select none when absent, or when the candidate is a council
      named for a neighbouring area or a different site. The council identified for this project's DA or local planning controls establishes its council area.
  - key: zone
    label: Zone
    value: text
    scope: site
    extraction: pre_parsed
    triggers:
      - '\bzon(?:e|ed|ing)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the planning zone of this
      project's site? Select none when absent, or when the candidate is an adjoining zone, a noise or
      fire zone, or a zone of a different site.
  - key: program
    label: Program milestones
    value: text
    scope: project
    help: "Dated targets from a filed programme. Aspirations remain targets, not commitments."
    extraction: pre_parsed
    triggers: ['\btarget\b', '\baspiration\b', '\bplanned\b']
    asks: >-
      Using `text` and `candidates`, which paragraph states this project's dated approval,
      construction or occupation targets? Keep the whole candidate, including qualifications
      such as aspiration or subject to approval. Select none for consultant fee or service deadlines,
      report issue dates, past completion records, or dates for another project.
  - key: sustainability
    label: Sustainability target
    value: text
    scope: project
    extraction: pre_parsed
    triggers:
      - 'green star'
      - 'nabers'
      - 'nathers'
      - 'passive ?haus|passive ?house'
      - '\bleed\b'
      - 'net[- ]zero'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the sustainability target or
      rating this project must achieve? Select none when absent, when it only names a tool or standard
      without a target, or when it describes a different project.
  - {key: regulated_design, label: Regulated design applies, value: yes_no, scope: project, help: "Record the professional advice or verified rule you relied on. The class alone does not decide it."}
  # The budget a brief or report states, kept as its verbatim span. It is
  # the one construction budget: the cost plan reads its amount in Go,
  # shows it in its totals, writes edits back here and spreads it over the
  # construction lines (owner decisions 1 and 2, 2026-10-21,
  # docs/plans/2026-10-21-source-to-cost-plan-design.md).
  - key: budget_stated
    label: Construction budget (as stated)
    value: text
    scope: project
    help: "As a document states it, or typed here or in the Cost Plan totals. The cost plan spreads it over the construction lines."
    extraction: pre_parsed
    triggers:
      - '\bbudget\b'
      - 'construction cost'
      - 'cost of (?:the )?(?:works|construction|building)'
      - 'cost (?:limit|cap|target)'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the construction budget
      or target construction cost for this project? Select none when absent, or when the candidate is a fee,
      a contingency, an allowance for one item, a land or total development cost, or a cost of a different project.
  # Brief figures the cost plan takes up beside the budget (2026-10-21,
  # docs/plans/2026-10-21-source-to-cost-plan-design.md): each is kept as
  # its verbatim span and read into money by Go.
  - key: contingency_stated
    label: Contingency (as stated)
    value: text
    scope: project
    help: "As a document states it. The cost plan puts it on Construction contingency."
    extraction: pre_parsed
    triggers:
      - '\bcontingenc'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the contingency amount
      the owner or the project holds for this project's construction? Select none when absent, or when the
      candidate is the construction budget, a fee, an allowance for one item, a percentage only, or a figure
      of a different project.
  - key: owner_supply_stated
    label: Owner-supplied items (as stated)
    value: text
    scope: project
    help: "Items the owner supplies, with allowances, as a document states them. The cost plan lists each one outside the construction budget."
    extraction: pre_parsed
    triggers:
      - '\b(?:owners?|client|principal)s?\b[^.\n]{0,30}\bsuppl'
      - '\bsupplied\s+by\s+(?:the\s+)?(?:owners?|client|principal)\b'
      - '\b(?:owner|client|principal)[- ]supplied\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate states the items the owner or client will supply
      themselves for this project? Select none when absent, or when the candidate lists items the builder
      supplies, prime cost items the builder prices, or items of a different project.
  - key: exclusions_stated
    label: Budget exclusions (as stated)
    value: text
    scope: project
    help: "What a document says the construction budget excludes. The cost plan shows it on the Exclusions line."
    extraction: pre_parsed
    triggers:
      - '\bexclud(?:ing|es)\b'
      - '\bexclusions?\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate states what this project's construction budget or
      construction cost excludes? Select none when absent, or when the candidate lists a consultant's or
      contractor's excluded services, or exclusions of a different project.

# Stored on the site record (internal/store/sites.go). A reading is shown
# only until the user types a value there.
site_details:
  - key: address
    label: Site address
    value: text
    extraction: pre_parsed
    triggers:
      - '\b\d{1,4}[a-z]?(?:\s*[-–/]\s*\d{1,4}[a-z]?)?\s+[a-z’'']+(?:\s+[a-z’'']+){0,2}\s+(?:street|st|road|rd|avenue|ave|parade|pde|drive|dr|place|pl|lane|ln|highway|hwy|boulevard|blvd|crescent|cres|court|ct|close|terrace|tce|way|circuit|cct|esplanade|grove)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate is the street address of this project's site, in its
      most complete form? Select none when absent, or when the candidate is a neighbour's address, a
      consultant's or contractor's office, an address in a list of past or reference projects, or an address a document only compares or references.
  - key: lot
    label: Lot and DP
    value: text
    extraction: pre_parsed
    triggers:
      - '\blots?\s+\d+[a-z]?\b[^.\n]{0,60}?\b(?:dp|d\.p\.|sp|rp|ps|cp|deposited plan|strata plan)\s*\d+'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the lot and plan (for example
      Lot 1 DP 123456) of this project's site? Select none when absent, or when the candidate is a
      neighbouring lot or a lot created by a proposed subdivision.
