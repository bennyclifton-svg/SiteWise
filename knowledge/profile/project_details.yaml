# Facts about the project that the user can state once; every consultant RFP
# reads them from Profile. Shape: knowledge/SCHEMA.md "Project details".
# A detail with `extraction: pre_parsed` is also read from the documents the
# profile reads: code finds candidate values (internal/profile/details.go),
# Jev picks one or none, and the user's own word always wins. A detail
# without `extraction` is never asked of Jev. Labels follow
# knowledge/rfp/skeleton.yaml so Profile and the RFP use the same words.
# RFP flags with no determinant are stored as proj.flag.<flag key>; those
# read from documents are listed in flag_readings.yaml.
version: 1
status: draft
details:
  - key: client
    label: Client
    value: text
    scope: project
    extraction: pre_parsed
    triggers:
      - '\b(?:principal|client|owner|proponent|applicant|developer|landowner)\b(?:\s*\([^)]{0,40}\))?\s*[:–]'
      - 'prepared for\s'
      - 'commissioned by\s'
      # A letter or proposal's addressee line: "To: X Pty Ltd".
      - '(?m)^[*_ \t]*to[*_ \t]*:'
      # An address block sent care of the owners' designer: "A & B C/O Design".
      - '\s(?:c/-|c/o|care\s+of)\s'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as this project's client:
      the principal, owner or proponent the works are for? Select none when absent, or when the candidate is
      a contractor, consultant, authority, neighbour or tenant.
  # The landlord of a leased building whose consent, base building and
  # incentives shape a tenant's works (Meridian, 2026-11-11).
  - key: landlord
    label: Landlord
    value: text
    scope: project
    help: "The building owner a tenant's works need consent from. Empty when the client owns the building."
    extraction: pre_parsed
    triggers:
      - '\blandlord\b'
      - '\blessor\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the landlord or lessor of the
      building this project's works are in? Select none when absent, or when the candidate is the tenant or client,
      a managing agent, a consultant, a builder, or another building's owner.
  - key: lga
    label: Local government area
    value: text
    scope: site
    extraction: pre_parsed
    triggers:
      - 'local government area'
      - '\blga\b'
      - '\bcouncil\b'
      - '\b(?:city|shire|municipality|town|borough) of\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the local government area
      (council area) this project's site is in? Select none when absent, or when the candidate is a council
      named for a neighbouring area or a different site. The council identified for this project's DA or local planning controls establishes its council area.
  - key: zone
    label: Zone
    value: text
    scope: site
    extraction: pre_parsed
    triggers:
      - '\bzon(?:e|ed|ing)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the planning zone of this
      project's site? Select none when absent, or when the candidate is an adjoining zone, a noise or
      fire zone, or a zone of a different site.
  - key: program
    label: Program milestones
    value: text
    scope: project
    help: "Dated targets from a filed programme. Aspirations remain targets, not commitments."
    extraction: pre_parsed
    triggers: ['\btarget\b', '\baspiration\b', '\bplanned\b']
    asks: >-
      Using `text` and `candidates`, which paragraph states this project's dated approval,
      construction or occupation targets? Keep the whole candidate, including qualifications
      such as aspiration or subject to approval. Select none for consultant fee or service deadlines,
      report issue dates, past completion records, or dates for another project.
  # Owner targets and a builder's preliminary estimate (Walsh review,
  # 2026-10-27). Code offers dates, month counts and money ranges; Jev picks
  # one or none; Go reads the latest date or the month count. The Program
  # shows each target beside its programmed date, and the Cost Plan shows
  # the estimate beside the budget. Neither changes a date or a budget.
  - key: target_da_lodgement
    label: Target DA lodgement
    value: text
    scope: project
    help: "When the owner or the brief wants the development application lodged. The Program shows it beside the programmed lodgement."
    extraction: pre_parsed
    triggers:
      - '\b(?:da|development application)\b[^.\n]{0,60}\blodg'
      - '\blodg\w*\b[^.\n]{0,60}\b(?:da|development application)\b'
      # An SSD or CDC application is this project's planning application too
      # ("SSD lodgement target: September 2026", Meridian 2026-11-11).
      - '\b(?:ssd|cdc|state significant development|complying development)\b[^.\n]{0,60}\blodg'
      - '\blodg\w*\b[^.\n]{0,60}\b(?:ssd|cdc|state significant development|complying development)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as when this project's development
      application (DA, SSD or CDC) is to be lodged (a target or aspiration)? Select none when absent, or when the candidate is a council
      assessment period, the date of a letter or report, a consultant's fee trigger, or another project's date.
  - key: target_construction_start
    label: Target construction start
    value: text
    scope: project
    help: "When the owner or the brief wants construction to start. The Program shows it beside the programmed start."
    extraction: pre_parsed
    triggers:
      - '\bconstruction\b[^.\n]{0,30}\b(?:start|commence)'
      - '\b(?:start|commence)\w*\b[^.\n]{0,30}\b(?:construction|on site|works)\b'
      # A fit-out starts when the tenant takes possession of the floors
      # ("Target possession for fit-out: 1 November 2026").
      - '\bpossession\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as when construction of this project is
      to start (a target or aspiration), including when the site or tenancy is handed over for the works (possession for fit-out)?
      Select none when absent, or when the candidate is a lodgement or approval date,
      a completion or occupation date, the date of a letter, or another project's date.
  - key: max_construction_months
    label: Maximum time on site (months)
    value: text
    scope: project
    help: "The longest construction period the owner accepts. The Program compares its construction stage."
    extraction: pre_parsed
    triggers:
      - '\bmonths?\b[^.\n]{0,30}\bon site\b'
      - '\bmaximum\b[^.\n]{0,40}\bmonths?\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the longest construction period on
      site the owner accepts for this project? Select none when absent, or when the candidate is a builder's estimate,
      a consultant's service period, a defects period, or another project's figure.
  - key: preliminary_estimate
    label: Builder's preliminary estimate
    value: text
    scope: project
    help: "A builder's or estimator's preliminary cost advice, kept as stated. The Cost Plan shows it beside the budget; it is not a budget or a price."
    extraction: pre_parsed
    triggers:
      - '\bROM\b'
      - 'rough order'
      - 'order of magnitude'
      - 'preliminary (?:cost|estimate|pricing|price)'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as a builder's or estimator's preliminary
      estimate of this project's construction cost? Select none when absent, or when the candidate is the owner's
      budget, a tender price, a fee, an allowance for one item, or another project's figure.
  - key: preliminary_construction_months
    label: Builder's estimated time on site
    value: text
    scope: project
    help: "A builder's preliminary estimate of the construction period, kept as stated. The Program compares its construction stage."
    extraction: pre_parsed
    triggers:
      - '\bROM\b'
      - 'rough order'
      - 'preliminary (?:programme|program)'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as a builder's preliminary estimate of
      the construction period on site for this project, in months or weeks? Select none when absent, or when the candidate is the owner's
      maximum, a consultant's service period, an approval period, a defects period, or another project's figure.
  # When the owner wants the works finished or the building occupied
  # ("Firm occupation from 1 July 2027", Meridian 2026-11-11). Shown on the
  # Profile beside the other targets; the Program does not read it yet.
  - key: target_completion
    label: Target completion or occupation
    value: text
    scope: project
    help: "When the owner or the brief wants the works complete or the building occupied."
    extraction: pre_parsed
    triggers:
      - '\b(?:practical completion|completion|complete[ds]?|handover|hand over)\b'
      - '\b(?:occupation|occupy|occupancy|move[- ]in|opening)\b[^.\n]{0,40}\b(?:20\d{2}|from|by|before)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as when this project's works are to be
      complete or the building occupied (a target, deadline or aspiration)? Select none when absent, or when the
      candidate is a start or possession date, a lodgement or approval date, a consultant's own deadline, the end of
      a rent-free or lease period that is not the completion, the date of a letter, or another project's date.
  - key: sustainability
    label: Sustainability target
    value: text
    scope: project
    extraction: pre_parsed
    triggers:
      - 'green star'
      - 'nabers'
      - 'nathers'
      - 'passive ?haus|passive ?house'
      - '\bleed\b'
      - 'net[- ]zero'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the sustainability target or
      rating this project must achieve? Select none when absent, when it only names a tool or standard
      without a target, or when it describes a different project.
  - {key: regulated_design, label: Regulated design applies, value: yes_no, scope: project, help: "The NSW regime covers Class 2, 3 and 9c work only, so a project without those classes reads No. Otherwise record the professional advice you relied on."}
  # The budget a brief or report states, kept as its verbatim span. It is
  # the one construction budget: the cost plan reads its amount in Go,
  # shows it in its totals, writes edits back here and spreads it over the
  # construction lines (owner decisions 1 and 2, 2026-10-21,
  # docs/plans/2026-10-21-source-to-cost-plan-design.md).
  - key: budget_stated
    label: Construction budget (as stated)
    value: text
    scope: project
    help: "As a document states it, or typed here or in the Cost Plan totals. The cost plan spreads it over the construction lines."
    extraction: pre_parsed
    triggers:
      - '\bbudget\b'
      - 'construction cost'
      - 'cost of (?:the )?(?:works|construction|building)'
      - 'cost (?:limit|cap|target)'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the construction budget
      or target construction cost for this project? Select none when absent, or when the candidate is a fee,
      a contingency, an allowance for one item, a land or total development cost, or a cost of a different project.
  # Brief figures the cost plan takes up beside the budget (2026-10-21,
  # docs/plans/2026-10-21-source-to-cost-plan-design.md): each is kept as
  # its verbatim span and read into money by Go.
  - key: contingency_stated
    label: Contingency (as stated)
    value: text
    scope: project
    help: "As a document states it. The cost plan puts it on Construction contingency."
    extraction: pre_parsed
    triggers:
      - '\bcontingenc'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the contingency amount
      the owner or the project holds for this project's construction? Select none when absent, or when the
      candidate is the construction budget, a fee, an allowance for one item, a percentage only, or a figure
      of a different project.
  - key: owner_supply_stated
    label: Owner-supplied items (as stated)
    value: text
    scope: project
    help: "Items the owner supplies, with allowances, as a document states them. The cost plan lists each one outside the construction budget."
    extraction: pre_parsed
    triggers:
      - '\b(?:owners?|client|principal)s?\b[^.\n]{0,30}\bsuppl'
      - '\bsupplied\s+by\s+(?:the\s+)?(?:owners?|client|principal)\b'
      - '\b(?:owner|client|principal)[- ]supplied\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate states the items the owner or client will supply
      themselves for this project? Select none when absent, or when the candidate lists items the builder
      supplies, prime cost items the builder prices, or items of a different project.
  - key: exclusions_stated
    label: Budget exclusions (as stated)
    value: text
    scope: project
    help: "What a document says the construction budget excludes. The cost plan shows it on the Exclusions line."
    extraction: pre_parsed
    triggers:
      - '\bexclud(?:ing|es)\b'
      - '\bexclusions?\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate states what this project's construction budget or
      construction cost excludes? Select none when absent, or when the candidate lists a consultant's or
      contractor's excluded services, or exclusions of a different project.
  # An owner's feasibility allowance or budget aspiration that is not yet
  # the construction budget ("Budget aspiration (not confirmed) ... $1.35M –
  # $1.55M", Meridian 2026-11-11). Kept apart so the cost plan never spreads
  # an unconfirmed figure; the answer key keeps budget_stated blank here.
  - key: budget_aspiration
    label: Feasibility allowance (not confirmed)
    value: text
    scope: project
    help: "An owner's feasibility allowance or budget aspiration, as stated. Not the construction budget: the cost plan does not use it."
    extraction: pre_parsed
    triggers:
      - '\bfeasibility\b'
      - '\baspiration'
      - '\b(?:not|un)\s*confirmed\b[^.\n]{0,60}\$'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the owner's feasibility allowance,
      budget aspiration or unconfirmed budget range for this project's works? Select none when absent, or when the
      candidate is a confirmed construction budget, a builder's estimate or price, a fee, a contribution from
      another party, an allowance for one item, or another project's figure.
  # Money another party puts towards the works: a landlord's incentive, a
  # grant, a developer's contribution ("allowance $180,000 contributed (ex
  # GST) subject to lease incentive deed", Meridian 2026-11-11).
  - key: contributions_stated
    label: Contributions from others (as stated)
    value: text
    scope: project
    help: "Money a landlord, grant or other party contributes to the works, as a document states it, with its conditions."
    extraction: pre_parsed
    triggers:
      - '\bcontribut(?:e|es|ed|ion|ions)\b'
      - '\b(?:incentive|grant|subsidy|rebate)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate states money another party (a landlord, funder or authority)
      contributes towards this project's works, with what it is for? Select none when absent, or when the candidate
      is the owner's own budget, a fee, a developer contribution or levy the project pays, or another project's figure.
  # Floors the works occupy in a larger building ("Levels 3 and partial
  # Level 4", Meridian 2026-11-11). Text, as the documents write it.
  - key: works_levels
    label: Floors in the works
    value: text
    scope: project
    help: "The floors or levels of the building the works occupy, as the documents write them."
    extraction: pre_parsed
    triggers:
      - '\blevels?\s+\d'
      - '\b(?:ground|first|second|third|upper|lower)\s+(?:floor|level)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the floors or levels of the building
      this project's works occupy, in their most complete form? Select none when absent, or when the candidate is
      one room's floor, a neighbouring tenancy's floors, another building's floors, or a storey count.
  # When work may happen on site ("After-hours works: Permitted 10:00 pm –
  # 6:00 am weekdays and Saturdays until 2:00 pm; no Sunday works").
  - key: work_hours
    label: Permitted work hours
    value: text
    scope: project
    help: "When the works may be carried out on site, as a consent, landlord or brief states it."
    extraction: pre_parsed
    triggers:
      - '\bafter[- ]hours\b'
      - '\b(?:work(?:ing)?|construction)\s+hours\b'
      - '\bhours\s+of\s+(?:work|construction)\b'
      - '\b\d{1,2}(?::\d{2})?\s*(?:am|pm)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate states when this project's construction works may be carried
      out on site (permitted days and hours)? Select none when absent, or when the candidate is the hours of one
      activity only (such as core drilling), office or business hours, a meeting time, or another project's hours.
  # Conditions that must be met before the works may start ("Tenant works
  # must not commence until SSD consent and landlord fit-out consent deed
  # are executed").
  - key: start_conditions
    label: Before works may start
    value: text
    scope: project
    help: "What a document says must happen before the works may start on site."
    extraction: pre_parsed
    triggers:
      - '\b(?:must|shall|will|may|can)\s*not\s+(?:commence|start|begin)\b'
      - '\b(?:cannot|can''t)\s+(?:commence|start|begin)\b'
      - '\b(?:prior to|before)\s+(?:the\s+)?(?:commencement|start)\s+of\s+(?:the\s+)?(?:works|construction)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate states what must happen before this project's construction
      works may start on site? Select none when absent, or when the candidate is a condition on a consultant's
      services, a payment term, or another project's condition.
  # How many builders or tenderers are to be invited ("evaluation of two
  # invited builders").
  - key: tenderers
    label: Tenderers to invite
    value: text
    scope: project
    help: "How many builders or contractors are to be invited to tender for the works."
    extraction: pre_parsed
    triggers:
      - '\binvit\w*\b[^.\n]{0,40}\b(?:builders?|tenderers?|contractors?)\b'
      - '\b(?:builders?|tenderers?|contractors?)\b[^.\n]{0,20}\binvit'
      - '\bshort-?list\w*\b[^.\n]{0,40}\b(?:builders?|tenderers?|contractors?)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the number of builders or contractors
      to be invited to tender for this project's construction works? Select none when absent, or when the number
      counts consultants, tender rounds, or another project's tenderers.

# Stored on the site record (internal/store/sites.go). A reading is shown
# only until the user types a value there.
site_details:
  - key: address
    label: Site address
    value: text
    extraction: pre_parsed
    triggers:
      - '\b\d{1,4}[a-z]?(?:\s*[-–/]\s*\d{1,4}[a-z]?)?\s+[a-z’'']+(?:\s+[a-z’'']+){0,2}\s+(?:street|st|road|rd|avenue|ave|parade|pde|drive|dr|place|pl|lane|ln|highway|hwy|boulevard|blvd|crescent|cres|court|ct|close|terrace|tce|way|circuit|cct|esplanade|grove)\b'
    asks: >-
      Using `excerpt` and `candidates`, which candidate is the street address of this project's site, in its
      most complete form? Select none when absent, or when the candidate is a neighbour's address, a
      consultant's or contractor's office, an address in a list of past or reference projects, or an address a document only compares or references.
  - key: lot
    label: Lot and DP
    value: text
    extraction: pre_parsed
    triggers:
      - '\blots?\s+\d+[a-z]?\b[^.\n]{0,60}?\b(?:dp|d\.p\.|sp|rp|ps|cp|deposited plan|strata plan)\s*\d+'
    asks: >-
      Using `excerpt` and `candidates`, which candidate does the passage state as the lot and plan (for example
      Lot 1 DP 123456) of this project's site? Select none when absent, or when the candidate is a
      neighbouring lot or a lot created by a proposed subdivision.
