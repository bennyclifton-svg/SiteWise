# Where Profile shows things. Screen order only: Jev questions, fingerprints
# and work items keep the catalogue's own order, so editing this file changes
# no reading.
#
# build_order lists every top-level system (knowledge/systems.yaml) in the
# sequence a builder or consultant walks a building: the ground, then what
# holds it up, the skin, the services, then fire separation, fit-out and
# access. Planning and approvals come before it on screen as their own entry.
#
# homes places a profile input under one entry: project (the Project card),
# planning (Planning and approvals) or a top-level system id. A determinant
# not listed here goes under the first system in its `systems:` list, and
# with no systems it stays in the Project card. An RFP detail flag
# (proj.flag.<key>) not listed here stays in the Project card; the cost
# planner's choices do, as cost is not one building system.
version: 1
status: draft
build_order:
  - site
  - substructure
  - structure
  - envelope
  - hydraulic
  - mechanical
  - electrical
  - fire-active
  - comms-security
  - vertical-transport
  - fire-passive
  - interiors
  - access-egress
homes:
  project:
    # What the building is, read once for the whole project.
    - det.ncc_class
    - det.rise_in_storeys
    - det.floor_area
    - det.effective_height
    - det.existing_building
    - det.existing_building_year
    - det.ncc_edition
    - det.state
    - det.heritage_status
    - det.flood_hazard
    - det.bushfire_prone_land
    # Delivery choices that sit beside the contract and sustainability facts.
    - proj.flag.contract_admin
    - proj.flag.sustainability_target
  planning:
    # Certifier appointment choices sit with the approvals they serve.
    - proj.flag.bca_advisory
    - proj.flag.bca_certification
    - proj.flag.bca_existing_assessment
    - proj.flag.bca_classification_map
    - proj.flag.bca_staged_occupation
    - proj.flag.bca_fire_referrals
    - proj.flag.bca_residential_evidence
    - proj.flag.architect_lodges
    - proj.flag.staged
    - proj.flag.multi_building
    - proj.flag.cl46
    - proj.flag.panel
    - proj.flag.objections
    - proj.flag.community
    - proj.flag.country
    - proj.flag.coastal
  site:
    - proj.flag.rail
    - proj.flag.public_road
    - proj.flag.state_road
    - proj.flag.heavy_vehicles
    - proj.flag.tfnsw_referral
    - proj.flag.intersection_modelling
    - proj.flag.gtp_required
    - proj.flag.osd_existing
    - proj.flag.osd_required
    - proj.flag.stormwater_quality
    - proj.flag.norbe
    # Trees on and beside the site.
    - proj.flag.arborist_offsite_trees
    - proj.flag.arborist_offsite_access
    - proj.flag.arborist_tree_impacts
    - proj.flag.arborist_pruning
    # Appointment choices for the site's consultants: what each one is asked
    # to do, shown with the site rather than on the Project card.
    - proj.flag.arborist_impact_report
    - proj.flag.arborist_protection_plan
    - proj.flag.survey_detail
    - proj.flag.survey_boundary
    - proj.flag.survey_services
    - proj.flag.survey_adjoining
    - proj.flag.survey_buried
    - proj.flag.survey_sewer
    - proj.flag.landscape_design
    - proj.flag.landscape_podium
    - proj.flag.landscape_irrigation_brief
    - proj.flag.landscape_irrigation_detail
    - proj.flag.landscape_public
    - proj.flag.landscape_special
    - proj.flag.landscape_staging
    - proj.flag.waste_operational
    - proj.flag.waste_cd
    - proj.flag.waste_shared
  substructure:
    - proj.flag.groundwater
    - proj.flag.basement
    - proj.flag.excavation_adjoining
    - proj.flag.geotech_intrusive
    - proj.flag.geotech_foundation
    - proj.flag.geotech_civil_parameters
    - proj.flag.geotech_asset_exposure
    - proj.flag.geotech_ass
    - proj.flag.geotech_handback
