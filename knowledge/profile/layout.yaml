    - proj.flag.hyd_investigation
    - proj.flag.hyd_planning
    - proj.flag.hyd_sources
    - proj.flag.hyd_rainwater
    - proj.flag.hyd_alternative_sources
    - proj.flag.hyd_pumps
    - proj.flag.hyd_treatment
    - proj.flag.hyd_roof
    - proj.flag.hyd_external
    - proj.flag.hyd_trade
    - proj.flag.hyd_gas
    - proj.flag.hyd_utility
    - proj.flag.hyd_interfaces
    - proj.flag.hyd_staging
