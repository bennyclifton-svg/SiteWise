# Default consultant packages, copied as data from Clerk (never code).
# Baselines suggest consultants by building class and work type; complexity
# additions add one when a profile field has a listed value. Field names are
# Clerk's; the checker warns where SiteWise has no field of that name, for the
# owner to map. Suggestions are proposals, never appointments. Draft (D-22).
version: 1
status: draft
source:
  clerk_file: data/taxonomy/consultant-rosters.json
description: Editable planning suggestions, not appointments or statutory requirements. Scope-specific consultants
  are added separately.
baselines:
- building_classes:
  - industrial
  - commercial
  - institution
  - mixed
  work_types:
  - new
  - extend
  consultants:
  - Architect
  - Structural
  - Civil
  - Traffic
  - Town Planner
  - Geotechnical
  - Surveyor
  - Certifier
  - Services Engineer
- building_classes:
  - residential
  work_types:
  - new
  - extend
  consultants:
  - Architect
  - Structural
  - Civil
  - Town Planner
  - Geotechnical
  - Surveyor
  - Certifier
  - Services Engineer
- building_classes:
