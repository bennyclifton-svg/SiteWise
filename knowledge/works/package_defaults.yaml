# Default consultant packages. Clerk's rosters were the seed (data, never code);
# v2 (2026-10-11, docs/plans/2026-10-11-procurement-default-disciplines.md)
# splits Services Engineer into each service, lets work type alone suggest, and
# adds scope additions. A baseline with no building_classes applies to any
# class. Scope additions apply when a listed system (or one below it) is in
# scope. Each consultant must be a discipline label in data/intake/disciplines.json.
# Exact heritage/BAL identifiers are mapped to SiteWise's existing catalogue;
# unresolved contamination/flood fields retain the source vocabulary for review.
# Suggestions are proposals, never appointments. Draft (D-22).
version: 2
status: draft
source:
  clerk_file: data/taxonomy/consultant-rosters.json
description: Editable planning suggestions, not appointments or statutory requirements. The project manager
  removes the lines a project does not need.
baselines:
- work_types:
  - new
  - extend
  except_building_classes:
  - infrastructure
  consultants:
  - Architect
  - Structural
  - Civil
  - Town Planner
  - Geotechnical
  - Surveyor
  - Certifier
  - Electrical
  - Hydraulic
- building_classes:
  - industrial
  - commercial
  - institution
  - mixed
  work_types:
  - new
  - extend
  consultants:
  - Traffic
  - BCA
  - Access
  - Mechanical
  - Fire Services
- work_types:
  - refurb
  consultants:
  - Architect
  - Certifier
  - Electrical
  - Hydraulic
- building_classes:
  - industrial
  - commercial
  - institution
  - mixed
  work_types:
  - refurb
  consultants:
  - BCA
  - Access
  - Mechanical
  - Fire Services
- building_classes:
  - commercial
  - institution
  - mixed
  work_types:
  - refurb
  consultants:
  - Interior Design
- building_classes:
  - infrastructure
  work_types:
  - new
  - extend
  consultants:
  - Civil
  - Structural
  - Geotechnical
  - Surveyor
  - Environmental
  - Town Planner
# Systems that are only in scope when the building needs them. A system every
# building has (a facade) is triggered by a complexity reading instead.
scope_additions:
- systems:
  - vertical-transport
  consultants:
  - Vertical Transport
- systems:
  - fire-active.sprinklers
  - fire-active.hydrants
  - fire-active.fire-water
  - fire-active.detection
  - fire-active.occupant-warning
  consultants:
  - Fire Services
- systems:
  - mechanical
  consultants:
  - Mechanical
- systems:
  - hydraulic
  consultants:
  - Hydraulic
- systems:
  - electrical
  - fire-active.emergency-lighting
  consultants:
  - Electrical
complexity_additions:
- field: planning
  values:
  - da
  - ssd
  consultants:
  - Town Planner
- field: heritage_status
  values:
  - conservation_area
  - local_item
  - state_register
  consultants:
  - Heritage
- field: contamination_level
  values:
  - minor
  - significant
  - heavily_contaminated
  consultants:
  - Environmental
- field: environmental_sensitivity
  values:
  - sensitive
  - protected_habitat
  consultants:
  - Ecology
- field: environmental_sensitivity
  values:
  - aboriginal_heritage
  consultants:
  - Archaeology
- field: bal
  values:
  - BAL-LOW
  - BAL-12.5
  - BAL-19
  - BAL-29
  - BAL-40
  - BAL-FZ
  consultants:
  - Bushfire
- field: flood_exposure
  values:
  - flood_planning_area
  - below_1pc_aep
  - floodway
  consultants:
  - Civil
# A facade is in scope on every building; a complex one needs its own engineer.
- field: facade_type
  values:
  - complex
  consultants:
  - Facade
