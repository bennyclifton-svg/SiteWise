# Budget splits: how a stated construction budget is spread across the
# construction lines when the cost plan opens (owner decision 1,
# docs/plans/2026-10-21-source-to-cost-plan-design.md). Each split is the
# share of construction cost per building system, in percent, from the
# research in docs/evidence/2026-10-21-cost-split-research.md.
#
# A split is a planning default for an editable suggestion, never an
# estimate: verified stays false until the owner or a QS checks it against
# Rawlinsons, Cordell, AIQS or BCIS. Code renormalises over the lines the
# project has. `preliminaries` (preliminaries and margin) has no line of
# its own, so its share is spread over the trade lines pro rata.
#
# The first split whose `when` matches the profile wins: class, subclass and
# work type are profile values; storeys bounds use hdr.scale.storeys and are
# ignored when it is unknown. `basement` scales a share when the profile
# says the project has a basement (proj.flag.basement), for splits whose
# sources had none.
version: 1
status: draft
verified: false
sources:
  - {evidence: docs/evidence/2026-10-21-cost-split-research.md}
splits:
  # Residential: NSW Planning Portal QS estimates (medium confidence).
  - id: residential_house_new
    label: New house
    confidence: medium
    when: {class: [residential], subclass: [house, townhouses, social_affordable_housing, retirement_living], work_type: [new]}
    basement: {substructure: 2}
    shares: {preliminaries: 18, site: 5, substructure: 11, structure: 6, envelope: 24, interiors: 24, fire-active: 0.2, mechanical: 2.5, hydraulic: 4.5, electrical: 3.8, comms-security: 0.5, access-egress: 0.5}
    basis: "Earlwood and Panania dwelling estimates (H1, H2); basement from East Hills (A)."
  - id: residential_apartments_high_rise
    label: Apartments, high-rise
    confidence: medium
    when: {class: [residential], subclass: [apartments, btr, social_affordable_housing], work_type: [new], storeys_min: 5}
    shares: {preliminaries: 19, site: 2, substructure: 9, structure: 18, envelope: 11, interiors: 22.3, fire-active: 2.8, mechanical: 2.7, hydraulic: 5.5, electrical: 4.5, comms-security: 0.2, vertical-transport: 2.2, access-egress: 0.8}
    basis: "Belmore (R1) and St Leonards (R2) apartment estimates, both over basements."
  - id: residential_apartments_low_rise
    label: Apartments, low-rise
    confidence: low
    when: {class: [residential], subclass: [apartments, btr], work_type: [new]}
    basement: {substructure: 2}
    shares: {preliminaries: 18.5, site: 3.5, substructure: 10, structure: 12, envelope: 17.5, interiors: 23.2, fire-active: 1.5, mechanical: 2.6, hydraulic: 5, electrical: 4.2, comms-security: 0.3, vertical-transport: 1.1, access-egress: 0.6}
    basis: "No source; midway between the house and high-rise splits."
  - id: residential_student
    label: Student housing and co-living
    confidence: medium
    when: {class: [residential], subclass: [student_housing], work_type: [new]}
    shares: {preliminaries: 18.4, site: 1.5, substructure: 3.4, structure: 10.4, envelope: 18, interiors: 26.2, fire-active: 2.3, mechanical: 3.2, hydraulic: 7.8, electrical: 5.2, comms-security: 0.2, vertical-transport: 3.2, access-egress: 0.4}
    basis: "Todman (S1) and Rockdale (S2) estimates, averaged."
  - id: residential_aged_care
    label: Residential aged care
    confidence: medium
    when: {class: [residential], subclass: [residential_aged_care], work_type: [new]}
    shares: {preliminaries: 16.8, site: 3.9, substructure: 5.3, structure: 7.2, envelope: 17.6, interiors: 28.1, fire-active: 3.2, mechanical: 5.9, hydraulic: 5.5, electrical: 4.5, comms-security: 0.8, vertical-transport: 0.9, access-egress: 0.2}
    basis: "Denham Court residential care facility (AC)."
  - id: residential_extension
    label: House extension or alteration
    confidence: medium
    when: {class: [residential], work_type: [extend, refurb]}
    shares: {preliminaries: 10, site: 7.2, substructure: 20.8, envelope: 29.4, interiors: 23.7, fire-active: 0.4, mechanical: 1.6, hydraulic: 3.9, electrical: 2.4, access-egress: 0.7}
    basis: "Ashbury alterations and additions (X1); refurbishment borrows it (no source)."
  - id: residential_other
    label: Residential, other
    confidence: low
    when: {class: [residential], work_type: [new]}
    basement: {substructure: 2}
    shares: {preliminaries: 18, site: 5, substructure: 11, structure: 6, envelope: 24, interiors: 24, fire-active: 0.2, mechanical: 2.5, hydraulic: 4.5, electrical: 3.8, comms-security: 0.5, access-egress: 0.5}
    basis: "Borrows the new house split."

