# General trade RFT (docs/plans/2026-11-08-trade-rft.md): used by every
# trade or supply package whose discipline has no file of its own. A supply
# package is still an RFT (owner, 8 November 2026); the project manager
# excludes the installation lines. Draft until the owner reviews it.
id: trade-general
version: 1
status: draft
kind: works
title: Trade works
heading: "REQUEST FOR TENDER: TRADE WORKS"
discipline_ids: [trade.general]
evidence_limit: "General trade practice; no trade-specific tender has been encoded."

scale:
  text: "One trade package; the project manager edits the lines for the trade."
  complex: []

role:
  - key: package
    text: "Trade package: {package}."
    provenance: [{kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: every trade, including a supply, gets an RFT in the one format."}]
  - key: purpose
    text: "Your job is to build or supply the works of this package that the documents show, to the contract, safely and on program, and to hand them over tested, certified and complete."
    provenance: [{kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Supply and install the works of this package, or supply only where section 2 says so.
      - Coordinate your work with the head contractor and the other trades on site.
      - Test and commission what you install, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}]

stage_intro: "A supply-only tender excludes the installation lines."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

stages:
  - key: design
    name: Design and shop drawings
    lines:
      - {key: shop_drawings, text: "Shop drawings for the design team's review"}
      - {key: design, text: "Design of the package where the documents leave it to the contractor"}
    fee_basis: fixed
    delivery_stage: design_finalisation
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}]
  - key: works
    name: The works
    lines:
      - {key: supply, text: "Supply of the materials and equipment the documents specify"}
      - {key: install, text: "Installation as the documents show"}
      - {key: attendance, text: "Your own supervision, access equipment and clean-up"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: a supply is an RFT; the project manager excludes the installation line."}]
  - key: handover
    name: Testing and handover
    lines:
      - {key: testing, text: "Testing and commissioning"}
      - {key: certificates, text: "Certificates your trade signs"}
      - {key: records, text: "Manuals, warranties and as-built records"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/setup-and-commission-guide.md"}]

durations: "From the SiteWise program when it holds the delivery stage; otherwise the tenderer states weeks in R7."
