    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
