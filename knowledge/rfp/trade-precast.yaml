id: trade-precast
version: 1
status: draft
kind: works
title: "Precast concrete"
heading: "REQUEST FOR TENDER: PRECAST CONCRETE"
discipline_ids: [trade.precast]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the precast contractor. Your job is to detail, cast, deliver and erect the precast and tilt-up concrete elements the documents show, with their connections, grouting and temporary bracing, safely and on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/structural-commercial-industrial-guide.md (Documentation and tender [documentation_tender])"}, {kind: seed, ref: "data/reference/clerk/data/seed/multi-residential-apartments-guide.md (Facade Selection for Multi-Residential Buildings)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Give the engineer the shop drawings and the lifting and temporary bracing design for review before casting.
      - Keep each element braced until the permanent structure the engineer names supports it.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/structural-commercial-industrial-guide.md (Construction and completion [construction_completion])"}, {kind: seed, ref: "data/reference/clerk/data/seed/ncc-reference-guide.md (Performance Requirements and Importance Levels)"}]

stage_intro: "A supply-only tender excludes the installation lines."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

stages:
