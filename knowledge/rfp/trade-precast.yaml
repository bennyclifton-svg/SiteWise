    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/structural-commercial-industrial-guide.md (Documentation and tender [documentation_tender])"}]
  - key: erection
    name: "Delivery and erection"
    lines:
