    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/structural-commercial-industrial-guide.md (Construction and completion [construction_completion])"}, {kind: seed, ref: "data/reference/clerk/data/seed/ncc-reference-guide.md (Performance Requirements and Importance Levels)"}]
  - key: handover
    name: "Testing and handover"
