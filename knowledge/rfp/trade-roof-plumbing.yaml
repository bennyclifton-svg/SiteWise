id: trade-roof-plumbing
version: 1
status: draft
kind: works
title: "Roof plumbing"
heading: "REQUEST FOR TENDER: ROOF PLUMBING"
discipline_ids: [trade.roof_plumbing]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the roof plumber. Your job is to install the gutters, box gutters, rainwater heads, downpipes and overflows the documents show, with the flashings at plumbing penetrations, so the roof drains to the stormwater system, on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/hydraulic-services-guide.md (Stormwater and roof drainage)"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 1: Frame to roof)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Rough in downpipe brackets and vent and flue penetrations before the roof is covered.
      - Provide the plumbing compliance certificate for the roof drainage you install.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 1: Frame to roof)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (5. AS 3500 — Plumbing and drainage)"}]

stage_intro: "A supply-only tender excludes the installation lines."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

