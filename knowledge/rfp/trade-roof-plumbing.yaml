      - {key: records, text: "Manuals, warranties and as-built records"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (5. AS 3500 — Plumbing and drainage)"}, {kind: seed, ref: "data/reference/clerk/data/seed/setup-and-commission-guide.md"}]

