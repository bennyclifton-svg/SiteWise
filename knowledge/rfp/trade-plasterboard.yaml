role:
  - key: contractor
    text: "You are the plasterboard contractor. Your job is to line the walls and ceilings the documents show with the board each room needs, set and finish them ready for paint, and leave wet-area walls a sound substrate for the waterproofer and tiler."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Plasterboard (gypsum board))"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Do not start a room until its frame and services rough-in inspections are passed and you have seen the record.
      - Use moisture-resistant board, or the wet-area sheet the documents name, in every wet area.
      - Offer fire-rated and acoustic walls and ceilings for inspection before they are closed.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 3: Kitchen and bathroom services rough-in before wall lining)"}, {kind: seed, ref: "data/reference/clerk/data/seed/multi-residential-apartments-guide.md (Quality Hold Points for Apartment Construction)"}]

