id: trade-scaffolding
version: 1
status: draft
kind: works
title: "Scaffolding"
heading: "REQUEST FOR TENDER: SCAFFOLDING"
discipline_ids: [trade.scaffolding]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the scaffolding contractor. Your job is to design where left to you, erect, alter, inspect and dismantle the scaffold, edge protection and access the works need, safe for the trades who use it, on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS/NZS 1576 Series — Scaffolding)"}, {kind: seed, ref: "data/reference/clerk/data/seed/commercial-construction-guide.md (Workplace Health and Safety in Commercial Construction)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Let only licensed scaffolders do work that needs a high-risk work licence.
      - Inspect and tag the scaffold before first use, after any alteration or severe weather, and at the intervals the regulations require.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS/NZS 1576 Series — Scaffolding)"}]

stage_intro: "A supply-only tender excludes the installation lines."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

stages:
