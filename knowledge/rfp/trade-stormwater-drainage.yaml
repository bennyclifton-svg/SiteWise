    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/civil-residential.md (Stormwater drainage)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hold the licence drainage work needs and book the council drainage inspection before the connection is buried.
      - Give the hydraulic engineer what they need to certify the detention system before the occupation certificate.
      - Hand over manuals, warranties and as-built records.
