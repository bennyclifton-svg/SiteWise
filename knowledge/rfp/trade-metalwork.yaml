role:
  - key: contractor
    text: "You are the metalwork and balustrade contractor. Your job is to detail, make and fix the balustrades, handrails, stairs and metalwork the documents show, so every barrier stops a fall where one can happen and every handrail is safe to use, and to show they meet the loads."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/ncc-reference-guide.md (Stairways, Ramps, and Barriers)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 1288 — Glass in Buildings)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Make each barrier high enough, with openings small enough and nothing a child can climb, for its location.
      - Make each barrier and its fixings strong enough for the loads its location carries, and give the engineer's or designer's evidence.
      - Use glass made for barriers in any glass balustrade.
      - Agree each fixing through a membrane with the waterproofer before you drill.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/ncc-reference-guide.md (Stairways, Ramps, and Barriers)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 1288 — Glass in Buildings)"}]

