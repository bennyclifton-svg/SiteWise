scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the concreting contractor. Your job is to supply, place, finish and cure the concrete the engineer's documents show, to the specified strength and finish, with the test records the engineer and certifier need, safely and on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/structural-residential.md (Inspection and evidence gates)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 3600 — Concrete Structures)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Pour only after the reinforcement inspection has passed and the head contractor releases the pour.
      - Sample and test the concrete at each pour and keep the delivery dockets.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/new-dwelling-guide.md (Structural inspection gates — Class 1a new dwelling)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 1012 Series — Methods of Testing Concrete)"}]

