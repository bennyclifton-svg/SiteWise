allowances_note: >-
  Editable client defaults: 4 design meetings per appointed design stage,
  1 consolidated review round per design stage and 1 investigation visit when
  commissioned. These are pricing assumptions, not measured project quantities.
  Price later stages separately. In R1/R2, identify the affected buildings and
  systems from the supplied project information; list assets, tests, durations,
  authority fees and specialist services separately, with assumptions and excess
  rates. Do not apply a single count to different units. Agree unresolved scope
  before the affected work starts.
allowances:
- key: design_meetings
  label: Design meetings
  text: '{n} per appointed design stage (editable client default)'
  default: '4'
  owner: client
  when: [stage: [schematic_design], stage: [design_development], stage: [tender_documentation], stage: [
          design_finalisation]]
  provenance: [{kind: client_decision, ref: 'electrical-services#55', why: 'Owner approved a small set of editable pricing
        defaults on 10 October 2026; these are not measured quantities.'}]
- key: design_review_rounds
  label: Design review rounds
  text: '{n} consolidated client review round per design stage (editable client default)'
  default: '1'
  owner: client
  when: [stage: [schematic_design], stage: [design_development], stage: [tender_documentation], stage: [
          design_finalisation]]
  provenance: [{kind: client_decision, ref: 'electrical-services#55', why: 'Explicit editable pricing assumption; correction
        of consultant errors remains included.'}]
- key: investigation_visits
  label: Investigation visits
  text: '{n} accessible-site visit; specialist tests and openings priced separately'
  default: '1'
  owner: client
  when: [{stage: [brief_concept], flag: [elec_investigation]}]
  provenance: [{kind: client_decision, ref: 'electrical-services#55', why: 'Editable visit allowance only when investigation
        is appointed or offered as an option.'}]
- key: construction_visits
  label: Construction inspections
  text: '{n} hold-point visits; firm states duration, review support and excess rates separately'
  owner: client
  when: [stage: [delivery]]
  provenance: [{kind: client_decision, ref: 'electrical-services#51,55', why: 'A base construction appointment needs a
        common attendance allowance; a later option does not block the design RFP.'}]

