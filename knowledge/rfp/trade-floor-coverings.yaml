role:
  - key: contractor
    text: "You are the floor coverings contractor. Your job is to lay the carpet and resilient floors the documents show over a substrate fit for them, with level transitions between finishes, after the painting is done."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Flooring)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Test slabs and subfloors for moisture before you lay, and tell the head contractor in writing if they are not ready.
      - Lay carpet only after painting and the wet trades have finished.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Carpet)"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 6: Internal painting before flooring)"}]

