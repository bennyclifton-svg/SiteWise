# Traffic RFP (docs/rfp-golden/traffic/rfp.md v1, accepted 2026-10-09),
# repaired per the 2026-10-09 peer review (Phase A): parking and access advice,
# the traffic report, surveys and intersection modelling are separate and each
# triggered; SIDRA only when modelling is needed; a green travel plan follows a
# confirmed requirement; a road safety audit is independent of the design role.
# See docs/rfp-golden/phase-a-changes.md. NSW only.
id: traffic
version: 1
status: draft
title: Traffic and parking services
heading: "REQUEST FOR PROPOSAL: TRAFFIC AND PARKING SERVICES"
golden: docs/rfp-golden/traffic/rfp.md
discipline_ids: [consultant.traffic]
title_aliases: [traffic, transport, parking]
evidence_limit: "All three golden proposals priced one DA traffic report for a warehouse. Later stages appear in the golden set only as exclusions; their scope comes from practice."

thresholds:
  - {key: traffic_scale, kind: client_default, text: "Heavy vehicles, a state road or a TfNSW referral suggest complex service levels", source: "golden traffic draft v1 scale rule", verified: false}
  - {key: tfnsw_referral, kind: statutory, text: "Traffic-generating development referred to TfNSW", source: "State Environmental Planning Policy (Transport and Infrastructure) 2021 schedule; not verified against the instrument", verified: false}

field_defaults:
  pi: "$5 million"

unsupported_pathways: [planning_proposal]

scale:
  text: "Service levels are suggested complex when the use generates heavy vehicles, the site fronts or affects a state road, or the development is referred to TfNSW."
  complex:
    - {flag: [heavy_vehicles]}
    - {flag: [state_road]}
    - {flag: [tfnsw_referral]}

project_rows:
  - {key: assessment_quantities, label: Design vehicle, text: "{field:design_vehicle}", required: true, provenance: [{kind: evidence, ref: "traffic#B p1"}, {kind: client_decision, ref: "skeleton changes log 2026-10-09", why: "BG&E used a different GFA from the other firms; the project table is the single source consultants price from."}]}
  - {key: controls, label: Controls, text: "{field:lga} DCP parking rates · {pathway}", provenance: [{kind: evidence, ref: "traffic#V p1"}]}

role:
  - key: engineer
    text: "Traffic engineer for the applicant. You advise the design team on access, parking and circulation while the design develops, and prepare the traffic report the consent authority needs. Plans come from the architect in DWG and PDF."
    provenance: [{kind: evidence, ref: "traffic#8"}]

stage_intro: "Price each stage that applies as a lump sum; surveys are priced per location."

boundary:
  - {when: [{pathway: [advice_only, exempt]}, {work_type: [advisory]}], start: design_advice, end: design_advice}
  - {start: design_advice, end: travel_plan}

stages:
  - key: design_advice
    name: Parking and access advice
    items: [vehicle_schedule]
    deliverable: "Site inspection; review of plans and controls; advice on access, heavy vehicle circulation, loading and parking layout"
    fee_basis: fixed
    delivery_stage: concept_design
    shown_when: Always
    provenance: [{kind: evidence, ref: "traffic#1-7"}]
  - key: surveys
    name: Surveys
    deliverable: "Turning movement counts at {allowance:survey_locations} location(s) in peak periods representative of the use; parking occupancy and driveway counts where the brief needs them"
    fee_basis: per_unit
    delivery_stage: approval_documentation
    when: [{flag: [intersection_modelling]}]
    if_unknown: option
    assumption: "Price per location as an option: counts are needed only if intersection modelling is required."
    shown_when: Intersection modelling required
    provenance: [{kind: evidence, ref: "traffic#9-11"}]
  - key: modelling
    name: Intersection modelling
    deliverable: "SIDRA models at {allowance:sidra_locations} location(s) for the existing and proposed scenarios; model files issued"
    fee_basis: fixed
    delivery_stage: approval_documentation
    when: [{flag: [intersection_modelling]}]
    if_unknown: option
    assumption: "Price as an option: modelling is needed only if the authority or the brief requires it."
    shown_when: Intersection modelling required
    provenance: [{kind: evidence, ref: "traffic#13"}]
  - key: report
    name: Traffic and parking report
    deliverable: "Traffic generation and distribution; network impact (using the modelling stage where it applies); parking provision against the DCP and demand; access and AS 2890 compliance; swept paths for the design vehicle; pedestrian, cyclist and end-of-trip review; safety. 1 draft, 1 final"
    fee_basis: fixed
    delivery_stage: approval_documentation
    when: [{pathway: [cdc, da, ssd, planning_permit, ref, modification]}]
    shown_when: An application is lodged
    provenance: [{kind: evidence, ref: "traffic#12-28"}]
  - key: assessment_response
    name: Assessment response
    deliverable: "Up to {allowance:authority_responses} response(s) to council or TfNSW requests; {allowance:authority_meetings} meeting(s)"
    fee_basis: fixed
    delivery_stage: approval_documentation
    when: [{pathway: [da, ssd, planning_permit, modification]}]
    shown_when: DA, SSD, permit or modification; priced to the allowances
    provenance: [{kind: evidence, ref: "traffic#32-33"}]
  - key: conditions_review
    name: Conditions review
    deliverable: "Review of the traffic conditions in the consent; reply letter if needed"
    fee_basis: fixed
    delivery_stage: approval_documentation
    when: [{pathway: [da, ssd, planning_permit, modification]}]
    shown_when: A consent is expected
    provenance: [{kind: evidence, ref: "traffic#34"}]
  - key: design_review
    name: Review of the developed design
    deliverable: "Ramps, parking and loading checked against the consent conditions as the design develops or the contractor changes it; signage and line-marking submissions to the local traffic committee"
    fee_basis: fixed
    delivery_stage: construction_documentation
    default: option
    shown_when: Client opts in
    provenance: [{kind: practice, ref: "traffic-transport-guide.md DD and post-contract sections"}]
  - key: car_park_certification
    name: Car park certification
    deliverable: "Design certification of the car park, access and loading against AS 2890 for the construction certificate; completed car park certification after construction"
    fee_basis: fixed
    delivery_stage: construction_documentation
    default: option
    shown_when: Client opts in
    provenance: [{kind: practice, ref: "traffic#35 (excluded by all three firms); traffic-transport-guide.md completion"}]
  - key: ctmp
    name: Construction traffic management plan
    deliverable: "Construction traffic management plan for council approval, or review of the contractor's plan (say which in R2); traffic control plans"
    fee_basis: fixed
    delivery_stage: construction_stage_inspections
    default: option
    include_when: [{scale: [complex]}]
    shown_when: Client opts in; included for complex sites
    provenance: [{kind: practice, ref: "traffic#36 (excluded by all three firms); traffic-transport-guide.md tender section"}]
  - key: travel_plan
    name: Green travel plan
    deliverable: "Travel plan meeting the condition or DCP requirement"
    fee_basis: fixed
    delivery_stage: construction_documentation
    when: [{flag: [gtp_required]}]
    if_unknown: option
    assumption: "Price as an option: needed only if a consent condition or the DCP requires a travel plan."
    shown_when: A condition or the DCP requires it
    provenance: [{kind: practice, ref: "peer-review-2026-10-09 traffic: green travel plan from a confirmed requirement"}]

allowances:
  - {key: survey_locations, label: Survey locations, text: "{n}", owner: client, when: [{stage: [surveys]}], provenance: [{kind: evidence, ref: "traffic#9"}]}
  - {key: sidra_locations, label: Modelled intersections, text: "{n}", owner: client, when: [{stage: [modelling]}], provenance: [{kind: evidence, ref: "traffic#13"}]}
  - {key: plan_revisions, label: Plan revisions assessed, text: "{n}", default: "1", owner: client, provenance: [{kind: evidence, ref: "traffic#29"}]}
  - {key: report_drafts, label: Report drafts, text: "{n} draft, 1 final", default: "1", owner: client, provenance: [{kind: evidence, ref: "traffic#26"}]}
  - {key: design_meetings, label: Design team meetings, text: "{n}, online", default: "3", owner: client, provenance: [{kind: evidence, ref: "traffic#7"}]}
  - {key: site_inspections, label: Site inspections, text: "{n}", default: "1", owner: client, provenance: [{kind: evidence, ref: "traffic#3"}]}
  - {key: authority_responses, label: Authority responses, text: "{n}", default: "1", owner: client, when: [{stage: [assessment_response]}], provenance: [{kind: evidence, ref: "traffic#32"}]}
  - {key: authority_meetings, label: Authority meetings, text: "{n}", owner: client, when: [{stage: [assessment_response]}], provenance: [{kind: evidence, ref: "traffic#33"}]}

positions:
  - key: vehicle_schedule
    label: "Vehicle schedule (waste, emergency, service and operator vehicles); ramps, gradients, headroom, sight lines and pedestrian conflicts checked against the current architect and civil layouts"
    kind: technical
    value: I
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/traffic-transport-guide.md (evidence sweep, common failures)"}, {kind: seed, ref: "data/reference/clerk/data/seed/industrial-construction-guide.md (operational brief)"}]
  - {key: consultation, label: "Consultation with council traffic engineers and TfNSW while preparing the report", kind: technical, value: I, when: [{stage: [report]}], provenance: [{kind: evidence, ref: "traffic#27"}]}
  - {key: end_of_trip, label: "Bicycle parking and end-of-trip assessment", kind: technical, value: I, when: [{stage: [report]}], provenance: [{kind: evidence, ref: "traffic#22"}]}
  - {key: demand_reduction, label: "Parking demand reduction measures", kind: service_level, simple: O, complex: I, provenance: [{kind: evidence, ref: "traffic#16"}]}
  - {key: alternative_schemes, label: "Alternative schemes tested", kind: service_level, simple: O, complex: O, provenance: [{kind: evidence, ref: "traffic#30"}]}
  - {key: swept_paths, label: "Swept paths for every loading dock and design vehicle", kind: technical, value: I, provenance: [{kind: evidence, ref: "traffic#20"}]}
  - key: microsimulation
    label: "Microsimulation beyond SIDRA"
    kind: technical
    value: {value: O, when: [{flag: [intersection_modelling]}], else: X}
    responsible: not_required
    if_unknown: option
    assumption: "Price as an option: needed only if the authority asks for network modelling beyond SIDRA."
    provenance: [{kind: practice, ref: "traffic golden draft v1 section 5"}]
  - key: road_safety_audit
    label: "Road safety audit by an auditor independent of the design team; state its stage and scope in R2"
    kind: technical
    value: {value: O, when: [{flag: [public_road]}], else: X}
    responsible: "independent road safety auditor"
    if_unknown: option
    assumption: "Price as an option: an audit is needed only for works in a public road."
    provenance: [{kind: practice, ref: "peer-review-2026-10-09 traffic: road safety audit independence"}]
  - {key: public_road_design, label: "Design of works in the public road (signals, intersections)", kind: technical, value: X, responsible: "civil engineer (separate engagement)", provenance: [{kind: practice, ref: "traffic golden draft v1 section 5"}]}
  - {key: court, label: "Expert witness, Land and Environment Court", kind: technical, value: X, responsible: "client (separate engagement)", provenance: [{kind: evidence, ref: "traffic#37"}]}
  - {key: survey_costs, label: "Survey costs", kind: technical, value: I, when: [{stage: [surveys]}], provenance: [{kind: evidence, ref: "traffic#10"}, {kind: evidence, ref: "traffic#38"}]}

terms:
  - {key: payment_hold, text: "No commencement payment; the final report is not held back pending payment.", provenance: [{kind: evidence, ref: "traffic#40-41"}]}

returnables:
  r2: "Report, model files, swept path drawings and letters."
  r3: "Roles: Director · Senior engineer · Traffic engineer · Graduate · CAD or graphics. Per-meeting rates if you use them."
  r4: "Credentials: CPEng or RPEQ, road safety auditor level, traffic control planner."
  r5: "Traffic reports for this use, in the same LGA or state road context."
  r8: "Conflict of interest statement."
  r9: "Included is preferred."
returnable_notes:
  - {key: r7, text: "Surveys need a period representative of the use.", when: [{stage: [surveys]}]}

durations: "From the SiteWise program when it holds the stage; otherwise estimates: design advice runs alongside schematic design, surveys 2 weeks, report 3 weeks after surveys and final plans; assessment response from the program."
