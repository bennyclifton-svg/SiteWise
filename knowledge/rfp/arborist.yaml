terms:
- key: agreement
  text: Attached {field:agreement}, agreed fees/scope, numbered addenda and written acceptance govern; settle
    precedence. RFP does not authorise work; no automatic supplier terms, guarantees or asset security.
  provenance:
  - kind: evidence
    ref: arborist#10,11,14,18
  - kind: client_decision
    ref: arborist#30,32
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  replace: true
- key: authority
  text: Before extra scope/ceiling overrun or rate/fee/program change, obtain representative written authority
    with reason, scope, basis and time effect; agree delay/aborted-visit/remobilisation consequences.
  provenance:
  - kind: evidence
    ref: arborist#8,12,13,17
  - kind: client_decision
    ref: arborist#31
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  replace: true
- key: baseline
  text: Signed brief/revisions set baseline; agreed coordination, rounds, routine administration and normal development
    included. Distinguish clarification from changed design/evidence.
  provenance:
  - kind: evidence
    ref: arborist#8,12
  - kind: client_decision
    ref: arborist#31
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  replace: true
- key: errors
  text: Correct own errors without extra fee; reasonable professional skill/care within competence. Evidence limits
    do not negate agreed duties.
  provenance:
  - kind: evidence
    ref: arborist#11,15
  - kind: seed
    ref: arborist#27
  - kind: client_decision
    ref: arborist#31,32
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  replace: true
- key: payment
  text: Payment {field:payment_days} days after correct invoice for agreed services; state milestones/GST. Declare
