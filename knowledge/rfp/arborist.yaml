id: arborist
version: 2
status: draft
title: Arboricultural consulting services
heading: 'REQUEST FOR PROPOSAL: ARBORICULTURAL CONSULTING'
golden: docs/rfp-golden/arborist/rfp.md
discipline_ids:
- consultant.arborist
title_aliases:
- arborist
- arboricultural
evidence_limit: Two historical report offers differ in tree count, access and terms; neither appoints construction
  or physical tree works.
field_defaults:
  pi: ''
  pl: ''
scale:
  text: Actual trees, impacts, evidence and selected services govern every use and work type.
  complex: []
thresholds:
- key: arborist_commercial
  kind: client_default
  text: 90-day validity; 30-day payment; project-selected insurance
  source: arborist#31,32 client procurement policy
  verified: false
- key: arborist_evaluation
  kind: client_default
  text: Price40/experience20/team20/method-program10/compliance10
  source: arborist#32 client evaluation policy
  verified: false
- key: arborist_technical
  kind: evidence_estimate
  text: Historical standards, clauses and zone calculations require current instrument/edition verification
  source: arborist#5,21,28,29
  verified: false
evaluation:
- key: price
  label: Evaluated price
  default: 40
  provenance:
  - kind: client_decision
    ref: arborist#32
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
- key: experience
  label: Relevant experience
  default: 20
  provenance:
  - kind: client_decision
    ref: arborist#32
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
- key: team
  label: Team
  default: 20
  provenance:
  - kind: client_decision
    ref: arborist#32
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
- key: methodology
  label: Method/program
  default: 10
  provenance:
  - kind: client_decision
    ref: arborist#32
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
- key: compliance
  label: Compliance
  default: 10
  provenance:
  - kind: client_decision
    ref: arborist#32
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
evaluation_note: Compare equal tree counts, access, reports/visits, investigations, risk assumptions, options
  and resolved departures.
project_rows:
- key: procurement
  text: '{procurement_route}; later stages and novation require separate appointment.'
  provenance:
  - kind: seed
    ref: arborist#22
  - kind: client_decision
    ref: arborist#30
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  label: Procurement
  replace: true
- key: tree_basis
  text: Confirm survey/DWG revision, IDs/count/ownership, inaccessible trees, works/access/laydown footprints,
    services, current controls/editions and permission owner.
  provenance:
  - kind: evidence
    ref: arborist#1,3,5,7,9,13,18
  - kind: seed
    ref: arborist#21,23
  - kind: client_decision
    ref: arborist#28,29
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  label: Tree basis
role:
- key: adviser
  text: Assess scheduled trees and advise within competence. Client/approval lead obtains permissions; competent
    tree-work contractor executes pruning/removal/protection. Advice grants no permission, survival or future-safety
    guarantee; escalate urgent concerns.
  provenance:
  - kind: evidence
    ref: arborist#2,4,7,18
  - kind: seed
    ref: arborist#21,26,27
  - kind: client_decision
    ref: arborist#29
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
- key: records
  text: Coordinate survey, landscape, civil, structure and utilities; retain their design duties. Revision-controlled
    PDF/CAD plans, calculations and editable registers state observed/measured/reported/inferred basis, access
    limits, recipients and reliance.
  provenance:
  - kind: evidence
    ref: arborist#7,9
  - kind: seed
    ref: arborist#22,23,24,27
  - kind: client_decision
    ref: arborist#28,32
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
stage_intro: Written instruction/agreed inputs to named output/response end. Price once across stages and positions;
  options need written activation.
boundary:
- when:
  - work_type:
    - advisory
  start: s1_inventory
  end: s7_advisory
- start: s1_inventory
  end: s3_protection
stages:
- key: s1_inventory
  name: S1 Inventory / condition
  deliverable: 'Inspect scheduled trees: survey-linked IDs/photos, species/dimensions/measurement basis, health/structure/retention,
    root/protection zones/calculation basis, access limits/further tests. No impact report'
  fee_basis: fixed
  shown_when: Selected service within appointment
  provenance:
  - kind: evidence
    ref: arborist#1,2,3,5,7
  - kind: seed
    ref: arborist#21,23
  - kind: client_decision
    ref: arborist#28
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
- key: s2_impact
  name: S2 Concept / impact
  deliverable: Retention and footprint/access/services alternatives; impact report by design revision, per-tree/cumulative
    encroachment, pruning/removal reasons and protection; application responses to named milestone
  fee_basis: fixed
  shown_when: Selected service within appointment
  provenance:
  - kind: evidence
    ref: arborist#1,2,3,7
  - kind: seed
    ref: arborist#22
  - kind: client_decision
    ref: arborist#28,29
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  when:
  - flag:
    - arborist_tree_impacts
  if_unknown: ask
  default: option
  include_when:
  - flag:
    - arborist_impact_report
- key: s3_protection
  name: S3 Consent / protection
  deliverable: 'Conditions review and coordinated plan/method: fencing, ground protection, access/storage, excavation/services,
    monitoring/hold points, investigation dependencies and unclosed conditions'
  fee_basis: fixed
  shown_when: Selected service within appointment
  provenance:
  - kind: evidence
    ref: arborist#1,7
  - kind: seed
    ref: arborist#21,22,23,24
  - kind: client_decision
    ref: arborist#28,29
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  when:
  - flag:
    - arborist_tree_impacts
  if_unknown: ask
  default: option
  include_when:
  - flag:
    - arborist_protection_plan
- key: s4_tender
  name: S4 Tender / contractor design
  deliverable: Protection specs, hold points/responsibilities and counted RFIs; D&C design intent versus contractor
    methods/detailed advice. Post-contract/novation priced separately
  fee_basis: option
  shown_when: Selected service within appointment
  provenance:
  - kind: seed
    ref: arborist#22,23,24
  - kind: client_decision
    ref: arborist#29,30,31
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  when:
  - flag:
    - arborist_tree_impacts
  if_unknown: ask
  default: option
- key: s5_construction
  name: S5 Construction / completion
  deliverable: Scheduled protection-installation/excavation/pruning/root-zone visits; observations/departures,
    latent conditions and qualified completion statement/unresolved items. No continuous supervision or unseen-work
    certification
  fee_basis: option
  shown_when: Selected service within appointment
  provenance:
  - kind: seed
    ref: arborist#22,23,26
  - kind: client_decision
    ref: arborist#28,29,30,31
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  when:
  - flag:
    - arborist_tree_impacts
  if_unknown: ask
  default: option
- key: s6_investigation
  name: S6a Specialist investigation
  deliverable: Question, trees/samples, aerial/internal/root/soil method, specialists/equipment, access/permits,
    locating/reinstatement; written authority before intrusive work
  fee_basis: option
  shown_when: Selected service within appointment
  provenance:
  - kind: evidence
    ref: arborist#2,4,9
  - kind: seed
    ref: arborist#26
  - kind: client_decision
    ref: arborist#28,29
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  default: option
- key: s6_risk
  name: S6b Formal risk assessment
  deliverable: Formal risk question/method, trees/targets, access/testing limits, evidence cutoff/action priorities.
    Visual condition inspection does not buy formal risk
  fee_basis: option
  shown_when: Selected service within appointment
  provenance:
  - kind: evidence
    ref: arborist#2,4
  - kind: seed
    ref: arborist#27
  - kind: client_decision
    ref: arborist#28,29
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  default: option
- key: s7_advisory
  name: S7a Advisory / remediation
  deliverable: Feasibility/condition/remediation decision, cutoff/reliance, confidence/options/actions; preserve
    evidence before root attribution; structural/geotechnical specialists diagnose
  fee_basis: option
  shown_when: Selected service within appointment
  provenance:
  - kind: seed
    ref: arborist#25,26,27
  - kind: client_decision
    ref: arborist#30
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  default: option
  include_when:
  - work_type:
    - advisory
- key: s7_monitoring
  name: S7b Ongoing monitoring
  deliverable: Repeat-inspection duration/visits/triggers, responsible party and report/closure criteria; no indefinite
    obligation
  fee_basis: option
  shown_when: Selected service within appointment
  provenance:
  - kind: seed
    ref: arborist#22,23,27
  - kind: client_decision
    ref: arborist#30,31
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  default: option
- key: s7_peer
  name: S7c Independent peer review
  deliverable: Independent review of named report/question, cutoff/reliance, method/response round; advisory does
    not appoint peer review
  fee_basis: option
  shown_when: Selected service within appointment
  provenance:
  - kind: seed
    ref: arborist#27
  - kind: client_decision
    ref: arborist#28,30
    why: Explicit appointment, extent and procurement policy; historic offers do not establish universal scope
      or current requirements.
  default: option
durations: R7 sets input/access owners/dates, fieldwork, draft/review/final outputs, authority dependencies, hold-point
  notice and final response date.
