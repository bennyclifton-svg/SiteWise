id: land-surveying
version: 1
status: draft
title: Land surveying services
heading: 'REQUEST FOR PROPOSAL: LAND SURVEYING SERVICES'
golden: docs/rfp-golden/land-surveying/rfp.md
discipline_ids:
- consultant.surveyor
title_aliases:
- surveying
- surveyor
evidence_limit: Historical carpark/services offers do not establish other scopes, current insurance or legal requirements.
field_defaults:
  pi: ''
  pl: ''
scale:
  text: Purpose, extent and accuracy govern survey scope; building type alone appoints no package.
  complex: []
thresholds:
- key: survey_commercial
  kind: client_default
  text: 90-day validity; 30-day payment; project-selected insurance
  source: 'land-surveying#31,33: proposed client policy'
  verified: false
- key: survey_evaluation
  kind: client_default
  text: Price40/experience20/team20/method-program10/compliance10
  source: 'land-surveying#33: proposed client policy'
  verified: false
evaluation:
- key: price
  label: Evaluated price
  default: 40
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: experience
  label: Relevant experience
  default: 20
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: team
  label: Named team
  default: 20
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: methodology
  label: Method/program
  default: 10
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: compliance
  label: Compliance
  default: 10
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
evaluation_note: Check method/coverage, competence, insurance and departures first; normalise extent, datum/accuracy,
  access, markups and options. Lowest price need not win.
project_rows:
- key: procurement
  text: '{procurement_route}; no automatic novation or continuing builder support.'
  provenance:
  - kind: client_decision
    ref: land-surveying#25,30
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Procurement
  replace: true
- key: survey_brief
  text: Attach marked extent/features, purpose/users, title/DP/easements, dated records/conflicts, coordinate system/zone/epoch,
    vertical datum/control/transformation and accuracy by purpose.
  provenance:
  - kind: evidence
    ref: land-surveying#2,3,4,5
  - kind: seed
    ref: land-surveying#24
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Survey brief
role:
- key: survey
  text: Provide selected survey evidence; detail observations, legal boundary/title, utility detection and set-out
    are distinct purchases. Confirm task/jurisdiction competence. Fence lines or title searches are not boundary
    proof; legal adviser owns rights advice.
  provenance:
  - kind: evidence
    ref: land-surveying#2,3
  - kind: seed
    ref: land-surveying#23,24
- key: interfaces
  text: Designers own design; locator detects, surveyor captures, plumber provides sewer evidence. Name client-direct/subcontract
    work. Tank geometry is not hydraulic capacity, integrity or watertightness certification.
  provenance:
  - kind: evidence
    ref: land-surveying#5,6,7,8,9,10
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: advice
  text: For advice/defects state question, evidence cutoff and uncertainty; engineers own diagnosis, repair and
    monitoring triggers. No certification of concealed/unobserved work.
  provenance:
  - kind: seed
    ref: land-surveying#26,28,29
  when:
  - work_type:
    - advisory
    - remediation
stage_intro: From written instruction/inputs/access to named final issue/handover, with agreed query period; later
  options need instruction.
boundary:
- start: s1_plan
  end: s4_services
stages:
- key: s1_plan
  name: S1 Brief / survey plan
  deliverable: Review records/currency/conflicts; agree extent/features, method/accuracy, datum/control, access
    and hidden-feature treatment; boundary work separately selected. Deliver marked plan and input/decision schedule
  fee_basis: fixed
  provenance:
  - kind: evidence
    ref: land-surveying#2,3,4,5,6,7,8
  - kind: seed
    ref: land-surveying#23,24
  - kind: client_decision
    ref: land-surveying#30,32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  shown_when: Every appointment
- key: s2_detail
  name: S2 Detail / topographic
  deliverable: Measure selected terrain/levels, structures, retained tie-ins, trees and adjoining features; dated
    coordinated PDF/CAD with control, method/accuracy, accessible extent and missing-feature register; selected
    point cloud separately
  fee_basis: fixed
  provenance:
  - kind: evidence
    ref: land-surveying#3,4,5,6,11
  - kind: seed
    ref: land-surveying#24,27
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  shown_when: Selected survey package
  when:
  - flag:
    - survey_detail
  if_unknown: ask
- key: s3_boundary
  name: S3 Boundary / title
  deliverable: Selected searches and field boundary definition; identify discrepancies/encroachments and legal/authority
    referrals. Signed plans/report for stated task; detail survey is not boundary proof
  fee_basis: fixed
  provenance:
  - kind: evidence
    ref: land-surveying#2
  - kind: seed
    ref: land-surveying#23,24,25
  shown_when: Selected survey package
  when:
  - flag:
    - survey_boundary
  if_unknown: ask
- key: s4_services
  name: S4 Services / drainage / sewer
  deliverable: Coordinate locator/surveyor attendance; distinguish records, detected markings and exposed measurements.
    Selected pits/tanks/pipes and sewer peg-out/report by named provider/method; list authority deliverables, reconcile
    detail/stormwater overlap
  fee_basis: fixed
  provenance:
  - kind: evidence
    ref: land-surveying#4,5,6,7,8,9,10
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  shown_when: Selected survey package
  when:
  - flag:
    - survey_services
  if_unknown: ask
- key: s5_support
  name: S5 Approval / tender support
  deliverable: Scheduled supplementary/adjoining/roof/height inputs, approval plans and queries; tender datum/control/set-out
    allocation. Draft subdivision/easement/strata plans only if selected, with solicitor/authority inputs
  fee_basis: option
  provenance:
  - kind: seed
    ref: land-surveying#24,25,26
  shown_when: Optional later appointment
  default: option
- key: s6_construction
  name: S6 Set-out / checks / monitoring
  deliverable: Selected elements from current approved revisions; control/set-out records and discrepancy notices.
    Monitoring has separate baseline/locations/frequency/duration and engineer action plan. Builder protects marks/books
    before concealment; name independent checker
  fee_basis: option
  provenance:
  - kind: seed
    ref: land-surveying#23,25,26,28
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  shown_when: Optional later appointment
  default: option
- key: s7_completion
  name: S7 Completion / final plans
  deliverable: Selected identification/work-as-executed, scoped certificates and final title plans; distinguish
    measured/supplied data, dates, concealed/missed work and deviations. Name lodgement/registration payer; hand
    over records and close-out queries
  fee_basis: option
  provenance:
  - kind: seed
    ref: land-surveying#25,26
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  shown_when: Optional later appointment
  default: option
durations: R7 states input/access, fieldwork, review/final issue and option dates, booking notice and survey-currency/revisit
  triggers; approval/registration not guaranteed.
allowances_note: Complete quantities/extent before issue; return gaps and price alternatives without reducing coverage.
  Fixed fee, time ceiling or unit rate with quantity; estimated totals are not fixed fees.
allowances:
- key: features
  text: '{n} survey areas; marked plan/revision/area, contours/levels, rooms/floors, roofs/elevations, adjoining
    windows/trees; accuracy by feature'
  provenance:
  - kind: evidence
    ref: land-surveying#3,4,5
  - kind: seed
    ref: land-surveying#24,27
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Extent / features
  owner: client
- key: control
  text: '{n} control marks; datum checks, titles/lots/DPs/instruments, boundary length/points and plan/report types'
  provenance:
  - kind: evidence
    ref: land-surveying#2
  - kind: seed
    ref: land-surveying#23,24
  label: Control / cadastral
  owner: client
- key: visits
  text: '{n} visits; crew/hours/shifts, simultaneous specialists, permissions/inductions/traffic/access equipment/shutdowns
    by party'
  provenance:
  - kind: evidence
    ref: land-surveying#6,8,13,22
  label: Visits / access
  owner: client
- key: services
  text: '{n} pits; service areas/lengths/types, methods, pipe runs/tanks, exposures/depths and inaccessible-feature
    contingency'
  provenance:
  - kind: evidence
    ref: land-surveying#4,5,6,7,8,9,10
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Underground assets
  owner: client
  when:
  - stage:
    - s4_services
- key: issues
  text: '{n} PDF/CAD/data issues; point-cloud format/extent, review rounds, meetings/duration, query-hour ceiling
    and revisions'
  provenance:
  - kind: evidence
    ref: land-surveying#11
  - kind: seed
    ref: land-surveying#24
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Issues / review
  owner: client
- key: setout
