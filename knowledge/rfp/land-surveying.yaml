    ref: land-surveying#6,8,18
  - kind: seed
    ref: land-surveying#25,26
  - kind: client_decision
    ref: land-surveying#30
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: r8
  text: Current PI {field:pi}, PL {field:pl}, workers compensation as applicable; project-selected limits agreed
