  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Set-out option
  owner: client
  when:
  - stage:
    - s6_construction
- key: monitoring
  text: '{n} rounds; baseline/date, marks, frequency/duration, reports, accuracy/environmental limits and engineer
    trigger/action plan'
  provenance:
  - kind: seed
    ref: land-surveying#28,29
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Monitoring option
  owner: client
  when:
  - stage:
    - s6_construction
- key: completion
  text: '{n} plans/certificates; areas/assets, lots/units/easements, submission rounds, final data and endpoint'
  provenance:
  - kind: seed
    ref: land-surveying#25,26
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Completion / titling
  owner: client
  when:
  - stage:
    - s7_completion
