  provenance:
  - kind: evidence
    ref: land-surveying#13,14,15,16,17,18
  - kind: client_decision
    ref: land-surveying#31
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: r4
  text: Name lead/reviewer, cadastral practitioner, crew, locator/plumber, subcontractors and availability; assign
    records/permissions/access/exposure/isolation/restoration, detection/measurement/checks/interpretation/lodgement.
