id: land-surveying
version: 2
status: draft
title: Land surveying services
heading: 'REQUEST FOR PROPOSAL: LAND SURVEYING SERVICES'
golden: docs/rfp-golden/land-surveying/rfp.md
discipline_ids:
- consultant.surveyor
title_aliases:
- surveying
- surveyor
evidence_limit: Historical carpark/services offers do not establish other scopes, current insurance or legal 
  requirements.
field_defaults:
  pi: ''
  pl: ''
scale:
  text: Purpose, extent and accuracy govern survey scope; building type alone appoints no package.
  complex: []
thresholds:
- key: survey_commercial
  kind: client_default
  text: 90-day validity; 30-day payment; project-selected insurance
  source: 'land-surveying#31,33: proposed client policy'
  verified: false
- key: survey_evaluation
  kind: client_default
  text: Price40/experience20/team20/method-program10/compliance10
  source: 'land-surveying#33: proposed client policy'
  verified: false
evaluation:
- key: price
  label: Evaluated price
  default: 40
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: experience
  label: Relevant experience
  default: 20
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: team
  label: Named team
  default: 20
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: methodology
  label: Method/program
  default: 10
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: compliance
  label: Compliance
  default: 10
  provenance:
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
evaluation_note: Check method/coverage, competence, insurance and departures first; normalise extent, 
  datum/accuracy, access, markups and options. Lowest price need not win.
project_rows:
- key: procurement
  text: '{procurement_route}; no automatic novation or continuing builder support.'
  provenance:
  - kind: client_decision
    ref: land-surveying#25,30
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Procurement
  replace: true
- key: survey_brief
  text: Attach marked extent/features, purpose/users, title/DP/easements, dated records/conflicts, coordinate 
    system/zone/epoch, vertical datum/control/transformation and accuracy by purpose.
  provenance:
  - kind: evidence
    ref: land-surveying#2,3,4,5
  - kind: seed
    ref: land-surveying#24
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  label: Survey brief
role:
- key: survey
  text: Provide selected survey evidence; detail observations, legal boundary/title, utility detection and set-out 
    are distinct purchases. Confirm task/jurisdiction competence. Fence lines or title searches are not boundary 
    proof; legal adviser owns rights advice.
  provenance:
  - kind: evidence
    ref: land-surveying#2,3
  - kind: seed
    ref: land-surveying#23,24
- key: interfaces
  text: Designers own design; locator detects, surveyor captures, plumber provides sewer evidence. Name 
    client-direct/subcontract work. Tank geometry is not hydraulic capacity, integrity or watertightness 
    certification.
  provenance:
  - kind: evidence
    ref: land-surveying#5,6,7,8,9,10
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: advice
  text: For advice/defects state question, evidence cutoff and uncertainty; engineers own diagnosis, repair and 
    monitoring triggers. No certification of concealed/unobserved work.
  provenance:
  - kind: seed
    ref: land-surveying#26,28,29
  when:
  - work_type:
    - advisory
    - remediation
stage_intro: From written instruction/inputs/access to named final issue/handover, with agreed query period; later 
  options need instruction.
boundary:
- start: brief_concept
  end: brief_concept
# One table: each stage with its lines and services (owner direction, 3 November 2026).
scope_by_stage: true
stages:
- key: brief_concept
  name: Brief and concept
  lines:
  - {key: review_records_currency, text: Review records/currency/conflicts}
  - {key: agree_extent_features, text: 'agree extent/features, method/accuracy, datum/control, access and hidden-feature
      treatment'}
  - {key: boundary_work_separately, text: boundary work separately selected}
  - {key: deliver_marked_plan, text: Deliver marked plan and input/decision schedule}
  - {key: measure_selected_terrain, text: 'Measure selected terrain/levels, structures, retained tie-ins, trees and adjoining
      features', when: [flag: [survey_detail]], if_unknown: ask}
  - {key: dated_coordinated_pdf, text: 'dated coordinated PDF/CAD with control, method/accuracy, accessible extent and
      missing-feature register', when: [flag: [survey_detail]], if_unknown: ask}
  - {key: selected_point_cloud, text: selected point cloud separately, when: [flag: [survey_detail]], if_unknown: 
      ask}
  - {key: selected_searches_field, text: Selected searches and field boundary definition, when: [flag: [
            survey_boundary]], if_unknown: ask}
  - {key: identify_discrepancies_encroachments, text: identify discrepancies/encroachments and legal/authority 
      referrals, when: [flag: [survey_boundary]], if_unknown: ask}
  - {key: signed_plans_report, text: Signed plans/report for stated task, when: [flag: [survey_boundary]], 
      if_unknown: ask}
  - {key: detail_survey_is, text: detail survey is not boundary proof, when: [flag: [survey_boundary]], if_unknown: 
      ask}
  - {key: coordinate_locator_surveyor, text: Coordinate locator/surveyor attendance, when: [flag: [survey_services]],
    if_unknown: ask}
  - {key: distinguish_records_detected, text: 'distinguish records, detected markings and exposed measurements', 
      when: [flag: [survey_services]], if_unknown: ask}
  - {key: selected_pits_tanks, text: Selected pits/tanks/pipes and sewer peg-out/report by named provider/method, 
      when: [flag: [survey_services]], if_unknown: ask}
  - {key: list_authority_deliverables, text: 'list authority deliverables, reconcile detail/stormwater overlap', 
      when: [flag: [survey_services]], if_unknown: ask}
