  provenance:
  - kind: evidence
    ref: land-surveying#21
  - kind: seed
    ref: land-surveying#23
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: r9
  text: 'Searches, locator/plumber, authority/lodgement, travel/parking, traffic/access/safety, exposure/isolation/restoration
