terms:
- key: agreement
  text: Agree {field:agreement}, version/precedence and departures before instruction. Supplier terms, personal
    liability and non-solicitation require express agreement.
  provenance:
  - kind: evidence
    ref: land-surveying#19
  - kind: client_decision
    ref: land-surveying#30,31,32,33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
  required: true
- key: authority
  text: Written authority before extra scope/quantities/ceilings/fees/program changes; state cause, alternatives
    and effects. Site dockets alone do not authorise variations. Stop unsafe affected work, notify; agree handback/standby/remobilisation.
  provenance:
  - kind: evidence
    ref: land-surveying#14,15,16,22
  - kind: client_decision
    ref: land-surveying#31
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: baseline
  text: Information, extent/feature/method/allowance schedules, stages and addenda set the baseline; agreed development/review
    is included.
  provenance:
  - kind: client_decision
    ref: land-surveying#30,31
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: payment
  text: Correct invoices for completed work payable within {field:payment_days} days, subject to agreement/applicable
    requirements. Disclose advance payment, withholding, interest, suspension/cancellation departures.
  provenance:
  - kind: evidence
    ref: land-surveying#16,17,18
  - kind: client_decision
    ref: land-surveying#31
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: rates
  text: Disclose minimums/standby/after-hours and agreed escalation mechanism; no automatic annual increase.
  provenance:
  - kind: evidence
    ref: land-surveying#13,14,15,16,18
  - kind: client_decision
    ref: land-surveying#31
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: records
  text: Dated/revisioned PDFs and agreed editable CAD/data; datum/units/methods/accuracy, measured versus inferred
    and missing features. Agree project distribution licence, separate reliance, confidentiality/security, retention
    and handover.
  provenance:
  - kind: evidence
    ref: land-surveying#11,20
  - kind: seed
    ref: land-surveying#24,26,29
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
- key: professional
  text: Manage resources/subcontractors; notify substitutions/conflicts/insurance changes. Disclose caps/indemnities/time
    bars/loss exclusions/novation/IP. Agree notice/cure, completed-work costs, handback/records, dispute negotiation/mediation
    and urgent relief.
  provenance:
  - kind: evidence
    ref: land-surveying#19,20,21,22
  - kind: client_decision
    ref: land-surveying#33
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
returnable_notes:
- key: r1
  text: Price stages/options separately, basis/quantity/GST/dependencies; base/options/alternative totals. No detail/stormwater/locator
    double count. Validity/milestones, addenda acknowledged; authorised signatory.
  provenance:
  - kind: evidence
    ref: land-surveying#9,12,13,14,15,16,17,18
  - kind: client_decision
    ref: land-surveying#30,31
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: r2
  text: 'Selected plans/certificates, CAD/PDF/cloud/data, datum/accuracy, detection/sewer, missing features, set-out/as-built/monitoring
    and title records: purpose, editability, recipient, dates/rounds, reliance/limits.'
  provenance:
  - kind: evidence
    ref: land-surveying#11,20
  - kind: seed
    ref: land-surveying#24,25,26
  - kind: client_decision
    ref: land-surveying#32
    why: Apply the proposed client scope and pricing boundary; historical supplier terms are not adopted.
  replace: true
- key: r3
  text: Extra visits/hours/features/areas/pits/plans, travel/minimums, control replacement, standby/cancellation/after-hours/equipment/repeats;
