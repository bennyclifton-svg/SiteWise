  if_unknown: ask
  default: option
- key: s8_advisory
  name: S8 Advisory / operational
  deliverable: 'Defined audit/inclusive brief: sampling, evidence cutoff, user consultation, sensory/cognitive needs,
    priorities/actions and operator commitments. Operational plan cannot replace physical compliance or accepted
    solution'
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: access#13,20
  - kind: seed
    ref: access#36
  - kind: client_decision
    ref: access#38,39,40
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
  - kind: client_decision
    ref: access#36
    why: Separate operational/inclusive objectives from compliance and limit advice to defined evidence, sampling
      and reliance; no discrimination-immunity promise.
  default: option
  include_when:
