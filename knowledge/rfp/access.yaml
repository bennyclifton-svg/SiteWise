  if_unknown: ask
- key: s5_tender
  name: S5 Tender support
  deliverable: Review agreed tender access documents and counted queries; D&C design-intent/contractor duties explicit.
    Access review does not prepare architectural design
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: access#28
  - kind: seed
    ref: access#32
  - kind: client_decision
    ref: access#40,41,42
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
