  name: S6 Post-contract review
  deliverable: 'Separately appointed contractor details/substitutions: tactile indicators, doors, fixtures, signs/lifts;
    effects on earlier reports/solutions and reassessment. No automatic novation'
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: access#20
  - kind: seed
    ref: access#32
  - kind: client_decision
    ref: access#37,39,40,41
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
