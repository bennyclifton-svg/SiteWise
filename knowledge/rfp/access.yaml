evaluation_note: Compare equivalent stages, counts, evidence and dependencies before price; DA, design and completion
  appointments differ. Lowest fee need not win.
project_rows:
- key: procurement
  text: '{procurement_route}; no automatic later appointment or novation.'
  provenance:
  - kind: seed
    ref: access#32
  - kind: client_decision
    ref: access#40
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
  label: Procurement
  replace: true
- key: access_basis
  text: Confirm uses/classes by part, affected access chain and tenant/operator boundaries; current jurisdiction/editions,
    housing targets and mandatory versus voluntary objectives. Attach measured evidence, approvals, conditions and
    gaps.
  provenance:
  - kind: seed
    ref: access#31,33,34
  - kind: client_decision
    ref: access#37,38,40,42
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
  - kind: client_decision
    ref: access#34
    why: Apply residential renovation evidence principles to other existing-building uses without inventing an automatic
      legal upgrade trigger.
  label: Assessment basis
role:
- key: adviser
  text: Access advice from written instruction/agreed inputs to named final output and response-round end. Architect/specialists
    retain design; BCA adviser coordinates code; independent statutory certifier decides approval. No approval or
    discrimination-immunity guarantee.
  provenance:
  - kind: evidence
    ref: access#13,20
  - kind: seed
    ref: access#31,36
  - kind: client_decision
    ref: access#39,40
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
  - kind: client_decision
    ref: access#36
    why: Separate operational/inclusive objectives from compliance and limit advice to defined evidence, sampling
      and reliance; no discrimination-immunity promise.
- key: records
  text: Dated PDFs/mark-ups and editable issues, assumptions, solutions and evidence registers; locations, input
    revisions, owners/dates and closure proof. Coordinate architecture, landscape/civil, services/AV, lifts, fire,
    BCA and operator.
  provenance:
  - kind: evidence
    ref: access#14,15
  - kind: seed
    ref: access#32,33
  - kind: client_decision
    ref: access#37,39,42
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
stage_intro: Select base, options and end boundary; advice-only ends at its report/response round. Later work needs
  written activation.
boundary:
- when:
  - work_type:
    - advisory
  start: s1_inception
  end: s8_advisory
- start: s1_inception
  end: s4_approval
stages:
- key: s1_inception
  name: S1 Inception / evidence
  deliverable: Agree brief/basis; inspect agreed existing routes, separate observed/measured/reported facts; route
    map/photos, inaccessible areas, upgrade questions and prioritised actions
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: access#2,8
  - kind: seed
    ref: access#31,34,35,36
  - kind: client_decision
    ref: access#37,42
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
  - kind: client_decision
    ref: access#35
    why: Access repair advice relies on specialist defect diagnosis and does not assume structural, waterproofing
      or hazardous-material design.
  - kind: client_decision
    ref: access#34
    why: Apply residential renovation evidence principles to other existing-building uses without inventing an automatic
      legal upgrade trigger.
  - kind: client_decision
    ref: access#36
    why: Separate operational/inclusive objectives from compliance and limit advice to defined evidence, sampling
      and reliance; no discrimination-immunity promise.
- key: s2_concept
  name: S2 Concept advice
  deliverable: 'Mark access-chain barriers/options: arrival/parking, entries/levels, routes, lifts and facilities;
    flag solution candidates and required versus voluntary improvements'
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: access#1,14
  - kind: seed
    ref: access#32
  - kind: client_decision
    ref: access#37,38,39
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
  when:
