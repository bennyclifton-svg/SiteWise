  if_unknown: ask
- key: s4_approval
  name: S4 Construction approval
  deliverable: Review conditions and coordinated drawings/specs; preliminary mark-ups/final access report, close
    earlier findings and schedule product/measurement evidence. Solution preparation separate
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: access#15,19,28
  - kind: seed
    ref: access#32
  - kind: client_decision
    ref: access#39
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
  when:
