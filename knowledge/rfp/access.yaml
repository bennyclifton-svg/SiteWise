- key: s7_completion
  name: S7 Construction / completion
  deliverable: Counted hold-point visits, pre-final/final audits and close-out; location/photos, test/product/as-built
    evidence and solution conditions. Qualified opinion only for inspected scope; outstanding gaps explicit; certifier
    decides occupation
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: access#4,20
  - kind: seed
    ref: access#32,35
  - kind: client_decision
    ref: access#39,42
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
