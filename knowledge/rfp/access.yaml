  name: S3 Planning report
  deliverable: Preliminary/final drawing review; BCA/architect liaison, draft/final access report and unresolved
    register. Submission ends stage unless authority responses through determination quantified
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: access#1,14,28
  - kind: seed
    ref: access#31,32
  - kind: client_decision
    ref: access#41
    why: Client selects explicit extent, quantities and appointment terms; historical offers and capabilities do
      not establish included work or current statutory requirements.
  when:
