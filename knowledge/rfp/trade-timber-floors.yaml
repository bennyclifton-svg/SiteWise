role:
  - key: contractor
    text: "You are the timber flooring contractor. Your job is to lay, sand and coat the timber floors the documents show over a dry, sound substrate, so they stay flat and quiet without gapping or cupping."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Timber flooring (solid and engineered))"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Test the slab or subfloor for moisture and acclimatise the boards on site as the supplier directs before you lay.
      - Protect finished floors from the trades that follow you.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Timber flooring (solid and engineered))"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 6: Internal painting before flooring)"}]

