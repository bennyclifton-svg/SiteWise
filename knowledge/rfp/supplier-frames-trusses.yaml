id: supplier-frames-trusses
version: 1
status: draft
kind: works
title: "Frames and trusses"
heading: "REQUEST FOR TENDER: FRAMES AND TRUSSES"
discipline_ids: [supplier.frames_trusses]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One supply package."
  complex: []

role:
  - key: contractor
    text: "You are the frame and truss supplier. Your job is to design, detail, make and deliver the prefabricated wall frames and roof trusses the documents show, engineered for the site's wind classification and loads, with the layouts and certificates the builder and certifier need."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Structural Framing Systems)"}, {kind: seed, ref: "data/reference/clerk/data/seed/procurement-quoting-guide.md (4. Residential-typical trade scopes and scope traps)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Give the framing carpenter the layouts, bracing, tie-down and girder connection details they erect to.
      - Provide the design certificate for the frames and trusses that the certifier asks for.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/structural-residential.md (Connection and tie-down requirements)"}, {kind: seed, ref: "data/reference/clerk/data/seed/structural-residential.md (Frame inspection gate)"}]

stage_intro: "A supply-only tender excludes the installation lines."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

stages:
  - key: design
    name: "Design and layouts"
    lines:
      - {key: layouts, text: "Frame and truss layouts from the architectural and structural documents, for the design team's review"}
      - {key: design, text: "Frame and truss design for the site's wind classification and the loads the documents show"}
      - {key: details, text: "Bracing, tie-down and girder truss connection details for the installer"}
    fee_basis: fixed
    delivery_stage: design_finalisation
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Structural Framing Systems)"}, {kind: seed, ref: "data/reference/clerk/data/seed/structural-residential.md (Connection and tie-down requirements)"}]
  - key: establishment
    name: "Preliminaries and attendance"
    lines:
