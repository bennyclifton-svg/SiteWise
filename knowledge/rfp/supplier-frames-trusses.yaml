    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Structural Framing Systems)"}]
  - key: handover
    name: "Warranties and records"
    lines:
      - {key: certificates, text: "Design certificate and compliance documents for the frames and trusses"}
      - {key: instructions, text: "Installation, bracing and handling instructions"}
      - {key: records, text: "Layouts as supplied, and warranties"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/structural-residential.md (Frame inspection gate)"}, {kind: seed, ref: "data/reference/clerk/data/seed/setup-and-commission-guide.md"}]

