    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}]
  - key: manufacture
    name: "Selection and manufacture"
    lines:
      - {key: check, text: "Check of the slab and floor set-out before manufacture"}
      - {key: timber, text: "Framing timber and engineered members of the grade and durability the design calls for"}
      - {key: fabricate, text: "Prefabricated wall frames and nailplated roof trusses, marked to the layout"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Structural Framing Systems)"}, {kind: seed, ref: "data/reference/clerk/data/seed/procurement-quoting-guide.md (4. Residential-typical trade scopes and scope traps)"}]
  - key: delivery
    name: "Delivery to site"
    lines:
