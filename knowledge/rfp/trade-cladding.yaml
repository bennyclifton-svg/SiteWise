id: trade-cladding
version: 1
status: draft
kind: works
title: "Cladding"
heading: "REQUEST FOR TENDER: CLADDING"
discipline_ids: [trade.cladding]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the cladding contractor. Your job is to install the wall wrap, cavity and external cladding the documents show, with their flashings, joints and fixings, weathertight and of materials the documents' fire and bushfire requirements allow, on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Building Envelope and Weatherproofing)"}, {kind: seed, ref: "data/reference/clerk/data/seed/ncc-reference-guide.md (Cladding Combustibility Requirements)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Give the test evidence that the cladding, wrap and cavity materials meet the documents' fire requirements before you order them.
      - Present the wrap and flashings for the head contractor's inspection before the cladding covers them.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/ncc-reference-guide.md (Facade and External Wall Fire Safety)"}, {kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Building Envelope and Weatherproofing)"}]

stage_intro: "A supply-only tender excludes the installation lines."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

