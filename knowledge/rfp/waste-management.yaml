terms:
- key: agreement
  text: Engage under {field:agreement}, scope/fees, addenda and written acceptance; agree precedence and R6 departures
    before work. No implied acceptance through supplier forms or correspondence.
  provenance:
  - kind: evidence
    ref: waste-management#5,9,19,28,29,30,31
  - kind: client_decision
    ref: waste-management#43,45
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  replace: true
- key: authority
  text: Obtain written authority before extras, ceiling/allowance overruns or fee/time changes; give cause, deliverable,
    price/basis and program effect.
  provenance:
  - kind: evidence
    ref: waste-management#15,24,26,28
  - kind: client_decision
    ref: waste-management#43
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  replace: true
- key: baseline
  text: Sign-off sets baseline; normal development and own-error correction included. Distinguish included clarification
    from changed design/process/evidence; agree delay/remobilisation.
  provenance:
  - kind: evidence
    ref: waste-management#3,8,15,24,26
  - kind: client_decision
    ref: waste-management#43
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  replace: true
