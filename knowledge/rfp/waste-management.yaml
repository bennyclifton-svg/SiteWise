role:
  - key: adviser
    text: "You are the waste consultant. Your job is to make sure the building's waste can be stored, sorted and collected safely and efficiently, during construction and in use, and that it meets council's requirements."
    provenance: [{"kind": "evidence", "ref": "waste-management#4,12,16,23,25"}, {"kind": "seed", "ref": "waste-management#32,37,38"}, {"kind": "client_decision", "ref": "waste-management#40,41,42,44", "why": "Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or current requirements."}, {"kind": "client_decision", "ref": "waste-management#37", "why": "Apply remediation evidence principles to waste extent; waste adviser does not diagnose defects or contamination."}, {"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: section 2 opens with what the consultant is engaged to achieve and how; the same on every project, with one sentence by building type."}]
  - key: duties
    text: |-
      To do this you:
      - Set waste volumes, bin numbers and storage areas early, so the architect can plan for them.
      - Confirm how collection vehicles reach and service the bins.
      - Prepare the waste management plans this appointment selects.
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: section 2 opens with what the consultant is engaged to achieve and how; the same on every project, with one sentence by building type."}]
  - key: fit_apartments
    text: "For the apartments, this includes chutes or bin rooms on each floor, and a collection point the collection trucks can reach."
    when: [{"class": ["2"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_commercial
    text: "For the office or retail space, this includes separate tenant waste streams, including food waste."
    when: [{"class": ["5", "6"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_industrial
    text: "For the warehouse or factory, this includes the operation's process waste."
    when: [{"class": ["7b", "8"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_health
    text: "For the health building, this includes clinical and other controlled waste."
    when: [{"class": ["9a"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: boundary
    text: "Your advice runs from our written instruction and agreed inputs to the output and response round we name. The contractor implements the plan; the operator contracts collections; specialists classify controlled waste; the traffic engineer tests vehicle access. You do not guarantee approval, facility acceptance, diversion or savings."
    provenance: [{"kind": "evidence", "ref": "waste-management#4,12,16,23,25"}, {"kind": "seed", "ref": "waste-management#32,37,38"}, {"kind": "client_decision", "ref": "waste-management#40,41,42,44", "why": "Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or current requirements."}, {"kind": "client_decision", "ref": "waste-management#37", "why": "Apply remediation evidence principles to waste extent; waste adviser does not diagnose defects or contamination."}]
  - key: records
    text: "Issue revision-controlled PDFs, plans, calculations and editable registers that record input revisions, units, sources and dates, assumptions, owners and due dates, recipients and reliance, and close-out evidence. Keep observed, reported and estimated conditions separate."
    provenance: [{"kind": "evidence", "ref": "waste-management#17,18,22,25"}, {"kind": "seed", "ref": "waste-management#38"}, {"kind": "client_decision", "ref": "waste-management#39,44", "why": "Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or current requirements."}]
