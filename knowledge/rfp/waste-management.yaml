  text: 90-day validity, 30-day payment; project-selected insurance
  source: waste-management#43,45 client procurement policy
  verified: false
- key: evaluation
  kind: client_default
  text: Price40/experience20/team20/method10/compliance10
  source: waste-management#45 client procurement policy
  verified: false
