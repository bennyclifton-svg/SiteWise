    - new
    - refurb
    - extend
    - remediation
  if_unknown: ask
- key: s5_tender
  name: S5 Tender support
  deliverable: Functional criteria, selected plan updates, waste targets/tracking clauses and counted RFIs. D&C design
    intent and contractor selections/detailed-design duties explicit; no daily waste management
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: waste-management#25
  - kind: seed
    ref: waste-management#33
  - kind: client_decision
    ref: waste-management#40,41,42,43,44
