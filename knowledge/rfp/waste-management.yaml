  if_unknown: ask
  default: option
- key: s8_advisory
  name: S8 Advisory review
  deliverable: 'Defined advice/audit/options/cost decision: evidence cutoff, sampling/inspection limits, calculations/confidence,
    reliance and prioritised actions; independent peer/expert evidence separately selected'
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: evidence
