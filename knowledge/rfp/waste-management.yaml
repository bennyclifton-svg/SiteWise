evaluation_note: Compare equivalent plans, stage ends, equipment/traffic interfaces, counts and exclusions before price;
  lowest fee need not win.
project_rows:
- key: procurement
  text: '{procurement_route}; no automatic later appointment or novation.'
  provenance:
  - kind: seed
    ref: waste-management#33
  - kind: client_decision
    ref: waste-management#42
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  label: Procurement
  replace: true
- key: waste_basis
  text: Confirm actual uses/occupancy/activity by part, streams, dated quantities/rates, local controls/conditions and
    mandatory versus voluntary targets; existing contracts, collection vehicles/frequency, rights and gaps. Building
    labels and absent records prove neither zero waste nor adequate collection.
  provenance:
  - kind: evidence
    ref: waste-management#17,18,22,25
  - kind: seed
    ref: waste-management#32,34,35
  - kind: client_decision
    ref: waste-management#39,42
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  - kind: client_decision
    ref: waste-management#35
    why: Apply mixed-use tenancy and staged-handover principles to waste services without substituting dominant-use assumptions.
  label: Waste basis
role:
- key: adviser
  text: Selected waste advice from written instruction/agreed inputs to named final output and response round. Contractor
    implements; operator contracts collections; specialists classify controlled waste; traffic tests access. No approval,
    facility acceptance, diversion or savings guarantee.
  provenance:
  - kind: evidence
    ref: waste-management#4,12,16,23,25
  - kind: seed
    ref: waste-management#32,37,38
  - kind: client_decision
    ref: waste-management#40,41,42,44
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  - kind: client_decision
    ref: waste-management#37
    why: Apply remediation evidence principles to waste extent; waste adviser does not diagnose defects or contamination.
- key: records
  text: 'Revision-controlled PDFs/plans/calculations and editable registers: input revisions, units/source/date, assumptions,
    owners/dates, recipients/reliance and closure evidence. Separate observed, reported and estimated conditions.'
  provenance:
  - kind: evidence
    ref: waste-management#17,18,22,25
  - kind: seed
    ref: waste-management#38
  - kind: client_decision
    ref: waste-management#39,44
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
stage_intro: Select base/options and named end; operational and C&D plans are separate purchases. Later work needs written
  activation.
boundary:
- when:
  - work_type:
    - advisory
  start: s1_inception
  end: s8_advisory
- start: s1_inception
  end: s3_cd
stages:
- key: s1_inception
  name: S1 Inception / evidence
  deliverable: 'Brief, local controls/consents, operator arrangements and agreed visits; input gaps, stream/stakeholder
    schedule and responsibility map. Existing work: photos, retained/removed extent and safe access; remediation follows
    specialist diagnosis'
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: waste-management#1,17,18,22,25
  - kind: seed
    ref: waste-management#32,36,37,38
  - kind: client_decision
    ref: waste-management#39,40
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  - kind: client_decision
    ref: waste-management#36
    why: Extend renovation evidence and live-occupancy principles to other existing uses; specialist investigation remains
      separate.
  - kind: client_decision
    ref: waste-management#37
    why: Apply remediation evidence principles to waste extent; waste adviser does not diagnose defects or contamination.
- key: s2_concept
  name: S2 Operational concept
  deliverable: 'Actual-use/stream generation and auditable bins/storage: frequency, peaks/contingency, bulky/green waste,
    rooms/routes/chutes and collection points. Compare feasibility before space is fixed'
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: waste-management#2,6,7,11,17,22
  - kind: seed
    ref: waste-management#33,34,35
  - kind: client_decision
    ref: waste-management#39,41
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  - kind: client_decision
    ref: waste-management#35
    why: Apply mixed-use tenancy and staged-handover principles to waste services without substituting dominant-use assumptions.
  when:
  - flag:
    - waste_operational
  if_unknown: ask
- key: s3_operational
  name: S3 Operational plan
  deliverable: 'Separate operational WMP: calculations, annotated rooms/routes/collection layout and management duties;
    scheduled drafts, council forms/consultation/responses to named milestone. Confirm operator acceptance owner/date'
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: waste-management#2,6,7,11,17,22,26
  - kind: seed
    ref: waste-management#32,33
  - kind: client_decision
    ref: waste-management#39,41,43
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  when:
  - flag:
    - waste_operational
  if_unknown: ask
- key: s3_cd
  name: S3 C&D plan
  deliverable: 'Separate demolition/construction WMP: supplied quantities/estimating party by stream, segregation/storage,
    reuse/recycling/disposal pathways and tracking evidence. Confirm contractor processes/destinations later if unavailable;
    no hazardous audit'
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: waste-management#1,12,18,24,25
  - kind: seed
    ref: waste-management#32,36,37
  - kind: client_decision
    ref: waste-management#40,43
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  - kind: client_decision
    ref: waste-management#36
    why: Extend renovation evidence and live-occupancy principles to other existing uses; specialist investigation remains
      separate.
  - kind: client_decision
    ref: waste-management#37
    why: Apply remediation evidence principles to waste extent; waste adviser does not diagnose defects or contamination.
  when:
  - flag:
    - waste_cd
  if_unknown: ask
- key: s4_review
  name: S4 Consent / design review
  deliverable: Conditions and design changes checked against selected plans; space, routes, wash-down/drainage, ventilation/security
    and fire/acoustic interfaces. Assign/close actions; equipment drawings separately commissioned
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: waste-management#7,13,16,18,23,26
  - kind: seed
    ref: waste-management#33,34
  - kind: client_decision
    ref: waste-management#41
    why: Explicit extent, evidence and appointment policy; historic offers do not establish universal scope, rates or
      current requirements.
  when:
