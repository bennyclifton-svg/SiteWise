      - {key: chairs, text: "Bar chairs, spacers and tie wire that hold the specified cover"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS/NZS 4671 — Steel Reinforcing Materials)"}, {kind: seed, ref: "data/reference/clerk/data/seed/multi-residential-apartments-guide.md (Quality Hold Points for Apartment Construction)"}]
  - key: fixing
    name: "Fixing"
    lines:
