      - {key: shop_drawings, text: "Reinforcement shop drawings for the engineer's review where the specification asks for them"}
    fee_basis: fixed
    delivery_stage: design_finalisation
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS/NZS 4671 — Steel Reinforcing Materials)"}]
  - key: establishment
    name: "Preliminaries and attendance"
    lines:
