scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the steel fixing contractor. Your job is to supply and fix the reinforcement the engineer's drawings show, with the right size, spacing, laps and cover, ready for the pre-pour inspection, safely and on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS/NZS 4671 — Steel Reinforcing Materials)"}, {kind: seed, ref: "data/reference/clerk/data/seed/multi-residential-apartments-guide.md (Quality Hold Points for Apartment Construction)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Supply reinforcement that complies with the specified standard, with the supplier's certificates.
      - Attend the reinforcement inspection and fix what it finds before the pour.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS/NZS 4671 — Steel Reinforcing Materials)"}, {kind: seed, ref: "data/reference/clerk/data/seed/structural-residential.md (Inspection and evidence gates)"}]

stage_intro: "Price each stage of your works; a line marked Excluded is by others or not part of this tender."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

