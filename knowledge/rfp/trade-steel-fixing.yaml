      - {key: records, text: "Delivery dockets and the inspection records for each pour"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS/NZS 4671 — Steel Reinforcing Materials)"}]

