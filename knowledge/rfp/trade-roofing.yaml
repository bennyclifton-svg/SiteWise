role:
  - key: contractor
    text: "You are the roofer. Your job is to lay the sarking, battens and roof covering the documents show, with their ridges, hips, valleys and roof flashings, weathertight and to the manufacturer's instructions, on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 1: Frame to roof)"}, {kind: seed, ref: "data/reference/clerk/data/seed/procurement-quoting-guide.md (4. Residential-typical trade scopes and scope traps)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Start only once the frame inspection certificate has been sighted.
      - Agree penetrations and flashings with the roof plumber before the roof is covered.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 1: Frame to roof)"}]

