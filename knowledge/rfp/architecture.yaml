# Architecture RFP (docs/rfp-golden/architecture/rfp.md v3, owner-approved
# 2026-10-09), repaired per the 2026-10-09 peer review (Phase A): appointment
# boundary, separate traditional / D&C / post-novation deliverables, fee basis
# per row, one canonical position per item, regulated design as a decision,
# technical items selected by facts rather than class. See
# docs/rfp-golden/phase-a-changes.md. Draft until the owner reviews it.
id: architecture
version: 2
status: draft
title: Architectural services
heading: "REQUEST FOR PROPOSAL: ARCHITECTURAL SERVICES"
golden: docs/rfp-golden/architecture/rfp.md
discipline_ids: [consultant.architect]
title_aliases: [architect, architectural, architecture]
evidence_limit: "Three proposals: a masterplan and staged camp (AJC), a fitout (nettletontribe) and the Arthur St warehouse
  DA (PACE). Construction-phase and post-novation scope comes from practice."

thresholds:
- {key: budget_complex, kind: client_default, text: "A construction budget over $20 million suggests complex service levels",
  source: "golden architecture draft v3 scale rule; client preference", verified: false}
- {key: dbp_regime, kind: statutory, text: "NSW regulated-design regime applies to the affected work", source: "Design
    and Building Practitioners Act 2020 (NSW) and Regulation; NSW guidance: existing Class 3 and 9c alteration enters
    the regime from 1 July 2028, with exemptions. Not verified against the instrument.", verified: false}

field_defaults:
  pi: "$20 million"
# A house falls back to the shared client default (skeleton insurance_limits):
# the owner gave no house amounts on 13 October 2026.
field_defaults_when:
- when: [module: [house]]
  values: {pi: "$10 million"}
  provenance: [{kind: client_decision, ref: "knowledge/rfp/skeleton.yaml#insurance_limits", why: "Owner 2026-10-13: the
        architect carries PI and PL; no house amount given, so the shared default applies instead of the commercial $20
        million."}]
required_facts: [budget]

scale:
  text: "Service levels (BIM detail, renders, specification, typical interiors) are suggested complex for a Class 2-6
    or 9 part, a budget over $20 million, or a heritage site. Technical scope does not follow this scale."
  complex:
  - {class: ["2", "3", "4", "5", "6", 9a, 9b, 9c]}
  - {budget_over: ["20000000"]}
  - {flag: [heritage]}

role:
  - key: lead
    text: "You are the lead designer. You turn the client's brief, the site and the project's constraints into one coordinated design that meets the brief, fits the budget, gains approval, complies, and can be built and maintained."
    provenance: [{"kind": "evidence", "ref": "architecture#147"}, {"kind": "evidence", "ref": "architecture#148"}, {"kind": "evidence", "ref": "architecture#158"}, {"kind": "client_decision", "ref": "docs/plans/2026-10-13-house-rfp-brief.md", "why": "Owner 2026-10-13: the client engages each consultant directly or the architect engages it as a subconsultant; the RFP says which."}, {"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: section 2 opens with what the consultant is engaged to achieve and how; the same on every project, with one sentence by building type."}]
  - key: duties
    text: |-
      To do this you:
      - Resolve the brief spatially: test it against the site, the planning controls and the budget, and tell the client early where they conflict.
      - Lead and integrate the design team: set the design program, bring in each consultant's input, resolve clashes and issue one coherent set of documents. Each consultant remains responsible for its own work.
      - Use your judgement: recommend options rather than only presenting them, and state what each decision means for cost, approval, risk and buildability.
      - Keep the design intent through to the end of your appointment.
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: section 2 opens with what the consultant is engaged to achieve and how; the same on every project, with one sentence by building type."}]
  - key: fit_house
    text: "For this house, fit for purpose means a home that suits how the owners will live in it, on their site and within their budget."
    when: [{"module": ["house"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_apartments
    text: "For the apartments, fit for purpose means the apartment mix and yield, and residential amenity: solar access, cross-ventilation, apartment sizes and storage."
    when: [{"class": ["2"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_apartments_nsw
    text: "In NSW that amenity is measured against the Apartment Design Guide. You provide the design verification statement as a registered architect, and design compliance declarations as a regulated designer."
    when: [{"class": ["2"], "state": ["NSW"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}, {"kind": "practice", "ref": "Apartment Design Guide; Environmental Planning and Assessment Regulation (design verification statement); Design and Building Practitioners Act 2020 (NSW); named from practice, not verified against the instrument"}]
  - key: fit_accommodation
    text: "For the residential accommodation, fit for purpose means the room mix and yield, guest or resident amenity, acoustic separation between rooms, and a back of house that runs well."
    when: [{"class": ["3"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_commercial
    text: "For the office or retail space, fit for purpose means efficient, flexible floor plates, clear tenancy boundaries, and base-building services that tenants can fit out."
    when: [{"class": ["5", "6"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_industrial
    text: "For the warehouse or factory, fit for purpose means a layout that suits the operation: clear heights, loading, vehicle movements and room to expand."
    when: [{"class": ["7b", "8"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_health
    text: "For the health building, fit for purpose means clinical and patient flows, infection control and the operator's functional brief."
    when: [{"class": ["9a"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_assembly
    text: "For the assembly or education building, fit for purpose means how large groups gather and move, sightlines and acoustics, and safe crowd egress."
    when: [{"class": ["9b"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_care
    text: "For the residential care building, fit for purpose means resident dignity and safety, clear staff supervision, and care that works day and night."
    when: [{"class": ["9c"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_existing
    text: "Because this is work to an existing building, fit for purpose also means working with what is there: its structure, services, approvals and occupants."
    when: [{"module": ["existing_building"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_heritage
    text: "On a heritage item or in a conservation area, the design must also respect the heritage significance the heritage advice identifies."
    when: [{"flag": ["heritage"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: subconsultants
    text: "{engagement}"
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-10-13-house-rfp-brief.md", "why": "Owner 2026-10-13: the client engages each consultant directly or the architect engages it as a subconsultant; the RFP says which."}]
  - key: novation
    text: "After novation you are engaged by the head contractor. Price the stages before and after novation separately."
    when: [{"novation": ["yes"]}]
    provenance: [{"kind": "evidence", "ref": "architecture#131"}]
  - key: novation_option
    text: "Under design and construct the client may elect to novate this appointment to the head contractor after the tender, or not. Price design finalisation and the delivery-phase services as a separate option; the client decides later whether to take it up."
    when: [{"novation": ["option"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-10-11-procurement-default-disciplines.md#decisions", "why": "Owner 2026-10-11: D&C does not mean novated; novation is elected later."}]
  - key: dnc_handover
    text: "After the design and construct tender the contractor's own designers complete the design. Your appointment ends at the handover described for the D&C tender stage."
    when: [{"procurement": ["design_construct"], "novation": ["no"]}]
    provenance: [{"kind": "seed", "ref": "data/reference/clerk/data/seed/architectural-services-guide.md#appointment-boundary-and-procurement-route"}]

design_team: true
stage_intro: "Price each stage that applies. Each stage ends at client sign-off, and that design is the basis for later
  stages (section 5)."
# One table: each stage with its services beneath it (owner direction, 2 November 2026).
scope_by_stage: true

# Suggested appointment boundary; the user confirms it before issue. Stages
# after the end that apply are offered as separately priced options.
boundary:
- {when: [procurement: [design_construct]], start: brief_concept, end: tender_documentation}
- {when: [work_type: [advisory], pathway: [advice_only]], start: brief_concept, end: brief_concept}
  # A house's base fee runs to its one documentation set (owner decision 4).
- {when: [{module: [house], procurement: [traditional, managing_contractor]}], start: brief_concept, end: 
    tender_documentation}
- {start: brief_concept, end: design_development}

stages:
  # Owner ruling R13 (7 November 2026): the brief is typical on every
  # project, so it is always priced; a masterplan is only for a large project
  # (more than one building, or staged). The key stays brief_masterplan so
  # saved choices and answer keys keep their stage.
- key: brief_concept
  name: Brief and concept
  lines:
  - {key: brief, text: 'Confirmed, quantified brief (1 draft, 1 final)'}
  - {key: masterplan_options, text: 'up to {allowance:concept_options} masterplan options', when: [flag: [staged], 
          flag: [multi_building]]}
  - {key: masterplan_report, text: preferred masterplan report, when: [flag: [staged], flag: [multi_building]]}
  - {key: strategy_workshop, text: approval strategy workshop}
  - {key: site_inspection, text: Site inspection}
  - {key: existing_information, text: review of existing information and brief gaps}
  - {key: options, text: 'up to {allowance:concept_options} options'}
  - {key: preferred_concept, text: preferred concept}
  - {key: area_schedule, text: area schedule}
  - {key: budget_check, text: check against budget}
  fee_basis: fixed
  items: [input_schedule]
  shown_when: Always
  provenance:
  - {kind: evidence, ref: "architecture#1-14"}
  - {kind: client_decision, ref: "docs/plans/2026-11-07-synthetic-findings-f31-f42.md#r13", why: "Owner ruling R13: the
      brief is priced on every project; a masterplan only on a large one."}
  - {kind: evidence, ref: "architecture#5"}
  - {kind: evidence, ref: "architecture#16-23"}
  - {kind: evidence, ref: "architecture#28"}
  delivery_stage: brief_concept
- key: schematic_design
  name: Schematic design
  lines:
  - {key: preferred_scheme, text: "Preferred scheme resolved for planning and the cost plan"}
  - {key: outline_materials, text: "outline materials and systems"}
  - {key: pre_application, text: "pre-application meeting where the pathway has one"}
  fee_basis: fixed
  delivery_stage: schematic_design
  shown_when: Always
  provenance: [{kind: evidence, ref: "architecture#24-26"}, {kind: evidence, ref: "architecture#29-31"}, {kind: 
        evidence, ref: "architecture#39"}]
- key: planning
  name: Planning
  lines:
  - {key: planning_drawings, text: 'Architectural drawings and input to the {planning_report}: one preliminary and one
      final issue', when: [pathway: [cdc, da, ssd, planning_permit, ref, modification]], if_unknown: ask}
  - {key: who_lodges, text: who lodges is set in section 2, when: [pathway: [cdc, da, ssd, planning_permit, ref, 
            modification]], if_unknown: ask}
  - {key: information_requests, text: Authority information requests and design changes during assessment, when: [
          pathway: [da, ssd, planning_permit, modification]], if_unknown: ask}
  - {key: time_cap, text: 'actual time at R3 rates up to {allowance:planning_cap} hours', when: [pathway: [da, ssd, 
            planning_permit, modification]], if_unknown: ask}
  fee_basis: fixed
  when: [pathway: [cdc, da, ssd, planning_permit, ref, modification], pathway: [da, ssd, planning_permit, 
          modification]]
  shown_when: An application is lodged; or DA, SSD, permit or modification
  provenance:
  - {kind: evidence, ref: "architecture#40-47"}
  - {kind: evidence, ref: "architecture#48-53"}
  delivery_stage: planning
- key: design_development
  name: Design development
  lines:
  - {key: coordinated_design, text: Coordinated design to the approval and consent conditions}
  - {key: finishes_details, text: finishes and typical details}
  - {key: bca_strategy, text: BCA strategy with the BCA consultant}
  - {key: interior_design, text: 'Interior layouts, finishes and joinery for the base building and common areas', 
      when: [{work_type: [refurb], module: [beyond_house]}, {class: ["3", "5", "6", 9a, 9b, 9c], module: [
            beyond_house]}], if_unknown: include}
  fee_basis: fixed
  items: [base_interiors]
  shown_when: Always
  provenance:
  - {kind: evidence, ref: "architecture#57-66"}
  - {kind: evidence, ref: "architecture#70-71"}
  - {kind: evidence, ref: "architecture#36"}
  - {kind: evidence, ref: "architecture#65"}
  - {kind: evidence, ref: "architecture#114"}
  delivery_stage: design_development
- key: tender_documentation
  name: Tender documentation
  lines:
  - {key: house_documents_responsibility, text: You hold the whole architectural design., when: [{procurement: [
            traditional, managing_contractor], module: [house]}], if_unknown: ask}
  - {key: documentation_set, text: 'One documentation set for a lump-sum price and for construction: drawings, door and
      window schedules, joinery details, the finishes and fixtures schedule and the specification', when: [{
          procurement: [traditional, managing_contractor], module: [house]}], if_unknown: ask}
  - {key: issues, text: 'One tender issue, then one construction issue with the agreed tender changes and any construction
      certificate set', when: [{procurement: [traditional, managing_contractor], module: [house]}], if_unknown: ask}
  - {key: tender_traditional_responsibility, text: You hold the whole architectural design., when: [{procurement: [
            traditional, managing_contractor], module: [beyond_house]}], if_unknown: ask}
  - {key: tender_documents, text: 'Documents complete enough to price as a lump sum: drawings, schedules and specification',
    when: [{procurement: [traditional, managing_contractor], module: [beyond_house]}], if_unknown: ask}
  - {key: tender_issue, text: one tender issue, when: [{procurement: [traditional, managing_contractor], module: [
            beyond_house]}], if_unknown: ask}
  - {key: tender_questions, text: Tenderer questions and addenda, when: [procurement: [traditional, 
            managing_contractor]], if_unknown: ask}
  - {key: time_cap, text: 'actual time at R3 rates up to {allowance:bidding_cap} hours', when: [procurement: [
            traditional, managing_contractor]], if_unknown: ask}
  - {key: dnc_tender_responsibility, text: You hold the design to tender issue; the contractor holds it after award.,
    when: [procurement: [design_construct]], if_unknown: ask}
  - {key: design_intent, text: Design-intent drawings and performance brief, when: [procurement: [design_construct]],
    if_unknown: ask}
  - {key: design_split, text: schedule of the design you retain and the design the contractor completes, when: [
          procurement: [design_construct]], if_unknown: ask}
  - {key: departures_review, text: review of tenderers' departures, when: [procurement: [design_construct]], 
      if_unknown: ask}
  - {key: handover_register, text: handover deliverables register, when: [procurement: [design_construct]], 
      if_unknown: ask}
  fee_basis: fixed
  when: [{procurement: [traditional, managing_contractor], module: [house]}, {procurement: [traditional, 
          managing_contractor], module: [beyond_house]}, procurement: [traditional, managing_contractor], 
        procurement: [design_construct]]
  items: [house_interiors, house_selections, dnc_performance_brief]
  shown_when: A house under a traditional or managing contract; or Traditional or managing contractor; or Design and
    construct
  provenance:
  - {kind: client_decision, ref: "docs/plans/2026-10-13-house-rfp-brief.md", why: "Owner decision 4, 13 October 2026:
      a Class 1 house gets one documentation set for tender and construction."}
  - {kind: evidence, ref: "golden specification: Newham on York builder's project specification (end of design, pre-tender)"}
  - {kind: evidence, ref: "architecture#58-59"}
  - {kind: evidence, ref: "architecture#69"}
  - {kind: evidence, ref: "architecture#72-73"}
  - {kind: evidence, ref: "architecture#81-82"}
  - {kind: seed, ref: "data/reference/clerk/data/seed/architectural-services-guide.md#appointment-boundary-and-procurement-route"}
  delivery_stage: tender_documentation
- key: design_finalisation
  name: Design finalisation
  lines:
  - {key: regulated_designs, text: Regulated designs including passive fire and waterproofing details, when: [
          regulated_design: ["yes"]], suggest: [{state: [NSW], class: ["2", "3", 9c]}], threshold: dbp_regime}
  - {key: compliance_declarations, text: design compliance declarations for one construction certificate, when: [
          regulated_design: ["yes"]], suggest: [{state: [NSW], class: ["2", "3", 9c]}], threshold: dbp_regime}
  - {key: for_construction_responsibility, text: You hold the whole architectural design., when: [{procurement: [
            traditional, managing_contractor, eci, alliance, ppp], module: [beyond_house]}], if_unknown: ask}
  - {key: negotiated_changes, text: Negotiated changes incorporated, when: [{procurement: [traditional, 
            managing_contractor, eci, alliance, ppp], module: [beyond_house]}], if_unknown: ask}
  - {key: non_typical_details, text: non-typical details, when: [{procurement: [traditional, managing_contractor, 
            eci, alliance, ppp], module: [beyond_house]}], if_unknown: ask}
  - {key: issues, text: one for-construction issue and one construction certificate issue, when: [{procurement: [
            traditional, managing_contractor, eci, alliance, ppp], module: [beyond_house]}], if_unknown: ask}
  - {key: design_certification, text: design certification for the construction certificate, when: [{procurement: [
            traditional, managing_contractor, eci, alliance, ppp], module: [beyond_house]}], if_unknown: ask}
  - {key: post_novation_responsibility, text: The contractor holds the design after novation., when: [novation: ["option",
          "yes"]], if_unknown: ask}
  - {key: contractor_documentation, text: For-construction documentation for the contractor, when: [novation: ["option",
          "yes"]], if_unknown: ask}
  - {key: rfis, text: RFIs, when: [novation: ["option", "yes"]], if_unknown: ask}
  - {key: contractor_changes, text: design changes the contractor asks for, when: [novation: ["option", "yes"]], 
      if_unknown: ask}
  fee_basis: fixed
  when: [regulated_design: ["yes"], {procurement: [traditional, managing_contractor, eci, alliance, ppp], module: [
          beyond_house]}, novation: ["option", "yes"]]
  shown_when: Regulated-design regime confirmed for this work; or Not design and construct; or Novation
  provenance:
  - {kind: evidence, ref: "architecture#93-102"}
  - {kind: evidence, ref: "architecture#84-88"}
  - {kind: practice, ref: "architecture ledger #131-132 (not priced in the golden set); architectural-services-guide.md
      novation"}
  delivery_stage: design_finalisation
- key: delivery
  name: Delivery
  lines:
  - {key: site_inspections, text: '{allowance:ca_inspections} site inspections', when: [procurement: [traditional, 
            managing_contractor, eci, alliance, ppp]], if_unknown: ask}
  - {key: rfis, text: RFIs, when: [procurement: [traditional, managing_contractor, eci, alliance, ppp]], if_unknown: 
      ask}
  - {key: shop_drawings, text: shop drawing review, when: [procurement: [traditional, managing_contractor, eci, 
            alliance, ppp]], if_unknown: ask}
  - {key: completion_inspections, text: practical completion and defects inspections, when: [procurement: [
            traditional, managing_contractor, eci, alliance, ppp]], if_unknown: ask}
  - {key: contract_administration, text: 'Superintendent or contract administrator under the construction contract: progress
      claims and variations assessed, practical completion and defects certification', when: [flag: [contract_admin]],
    if_unknown: include}
  fee_basis: fixed
  default: option
  when: [procurement: [traditional, managing_contractor, eci, alliance, ppp], flag: [contract_admin]]
  shown_when: Not design and construct; client opts in; or Client asks you to administer the contract
  provenance:
  - {kind: practice, ref: "data/reference/clerk/data/seed/architectural-services-guide.md (construction and completion)"}
  - {kind: seed, ref: "peer-review-2026-10-09 architecture modules: contract administration actually commissioned"}
  delivery_stage: delivery
allowances:
- {key: design_meetings, label: Design meetings, text: "{n} per stage, online or in person", default: "4", owner: 
    client, provenance: [{kind: evidence, ref: "architecture#27"}, {kind: evidence, ref: "architecture#37"}, {kind: 
        evidence, ref: "architecture#64"}]}
- {key: concept_options, label: Concept options, text: "{n}", default: "2", owner: client, provenance: [{kind: 
        evidence, ref: "architecture#10"}, {kind: evidence, ref: "architecture#20"}]}
- {key: client_presentations, label: Client presentations, text: "{n}", owner: client, provenance: [{kind: evidence, 
        ref: "architecture#34"}]}
- {key: renders, label: Working 3D views, text: "{n}", default: "1", owner: client, provenance: [{kind: evidence, 
        ref: "architecture#15"}, {kind: evidence, ref: "architecture#45"}]}
- {key: issues_per_stage, label: Issues per stage, text: "{n} draft and 1 final", default: "1", owner: client, 
    provenance: [{kind: evidence, ref: "architecture#41"}, {kind: evidence, ref: "architecture#90"}]}
- {key: site_visits, label: "Site visits, design stages", text: "{n}", default: "2", owner: client, provenance: [{
        kind: evidence, ref: "architecture#5"}, {kind: evidence, ref: "architecture#60"}]}
- {key: workshops, label: Stakeholder workshops, text: "{n}", default: "1", owner: client, when: [flag: [staged], 
        flag: [multi_building]], provenance: [{kind: evidence, ref: "architecture#8"}]}
- {key: qs_reviews, label: QS cost plan reviews, text: "{n}, at schematic, design development and pre-tender", 
    default: "3", owner: client, module: beyond_house, provenance: [{kind: evidence, ref: "architecture#66"}]}
- {key: bim_lod, label: BIM level of detail, text: "LOD {n}", default: "200", complex_default: "300", owner: client, 
    module: beyond_house, provenance: [{kind: evidence, ref: "architecture#138-140"}]}
- {key: drawing_sheets, label: Drawing sheets at planning, text: "{n}, indicative; list them in R2", default: "12", 
    owner: consultant, when: [{stage: [planning], pathway: [cdc, da, ssd, planning_permit, ref, modification]}], 
    provenance: [{kind: evidence, ref: "architecture#45"}]}
- {key: planning_cap, label: Planning response ceiling, text: "{n} hours", owner: client, when: [{stage: [planning], 
        pathway: [da, ssd, planning_permit, modification]}], provenance: [{kind: evidence, ref: "architecture#53"}]}
- {key: bidding_cap, label: Bidding ceiling, text: "{n} hours", default: "40", owner: client, when: [{stage: [
          tender_documentation], procurement: [traditional, managing_contractor]}], provenance: [{kind: evidence, 
        ref: "architecture#81"}]}
- {key: ca_inspections, label: Construction site inspections, text: "{n}", owner: client, when: [{stage: [delivery], 
        procurement: [traditional, managing_contractor, eci, alliance, ppp]}], provenance: [{kind: practice, ref: "architectural-services-guide.md
        (construction and completion)"}]}

positions:
- {group: "Brief and design coordination", key: coordination, label: "Coordinating and integrating consultants' work",
  kind: service_level, simple: I, complex: I, provenance: [{kind: evidence, ref: "architecture#38"}, {kind: evidence,
