id: trade-temporary-fencing
version: 1
status: draft
kind: works
title: Temporary fencing and hoarding
heading: "REQUEST FOR TENDER: TEMPORARY FENCING AND HOARDING"
discipline_ids: [trade.temporary_fencing]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the temporary fencing contractor. Your job is to supply, install, keep in good order and remove the site fencing and hoarding the documents and the construction management plan show, so the site stays secure and the public stays out of the works."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Install the fencing and hoarding on the agreed line and coordinate moves with the head contractor as the works progress.
      - Inspect and repair the fencing after storms and damage.
      - Provide the engineer's certification for hoardings and gantries that need it.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/setup-and-commission-guide.md"}]

stage_intro: "A fence-only tender excludes the hoarding lines."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

