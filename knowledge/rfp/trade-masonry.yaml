role:
  - key: contractor
    text: "You are the bricklayer. Your job is to lay the brick and block walls the documents show, loadbearing and veneer, with their ties, cavity flashings, damp-proof courses and movement joints, plumb, clean and weathertight, on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Building Envelope and Weatherproofing)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 3700 — Masonry Structures)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hold brickwork below window height until the head contractor has signed off the windows and their flashings.
      - Keep cavities clear of mortar and weepholes open, and leave them clear at completion.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 4: External cladding — windows and doors before render or brickwork)"}]

