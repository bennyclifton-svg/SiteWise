role:
  - key: contractor
    text: "You are the shower screen contractor. Your job is to measure, supply and fix the shower screens, mirrors and internal glazing the documents show, in safety glass where the location needs it, without breaching the waterproofing behind the tiles."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Safety glazing requirements)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Measure on site after the tiling is finished, not from the drawings.
      - Use safety glass marked as such in every shower, bath and other location that needs it.
      - Fix without damaging the membrane, and seal every fixing and junction.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Safety glazing requirements)"}, {kind: seed, ref: "data/reference/clerk/data/seed/multi-residential-apartments-guide.md (Wet Area Waterproofing)"}]

