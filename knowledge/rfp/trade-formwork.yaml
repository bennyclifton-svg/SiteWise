id: trade-formwork
version: 1
status: draft
kind: works
title: Formwork
heading: "REQUEST FOR TENDER: FORMWORK"
discipline_ids: [trade.formwork]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the formwork contractor. Your job is to design where required, build, prop and strip the formwork the concrete needs, true to the set-out, levels and surface finish the documents show, strong enough for the pour, safely and on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 3610 Series — Formwork for Concrete)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Check form dimensions, levels and alignment before the steel fixer starts.
      - Strip only when the engineer or specification allows.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 3610 Series — Formwork for Concrete)"}]

stage_intro: "Price each stage of your works; a line marked Excluded is by others or not part of this tender."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

stages:
  - key: design
    name: "Formwork design"
    lines:
      - {key: design, text: "Formwork and propping design and certification where the documents leave it to the contractor"}
      - {key: shop_drawings, text: "Formwork and propping drawings for review"}
    fee_basis: fixed
    delivery_stage: design_finalisation
