role:
  - key: contractor
    text: "You are the waterproofing contractor. Your job is to make every wet area, balcony and deck the documents show watertight with a membrane system suited to it, prove it before it is covered, and certify the work you did."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Wet area waterproofing)"}, {kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Wet Area Construction and Waterproofing)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Inspect and accept each substrate, its falls and its penetrations before you apply a membrane.
      - Let each membrane cure for the period its manufacturer sets; never shorten it.
      - Offer each area for inspection, and flood test where the documents call for it, before any tiler covers it.
      - Photograph each completed area before it is covered.
      - Sign a certificate for each area you waterproof.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 2: Wet area waterproofing to tiling)"}, {kind: seed, ref: "data/reference/clerk/data/seed/commercial-construction-guide.md (Waterproofing in Commercial Buildings)"}]

