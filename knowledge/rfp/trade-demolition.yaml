    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/waste-management-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/commercial-construction-guide.md (Demolition and Strip-Out for Commercial Refurbishment)"}]

