status: draft
kind: works
title: Demolition
heading: "REQUEST FOR TENDER: DEMOLITION"
discipline_ids: [trade.demolition]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the demolition contractor. Your job is to take down and remove the structures the documents show, in a planned and safe sequence, protecting what is kept and the neighbouring property, and to leave the site clear for the works that follow."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2601 — The Demolition of Structures)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hold the demolition licence the work needs and give the regulator any notice it requires before you start.
      - Do not start in any area until the hazardous materials in the register have been removed and that area is cleared.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2601 — The Demolition of Structures)"}, {kind: seed, ref: "data/reference/clerk/data/seed/commercial-construction-guide.md (Demolition and Strip-Out for Commercial Refurbishment)"}]

stage_intro: "Price each stage of your works; a line marked Excluded is by others or not part of this tender."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

