  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the painting contractor. Your job is to prepare and paint the surfaces the documents and the colour schedule show, to an even finish that lasts, and to touch up at the end so the building hands over clean."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/defects-and-dlp-guide.md (2.5 Paint defects)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Do not paint new plaster until it is dry and cured enough to take paint.
      - Finish painting before carpet and other floor finishes the program puts after you, and protect any floor already laid.
      - In an existing building, treat old paint as possibly containing lead until it is tested.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 6: Internal painting before flooring)"}, {kind: seed, ref: "data/reference/clerk/data/seed/renovation-guide.md"}]

