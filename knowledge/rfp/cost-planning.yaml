id: cost-planning
version: 1
status: draft
title: Cost planning and quantity surveying services
heading: 'REQUEST FOR PROPOSAL: COST PLANNING AND QUANTITY SURVEYING'
golden: docs/rfp-golden/cost-planning/rfp.md
discipline_ids:
- consultant.quantity_surveyor
title_aliases:
- quantity surveyor
- cost planning
- cost consultant
evidence_limit: Historical industrial planning estimates differ in scope, identity, iteration caps and terms; no
  current cost benchmark or universal CIV requirement established.
field_defaults:
  pi: ''
  pl: ''
scale:
  text: Purpose, inputs and selected stages govern scope across all building/work types.
  complex: []
thresholds:
- key: cost_commercial
  kind: client_default
  text: 90-day validity; 30-day payment; project-selected insurance
  source: cost-planning#37,39 client policy
  verified: false
- key: cost_evaluation
  kind: client_default
  text: Price40/experience20/team20/method-program10/compliance10
  source: cost-planning#39 client policy
  verified: false
evaluation:
- key: price
  label: Evaluated price
  default: 40
  provenance:
  - kind: client_decision
    ref: cost-planning#39
    why: Client selects agreement, competent independent resources, insurance and evaluation; historic supplier
      limits and certificates are not current requirements.
- key: experience
  label: Relevant experience
  default: 20
  provenance:
  - kind: client_decision
    ref: cost-planning#39
    why: Client selects agreement, competent independent resources, insurance and evaluation; historic supplier
      limits and certificates are not current requirements.
- key: team
  label: Named team
  default: 20
  provenance:
  - kind: client_decision
    ref: cost-planning#39
    why: Client selects agreement, competent independent resources, insurance and evaluation; historic supplier
      limits and certificates are not current requirements.
- key: methodology
  label: Method/program
  default: 10
  provenance:
  - kind: client_decision
    ref: cost-planning#39
    why: Client selects agreement, competent independent resources, insurance and evaluation; historic supplier
      limits and certificates are not current requirements.
- key: compliance
  label: Compliance
  default: 10
  provenance:
  - kind: client_decision
    ref: cost-planning#39
    why: Client selects agreement, competent independent resources, insurance and evaluation; historic supplier
      limits and certificates are not current requirements.
evaluation_note: Check cost basis, independence, insurance and departures first; normalise counts, input maturity,
  coverage, reliance and options. Lowest price need not win.
project_rows:
- key: procurement
  text: '{procurement_route}; D&C does not appoint later services or novate this consultant.'
  provenance:
  - kind: seed
    ref: cost-planning#30
  - kind: client_decision
    ref: cost-planning#36
    why: Client confirms actual extent, appointment start/end and priced assumptions across building/work types;
      unknown scope remains unresolved.
  label: Procurement
  replace: true
- key: cost_basis
  text: Confirm purpose/users; construction versus total-project boundary; currency/tax adviser, budget/date/approval,
    quality, measurement method, price date/location and escalation endpoints. Attach current revisions, contracts/quotes
    and conflicting identities/dates.
  provenance:
  - kind: evidence
    ref: cost-planning#12
  - kind: seed
    ref: cost-planning#25,26,27
  - kind: client_decision
    ref: cost-planning#35
    why: Select current authority-purpose reporting and separate specialist reliance; historical CIV and capability
      lists do not commission these services.
  - kind: client_decision
    ref: cost-planning#36
    why: Client confirms actual extent, appointment start/end and priced assumptions across building/work types;
      unknown scope remains unresolved.
  label: Cost basis
role:
- key: cost
  text: Independent cost advice from written instruction/complete inputs to named final output and query-period
    end. Estimate uncertainty is explicit; no guaranteed tender, final cost, approval or funding.
  provenance:
  - kind: evidence
    ref: cost-planning#4,16
  - kind: seed
    ref: cost-planning#27,34
  - kind: client_decision
    ref: cost-planning#36
    why: Client confirms actual extent, appointment start/end and priced assumptions across building/work types;
      unknown scope remains unresolved.
- key: interfaces
  text: Designers/specialists define design, compliance, retained-system adequacy and remediation; operator supplies
    equipment/owner costs; PM owns budget/change approval. QS prices gaps, administrator directs/certifies, advisers
    own tax/legal/valuation. Disclose client/contractor/lender conflicts.
  provenance:
  - kind: evidence
    ref: cost-planning#20,23
  - kind: seed
    ref: cost-planning#25,26,29,31,32
  - kind: client_decision
    ref: cost-planning#35
    why: Select current authority-purpose reporting and separate specialist reliance; historical CIV and capability
      lists do not commission these services.
  - kind: client_decision
    ref: cost-planning#39
    why: Client selects agreement, competent independent resources, insurance and evaluation; historic supplier
      limits and certificates are not current requirements.
stage_intro: Confirm base stages, inputs and final query-period end; later services require written instruction.
boundary:
- when:
  - work_type:
    - advisory
  start: s1_basis
  end: s8_advice
- start: s1_basis
  end: s4_design
stages:
- key: s1_basis
  name: S1 Inception / cost basis
  deliverable: Reconcile brief, budget, scope/area/quantity definitions and evidence; establish source, gap, risk
    and priced-assumption registers, reporting/program and input owners
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: seed
    ref: cost-planning#25,26,27,28,34
  - kind: client_decision
    ref: cost-planning#38
    why: Client requests reviewable editable records, explicit gaps, input owners and project distribution beyond
      the historical PDF-only promises.
- key: s2_concept
  name: S2 Feasibility / options
  deliverable: Evidence-appropriate order-of-cost/measured estimate; normalise benchmark date/location/specification,
    compare counted options, risk/escalation/sensitivity and investigations before commitment
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: seed
    ref: cost-planning#26,27,28,31,32,34
  when:
  - work_type: &id001
    - new
    - refurb
    - extend
    - remediation
    flag:
    - cost_concept
  if_unknown: ask
- key: s3_authority
  name: S3 Authority estimate
  deliverable: Confirmed current purpose/definition/form/date/signatory; draft, agreed review and signed final report.
    Reconcile differences to cost plan; historical CIV is not the default. Authority decides approval
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: cost-planning#1,8,15
  - kind: client_decision
    ref: cost-planning#35
    why: Select current authority-purpose reporting and separate specialist reliance; historical CIV and capability
      lists do not commission these services.
  - kind: client_decision
    ref: cost-planning#38
    why: Client requests reviewable editable records, explicit gaps, input owners and project distribution beyond
      the historical PDF-only promises.
  when:
  - work_type: *id001
    flag:
    - cost_authority
  if_unknown: ask
- key: s4_design
  name: S4 Design cost planning
  deliverable: At named milestones measure/price agreed documents; coordinate services/siteworks, test value options
    with designers, reconcile changes/budget and risk/owner costs; flag gaps before freeze
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: seed
    ref: cost-planning#25,26,27,28,29,31,33
  - kind: client_decision
    ref: cost-planning#38
    why: Client requests reviewable editable records, explicit gaps, input owners and project distribution beyond
      the historical PDF-only promises.
  when:
  - work_type: *id001
    flag:
    - cost_design
  if_unknown: ask
- key: s5_tender
  name: S5 Procurement / tender
  deliverable: Separately select pretender estimate, BoQ/schedule, packages, clarifications/interviews/negotiation
    and recommendation; agree measurement rules/contractual quantity status. D&C/ECI design/risk allowances and
    tender-budget reconciliation
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: cost-planning#5
  - kind: seed
    ref: cost-planning#25,29,30
  when:
  - work_type: *id001
  default: option
- key: s6_construction
  name: S6 Post-contract cost advice
  deliverable: Named contract; counted claims/variations, observations, cost reports/cashflow and forecast. Separate
    claimed, assessed/certified, paid, committed/disputed/forecast; reconcile PC/PS, contingency and client costs.
    Administrator retains powers; lender reliance separate
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: cost-planning#24
  - kind: seed
    ref: cost-planning#25,26,28,29
  - kind: client_decision
    ref: cost-planning#35
    why: Select current authority-purpose reporting and separate specialist reliance; historical CIV and capability
      lists do not commission these services.
  when:
  - work_type: *id001
  default: option
- key: s7_completion
  name: S7 Final account
  deliverable: Reconcile contract sum, variations/allowances/claims, commitments and risk; scoped retention/defects
    advice, unresolved disputes and final registers. Completion certification, entitlement and security release
    remain contract roles
  fee_basis: option
  shown_when: Selected appointment
  provenance:
  - kind: seed
    ref: cost-planning#29
  - kind: client_decision
    ref: cost-planning#36
    why: Client confirms actual extent, appointment start/end and priced assumptions across building/work types;
      unknown scope remains unresolved.
  - kind: client_decision
    ref: cost-planning#38
    why: Client requests reviewable editable records, explicit gaps, input owners and project distribution beyond
      the historical PDF-only promises.
  when:
  - work_type: *id001
  default: option
- key: s8_advice
  name: S8 Standalone advisory
  deliverable: Define decision, extent, evidence cutoff, sample/inspection limits, data horizon, method/competence,
    reliance and final report for selected feasibility/capex study. Lender, life-cycle/carbon/LCA and expert evidence
    separately priced; valuation/tax by named specialists
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: evidence
    ref: cost-planning#5,13,24
  - kind: seed
    ref: cost-planning#34
  - kind: client_decision
    ref: cost-planning#35
    why: Select current authority-purpose reporting and separate specialist reliance; historical CIV and capability
      lists do not commission these services.
  when:
  - work_type:
    - advisory
durations: R7 sets complete-input/start, measurement cutoff, draft/review/final dates and query-period end; no inherited
  ten-day/two-week promise.
allowances_note: Complete counts before issue. Fixed fee, time ceiling or unit rate with quantity; options separately
  totalled. Construction provisional sums do not authorise consultant fees.
