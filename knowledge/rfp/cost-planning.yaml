# One table: each stage with its lines and services (owner direction, 3 November 2026).
scope_by_stage: true
stages:
- key: s1_basis
  name: S1 Inception / cost basis
  lines:
  - {key: reconcile_brief_budget, text: "Reconcile brief, budget, scope/area/quantity definitions and evidence"}
  - {key: establish_source_gap, text: "establish source, gap, risk and priced-assumption registers, reporting/program and input owners"}
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: seed
    ref: cost-planning#25,26,27,28,34
  - kind: client_decision
    ref: cost-planning#38
    why: Client requests reviewable editable records, explicit gaps, input owners and project distribution beyond
      the historical PDF-only promises.
- key: s2_concept
  name: S2 Feasibility / options
  lines:
  - {key: evidence_appropriate_order, text: "Evidence-appropriate order-of-cost/measured estimate"}
  - {key: normalise_benchmark_date, text: "normalise benchmark date/location/specification, compare counted options, risk/escalation/sensitivity and investigations before commitment"}
  fee_basis: fixed
  shown_when: Selected appointment
  provenance:
  - kind: seed
    ref: cost-planning#26,27,28,31,32,34
