scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the landscaping contractor. Your job is to build the soft and hard landscape the landscape documents show, graded so water runs away from the building, and to keep the planting alive and healthy through the establishment period."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/landscape-architecture-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 8: External landscaping, paths, and drainage before occupation)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Keep soil, mulch and garden beds clear of wall cladding, weep holes and the termite barrier.
      - Book the landscape architect's inspections and the end of establishment inspection.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 8: External landscaping, paths, and drainage before occupation)"}, {kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Termite Management)"}]

