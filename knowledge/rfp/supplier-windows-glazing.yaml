id: supplier-windows-glazing
version: 1
status: draft
kind: works
title: "Windows and glazing"
heading: "REQUEST FOR TENDER: WINDOWS AND GLAZING"
discipline_ids: [supplier.windows_glazing]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One supply package."
  complex: []

role:
  - key: contractor
    text: "You are the window supplier. Your job is to make and deliver the windows, external doors and glazing the documents show, with the wind, water and energy performance and the safety glass the documents require, and the evidence to prove it."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2047 — Windows and External Glazed Doors in Buildings)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 1288 — Glass in Buildings)"}, {kind: seed, ref: "data/reference/clerk/data/seed/procurement-quoting-guide.md (4. Residential-typical trade scopes and scope traps)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Check measure the openings before manufacture and agree deliveries with the head contractor.
      - Mark each window with its performance rating, and give the test and energy evidence the certifier and energy assessor need.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2047 — Windows and External Glazed Doors in Buildings)"}, {kind: seed, ref: "data/reference/clerk/data/seed/procurement-quoting-guide.md (4. Residential-typical trade scopes and scope traps)"}]

stage_intro: "A supply-only tender excludes the installation lines."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

stages:
  - key: design
    name: "Shop drawings and performance"
    lines:
      - {key: shop_drawings, text: "Window schedule and shop drawings for the design team's review"}
      - {key: performance, text: "Wind, water and air ratings for each window location, and glass that meets the safety and energy requirements"}
    fee_basis: fixed
    delivery_stage: design_finalisation
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2047 — Windows and External Glazed Doors in Buildings)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 1288 — Glass in Buildings)"}]
  - key: establishment
    name: "Preliminaries and attendance"
    lines:
      - {key: supervision, text: "Your own supervision and safe work method statements for delivery and unloading"}
      - {key: access, text: "Delivery access, set-down and any craneage agreed with the head contractor"}
      - {key: clean, text: "Removal of your packaging and offcuts"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}]
  - key: selection
    name: "Samples and site measure"
    lines:
      - {key: samples, text: "Frame colour and glass samples for approval"}
      - {key: measure, text: "Check measure of openings before manufacture"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/procurement-quoting-guide.md (4. Residential-typical trade scopes and scope traps)"}]
  - key: manufacture
    name: "Manufacture"
    lines:
      - {key: frames, text: "Frames, sashes and external door sets"}
      - {key: glazing, text: "Glazing units, and safety glass where the documents and glazing rules need it"}
      - {key: hardware, text: "Locks, handles, flyscreens and seals the schedule shows"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2047 — Windows and External Glazed Doors in Buildings)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 1288 — Glass in Buildings)"}]
  - key: delivery
    name: "Delivery to site"
    lines:
      - {key: deliver, text: "Delivery to site in the order the program needs, protected"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/procurement-quoting-guide.md (4. Residential-typical trade scopes and scope traps)"}]
  - key: install
    name: "Installation (excluded from a supply-only tender)"
    lines:
      - {key: install, text: "Installation in the openings, packed, fixed and sealed"}
      - {key: flashings, text: "Head, sill and jamb flashings to the windows you install"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 4: External cladding — windows and doors before render or brickwork)"}]
  - key: handover
    name: "Warranties and records"
    lines:
      - {key: certificates, text: "Performance labels, test evidence and energy ratings for each window"}
      - {key: records, text: "Warranties, care and maintenance instructions"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2047 — Windows and External Glazed Doors in Buildings)"}, {kind: seed, ref: "data/reference/clerk/data/seed/setup-and-commission-guide.md"}]

positions:
