  - {key: install, label: "Installation and flashing when the installation stage is not priced, by the head contractor", kind: technical, value: X, responsible: "head contractor", provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 4: External cladding — windows and doors before render or brickwork)"}]}
