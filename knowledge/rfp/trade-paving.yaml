scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the driveways and paving contractor. Your job is to build the driveway, crossover, paths and paved areas the documents show, on a sound base, to the levels and falls that carry water away from the building, and to the council's requirements at the street."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/civil-residential.md (Driveway crossover)"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 8: External landscaping, paths, and drainage before occupation)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Start only once the services, conduits and drainage below the paving are in place.
      - Book the council inspections the crossover approval names.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 8: External landscaping, paths, and drainage before occupation)"}, {kind: seed, ref: "data/reference/clerk/data/seed/civil-residential.md (Approvals)"}]

