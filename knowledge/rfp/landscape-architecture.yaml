evaluation_note: Compare equal extents, stages, visits, specialist boundaries, establishment periods and departures.
project_rows:
- key: procurement
  text: '{procurement_route}; no automatic later appointment or novation.'
  provenance:
  - kind: evidence
    ref: landscape-architecture#21
  - kind: seed
    ref: landscape-architecture#28
  - kind: client_decision
    ref: landscape-architecture#34
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
  label: Procurement
  replace: true
- key: landscape_basis
  text: Confirm measured extent/map revision, actual users, private/common/public ground/roof areas; survey, levels/services,
    tree IDs, soil/environmental and structural/waterproofing evidence, current controls/consents, operator and access.
    Record gaps/conflicts.
  provenance:
  - kind: evidence
    ref: landscape-architecture#3,8,9
  - kind: seed
    ref: landscape-architecture#26-33
  - kind: client_decision
    ref: landscape-architecture#34,36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
  label: Landscape basis
role:
- key: appointment
  text: Selected landscape design/advice from instruction, inputs and access to named output/response milestone. Specialists
    own technical design; authorities approve. No approval, plant-survival or unseen-work guarantee.
  provenance:
  - kind: evidence
    ref: landscape-architecture#5-10
  - kind: seed
    ref: landscape-architecture#26-29,33
  - kind: client_decision
    ref: landscape-architecture#34,36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
- key: records
  text: Controlled PDFs/plans, schedules/calculations and registers; agree native formats, recipients/reliance, input
    revisions, rounds/dates. Verify instrument/edition before using ratios, canopy, soil-depth or load figures.
  provenance:
  - kind: evidence
    ref: landscape-architecture#5,6,9
  - kind: seed
    ref: landscape-architecture#27-29,33
  - kind: client_decision
    ref: landscape-architecture#35
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
stage_intro: Select base/options and end; later stages require instruction. Fit-out without landscape impact buys no
  design; advice ends at its report/response round.
boundary:
- when:
  - work_type:
    - advisory
  start: s1_inception
  end: s9_advisory
- start: s1_inception
  end: s3_approval
stages:
- key: s1_inception
  name: S1 Inception / evidence
  deliverable: Agreed accessible-site review/photos, controls/use/maintenance brief, constraints and investigation register;
    missing levels, services, soil, trees and access.
  fee_basis: fixed
  shown_when: Selected extent and appointment
  provenance:
  - kind: evidence
    ref: landscape-architecture#5,8,12
  - kind: seed
    ref: landscape-architecture#26,27,30-33
- key: s2_concept
  name: S2 Concept
  deliverable: Counted alternatives/tree workshops, layout/palette and measured deep-soil/canopy basis; soil volumes/depths,
    loads, shade, water and maintenance assumptions.
  fee_basis: fixed
  shown_when: Selected extent and appointment
  provenance:
  - kind: evidence
    ref: landscape-architecture#5,6
  - kind: seed
    ref: landscape-architecture#27,29
  - kind: client_decision
    ref: landscape-architecture#36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
  when:
  - flag:
    - landscape_design
    work_type:
    - new
    - refurb
    - extend
    - remediation
  if_unknown: ask
- key: s3_approval
  name: S3 Approval / responses
  deliverable: Pathway-specific plans, planting schedule/details/calculations; draft/consolidated comment/final and counted
    council responses to named milestone. Scales suit submission.
  fee_basis: fixed
  shown_when: Selected extent and appointment
  provenance:
  - kind: evidence
    ref: landscape-architecture#5-9
  - kind: seed
    ref: landscape-architecture#27
  - kind: client_decision
    ref: landscape-architecture#34
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
  when:
  - flag:
    - landscape_design
    work_type:
    - new
    - refurb
    - extend
    - remediation
  if_unknown: ask
- key: s4_developed
  name: S4 Consent / developed design
  deliverable: Conditions/register, hard/soft landscape, soils and planting; coordinate irrigation, public domain, civil,
    structure/waterproofing, access and long-lead items.
  fee_basis: fixed
  shown_when: Selected extent and appointment
  provenance:
  - kind: seed
    ref: landscape-architecture#27,29
  - kind: client_decision
    ref: landscape-architecture#36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
  when:
  - flag:
    - landscape_design
    work_type:
    - new
    - refurb
    - extend
    - remediation
  if_unknown: ask
- key: s5_tender
  name: S5 Traditional documentation
  deliverable: Coordinated tender/for-construction drawings, plant/soil/material schedules, specification, establishment
    requirements/hold points; counted queries/substitutions.
  fee_basis: fixed
  shown_when: Selected extent and appointment
  provenance:
  - kind: seed
    ref: landscape-architecture#27,28
  - kind: client_decision
    ref: landscape-architecture#34,36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
  when:
  - flag:
