    - traditional
  if_unknown: ask
- key: s6_dnc
  name: S6 D&C / post-contract
  deliverable: Design intent/performance tender package; delegated detail, handover and remaining deliverables. Separately
    price post-contract completion, novation and substitutions; name instructor.
  fee_basis: fixed
  shown_when: Selected extent and appointment
  provenance:
  - kind: evidence
    ref: landscape-architecture#21
  - kind: seed
    ref: landscape-architecture#28
  - kind: client_decision
    ref: landscape-architecture#34
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
  when:
  - flag:
    - landscape_design
    work_type:
    - new
    - refurb
    - extend
    - remediation
    procurement:
    - design_construct
  if_unknown: ask
- key: s7_construction
  name: S7 Construction / completion
  deliverable: Counted stock/submittal/RFI reviews and soil/set-out/concealed-interface visits; departures/actions/evidence
    and bounded completion statement, distinct from contract PC/authority acceptance.
  fee_basis: option
  shown_when: Selected extent and appointment
  provenance:
  - kind: seed
    ref: landscape-architecture#28-31
  - kind: client_decision
    ref: landscape-architecture#36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
      quantities or current terms.
  when:
  - flag:
    - landscape_design
    work_type:
    - new
    - refurb
    - extend
    - remediation
  if_unknown: ask
  default: option
- key: s8_establishment
  name: S8 Establishment review
  deliverable: 'Period/start event, logs/visits/replacements and acceptance criteria: condition/coverage, weeds, irrigation,
    erosion/defects; end report to administrator/operator. Contractor maintains.'
  fee_basis: option
  shown_when: Selected extent and appointment
  provenance:
  - kind: seed
    ref: landscape-architecture#28,31,32
  - kind: client_decision
    ref: landscape-architecture#36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal scope,
