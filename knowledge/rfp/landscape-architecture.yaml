- key: landscape_basis
  text: Confirm measured extent/map revision, actual users, private/common/public ground/roof areas; survey, 
    levels/services, tree IDs, soil/environmental and structural/waterproofing evidence, current controls/consents, 
    operator and access. Record gaps/conflicts.
  provenance:
  - kind: evidence
    ref: landscape-architecture#3,8,9
  - kind: seed
    ref: landscape-architecture#26-33
  - kind: client_decision
    ref: landscape-architecture#34,36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal 
      scope, quantities or current terms.
  label: Landscape basis
role:
- key: appointment
  text: Selected landscape design/advice from instruction, inputs and access to named output/response milestone. 
    Specialists own technical design; authorities approve. No approval, plant-survival or unseen-work guarantee.
  provenance:
  - kind: evidence
    ref: landscape-architecture#5-10
  - kind: seed
    ref: landscape-architecture#26-29,33
  - kind: client_decision
    ref: landscape-architecture#34,36
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal 
      scope, quantities or current terms.
- key: records
  text: Controlled PDFs/plans, schedules/calculations and registers; agree native formats, recipients/reliance, 
    input revisions, rounds/dates. Verify instrument/edition before using ratios, canopy, soil-depth or load 
    figures.
  provenance:
  - kind: evidence
    ref: landscape-architecture#5,6,9
  - kind: seed
    ref: landscape-architecture#27-29,33
  - kind: client_decision
    ref: landscape-architecture#35
    why: Explicit appointment, extent and procurement choice; historical agreement does not establish universal 
      scope, quantities or current terms.
stage_intro: Select base/options and end; later stages require instruction. Fit-out without landscape impact buys no
  design; advice ends at its report/response round.
boundary:
- when:
  - work_type:
    - advisory
  start: brief_concept
  end: s9_advisory
- start: brief_concept
  end: planning
