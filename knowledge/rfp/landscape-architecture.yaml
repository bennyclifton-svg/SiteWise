id: landscape-architecture
version: 2
status: draft
title: Landscape architectural services
heading: 'REQUEST FOR PROPOSAL: LANDSCAPE ARCHITECTURE'
golden: docs/rfp-golden/landscape-architecture/rfp.md
discipline_ids:
- consultant.landscape
title_aliases:
- landscape architect
- landscape architecture
evidence_limit: Two versions of one agreement with a narrow DA schedule; incorporated fee proposal absent, client acceptance
  unproved and novation heading/body conflict unresolved. No independent bid benchmark.
field_defaults:
  pi: ''
  pl: ''
scale:
  text: Actual external extent and selected stages govern; no industrial default.
  complex: []
thresholds:
- key: commercial
  kind: client_default
  text: 90-day validity, 30-day payment and project-selected insurance
  source: landscape-architecture#35 proposed policy, not historical agreement
  verified: false
- key: evaluation
  kind: client_default
  text: Price40/experience20/team20/method10/compliance10
  source: landscape-architecture#35 proposed policy
  verified: false
evaluation:
