  when:
  - flag:
    - landscape_design
    work_type:
    - new
    - refurb
    - extend
    - remediation
  if_unknown: ask
  default: option
- key: s9_advisory
  name: S9 Advice / rectification
  deliverable: Defined question/cutoff, observed/tested/inferred evidence, limits/confidence, options/actions/reliance.
    Tests separate; rectification follows agreed cause/extent or express risk allocation.
  fee_basis: option
  shown_when: Selected extent and appointment
  provenance:
  - kind: seed
    ref: landscape-architecture#30-33
  default: option
  include_when:
  - work_type:
    - advisory
durations: R7 fixes input/start, draft/review/final, authority and stage-specific handover/establishment dates; no universal
  PC date.
allowances_note: Complete a separate quantity/basis for each listed item by selected stage; grouped entries are not a
  common count. Record authorised assumptions (owner/date/consequence/review). Fixed fee, ceiling or unit/quantity; options
  separate; written authority before overruns.
