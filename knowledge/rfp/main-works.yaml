positions:
  - {key: authority_fees, label: "Authority application fees and contributions, by the client", kind: technical, value: X, responsible: client, provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/procurement-tendering-guide.md (Risk allocation and baseline reports)"}]}
  - {key: loose_items, label: "Furniture and loose equipment, by the client", kind: technical, value: X, responsible: client, provenance: [{kind: practice, ref: "Loose furniture and equipment are the client's unless the documents show them"}]}

returnables:
  r2: "Name any provisional sum you think the documents need but do not include."
  r9: "Name the trades you will let and those you will do yourselves."

durations: "From the SiteWise program when it holds the delivery stage; otherwise the tenderer states weeks in R7."
