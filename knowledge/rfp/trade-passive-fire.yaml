title: Fire stopping and passive fire
heading: "REQUEST FOR TENDER: FIRE STOPPING AND PASSIVE FIRE"
discipline_ids: [trade.passive_fire]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the passive fire contractor. Your job is to seal every service penetration and joint in fire-rated construction with a system tested for that wall or floor and that service, to protect the elements the documents give you, and to hand over a register that shows each seal, where it is, what it is and the evidence it is right."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/fire-life-safety-guide.md (Passive fire protection)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Keep a penetration register by location, with the product, its test evidence, a label and photographs for each seal.
      - Do not seal a combination no test covers; refer it to the fire engineer and the certifier before you close it.
      - Offer each area for inspection before it is lined or concealed.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/fire-life-safety-guide.md (Passive fire protection)"}, {kind: seed, ref: "data/reference/clerk/data/seed/fire-life-safety-guide.md (Construction verification and integrated testing)"}]

stage_intro: "A supply-only tender excludes the installation lines."
