    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/remediation-due-diligence-guide.md (Asbestos Assessment and Management in Construction)"}]
  - key: disposal
    name: "Transport and disposal"
    lines:
      - {key: package, text: "Wrapping, labelling and transport of asbestos waste as the law requires"}
