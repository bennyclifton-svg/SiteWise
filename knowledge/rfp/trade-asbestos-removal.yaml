    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/remediation-due-diligence-guide.md (Asbestos Assessment and Management in Construction)"}, {kind: seed, ref: "data/reference/clerk/data/seed/commercial-construction-guide.md (Demolition and Strip-Out for Commercial Refurbishment)"}]
  - key: clearance
    name: "Air monitoring and clearance"
    lines:
      - {key: assessor_access, text: "Access for the independent assessor's air monitoring during removal"}
      - {key: rework, text: "Further cleaning until the assessor gives clearance"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/remediation-due-diligence-guide.md (Asbestos Assessment and Management in Construction)"}]
  - key: handover
    name: "Testing and handover"
    lines:
      - {key: certificates, text: "Clearance certificate from the independent assessor for each area, before other trades return"}
      - {key: records, text: "Waste disposal records and the details the client needs to update the asbestos register"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/remediation-due-diligence-guide.md (Asbestos Assessment and Management in Construction)"}]

