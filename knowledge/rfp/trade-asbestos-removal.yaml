id: trade-asbestos-removal
version: 1
status: draft
kind: works
title: Asbestos removal
heading: "REQUEST FOR TENDER: ASBESTOS REMOVAL"
discipline_ids: [trade.asbestos_removal]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the licensed asbestos removalist. Your job is to remove and dispose of the asbestos-containing materials in the register, under the licence class each material needs, so that each area is cleared for others to return to, safely and on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/remediation-due-diligence-guide.md (Asbestos Assessment and Management in Construction)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hold the asbestos removal licence for the class of material you remove: friable material needs the higher class.
      - Give the regulator the notice it requires before licensed removal starts.
      - Keep each area closed until the independent assessor clears it.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/remediation-due-diligence-guide.md (Asbestos Assessment and Management in Construction)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2601 — The Demolition of Structures)"}]

stage_intro: "Price each stage of your works; a line marked Excluded is by others or not part of this tender."
scope_by_stage: true

boundary:
  - {start: design, end: handover}

stages:
  - key: design
    name: "Asbestos removal control plan"
    lines:
      - {key: control_plan, text: "Asbestos removal control plan for the materials in the register"}
      - {key: notice, text: "Notice to the regulator before licensed removal starts"}
    fee_basis: fixed
    delivery_stage: design_finalisation
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/commercial-construction-guide.md (Demolition and Strip-Out for Commercial Refurbishment)"}]
  - key: establishment
    name: "Preliminaries and attendance"
    lines:
