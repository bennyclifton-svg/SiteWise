      - {key: clean, text: "Clean-up of spillage at bin positions and on the road"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/setup-and-commission-guide.md"}]
  - key: supply
    name: "Bin supply"
    lines:
      - {key: bins, text: "Skip bins of the sizes and types the head contractor orders"}
      - {key: streams, text: "Separate bins for the waste streams the waste management plan separates"}
      - {key: covers, text: "Covers or nets on bins where the site or the council asks"}
    fee_basis: fixed
    delivery_stage: delivery
    shown_when: Always
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/waste-management-guide.md"}]
  - key: exchange
    name: "Exchange and disposal"
    lines:
      - {key: exchange, text: "Exchange and removal of full bins on call"}
      - {key: disposal, text: "Transport to facilities licensed to receive each waste stream"}
