title: Waste and skip bins
heading: "REQUEST FOR TENDER: WASTE AND SKIP BINS"
discipline_ids: [trade.waste_bins]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the waste contractor. Your job is to supply, exchange and remove the skip bins the site needs, and to take the waste to lawful facilities with the records the construction waste management plan asks for."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/waste-management-guide.md"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Supply and exchange bins when the head contractor calls, placed where the head contractor directs.
      - Take each load to a facility licensed to receive it, and keep the dockets.
      - Report waste and recycling against the waste management plan.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/waste-management-guide.md"}]

stage_intro: "Asbestos and other hazardous waste are excluded; a licensed removalist takes them."
scope_by_stage: true

boundary:
  - {start: establishment, end: handover}

stages:
  - key: establishment
    name: Preliminaries and attendance
    lines:
      - {key: supervision, text: "Your own supervision, driver inductions and safe work method statements"}
