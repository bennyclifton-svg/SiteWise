role:
  - key: designer
    text: "You are the mechanical services engineer. Your job is to keep the occupants comfortable and healthy, with the right temperatures, fresh air and ventilation, using plant that fits the building, meets the energy targets and can be maintained."
    provenance: [{"kind": "evidence", "ref": "mechanical-services#2-7,12-18,23-25"}, {"kind": "seed", "ref": "mechanical-services#40-43,48"}, {"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: section 2 opens with what the consultant is engaged to achieve and how; the same on every project, with one sentence by building type."}]
  - key: duties
    text: |-
      To do this you:
      - Set the design loads and plant strategy early, and give the architect and structural engineer the space, weight and penetrations the plant needs.
      - Design the selected systems to the level of detail each appointed stage buys, with load, airflow, pressure and selection calculations.
      - Show how the outdoor-air requirement is met: air conditioning is not fresh air.
      - Say what loads or evidence are missing and resolve them before relying on them.
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: section 2 opens with what the consultant is engaged to achieve and how; the same on every project, with one sentence by building type."}]
  - key: fit_house
    text: "For this house, this means comfortable rooms at a running cost the owners can live with."
    when: [{"module": ["house"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_apartments
    text: "For the apartments, this includes apartment air conditioning and where its condensers go, bathroom and kitchen exhaust, and car park ventilation."
    when: [{"class": ["2"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_commercial
    text: "For the office or retail space, this includes zoning that tenants can adapt and the energy rating the brief targets."
    when: [{"class": ["5", "6"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_industrial
    text: "For the warehouse or factory, this includes ventilation and heat control for the operation."
    when: [{"class": ["7b", "8"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_health
    text: "For the health building, this includes the pressure regimes and air changes clinical spaces need."
    when: [{"class": ["9a"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_existing
    text: "Because this is work to an existing building, this includes confirming what the existing plant can still do."
    when: [{"module": ["existing_building"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: boundaries
    text: "The fire engineer owns the fire strategy and Performance Solutions; you design the selected plant and its fire modes to suit them. Trades install, program and test. Your reviews and witnessing are not their work, continuous supervision, or certification of work you did not see."
    provenance: [{"kind": "evidence", "ref": "mechanical-services#4-7,16-18,29"}, {"kind": "seed", "ref": "mechanical-services#42,49"}]
