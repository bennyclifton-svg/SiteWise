role:
  - key: contractor
    text: "You are the tiling contractor. Your job is to tile the walls and floors the documents show, flat, bonded and falling to the wastes, over a membrane you did not damage, with the movement joints the tiles need."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/finishes-residential.md (Tiling)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Do not tile over a membrane until you have seen its waterproofing certificate and inspection record and it has cured.
      - Check each substrate is flat enough for the tile format before you start, and tell the head contractor in writing if it is not.
      - Lay floor tiles to fall to the wastes, with no ponding.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 2: Wet area waterproofing to tiling)"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 5: Wet area floor waste and tile falls)"}]

