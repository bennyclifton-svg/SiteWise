  group: Ground design parameters
  label: Beyond-spot groundwater monitoring / hydrogeology / dewatering; define objective, duration and specialist
  kind: technical
  value: O
  provenance:
  - kind: evidence
    ref: geotechnical#9,10
  - kind: seed
    ref: geotechnical#45
- key: asset_exposure
