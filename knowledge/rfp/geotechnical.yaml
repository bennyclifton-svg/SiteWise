  - {key: record_locations_datum, text: 'Record locations/datum/precision, logs/photos, groundwater and incomplete/refusal
      points', when: [flag: [geotech_intrusive]], if_unknown: ask}
  - {key: traceable_lab_records, text: traceable lab records and scheduled site handback., when: [flag: [
            geotech_intrusive]], if_unknown: ask}
  - {key: factual_results_ground, text: 'Factual results, ground model, limitations and selected footing/settlement, earthworks,
      excavation, groundwater, aggressivity, pavement and classification parameters'}
  - {key: location_plan_designer, text: location plan and designer parameter schedule}
  - {key: identify_pending_tests, text: Identify pending tests and further evidence.}
