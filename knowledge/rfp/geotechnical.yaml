terms:
- key: agreement
  text: Agree {field:agreement}, precedence and express departures before instruction; commencing work does not 
    accept competing supplier terms.
  provenance:
  - kind: evidence
    ref: geotechnical#35,36,37,38,39,40,41,42,43
  - kind: client_decision
    ref: geotechnical#52
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
  replace: true
  required: true
- key: authority
  text: 'Written authority before extra scope/allowance/fee/program changes; state reason, baseline and effect. Immediate
    safety action: notify and record minimum action/cost. Agree standby/cancellation and handback.'
  provenance:
  - kind: evidence
    ref: geotechnical#22,37,38
  - kind: client_decision
    ref: geotechnical#52
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
  replace: true
- key: baseline
  text: Design sign-off sets the pricing baseline; normal agreed development remains included.
  provenance:
  - kind: client_decision
    ref: geotechnical#52
    why: Preserve the agreed pricing baseline without charging for own errors.
  replace: true
- key: payment
  text: Monthly itemised invoices payable within {field:payment_days} days; disclose deposits/report 
    withholding/licence suspension departures.
  provenance:
  - kind: evidence
    ref: geotechnical#36,40
  - kind: client_decision
    ref: geotechnical#52
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
  replace: true
- key: professional
  text: Client supplies inputs/access; report gaps. Manage agreed work/subcontractors without blanket service 
    waiver. Disclose caps/time bars/indemnities/transfer/IP departures; agree notice/cure, safe handback, records 
    and disputes.
  provenance:
  - kind: evidence
    ref: geotechnical#21,22,23,24,38,39,40,41,42,43
- key: records
  text: Dated PDFs, logs/lab certificates and editable data/registers; agree project use/reliance, confidentiality, 
    sample retention/evidence preservation, instrument ownership and handover. State storage cost before disposal.
  provenance:
  - kind: evidence
    ref: geotechnical#40,42
  - kind: seed
    ref: geotechnical#49
  - kind: client_decision
    ref: geotechnical#53
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
