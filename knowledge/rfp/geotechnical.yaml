terms:
- key: agreement
  text: Agree {field:agreement}, precedence and express departures before instruction; commencing work does not accept
    competing supplier terms.
  provenance:
  - kind: evidence
    ref: geotechnical#35,36,37,38,39,40,41,42,43
  - kind: client_decision
    ref: geotechnical#52
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
  replace: true
  required: true
- key: authority
  text: 'Written authority before extra scope/allowance/fee/program changes; state reason, baseline and effect. Immediate
    safety action: notify and record minimum action/cost. Agree standby/cancellation and handback.'
  provenance:
  - kind: evidence
    ref: geotechnical#22,37,38
  - kind: client_decision
    ref: geotechnical#52
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
  replace: true
- key: baseline
  text: Design sign-off sets the pricing baseline; normal agreed development remains included.
  provenance:
  - kind: client_decision
    ref: geotechnical#52
    why: Preserve the agreed pricing baseline without charging for own errors.
  replace: true
- key: payment
  text: Monthly itemised invoices payable within {field:payment_days} days; disclose deposits/report withholding/licence
    suspension departures.
  provenance:
  - kind: evidence
    ref: geotechnical#36,40
  - kind: client_decision
    ref: geotechnical#52
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
  replace: true
- key: professional
  text: Client supplies inputs/access; report gaps. Manage agreed work/subcontractors without blanket service waiver.
    Disclose caps/time bars/indemnities/transfer/IP departures; agree notice/cure, safe handback, records and disputes.
  provenance:
  - kind: evidence
    ref: geotechnical#21,22,23,24,38,39,40,41,42,43
- key: records
  text: Dated PDFs, logs/lab certificates and editable data/registers; agree project use/reliance, confidentiality, sample
    retention/evidence preservation, instrument ownership and handover. State storage cost before disposal.
  provenance:
  - kind: evidence
    ref: geotechnical#40,42
  - kind: seed
    ref: geotechnical#49
  - kind: client_decision
    ref: geotechnical#53
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
returnable_notes:
- key: r1
  replace: true
  text: 'Price stages/options separately: fixed, time-ceiling or unit basis; quantities, rates, GST, dependencies and
    markups. Cored alternatives include auger: total and increment, no double count. Acknowledge addenda. Confirm the
    signatory can bind your firm.'
  provenance:
  - kind: evidence
    ref: geotechnical#29,30,31,32,33,34,35,36
  - kind: client_decision
    ref: geotechnical#51,52
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
- key: r2
  replace: true
  text: 'Plan, logs/location/photos, labs, ground model/parameters, interim/final/monitoring reports and completion records:
    purpose, recipient, editable formats, dates, rounds, limits/reliance and pending tests.'
  provenance:
  - kind: evidence
    ref: geotechnical#11,12,13,14,15,34,42
  - kind: seed
    ref: geotechnical#49
  - kind: client_decision
    ref: geotechnical#53
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
- key: r3
  replace: true
  text: Role/equipment and extra metre/hole/test/well/visit rates; minimum hire, travel, standby/cancellation, expedited
    lab/storage/restoration, ceilings and escalation. Expose markups.
  provenance:
  - kind: evidence
    ref: geotechnical#31,32,37,42
  - kind: client_decision
    ref: geotechnical#52
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
- key: r4
  replace: true
  text: Name lead, field supervisor, reviewer, environmental specialist, labs/subcontractors, competence and availability.
    Allocate clearance, sampling, design, disposal, reinstatement and handover; QA ISO or equivalent.
  provenance:
  - kind: evidence
    ref: geotechnical#21,22,23,24,41,42,43
  - kind: seed
    ref: geotechnical#44,45,46,50
  - kind: client_decision
    ref: geotechnical#53,54
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
- key: r5
  replace: true
  text: 'Two or three comparable investigations with referees: actual ground/excavation, existing/live constraints, scale,
    decision, role and outcome.'
  provenance:
  - kind: seed
    ref: geotechnical#44,47,48,49
  - kind: client_decision
    ref: geotechnical#54
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
- key: r6
  replace: true
  text: List scope/agreement departures, alternatives and fee/time effect, or nil. Include conflicting levels, counts/depths,
    reliance/environmental scope; authorised assumptions need quantity, decision owner/date.
  provenance:
  - kind: evidence
    ref: geotechnical#2,3,4,5,6,7,8,9,10,18,20,28,35,36,37,38,39,40,41,42,43
  - kind: client_decision
    ref: geotechnical#51
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
- key: r7
  replace: true
  text: Input/plan approval, mobilisation, field/lab, preliminary/final report and monitoring endpoint dates; optional
    construction coverage, booking notice, dependencies/start/pause and interim report limits.
  provenance:
  - kind: evidence
    ref: geotechnical#9,33,34
  - kind: seed
    ref: geotechnical#45,46
- key: r8
  replace: true
  text: Client-selected PI {field:pi} and PL {field:pl}. Current PI/PL/workers compensation as applicable, claim/aggregate
    limits, exclusions, continuity and competence/registration. Agree client-selected insurance limits before issue.
  provenance:
  - kind: evidence
    ref: geotechnical#41
  - kind: client_decision
    ref: geotechnical#54
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
- key: r9
  replace: true
  text: 'Labs/plant/locator, permits, water/skips/disposal/restoration, travel, instruments/storage: included/allowance/rate,
    payer, quantity, markup/GST and approval. No R1 duplication; identify client-direct work.'
  provenance:
  - kind: evidence
    ref: geotechnical#22,23,24,26,27,32,37,42
  - kind: client_decision
    ref: geotechnical#53
    why: Apply the draft client scope, records and procurement choices; do not import historical supplier defaults.
durations: R7 states access/input milestones, field/lab dates, interim limitations and monitoring endpoint; no historical
  program adopted.
