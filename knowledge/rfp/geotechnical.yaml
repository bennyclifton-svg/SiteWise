project_rows:
- key: procurement
  replace: true
  label: Procurement
  text: '{procurement_route}; no automatic later appointment or novation.'
  provenance:
  - kind: seed
    ref: geotechnical#45
  - kind: client_decision
    ref: geotechnical#51
    why: Delivery route cannot appoint or transfer this consultant.
- key: ground_brief
  label: Ground brief
  text: Confirm footprints, loads, levels/cut-fill, excavation, prior logs, services, risks, access and reliance 
    recipients; reconcile conflicting plans.
  provenance:
  - kind: evidence
    ref: geotechnical#2,3,4,5,6,7,8,20,21,22,23,24
role:
  - key: geotechnical
    text: "You are the geotechnical engineer. Your job is to tell the design team what the ground is and how it will behave, so foundations, excavation and earthworks are designed safely and economically, and ground risk is known before the client commits."
    provenance: [{"kind": "evidence", "ref": "geotechnical#1,9,15,24,25,26,27,28,42"}, {"kind": "seed", "ref": "geotechnical#45,50"}, {"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: section 2 opens with what the consultant is engaged to achieve and how; the same on every project, with one sentence by building type."}]
  - key: duties
    text: |-
      To do this you:
      - Investigate and interpret the ground for the decision this appointment serves.
      - Say which reports are preliminary and which are final, and when any monitoring ends.
      - Give the structural and civil engineers the design parameters they need, with the uncertainty stated.
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: section 2 opens with what the consultant is engaged to achieve and how; the same on every project, with one sentence by building type."}]
  - key: fit_house
    text: "For this house, this means a site classification and footing advice the builder can price."
    when: [{"module": ["house"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: fit_basement
    text: "With a basement or deep excavation, this includes groundwater, retention and the effect on neighbouring structures."
    when: [{"flag": ["basement"]}]
    provenance: [{"kind": "client_decision", "ref": "docs/plans/2026-11-07-rfp-role-purpose.md", "why": "Owner 2026-11-07: what fit for purpose means changes with the building type; the duties do not."}]
  - key: boundary
    text: "The civil and structural designers own the design; the contractor owns construction methods, temporary works and supervision. Environmental assessment is a separate appointment."
    provenance: [{"kind": "evidence", "ref": "geotechnical#1,9,15,24,25,26,27,28,42"}, {"kind": "seed", "ref": "geotechnical#45,50"}]
  - key: advice_limits
    text: "For advice or defect work, state the decision, the date the evidence stops, who may rely on the advice, the gaps and the further tests needed. Observations do not prove cause or unconditional suitability. Preserve the evidence before any repair."
    when: [{"work_type": ["advisory", "remediation"]}]
    provenance: [{"kind": "seed", "ref": "geotechnical#48,49"}]
stage_intro: Base stages only, from written instruction/input-access milestone to the selected deliverable. Later 
  options require written instruction; agree interim reports and monitoring endpoint.
boundary:
- start: brief_concept
  end: brief_concept
# One table: each stage with its lines and services (owner direction, 3 November 2026).
