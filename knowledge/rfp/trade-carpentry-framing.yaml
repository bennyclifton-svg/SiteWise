role:
  - key: contractor
    text: "You are the framing carpenter. Your job is to erect, brace and tie down the floor, wall and roof framing the documents show, square, plumb and ready for the frame inspection, safely and on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Structural Framing Systems)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Present the frame for the certifier's frame inspection before any lining or cladding covers it, and fix what the inspection finds.
      - Keep notches and holes in framing members within the limits the documents allow, and report any cut another trade makes.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/structural-residential.md (Frame inspection gate)"}, {kind: seed, ref: "data/reference/clerk/data/seed/structural-residential.md (Notching, drilling, and modification rules)"}]

