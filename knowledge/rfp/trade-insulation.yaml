id: trade-insulation
version: 1
status: draft
kind: works
title: "Insulation"
heading: "REQUEST FOR TENDER: INSULATION"
discipline_ids: [trade.insulation]
evidence_limit: "Seed guidance only; no historical tender for this trade has been encoded."

scale:
  text: "One trade package."
  complex: []

role:
  - key: contractor
    text: "You are the insulation contractor. Your job is to install the wall, ceiling, roof and floor insulation the documents and the energy commitments show, without gaps or compression, and to seal the envelope where the documents give it to you, on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Energy Efficiency and Thermal Performance)"}, {kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS/NZS 4859 Series — Thermal Insulation Materials)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Install ceiling insulation only once the head contractor confirms the roof is weathertight.
      - Keep the clearances the documents require around downlights, flues and other heat sources.
      - Give the evidence the energy assessor and certifier need that the installed insulation matches the energy commitments.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md (Interface 7: Roof framing to insulation and ceiling)"}, {kind: seed, ref: "data/reference/clerk/data/seed/residential-construction-guide.md (Energy Efficiency and Thermal Performance)"}]

stage_intro: "A supply-only tender excludes the installation lines."
