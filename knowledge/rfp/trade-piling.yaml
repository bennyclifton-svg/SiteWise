role:
  - key: contractor
    text: "You are the piling contractor. Your job is to install the piles the documents show to their founding level and position, test them as the specification requires, and give the engineer the records to accept them, safely and on program."
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/as-standards-reference.md (AS 2159 — Piling — Design and Installation)"}, {kind: seed, ref: "data/reference/clerk/data/seed/commercial-construction-guide.md (Structural Systems for Commercial Buildings)"}, {kind: client_decision, ref: "docs/plans/2026-11-08-trade-rft.md", why: "Owner 2026-11-08: trade RFTs open like the consultant RFPs, with what the firm is engaged to achieve."}]
  - key: duties
    text: |-
      To do this you:
      - Build the works in this section and coordinate them with the head contractor and the other trades.
      - Arrange the inspections and tests your trade needs, and provide the certificates your trade signs.
      - Stop and tell the engineer when the ground or an obstruction differs from the geotechnical report.
      - Hold each pile for the founding inspection the geotechnical or structural engineer sets.
      - Hand over manuals, warranties and as-built records.
    provenance: [{kind: seed, ref: "data/reference/clerk/data/seed/trade-interfaces-coordination-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/geotechnical-guide.md"}, {kind: seed, ref: "data/reference/clerk/data/seed/structural-commercial-industrial-guide.md"}]

