version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries:
      - internal/db/queries.sql
      - internal/store/decisions.sql
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "tsvector"
            go_type: "string"
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
