# /etc/postgresql/17/main/conf.d/sitewise.conf
# Local socket only: the app and backups run on this host.
listen_addresses = ''
# Continuous archiving for pgBackRest. archive_timeout bounds how much
# committed work a lost host can take with it on a quiet system.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=sitewise archive-push %p'
archive_timeout = 60
max_wal_senders = 3
# Sized for a small VPS (4 GB RAM); revisit with the host's real memory.
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
