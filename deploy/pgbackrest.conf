# /etc/pgbackrest/pgbackrest.conf, owner root:postgres, mode 0640.
# Continuous PostgreSQL backup: every WAL segment is pushed off-site as it is
# archived, and backup.sh takes a full backup weekly and a differential
# nightly. Restore to any point covered by retained WAL.
[global]
repo1-type=s3
repo1-path=/sitewise/pgbackrest
repo1-s3-endpoint=REPLACE_S3_ENDPOINT
repo1-s3-bucket=REPLACE_BUCKET
repo1-s3-region=REPLACE_REGION
repo1-s3-uri-style=path
repo1-s3-key=REPLACE_ACCESS_KEY
repo1-s3-key-secret=REPLACE_SECRET_KEY
# Client-side encryption: the object store never sees plaintext. Keep the
# passphrase in the off-host secret store too; without it the backup is lost.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=REPLACE_CIPHER_PASSPHRASE
# Four weekly fulls (about a month of point-in-time recovery).
repo1-retention-full=4
compress-type=zst
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail

[sitewise]
pg1-path=/var/lib/postgresql/17/main
pg1-socket-path=/var/run/postgresql
