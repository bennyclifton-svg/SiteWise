# RFP expectations use the data/eval/rfp/answer-keys keys exactly. app_differs = where the app's output is
# expected to differ from `expect`, and why. The base flags match T01 except flag.osd_required yes.
rfps:
  - discipline: consultant.architect
    template: architecture
    built_in: "partial"
    source: "knowledge/rfp/architecture.yaml house_documents"
    why: "House and existing_building modules on; nothing in the template names attached dwellings, the separating wall or the subdivision"
    must_include: ["Concept and schematic design for two dwellings and the lot split on the survey of the existing site", "Demolition plan of every structure to go; investigations needed (existing_interfaces)", "DA planning approval documentation for demolition, the dual occupancy and Torrens subdivision", "Planning response to council requests", "Design development", "House tender and construction documents (house_documents) for both dwellings", "Separating wall fire and acoustic details: FRL from the slab to the underside of the roof covering, only small battens and sarking crossing, shared eaves lined, discontinuous construction where required", "Kitchen, bathroom, laundry and joinery design", "Finishes, fixtures and appliances selections schedule", "Specification", "Tender (bidding) support", "Certifier liaison", "Lodging the DA through the NSW Planning Portal", "Option: construction-phase support", "Option: contract administration"]
    must_not_include: ["BIM coordination or clash detection", "Tenant fit-out", "Signage and wayfinding", "Facade certification", "Apartment design-quality submission", "Green Star or NABERS", "Regulated-design declarations", "D&C tender documents", "Post-novation stage", "Brief and masterplan stage", "Community consultation", "Connecting with Country input"]
    expect:
      stages_include: [concept, schematic, planning_approval, planning_response, design_development, house_documents, bidding]
      stages_option: [construction_support, contract_admin]
      stages_absent: [brief_masterplan, interiors, tender_traditional, dnc_tender, regulated_design, for_construction, post_novation]
      positions: {coordination: I, input_schedule: I, specialist_coordination: I, specification: I, house_interiors: I, house_selections: I, door_schedule: I, certifier_liaison: I, document_uploads: I, lodgement: I, existing_interfaces: I, ffe: O, modifications: O, value_management: O, marketing_renders: X, court: X, as_built: X, others_fees: X, water_asset: absent, sustainability_docs: absent, country: absent, bim_model: absent, tenant_fitout: absent, signage: absent, facade_certification: absent, community: absent, live_staging: absent}
      blocking: ["fact:budget"]
      sources:
        - "blocking: fact:budget holds while proj.budget_stated is unread (architecture.yaml required_facts); the scenario states the budget"
        - "existing_interfaces I because det.existing_building is true (module existing_building)"
        - "brief_masterplan absent because flag.staged and flag.multi_building are no for one attached building"
    app_differs:
      - {key: stage.bidding, app: option, expect: include, why: "bidding comes after the house boundary end (house_documents), so resolveStages prices it as an option"}
      - {key: text.separating_wall, app: "not named", expect: "separating wall FRL, acoustic rating and roof termination named", why: "the template has no attached-dwelling row"}
      - {key: text.subdivision, app: "not named", expect: "subdivision named in the planning approval scope", why: "no subdivision row; the DA is for the dwellings and the lot split"}
  - discipline: consultant.structural
    template: structural
    built_in: "partial"
