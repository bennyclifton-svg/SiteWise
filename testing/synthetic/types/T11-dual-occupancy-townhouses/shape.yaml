triggers:
  - id: cdc-low-rise-code
    label: Complying development under the Low Rise Housing Diversity Code instead of a DA
    evidence: ["Complying development certificate for an attached dual occupancy under the Low Rise Housing Diversity Code", "the design meets the code's lot size, frontage and height standards so a certifier can approve it"]
    negation: ["A development application will be lodged with council for the dual occupancy and subdivision", "The design exceeds the code's height standard, so a DA will be lodged"]
    profile: [hdr.cond.planning]
    adds:
      program: ["Prepare and lodge the complying development certificate", "Certifier determination", "Separate approval for the subdivision"]
      cost_plan: ["Contributions still payable under the CDC", "Subdivision approval fee"]
      rfps: [{discipline: consultant.certifier, must_include: ["CDC assessment and determination"]}]
      authority: ["CDC by a registered certifier under the Codes SEPP Part 3B (verified: false); neighbour notice before work; subdivision by its own CDC or DA (verified: false)"]
    removes:
      procurement: [consultant.town_planner]
      cost_plan: ["DA fees and contributions"]
      program: ["Lodge the DA", "Neighbour notification", "DA assessment and determination", "Construction certificate"]
      rfps: [consultant.town_planner]
    why: "The CC and certifier fees line stays (cc-fees always applies; the certifier is paid for the CDC). The app keeps the town planner through baselines[0], then its RFP and the certifier's block on cdc; it drops the whole DA-fees starter, losing the contributions; and the skeleton becomes sk.new-traditional-cdc, which has no construction_documentation stage although a CDC needs construction-level documents before lodgement"
    built_in: {program: "yes", cost_plan: "partial", procurement: "no", rfps: "no"}
    source: "knowledge/program/fragments.yaml fr.cdc-application"
  - id: strata-subdivision
    label: Strata (or community title) subdivision instead of Torrens
    evidence: ["Strata subdivision of the dual occupancy into two lots and common property", "the driveway will be common property under a two-lot strata scheme", "SP plan and by-laws to be registered"]
    negation: ["Torrens title subdivision into two lots, each with its own street frontage", "No common property is proposed"]
    profile: []
    adds:
      cost_plan: ["Strata plan and strata certificate fees", "Strata by-laws and solicitor"]
      program: ["Prepare strata plan", "Strata certificate", "Register the strata plan and establish the owners corporation"]
      rfps: [{discipline: consultant.surveyor, must_include: ["Strata plan with lot and common property boundaries"]}]
      authority: ["Strata certificate by council or a registered certifier under the Strata Schemes Development Act 2015 (verified: false)"]
    removes:
      program: ["Final plan of subdivision and 88B instrument", "Subdivision certificate"]
    built_in: {rfps: "partial", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/land-surveying.yaml titling"
  - id: front-rear-shared-driveway
    label: Front and rear dwellings sharing one driveway (battle-axe layout)
    evidence: ["Dwelling 2 is at the rear, reached by a shared driveway along the southern boundary", "a right of carriageway over Lot 1 in favour of Lot 2", "battle-axe handle 3.5 m wide"]
    negation: ["Each dwelling has its own driveway and vehicle crossing", "side-by-side dual occupancy, both dwellings face the street"]
    profile: []
    adds:
      cost_plan: ["Shared driveway pavement and drainage", "Right of carriageway and services easements"]
      program: ["Construct the shared driveway"]
      rfps: [{discipline: consultant.civil, must_include: ["Shared driveway long section, swept paths and drainage"]}, {discipline: consultant.surveyor, must_include: ["Right of carriageway and services easements on the plan"]}]
      authority: ["Easements created by the 88B instrument or common property under strata", "Rear lot's private water and sewer lines in an easement for services, water line in a protective conduit (Sydney Water dual occupancy guide §4.5)"]
    why: "One crossing replaces two, but it still needs s138 consent, so the road-reserve line stays (one crossing); the rear dwelling's services run along the handle in easements"
    built_in: {cost_plan: "no", program: "no", rfps: "partial"}
    source: "knowledge/rfp/civil.yaml roads"
  - id: three-plus-townhouses
    label: Three or more townhouses (multi dwelling housing)
    evidence: ["Multi dwelling housing comprising 4 two-storey townhouses", "community title subdivision into 4 lots with a common driveway", "R3 Medium Density Residential zone"]
    negation: ["Attached dual occupancy (two dwellings only)", "No further dwellings are proposed"]
    profile: [hdr.scale.dwellings]
    adds:
      procurement: [consultant.traffic, consultant.waste]
      cost_plan: ["Traffic and parking consultant", "Waste management consultant", "Common driveway, bin store and mailboxes"]
      program: ["Traffic and parking report", "Waste management plan"]
      rfps: [{discipline: consultant.traffic, must_include: ["Parking and access advice", "Traffic and parking report for the DA", "Swept paths for the common driveway and waste collection"]}]
      authority: ["Multi dwelling housing under the LEP; strata or community title; more contributions"]
    built_in: {procurement: "no", rfps: "partial", cost_plan: "no", program: "no"}
    source: "knowledge/rfp/traffic.yaml design_advice"
    why: "Still Class 1a with separating walls; no package rule adds traffic or waste for a residential class (baselines[1] is non-residential only)"
  - id: detached-dual-occupancy
    label: Detached dual occupancy (two separate buildings)
    evidence: ["Detached dual occupancy: a new dwelling at the front and a second at the rear", "two buildings separated by a 1.8 m landscaped courtyard"]
    negation: ["Attached dual occupancy with a common separating wall"]
    profile: [flag.multi_building]
    adds:
      cost_plan: ["Second set of external walls and roof edges"]
      rfps: [{discipline: consultant.architect, must_include: ["Separation between buildings checked against the 900 mm boundary rule (verified: false)"]}]
    removes:
      cost_plan: ["Passive fire protection"]
    why: "No separating wall, so fire-passive and acoustic separation leave the scope; flag.multi_building turns on the architect's brief_masterplan stage and the staged RFP module, which a two-house job does not need"
    built_in: {rfps: "partial", cost_plan: "no"}
    source: "knowledge/rfp/modules.yaml staged"
  - id: vacant-lot
    label: Vacant lot (no house to demolish)
    evidence: ["The site is vacant: there is no existing building on the lot", "the previous house was demolished under a separate consent"]
    negation: ["The existing dwelling built in 1958 will be demolished"]
    profile: [det.existing_building, det.existing_building_year]
    adds:
      rfps: [{discipline: consultant.surveyor, must_include: ["Detail survey of the vacant lot including any remnant slabs, fill and old drainage"]}]
      authority: ["Evidence of the earlier demolition consent and asbestos clearance on file"]
    removes:
      procurement: [consultant.hazmat]
      cost_plan: ["Demolition and hazardous materials removal", "Services disconnections and make-safe before demolition", "Hazmat survey (consultant fee)", "Provisional sum for latent ground conditions after demolition"]
      program: ["Loose-fill asbestos register search", "Demolition hazardous materials survey", "Demolition plan, demolition work plan and waste plan", "Request meter removal and service abolishment", "Occupants vacate the house", "Disconnect and abolish services; cap the old sewer junction", "SafeWork NSW asbestos removal notification", "Licensed asbestos removal", "Asbestos clearance certificate", "Isolate, demolish and clear", "Remove old footings, slabs and buried drainage; record waste disposal"]
      rfps: [consultant.hazmat]
    why: "det.existing_building false turns off the existing_building RFP module: architecture existing_interfaces, civil retained_services and structural existing_assessment leave"
    built_in: {rfps: "yes", procurement: "no", cost_plan: "partial", program: "partial"}
    source: "knowledge/rfp/modules.yaml existing_building"
  - id: no-subdivision
    label: Dual occupancy kept on one title (no subdivision)
    evidence: ["Both dwellings will be retained on the one title and rented", "No subdivision is proposed in this application"]
    negation: ["Torrens title subdivision into two lots is proposed with the dual occupancy"]
    profile: []
    adds:
      authority: ["Sydney Water may still require two connections if a later subdivision is intended (dual occupancy guide §4.2); Section 73 may still be a consent condition (verified: false)"]
    removes:
      cost_plan: ["Subdivision certificate and plan registration fees (council or certifier, NSW Land Registry Services)", "Solicitor for subdivision instruments (88B easements, restrictions and covenants)"]
      program: ["Draft plan of subdivision", "DNSP notification of arrangement for both lots", "Telecommunications provisioning evidence for both lots", "Survey certificate: services wholly within each lot", "Final plan of subdivision and 88B instrument", "Subdivision certificate", "Register the plan at NSW Land Registry Services"]
    why: "The certifier's subdivision-certificate option goes; surveyor titling goes back to absent and s5_support and s7_completion to option, which is what the app already prices"
    built_in: {rfps: "partial", cost_plan: "no", program: "no"}
    source: "knowledge/rfp/land-surveying.yaml titling"
  - id: stormwater-easement
    label: Lot falls to the rear and needs a drainage easement
    evidence: ["The site falls to the rear; stormwater cannot reach the street by gravity", "an interallotment drainage easement through No. 22 is required", "deferred commencement until the easement is created"]
    negation: ["Stormwater discharges by gravity to the kerb in front of the site"]
    profile: []
    adds:
      cost_plan: ["Easement survey and legal costs", "Downstream pipe works"]
      program: ["Negotiate drainage easement with downhill owner", "Satisfy deferred commencement condition"]
      rfps: [{discipline: consultant.civil, must_include: ["Easement route and design with discharge confirmed before the DA"]}]
      authority: ["Downhill owner's consent; easement registration; deferred commencement consent"]
    built_in: {rfps: "no", cost_plan: "no", program: "no"}
  - id: sewer-main-in-lot
    label: Sydney Water sewer main inside the lot
