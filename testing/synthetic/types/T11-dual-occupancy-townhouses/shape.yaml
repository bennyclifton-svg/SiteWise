schema: sitewise-synthetic-shape/1
type_id: T11
slug: dual-occupancy-townhouses
name: Dual occupancy or townhouses
reviewed: false
state: NSW
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
# Base: an attached, side-by-side, two-storey dual occupancy (two Class 1a dwellings, each with an attached
# Class 10a garage) on a serviced R2 lot in Greater Sydney, replacing the existing house (built 1958), which is
# demolished under the same DA; Torrens title subdivision into two lots in the same DA; council on-site
# detention; architect-led traditional tender; one HIA lump-sum contract. A vacant lot is the vacant-lot trigger.
profile:
  hdr.building_class: residential
  hdr.subclass: townhouses
  hdr.work_type: new
  hdr.cond.planning: da
  hdr.cond.procurement_route: traditional
  hdr.cond.quality_level: mid
  hdr.cond.operational_constraints: vacant
  hdr.cond.stakeholder_complexity: single_owner
  hdr.cond.access_constraints: unrestricted
  hdr.cond.environmental_sensitivity: standard
  # The townhouses subclass has no storeys scale field (taxonomy.yaml townhouses scale_fields); two storeys is in prose.
  hdr.scale.site_sqm: 700
  hdr.scale.dwellings: 2
  hdr.scale.gfa_sqm: 460
  hdr.scale.avg_dwelling_size_sqm: 230
  det.ncc_class: [1a, 10a]
  det.state: NSW
  # Demolition is work to an existing building (T10 convention): turns on the existing_building RFP module.
  det.existing_building: true
  det.existing_building_year: 1958
  det.heritage_status: none
  det.bushfire_prone_land: false
  det.flood_hazard: false
  det.climate_zone: "5"
  det.sewer_connection: reticulated
  det.water_supply_source: reticulated
  det.gas_supply: none
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  fact.contract_form: domestic_hia
  proj.regulated_design: "no"
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.osd_required: "yes"
  flag.architect_lodges: "yes"
  flag.basement: "no"
  flag.excavation_adjoining: "no"
  flag.authority_asset: "no"
  flag.arborist_tree_impacts: "no"
  flag.osd_existing: "no"
  flag.cl46: "no"
  flag.public_road: "no"
  flag.norbe: "no"
  flag.stormwater_quality: "no"
  flag.sustainability_target: "no"
  flag.panel: "no"
  flag.community: "no"
  flag.groundwater: "no"
  flag.rail: "no"
  flag.transfer_structures: "no"
  flag.coastal: "no"
  flag.country: "no"
  flag.staged: "no"
  flag.multi_building: "no"

expected_derived:
  - {key: det.basix_required, value: true, source: "knowledge/clusters/envelope/rules.yaml rule.basix.certificate-required", note: "one BASIX project for both dwellings (the Planning Portal's 'more than 1 dwelling' path), NatHERS per dwelling; derivation pending in the rule, returns unknown today"}
  - {key: det.energy_compliance_pathway, value: basix, note: "no profile_group, so not settable"}

scenario_inputs:
  - {key: proj.budget_stated, note: "stated in the owner's brief; amount chosen by the scenario author; without it the architecture RFP blocks on fact:budget", phrasing: "Construction budget for both dwellings: $<amount> excluding GST"}
  - {key: flag.architect_lodges, note: "needs an explicit statement in a read document", phrasing: "The architect's services run from concept design through to lodging the DA on the NSW Planning Portal"}
  - {key: flag.osd_required, note: "council's stormwater policy or a DA condition must say it; a civil fee proposal saying 'OSD design' alone is weaker evidence", phrasing: "Council's stormwater management policy requires on-site detention for the dual occupancy"}
  - {key: hdr.scale.dwellings, note: "the scale trigger needs a digit; 'two dwellings' in words is not read", phrasing: "2 dwellings on proposed Lots 1 and 2"}
  - {key: det.existing_building, note: "the determinant's only trigger is the phrase 'existing building'; 'existing dwelling' alone is never asked", phrasing: "The site contains an existing building (a single-storey dwelling and garage), to be demolished"}
  - {key: det.existing_building_year, note: "the year triggers need 'built in <year>' or 'year built'; '1950s' is missed", phrasing: "The existing dwelling was built in 1958"}
  - {key: det.ncc_class, note: "'Class 1 dwelling' is not read as a class", phrasing: "Building classification: two Class 1a dwellings, each with an attached Class 10a garage"}

work_items:
  - {system: site.survey-boundaries, action: new, why: "Set-out of the separating wall on the proposed lot boundary, identification surveys, and the draft and final plans of subdivision"}
  - {system: site.demolition, action: remove, why: "Demolish the house, garage, slabs, paths and driveway; hazmat survey, licensed asbestos removal and clearance; not in the default list, and implied_by strip-out gives action new, so fr.demolition-1a fires only on a remove reading"}
  - {system: site.ground-conditions, action: investigate, why: "Geotechnical investigation for AS 2870 site classification; not in the default list"}
  - {system: site.earthworks, action: new, why: "Cut and fill to the slab platforms for both dwellings, spoil disposal"}
  - {system: site.erosion-sediment-control, action: new, why: "Sediment fence and stabilised entry; standard DA condition"}
  - {system: site.stormwater-detention, action: new, why: "Site drainage for both lots, OSD tank or tanks with orifice and overflow, kerb outlet"}
  - {system: site.services-connections, action: new, why: "New water service and meter, sewer junction, electricity service and NBN lead-in for each lot; the old house's junction is capped or reused only as a new lot's connection (Sydney Water dual occupancy guide §4.7)"}
  - {system: site.vehicle-access, action: new, why: "Two driveways, paths and garage aprons"}
  - {system: site.public-domain, action: new, why: "Two council vehicular crossings and footpath reinstatement under Roads Act s138 consent (verified: false); not in the default list"}
  - {system: site.landscape, action: new, why: "Turf, planting, paving, front fences and the new dividing fence on the lot boundary, to the DA landscape plan"}
  - {system: substructure.footings, action: new, why: "Edge beams and the thickened footing under the separating wall"}
  - {system: substructure.slab-on-ground, action: new, why: "Waffle or stiffened raft slabs to AS 2870, usually one slab per dwelling with a break at the separating wall"}
  - {system: substructure.termite-management, action: new, why: "AS 3660.1 barrier to both dwellings"}
  - {system: structure.timber, action: new, why: "Wall frames, trusses, upper floor, bracing and tie-down for both dwellings"}
  - {system: structure.masonry, action: new, why: "Brick veneer and, where chosen, a masonry separating wall; not in the default list"}
  - {system: structure.steel, action: new, why: "Steel or LVL beams over garage doors and living openings; not in the default list"}
  - {system: fire-passive.rated-elements, action: new, why: "The separating wall system with its FRL (ABCB Housing Provisions Part 9.3, verified: false); in the townhouses default list"}
  - {system: fire-passive.compartments, action: new, why: "Separation between the two dwellings from the footings or slab to the underside of a non-combustible roof covering (or 450 mm above a combustible one); only small roof battens and sarking may cross; shared eaves lined (Housing Provisions 9.3.1, verified: false); the system that owns attached-dwelling party walls; not in the default list (arrives only via implied_by party-wall)"}
  - {system: interiors.acoustic-separation, action: new, why: "Sound insulation of the separating wall, Rw + Ctr of 50 or more, discontinuous construction where a wet area or kitchen adjoins a habitable room other than a kitchen next door (Housing Provisions Part 10.7, verified: false); in the default list"}
  - {system: envelope.external-walls, action: new, why: "Brick veneer and lightweight cladding"}
  - {system: envelope.roof-coverings, action: new, why: "Metal or tiled roof, separated at the party wall"}
  - {system: envelope.windows-doors, action: new, why: "Aluminium windows and doors for both dwellings; long lead"}
  - {system: envelope.vehicle-doors, action: new, why: "Two garage doors"}
  - {system: envelope.flashings-seals, action: new, why: "Flashings and damp-proof courses"}
  - {system: envelope.pliable-membranes, action: new, why: "Sarking and wall wrap"}
  - {system: envelope.thermal-insulation, action: new, why: "Insulation to the NatHERS specification"}
  - {system: envelope.thermal-performance, action: new, why: "BASIX thermal, energy and water commitments for both dwellings"}
  - {system: interiors.walls-linings, action: new, why: "Plasterboard and wet-area linings"}
  - {system: interiors.ceilings, action: new, why: "Ceilings and bulkheads"}
  - {system: interiors.wet-area-waterproofing, action: new, why: "Bathrooms, ensuites, laundries and powder rooms in both dwellings to AS 3740"}
  - {system: interiors.tiling, action: new, why: "Wet areas and splashbacks"}
  - {system: interiors.floor-finishes, action: new, why: "Timber or hybrid flooring and carpet"}
  - {system: interiors.joinery, action: new, why: "Two kitchens, vanities, laundries, robes; long lead"}
  - {system: interiors.internal-doors, action: new, why: "Doors, frames, hardware"}
  - {system: interiors.internal-glazing, action: new, why: "Shower screens and mirrors"}
  - {system: interiors.painting, action: new, why: "Internal painting"}
  - {system: interiors.ffe, action: new, why: "Kitchen appliances as PC items; not in the default list"}
  - {system: fire-active.smoke-alarms, action: new, why: "Interconnected hard-wired smoke alarms in each dwelling"}
  - {system: mechanical.air-conditioning, action: new, why: "Split or ducted reverse-cycle air-conditioning in each dwelling"}
  - {system: mechanical.local-exhaust, action: new, why: "Bathroom, laundry and rangehood exhaust"}
  - {system: hydraulic.cold-water, action: new, why: "Separate metered water service to each dwelling"}
  - {system: hydraulic.hot-water, action: new, why: "Heat-pump hot water in each dwelling"}
  - {system: hydraulic.sanitary, action: new, why: "Drainage to a separate sewer junction for each lot"}
  - {system: hydraulic.roof-drainage, action: new, why: "Gutters and downpipes, kept separate either side of the party wall"}
  - {system: hydraulic.non-potable-water, action: new, why: "BASIX rainwater tank for each dwelling; not in the default list"}
  - {system: electrical.utility-supply, action: new, why: "Two DNSP connections and consumer mains, one per lot; long lead"}
  - {system: electrical.temporary-power, action: new, why: "Builder's temporary supply; not in the default list"}
  - {system: electrical.switchboards, action: new, why: "A main switchboard per dwelling"}
  - {system: electrical.cabling-wiring, action: new, why: "Final subcircuits and earthing"}
  - {system: electrical.lighting, action: new, why: "Internal and external lighting"}
  - {system: comms-security.carrier-lead-in, action: new, why: "NBN pit and pipe and a lead-in per dwelling"}
  - {system: comms-security.structured-cabling, action: new, why: "Data and TV points"}
  - {system: access-egress.stairs-and-ramps, action: new, why: "Internal stair in each two-storey dwelling; in the default list"}
  - {system: access-egress.barriers, action: new, why: "Stair, void and balcony balustrades and window fall protection; in the default list"}

procurement:
  - {discipline: consultant.architect, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Design lead (architect or building designer), DA for the dual occupancy and subdivision, construction documents, tender"}
  - {discipline: consultant.surveyor, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Detail and boundary survey; draft plan of subdivision for the DA; final plan of subdivision for registration; identification surveys"}
  - {discipline: consultant.geotechnical, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "AS 2870 site classification and footing advice"}
  - {discipline: consultant.hazmat, kind: services, need: always, built_in: "no", why: "Demolition hazardous materials survey, asbestos register and clearance for a pre-2004 house; no package rule reads site.demolition"}
  - {discipline: consultant.structural, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Slabs, footings, separating-wall footing and support, beams, framing review, CC certificates"}
  - {discipline: consultant.civil, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Stormwater concept with OSD for the DA, detailed drainage for both lots, driveway levels, sediment control, OSD certification"}
  - {discipline: consultant.basix, kind: services, need: always, built_in: "no", why: "NatHERS assessments and one BASIX certificate for the dual occupancy; no package rule names it"}
  - {discipline: consultant.certifier, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "CC, principal certifier, critical-stage inspections, OC"}
  - {discipline: consultant.town_planner, kind: services, need: usually, built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[0]", why: "SEE covering dual occupancy permissibility, minimum lot size and frontage for the dual occupancy and the subdivision, DCP controls"}
  - {discipline: consultant.landscape, kind: services, need: usually, built_in: "no", why: "Landscape plan most Sydney DCPs require for a dual occupancy DA"}
  - {discipline: consultant.quantity_surveyor, kind: services, need: optional, built_in: "no", why: "Cost estimate report for the DA where council asks for a QS; construction-loan drawdown reports for the lender"}
  - {discipline: trade.main_works, kind: works, need: always, built_in: "partial", source: "internal/procurement/proposed.go ProposeHeadContract", why: "One lump-sum residential head contract for both dwellings; proposed only from gaps on accepted work items"}

not_expected_procurement:
  - {discipline: consultant.electrical, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Design-and-install by the electrician; the two DNSP connections are designed by an ASP under the builder"}
  - {discipline: consultant.hydraulic, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Plumbing is design-and-install; stormwater and OSD are the civil engineer's; the Section 73 application is run by a Water Servicing Coordinator, not a hydraulic engineer"}
  - {discipline: consultant.mechanical, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml scope_additions[2]", why: "Split or ducted AC is design-and-install"}

cost_plan:
  - {line: "DA fees and contributions", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml da-fees", why: "DA and notification fees, subdivision component, s7.11 or s7.12 contributions for the additional dwelling, with a credit for the demolished house under most plans (verified: false)"}
  - {line: "Housing and Productivity Contribution", section: fees_and_charges, built_in: "no", why: "State contribution for medium-density residential development and subdivision in Greater Sydney; credit for the existing lot (DPHI HPC Applicant Guide to Dual Occupancies, Dec 2025 §4.3); amount unknown"}
  - {line: "Construction certificate and certifier fees", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml cc-fees", why: "Statutory CC and OC lodgement fees; the certifier's professional fee belongs on one line only"}
  - {line: "Service authority connection fees (Sydney Water, DNSP, NBN, both lots)", section: fees_and_charges, built_in: "partial", source: "knowledge/costs/starter_lines.yaml service-authority", why: "One generic line; no split by authority or lot"}
  - {line: "Sydney Water Section 73 fees and infrastructure contributions (per equivalent tenement, set in the Notice of Requirements)", section: fees_and_charges, built_in: "no", why: "Infrastructure contributions reintroduced from 1 July 2024, phased 25% (2024-25), 50% (2025-26), full from 1 July 2026 (Sydney Water land development pages); amount unknown"}
  - {line: "Subdivision certificate and plan registration fees (council or certifier, NSW Land Registry Services)", section: fees_and_charges, built_in: "no", why: "Torrens subdivision into two lots"}
  - {line: "Long service levy", section: fees_and_charges, built_in: "no", why: "Paid before the CC above the threshold"}
  - {line: "Council road-reserve fees and damage security deposit (two s138 crossings)", section: fees_and_charges, built_in: "no", why: "Standard DA conditions; s138 (verified: false)"}
  - {line: "Home Building Compensation Fund insurance (both dwellings)", section: fees_and_charges, built_in: "no", why: "Builder's premium inside the contract sum (R4); listed so a builder's exclusion is caught"}
  - {line: "Architect", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line from the adopted package"}
  - {line: "Structural engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line from the adopted package"}
  - {line: "Civil (stormwater and OSD) engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line from the adopted package"}
  - {line: "Geotechnical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line from the adopted package"}
  - {line: "Hazmat survey (consultant fee)", section: consultants, built_in: "no", why: "No package rule reads site.demolition"}
  - {line: "Surveyor (including plans of subdivision)", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line from the adopted package; subdivision plans are inside it"}
  - {line: "Certifier", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Professional fee; the app also adds P05, a double-count risk"}
  - {line: "Town planner", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[0]", why: "Usually engaged for a dual occupancy and subdivision DA"}
  - {line: "BASIX and NatHERS assessor", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Landscape designer", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Water Servicing Coordinator", section: consultants, built_in: "no", why: "Sydney Water-accredited coordinator who lodges and manages the Section 73 application; no discipline id"}
  - {line: "Solicitor for subdivision instruments (88B easements, restrictions and covenants)", section: consultants, built_in: "no", why: "Easements for the party wall, services and drainage, OSD positive covenant; no discipline id"}
  - {line: "Quantity surveyor (optional)", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Preliminaries and builder's margin", section: construction, built_in: "no", why: "No line; a stated budget spreads preliminaries pro rata"}
  - {line: "Demolition and hazardous materials removal", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 01", why: "site.demolition rolls into 01 Site works; no line of its own and no demolition share in residential_house_new"}
  - {line: "Services disconnections and make-safe before demolition", section: construction, built_in: "no", why: "Electricity, sewer capping, telecom; no item or line"}
  - {line: "Provisional sum for latent ground conditions after demolition", section: construction, built_in: "no", why: "Old footings, rubble, buried drainage, fill, unexpected asbestos"}
  - {line: "Site works and external works", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 01", why: "Earthworks, drainage and OSD, services to each lot, two driveways and crossings, landscape, dividing fence"}
  - {line: "Substructure", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 02", why: "Slabs, footings, termite management"}
  - {line: "Structure", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 03", why: "Frames, trusses, beams, brick veneer"}
  - {line: "Building envelope", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 04", why: "Cladding, roof, windows, garage doors, insulation"}
  - {line: "Interiors and finishes", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 05", why: "Linings, acoustic separation, waterproofing, tiling, two kitchens, floors, painting, appliances"}
  - {line: "Passive fire protection", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 06", why: "The separating wall; the line appears from the default fire-passive.rated-elements item but the house budget split gives fire-passive no share, so a stated budget leaves it unpriced"}
  - {line: "Mechanical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 08", why: "AC and exhaust"}
  - {line: "Hydraulic services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 09", why: "Plumbing, drainage, hot water, two rainwater tanks"}
  - {line: "Electrical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 10", why: "Power, lighting, two switchboards; smoke alarms belong here"}
  - {line: "Communications and security", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 11", why: "NBN lead-ins and data"}
  - {line: "Stairs, ramps, handrails and nosings", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 13", why: "Two internal stairs; access-egress.stairs-and-ramps is in the townhouses default list; a stated budget leaves it unpriced (itemised group; spread skips child lines)"}
  - {line: "Compliant balustrades and barriers", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 13", why: "access-egress.barriers is in the townhouses default list; a stated budget leaves it unpriced (itemised group; spread skips child lines)"}
  - {line: "Provisional sums and PC items", section: construction, built_in: "no", why: "Contract allowances for undecided selections"}
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml design-contingency", why: "Always"}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml construction-contingency", why: "Always"}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml escalation", why: "Always"}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml exclusions", why: "Always; sale costs (agent, marketing, GST on sale) are the developer's feasibility, not this plan"}
  - {line: "Owner supply items", section: contingency, built_in: "partial", source: "internal/store/cost_budget.go applyBriefFigures", why: "Only when proj.owner_supply_stated is read"}

not_expected_cost_plan:
  - {line: "Electrical (consultant fee)", app_label: "F04 Electrical", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Hydraulic (consultant fee)", app_label: "F06 Hydraulic", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Mechanical (consultant fee)", app_label: "F07 Mechanical", section: consultants, source: "knowledge/works/package_defaults.yaml scope_additions[2]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Active fire protection", app_label: "07 Active fire protection", section: construction, source: "knowledge/costs/elements.yaml code 07", why: "Made from the smoke-alarm item; a QS carries smoke alarms in electrical"}

program:
  skeleton: sk.new-traditional-da
  activities:
    - {label: "Planning certificate and title search", stage: investigation, fragment: null, after: [], built_in: "no", why: "s10.7 certificate (verified: false), title, DP, easements, LEP minimum lot size and frontage for dual occupancy and subdivision"}
    - {label: "Sydney Water asset and sewer diagram check", stage: investigation, fragment: null, after: [], built_in: "no", why: "Finds whether each proposed lot can reach the sewer and whether a main crosses the lot"}
    - {label: "Loose-fill asbestos register search", stage: investigation, fragment: null, after: [], built_in: "no", why: "NSW LFAI register"}
    - {label: "Demolition hazardous materials survey", stage: investigation, fragment: null, after: [], built_in: "no", why: "A hazmat activity exists only in fr.existing-conditions, gated to refurb or extend (gap)"}
    - {label: "CCTV or locate the existing drainage and kerb outlet", stage: investigation, fragment: null, after: [], built_in: "no", why: "Decides reuse of the outlet; civil retained_services"}
    - {label: "Services search and locating", stage: investigation, fragment: fr.investigate-services, after: [], built_in: "partial", source: "knowledge/program/fragments.yaml fr.investigate-services", why: "Needs an investigate action on site.services-connections; default is new"}
    - {label: "Detail and boundary survey", stage: investigation, fragment: fr.investigate-survey, after: [], built_in: "partial", source: "knowledge/program/fragments.yaml fr.investigate-survey", why: "Needs an investigate action; default is new"}
    - {label: "Geotechnical investigation", stage: investigation, fragment: fr.investigate-geotech, after: [], built_in: "partial", source: "knowledge/program/fragments.yaml fr.investigate-geotech", why: "site.ground-conditions is not in the default scope"}
    - {label: "Confirm the brief", stage: concept_design, fragment: fr.concept-design-1a, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Brief: two dwellings for sale or rent, subdivision intent"}
    - {label: "Prepare the concept design", stage: concept_design, fragment: fr.concept-design-1a, after: ["Confirm the brief", "Detail and boundary survey", "Planning certificate and title search"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Two-dwelling layout and lot split tested against minimum lot size and frontage"}
