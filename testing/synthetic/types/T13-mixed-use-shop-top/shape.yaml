triggers:
  - id: effective-height-over-25m
    label: Building taller than 25 m effective height
    evidence: ["eight storeys with an effective height of 26.4 m", "the fire-isolated stairs are pressurised", "an emergency lift is required"]
    negation: ["The effective height is less than 25 m", "six storeys, effective height 18.9 m"]
    profile: [det.effective_height, det.rise_in_storeys]
    adds:
      procurement: [consultant.fire_engineer]
      work_items: [{system: fire-active.smoke-control, action: new}, {system: mechanical.fire-mode-air-systems, action: new}, {system: vertical-transport.lift-fire-service, action: new}]
      cost_plan: ["Stair pressurisation", "Emergency lift", "Emergency warning and intercom system (EWIS)"]
      program: ["Install stair pressurisation", "Commission smoke control"]
      rfps: [{discipline: consultant.mechanical, must_include: ["Smoke control design under the fire strategy"]}]
      authority: ["FRNSW referral (verified: false)"]
    why: "25 m thresholds are verified: false; a fire control centre comes only above 50 m (verified: false); no generator reads det.effective_height"
    built_in: {procurement: "no", work_items: "no", cost_plan: "partial", program: "no", rfps: "partial"}
    source: "knowledge/rfp/mechanical-services.yaml smoke"
  - id: heritage-conservation-area
    label: Site in a heritage conservation area or with a contributory facade
    evidence: ["The site is within the Main Street Heritage Conservation Area", "the Federation shopfront at No. 42 is a contributory building to be retained"]
    negation: ["The site is not a heritage item and is not in a heritage conservation area"]
    profile: [det.heritage_status]
    adds:
      procurement: [consultant.heritage]
      work_items: [{system: structure.alterations, action: retain}]
      cost_plan: ["Heritage consultant", "Facade retention and temporary support"]
      program: ["Heritage impact statement", "Heritage referral"]
      rfps: [{discipline: consultant.town_planner, must_include: ["Heritage controls in the SEE"]}]
      authority: ["Council heritage referral"]
    built_in: {procurement: "yes", program: "partial", cost_plan: "partial", rfps: "partial"}
    source: "knowledge/works/package_defaults.yaml complexity_additions[1]"
  - id: classified-road-frontage
    label: Frontage to a classified (state) road
    evidence: ["The site fronts Parramatta Road, a classified road", "TfNSW concurrence is required for the driveway", "vehicle access must be from the rear lane, not the highway"]
    negation: ["The site fronts a local road; no classified road frontage"]
    profile: [flag.state_road, flag.tfnsw_referral]
    adds:
      cost_plan: ["Road-noise facade upgrade"]
      program: ["TfNSW referral"]
      rfps: [{discipline: consultant.traffic, must_include: ["TfNSW consultation", "Construction traffic management plan"]}, {discipline: consultant.acoustic, must_include: ["Road noise assessment to the SEPP (Transport and Infrastructure) (verified: false)"]}]
      authority: ["TfNSW concurrence (verified: false)"]
    built_in: {rfps: "partial", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/traffic.yaml ctmp"
  - id: cl46-variation
    label: Height or FSR exceeds the LEP standard
    evidence: ["A clause 4.6 request to vary the height of buildings standard accompanies the DA", "the lift overrun exceeds the 21 m height control by 1.8 m"]
    negation: ["The proposal complies with the height and floor space ratio standards"]
    profile: [flag.cl46]
    adds:
      program: ["Prepare clause 4.6 variation request"]
      rfps: [{discipline: consultant.town_planner, must_include: ["Clause 4.6 variation request"]}]
    built_in: {rfps: "yes", program: "no"}
    source: "knowledge/rfp/town-planning.yaml variation_request"
  - id: groundwater-dewatering
    label: Groundwater above the base of the basement
    evidence: ["Groundwater was measured at 4.5 m below ground in BH2", "dewatering will be required during excavation", "a tanked basement is recommended"]
    negation: ["No groundwater was encountered to the base of the boreholes"]
    profile: [flag.groundwater]
    adds:
      cost_plan: ["Dewatering and treatment", "Tanked basement"]
      program: ["Groundwater monitoring", "Dewatering approval"]
      rfps: [{discipline: consultant.geotechnical, must_include: ["Groundwater monitoring wells and hydrogeological assessment"]}, {discipline: consultant.civil, must_include: ["Earthworks suitability coordinated with groundwater"]}]
      authority: ["WaterNSW dewatering approval; integrated development (verified: false)"]
    built_in: {rfps: "partial", cost_plan: "no", program: "no"}
    source: "knowledge/rfp/civil.yaml earthworks_suitability"
  - id: contaminated-land
    label: Former service station or dry cleaner on the site
    evidence: ["The site was a service station until 1992; underground tanks may remain", "a dry cleaner operated in the ground-floor shop", "the PSI recommends a detailed site investigation"]
    negation: ["The PSI found a low risk of contamination and no further investigation is required"]
    profile: [det.potentially_contaminated_land]
    adds:
      procurement: [consultant.environmental]
      work_items: [{system: site.contamination, action: repair}]
      cost_plan: ["Detailed site investigation, remediation action plan and site auditor", "Remediation and validation"]
      program: ["Detailed site investigation", "Remediation and validation", "Site audit statement"]
      rfps: [{discipline: consultant.civil, must_include: ["Earthworks suitability advice"]}]
      authority: ["SEPP (Resilience and Hazards) 2021 Chapter 4 (verified: false)"]
    built_in: {procurement: "no", cost_plan: "no", program: "partial", rfps: "yes"}
    source: "knowledge/rfp/civil.yaml earthworks_suitability"
  - id: flood-affected
    label: Flood-affected site or overland flow along the lane
    evidence: ["The land is subject to flood related development controls", "overland flow along the rear lane", "basement entry crest above the PMF level"]
    negation: ["The land is not subject to flood related development controls"]
    profile: [det.flood_hazard]
    adds:
      work_items: [{system: site.flooding, action: new}]
      cost_plan: ["Flood report", "Flood barrier at the basement entry"]
      program: ["Construct flood protection"]
      rfps: [{discipline: consultant.civil, must_include: ["Flood report and floor levels", "Flood evacuation plan option"]}]
      authority: ["Council flood advice"]
    built_in: {work_items: "no", rfps: "yes", program: "partial", cost_plan: "no"}
    source: "knowledge/program/fragments.yaml fr.flood-2"
  - id: rail-corridor
    label: Site next to a rail corridor
    evidence: ["The site adjoins the rail corridor on its southern boundary", "Sydney Trains concurrence is required for the excavation"]
    negation: ["There is no rail infrastructure near the site"]
    profile: [flag.rail]
    adds:
      cost_plan: ["Rail vibration and noise attenuation"]
      program: ["Sydney Trains referral and concurrence"]
      rfps: [{discipline: consultant.structural, must_include: ["Authority asset assessment for the rail corridor"]}, {discipline: consultant.acoustic, must_include: ["Rail noise and vibration assessment"]}]
      authority: ["Sydney Trains / ASA concurrence (verified: false)"]
    built_in: {rfps: "partial", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/structural.yaml authority_asset"
  - id: sydney-water-asset
    label: Sydney Water main crossing the site
    evidence: ["A Sydney Water sewer main crosses the rear of the site", "the main must be diverted before the basement is excavated"]
    negation: ["No Sydney Water assets are within the site"]
    profile: [flag.authority_asset]
    adds:
      cost_plan: ["Sewer main diversion"]
      program: ["Sydney Water asset assessment and diversion"]
      rfps: [{discipline: consultant.structural, must_include: ["Authority asset assessment"]}, {discipline: consultant.hydraulic, must_include: ["Sewer diversion design"]}]
      authority: ["Sydney Water building-over or diversion approval"]
    built_in: {rfps: "partial", cost_plan: "no", program: "no"}
    source: "knowledge/rfp/structural.yaml authority_asset"
  - id: traditional-lump-sum
    label: Traditional lump-sum tender on full documentation
    evidence: ["The design team will complete full construction documentation and tender it as a lump sum under AS 4000", "no novation of consultants"]
    negation: ["The project will be procured as a design and construct contract with novation of the design team"]
    profile: [hdr.cond.procurement_route, fact.contract_form]
    adds:
      program: ["Tender documents (traditional)", "Bidding"]
      rfps: [{discipline: consultant.architect, must_include: ["Tender documents", "For-construction documents", "Construction-phase services"]}, {discipline: consultant.structural, must_include: ["Construction documents"]}]
    removes:
      program: ["Novate the design consultants"]
    why: "Skeleton becomes sk.new-traditional-da; fr.novation drops; RFP stages follow procurement"
    built_in: {program: "yes", rfps: "yes"}
    source: "knowledge/program/skeletons.yaml sk.new-traditional-da"
  - id: supermarket-anchor
    label: Supermarket or large anchor tenant in the retail podium
    evidence: ["A 1,500 m² supermarket occupies the ground floor and part of basement 1", "deliveries by 12.5 m heavy rigid vehicles", "a dedicated loading dock with a turntable"]
    negation: ["The ground floor is three small specialty shops"]
    profile: [flag.heavy_vehicles]
    adds:
      work_items: [{system: site.loading-docks, action: new}, {system: vertical-transport.goods-lifts, action: new}]
      cost_plan: ["Loading dock and turntable", "Goods lift"]
      program: ["Install loading dock equipment"]
      rfps: [{discipline: consultant.traffic, must_include: ["Heavy vehicle swept paths and loading management plan"]}, {discipline: consultant.acoustic, must_include: ["Loading dock and refrigeration plant noise"]}]
    built_in: {work_items: "no", cost_plan: "no", program: "no", rfps: "partial"}
    source: "knowledge/rfp/traffic.yaml"
  - id: fire-pumps-tanks
    label: Town mains cannot meet fire-water demand
    evidence: ["The Sydney Water statement of available pressure and flow is inadequate for the hydrant and sprinkler demand", "a fire pump room and two fire-water tanks in basement 2"]
    negation: ["The town mains meet the hydrant and sprinkler demand without pumps"]
    profile: []
    adds:
      work_items: [{system: fire-active.fire-water, action: new}]
      cost_plan: ["Fire pumps and tanks"]
      program: ["Install fire pump set and tanks"]
      rfps: [{discipline: consultant.fire_services, must_include: ["Fire-water pumps and tanks", "Plant interfaces"]}]
    why: "fire-active.fire-water has no fragment; fs_plant_interfaces is a client flag"
    built_in: {work_items: "no", cost_plan: "partial", program: "no", rfps: "partial"}
    source: "knowledge/costs/elements.yaml code 07"
  - id: public-domain-works
    label: Council public domain upgrade along the frontage
    evidence: ["Council's public domain plan requires a new granite footpath, kerb realignment and street trees", "works in the road reserve under a Roads Act s138 approval"]
    negation: ["Only a new vehicle crossing is proposed in the road reserve"]
    profile: [flag.public_road]
    adds:
      cost_plan: ["Public domain works"]
      program: ["Public domain design approval"]
      rfps: [{discipline: consultant.civil, must_include: ["Public road works element", "Authority submission schedule", "Road safety audit option"]}, {discipline: consultant.landscape, must_include: ["Public domain package"]}]
      authority: ["Council s138 approval (verified: false)"]
    built_in: {rfps: "yes", cost_plan: "partial", program: "no"}
    source: "knowledge/rfp/civil.yaml public_road"

  - id: rise-three-storeys
    label: Three-storey shop-top (two apartment levels over a shop)
    evidence: ["A three-storey shop-top housing development: ground-floor shop with two levels of apartments above", "rise in storeys of 3; one basement level"]
    negation: ["Six storeys: ground-floor retail with five residential levels above"]
    profile: [det.rise_in_storeys, hdr.scale.total_storeys, det.effective_height, det.sprinklered]
    adds:
      cost_plan: ["Home Building Compensation Fund insurance"]
      program: ["Builder provides HBCF insurance certificate"]
      rfps: [{discipline: consultant.fire_services, must_include: ["Hydrants and detection only; no sprinkler design"]}]
      authority: ["HBCF required (R4); Class 2 still under the DBP Act (R3)"]
    removes:
      cost_plan: ["Strata building bond"]
      program: ["Lodge the strata building bond", "Strata bond interim and final inspections", "Sprinkler rough-in", "Sprinkler pressure test before ceilings", "Fit off and commission sprinklers"]
    why: "The scenario sets det.sprinklered: false and leaves the fire-active.sprinklers scope row out. HBCF exemption needs a rise of more than 3 with 2 or more dwellings (R4; verified: false); Class 2 sprinklers need a rise of 4 or more (verified: false); Table C2D2 gives A for the Class 2 part and B for Class 6 at a rise of 3, so C2D4 decides the building (verified: false). No generator reads these thresholds"
    built_in: {cost_plan: "no", program: "no", rfps: "no"}
  - id: trees-affected
    label: Street or neighbour trees affected by the works
    evidence: ["the basement excavation encroaches into the tree protection zone of the council street tree", "the awning and hoarding are within the canopy of the two street plane trees"]
    negation: ["No trees on or next to the site are affected by the works"]
    profile: [flag.arborist_tree_impacts, flag.arborist_offsite_trees]
    adds:
      procurement: [consultant.arborist]
      work_items: [{system: site.trees, action: retain}]
      cost_plan: ["Arborist", "Tree protection"]
      program: ["Arborist impact assessment", "Install tree protection"]
      rfps: [{discipline: consultant.arborist, must_include: ["AS 4970 impact assessment", "Tree protection plan", "Construction supervision hold points"]}]
      authority: ["Council consent to prune or remove street trees"]
    built_in: {procurement: "no", work_items: "no", program: "partial", rfps: "yes", cost_plan: "no"}
    source: "knowledge/rfp/arborist.yaml"
  - id: acid-sulfate-soils
    label: Site mapped for acid sulfate soils
    evidence: ["The site is Class 3 on the Acid Sulfate Soils Map", "an acid sulfate soils management plan is required for the basement excavation"]
    negation: ["The land is not mapped as acid sulfate soils"]
    profile: [det.acid_sulfate_soils_mapped]
    adds:
      work_items: [{system: site.acid-sulfate-soils, action: investigate}]
      cost_plan: ["Acid sulfate soils assessment and treatment"]
      program: ["Acid sulfate soils assessment"]
      rfps: [{discipline: consultant.civil, must_include: ["Earthworks suitability advice"]}, {discipline: consultant.geotechnical, must_include: ["Acid sulfate soils assessment"]}]
      authority: ["The LEP's acid sulfate soils clause (number varies by LEP; verified: false)"]
    built_in: {work_items: "no", cost_plan: "no", program: "partial", rfps: "partial"}
    source: "knowledge/program/fragments.yaml fr.investigate-acid-sulfate"
  - id: underpinning-neighbour
    label: Neighbour's footings must be underpinned
    evidence: ["The adjoining shop at No. 38 is on shallow strip footings and must be underpinned before bulk excavation", "underpinning of the party wall footings"]
    negation: ["The adjoining buildings are founded on rock below the basement level; no underpinning is needed"]
    profile: [flag.excavation_adjoining]
    adds:
      work_items: [{system: substructure.underpinning, action: new}]
      cost_plan: ["Underpinning of adjoining footings"]
      program: ["Underpin adjoining structures", "Neighbour's consent for underpinning"]
      rfps: [{discipline: consultant.structural, must_include: ["Underpinning interfaces", "Temporary works interfaces", "Dilapidation surveys"]}]
      authority: ["Adjoining owner's consent"]
    why: "flag.excavation_adjoining is already yes in the base, so the RFP rows exist; the change is the underpinning item"
    built_in: {work_items: "no", cost_plan: "partial", program: "partial", rfps: "yes"}
    source: "knowledge/program/fragments.yaml fr.underpinning-2"
  - id: regionally-significant
    label: Capital investment value over the regional threshold
    evidence: ["The CIV of the development exceeds $30 million, so it is regionally significant development", "to be determined by the Sydney District Planning Panel"]
    negation: ["The development will be determined by the Local Planning Panel"]
    profile: [flag.panel]
    adds:
      program: ["Regional planning panel briefing and determination"]
      rfps: [{discipline: consultant.town_planner, must_include: ["Panel briefing and attendance"]}]
      authority: ["Sydney district planning panel (threshold verified: false)"]
    why: "flag.panel is already yes in the base, so the app changes nothing; zero-delta for the harness"
    built_in: {program: "no", rfps: "yes"}
    source: "knowledge/rfp/town-planning.yaml panel_attendance"
gaps:
  - {area: profile, what: "residential_retail carries ncc_class 2/6: no 7a, and the compound value maps to no category; det.ncc_class must be set", evidence: "knowledge/profile/taxonomy.yaml mixed residential_retail; testing/synthetic/reference/index/procurement.md NCC class adds building categories"}
  - {area: profile, what: "Mixed scale fields use total_storeys and total_gfa_sqm; budget splits read hdr.scale.storeys and program per-unit rows read plan.gross_floor_area (250 m2 assumed); no field for basement levels, tenancies or effective height", evidence: "knowledge/profile/taxonomy.yaml residential_retail scale_fields; knowledge/costs/budget_splits.yaml; knowledge/program/durations.yaml assumptions"}
  - {area: profile, what: "quality_level applies to residential only, so it is not offered for mixed", evidence: "knowledge/profile/taxonomy.yaml conditions quality_level applies_to"}
  - {area: profile, what: "Parts exist but package suggestions read det.* and scope.* from the whole part only; no per-part class for scope, cost or program", evidence: "internal/store/packages.go packageOverview query"}
  - {area: scope, what: "Mixed default list is the apartments list: lacks sprinklers, trade waste, gas, loading dock, signage, accessible facilities, slab on ground, vehicle doors, occupant warning, openings, external wall fire", evidence: "knowledge/profile/scope_defaults.yaml categories[1]"}
  - {area: procurement, what: "Acoustic, ESD/BASIX, landscape, waste, QS, hazmat and fire engineer are never suggested; environmental rule is dead", evidence: "knowledge/works/package_defaults.yaml baselines, scope_additions, complexity_additions[2]"}
  - {area: procurement, what: "D&C sets novation option on every consultant, including certifier, planner, BCA, QS and traffic", evidence: "internal/procurement/proposed.go BuilderDesigns; internal/procurement/packages.go DefaultNovation"}
