schema: sitewise-synthetic-shape/1
type_id: T13
slug: mixed-use-shop-top
name: Mixed-use shop-top housing
reviewed: false
state: NSW
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
# Base: six storeys (retail Class 6 under five levels of Class 2 apartments) over two basement levels of
# Class 7a parking, existing shops demolished, D&C with novation, DA to the local planning panel.
profile:
  hdr.building_class: mixed
  hdr.subclass: residential_retail
  hdr.work_type: new
  hdr.cond.planning: da
  hdr.cond.procurement_route: design_construct
  hdr.cond.operational_constraints: vacant
  hdr.cond.stakeholder_complexity: single_owner
  hdr.cond.access_constraints: urban_constrained
  hdr.cond.environmental_sensitivity: standard
  hdr.scale.site_sqm: 1800
  hdr.scale.total_storeys: 6
  hdr.scale.total_gfa_sqm: 5500
  hdr.scale.podium_levels: 1
  hdr.scale.tower_levels: 5
  hdr.scale.residential_units: 42
  hdr.scale.retail_gla_sqm: 600
  hdr.scale.car_parks: 55
  det.ncc_class: ["2", "6", 7a]
  det.rise_in_storeys: 6
  det.sprinklered: true
  det.state: NSW
  det.existing_building: true
  det.existing_building_year: 1965
  det.effective_height: 18.9
  det.heritage_status: none
  det.bushfire_prone_land: false
  det.flood_hazard: false
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  det.climate_zone: "5"
  det.facade_type: standard
  det.noise_affected_site: true
  det.sewer_connection: reticulated
  det.water_supply_source: reticulated
  det.gas_supply: natural_gas_main
  fact.contract_form: as4902
  fact.contract_basis: lump_sum
  proj.regulated_design: "yes"
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.basement: "yes"
  flag.excavation_adjoining: "yes"
  flag.transfer_structures: "yes"
  flag.osd_required: "yes"
  flag.stormwater_quality: "yes"
  flag.panel: "yes"
  flag.osd_existing: "no"
  flag.authority_asset: "no"
  flag.rail: "no"
  flag.groundwater: "no"
  flag.norbe: "no"
  flag.public_road: "no"
  flag.state_road: "no"
  flag.heavy_vehicles: "no"
  flag.tfnsw_referral: "no"
  flag.intersection_modelling: "no"
  flag.gtp_required: "no"
  flag.cl46: "no"
  flag.community: "no"
  flag.architect_lodges: "no"
  flag.sustainability_target: "no"
  flag.coastal: "no"
  flag.country: "no"
  flag.staged: "no"
  flag.multi_building: "no"
  flag.arborist_tree_impacts: "no"
  flag.fire_vulnerable_occupants: "no"
  flag.fire_special_hazards: "no"
  flag.fire_specialist_systems: "no"

# Values the app derives or cannot set through PUT /profile; checked, never PUT.
expected_derived:
  - {key: det.type_of_construction, value: A, source: "knowledge/clusters/fire/rules.yaml rule.ncc.type-of-construction", note: "Class 2, 6 and 7a at a rise of 4 or more all give Type A; the rule says mixed classifications need C2D4 assessment first (verified: false)"}
  - {key: det.basix_required, value: true, source: "knowledge/clusters/envelope/rules.yaml rule.basix.certificate-required", note: "derivation pending in the rule; returns unknown today; applies to the Class 2 part only"}
  - {key: det.energy_compliance_pathway, value: basix, note: "BASIX for the apartments; the retail needs Section J (section_j_dts or section_j_jv3). One value cannot hold both; no profile_group"}
  - {key: det.ev_readiness_required, value: true, source: "knowledge/clusters/electrical-comms/rules.yaml rule.ncc.ev-charging-readiness", note: "applies to 7a with car parking; derivation pending"}

scenario_inputs:
  - {key: proj.budget_stated, note: "stated in the developer's brief or feasibility; amount chosen by the scenario author", phrasing: "Construction budget: $<amount> excluding GST"}
  - {key: proj.regulated_design, note: "yes/no row; the documents must state the professional basis", phrasing: "The building contains a Class 2 part, so the Design and Building Practitioners Act 2020 applies: regulated designs and design compliance declarations are required"}
  - {key: det.ncc_class, note: "never derived from the subclass; must be read from the BCA report", phrasing: "Building classification: Class 6 (ground-floor retail), Class 2 (levels 1-5 residential), Class 7a (basement car park)"}
  - {key: flag.panel, note: "the regex needs 'planning panel'", phrasing: "The application will be determined by the Local Planning Panel"}
  - {key: flag.transfer_structures, note: "needs an explicit structural statement", phrasing: "A transfer slab at level 1 picks up the residential columns over the retail and car-park grid"}
  - {key: flag.excavation_adjoining, note: "needs excavation near a boundary or neighbour", phrasing: "Bulk excavation to the eastern boundary adjoining the two-storey shop at No. 38"}
  - {key: flag.osd_required, note: "civil or council statement", phrasing: "On-site detention is required under council's stormwater policy"}
  - {key: det.existing_building, note: "the trigger is \\bexisting building\\b: the plural 'existing buildings' and 'existing shops' do not match", phrasing: "The site contains an existing building on each lot (two single-storey shops and a dwelling); each existing building is to be demolished"}
  - {key: det.existing_building_year, note: "the year trigger needs 'built in <year>'", phrasing: "The existing shops were built in 1965"}
  - {key: det.effective_height, note: "number from the BCA report; the 25 m variant changes this one key", phrasing: "Effective height: 18.9 m (BCA report)"}
  - {key: flag.public_road, note: "base documents must deny public road works; 'road reserve' and 'works in the road' match the flag", phrasing: "No works in the public road other than the vehicle crossing and making good the footpath"}
  - {key: flag.groundwater, note: "'dewater' and 'groundwater' match the flag; base documents must deny it plainly", phrasing: "No groundwater was encountered above the base of the basement; seepage only"}
  - {key: flag.heavy_vehicles, note: "'MRV' and 'HRV' match the flag; base documents describe waste collection without implying heavy vehicle generation", phrasing: "The development does not generate heavy vehicle movements; waste is collected on site by council's standard collection vehicle"}

