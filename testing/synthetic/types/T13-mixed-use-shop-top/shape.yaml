    - {label: "Install main switchboard", stage: construction, fragment: fr.switchboard-2, after: ["Award the contract"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.switchboard-2", why: "Procure, deliver and install"}
    - {label: "Install main switchboard (duplicate from the major fragment)", stage: construction, fragment: fr.switchboard-major, after: ["Award the contract"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.switchboard-major", why: "Same switchboard; the app adds it a second time because 6 matches major. Expected to match twice, not to be hidden"}
    - {label: "Lodge services applications and lead-in connections", stage: construction, fragment: fr.services-connections-major, after: ["Local planning panel determination"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.services-connections-major", why: "Section 73 application follows consent; the app anchors it at construction stage start"}
    - {label: "Install on-site detention and stormwater", stage: construction, fragment: fr.stormwater-2, after: ["Bulk earthworks"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.stormwater-2", why: "OSD"}
    - {label: "Landscape the ground and podium", stage: construction, fragment: fr.landscape-2, after: ["Waterproof balconies, podium and roof"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.landscape-2", why: "Podium planters"}
    - {label: "Public domain works: footpath, crossing, street trees", stage: construction, fragment: null, after: ["Install footpath awning"], built_in: "no", why: "site.public-domain has no fragment"}
    - {label: "Commission fire safety systems and essential services", stage: construction, fragment: null, after: ["Fit off and commission sprinklers", "Install detection and warning", "Substation energisation and authority connection"], built_in: "no", why: "No integrated commissioning row"}
    - {label: "Pre-completion acoustic testing", stage: construction, fragment: null, after: ["Lay apartment floor finishes"], built_in: "no", why: "Typical DA condition"}
    - {label: "Notify the expected completion date (RAB Act)", stage: construction, fragment: null, after: ["Floor cycle: columns, form, reinforce and pour"], built_in: "no", why: "Before the OC application (timing verified: false)"}
    - {label: "Lodge the strata building bond", stage: construction, fragment: null, after: ["Notify the expected completion date (RAB Act)"], built_in: "no", why: "Before OC (verified: false)"}
    - {label: "Practical completion inspection", stage: completion, fragment: fr.practical-completion, after: ["Lay apartment floor finishes", "Services fit-off (sanitary, cold and hot water, electrical)", "Install and commission lifts", "Commission fire safety systems and essential services", "Landscape the ground and podium", "Public domain works: footpath, crossing, street trees", "Retail shell and services provisions (grease arrestor, exhaust riser, meters, stubs)"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.practical-completion", why: "PC"}
    - {label: "Building compliance declaration and fire safety certificate", stage: completion, fragment: null, after: ["Practical completion inspection"], built_in: "no", why: "DBP Act and EP&A fire safety (verified: false)"}
    - {label: "Section 73 compliance certificate", stage: completion, fragment: null, after: ["Lodge services applications and lead-in connections"], built_in: "no", why: "Rule exists, no program row"}
    - {label: "Occupation certificate", stage: completion, fragment: fr.occupation-certificate, after: ["Building compliance declaration and fire safety certificate", "Section 73 compliance certificate", "Lodge the strata building bond", "Pre-completion acoustic testing"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.occupation-certificate", why: "Residential and retail shells"}
    - {label: "Strata plan, strata certificate and registration", stage: completion, fragment: null, after: ["Occupation certificate"], built_in: "no", why: "Needed for settlement"}
    - {label: "Handover", stage: completion, fragment: fr.handover, after: ["Occupation certificate"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.handover", why: "Keys, manuals, warranties"}
    - {label: "Hand retail shells to tenants for fit-out", stage: completion, fragment: null, after: ["Occupation certificate"], built_in: "no", why: "No fragment"}
    - {label: "Defects inspection", stage: defects, fragment: fr.defects-inspection, after: ["Handover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-inspection", why: "Defects"}
    - {label: "Strata bond interim and final inspections", stage: defects, fragment: null, after: ["Handover"], built_in: "no", why: "Strata Schemes Management Act 2015 Part 11 (verified: false)"}
    - {label: "Defects liability period", stage: defects, fragment: fr.defects-liability-end, after: ["Defects inspection"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "AS 4902 DLP (length verified: false)"}

# RFP expectations use the data/eval/rfp/answer-keys keys. They state the CORRECT answer for this job.
# Novation is keyed per package in procurement: architect, structural, civil, landscape yes; the four services
# engineers option (owner to confirm); the rest no. App default under D&C is option for all.
rfps:
  - discipline: consultant.architect
    template: architecture
    built_in: "partial"
    source: "knowledge/rfp/architecture.yaml mixed_use_map"
    why: "D&C boundary ends at dnc_tender; blocks on fact:budget until the budget is read"
    must_include: ["Concept and schematic design", "DA planning approval documentation", "Planning response", "Design development", "Apartment and common-area interiors", "D&C tender documents with performance brief", "Regulated design and compliance declarations", "Post-novation documentation", "ADG design verification statement", "Class and use map by part; shell versus fit-out deliverables", "BIM model", "Demolition plans"]
    must_not_include: ["House-module rows", "Traditional tender documents or bidding", "Tenant fit-out design", "Green Star or NABERS", "Connecting with Country input", "Brief and masterplan"]
    expect:
      stages_include: [concept, schematic, planning_approval, planning_response, design_development, interiors, dnc_tender, regulated_design, post_novation]
      stages_option: [contract_admin]
      stages_absent: [brief_masterplan, house_documents, tender_traditional, bidding, for_construction, construction_support]
      positions: {coordination: I, input_schedule: I, specialist_coordination: I, bim_model: I, bim_coordination: O, specification: I, door_schedule: I, finishes_schedules: I, typical_interiors: I, base_interiors: I, tenant_fitout: X, dnc_performance_brief: I, tender_evaluation: I, certifier_liaison: I, modifications: O, apartment_design: I, extra_declarations: O, mixed_use_map: I, existing_interfaces: I, facade_certification: X, performance_solutions: X, community: X, house_interiors: absent, house_selections: absent, lodgement: absent, water_asset: absent, country: absent, sustainability_docs: absent, live_staging: absent}
      blocking: ["fact:budget"]
      sources: ["blocking clears once proj.budget_stated is read", "existing_interfaces: demolition plans for the existing shops"]
    app_differs:
      - {key: stage.regulated_design, app: option, expect: include, why: "after the dnc_tender boundary end"}
      - {key: stage.post_novation, app: option, expect: include, why: "after the boundary end"}
      - {key: position.apartment_design, app: O, expect: I, why: "ADG design verification is mandatory for shop-top of 3+ storeys and 4+ dwellings (verified: false)"}
      - {key: position.tenant_fitout, app: O, expect: X, why: "retail is a shell; the tenant's designer fits out"}
      - {key: position.tender_evaluation, app: O, expect: I, why: "complex O; the architect reviews D&C tender design qualifications"}
  - discipline: consultant.structural
    template: structural
    built_in: "partial"
    source: "knowledge/rfp/structural.yaml retention_design"
    must_include: ["Design basis", "Retention and temporary-works interfaces", "Transfer slab", "Delegated design schedule for PT slabs", "D&C tender documents", "Regulated design", "Post-novation documentation", "Construction-phase inspections with inspection schedule"]
    must_not_include: ["Residential framing", "Existing structure assessment", "Authority asset stage", "Super-flat floor", "Traditional tender documents"]
    expect:
      stages_include: [concept_schematic, planning_approval, design_development, dnc_tender, regulated_design, post_novation, construction_phase]
      stages_option: []
      stages_absent: [existing_assessment, authority_asset, tender_traditional, construction_documents]
      positions: {design_basis: I, geotech_brief: I, shared_model: I, safety_in_design: I, value_management: I, delegated_design: I, specialist_element_design: X, retention_design: I, temporary_works_interfaces: I, temporary_works_design: X, dilapidation: O, services_fixings: O, metalwork: O, compaction: X, demolition_drawings: X, services_footings: I, inspection_schedule: I, residential_framing: absent, strengthening: absent, super_flat_floor: absent}
      blocking: []
    app_differs:
      - {key: stage.regulated_design, app: option, expect: include, why: "after the dnc_tender boundary"}
      - {key: stage.post_novation, app: option, expect: include, why: "after the boundary"}
      - {key: stage.construction_phase, app: option, expect: include, why: "include_when complex, but the after-boundary rule wins"}
      - {key: position.super_flat_floor, app: O, expect: absent, why: "client flag; if_unknown option"}
      - {key: stage.existing_assessment, app: include, expect: absent, why: "det.existing_building true turns it on, but the existing buildings are demolished, not kept"}
      - {key: position.strengthening, app: O, expect: absent, why: "follows existing_assessment"}
  - discipline: consultant.civil
    template: civil
    built_in: "partial"
    source: "knowledge/rfp/civil.yaml osd_new"
    must_include: ["Stormwater concept for the DA with discharge confirmed", "OSD design", "MUSIC water quality", "D&C tender design", "Post-novation design", "Civil design declarations", "As-built and OSD certification"]
