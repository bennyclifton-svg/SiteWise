      blocking: []
    app_differs:
      - {key: stage.post_novation, app: option, expect: include, why: "after the dnc_tender boundary"}
      - {key: stage.construction_phase, app: option, expect: include, why: "default option; OSD certification needs inspections"}
      - {key: stage.as_built, app: option, expect: include, why: "follows construction_phase"}
      - {key: position.shoring, app: O, expect: X, why: "basement shoring is the structural engineer's"}
      - {key: position.retained_services, app: I, expect: absent, why: "existing_building module on, but every existing service is abolished before demolition and new connections are designed"}
