  - id: internal-only-alteration
    label: Roof footprint and hard surfaces unchanged (internal-only alteration, or an addition wholly under the existing roof)
    evidence:
      - "The works are internal only; the roof footprint, roof drainage and external paved areas are unchanged."
      - "The verandah is enclosed under the existing roof; no new roof area and no change to the hard surfaces."
      - "Existing stormwater system retained unaltered; no change to the impervious area of the site."
    negation:
      - "The rear addition adds about 55 m² of new roof, drained to the existing system."
      - "New paved terrace and rear deck to the garden."
    profile: []
    adds:
      rfps: [{discipline: consultant.architect, must_include: ["Statement in the DA that the roof footprint and impervious area are unchanged, so no stormwater design is needed"]}]
      authority: ["Council or certifier accepts that the stormwater catchment is unchanged"]
    removes:
      # Owner ruling R1: drop the civil engineer only where the documents say roof footprint and hard surfaces are unchanged.
      procurement: [consultant.civil]
      work_items: [{system: site.stormwater-detention, action: new}]
      cost_plan: ["Civil"]
      program: ["Stormwater concept plan", "Stormwater design for the CC", "Install stormwater drainage", "Hold point: stormwater drainage inspection before backfill", "Stormwater works-as-executed and engineer's certificate"]
      rfps: [consultant.civil]
