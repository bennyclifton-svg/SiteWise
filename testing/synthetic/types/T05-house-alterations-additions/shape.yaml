schema: sitewise-synthetic-shape/1
type_id: T05
slug: house-alterations-additions
name: House alterations and additions
reviewed: false
state: NSW
# Base scenario: a single-storey rear addition (kitchen, living, dining) to a
# 1950s brick house on a suburban Sydney lot, plus internal alterations to the
# existing house (bathroom and laundry renovated, two internal walls removed,
# rear wall opened up). DA to council, not heritage, not bushfire or flood
# prone, owners move out for the main works, architect plus lump-sum builder
# under a domestic contract. The added roof and the reinstated rear paving change
# the stormwater catchment, so a civil (stormwater) engineer is in the base
# (owner ruling R1, 30 October 2026). See DOMAIN.md section 1.
profile:
  hdr.building_class: residential
  hdr.subclass: house
  hdr.work_type: extend
  hdr.cond.planning: da
  hdr.cond.procurement_route: traditional
  hdr.cond.operational_constraints: vacant
  hdr.cond.quality_level: mid
  hdr.cond.stakeholder_complexity: single_owner
  hdr.scale.storeys: 1
  hdr.scale.existing_gfa_sqm: 140
  hdr.scale.added_gfa_sqm: 55
  det.ncc_class: [1a]
  det.state: NSW
  det.existing_building: true
  det.existing_building_year: 1958
  det.heritage_status: none
  det.bushfire_prone_land: false
  det.flood_hazard: false
  # basix_required and energy_compliance_pathway are not settable through the API; see expected_derived.
  fact.contract_form: domestic_hia
  hdr.cond.access_constraints: urban_constrained
  hdr.cond.environmental_sensitivity: standard
  det.climate_zone: '5'
  det.sewer_connection: reticulated
  det.water_supply_source: reticulated
  det.gas_supply: natural_gas_main
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  proj.regulated_design: 'no'
  flag.basement: 'no'
  flag.excavation_adjoining: 'no'
  flag.authority_asset: 'no'
  flag.arborist_tree_impacts: 'no'
  flag.osd_required: 'no'
  flag.osd_existing: 'no'
  flag.cl46: 'no'
  flag.panel: 'no'
  flag.public_road: 'no'
  flag.norbe: 'no'
  flag.stormwater_quality: 'no'
  flag.sustainability_target: 'no'
  flag.community: 'no'
  flag.groundwater: 'no'
  flag.rail: 'no'
  flag.transfer_structures: 'no'
  flag.coastal: 'no'
  flag.country: 'no'
  flag.staged: 'no'
  flag.multi_building: 'no'
  flag.architect_lodges: 'yes'
work_items:
  # site
  - {system: site.survey-boundaries, action: investigate, why: "Detail, level and boundary survey for the DA; the addition sits close to a side boundary"}
  - {system: site.ground-conditions, action: investigate, why: "Site classification to AS 2870 for the new footings; test pit at an existing footing to confirm founding depth"}
  - {system: site.demolition, action: remove, why: "Demolish the rear skillion and laundry lean-to, remove two internal walls, strip out the bathroom and kitchen"}
  - {system: site.earthworks, action: new, why: "Minor cut and fill to set the addition floor level against the existing floor"}
  - {system: site.erosion-sediment-control, action: new, why: "Sediment fence and stabilised access are a standard DA condition"}
  - {system: site.stormwater-detention, action: new, why: "The added roof and changed hard surfaces change the catchment, so the civil engineer recalculates the drainage and designs the connection of the new roof area to the existing system or a kerb outlet (owner ruling R1)"}
  - {system: site.services-connections, action: alter, why: "Extend the sewer junction and water service to the relocated wet areas; cap services to the demolished wing; disconnect any downpipe found discharging to the sewer"}
  - {system: site.landscape, action: alter, why: "Reinstate rear paving and garden around the addition"}
  - {system: site.adjoining-structures, action: retain, why: "Protect the boundary fences and the neighbours' structures near the works"}
  # substructure
  - {system: substructure.footings, action: new, why: "Strip and pad footings for the addition, founded to match the existing house"}
  - {system: substructure.slab-on-ground, action: new, why: "Slab for the addition kitchen and living, stepped or set to meet the existing floor"}
  - {system: substructure.damp-waterproofing, action: new, why: "Under-slab vapour barrier and damp-proof course at the junction; the slab must not block the existing subfloor vents, and the step to the suspended timber floor is detailed"}
  - {system: substructure.termite-management, action: new, why: "Termite management for the new work; the slab against the ventilated subfloor breaks the existing inspection zone, so the junction needs a barrier and inspection access"}
  # structure
  - {system: structure.alterations, action: alter, why: "New opening in the existing rear wall, two loadbearing internal walls removed, all with beams and propping"}
  - {system: structure.timber, action: new, why: "Wall and roof framing to the addition, rear deck framing"}
  - {system: structure.steel, action: new, why: "Steel beams over the new rear opening and the removed internal walls"}
  - {system: structure.temporary-works, action: new, why: "Propping while loadbearing walls are removed; temporary weatherproofing where the existing envelope is opened"}
  # envelope
  - {system: envelope.roof-coverings, action: new, why: "Roof to the addition, tied into the existing roof, matched in material and colour"}
  - {system: envelope.external-walls, action: new, why: "External walls to the addition, matched to or deliberately contrasting with the existing brick"}
  - {system: envelope.windows-doors, action: new, why: "New windows and a stacking door to the garden; some existing windows replaced"}
  - {system: envelope.flashings-seals, action: new, why: "Flashings and damp-proof courses at every old-to-new junction"}
  - {system: envelope.pliable-membranes, action: new, why: "Sarking and wall wrap to the addition"}
  - {system: envelope.thermal-insulation, action: new, why: "Insulation to the addition as the BASIX commitments require"}
  - {system: envelope.thermal-performance, action: new, why: "BASIX certificate commitments (thermal comfort) for alterations and additions"}
  # interiors
  - {system: interiors.walls-linings, action: alter, why: "New linings to the addition; patching and relining where walls are removed in the existing house"}
  - {system: interiors.ceilings, action: new, why: "Ceilings to the addition; patching existing ceilings at removed walls"}
  - {system: interiors.wet-area-waterproofing, action: new, why: "New membranes to the renovated bathroom and the relocated laundry"}
  - {system: interiors.tiling, action: new, why: "Bathroom, laundry and kitchen splashback tiling"}
  - {system: interiors.joinery, action: new, why: "New kitchen, laundry and robes"}
  - {system: interiors.internal-doors, action: new, why: "New and relocated internal doors"}
  - {system: interiors.internal-glazing, action: new, why: "Shower screen and mirrors"}
  - {system: interiors.floor-finishes, action: alter, why: "Sand and polish existing boards; new matching boards or tiles to the addition"}
  - {system: interiors.painting, action: alter, why: "Repaint the affected existing rooms and paint the addition"}
  # fire-active
  - {system: fire-active.smoke-alarms, action: upgrade, why: "New hard-wired alarms in the addition, interconnected with upgraded alarms in the existing house"}
  # mechanical
  - {system: mechanical.local-exhaust, action: new, why: "Bathroom, laundry and rangehood exhaust ducted outside"}
  - {system: mechanical.air-conditioning, action: new, why: "Split or ducted system to the new living area, installer designed"}
  # hydraulic
  - {system: hydraulic.sanitary, action: alter, why: "Relocated bathroom, laundry and kitchen drainage connected to the existing sewer"}
  - {system: hydraulic.cold-water, action: alter, why: "Extend and replace old galvanised water pipework to the new fixtures"}
  - {system: hydraulic.hot-water, action: replace, why: "New heat-pump or gas instantaneous water heater to suit BASIX"}
  - {system: hydraulic.roof-drainage, action: new, why: "Gutters and downpipes to the addition, box gutter or valley at the tie-in"}
  # electrical
  - {system: electrical.switchboards, action: upgrade, why: "Old fuse board replaced with RCD-protected board to take the new circuits"}
  - {system: electrical.cabling-wiring, action: alter, why: "New circuits to the addition; rewire the altered rooms; isolate the demolished wing"}
  - {system: electrical.lighting, action: new, why: "Lighting to the addition and renovated rooms"}
  - {system: electrical.temporary-power, action: new, why: "Builder's temporary supply while the house is isolated"}
  # access-egress
  - {system: access-egress.stairs-and-ramps, action: new, why: "Steps from the addition or deck down to the garden"}
procurement:
  - {discipline: consultant.architect, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Designs, documents and lodges the DA; often also measures the existing house. A building designer is a common substitute"}
  - {discipline: consultant.surveyor, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Detail and boundary survey for the DA; boundary peg-out before footings near the boundary"}
  - {discipline: consultant.structural, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Beams over new openings, footings, framing and tie-down; existing-structure assessment"}
  - {discipline: consultant.civil, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Owner ruling R1: the roof area grows and the outside impervious area changes, so the stormwater catchment changes and the drainage must be recalculated. Stormwater concept for the DA, CC stormwater design, certificate for the OC. baselines[0] suggests Civil for work type new or extend"}
  - {discipline: consultant.geotechnical, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Site classification for the new footings; often a small borehole and test-pit job"}
  - {discipline: consultant.certifier, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Construction certificate, principal certifier, critical-stage inspections, occupation certificate"}
  - {discipline: consultant.basix, kind: services, built_in: "no", why: "BASIX certificate for alterations and additions, needed when the work is valued at $50,000 or more or installs a pool or spa over 40,000 litres (owner ruling R5; NSW Planning Portal); a simpler process than for a new dwelling, and the architect may generate it with the DIY thermal method"}
  - {discipline: consultant.hazmat, kind: services, built_in: "no", why: "Hazardous materials survey of a 1958 house before demolition and strip-out; asbestos and lead paint likely"}
  - {discipline: trade.main_works, kind: works, built_in: partial, source: "internal/procurement/proposed.go ProposeHeadContract", why: "Licensed builder, lump-sum domestic contract (HIA or MBA) with home building compensation cover (contract price over $20,000 including GST, owner ruling R4) and a defects liability period (owner ruling R8; length verified: false); proposed only after work items are accepted"}
cost_plan:
  # fees and charges
  - {line: "DA fees and contributions", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml da-fees", why: "DA lodgement and notification fees, plus the s7.12 levy where the council's plan applies one; the app keeps them as one line"}
  - {line: "Construction certificate and certifier fees", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml cc-fees", why: "CC and principal certifier, if the certifier is not costed as a consultant fee line as well"}
  - {line: "Service authority connection fees", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml service-authority", why: "Sydney Water and DNSP fees where the works change a connection"}
  - {line: "Long service levy", section: fees_and_charges, built_in: "no", why: "Payable before the CC is issued when the works reach the levy threshold"}
  - {line: "Home building compensation fund insurance", section: fees_and_charges, built_in: "no", why: "Required where the contract price is over $20,000 including GST (owner ruling R4; SIRA). The principal contractor takes out the cover before starting work or taking a deposit; it is usually in the contract price, but it is a separate cost"}
  - {line: "Council security deposits and permits (footpath damage, skip bin, hoarding)", section: fees_and_charges, built_in: "no", why: "Council bonds and permits, payable before work starts"}
  # consultants
  - {line: "Architect", section: consultants, built_in: "yes", source: "internal/costs/suggest.go Suggest", why: "One fee line per adopted package"}
  - {line: "Surveyor", section: consultants, built_in: "yes", source: "internal/costs/suggest.go Suggest", why: "Detail survey, boundary survey and peg-out"}
  - {line: "Structural", section: consultants, built_in: "yes", source: "internal/costs/suggest.go Suggest", why: "Structural design and inspections"}
  - {line: "Civil", section: consultants, built_in: "yes", source: "internal/costs/suggest.go Suggest", why: "Stormwater design for the changed catchment (owner ruling R1); fee line from the adopted baselines[0] package"}
  - {line: "Geotechnical", section: consultants, built_in: "yes", source: "internal/costs/suggest.go Suggest", why: "Site classification"}
  - {line: "Certifier", section: consultants, built_in: "yes", source: "internal/costs/suggest.go Suggest", why: "Overlaps with the CC and certifier fees starter line; one of the two must hold the fee"}
  - {line: "BASIX", section: consultants, built_in: "no", why: "BASIX certificate and thermal assessment"}
  - {line: "Hazardous materials survey", section: consultants, built_in: "no", why: "Survey before demolition; clearance inspection after any removal"}
  # construction
  - {line: "Preliminaries and builder's margin", section: construction, built_in: "no", why: "Site establishment, protection of retained areas, temporary weatherproofing, skips and supervision; the app has no line and spreads it pro rata"}
  - {line: "Demolition, strip-out and hazardous materials removal", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml", why: "The standard first trade line in an alterations cost plan; the app folds it into site works and only when a site item exists"}
  - {line: "Site works and external works", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Earthworks, stormwater, services connections, landscape reinstatement; produced because this scope has site items (the default extend scope has none, see gaps)"}
  - {line: "Substructure", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Footings, slab, damp-proofing, termite management"}
  - {line: "Structure", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Framing, steel beams, alterations to the existing structure and propping; the residential_extension split gives it no share"}
  - {line: "Building envelope", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Roof, walls, windows, flashings, insulation"}
  - {line: "Interiors and finishes", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Linings, wet areas, tiling, joinery, doors, floors, painting"}
  - {line: "Active fire protection", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Smoke alarms only"}
  - {line: "Mechanical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Exhaust fans and air-conditioning; produced from this scope's mechanical items"}
  - {line: "Hydraulic services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Drainage, water, hot water, roof drainage"}
  - {line: "Electrical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "Switchboard upgrade, circuits, lighting"}
  - {line: "Access and egress", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml", why: "External steps; produced from this scope's access-egress.stairs-and-ramps item as child 13.x"}
  - {line: "Make good to existing finishes", section: construction, built_in: "no", why: "Patching, matching and reinstating existing work at every junction; usually priced separately in an alterations tender"}
  # contingency and other
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml design-contingency", why: "Design is incomplete until the existing house is opened up"}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml construction-contingency", why: "Carries the latent conditions in the existing house"}
  - {line: "Provisional sum: latent conditions in the existing structure", section: contingency, built_in: "no", why: "Rot, termite damage, undersized footings, hidden asbestos; usual in a domestic alterations tender"}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml escalation", why: "Standard"}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml exclusions", why: "Standard"}
  - {line: "Owner supply: appliances, light fittings and tapware", section: contingency, built_in: partial, source: "internal/store/cost_budget.go applyBriefFigures", why: "Created only from a stated owner-supply list"}
  - {line: "Owner's insurance for a vacant house under construction", section: contingency, built_in: "no", why: "Home and contents cover is usually voided or conditional while the house is vacant; must be lined up with the builder's contract works insurance"}
  - {line: "Temporary accommodation, removal and storage while the house is vacated", section: contingency, built_in: "no", why: "A real owner cost on most alterations jobs; never modelled"}
program:
  skeleton: sk.extend-traditional
  activities:
    # investigation
    - {label: "Planning certificate, title and council records search", stage: investigation, fragment: null, after: [], built_in: "no", why: "s10.7 certificate, DP and title search, approvals of the existing house and earlier additions"}
    - {label: "Detail and boundary survey", stage: investigation, fragment: fr.investigate-survey, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.investigate-survey", why: "Fires for this scope's site.survey-boundaries investigate item"}
    - {label: "Measure the existing building", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Measured drawings of the existing house"}
    - {label: "Hazardous-materials survey", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Before design fixes what is demolished"}
    - {label: "Trace existing services", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Sewer junction, stormwater, gas, consumer mains and switchboard; Before You Dig search"}
    - {label: "Geotechnical investigation", stage: investigation, fragment: fr.investigate-geotech, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.investigate-geotech", why: "Fires for this scope's site.ground-conditions investigate item"}
    # concept design
    - {label: "Confirm the brief", stage: concept_design, fragment: fr.concept-design-1a, after: ["Measure the existing building"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Brief rests on the measured existing house"}
    - {label: "Prepare the concept design", stage: concept_design, fragment: fr.concept-design-1a, after: ["Confirm the brief", "Detail and boundary survey"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Setbacks, overshadowing and levels need the survey"}
    - {label: "Client review of the concept", stage: concept_design, fragment: fr.concept-design-1a, after: ["Prepare the concept design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Standard"}
    - {label: "Develop the design", stage: concept_design, fragment: fr.design-development-1a, after: ["Client review of the concept"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.design-development-1a", why: "Standard"}
    # approval documentation
    - {label: "Prepare approval documentation", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "DA drawings, demolition plan, shadow diagrams, statement of environmental effects"}
    - {label: "Coordinate consultant reports", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Develop the design", "Geotechnical investigation"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "Stormwater concept, structural input, survey"}
    - {label: "BASIX certificate", stage: approval_documentation, fragment: null, after: ["Develop the design"], built_in: "no", why: "BASIX certificate for alterations and additions valued at $50,000 or more (owner ruling R5) must accompany the DA; commitments shown on the plans"}
    - {label: "Stormwater concept plan", stage: approval_documentation, fragment: null, after: ["Develop the design", "Detail and boundary survey"], built_in: "no", why: "Civil engineer's concept for the changed catchment: discharge point and connection of the added roof and hard surfaces (owner ruling R1); no fragment names it"}
    - {label: "Client sign-off for lodgement", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Prepare approval documentation", "Coordinate consultant reports", "BASIX certificate", "Stormwater concept plan"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "Standard"}
    # approvals
    - {label: "Lodge the application", stage: approvals, fragment: fr.da-lodgement, after: ["Client sign-off for lodgement"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.da-lodgement", why: "DA lodged on the NSW Planning Portal"}
    - {label: "Neighbour notification", stage: approvals, fragment: fr.da-exhibition, after: ["Lodge the application"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.da-exhibition", why: "The app labels it public exhibition; for a house it is notification of adjoining owners under the council's participation plan"}
    - {label: "DA assessment and determination", stage: approvals, fragment: fr.da-assessment, after: ["Neighbour notification"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.da-assessment", why: "Objections from neighbours are the usual source of delay"}
    - {label: "Construction certificate", stage: approvals, fragment: fr.construction-certificate, after: ["DA assessment and determination", "Prepare construction documentation", "Stormwater design for the CC"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-certificate", why: "Needs CC drawings, structural and stormwater design, levy paid and pre-CC conditions met"}
    - {label: "Appoint principal certifier and give notice of commencement", stage: approvals, fragment: null, after: ["Construction certificate", "Award the contract"], built_in: "no", why: "Statutory steps before work starts"}
    - {label: "Pre-commencement inspection by the principal certifier", stage: approvals, fragment: null, after: ["Appoint principal certifier and give notice of commencement"], built_in: "no", why: "Owner ruling R7 item 1: pre-start inspection of the site before the start of works; no fragment or interface"}
    # construction documentation
    - {label: "Prepare construction documentation", stage: construction_documentation, fragment: fr.construction-docs-1a, after: ["DA assessment and determination"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-docs-1a", why: "Can overlap DA assessment at the client's risk"}
    - {label: "Stormwater design for the CC", stage: construction_documentation, fragment: null, after: ["DA assessment and determination"], built_in: "no", why: "Civil engineer's detailed drainage design for the added roof and hard surfaces, to the consent conditions (owner ruling R1)"}
    - {label: "Client sign-off for tender", stage: construction_documentation, fragment: fr.construction-docs-1a, after: ["Prepare construction documentation", "Stormwater design for the CC"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-docs-1a", why: "Standard"}
    # procurement
    - {label: "Assemble the tender package", stage: procurement, fragment: fr.tender-docs-1a, after: ["Client sign-off for tender"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-docs-1a", why: "Includes the hazmat survey, provisional sums and the make-good scope"}
    - {label: "Tender period", stage: procurement, fragment: fr.tender-period-1a, after: ["Assemble the tender package"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-period-1a", why: "Builders need a site inspection of the existing house"}
    - {label: "Evaluate tenders", stage: procurement, fragment: fr.tender-evaluation-1a, after: ["Tender period"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-evaluation-1a", why: "Standard"}
    - {label: "Award the contract", stage: procurement, fragment: fr.contract-award, after: ["Evaluate tenders"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.contract-award", why: "The builder provides the home building compensation certificate before starting work or taking a deposit (contract price over $20,000 including GST, owner ruling R4)"}
    # construction
    - {label: "Owners vacate and hand over the house", stage: construction, fragment: null, after: ["Award the contract"], built_in: "no", why: "Drives the start date and the owners' rent"}
    - {label: "Establish the site", stage: construction, fragment: fr.site-establishment-1a, after: ["Owners vacate and hand over the house", "Pre-commencement inspection by the principal certifier"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.site-establishment-1a", why: "Fencing, signage, toilet, protection of retained rooms"}
    - {label: "Connect temporary builders power", stage: construction, fragment: fr.temporary-power, after: ["Establish the site"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.temporary-power", why: "Fires for this scope's electrical.temporary-power new item"}
    - {label: "Install erosion and sediment controls", stage: construction, fragment: fr.erosion-control, after: ["Establish the site"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.erosion-control", why: "Fires for this scope's site.erosion-sediment-control new item"}
    - {label: "Isolate, demolish and clear", stage: construction, fragment: fr.demolition-1a, after: ["Install erosion and sediment controls", "Connect temporary builders power"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.demolition-1a", why: "Fires for this scope's site.demolition remove item (remove, 1a, extend)"}
    - {label: "Remove internal loadbearing walls on props", stage: construction, fragment: fr.structure-alterations, after: ["Isolate, demolish and clear"], built_in: partial, source: "knowledge/program/fragments.yaml fr.structure-alterations", why: "Allowed early because the house is vacant; the fragment exists but is gated to refurb, so it is false on extend"}
    - {label: "Lodge services applications", stage: construction, fragment: fr.services-connections-1a, after: ["Establish the site"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.services-connections-1a", why: "Fires for site.services-connections alter (new, alter or upgrade; no work-type gate)"}
    - {label: "Lead-in connections", stage: construction, fragment: fr.services-connections-1a, after: ["Isolate, demolish and clear", "Lodge services applications"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.services-connections-1a", why: "Sewer junction and water service extended to the new wet areas"}
    - {label: "Cut, fill and trim levels", stage: construction, fragment: fr.earthworks-1a, after: ["Isolate, demolish and clear"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.earthworks-1a", why: "Fires for this scope's earthworks new item"}
    - {label: "Excavate and inspect footings", stage: construction, fragment: fr.footings-1a, after: ["Cut, fill and trim levels"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.footings-1a", why: "Certifier inspects after excavation and before footings are placed (critical stage, owner ruling R7 item 2)"}
    - {label: "Pour footings", stage: construction, fragment: fr.footings-1a, after: ["Excavate and inspect footings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.footings-1a", why: "Standard"}
    - {label: "Install termite management system", stage: construction, fragment: fr.termite-1a, after: ["Pour footings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.termite-1a", why: "Fires for this scope's termite-management new item"}
    - {label: "Install damp-proof membrane", stage: construction, fragment: fr.damp-1a, after: ["Pour footings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.damp-1a", why: "Fires for this scope's damp-waterproofing new item; keep the existing subfloor vents clear"}
    - {label: "Install stormwater drainage", stage: construction, fragment: fr.stormwater-1a, after: ["Cut, fill and trim levels"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.stormwater-1a", why: "Fires for this scope's stormwater-detention new item"}
    - {label: "Hold point: reinforcement inspection before slab pour", stage: construction, fragment: null, after: ["Install termite management system", "Install damp-proof membrane"], built_in: "yes", source: "knowledge/clusters/structure/interfaces.yaml if.reinforcement-inspected-before-pour", why: "Critical stage before pouring any in-situ reinforced concrete element (owner ruling R7 item 3); the hold point fires from the structure.concrete tag on the fr.slab-on-ground-1a pour activity (confirmed by a read-only Go run, 30 October 2026), for an extend scope with a new slab"}
    - {label: "Reinforce and pour slab", stage: construction, fragment: fr.slab-on-ground-1a, after: ["Hold point: reinforcement inspection before slab pour"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.slab-on-ground-1a", why: "Fires for this scope's slab new item"}
    - {label: "Stand wall frames", stage: construction, fragment: fr.frame-timber-1a, after: ["Reinforce and pour slab"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.frame-timber-1a", why: "Standard"}
    - {label: "Install roof trusses and bracing", stage: construction, fragment: fr.frame-timber-1a, after: ["Stand wall frames"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.frame-timber-1a", why: "Roof framing tied into the existing roof"}
    - {label: "Hold point: frame inspection before roof cladding", stage: construction, fragment: null, after: ["Install roof trusses and bracing"], built_in: "yes", source: "knowledge/clusters/structure/interfaces.yaml if.frame-inspected-before-roof", why: "Critical-stage inspection before covering the framework (owner ruling R7 item 4)"}
    - {label: "Install roof cover", stage: construction, fragment: fr.roof-1a, after: ["Hold point: frame inspection before roof cladding"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.roof-1a", why: "Tie-in to the existing roof and matching tiles or sheet"}
    - {label: "Install gutters and downpipes", stage: construction, fragment: fr.roof-drainage-1a, after: ["Install roof cover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.roof-drainage-1a", why: "Fires for this scope's roof-drainage new item"}
    - {label: "Hold point: stormwater drainage inspection before backfill", stage: construction, fragment: null, after: ["Install stormwater drainage", "Install gutters and downpipes"], built_in: "no", why: "Critical stage before covering stormwater drainage connections (owner ruling R7 item 6; clause 61 of the 2021 Regulation verified: false); no fragment or interface"}
    - {label: "Install windows and external doors", stage: construction, fragment: fr.windows-1a, after: ["Install roof cover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.windows-1a", why: "Long lead; ordered at contract award"}
    - {label: "Wrap and clad external walls", stage: construction, fragment: fr.external-walls-1a, after: ["Install roof cover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.external-walls-1a", why: "Standard"}
    - {label: "Break through into the existing house", stage: construction, fragment: null, after: ["Install windows and external doors", "Wrap and clad external walls"], built_in: "no", why: "Open the existing rear wall only once the addition is weathertight; the step that defines an alterations program"}
    - {label: "Form the opening in the existing rear wall", stage: construction, fragment: fr.structure-alterations, after: ["Break through into the existing house"], built_in: partial, source: "knowledge/program/fragments.yaml fr.structure-alterations", why: "Beams go in at break-through; the fragment is gated to refurb, so it is false on extend"}
    - {label: "Rough-in plumbing and drainage alterations", stage: construction, fragment: fr.hydraulic-sanitary-1a, after: ["Break through into the existing house"], built_in: partial, source: "knowledge/program/fragments.yaml fr.hydraulic-sanitary-1a", why: "Alter items on extend match neither the 1a nor the 1a-reno fragment"}
    - {label: "Upgrade the switchboard and rough-in electrical", stage: construction, fragment: fr.electrical-1a, after: ["Break through into the existing house"], built_in: partial, source: "knowledge/program/fragments.yaml fr.electrical-1a", why: "Alter and upgrade items on extend match neither fragment family"}
    - {label: "Rough-in and install the hot-water unit", stage: construction, fragment: fr.hydraulic-hot-1a, after: ["Break through into the existing house"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.hydraulic-hot-1a", why: "Fires for this scope's hot-water replace item"}
    - {label: "Install wall and ceiling insulation", stage: construction, fragment: fr.insulation-1a, after: ["Rough-in plumbing and drainage alterations", "Upgrade the switchboard and rough-in electrical"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.insulation-1a", why: "Certifier or BASIX evidence before lining"}
    - {label: "Sheet and set plasterboard", stage: construction, fragment: fr.linings-1a, after: ["Install wall and ceiling insulation"], built_in: partial, source: "knowledge/program/fragments.yaml fr.linings-1a", why: "Alter item on extend gets no row"}
    - {label: "Install ceilings", stage: construction, fragment: fr.ceilings-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.ceilings-1a", why: "Fires for this scope's ceilings new item"}
    - {label: "Hang internal doors", stage: construction, fragment: fr.internal-doors-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.internal-doors-1a", why: "Fires for this scope's internal-doors new item"}
    - {label: "Install luminaires", stage: construction, fragment: fr.lighting-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.lighting-1a", why: "Fires for this scope's lighting new item"}
    - {label: "Install air-conditioning", stage: construction, fragment: fr.ac-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.ac-1a", why: "Fires for this scope's air-conditioning new item"}
    - {label: "Waterproof wet areas", stage: construction, fragment: fr.wet-area-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.wet-area-1a", why: "Fires for this scope's wet-area-waterproofing new item"}
    - {label: "Hold point: waterproofing inspection and flood test", stage: construction, fragment: null, after: ["Waterproof wet areas"], built_in: "no", why: "Critical stage before covering waterproofing in wet areas (owner ruling R7 item 5) and the membrane certificate before tiling; envelope hold points use free text and never fire"}
    - {label: "Tile wet areas", stage: construction, fragment: fr.tiling-1a, after: ["Hold point: waterproofing inspection and flood test"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tiling-1a", why: "Fires for this scope's tiling new item"}
    - {label: "Install joinery", stage: construction, fragment: fr.joinery-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.joinery-1a", why: "Fires for this scope's joinery new item; long lead, kitchen measured on site after linings"}
    - {label: "Install smoke alarms", stage: construction, fragment: fr.smoke-alarms-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.smoke-alarms-1a", why: "The fragment accepts upgrade on extend"}
    - {label: "Paint internally", stage: construction, fragment: fr.painting-1a, after: ["Install joinery"], built_in: partial, source: "knowledge/program/fragments.yaml fr.painting-1a", why: "Alter item on extend gets no row"}
    - {label: "Make good existing finishes and lay floor finishes", stage: construction, fragment: fr.floors-1a, after: ["Paint internally", "Tile wet areas"], built_in: partial, source: "knowledge/program/fragments.yaml fr.floors-1a", why: "Alter item on extend gets no row; sanding existing boards comes last"}
    - {label: "Reinstate landscape and paving", stage: construction, fragment: fr.landscape-1a, after: ["Wrap and clad external walls"], built_in: partial, source: "knowledge/program/fragments.yaml fr.landscape-1a", why: "Fragment needs new or replace; the item is alter"}
    # completion
    - {label: "Practical completion inspection", stage: completion, fragment: fr.practical-completion, after: ["Make good existing finishes and lay floor finishes", "Install smoke alarms", "Reinstate landscape and paving", "Install luminaires", "Install air-conditioning", "Hang internal doors"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.practical-completion", why: "Standard"}
    - {label: "Stormwater works-as-executed and engineer's certificate", stage: completion, fragment: null, after: ["Hold point: stormwater drainage inspection before backfill"], built_in: "no", why: "The civil engineer certifies the installed drainage for the OC (owner ruling R1)"}
    - {label: "Final inspection by the principal certifier", stage: completion, fragment: null, after: ["Practical completion inspection"], built_in: "no", why: "Owner ruling R7 item 8: after the work is finished and before the occupation certificate; no fragment"}
    - {label: "Occupation certificate", stage: completion, fragment: fr.occupation-certificate, after: ["Final inspection by the principal certifier", "Stormwater works-as-executed and engineer's certificate"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.occupation-certificate", why: "Needs the BASIX, waterproofing, electrical, plumbing, stormwater and smoke alarm certificates"}
    - {label: "Handover", stage: completion, fragment: fr.handover, after: ["Occupation certificate"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.handover", why: "Standard"}
    - {label: "Owners move back in", stage: completion, fragment: null, after: ["Handover"], built_in: "no", why: "Ends the temporary accommodation cost"}
    # defects
    - {label: "Defects inspection", stage: defects, fragment: fr.defects-inspection, after: ["Handover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-inspection", why: "Standard"}
    - {label: "Defects liability period", stage: defects, fragment: fr.defects-liability-end, after: ["Defects inspection"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "HIA and MBA residential contracts carry a defects liability period (owner ruling R8; length verified: false); statutory home building warranties run longer"}
rfps:
  - discipline: consultant.architect
    template: architecture
    built_in: "yes"
    source: "data/eval/rfp/answer-keys/small-class1-extension.yaml"
    must_include:
      - "Measured drawings of the existing house, or reliance on a named measure-up"
      - "Existing, demolition and proposed drawings; old-to-new interfaces (existing_interfaces)"
      - "Concept, schematic, DA documentation with statement of environmental effects, shadow diagrams and notification plan"
      - "Planning response during assessment"
      - "Design development and one tender and construction set (house_documents)"
      - "Kitchen, bathroom, laundry and joinery design; finishes and fixtures schedule (house_interiors, house_selections)"
      - "BASIX commitments shown on the plans; liaison with the BASIX assessor and certifier"
      - "Bidding and tender queries"
      - "Construction-phase support or contract administration as a priced option"
    must_not_include:
      - "BIM model or BIM coordination"
      - "Interiors stage or typical interiors for a building beyond a house"
      - "Tender documents and for-construction documents as separate stages"
      - "Regulated design (the Design and Building Practitioners Act applies to Class 2 and 9c, not a Class 1 house: owner ruling R3)"
      - "Apartment design quality, facade certification, Green Star or NABERS"
    expect:
      stages_include: [concept, schematic, planning_approval, planning_response, design_development, house_documents, bidding]
      stages_option: [construction_support, contract_admin]
      stages_absent: [brief_masterplan, interiors, tender_traditional, dnc_tender, regulated_design, for_construction, post_novation]
      positions:
        coordination: I
        input_schedule: I
        specialist_coordination: I
        specification: I
        house_interiors: I
        house_selections: I
        door_schedule: I
        certifier_liaison: I
        document_uploads: I
        lodgement: I
        existing_interfaces: I
        ffe: O
        modifications: O
        value_management: O
        marketing_renders: X
        court: X
        as_built: X
        others_fees: X
        water_asset: absent
        sustainability_docs: absent
        country: absent
        live_staging: absent
        mixed_use_map: absent
        bim_model: absent
        tenant_fitout: absent
        signage: absent
        facade_certification: absent
        community: absent
      blocking: [fact:budget]
      sources:
        - "blocking: fact:budget holds while proj.budget_stated is unread (architecture.yaml required_facts); the scenario states the budget, so the block clears once it is read"
        - "existing_interfaces: module existing_building is on for work type extend"
        - "house module on (only class 1a); beyond_house off"
    app_differs:
      - {key: stage.bidding, app: option, expect: include, why: "bidding comes after the house boundary end (house_documents), so resolveStages prices it as an option"}
      - {key: text.planning_approval, app: "no statement of environmental effects, shadow diagrams or BASIX commitments named", expect: named, why: "domain deliverables of a house DA the template does not list"}
      - {key: text.existing_interfaces, app: "no measured drawings of the existing house named", expect: named, why: "the measure-up is the first deliverable of an alterations job; the template names only retain, demolish and alter drawings"}
  - discipline: consultant.structural
    template: structural
    built_in: "yes"
    source: "data/eval/rfp/answer-keys/small-class1-extension.yaml"
    must_include:
      - "Existing structure assessment of the walls, footings and roof the works rely on"
      - "Beams, posts and bearing pads over new openings and removed loadbearing walls"
      - "Footing, framing, bracing and tie-down design for the addition (residential_framing)"
      - "Footings founded to match the existing house; review of site and wind classification"
      - "Strengthening found necessary by the assessment, as an option"
      - "Construction documents for CC; inspections of footings and steel as an option"
    must_not_include:
      - "Shoring and piled retention design (no basement)"
      - "Shared Revit model as included scope"
      - "Regulated design"
      - "D&C tender documents or post-novation stages"
      - "Super-flat floor design"
      - "Temporary propping design (builder's temporary works designer)"
    expect:
      stages_include: [concept_schematic, existing_assessment, design_development, tender_traditional, construction_documents]
      stages_option: [construction_phase, planning_approval]
      stages_absent: [authority_asset, dnc_tender, regulated_design, post_novation]
      positions:
        design_basis: I
        geotech_brief: I
        residential_framing: I
        safety_in_design: I
        delegated_design: I
        services_footings: I
        value_management: I
        inspection_schedule: I
        strengthening: O
        metalwork: O
        services_fixings: O
        temporary_works_design: X
        dilapidation: X
        compaction: X
        demolition_drawings: X
        shared_model: absent
        retention_design: absent
        temporary_works_interfaces: absent
        super_flat_floor: absent
        specialist_element_design: absent
      blocking: []
      sources:
        - "existing_assessment: work_type extend (structural.yaml stages); matches data/eval/rfp/answer-keys/small-class1-extension.yaml"
        - "strengthening: O because existing_assessment is a stage"
        - "inspection_schedule: I because construction_phase is a stage (option counts)"
        - "dilapidation X with flag.excavation_adjoining and flag.basement no; the neighbour-dilapidation trigger turns it to O"
    app_differs:
      - {key: position.shared_model, app: O, expect: absent, why: "service_level simple O"}
      - {key: position.super_flat_floor, app: O, expect: absent, why: "client flag cannot be set; if_unknown option"}
      - {key: position.specialist_element_design, app: O, expect: absent, why: "O whenever procurement is not design_construct"}
      - {key: stage.planning_approval, app: include, expect: option, why: "included on any DA; a house alteration DA rarely needs structural input beyond a statement"}
  - discipline: consultant.surveyor
    template: land-surveying
    built_in: partial
    source: "knowledge/rfp/land-surveying.yaml"
    must_include:
      - "Detail and level survey of the site and the existing house: floor, ridge and eave levels"
      - "Boundary identification and setbacks to the existing house"
      - "Neighbouring windows, ridge heights and trees for overshadowing and privacy (adjoining)"
      - "Sewer junction, stormwater and services locations (services)"
      - "Boundary peg-out or footing set-out check before pour, as an option"
    must_not_include:
      - "Subdivision, strata or easement creation"
      - "Movement monitoring without excavation next to neighbours"
      - "Occupied-site access staging when the house is vacant"
    expect:
      stages_include: [s1_plan, s2_detail, s3_boundary, s4_services]
      stages_option: [s6_construction, s7_completion]
      stages_absent: [s5_support]
      positions:
        control: I
        records: I
        boundary: I
        adjoining: I
        setout: O
        asbuilt: O
        interior: O
        exposure: X
        titling: absent
        monitoring: absent
        buried: absent
        sewer: absent
        access: absent
      blocking: []
      sources:
        - "interior: an optional measure-up of the existing house when the architect does not measure it"
        - "access absent: flag.staged no and the house is vacant (live_operations no)"
    app_differs:
      - {key: position.titling, app: O, expect: absent, why: "always O"}
      - {key: position.monitoring, app: O, expect: absent, why: "always O"}
      - {key: stage.s5_support, app: option, expect: absent, why: "after the boundary"}
      - {key: stage.s2_detail, app: ask, expect: include, why: "client flag survey_detail"}
      - {key: stage.s3_boundary, app: ask, expect: include, why: "client flag survey_boundary"}
      - {key: stage.s4_services, app: ask, expect: include, why: "client flag survey_services"}
      - {key: position.boundary, app: ask, expect: I, why: "client flag survey_boundary"}
      - {key: position.adjoining, app: ask, expect: I, why: "client flag survey_adjoining"}
      - {key: position.buried, app: ask, expect: absent, why: "client flag survey_buried"}
      - {key: position.sewer, app: ask, expect: absent, why: "client flag survey_sewer; no sewer main within the lot in the base"}
      - {key: text.s2_detail, app: "no existing floor, ridge and eave levels named", expect: named, why: "the old-to-new floor junction and the DA height plane need them"}
  - discipline: consultant.certifier
    template: bca-certification
    built_in: partial
    source: "knowledge/rfp/bca-certification.yaml"
    must_include:
      - "Construction certificate assessment (B2)"
      - "Principal certifier: the critical-stage inspections the CC lists (pre-commencement, footings, slab, frame, wet-area waterproofing, stormwater connections, final before the OC; owner ruling R7) (B3)"
      - "Occupation certificate (B4)"
      - "BASIX commitments check (residential_evidence)"
      - "Limited existing-house assessment: smoke alarms and the affected part only, no whole-house upgrade"
    must_not_include:
      - "BCA advisory stages A1 to A3 as the default appointment"
      - "Fire system referrals and witnessing"
      - "Performance solutions as included scope"
      - "Staged occupation certificates when the house is vacant"
    expect:
      stages_include: [b2_construction_approval, b3_construction, b4_occupation]
      stages_option: [b1_preliminary]
      stages_absent: [a1_inception, a2_planning, a3_tender, a4_construction]
      positions:
        statutory_functions: I
        evidence_registers: I
        residential_evidence: I
        existing_assessment: I
        performance_assessment: O
        extra_visits: O
        specialist_design: X
        other_approvals: X
        supervision: X
        classification_map: absent
        staged_occupation: absent
        fire_referrals: absent
      blocking: []
      sources:
        - "existing_assessment I: limited to the affected part and smoke alarms; no whole-house upgrade"
    app_differs:
      - {key: stage.a1_inception, app: ask, expect: absent, why: "boundary falls back to a1..a3 without the client flag bca_certification"}
      - {key: stage.a2_planning, app: ask, expect: absent, why: "as above"}
      - {key: stage.a3_tender, app: ask, expect: absent, why: "as above"}
      - {key: stage.b2_construction_approval, app: option, expect: include, why: "after the a1..a3 boundary"}
      - {key: stage.b3_construction, app: option, expect: include, why: "after the boundary"}
      - {key: stage.b4_occupation, app: option, expect: include, why: "after the boundary"}
      - {key: position.statutory_functions, app: ask, expect: I, why: "row needs the client flag bca_certification"}
      - {key: position.residential_evidence, app: ask, expect: I, why: "client flag bca_residential_evidence"}
      - {key: position.existing_assessment, app: ask, expect: I, why: "client flag bca_existing_assessment"}
      - {key: position.classification_map, app: ask, expect: absent, why: "client flag bca_classification_map"}
      - {key: position.staged_occupation, app: ask, expect: absent, why: "client flag bca_staged_occupation"}
      - {key: position.fire_referrals, app: ask, expect: absent, why: "client flag bca_fire_referrals"}
  - discipline: consultant.geotechnical
    template: geotechnical
    built_in: partial
    source: "knowledge/rfp/geotechnical.yaml"
    must_include:
      - "Investigation plan for the addition footprint"
      - "Boreholes or hand augers and one test pit at an existing footing (field)"
      - "Site classification to AS 2870 and foundation advice for the addition footings"
      - "Interpretation report"
    must_not_include:
      - "Contamination, waste classification or remediation"
      - "Groundwater monitoring or dewatering"
      - "Acid sulfate soils assessment unless mapped"
      - "Pavement and civil earthworks parameters"
    expect:
      stages_include: [g1_plan, g2_field, g3_report]
      stages_option: [g5_design, g6_construction]
      stages_absent: [g4_planning, g7_transfer]
      positions:
        plan: I
        foundation: I
        clearance: I
        construction: O
        access: X
        environment: X
        monitoring: absent
        asset_exposure: absent
        ass: absent
        defects: absent
        transfer: absent
      blocking: []
    app_differs:
      - {key: position.monitoring, app: O, expect: absent, why: "always O"}
      - {key: stage.g7_transfer, app: option, expect: absent, why: "default option"}
      - {key: position.transfer, app: O, expect: absent, why: "O unless g7 included"}
      - {key: position.defects, app: O, expect: absent, why: "always O"}
      - {key: stage.g2_field, app: ask, expect: include, why: "client flag geotech_intrusive cannot be keyed"}
      - {key: position.foundation, app: ask, expect: I, why: "client flag geotech_foundation"}
      - {key: position.clearance, app: ask, expect: I, why: "client flag geotech_intrusive"}
      - {key: position.ass, app: ask, expect: absent, why: "client flag geotech_ass"}
      - {key: position.asset_exposure, app: ask, expect: absent, why: "client flag geotech_asset_exposure"}
      - {key: text.g2_field, app: "no test pit at an existing footing named", expect: named, why: "new footings are founded to match the existing house"}
  - discipline: consultant.civil
    template: civil
    built_in: partial
    source: "knowledge/rfp/civil.yaml"
    must_include:
      - "Stormwater concept plan for the DA: catchment change from the added roof and hard surfaces, discharge point, connection to the existing system or kerb"
      - "Investigation of the retained drainage (CCTV or locating) and how it changes the design (retained_services)"
      - "Detailed stormwater design for the CC"
      - "Erosion and sediment control plan"
      - "Works-as-executed review and stormwater certificate for the OC"
    must_not_include:
      - "Roads, pavements and levels element (no driveway in a rear addition)"
      - "Public road works, road safety audit"
      - "MUSIC water quality modelling, NorBE, trunk drainage"
      - "On-site detention design unless council requires it (trigger osd-or-drainage-easement)"
      - "Flood report (trigger flood-affected)"
      - "3D civil model, design criteria document, clash check"
      - "Regulated-design declarations; D&C or post-novation stages"
    expect:
      stages_include: [schematic, detailed_tender, for_construction, as_built]
      stages_option: [construction_phase]
      stages_absent: [dnc_tender, post_novation]
      elements_include: [earthworks, stormwater]
      elements_absent: [roads, public_road]
      positions: {utility_plan: I, discharge: I, drainage_model: I, hydraulic_connection: I, safety_in_design: I, retained_services: I, retaining_structural: X, clash_check: X, design_criteria: X, water_strategy: X, quality_audit: X, services_location: X, shoring: X, trunk_drainage: X, sea: X, road_safety_audit: X, om_manual: X, quantities: X, modifications: X, water_quality: absent, norbe: absent, osd_new: absent, osd_existing: absent, osd_replacement: absent, earthworks_suitability: absent, flood_report: absent, flood_evacuation: absent, pavement_design: absent, civil_model: absent, public_road_approvals: absent, civil_declarations: absent}
      blocking: []
      sources:
        - "retained_services I: module existing_building is on for work type extend (modules.yaml existing_building)"
        - "osd_new, osd_existing, flood_report and earthworks_suitability absent because flag.osd_required, flag.osd_existing, det.flood_hazard, det.potentially_contaminated_land, det.acid_sulfate_soils_mapped and flag.groundwater are no/false in the base"
        - "civil_declarations absent: proj.regulated_design no (DBP Act does not reach a Class 1 house, owner ruling R3)"
        - "same form as T01's civil expect, plus retained_services for the existing house"
    app_differs:
      - {key: stage.for_construction, app: option, expect: include, why: "the traditional boundary ends at detailed_tender, so resolveStages prices the later for_construction stage as an option; the CC set is needed"}
      - {key: stage.as_built, app: option, expect: include, why: "follows construction_phase, which is an option; WAE certification is needed for the OC"}
      - {key: element.roads, app: include, expect: absent, why: "the roads element is shown always; a rear addition has no driveway or car park"}
      - {key: position.water_quality, app: O, expect: absent, why: "I when flags, else O"}
      - {key: position.civil_model, app: O, expect: absent, why: "service_level simple O"}
      - {key: position.pavement_design, app: O, expect: absent, why: "always O"}
  - discipline: consultant.basix
    template: null
    built_in: "no"
    must_include:
      - "BASIX certificate for alterations and additions (work valued at $50,000 or more, owner ruling R5), lodged with the DA"
      - "Thermal comfort assessment of the addition (DIY method or NatHERS assessment)"
      - "Commitments schedule for the plans and a revised certificate at CC if the design changes"
    must_not_include:
      - "NCC Section J or Green Star"
      - "Whole-house rating of unaltered parts"
  - discipline: consultant.hazmat
    template: null
    built_in: "no"
    must_include:
      - "Pre-demolition and refurbishment hazardous materials survey of every area affected by the works, including roof space, subfloor and eaves"
      - "Sampling with NATA-accredited analysis; asbestos, lead paint and ceiling dust sampling where ceilings are removed"
      - "Register and recommendations for the tender documents"
      - "Clearance inspection and certificate after removal, as an option"
    must_not_include:
      - "Carrying out the removal work (licensed removalist under the builder)"
      - "Soil contamination assessment"
triggers:
  - id: occupied-during-works
    label: Owners stay in the house during construction
    evidence:
      - "The owners will remain in occupation throughout the works, which are to be staged."
      - "The kids' bedrooms and the front bathroom must stay usable while the back is built."
      - "Builder to maintain a working kitchen and bathroom for the family at all times."
    negation:
      - "The owners will vacate the house for the duration of the works."
      - "The house will be unoccupied from site possession to practical completion."
    profile: [hdr.cond.operational_constraints]
    adds:
      work_items: [{system: structure.temporary-works, action: new}, {system: electrical.temporary-power, action: new}]
      cost_plan: ["Preliminaries and builder's margin", "Temporary kitchen and bathroom facilities", "Dust screens and protection to occupied rooms"]
      program: ["Stage 1: build and lock up the addition", "Install dust screens and protection to occupied rooms", "Stage 2: break through and renovate the existing rooms", "Temporary kitchen and bathroom"]
      rfps: [{discipline: consultant.architect, must_include: ["Staging plan and temporary arrangements for an occupied house"]}, {discipline: consultant.certifier, must_include: ["Occupation of the existing house while work continues"]}]
      authority: []
    removes:
      cost_plan: ["Temporary accommodation, removal and storage while the house is vacated", "Owner's insurance for a vacant house under construction"]
      program: ["Owners vacate and hand over the house", "Owners move back in"]
    built_in: {program: partial, rfps: partial, cost_plan: "no", work_items: "no"}
    source: "knowledge/rfp/modules.yaml live_site"
  - id: hazardous-materials-found
    label: Asbestos or lead paint in the parts being demolished or disturbed
    evidence:
      - "The hazardous materials survey identified bonded asbestos cement sheeting to the eaves and the rear laundry walls."
      - "The old fibro lean-to out the back is to be demolished."
      - "Lead-based paint detected on the original window frames and skirtings."
      - "Super Six roof sheeting to the rear verandah."
      - "Lead dust in the ceiling void above the rooms where walls are to be removed."
    negation:
      - "No asbestos-containing materials were detected in any sample."
      - "Samples 1-6 of the eaves and wet-area linings: no asbestos detected; the fibre-cement eaves date from the 1996 re-roof."
    profile: [det.existing_building_year]
    adds:
      procurement: [consultant.hazmat]
      cost_plan: ["Demolition, strip-out and hazardous materials removal", "Hazardous materials survey"]
      program: ["Notify SafeWork NSW of licensed asbestos removal", "Remove asbestos and obtain a clearance certificate", "Lead paint management before sanding or removal"]
      rfps: [{discipline: consultant.hazmat, must_include: ["Clearance inspection and certificate after removal"]}]
      authority: ["SafeWork NSW notification of licensed asbestos removal work", "Waste disposal to a licensed facility with tracking"]
    built_in: {procurement: "no", program: partial, cost_plan: partial, rfps: "no"}
    source: "knowledge/program/fragments.yaml fr.existing-conditions"
  - id: heritage-conservation-area
    label: House is in a heritage conservation area or is a heritage item
    evidence:
      - "The site is within the Example Heritage Conservation Area listed in Schedule 5 of the LEP."
      - "The dwelling is identified as a contributory building in the conservation area."
      - "Council's heritage officer asked that the Federation streetscape be kept intact."
    negation:
      - "The land is not a heritage item and is not within a heritage conservation area."
      - "Dulux Heritage colour range to be used for the external paintwork."
    profile: [det.heritage_status]
    adds:
      procurement: [consultant.heritage, consultant.town_planner]
      cost_plan: ["Heritage", "Town Planner"]
      program: ["Heritage impact statement", "Heritage referral"]
      rfps: [{discipline: consultant.architect, must_include: ["Heritage-sensitive design and materials schedule"]}, {discipline: consultant.heritage, must_include: ["Heritage impact statement for the DA"]}]
      authority: ["Council heritage assessment within the DA; CDC not available for a heritage item or in a heritage conservation area (Housing Code land exclusions, clause verified: false)"]
    built_in: {procurement: "yes", program: "yes", rfps: partial, cost_plan: partial}
    source: "knowledge/works/package_defaults.yaml complexity_additions[1]"
  - id: first-floor-addition
    label: First-floor addition over the existing house
    evidence:
      - "New first-floor addition over the existing house containing the main bedroom and ensuite."
      - "We want to go up rather than out to keep the backyard."
    negation:
      - "Single-storey addition only; no change to the existing roof over the front rooms."
    profile: [hdr.scale.storeys]
    adds:
      work_items: [{system: substructure.underpinning, action: new}, {system: access-egress.stairs-and-ramps, action: new}, {system: structure.temporary-works, action: new}, {system: access-egress.barriers, action: new}]
      cost_plan: ["Underpinning and footing strengthening", "Temporary roof and weatherproofing"]
      program: ["Underpin existing walls", "Remove the existing roof", "Install temporary roof", "Owners vacate"]
      rfps: [{discipline: consultant.structural, must_include: ["Capacity of the existing walls and footings for the new floor", "Underpinning design"]}, {discipline: consultant.geotechnical, must_include: ["Test pits at existing footings"]}]
      authority: []
    built_in: {program: "yes", rfps: partial, cost_plan: partial, work_items: "no"}
    source: "knowledge/program/fragments.yaml fr.underpinning-1a"
  - id: building-over-sewer
    label: Addition over or next to a Sydney Water sewer
    evidence:
      - "A Sydney Water sewer main runs across the rear yard within the footprint of the addition."
      - "Footings within the zone of influence of the 150 mm sewer to be piered below it."
      - "The proposal will build over the existing sewer line."
    negation:
      - "Sydney Water's asset search shows no sewer main within the property; the sewer is in the street."
    profile: [flag.authority_asset]
    adds:
      work_items: [{system: substructure.piles, action: new}]
      cost_plan: ["Service authority connection fees", "Piers below the sewer zone of influence"]
      program: ["Sydney Water building plan approval", "CCTV of the sewer before and after the works"]
      rfps: [{discipline: consultant.structural, must_include: ["Authority asset assessment and piering design"]}, {discipline: consultant.architect, must_include: ["Water authority approval to build over or next to its asset"]}]
      authority: ["Sydney Water building plan approval (Sydney Water Tap in) before the CC"]
    built_in: {rfps: "yes", program: "no", cost_plan: partial}
    source: "knowledge/rfp/structural.yaml authority_asset"
  - id: neighbour-dilapidation
    label: Works or excavation close to a neighbour's house
    evidence:
      - "Excavation up to 1.2 m deep within 1 m of the dwelling at No. 14."
      - "Prior to commencement a dilapidation report of the adjoining properties is to be prepared (DA condition)."
    negation:
      - "The adjoining dwellings are more than 6 m from the works and no excavation is proposed near the boundary."
    profile: [flag.excavation_adjoining]
    adds:
      procurement: [consultant.building]
      work_items: [{system: site.adjoining-structures, action: retain}]
      cost_plan: ["Dilapidation surveys"]
      program: ["Pre-commencement dilapidation survey of neighbours", "Post-completion dilapidation survey"]
      rfps: [{discipline: consultant.structural, must_include: ["Dilapidation surveys of adjoining structures", "Excavation support next to the boundary"]}]
      authority: ["Notice to adjoining owners; neighbour consent for access under the Access to Neighbouring Land Act where needed"]
    built_in: {rfps: "yes", procurement: "no", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/structural.yaml dilapidation"
  - id: semi-detached-party-wall
    label: Semi-detached or terrace house sharing a party wall
    evidence:
      - "The house is one of a pair of semi-detached cottages sharing a party wall with No. 32."
