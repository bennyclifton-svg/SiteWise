      cost_plan: ["Site works and external works", "Access and egress"]
      program: ["Construct retaining walls", "Install piers"]
      rfps: [{discipline: consultant.geotechnical, must_include: ["Slope stability and retaining wall parameters"]}, {discipline: consultant.structural, must_include: ["Retaining walls and pier design"]}]
      authority: []
    removes:
      work_items: [{system: substructure.slab-on-ground, action: new}]
      program: ["Reinforce and pour slab"]
    built_in: {cost_plan: "yes", program: "no", rfps: partial}
    source: "knowledge/costs/elements.yaml"
  - id: termite-damage-found
    label: Active termites or termite damage in the existing house
    evidence:
      - "The timber pest inspection found active termites in the subfloor bearers under the rear rooms."
      - "Termite damage to the wall plates was found when the rear wall linings were removed."
    negation:
      - "Timber pest inspection: no evidence of termite activity or damage."
    profile: []
