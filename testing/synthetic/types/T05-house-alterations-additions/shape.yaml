  - id: cdc-pathway
    label: Complying development instead of a DA
    evidence:
      - "The proposal is complying development under the Housing Code."
      - "CDC to be lodged with a registered certifier."
    negation:
      - "A DA is required because the addition does not meet the Housing Code side setback."
      - "The site is within a heritage conservation area, so complying development is not available."
    profile: [hdr.cond.planning]
    adds:
      program: ["Prepare and lodge the CDC", "Certifier determination", "Notice to neighbours before work starts"]
      cost_plan: ["CDC and certifier fees"]
      rfps: [{discipline: consultant.certifier, must_include: ["CDC assessment and determination"]}]
      authority: ["CDC issued by a registered certifier; no council DA, no CC"]
    removes:
      cost_plan: ["DA fees and contributions", "Construction certificate and certifier fees"]
      program: ["Lodge the application", "Neighbour notification", "DA assessment and determination", "Construction certificate"]
    built_in: {program: "yes", cost_plan: partial, rfps: "no"}
    source: "knowledge/program/fragments.yaml fr.cdc-application"
  - id: electrical-supply-upgrade
    label: Consumer mains upgrade or overhead service relocation
    evidence:
      - "The overhead service line crosses where the addition roof goes and must be relocated."
      - "Upgrade to a three-phase supply for the heat pump and induction cooktop."
    negation:
      - "The existing underground supply has the capacity for the new loads."
    profile: []
    adds:
      work_items: [{system: electrical.utility-supply, action: alter}]
      cost_plan: ["Service authority connection fees", "Level 2 service provider works"]
      program: ["DNSP connection application", "Authority connection"]
      authority: ["Ausgrid, Endeavour Energy or Essential Energy connection application; Level 2 accredited service provider"]
    built_in: {program: "yes", cost_plan: partial, work_items: "no"}
    source: "knowledge/program/fragments.yaml fr.utility-1a"
  - id: flood-affected
    label: Flood-affected lot
    evidence:
      - "The site is a flood control lot; habitable floor levels to be 500 mm above the 1% AEP flood level."
      - "Council's flood information certificate shows overland flow across the rear yard."
    negation:
      - "The land is not flood affected."
      - "Flood test the shower recess before tiling."
    profile: [det.flood_hazard, det.flood_planning_level]
    adds:
      # The civil engineer is already in the base (owner ruling R1); flood adds scope to that package.
      work_items: [{system: site.flooding, action: new}]
      program: ["Flood advice", "Construct flood protection"]
      rfps: [{discipline: consultant.civil, must_include: ["Flood report and floor levels for the DA"]}]
      authority: ["Council flood information certificate"]
    built_in: {program: "yes", rfps: "yes"}
    source: "knowledge/rfp/civil.yaml flood_report"
  - id: unapproved-existing-work
    label: Earlier additions to the house were never approved
    evidence:
      - "The rear sunroom was enclosed by a previous owner without approval."
      - "Council has no record of approval for the garage conversion."
    negation:
      - "Council records hold the approval and occupation certificate for the 1994 rear addition."
    profile: [det.existing_building]
    adds:
      cost_plan: ["Building information certificate"]
      program: ["Building information certificate application", "Rectify or demolish the unapproved work"]
