      rfps: [{discipline: consultant.structural, must_include: ["Repair design for damaged existing members"]}]
      authority: []
    built_in: {program: "no", cost_plan: "no", rfps: partial}
    source: "knowledge/rfp/structural.yaml strengthening"
  - id: loose-fill-asbestos
    label: House on the NSW loose-fill asbestos insulation register
    evidence:
