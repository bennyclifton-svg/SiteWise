schema: sitewise-synthetic-shape/1
type_id: T03
slug: office-fitout
name: Commercial office fit-out
reviewed: false
state: NSW
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
# Base scenario: a tenant fit-out of one whole floor (about 1,200 m2 NLA) of an occupied, landlord-controlled
# A-grade Class 5 tower in Sydney. The floor is handed over in base-building condition (ceiling grid, base-building
# lighting, VAV air-conditioning, sprinklers, detection and EWIS, amenities on the core). Interior designer leads a
# traditional lump-sum tender to fit-out contractors. Complying development certificate (CDC).
profile:
  hdr.building_class: commercial
  hdr.subclass: office
  hdr.work_type: refurb
  hdr.cond.planning: cdc
  hdr.cond.procurement_route: traditional
  hdr.cond.quality_level: high       # residential-only field (taxonomy.yaml applies_to); the keys mark it not_read
  hdr.cond.operational_constraints: partial_occupation   # R19: the keys accept partial_occupation or live_environment
  hdr.cond.access_constraints: restricted_hours
  hdr.cond.environmental_sensitivity: standard
  hdr.scale.nla_sqm: 1200
  hdr.scale.floor_plate_sqm: 1200
  hdr.scale.tenancies: 1
  hdr.scale.grade: A
  # The building's storeys, not the works: the fit-out is on one floor (keyword trap, DOMAIN.md section 10).
  hdr.scale.storeys: 24
  det.ncc_class: ["5"]
  det.state: NSW
  det.existing_building: true
  det.existing_building_year: 2008
  det.heritage_status: none
  det.bushfire_prone_land: false
  det.flood_hazard: false
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  det.sprinklered: true
  det.type_of_construction: A
  det.rise_in_storeys: 24
  det.climate_zone: "5"
  det.gas_supply: none
  fact.contract_form: as4000
  proj.regulated_design: "no"
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options or asks.
  flag.staged: "no"
  flag.multi_building: "no"
  flag.sustainability_target: "no"
  flag.community: "no"
  flag.country: "no"
  flag.fire_vulnerable_occupants: "no"
  flag.fire_special_hazards: "no"
  flag.fire_specialist_systems: "no"
  flag.basement: "no"
  flag.excavation_adjoining: "no"
  flag.transfer_structures: "no"
  flag.authority_asset: "no"
  flag.rail: "no"
  flag.arborist_tree_impacts: "no"
  flag.public_road: "no"
  flag.osd_required: "no"
  flag.osd_existing: "no"
  flag.cl46: "no"
  flag.panel: "no"

expected_derived:
  - {key: det.basix_required, value: false, source: "knowledge/clusters/envelope/rules.yaml rule.basix.certificate-required", note: "BASIX is a residential instrument; a Class 5 fit-out never needs one"}
  - {key: det.energy_compliance_pathway, value: section_j_dts, note: "no profile_group, so not settable; NCC Section J applies to the new lighting, power and air-conditioning work (Part numbers verified: false)"}
  - {key: det.existing_building, value: true, note: "the RFP drivers also derive flag.existing_building from work type refurb (internal/rfp/drivers.go deriveFlags)"}

scenario_inputs:
  - {key: proj.budget_stated, note: "stated in the tenant's brief; amount chosen by the scenario author", phrasing: "Fit-out construction budget: $<amount> excluding GST"}
  - {key: hdr.scale.nla_sqm, note: "stated in the brief or agreement for lease", phrasing: "Tenancy: whole of Level <n>, <area> m2 NLA"}
  - {key: proj.owner_supply_stated, note: "tenant-direct supply outside the fit-out contract. The expected labels assume the read value is the list after the colon; state the list in its own sentence, e.g. 'Tenant-supplied items: loose furniture, workstations, AV equipment, IT active equipment'. splitOutsideBrackets splits at the first comma (internal/costs/budget.go), so a lead-in such as 'Tenant supply, outside the fit-out contract:' would write extra lines", phrasing: "The fit-out contract excludes tenant-supplied items. Tenant-supplied items: loose furniture and workstations, AV equipment, IT active equipment"}
  - {key: det.existing_building_year, note: "decides whether an asbestos register applies", phrasing: "The building was completed in <year>"}
  - {key: det.existing_building_year, note: "a 1979 date alone gives the register check and the hazardous-materials survey only; it is not evidence of asbestos in the tenancy, removal or clearance", phrasing: "The building was completed in 1979"}
  - {key: hdr.cond.procurement_route, note: "no profile key records consultant stage scope; the traditional route is the fact it rests on, and the consultant brief must state the scope so a reader can see it", phrasing: "The services engineers' scope runs through construction-phase inspections, witness testing and completion certification"}
  - {key: hdr.cond.operational_constraints, note: "the building stays occupied by other tenants", phrasing: "All other floors of the building remain occupied by tenants throughout the works"}
  - {key: hdr.cond.access_constraints, note: "the landlord's building rules", phrasing: "Noisy works and deliveries are restricted to after hours and weekends under the landlord's building rules"}

work_items:
  - {system: interiors.walls-linings, action: new, why: "Plasterboard partitions to offices, meeting rooms, comms room and storage; acoustic partitions to the boardroom"}
  - {system: interiors.internal-glazing, action: new, why: "Glazed meeting-room fronts and office suites with manifestation; long lead"}
  - {system: interiors.ceilings, action: alter, why: "Base-building suspended grid altered: tiles and lights removed and stored for the landlord at new rooms, plasterboard ceilings and bulkheads in feature areas"}
  - {system: interiors.internal-doors, action: new, why: "Solid-core and glazed doors with hardware"}
  - {system: interiors.joinery, action: new, why: "Reception desk, kitchenette and breakout joinery, storage walls, lockers; long lead"}
  - {system: interiors.floor-finishes, action: new, why: "Carpet tiles over the base-building slab or raised floor, vinyl to kitchenette and comms room"}
  - {system: interiors.painting, action: new, why: "Painting to new partitions and the core walls inside the tenancy"}
  - {system: interiors.room-acoustics, action: new, why: "Acoustic ceiling and wall treatment to meeting rooms and the boardroom (speech privacy)"}
  - {system: interiors.ffe, action: new, why: "Loose furniture and workstations are tenant supply outside the fit-out contract; the builder powers and coordinates them"}
  - {system: site.signage, action: new, why: "Tenancy entry signage and internal wayfinding, to the landlord's signage rules"}
  - {system: fire-passive.penetrations, action: new, why: "Fire stopping where new cabling and pipework pass through the rated riser and comms-room walls"}
  - {system: fire-active.sprinklers, action: alter, why: "Relocate and add heads to suit the new rooms (AS 2118.1, verified: false); base-building system, often by the landlord's nominated contractor"}
  - {system: fire-active.detection, action: alter, why: "Relocate and add detectors for the enclosed rooms (AS 1670.1, verified: false)"}
  - {system: fire-active.occupant-warning, action: alter, why: "EWIS speakers and strobes added to enclosed rooms and re-tested with the base-building panel (AS 1670.4, verified: false)"}
  - {system: fire-active.emergency-lighting, action: alter, why: "Emergency lights and exit signs relocated and added for the new layout (AS 2293.1, verified: false)"}
  - {system: mechanical.air-conditioning, action: alter, why: "Re-zone the base-building VAV system: added terminals and thermostats for meeting rooms and offices"}
  - {system: mechanical.air-distribution, action: alter, why: "Flexible duct, diffusers and return air paths for the new partitions"}
  - {system: mechanical.ventilation, action: alter, why: "Outside air to high-occupancy meeting rooms and the boardroom, within the base-building allowance"}
  - {system: mechanical.local-exhaust, action: new, why: "Kitchenette and print-room exhaust into the base-building toilet or general exhaust riser"}
  - {system: mechanical.controls-bms, action: alter, why: "BMS points and after-hours AC controls for the new zones, by the landlord's BMS contractor"}
  - {system: hydraulic.cold-water, action: alter, why: "Kitchenette sink, dishwasher, boiling and chilled water unit off the tenant water point"}
  - {system: hydraulic.hot-water, action: new, why: "Local instantaneous hot-water unit at the kitchenette"}
  - {system: hydraulic.sanitary, action: alter, why: "Kitchenette waste to the base-building tenant waste point"}
  - {system: electrical.switchboards, action: alter, why: "New circuits and a tenant sub-board fed from the base-building tenant distribution board"}
  - {system: electrical.cabling-wiring, action: alter, why: "Power to workstations through power poles or the existing floor boxes, and to joinery and appliances"}
  - {system: electrical.lighting, action: alter, why: "Base-building luminaires re-arranged, feature and pendant lighting, DALI or sensor controls (Section J lighting, verified: false)"}
  - {system: comms-security.structured-cabling, action: new, why: "Category 6A data cabling to workstations, Wi-Fi points and AV"}
  - {system: comms-security.ict-rooms-pathways, action: new, why: "Comms room, racks, cable tray and riser pathway to the building carrier room"}
  - {system: comms-security.access-control, action: new, why: "Card readers at the tenancy entry and secure rooms, integrated with the base-building security system"}
  - {system: comms-security.audiovisual, action: new, why: "Meeting room and boardroom AV, often tenant-direct; the builder provides power, data and in-wall conduits"}
  - {system: access-egress.exits, action: alter, why: "New rooms change travel distances and paths to the base-building fire stairs; a design outcome checked by the BCA consultant"}
  - {system: access-egress.egress-doors, action: new, why: "Tenancy entry doors on the path of travel with egress hardware and access control"}
  - {system: access-egress.accessible-access, action: alter, why: "Accessible path of travel inside the tenancy, door circulation spaces, hearing augmentation in the boardroom"}

procurement:
  - {discipline: consultant.project_manager, kind: services, need: usually, built_in: "no", why: "Tenant's project manager: brief, budget, program, landlord liaison under the agreement for lease, consultant and contractor procurement, superintendent; no package rule names it"}
  - {discipline: consultant.interior_design, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[4]", why: "Design lead: workplace brief, test fit, design, documentation, CDC drawings, tender"}
  - {discipline: consultant.mechanical, kind: services, need: usually, aliases: [consultant.services], built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Re-zoning the base-building AC, outside air, exhaust, BMS points; one multi-services firm often does mechanical, electrical, hydraulic and fire"}
  - {discipline: consultant.electrical, kind: services, need: usually, aliases: [consultant.services], built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Power, lighting and controls, emergency lighting, Section J lighting, ICT pathways"}
  - {discipline: consultant.fire_services, kind: services, need: usually, aliases: [consultant.services], built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Sprinkler, detection and EWIS alteration design against the base-building systems and fire engineering report"}
  - {discipline: consultant.hydraulic, kind: services, need: optional, aliases: [consultant.services], built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Kitchenette water and waste only; often by the services firm or design-and-install plumber"}
  - {discipline: consultant.bca, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "BCA compliance report for the CDC: egress, travel distances, doors, fire safety schedule, access"}
  - {discipline: consultant.certifier, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "CDC, principal certifier, final inspection, occupation certificate"}
  - {discipline: consultant.access, kind: services, need: usually, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Access report against AS 1428.1 (verified: false) for the CDC; hearing augmentation and door circulation"}
  - {discipline: consultant.quantity_surveyor, kind: services, need: usually, built_in: "no", why: "Cost plan, pre-tender estimate, tender evaluation, total project budget; no package rule names it"}
  - {discipline: consultant.acoustic, kind: services, need: optional, built_in: "no", why: "Meeting-room and boardroom speech privacy, partition and ceiling ratings, services noise"}
  - {discipline: consultant.ict, kind: services, need: optional, aliases: [consultant.av, consultant.security], built_in: "no", why: "Tenant's ICT, AV and security design, often by the tenant's IT team or vendors"}
  - {discipline: trade.main_works, kind: works, need: always, built_in: "partial", source: "internal/procurement/proposed.go ProposeHeadContract", why: "Lump-sum fit-out contract (AS 4000 with fit-out amendments); proposed only from gaps on accepted work items"}

not_expected_procurement:
  - {discipline: consultant.architect, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "The interior designer is the design lead. A second design-lead appointment duplicates the scope; where the design firm is an architectural practice it is still one appointment"}

cost_plan:
  - {line: "CDC and occupation certificate lodgement fees", section: fees_and_charges, aliases: ["Construction certificate and certifier fees"], built_in: "partial", source: "knowledge/costs/starter_lines.yaml cc-fees", why: "The app's line is labelled for a construction certificate, which a CDC job does not have; it stands in for the Planning Portal and council registration fees"}
  - {line: "Development contributions payable on the CDC (s7.11 or s7.12, verified: false)", section: fees_and_charges, built_in: "no", why: "The certifier imposes the contributions the council plan levies on a CDC (verified: false); decided by the LGA's contributions plan, so the scenario must name the LGA. da-fees is dropped for cdc and nothing replaces it"}
  - {line: "Long service levy", section: fees_and_charges, built_in: "no", why: "0.25% of the cost of building work of $250,000 or more including GST, paid before work starts (C4, checked against nsw.gov.au); the type's $0.3M lower bound is above it, so the line is unconditional in the base (lower bound: PROJECT_TYPES.md)"}
  - {line: "Landlord's design review and approval fees", section: fees_and_charges, built_in: "no", why: "The landlord recovers its base-building engineers' review of the tenant's design under the agreement for lease"}
  - {line: "Landlord's building charges during the works", section: fees_and_charges, built_in: "no", why: "After-hours lift and loading dock use, security, base-building services shutdowns and fire-system isolation charges"}
  - {line: "Project manager", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Interior designer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[4]", why: "Fee line from the adopted package"}
  - {line: "Mechanical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Fee line from the adopted package"}
  - {line: "Electrical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Fee line from the adopted package"}
  - {line: "Fire services engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Fee line from the adopted package"}
  - {line: "Hydraulic engineer (optional)", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Fee line from the adopted package"}
  - {line: "BCA consultant", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Fee line from the adopted package"}
  - {line: "Certifier", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Professional fee for the CDC, inspections and OC; the app also adds P05, a double-count risk"}
  - {line: "Access consultant", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Fee line from the adopted package"}
  - {line: "Quantity surveyor", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Acoustic consultant (optional)", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "ICT, AV and security consultant (optional)", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Preliminaries, supervision and after-hours premiums", section: construction, built_in: "no", why: "No line; a stated budget spreads preliminaries pro rata (commercial_fitout split). After-hours noisy works and deliveries, and temporary protection of the goods lift, lobbies, corridors and loading dock, are real costs on an occupied tower"}
  - {line: "Tenancy signage", section: construction, aliases: ["Site works and external works"], built_in: "partial", source: "knowledge/costs/elements.yaml code 01", why: "site.signage lands in the 01 Site works and external works line, a misleading label inside a tower"}
  - {line: "Interiors and finishes", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 05", why: "Partitions, glazing, ceilings, doors, joinery, floors, painting, acoustics; refurb has no default scope, so the line appears only once interiors work items are read or added"}
  - {line: "Passive fire protection", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 06", why: "Fire stopping; once the penetrations item is in scope"}
  - {line: "Active fire protection", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 07", why: "Sprinkler, detection, EWIS and emergency lighting alterations; once those items are in scope"}
  - {line: "Mechanical services", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 08", why: "Re-zoning, ductwork, exhaust, BMS; once those items are in scope"}
  - {line: "Hydraulic services", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 09", why: "Kitchenette services; once those items are in scope"}
  - {line: "Electrical services", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 10", why: "Power, lighting, sub-board; once those items are in scope"}
  - {line: "Communications and security", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 11", why: "Data cabling, comms room, access control, AV infrastructure; once those items are in scope"}
  - {line: "Accessible paths, TGSIs and braille/tactile signage", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 13", why: "Child of the itemised access-egress group, once access-egress.accessible-access is in scope"}
  - {line: "Egress doors and hardware", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 13", why: "Child of the itemised access-egress group, once access-egress.egress-doors is in scope"}
  - {line: "Landlord's nominated contractor works (base-building fire services and BMS)", section: construction, built_in: "no", why: "Most A-grade landlords require their own contractors for work on the base-building fire and BMS systems; priced by quote, often outside the head contract"}
  - {line: "Provisional sums for above-ceiling conditions and base-building interfaces", section: construction, built_in: "no", why: "Unknown services above the ceiling, base-building defects found on opening up"}
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml design-contingency", why: "Always"}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml construction-contingency", why: "Always"}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml escalation", why: "Always"}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml exclusions", why: "Always"}
  - {line: "Owner supply: loose furniture", section: contingency, built_in: "partial", source: "internal/store/cost_budget.go applyBriefFigures", why: "Only when proj.owner_supply_stated is read; ParseOwnerSupply splits the phrasing on commas and 'and' into one line per item"}
  - {line: "Owner supply: workstations", section: contingency, built_in: "partial", source: "internal/store/cost_budget.go applyBriefFigures", why: "As above"}
  - {line: "Owner supply: AV equipment", section: contingency, built_in: "partial", source: "internal/store/cost_budget.go applyBriefFigures", why: "As above"}
  - {line: "Owner supply: IT active equipment", section: contingency, built_in: "partial", source: "internal/store/cost_budget.go applyBriefFigures", why: "As above"}

not_expected_cost_plan:
  - {line: "Architect (consultant fee)", app_label: "F02 Architect", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion on cost-plan prepare; the interior designer is the design lead"}
  - {line: "Service authority connection fees", app_label: "P06 Service authority connection fees", section: fees_and_charges, source: "knowledge/costs/starter_lines.yaml service-authority", why: "A fit-out takes its supply from the base building; there is no new water, sewer, power or carrier connection"}

program:
  skeleton: sk.refurb-traditional-cdc
  activities:
    - {label: "Review the agreement for lease and the landlord's fit-out guide", stage: investigation, fragment: null, after: [], built_in: "no", why: "Access date, rent-free fit-out period, landlord approvals, nominated contractors, building rules, make-good obligations"}
    - {label: "Obtain base-building information", stage: investigation, fragment: null, after: [], built_in: "no", why: "As-built drawings, services capacities, fire engineering report, fire safety schedule, asbestos register"}
    - {label: "Measure the existing building", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Measure the tenancy and check the base-building drawings"}
    - {label: "Check the landlord's hazardous materials register", stage: investigation, fragment: fr.existing-conditions, aliases: ["Hazardous-materials survey"], after: ["Obtain base-building information"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "The app adds a hazardous-materials survey on every refurb; a 2008 building needs only a register check (asbestos-in-tenancy adds the survey)"}
    - {label: "Trace existing services", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Above-ceiling services, risers, tenant points"}
    - {label: "Confirm base-building services capacity with the landlord's engineers", stage: investigation, fragment: null, after: ["Obtain base-building information", "Trace existing services"], built_in: "no", why: "AC capacity and hours, outside air, tenant power allocation, hydraulic points; knowledge has it only as an Implication (if.tenant-fitout-base-building-hvac)"}
    - {label: "Confirm the brief", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Review the agreement for lease and the landlord's fit-out guide"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Workplace brief: headcount, work points, meeting rooms, support spaces"}
    - {label: "Prepare the concept design", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Confirm the brief", "Measure the existing building"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Test fit and concept"}
    - {label: "Client review of the concept", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Prepare the concept design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Tenant approval"}
    - {label: "Landlord approval of the concept design", stage: concept_design, fragment: null, after: ["Client review of the concept"], built_in: "no", why: "Required under most agreements for lease before design development"}
    - {label: "Develop the design", stage: concept_design, fragment: fr.design-development-fitout, after: ["Landlord approval of the concept design", "Confirm base-building services capacity with the landlord's engineers"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.design-development-fitout", why: "Design development with services"}
    - {label: "Cost plan at design development", stage: concept_design, fragment: null, after: ["Develop the design"], built_in: "no", why: "QS estimate against the budget before documentation"}
    - {label: "Prepare fit-out documentation", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "Drawings, finishes schedules, specification"}
    - {label: "Coordinate consultant documentation", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "Mechanical, electrical, hydraulic and fire services design"}
    - {label: "BCA and access compliance reports", stage: construction_documentation, fragment: null, after: ["Prepare fit-out documentation", "Coordinate consultant documentation"], built_in: "no", why: "Support the CDC application"}
    - {label: "Landlord detailed design approval", stage: construction_documentation, fragment: null, after: ["Prepare fit-out documentation", "Coordinate consultant documentation"], built_in: "no", why: "Base-building engineers review services, loads, penetrations and fire alterations"}
    - {label: "Client sign-off for tender", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["BCA and access compliance reports", "Landlord detailed design approval", "Cost plan at design development"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "Sign-off"}
    - {label: "Prepare and lodge the complying development certificate", stage: approvals, fragment: fr.cdc-application, after: ["BCA and access compliance reports", "Landlord detailed design approval"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.cdc-application", why: "CDC under the Codes SEPP commercial alterations code (part verified: false); the landlord signs owner's consent only after its detailed design approval (verified: false)"}
    - {label: "Pay long service levy", stage: approvals, fragment: null, after: ["Client sign-off for tender"], built_in: "no", why: "0.25% of the cost of building work of $250,000 or more including GST, paid before work starts (C4, checked against nsw.gov.au); the type's $0.3M lower bound is above it, so the line is unconditional in the base. Kept before Certifier determination: the levy must be paid before the certificate issues (clause verified: false)"}
    - {label: "Certifier determination", stage: approvals, fragment: fr.cdc-application, after: ["Prepare and lodge the complying development certificate", "Pay long service levy"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.cdc-application", why: "CDC issued with the fire safety schedule"}
    - {label: "Assemble the tender package", stage: procurement, fragment: fr.tender-docs-fitout, after: ["Client sign-off for tender"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-docs-fitout", why: "Select tender to fit-out contractors on the landlord's approved list"}
    - {label: "Tender period", stage: procurement, fragment: fr.tender-period-fitout, after: ["Assemble the tender package"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-period-fitout", why: "Includes a site inspection of the floor"}
    - {label: "Evaluate tenders", stage: procurement, fragment: fr.tender-evaluation-fitout, after: ["Tender period"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-evaluation-fitout", why: "Price, program, after-hours allowances, nominated-contractor quotes"}
    - {label: "Award the contract", stage: procurement, fragment: fr.contract-award, after: ["Evaluate tenders"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.contract-award", why: "Lump-sum fit-out contract"}
    - {label: "Landlord approval of the contractor", stage: procurement, fragment: null, after: ["Award the contract"], built_in: "no", why: "Insurances, safe work method statements, inductions, building rules"}
    - {label: "Appoint principal certifier and give notice of commencement", stage: procurement, fragment: null, after: ["Certifier determination", "Award the contract"], built_in: "no", why: "Before any work (notice period verified: false)"}
    - {label: "Landlord grants access to the floor", stage: procurement, fragment: null, after: ["Landlord approval of the contractor"], built_in: "no", why: "Access date under the agreement for lease; starts the fit-out period"}
    - {label: "Commencement inspection by the principal certifier", stage: construction, fragment: null, after: ["Appoint principal certifier and give notice of commencement"], built_in: "no", why: "Class 5-9 list: commencement and final (verified: false; owner to confirm, as R7 did for Class 1 and 10)"}
    - {label: "Condition survey of the tenancy and access route", stage: construction, fragment: null, after: ["Landlord grants access to the floor"], built_in: "no", why: "Tenancy, lift lobby, goods lift and loading dock recorded before work so damage claims can be settled"}
    - {label: "Establish the site", stage: construction, fragment: fr.site-establishment-fitout, after: ["Appoint principal certifier and give notice of commencement", "Commencement inspection by the principal certifier", "Condition survey of the tenancy and access route"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.site-establishment-fitout", why: "Site start"}
    - {label: "Install hoardings and protection to occupied areas", stage: construction, fragment: fr.occupied-protection, after: ["Establish the site"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.occupied-protection", why: "The fragment exists but needs a site.impact-protection item (vehicle and forklift impact protection), which a correct fit-out scope does not have"}
    - {label: "Book services shutdowns, fire-system isolations and hot-works permits", stage: construction, fragment: null, after: ["Establish the site"], built_in: "no", why: "Through the landlord's facilities manager; isolations notified to the fire alarm monitoring provider"}
    - {label: "Alter ductwork and pipework", stage: construction, fragment: fr.mechanical-fitout, after: ["Install hoardings and protection to occupied areas", "Book services shutdowns, fire-system isolations and hot-works permits"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.mechanical-fitout", why: "Fires once mechanical.air-conditioning is in scope (refurb has no default scope)"}
    - {label: "Alter exhaust ventilation", stage: construction, fragment: fr.ventilation-fitout, after: ["Install hoardings and protection to occupied areas"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.ventilation-fitout", why: "Fires once mechanical.ventilation is in scope"}
    - {label: "Alter sprinkler pipework above the ceiling", stage: construction, fragment: null, after: ["Book services shutdowns, fire-system isolations and hot-works permits"], built_in: "no", why: "The library has no concealed-pipework row; fr.sprinklers-fitout is one row after the ceilings"}
    - {label: "Sprinkler pressure test before ceilings close", stage: construction, fragment: null, after: ["Alter sprinkler pipework above the ceiling"], built_in: "partial", source: "knowledge/clusters/fire/interfaces.yaml if.sprinkler-pressure-test-before-ceilings", why: "The hold point row is made but its link to the ceilings is dropped. Run 30 Oct 2026, note link_skipped: 'Link from Hold point: a recorded pressure test of the sprinkler pipework to interiors.ceilings left out: it would make a loop'"}
    - {label: "Electrical rough-in", stage: construction, fragment: fr.electrical-fitout, aliases: ["Rough-in"], after: ["Install hoardings and protection to occupied areas"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.electrical-fitout", why: "Fires once electrical.cabling-wiring is in scope"}
    - {label: "Kitchenette sanitary and water rough-in", stage: construction, fragment: fr.hydraulic-sanitary-fitout, aliases: ["Rough-in"], after: ["Install hoardings and protection to occupied areas"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.hydraulic-sanitary-fitout", why: "Also fr.hydraulic-cold-fitout and fr.hydraulic-hot-fitout; once those items are in scope"}
    - {label: "Frame and line partitions", stage: construction, fragment: fr.partitions-fitout, after: ["Install hoardings and protection to occupied areas"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.partitions-fitout", why: "One-activity fragment, so the app labels it with the work item's title"}
    - {label: "Install structured cabling", stage: construction, fragment: fr.comms-fitout, after: ["Frame and line partitions"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.comms-fitout", why: "Once comms-security.structured-cabling is in scope"}
    - {label: "Seal service penetrations", stage: construction, fragment: fr.fire-stopping, after: ["Electrical rough-in", "Install structured cabling", "Alter ductwork and pipework", "Kitchenette sanitary and water rough-in", "Alter sprinkler pipework above the ceiling", "Alter exhaust ventilation"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.fire-stopping", why: "Once fire-passive.penetrations is in scope"}
    - {label: "Fire-stopping inspection before concealment", stage: construction, fragment: null, after: ["Seal service penetrations"], built_in: "partial", source: "knowledge/clusters/fire/interfaces.yaml if.fire-stopping-before-concealment", why: "Run 30 Oct 2026. The app seals at construction start and holds every interiors row behind the inspection, including partitions and off-site joinery. Correct: the inspection holds only the ceilings and bulkheads that conceal the penetrations"}
    - {label: "Install ceilings", stage: construction, fragment: fr.ceilings-fitout, after: ["Sprinkler pressure test before ceilings close", "Fire-stopping inspection before concealment", "Alter ductwork and pipework", "Frame and line partitions", "Electrical rough-in", "Kitchenette sanitary and water rough-in", "Alter exhaust ventilation"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.ceilings-fitout", why: "Re-lay the base-building grid and new ceilings"}
    - {label: "Alter and test sprinklers", stage: construction, fragment: fr.sprinklers-fitout, after: ["Install ceilings"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.sprinklers-fitout", why: "Fit off heads in the new ceiling and restore the system; the app's single row is in the right place for fit-off"}
    - {label: "Alter detection and warning", stage: construction, fragment: fr.detection-fitout, after: ["Install ceilings"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.detection-fitout", why: "Detectors and EWIS speakers in the new rooms; fire-active.occupant-warning itself has no fragment"}
    - {label: "Install emergency lighting and exit signs", stage: construction, fragment: null, after: ["Install ceilings"], built_in: "no", why: "fire-active.emergency-lighting has no fragment"}
    - {label: "Install luminaires", stage: construction, fragment: fr.lighting-fitout, after: ["Install ceilings"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.lighting-fitout", why: "Once electrical.lighting is in scope"}
    - {label: "Hang doors", stage: construction, fragment: fr.internal-doors-fitout, after: ["Frame and line partitions"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.internal-doors-fitout", why: "Once interiors.internal-doors is in scope"}
    - {label: "Install glazed partitions and manifestation", stage: construction, fragment: null, after: ["Install ceilings"], built_in: "no", why: "interiors.internal-glazing has no fragment; long lead"}
    - {label: "Procure and deliver joinery", stage: construction, fragment: fr.joinery-fitout, aliases: ["Procure and deliver"], after: ["Award the contract"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.joinery-fitout", why: "Long lead; shop drawings after award"}
    - {label: "Install joinery", stage: construction, fragment: fr.joinery-fitout, aliases: ["Install"], after: ["Procure and deliver joinery", "Frame and line partitions"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.joinery-fitout", why: "Reception, kitchenette, storage"}
    - {label: "Paint the fit-out", stage: construction, fragment: fr.painting-fitout, after: ["Install joinery", "Install ceilings"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.painting-fitout", why: "Once interiors.painting is in scope"}
    - {label: "Lay floor finishes", stage: construction, fragment: fr.floors-fitout, after: ["Paint the fit-out"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.floors-fitout", why: "Carpet tiles and vinyl"}
    - {label: "Fit off electrical and hydraulic services", stage: construction, fragment: fr.electrical-fitout, aliases: ["Fit off"], after: ["Install joinery", "Install luminaires"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.electrical-fitout", why: "Also the fit-off rows of fr.hydraulic-sanitary-fitout"}
    - {label: "BMS works by the landlord's nominated contractor", stage: construction, fragment: null, after: ["Alter ductwork and pipework"], built_in: "no", why: "mechanical.controls-bms has no fragment"}
    - {label: "Install access control and integrate with base-building security", stage: construction, fragment: null, after: ["Hang doors"], built_in: "no", why: "comms-security.access-control has no fragment"}
    - {label: "Commission the altered system", stage: construction, fragment: fr.mechanical-fitout, after: ["BMS works by the landlord's nominated contractor", "Install ceilings"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.mechanical-fitout", why: "Air balancing and BMS checks"}
    - {label: "Fire services commissioning and integrated test with the base-building panel and EWIS", stage: construction, fragment: null, after: ["Alter detection and warning", "Install emergency lighting and exit signs", "Commission the altered system", "Alter and test sprinklers"], built_in: "no", why: "Witnessed by the fire services engineer; needed for the final fire safety certificate"}
    - {label: "Install signage", stage: construction, fragment: null, after: ["Paint the fit-out"], built_in: "no", why: "site.signage has no fragment"}
    - {label: "Install furniture, workstations and AV (tenant suppliers)", stage: construction, fragment: null, after: ["Lay floor finishes"], built_in: "no", why: "Tenant-direct packages coordinated into the builder's program; long lead"}
    - {label: "Install IT active equipment and cut over", stage: construction, fragment: null, after: ["Install structured cabling", "Install furniture, workstations and AV (tenant suppliers)"], built_in: "no", why: "Tenant's IT; carrier service to the comms room"}
    - {label: "Practical completion inspection", stage: completion, fragment: fr.practical-completion, after: ["Lay floor finishes", "Fit off electrical and hydraulic services", "Fire services commissioning and integrated test with the base-building panel and EWIS", "Install signage", "Install glazed partitions and manifestation", "Install access control and integrate with base-building security"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.practical-completion", why: "PC"}
    - {label: "Final fire safety certificate", stage: completion, fragment: null, after: ["Fire services commissioning and integrated test with the base-building panel and EWIS"], built_in: "no", why: "For the fire safety measures the fit-out altered, before the OC (Regulation clause verified: false)"}
    - {label: "Final inspection by the principal certifier", stage: completion, fragment: null, after: ["Practical completion inspection", "Final fire safety certificate"], built_in: "no", why: "Mandatory final inspection before the OC (clause verified: false)"}
    - {label: "Occupation certificate", stage: completion, fragment: fr.occupation-certificate, after: ["Final inspection by the principal certifier"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.occupation-certificate", why: "Needed before the tenant occupies the altered floor"}
    - {label: "Landlord's completion inspection and handover of as-builts and manuals", stage: completion, fragment: null, after: ["Practical completion inspection"], built_in: "no", why: "Base-building as-builts, O&M manuals, certificates and BMS records go to the landlord"}
    - {label: "Handover", stage: completion, fragment: fr.handover, after: ["Occupation certificate", "Landlord's completion inspection and handover of as-builts and manuals"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.handover", why: "Keys, warranties, manuals"}
    - {label: "Tenant move-in", stage: completion, fragment: null, after: ["Handover", "Install IT active equipment and cut over"], built_in: "no", why: "Relocation, often over a weekend; lease rent start follows"}
    - {label: "Defects inspection", stage: defects, fragment: fr.defects-inspection, after: ["Handover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-inspection", why: "Defects"}
    - {label: "Defects liability period", stage: defects, fragment: fr.defects-liability-end, after: ["Defects inspection"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "Contract defects liability period (length verified: false)"}
    - {label: "Final defects inspection", stage: defects, fragment: fr.defects-liability-end, after: ["Defects liability period"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "End of defects liability"}

# RFP expectations use the data/eval/rfp/answer-keys keys exactly. They state the CORRECT answer for this fit-out.
# app_differs is structured: {key: stage.<k> | position.<k> | element.<k> | text.<k>, app, expect, why}.
rfps:
  - discipline: consultant.interior_design
    template: null
    built_in: "no"
    why: "No interior-design template; the app drafts the generic tpl.rfp-capex report"
    must_include: ["Workplace brief and test fit", "Concept design and client review", "Landlord concept and detailed design approval submissions", "Design development with finishes and FF&E selections", "Fit-out documentation and specification for tender", "CDC drawings coordinated with the BCA consultant and certifier", "Tender documentation and tender evaluation input", "Construction-phase design support, shop drawing review and defects inspection"]
    must_not_include: ["Base-building design", "Facade or external works", "Services engineering design", "DA and statement of environmental effects", "Structural design"]
  - discipline: consultant.project_manager
    template: null
    built_in: "no"
    must_include: ["Project brief, budget and program", "Consultant procurement and appointments", "Landlord liaison and approvals under the agreement for lease", "Contractor tender and contract administration as superintendent", "Cost reporting with the QS", "Coordination of tenant-direct suppliers: furniture, IT, AV, security, relocation", "Completion, OC and handover to the landlord"]
    must_not_include: ["Design", "Statutory certification"]
  - discipline: consultant.mechanical
    template: mechanical-services
    built_in: "partial"
    source: "knowledge/rfp/mechanical-services.yaml"
    aliases: [consultant.services]
    must_include:
      - {text: "Investigation of base-building AC capacity, zoning, outside air and operating hours", key: position.existing}
      - {text: "Detailed HVAC design for the new layout: zones, terminals, diffusers", key: position.hvac}
      - {text: "BMS points and sequences for new zones with the landlord's BMS contractor", key: position.controls}
      - {text: "Kitchenette and print-room exhaust", key: position.local}
      - {text: "Tender documentation", key: stage.tender}
      - {text: "Construction-phase inspections", key: stage.construction}
      - {text: "Witness commissioning and air balancing", key: stage.handover}
      - "Landlord's base-building engineer review"
    must_not_include:
      - {text: "Commercial kitchen exhaust", key: position.kitchen}
      - {text: "Smoke control design", key: position.smoke}
      - {text: "Planning stage", key: stage.planning}
      - {text: "Seasonal commissioning", key: stage.seasonal}
      - "Central plant replacement"
    expect:
      stages_include: [inception, investigation, concept, design, tender, construction, handover]
      stages_option: []
      stages_absent: [planning, continuation, seasonal, advisory]
      positions: {hvac: I, local: I, kitchen: absent, smoke: absent, controls: I, energy: X, acoustic: X, interfaces: I, existing: I, staging: O, specialist: X, declarations: absent, construction: I, witness: I, execution: O, continuation: absent, seasonal: absent, remediation: absent}
      blocking: []
      sources: ["Construction and witness included: the landlord and certifier need the tenant's engineer to inspect and certify the installation"]
    app_differs:
      - {key: stage.investigation, app: ask, expect: include, why: "client flag mech_investigation cannot be keyed"}
      - {key: stage.planning, app: ask, expect: absent, why: "client flag mech_planning cannot be keyed"}
      - {key: stage.tender, app: option, expect: include, why: "default boundary ends at design, so resolveStages prices tender as an option"}
      - {key: stage.construction, app: option, expect: include, why: "default option, after the boundary"}
      - {key: stage.handover, app: option, expect: include, why: "default option, after the boundary"}
      - {key: stage.continuation, app: option, expect: absent, why: "after the boundary"}
      - {key: stage.seasonal, app: option, expect: absent, why: "after the boundary; seasonal commissioning belongs to the base-building plant"}
      - {key: stage.advisory, app: option, expect: absent, why: "after the boundary"}
      - {key: position.local, app: ask, expect: I, why: "client flag mech_local"}
      - {key: position.kitchen, app: ask, expect: absent, why: "client flag mech_kitchen; a kitchenette is not a kitchen"}
      - {key: position.smoke, app: ask, expect: absent, why: "client flag mech_smoke"}
      - {key: position.controls, app: ask, expect: I, why: "client flag mech_controls"}
      - {key: position.interfaces, app: ask, expect: I, why: "client flag mech_interfaces"}
      - {key: position.existing, app: absent, expect: I, why: "row needs the investigation stage included or optioned; it is ask (client flag mech_investigation), so the row is left out"}
      - {key: position.declarations, app: ask, expect: absent, why: "client flag mech_declarations; no NSW design declarations for Class 5 (owner ruling R3)"}
      - {key: position.construction, app: O, expect: I, why: "follows the construction stage"}
      - {key: position.witness, app: O, expect: I, why: "follows the handover stage"}
      - {key: position.continuation, app: O, expect: absent, why: "follows the continuation stage, an option after the boundary"}
      - {key: position.seasonal, app: O, expect: absent, why: "follows the seasonal stage, an option after the boundary"}
      - {key: position.remediation, app: O, expect: absent, why: "always O"}
  - discipline: consultant.electrical
    template: electrical-services
    built_in: "partial"
    source: "knowledge/rfp/electrical-services.yaml"
    aliases: [consultant.services]
    must_include:
      - {text: "Investigation of the tenant distribution board capacity and existing circuits", key: position.existing}
      - {text: "Power distribution to workstations and joinery", key: position.distribution}
      - {text: "Lighting layout, controls, emergency and exit lighting", key: position.lighting}
      - {text: "Passive ICT cabling and pathways", key: position.ict}
      - {text: "Tender documentation", key: stage.tender}
      - {text: "Construction-phase inspections", key: stage.construction}
      - {text: "Witness testing and handover", key: stage.handover}
      - "Section J lighting and power compliance (Part number verified: false)"
    must_not_include:
      - {text: "Utility demand application", key: position.utility}
      - {text: "Standby generation, UPS, PV or EV", key: position.generation}
      - {text: "Fire detection design (allocated to fire services)", key: position.dry_fire}
      - {text: "Planning stage", key: stage.planning}
    expect:
      stages_include: [inception, investigation, concept, design, tender, construction, handover]
      stages_option: [defects]
      stages_absent: [planning, continuation, advisory]
      positions: {distribution: I, utility: absent, asp3: X, lighting: I, feature: O, controls: I, generation: absent, ict: I, dry_fire: absent, plant: absent, existing: I, staging: I, specialist: X, construction: I, handover: I, declarations: absent, studies: absent, continuation: absent}
      blocking: []
      sources: ["Construction and witness included: the landlord and certifier need the tenant's engineer to inspect and certify the installation"]
    app_differs:
      - {key: stage.investigation, app: ask, expect: include, why: "client flag elec_investigation"}
      - {key: stage.planning, app: option, expect: absent, why: "client flag elec_planning, if_unknown option"}
      - {key: stage.tender, app: option, expect: include, why: "default boundary ends at design"}
      - {key: stage.construction, app: option, expect: include, why: "default option"}
      - {key: stage.handover, app: option, expect: include, why: "default option"}
      - {key: stage.continuation, app: option, expect: absent, why: "after the boundary"}
      - {key: position.utility, app: I, expect: absent, why: "included whenever concept is; a tenancy has no new supply"}
      - {key: position.controls, app: ask, expect: I, why: "client flag elec_controls"}
      - {key: position.generation, app: O, expect: absent, why: "client flag elec_generation, if_unknown option"}
      - {key: position.ict, app: O, expect: I, why: "client flag elec_ict, if_unknown option"}
      - {key: position.dry_fire, app: ask, expect: absent, why: "client flag elec_dry_fire; allocated to the fire services engineer"}
      - {key: position.plant, app: I, expect: absent, why: "included whenever design is; no new plant in the base fit-out"}
      - {key: position.existing, app: absent, expect: I, why: "row needs the investigation stage included or optioned; it is ask (client flag elec_investigation), so the row is left out"}
      - {key: position.staging, app: ask, expect: I, why: "client flag elec_staging; tenancy metering and energisation"}
      - {key: position.construction, app: O, expect: I, why: "follows the stage"}
      - {key: position.handover, app: O, expect: I, why: "follows the stage"}
      - {key: position.declarations, app: ask, expect: absent, why: "client flag elec_declarations"}
      - {key: position.studies, app: O, expect: absent, why: "always O"}
      - {key: position.continuation, app: O, expect: absent, why: "follows the continuation stage, an option after the boundary"}
  - discipline: consultant.fire_services
    template: fire-services
    built_in: "partial"
    source: "knowledge/rfp/fire-services.yaml"
    aliases: [consultant.services]
    must_include:
      - {text: "Review of the existing sprinkler, detection and EWIS layout and the base-building fire engineering report", key: position.existing}
      - {text: "Sprinkler head relocation and additions for the new rooms", key: position.wet}
      - {text: "Detection and EWIS additions", key: position.dry}
      - {text: "Cause-and-effect update with the base-building fire panel", key: position.controls}
      - {text: "Isolation and restoration of base-building systems while other floors stay occupied", key: position.staging}
      - {text: "Tender documentation", key: stage.tender}
      - {text: "Construction-phase inspections", key: stage.construction}
      - {text: "Witness commissioning and the integrated test", key: stage.handover}
    must_not_include:
      - {text: "Fire-water supply, pumps and tanks", key: position.supply}
      - {text: "Authority enquiry and connection", key: position.authority}
      - {text: "Fire strategy and performance solutions", key: position.strategy}
      - {text: "Existing system upgrade", key: position.upgrade}
    expect:
      stages_include: [inception, investigation, concept, design, tender, construction, handover]
      stages_option: []
      stages_absent: [continuation, advisory]
      positions: {wet: I, supply: absent, authority: absent, dry: I, controls: I, plant: absent, existing: I, upgrade: absent, staging: I, remediation: absent, hazards: X, strategy: X, declarations: absent, construction: I, witness: I, execution: O}
      blocking: []
      sources: ["Construction and witness included: the landlord and certifier need the tenant's engineer to inspect and certify the installation, including the integrated test"]
    app_differs:
      - {key: stage.investigation, app: ask, expect: include, why: "client flag fs_investigation"}
      - {key: stage.tender, app: option, expect: include, why: "default boundary ends at design"}
      - {key: stage.construction, app: option, expect: include, why: "default option"}
      - {key: stage.handover, app: option, expect: include, why: "default option"}
      - {key: stage.continuation, app: option, expect: absent, why: "after the boundary"}
      - {key: stage.advisory, app: option, expect: absent, why: "after the boundary"}
      - {key: position.wet, app: ask, expect: I, why: "client flag fs_wet"}
      - {key: position.supply, app: ask, expect: absent, why: "client flag fs_supply"}
      - {key: position.authority, app: ask, expect: absent, why: "client flag fs_authority"}
      - {key: position.dry, app: ask, expect: I, why: "client flag fs_dry"}
      - {key: position.controls, app: ask, expect: I, why: "client flag fs_controls"}
      - {key: position.plant, app: ask, expect: absent, why: "client flag fs_plant_interfaces"}
      - {key: position.existing, app: absent, expect: I, why: "row needs the investigation stage included or optioned; it is ask (client flag fs_investigation), so the row is left out"}
      - {key: position.upgrade, app: ask, expect: absent, why: "client flag fs_upgrade"}
      - {key: position.staging, app: O, expect: I, why: "always O; the building stays occupied"}
      - {key: position.remediation, app: O, expect: absent, why: "always O"}
      - {key: position.declarations, app: ask, expect: absent, why: "client flag fs_declarations"}
      - {key: position.construction, app: O, expect: I, why: "follows the stage"}
      - {key: position.witness, app: O, expect: I, why: "follows the stage"}
  - discipline: consultant.hydraulic
    template: hydraulic-services
    built_in: "partial"
    source: "knowledge/rfp/hydraulic-services.yaml"
    aliases: [consultant.services]
    must_include:
      - {text: "Kitchenette cold, hot, boiling and chilled water", key: position.domestic}
      - {text: "Sanitary connection to the base-building waste point", key: position.sanitary}
      - {text: "Investigation of base-building hydraulic risers and tenant points", key: position.existing}
    must_not_include:
      - {text: "Roof drainage", key: position.roof}
