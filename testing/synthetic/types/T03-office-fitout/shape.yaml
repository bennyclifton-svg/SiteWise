    why: "The certifier determines the CDC in place of a CC, then acts as principal certifier (F9 fixed: stage b2_cdc). Re-keyed after run 20261107-t03-t04-t06 as the T12 certifier was on 6 November. Partial: the A and B boundary turns on client flags the harness cannot set"
