triggers:
  - id: da-pathway
    label: Development application instead of a CDC
    evidence: ["A development application will be lodged with council for the fit-out", "the proposal changes the use of part of the floor, so complying development is not available", "the works do not meet the complying development standards; a DA is required"]
    negation: ["The fit-out is complying development; the certifier will issue a CDC", "No development consent is required beyond the CDC"]
    profile: [hdr.cond.planning]
    skeleton: sk.refurb-traditional-da
    adds:
      procurement: [consultant.town_planner]
      cost_plan: ["DA fees and contributions", "Town planner"]
      program: ["Lodge the application", "Public exhibition", "Assessment", "Construction certificate"]
      rfps:
        - {discipline: consultant.town_planner, must_include: ["Statement of environmental effects", "Lodgement", "Responses to council requests"]}
        - discipline: consultant.certifier
          must_include: [{text: "Package B: CC assessment", key: stage.b2_construction_approval}, "Principal certifier services", "Occupation certificate"]
          expect:
            stages_include: [a2_planning, b2_construction_approval]
            stages_absent: [b2_cdc]
        - discipline: consultant.bca
          must_include: ["Assessment of the existing building's fire safety against any upgrade the consent requires", {text: "BCA report supporting the DA", key: stage.a2_planning}]
          expect:
            stages_include: [a2_planning]
            stages_absent: [b2_construction_approval, b2_cdc]
          app_differs:
            - {key: stage.b2_construction_approval, app: option, expect: absent, why: "after the boundary on a DA; the CC is the certifier's, as the base keys b1, b3 and b4"}
      authority: ["DA consent from council; construction certificate from the certifier", "Council may require a fire safety upgrade of the existing building (verified: false)"]
    removes:
      cost_plan: ["Development contributions payable on the CDC (s7.11 or s7.12, verified: false)"]
      program: ["Prepare and lodge the complying development certificate", "Certifier determination"]
      rfps:
        - {discipline: consultant.certifier, must_include: ["CDC eligibility check against the Codes SEPP commercial alterations code and the planning certificate (verified: false)", "CDC assessment and determination with the fire safety schedule"], must_not_include: ["Construction certificate (there is none under a CDC)"]}
        - {discipline: consultant.bca, must_include: ["BCA compliance report supporting the CDC application"]}
    why: "Skeleton becomes sk.refurb-traditional-da. The certifier's B2 becomes the CC (b2_construction_approval) in place of the CDC (b2_cdc), and a2_planning comes in for the certifier and the BCA consultant. Contributions move into the DA fees line"
    built_in: {procurement: "yes", cost_plan: "yes", program: "yes", rfps: "partial"}
    source: "knowledge/program/fragments.yaml fr.da-lodgement"
  - id: heritage-item
    label: Building is a heritage item
    evidence: ["The building is listed as a local heritage item in the LEP", "heritage-listed sandstone office building; the original lift lobby and pressed-metal ceilings are significant fabric", "council's heritage officer must review the fit-out"]
    negation: ["The building is not a heritage item and is not in a heritage conservation area", "the heritage item next door is not affected"]
    profile: [det.heritage_status, hdr.cond.planning]
    adds:
      procurement: [consultant.heritage, consultant.town_planner]
      cost_plan: ["Heritage consultant", "DA fees and contributions"]
      program: ["Heritage impact statement", "Heritage referral", "Lodge the application"]
      rfps: [{discipline: consultant.town_planner, must_include: ["Heritage controls and the heritage impact statement in the SEE"]}]
      authority: ["DA with heritage referral; complying development is generally not available on a heritage item (verified: false)"]
    removes:
      cost_plan: ["Development contributions payable on the CDC (s7.11 or s7.12, verified: false)"]
      program: ["Prepare and lodge the complying development certificate", "Certifier determination"]
    built_in: {procurement: "yes", cost_plan: "yes", program: "partial", rfps: "partial"}
    source: "knowledge/works/package_defaults.yaml complexity_additions[1]"
  - id: design-and-construct
    label: Design and construct fit-out contractor
    evidence: ["Design and construct fit-out contract on the interior designer's concept", "the fit-out contractor's engineers will design the mechanical, electrical, hydraulic and fire services", "D&C tender on a performance brief"]
    negation: ["Traditional lump-sum tender on fully documented design", "the services engineers will document their design fully for tender"]
    profile: [hdr.cond.procurement_route]
    adds:
      program: ["Prepare the design-intent documents and performance brief", "Contractor's design development and landlord approval", "Review the contractor's design"]
      rfps: [{discipline: consultant.interior_design, must_include: ["Design-intent documents and performance brief for the D&C tender", "Review of the contractor's design"]}]
    removes:
      procurement: [consultant.mechanical, consultant.electrical, consultant.fire_services, consultant.hydraulic]
      cost_plan: ["Mechanical engineer", "Electrical engineer", "Fire services engineer", "Hydraulic engineer (optional)"]
      rfps: [consultant.mechanical, consultant.electrical, consultant.fire_services, consultant.hydraulic]
    why: "The tenant keeps the interior designer as its design reviewer, not novated. C1 does not apply: no tenant engineer is appointed to be novated; whether a tenant keeps a services reviewer on a D&C fit-out is an owner question. The app keeps every consultant with novation option, adds fr.novation, and falls back to sk.generic (refurb plus D&C has no skeleton)"
    built_in: {procurement: "no", program: "no", rfps: "no", cost_plan: "no"}
  - id: staged-occupied-tenancy
    label: Tenant stays in occupation and the works are staged
    evidence: ["Staff remain in occupation of the floor; the works are staged in three zones", "decant into swing space on Level 11 for stage 2", "works inside occupied areas after hours only"]
    negation: ["The floor is vacant for the whole fit-out period", "the tenant takes possession of the vacant floor"]
    profile: [hdr.cond.operational_constraints, flag.staged]
    adds:
      cost_plan: ["Staging, decanting and temporary works", "After-hours works premium"]
      program: ["Stage 1 works", "Decant staff for stage 2", "Stage 2 works", "Interim occupation certificate for each stage"]
      rfps: [{discipline: consultant.access, must_include: ["Occupied and staged route continuity"]}, {discipline: consultant.bca, must_include: ["Staged occupation boundaries"]}, {discipline: consultant.quantity_surveyor, must_include: ["Decanting and staging costs"]}]
      authority: ["Interim OC for each stage before staff reoccupy it"]
    built_in: {rfps: "partial", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/access.yaml occupied"
  - id: asbestos-in-tenancy
    label: Asbestos in the tenancy of a pre-2004 building
    evidence: ["The landlord's asbestos register records bonded vinyl floor tiles under the carpet", "asbestos-containing material in the ceiling space around the core", "the refurbishment survey found asbestos mastic under the floor tiles in the north-east corner"]
    negation: ["The building was completed in 2008 and no asbestos register is required", "the asbestos register records no asbestos within the tenancy"]
    profile: [det.existing_building_year]
    adds:
      procurement: [consultant.hazmat]
      work_items: [{system: site.demolition, action: remove}]
      cost_plan: ["Hazardous materials survey", "Licensed asbestos removal and clearance"]
      program: ["Hazardous-materials survey", "Notify SafeWork NSW of licensed removal", "Licensed asbestos removal", "Asbestos clearance certificate"]
      rfps: [{discipline: consultant.hazmat, must_include: ["Refurbishment survey of the affected areas with sampling", "Removal scope", "Clearance inspection and certificate"]}]
      authority: ["SafeWork NSW notification of licensed asbestos removal (notice period verified: false)"]
    built_in: {procurement: "no", work_items: "no", program: "partial", cost_plan: "no", rfps: "no"}
    source: "knowledge/program/fragments.yaml fr.existing-conditions"
  - id: existing-fitout-strip-out
    label: Previous tenant's fit-out to strip out
    evidence: ["The previous tenant's fit-out will be stripped out back to base building", "remove the existing partitions, ceilings, kitchen and carpet", "the landlord has agreed the incoming tenant demolishes the existing offices"]
    negation: ["The floor is handed over in base-building condition", "the outgoing tenant has completed make-good"]
    profile: []
    adds:
      work_items: [{system: site.demolition, action: remove}]
      cost_plan: ["Strip-out of the existing fit-out and disposal"]
      program: ["Isolate services and protect adjacent areas", "Soft-strip partitions, ceilings and services", "Make good retained structure and services"]
      rfps: [{discipline: consultant.interior_design, must_include: ["Demolition plan"]}, {discipline: consultant.quantity_surveyor, must_include: ["Strip-out and make-good costs"]}]
    why: "implied_by strip-out adds site.demolition with the refurb default action alter, so fr.strip-out-fitout (action remove) stays false unless a document gives the action"
    built_in: {work_items: "partial", program: "partial", cost_plan: "partial", rfps: "partial"}
    source: "knowledge/program/fragments.yaml fr.strip-out-fitout"
  - id: internal-stair
    label: New internal stair between tenancy floors
    evidence: ["A new internal stair will connect Levels 11 and 12", "slab penetration for the communicating stair", "a void through the floor for the feature stair"]
    negation: ["The tenancy is on one floor", "No inter-floor stair; staff use the base-building lifts and fire stairs"]
    profile: []
    adds:
      procurement: [consultant.structural, consultant.fire_engineer]
      work_items: [{system: structure.alterations, action: alter}, {system: access-egress.stairs-and-ramps, action: new}, {system: access-egress.barriers, action: new}, {system: fire-passive.compartments, action: alter}]
      cost_plan: ["Structural engineer", "Fire engineer", "Slab penetration, trimming steel and propping", "Stairs, ramps, handrails and nosings", "Compliant balustrades and barriers"]
      program: ["Structural assessment of the slab", "Fire engineering performance solution", "Alter and protect retained structure", "Install stair and balustrades"]
      rfps: [{discipline: consultant.structural, must_include: ["Slab penetration and trimming design", "Temporary propping"]}, {discipline: consultant.fire_engineer, must_include: ["Performance solution for the stair connecting two storeys"]}]
      authority: ["Landlord's structural approval; the CDC standards may not cover a new slab penetration, so check the pathway (verified: false)"]
    built_in: {procurement: "no", work_items: "partial", program: "partial", cost_plan: "partial", rfps: "partial"}
    source: "knowledge/program/fragments.yaml fr.structure-alterations"
  - id: slab-core-drilling
    label: New core holes through the post-tensioned slab
    evidence: ["new floor boxes cored through the post-tensioned slab", "core holes for the kitchenette waste through the slab", "scan the slab before coring"]
    negation: ["Power is from power poles; no new slab penetrations", "the existing floor boxes are reused"]
    profile: []
    adds:
      procurement: [consultant.structural]
      cost_plan: ["Structural engineer", "Slab scanning and core drilling"]
      program: ["Scan the slab and obtain the landlord's structural approval for core holes"]
      rfps: [{discipline: consultant.structural, must_include: ["Core-hole locations against post-tensioning tendons and the landlord's structural approval"]}]
      authority: ["Landlord's structural approval for each slab penetration"]
    why: "The scan and approval come before the services rough-in rows. No rule suggests a structural engineer on refurb"
    built_in: {procurement: "no", program: "no", cost_plan: "partial", rfps: "partial"}
    source: "knowledge/rfp/structural.yaml"
  - id: heavy-floor-loads
    label: Floor loads above the base-building allowance
    evidence: ["mobile compactus units in the records room", "high-density storage loads of 5 kPa", "the server racks and UPS batteries exceed the floor design load"]
    negation: ["No high-density storage; records are digital", "all loads are within the base-building office allowance"]
    profile: []
    adds:
      procurement: [consultant.structural]
      work_items: [{system: structure.design-basis, action: investigate}]
      cost_plan: ["Structural engineer", "Floor strengthening or load spreading"]
      program: ["Structural floor-load assessment and landlord approval"]
      rfps: [{discipline: consultant.structural, must_include: ["Floor load assessment against the base-building design loads"]}]
    built_in: {procurement: "no", work_items: "no", program: "partial", cost_plan: "partial", rfps: "partial"}
    source: "knowledge/rfp/structural.yaml"
  - id: fire-engineered-solution
    label: Performance solution needed for the layout
    evidence: ["Travel distance to the nearest exit exceeds the deemed-to-satisfy limit; a fire engineered performance solution is proposed", "the base-building fire engineering report must be updated for the new layout", "the BCA report identifies two performance solutions"]
    negation: ["The layout complies with the deemed-to-satisfy provisions; no performance solutions", "the BCA report identifies no performance solutions"]
    profile: []
    adds:
      procurement: [consultant.fire_engineer]
      cost_plan: ["Fire engineer"]
      program: ["Fire engineering brief", "Fire engineering report", "Fire and Rescue NSW consultation"]
      rfps: [{discipline: consultant.fire_engineer, must_include: ["Brief for scheduled solutions", "FER for scheduled solutions", "Reconcile with the base-building fire engineering report"]}, {discipline: consultant.bca, must_include: ["Performance-solution assessment"]}]
      authority: ["The certifier consults FRNSW where the Regulation requires it for a fire safety performance solution (verified: false)"]
    built_in: {procurement: "no", cost_plan: "no", program: "no", rfps: "partial"}
    source: "knowledge/rfp/fire-engineering.yaml"
  - id: comms-room-cooling
    label: Comms room with 24/7 supplementary cooling and UPS
    evidence: ["A dedicated comms room with two racks and 24/7 split-system cooling", "connect the supplementary units to the base-building tenant condenser water loop", "UPS for the comms room"]
    negation: ["IT is cloud-hosted; a small comms cupboard only", "no supplementary cooling is needed"]
    profile: []
    adds:
      work_items: [{system: mechanical.refrigerant-condensate, action: new}, {system: electrical.standby-power, action: new}]
