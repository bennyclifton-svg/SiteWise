  - id: overlay-over-ac
    label: New metal roof laid over the bonded AC sheeting instead of removing it
    evidence:
      - "The new metal roof will be installed over the existing AC sheeting on a spacer system; the AC sheeting is left in place and encapsulated."
      - "Option B: overlay the existing asbestos roof rather than remove it."
    negation:
      - "The AC sheeting will be removed in full before re-sheeting."
    profile: []
    adds:
      cost_plan: ["Spacer or purlin-extension system over the existing sheeting", "Hygienist inspections during fixing through AC"]
      program: ["Hygienist's work method for drilling and fixing through the AC sheeting", "Install spacer system over the existing sheeting", "Inspect spacer fixings into the purlins before sheeting", "Update the asbestos register and management plan for the encapsulated roof"]
      rfps:
        - {discipline: consultant.structural, must_include: [{text: "Spacer fixings through the AC into the existing purlins and the uplift check of the overlay", key: position.strengthening}]}
        - {discipline: consultant.hazmat, must_include: ["Work method and supervision for drilling and fixing through AC sheeting; register and management plan update for the encapsulated roof"]}
    removes:
      work_items: [{system: site.demolition, action: remove}]
      cost_plan: ["Licensed removal of asbestos cement roof sheeting, cappings and skylights, incl. decontamination and disposal", "Asbestos air monitoring and clearance inspections during removal (per visit)"]
      program: ["Asbestos removal specification: method, sequence, air monitoring and clearance regime", "Notify SafeWork NSW of licensed asbestos removal", "Remove AC roof sheeting and skylights by bay, with air monitoring", "Hold point: asbestos clearance inspection and certificate per bay", "Purlin repairs and strengthening, then structural inspection", "Final asbestos clearance, waste disposal records and updated asbestos register"]
      rfps:
        - {discipline: consultant.hazmat, must_include: ["Asbestos removal specification: method, sequencing, exclusion zones and clearance hold points", "Review of the removalist's asbestos removal control plan and SafeWork NSW notification", "Air monitoring during removal (control and clearance monitoring) (specified; mandatory only for Class A, 2017 numbering r 475, verified: false)", "Visual clearance inspection and clearance certificate for each removal area, independent of the removalist"]}
    why: "Avoids licensed removal over live stock; the AC stays on the asbestos register and management plan. Drilling and fixing through AC is still asbestos work, done to the hygienist's work method (verified: false). Program logic: the work method follows 'Asbestos survey and sampling of the roof, gutters and high-level surfaces'; 'Install box gutters, sumps, overflows and downpipe connections' and the sheeting row then follow 'Install spacer system over the existing sheeting', and the sheeting row follows 'Inspect spacer fixings into the purlins before sheeting'. The roof-coverings replace item and the purlin investigate item stay."
    built_in: {cost_plan: partial, program: "no", rfps: partial}
    source: "knowledge/costs/elements.yaml elements code 04"

gaps:
  - {area: scope, what: "Remediation is an empty work type, so no work items exist until a document or the user adds them; the roof, the asbestos removal and the gutters are never proposed.", evidence: "knowledge/profile/scope_defaults.yaml empty_work_types"}
  - {area: scope, what: "The work-type default action is repair. A full re-roof is replace, licensed AC removal is remove, and the purlin check is investigate.", evidence: "knowledge/works/actions.yaml work_type_defaults remediation"}
  - {area: scope, what: "envelope.roof-coverings is labelled 'Pitched roof coverings' and the metal-roof rule carries an unverified claim that roofs below 5 degrees need a membrane. A 1 to 3 degree warehouse metal deck may be misfiled as external waterproofing.", evidence: "knowledge/clusters/envelope/rules.yaml rule.ncc.metal-roof-installation"}
  - {area: scope, what: "No system id for fall-arrest anchors and static lines (AS/NZS 1891.4, AS/NZS 5532); access-egress.maintenance-access describes AS 1657 platforms, walkways and ladders only. No id for temporary edge protection, safety mesh or scaffold either.", evidence: "knowledge/clusters/fire/systems.yaml access-egress.maintenance-access"}
  - {area: procurement, what: "No consultant baseline for remediation. Building consultant, Hazmat and Structural are never suggested. Hydraulic is suggested only through the roof-drainage scope addition, and Mechanical wrongly through roof ventilators.", evidence: "knowledge/works/package_defaults.yaml baselines, scope_additions[2], scope_additions[3]"}
  - {area: procurement, what: "Scope additions fire on any action, including retain, so a protected or retained service (sprinklers, lights) brings a consultant.", evidence: "internal/profile/works.go ProjectWorkScope; internal/procurement/defaults.go SuggestedPackages"}
  - {area: procurement, what: "access-egress.maintenance-access new needs design (needs_design true), but ProposeHeadContract drops design lines when BuilderDesigns(route) is false, so under traditional procurement the roof safety design-and-install element never appears in the head contract proposal.", evidence: "internal/procurement/proposed.go ProposeHeadContract; knowledge/works/actions.yaml actions new"}
  - {area: procurement, what: "No trade or supplier id for a roofing contractor, a licensed asbestos removalist, a height-safety installer or a solar installer. A separate direct asbestos removal contract cannot be keyed.", evidence: "data/intake/disciplines.json"}
  - {area: procurement, what: "Hazmat aliases lack 'occupational hygienist', 'licensed asbestos assessor' and 'asbestos consultant', so fee proposals from them may not file to consultant.hazmat.", evidence: "data/intake/disciplines.json consultant.hazmat"}
  - {area: procurement, what: "Default package stages (concept, approval and construction documentation, inspections) do not fit a hygienist (survey, specification, monitoring, clearance).", evidence: "knowledge/works/stages.yaml"}
  - {area: program, what: "No remediation skeleton; sk.generic with no owner or tenant gate. Only fr.exempt-confirmation and one generic investigation row are produced (verified by running program.Generate).", evidence: "knowledge/program/skeletons.yaml"}
  - {area: program, what: "fr.roof-7b, fr.demolition-7b, fr.steel-7b, the 7b documentation, tender and site-establishment fragments, contract award, practical completion, handover and defects are all gated to new or extend (or new, extend, refurb), so none fire for remediation.", evidence: "knowledge/program/fragments.yaml fr.roof-7b, fr.contract-award"}
  - {area: program, what: "No asbestos activities or hold points: no SafeWork notification, removal control plan, air monitoring or clearance row. No 7b roof-drainage, skylight or maintenance-access fragment.", evidence: "knowledge/program/fragments.yaml (no fragment names asbestos); testing/synthetic/reference/index/program-fragments.md leaf systems with no work-item fragment"}
  - {area: program, what: "Occupied-building protection is gated to refurb and the vehicle-impact system, and excludes Class 7b. Nothing models bay-by-bay sequencing under a live tenant.", evidence: "knowledge/program/fragments.yaml fr.occupied-protection"}
  - {area: cost_plan, what: "Asbestos removal lands in '01 Site works and external works' under trade.civil_works. No preliminaries, access-equipment, stock-protection, provisional-sum or long service levy line. CC and service-authority starters are always suggested though an exempt re-roof needs neither.", evidence: "knowledge/costs/elements.yaml elements code 01; knowledge/costs/starter_lines.yaml lines[4], lines[5]"}
  - {area: cost_plan, what: "No budget split for remediation (and none for industrial refurb), so a stated budget is not spread.", evidence: "knowledge/costs/budget_splits.yaml"}
  - {area: rfp, what: "No RFP template for consultant.hazmat or consultant.roof_access; both fall to the generic tpl.rfp-capex.", evidence: "knowledge/rfp (no file with these discipline_ids)"}
  - {area: rfp, what: "The hydraulic-services template includes domestic water, sanitary, pumps and rainwater design whenever its design stage is included, and blocks on client flags (hyd_investigation, hyd_planning and others) that no document can set. A roof-drainage-only commission comes out as a whole-building hydraulic brief.", evidence: "knowledge/rfp/hydraulic-services.yaml positions domestic, sanitary, pumps, rainwater"}
  - {area: rfp, what: "The structural template always includes concept and schematic design, a geotechnical brief and in-ground services footings, and prices the construction phase only as an option for a simple-scale job.", evidence: "knowledge/rfp/structural.yaml stages concept_schematic, construction_phase; positions geotech_brief, services_footings"}
  - {area: rfp, what: "The bca-certification template lists cdc as an unsupported pathway, so a certifier RFP for a CDC re-roof blocks.", evidence: "knowledge/rfp/bca-certification.yaml unsupported_pathways"}
  - {area: profile, what: "'asbestos contamination' of gutters or internal surfaces matches the potentially_contaminated_land trigger (contaminat), and 'flooding' from box gutter overflow matches the flood_hazard trigger. Both only route a Jev question; expected readings are not true.", evidence: "knowledge/determinants.yaml potentially_contaminated_land, flood_hazard triggers"}
  - {area: profile, what: "Implied scope fires in code on ordinary warehouse wording: 'office kitchen' or 'staff amenities bathroom' (hydraulic and exhaust, so Hydraulic and Mechanical again), 'common wall' between units (adjoining structures, compartments, acoustic separation), 'stairs' to the mezzanine (stairs and ramps), 'brickwork' parapets (masonry), 'demolition' (site.demolition, which is correct here).", evidence: "knowledge/profile/scope_defaults.yaml implied_by"}
  - {area: profile, what: "The existing_building_year trigger matches 'built in' or 'constructed in' a year but not 'completed in' or 'erected in', so a common phrasing of the year is missed and the pre-2004 hazmat Implication does not fire.", evidence: "knowledge/determinants.yaml existing_building_year triggers"}
  - {area: knowledge, what: "WHS asbestos law is not encoded: licence classes, SafeWork notification, removal control plan, air monitoring, clearance, register and management plan, and waste tracking. uc.asbestos-found-in-existing-building does not fire on remove or investigate actions.", evidence: "knowledge/clusters/structure/unforeseen.yaml uc.asbestos-found-in-existing-building"}
  - {area: knowledge, what: "No friable versus bonded distinction anywhere, though it decides the licence class, method and clearance authority.", evidence: "knowledge/clusters/structure/systems.yaml site.demolition"}

