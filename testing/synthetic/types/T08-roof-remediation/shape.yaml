  - id: independent-height-safety-design
    label: Owner engages an independent height safety consultant for the roof access layout
    evidence:
      - "The owner has engaged a height safety consultant to design the roof access and fall protection layout and certify the installation."
      - "The roof access system is to comply with the owner's portfolio height safety standard and be audited by the owner's consultant."
    negation:
