    source: "knowledge/program/fragments.yaml fr.cdc-application"
  - id: heritage-listed
    label: Heritage item or conservation area (for example a sawtooth-roof factory)
    evidence:
      - "The former factory is listed as a local heritage item in Schedule 5 of the LEP."
      - "The sawtooth roof form is identified as significant fabric in the heritage inventory."
    negation:
      - "The site is not a heritage item and not in a conservation area."
    profile: [det.heritage_status, hdr.cond.planning]
    adds:
      procurement: [consultant.heritage, consultant.town_planner]
      cost_plan: ["Heritage consultant", "DA fees and contributions"]
      program: ["Heritage referral", "Lodge DA", "DA assessment"]
      authority: ["Development consent or a heritage minor-works exemption under LEP cl 5.10(3) (verified: false)", "Codes SEPP exempt development generally unavailable on a heritage item (verified: false)"]
    removes:
      program: ["Confirm exempt pathway (no development consent)"]
    why: "Heritage is suggested from complexity_additions[1] and fr.heritage-referral fires (verified by running the Go). If planning becomes da, complexity_additions[0] adds the Town Planner and the DA fragments fire. Heritage has no RFP template."
