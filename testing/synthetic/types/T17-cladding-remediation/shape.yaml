triggers:
  - id: project-remediate
    label: Funded through NSW Project Remediate
    evidence:
      - "The building is eligible for Project Remediate and the owners corporation has accepted an interest-free loan."
      - "Project Remediate's appointed project manager will coordinate the design team and builder from the program panels."
    negation:
      - "The owners corporation is funding the works through special levies without government assistance."
    profile: [proj.client]
    adds:
      program: ["Project Remediate eligibility and registration", "General meeting resolves to enter the remediation and loan agreements", "Program-appointed project manager mobilised (verified: false)", "Design team and builder selected from Project Remediate panels"]
      cost_plan: ["Loan establishment and repayment levies (no amount)"]
      authority: ["Project Remediate agreement with the administering agency (Building Commission NSW, verified: false)"]
    removes:
      procurement: [consultant.project_manager]
      cost_plan: ["Project manager"]
      rfps: [consultant.project_manager]
    why: "The program engaged and paid the project manager from its panel, so the OC runs no PM RFP and has no PM fee line. Registration for the program closed to new buildings years ago, so a 2026 scenario needs an already-enrolled OC. Eligibility, loan terms and panels: all verified: false."
    built_in: {program: "no", cost_plan: "no"}
  - id: performance-solution-retained-cladding
    label: Some combustible material retained under a fire-engineered performance solution
    evidence:
      - "The EPS render at ground level is to be retained subject to a performance solution by the fire engineer."
      - "A fire engineering report will justify partial retention of the low-risk cladding."
      - "The fire engineered solution for the balcony soffits departs from the deemed-to-satisfy provisions."
    negation:
      - "All combustible cladding and insulation will be removed and replaced to the deemed-to-satisfy provisions."
    profile: [flag.fire_specialist_systems]
    adds:
      cost_plan: ["Fire engineering report and peer review", "FRNSW referral (no fee assumed)"]
      program: ["Performance-based design brief", "Fire engineering report", "Initial fire safety report to FRNSW (verified: false)", "Final fire safety report to FRNSW (verified: false)"]
      rfps:
        - {discipline: consultant.fire_engineer, must_include: ["Performance-based design brief and FER for scheduled solutions", "Independent peer review where the certifier requires it"]}
        - {discipline: consultant.certifier, must_include: ["Assessment of the performance solution and FRNSW referral"]}
      authority: ["FRNSW referral of fire safety reports (EP&A DCFS Regulation 2021, verified: false)"]
    why: "Stages s3_brief and s4_report become include; the app leaves them as decisions because fe_solutions is a client flag."
    built_in: {rfps: partial, program: "no", cost_plan: "no"}
    source: "knowledge/rfp/fire-engineering.yaml stages s3_brief"
  - id: hazardous-materials
    label: Building old enough to contain asbestos in the facade build-up
    evidence:
      - "The building was completed in 1998."
      - "The asbestos register lists fibre cement soffit linings behind the balcony ACP."
      - "Mastic sealants to the original panel joints are of unknown composition."
    negation:
      - "The 2020 hazardous materials survey found no asbestos in the facade."
      - "Construction completed in 2011."
    profile: [det.existing_building_year]
    adds:
      procurement: [consultant.hazmat]
      work_items: [{system: site.demolition, action: remove}]
      cost_plan: ["Hazardous materials survey of the facade build-up", "Licensed asbestos removal and clearance certificate"]
      program: ["Hazardous materials survey", "Asbestos removal and clearance before cladding removal"]
      authority: ["SafeWork NSW notice before licensed asbestos removal (verified: false)"]
    why: "uc.asbestos-cladding-disturbed raises an Implication only (needs existing_building_year < 2004 and an alter, upgrade, repair or remove item, not replace)."
    built_in: {procurement: "no", program: "no", cost_plan: "no"}
  - id: concealed-substrate-damage
    label: Water damage or corrosion found behind the cladding
    evidence:
      - "Sample openings found corroded steel studs and wet plasterboard behind the ACP on the south elevation."
      - "Rust staining and spalling at slab edges where the brackets are to be fixed."
      - "The render is drummy and the substrate behind it is soft."
    negation:
      - "The substrate and fixings were sound in all sample openings."
    profile: []
    adds:
      work_items:
        - {system: structure.concrete, action: repair}
