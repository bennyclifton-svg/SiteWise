      - {key: position.bim_coordination, app: O, expect: absent, why: "service_level complex O"}
      - {key: position.door_schedule, app: I, expect: absent, why: "always I; no doors in a cladding job"}
      - {key: position.typical_interiors, app: I, expect: absent, why: "service_level complex I"}
