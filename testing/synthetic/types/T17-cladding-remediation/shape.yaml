schema: sitewise-synthetic-shape/1
type_id: T17
slug: cladding-remediation
name: Façade or combustible cladding remediation
reviewed: false
state: NSW

# Base scenario: an occupied 8-storey, 56-unit NSW strata Class 2 residential flat
# building completed in 2011, Type A, not sprinklered. An audit found PE-core ACP on
# the balcony spandrels and blades and an EPS render system on the setback levels.
# Council has issued a fire safety order. The owners corporation funds the works by
# special levies, appoints a project manager and a consultant team, lodges a DA for
# the change of appearance, and lets one AS 4000 lump-sum contract to a remedial
# builder working elevation by elevation from a perimeter scaffold. Prose: DOMAIN.md.
profile:
  hdr.building_class: residential
  hdr.subclass: apartments
  hdr.work_type: remediation
  hdr.cond.planning: da
  hdr.cond.procurement_route: traditional
  hdr.cond.stakeholder_complexity: strata
  hdr.cond.operational_constraints: 24_7_occupied   # accept live_environment or partial_occupation too (DOMAIN.md §12)
  hdr.cond.access_constraints: urban_constrained
  hdr.scale.storeys: 8
  hdr.scale.units: 56
  det.ncc_class: ["2"]
  det.state: NSW
  det.existing_building: true
  det.existing_building_year: 2011
  det.rise_in_storeys: 8
  det.type_of_construction: A
  det.sprinklered: false
  det.heritage_status: none
  det.facade_type: complex          # the replacement is a ventilated rainscreen with a facade engineer
  det.flood_hazard: false
  det.potentially_contaminated_land: false
  fact.contract_form: as4000
  fact.contract_basis: lump_sum
  proj.regulated_design: "yes"      # DBP Act applies to Class 2 remedial work (owner ruling R3)
  proj.client: "The Owners - Strata Plan 87654 (fictional)"
  # RFP flags set explicitly so unknowns do not turn rows into options or decisions.
  flag.basement: "no"               # the basement exists but nothing is excavated (basement trap)
  flag.excavation_adjoining: "no"
  flag.authority_asset: "no"
  flag.rail: "no"
  flag.transfer_structures: "no"
  flag.osd_existing: "no"
  flag.staged: "no"
  flag.multi_building: "no"
  flag.cl46: "no"
  flag.panel: "no"
  flag.community: "no"
  flag.country: "no"
  flag.sustainability_target: "no"
  flag.fire_vulnerable_occupants: "no"
  flag.fire_special_hazards: "no"
  flag.fire_specialist_systems: "yes"   # the audit and order name a facade fire-assessment issue

expected_derived:
  - {key: det.ncc_class, value: ["2"], source: "knowledge/profile/taxonomy.yaml apartments ncc_class", note: "The subclass apartments implies Class 2, but det.ncc_class is never derived from the subclass (KNOWLEDGE_INDEX §0 rule 3)."}
  - {key: det.existing_building, value: true, source: "internal/rfp/drivers.go deriveFlags", note: "The RFP drivers derive flag.existing_building from work type remediation; the profile row itself is not derived."}
  - {key: det.type_of_construction, value: A, source: "knowledge/determinants.yaml type_of_construction", note: "A Class 2 building with a rise of 4 or more storeys needs Type A construction (NCC 2022 Vol One Table C2D2, verified: false). No derivation exists; it is read or typed only."}

scenario_inputs:
  - {key: det.existing_building_year, note: "Stated in the audit or strata records. Gates the hazardous-materials trigger.", phrasing: "The building was completed in <year>."}
  - {key: hdr.scale.storeys, note: "Also gives det.rise_in_storeys, which decides the HBCF exemption (low-rise-hbcf).", phrasing: "an <n>-storey residential flat building"}
  - {key: hdr.scale.units, note: "Use 'units' or 'apartments', not 'lots', so the units trigger matches.", phrasing: "<n> residential units"}
  - {key: proj.client, note: "The owners corporation is the client; the strata manager is its agent.", phrasing: "Client: The Owners - Strata Plan No. <number>"}
  - {key: proj.regulated_design, note: "Needs an explicit statement in a read document; the class alone does not decide it.", phrasing: "The remediation is building work under the Design and Building Practitioners Act 2020; regulated designs and design compliance declarations are required."}
  - {key: hdr.cond.planning, note: "Stated in the planner's or PM's report.", phrasing: "A development application is required for the change to the external materials and appearance."}
  - {key: det.heritage_status, note: "Enumerated none is evidence; silence is not.", phrasing: "The site is not a heritage item and is not within a heritage conservation area."}
  - {key: det.facade_type, note: "Needs a named system to read complex.", phrasing: "The replacement is a ventilated rainscreen cladding system of solid aluminium panels designed by the facade engineer."}
  - {key: det.sprinklered, note: "Stated in the fire engineer's report.", phrasing: "The building is not sprinkler protected."}
  - {key: det.type_of_construction, note: "Stated in the BCA report.", phrasing: "The building is required to be of Type A construction."}
  - {key: fact.contract_form, note: "Stated in the tender documents.", phrasing: "AS 4000-1997 General conditions of contract, with special conditions"}
  - {key: hdr.cond.operational_constraints, note: "Any of 24_7_occupied, live_environment or partial_occupation is acceptable.", phrasing: "The building will remain fully occupied throughout the works."}
  - {key: proj.budget_stated, note: "The QS order of cost for the recommended option. The architecture RFP blocks without a budget (required_facts).", phrasing: "Estimated construction cost for the recommended option: $<amount> excluding GST"}
  - {key: flag.fire_specialist_systems, note: "Stated by the audit or the fire engineer.", phrasing: "The fire engineer's assessment identifies the external wall cladding as a facade fire performance issue requiring rectification."}

work_items:
  - {system: envelope.external-walls, action: replace, why: "Remove the PE-core ACP and the EPS render system and install a non-combustible ventilated rainscreen on a new subframe. Removal and a different product is replace, not the work-type default repair."}
  - {system: fire-passive.external-walls, action: upgrade, why: "The point of the job: the external wall becomes non-combustible, with cavity barriers and spandrel or slab-edge protection against vertical fire spread."}
  - {system: envelope.thermal-insulation, action: replace, why: "The EPS is the insulation; it is replaced with non-combustible insulation."}
  - {system: envelope.pliable-membranes, action: replace, why: "Combustible sarking and wall wrap behind the cladding are replaced with a compliant product (NCC sarking concession, verified: false)."}
  - {system: envelope.flashings-seals, action: replace, why: "Window head and sill flashings, sealants and the new cladding-to-window interface."}
  - {system: envelope.windows-doors, action: retain, why: "Windows stay and are protected; the new cladding seals to them."}
  - {system: structure.concrete, action: investigate, why: "Slab edges and fixing zones for the new brackets: condition, edge distance and pull-out tests. Repairs are provisional."}

procurement:
  - {discipline: consultant.project_manager, kind: services, built_in: "no", why: "Runs the job for the owners corporation: consultant procurement, committee and general meeting reporting, council liaison on the fire safety order, superintendent under AS 4000. Remediation has no baseline (package_defaults.yaml baselines)."}
  - {discipline: consultant.architect, kind: services, built_in: "no", why: "Facade redesign and appearance, DA drawings and photomontages, documentation, regulated design (architectural), design support during construction. baselines[0] covers new and extend, baselines[2] refurb; none covers remediation."}
  - {discipline: consultant.fire_engineer, kind: services, built_in: "no", why: "Reviews the audit and laboratory results, sets interim fire safety measures, advises the removal extent, confirms DTS compliance or prepares a performance solution, inspects cavity barriers and slab-edge protection. No package rule names Fire Engineer."}
  - {discipline: consultant.facade, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[7]", why: "System selection, wind loads, subframe and fixing design or review, weatherproofing, product test evidence and facade testing. Suggested only when det.facade_type reads complex."}
  - {discipline: consultant.structural, kind: services, built_in: "no", why: "Primary-structure capacity for the new brackets, pull-out test regime, slab-edge repair specification and certification of fixings."}
  - {discipline: consultant.bca, kind: services, built_in: "no", why: "NCC compliance report for the remediation design, existing-building assessment, fire safety schedule changes. baselines[3] gives BCA for refurb of non-residential classes only."}
  - {discipline: consultant.certifier, kind: services, built_in: "no", why: "Principal certifier: CC, inspections, final fire safety certificate and occupation certificate for the altered part (verified: false)."}
  - {discipline: consultant.town_planner, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[0]", why: "Statement of environmental effects for the change of external materials and appearance."}
  - {discipline: consultant.quantity_surveyor, kind: services, built_in: "no", why: "Option estimates for the levy, the DA cost estimate report, tender estimate and progress-claim assessment."}
  - {discipline: trade.main_works, kind: works, built_in: partial, source: "internal/procurement/proposed.go ProposeHeadContract", why: "Remedial builder under a lump-sum head contract; licensed and a registered building practitioner (DBP Act, owner ruling R3). Proposed only from gaps on accepted work items."}

not_expected_procurement:
  - {discipline: consultant.hydraulic, app_suggests: conditional, source: "knowledge/works/package_defaults.yaml scope_additions[3]", why: "Fires on external downpipe items (facade-services-reinstatement) or on 'kitchen'/'bathroom' exhaust wording that implies hydraulic scope in code. The builder relocates downpipes; no hydraulic engineer."}
  - {discipline: consultant.mechanical, app_suggests: conditional, source: "knowledge/works/package_defaults.yaml scope_additions[2]", why: "Fires on AC condensers or exhaust outlets on the facade, or on implied local-exhaust scope. A licensed refrigeration tradesperson relocates lot-owner units."}
  - {discipline: consultant.electrical, app_suggests: conditional, source: "knowledge/works/package_defaults.yaml scope_additions[4]", why: "Fires on facade lighting or external GPO items. The builder's electrician disconnects and reinstates them."}

cost_plan:
  - {line: "DA fees and contributions", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml lines[3]", why: "Suggested when hdr.cond.planning is da."}
  - {line: "Construction certificate and certifier fees", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml lines[4]", why: "Always suggested; needed here on the DA path. Overlaps the certifier fee line if the certifier is also a package."}
  - {line: "Long service levy", section: fees_and_charges, built_in: "no", why: "Paid before the CC is issued (rate and threshold verified: false). No starter line."}
  - {line: "Council hoarding, footpath occupation and road occupancy fees", section: fees_and_charges, built_in: "no", why: "Scaffold and hoarding over the footpath (Roads Act s 138, verified: false). No starter line."}
  - {line: "Project manager", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "A fee line per live services package; this package is never suggested."}
  - {line: "Architect", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "Fee line per package; not suggested for remediation."}
  - {line: "Fire safety engineer", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "Fee line per package; not suggested."}
  - {line: "Facade engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[7]", why: "The Facade package is suggested when det.facade_type is complex and adopted on cost-plan prepare."}
  - {line: "Structural engineer", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "Fee line per package; not suggested for remediation."}
  - {line: "BCA consultant", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "Fee line per package; not suggested."}
  - {line: "Principal certifier", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "Fee line per package; not suggested. May instead sit in P05."}
  - {line: "Town planner", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[0]", why: "Suggested on the DA path and adopted on prepare."}
  - {line: "Quantity surveyor", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "Fee line per package; not suggested."}
  - {line: "Investigation disbursements: sampling, laboratory combustibility testing, opening-up and pull-out testing", section: consultants, built_in: "no", why: "Usually passed through by the fire or facade engineer. No early-works line exists."}
  - {line: "Preliminaries and occupied-building controls", section: construction, built_in: "no", why: "Resident liaison, protection, waste removal through an occupied site. No preliminaries line; no remediation budget split."}
  - {line: "Perimeter scaffold, shade cloth and edge protection, incl. engineering and certification", section: construction, built_in: "no", why: "A large share of facade remediation cost. Scaffolding has no system id (structure.temporary-works excludes it)."}
  - {line: "Footpath hoarding or overhead protection", section: construction, built_in: "no", why: "Needed over the council footpath whatever the access method. No system id."}
  - {line: "Pre-commencement condition surveys of units, footpath and neighbours", section: construction, built_in: "no", why: "Records condition before the scaffold goes up; protects the OC and the builder against damage claims."}
  - {line: "Equipotential bonding and earthing of the aluminium cladding and subframe (verified: false)", section: construction, built_in: "no", why: "By the builder's electrician; an electrical.* item would wrongly add the Electrical consultant (scope_additions[4])."}
  - {line: "Remove and dispose of combustible cladding and EPS render system", section: construction, built_in: "no", why: "Elevation by elevation, with waste classification. The app has only the generic envelope line."}
  - {line: "Subframe and bracket fixings", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 04", why: "Folded into '04 Building envelope'."}
  - {line: "Non-combustible cladding system supply and install", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 04", why: "Appears only as the generic '04 Building envelope' once an envelope work item exists."}
  - {line: "Non-combustible insulation and sarking", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 04", why: "Folded into '04 Building envelope'."}
  - {line: "Cavity barriers and slab-edge fire protection", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 06", why: "'06 Passive fire protection' once the fire-passive.external-walls item exists."}
  - {line: "Flashings, sealants and window interfaces", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 04", why: "Folded into '04 Building envelope'."}
  - {line: "Interim fire safety measures during the works", section: construction, built_in: "no", why: "Temporary measures the order or fire engineer requires while combustible cladding remains."}
  - {line: "Facade water testing and hold-point inspections", section: construction, built_in: "no", why: "Sample-area spray or hose testing (AS 4284, verified: false)."}
  - {line: "Provisional sums: slab-edge repairs and concealed conditions behind the cladding", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 03", why: "The structure.concrete investigate item makes a generic '03 Structure' line; no provisional-sum line exists."}
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml lines[0]", why: "Always suggested."}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml lines[1]", why: "Always suggested; should be high for concealed conditions."}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml lines[2]", why: "Always suggested; levy timing often delays the start."}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml lines[6]", why: "Lot-owner items on the facade are usually excluded or recharged."}
  - {line: "Owners corporation costs: strata manager, legal review of contract and levy or loan, finance costs", section: contingency, built_in: "no", why: "Real OC costs outside the contract. No line exists."}

not_expected_cost_plan:
  - {line: "Service authority connection fees", app_label: "P06 Service authority connection fees", section: fees_and_charges, source: "knowledge/costs/starter_lines.yaml lines[5]", why: "Always suggested; no authority connection is made."}
  - {line: "Hydraulic (consultant fee)", app_label: "F0n Hydraulic", section: consultants, source: "knowledge/works/package_defaults.yaml scope_additions[3]", why: "Conditional: only when downpipe or implied wet-area scope exists."}
  - {line: "Mechanical (consultant fee)", app_label: "F0n Mechanical", section: consultants, source: "knowledge/works/package_defaults.yaml scope_additions[2]", why: "Conditional: condenser, exhaust or implied exhaust scope."}
  - {line: "Electrical (consultant fee)", app_label: "F0n Electrical", section: consultants, source: "knowledge/works/package_defaults.yaml scope_additions[4]", why: "Conditional: facade lighting scope."}

program:
  skeleton: missing          # no remediation skeleton; the app falls back to sk.generic
  app_produces: sk.generic
  activities:
    - {label: "Receive fire safety order and confirm the compliance date", stage: investigation, fragment: null, after: [], built_in: "no", why: "Notice of intention, representations, then the order (EP&A Act Div 9.3, Sch 5, verified: false). Sets the job's deadline."}
    - {label: "Strata committee appoints project manager and approves investigation budget", stage: investigation, fragment: null, after: ["Receive fire safety order and confirm the compliance date"], built_in: "no", why: "Client governance gate before spend (SSMA, verified: false)."}
    - {label: "Collect records: approvals, facade drawings, product data, cladding registration, audit, fire safety schedule", stage: investigation, fragment: null, after: ["Strata committee appoints project manager and approves investigation budget"], built_in: "no", why: "Original DA, CC and OC, approved facade drawings, product certificates, the audit report and the AFSS."}
    - {label: "Facade survey, sampling and laboratory combustibility testing", stage: investigation, fragment: null, after: ["Collect records: approvals, facade drawings, product data, cladding registration, audit, fire safety schedule"], built_in: "no", why: "Identify every material and its core; the removal extent depends on it (uc.combustible-cladding-on-existing-facade is an Implication only)."}
    - {label: "Put interim fire safety measures in place", stage: investigation, fragment: null, after: ["Receive fire safety order and confirm the compliance date"], built_in: "no", why: "Councils usually require interim measures as soon as the order is received: no balcony storage or BBQs, hot-works ban, more frequent fire safety checks, resident information."}
    - {label: "Fire engineering risk assessment and removal-extent advice", stage: investigation, fragment: null, after: ["Facade survey, sampling and laboratory combustibility testing"], built_in: "no", why: "Risk assessment from the test results and advice on what must be removed."}
    - {label: "Intrusive opening-up and pull-out testing of fixing substrates", stage: investigation, fragment: null, after: ["Facade survey, sampling and laboratory combustibility testing"], built_in: partial, source: "internal/program/generate.go investigationRows", why: "The structure.concrete investigate item gets one generic Investigation row, not opening-up and pull-out testing."}
    - {label: "Remediation options report with order of cost", stage: investigation, fragment: null, after: ["Fire engineering risk assessment and removal-extent advice", "Intrusive opening-up and pull-out testing of fixing substrates"], built_in: "no", why: "Options for system, extent and access, priced by the QS, for the general meeting."}
    - {label: "General meeting resolves option, design fees and first levy, and owners' consent to lodge the DA (verified: false)", stage: concept_design, fragment: null, after: ["Remediation options report with order of cost"], built_in: "no", why: "Owners corporation consent: the OC owns the common property, so its consent is needed to lodge the DA. Special resolution if common property is altered rather than repaired (SSMA s 108, verified: false)."}
    - {label: "Concept and schematic facade design", stage: concept_design, fragment: null, after: ["General meeting resolves option, design fees and first levy, and owners' consent to lodge the DA (verified: false)"], built_in: "no", why: "No concept fragment for remediation (concept-design fragments are gated to new and extend)."}
    - {label: "DA documentation: drawings, photomontages, SEE, BCA and fire letters, QS cost report", stage: approval_documentation, fragment: null, after: ["Concept and schematic facade design"], built_in: "no", why: "The app's approval-documentation fragments need new or extend."}
    - {label: "Lodge DA", stage: approvals, fragment: fr.da-lodgement, after: ["DA documentation: drawings, photomontages, SEE, BCA and fire letters, QS cost report"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.da-lodgement", why: "Fires on planning da."}
    - {label: "DA notification", stage: approvals, fragment: fr.da-exhibition, after: ["Lodge DA"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.da-exhibition", why: "Fires on planning da."}
    - {label: "DA assessment and determination", stage: approvals, fragment: fr.da-assessment, after: ["DA notification"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.da-assessment", why: "Fires on planning da."}
    - {label: "Satisfy pre-CC conditions of consent (colours and materials, dilapidation, LSL)", stage: approvals, fragment: null, after: ["DA assessment and determination"], built_in: "no", why: "Conditions to be met before the CC issues, typically a colours and materials schedule, a dilapidation report and the long service levy (verified: false)."}
    - {label: "Report progress to council and seek extension of the order's compliance date", stage: approvals, fragment: null, after: ["Lodge DA"], built_in: "no", why: "Councils usually require progress reports; an extension is common when the DA and levy take time."}
    - {label: "Design development: system, subframe, cavity barriers and fixings", stage: construction_documentation, fragment: null, after: ["Concept and schematic facade design"], built_in: "no", why: "Architect, facade, structural and fire engineers."}
    - {label: "Product compliance evidence and BCA compliance report", stage: construction_documentation, fragment: null, after: ["Design development: system, subframe, cavity barriers and fixings"], built_in: "no", why: "Non-combustibility test reports or certification for every product (AS 1530.1, CodeMark, verified: false) (uc.cladding-product-fails-compliance-test)."}
    - {label: "Regulated designs and design compliance declarations", stage: construction_documentation, fragment: null, after: ["Product compliance evidence and BCA compliance report"], built_in: "no", why: "DBP Act, Class 2 (owner ruling R3). The Act requires lodgement before building work starts; the certifier assesses the same designs for the CC, so they precede it here (timing verified: false)."}
    - {label: "Tender documents", stage: construction_documentation, fragment: null, after: ["Regulated designs and design compliance declarations"], built_in: "no", why: "Specification, drawings, staging and occupancy plan, AS 4000 with special conditions, provisional sums. fr.tender-docs-2 is gated to new and extend."}
    - {label: "Pay long service levy", stage: approvals, fragment: null, after: ["DA assessment and determination"], built_in: "no", why: "Before the CC is issued (verified: false)."}
    - {label: "Construction certificate", stage: approvals, fragment: fr.construction-certificate, after: ["DA assessment and determination", "Regulated designs and design compliance declarations", "Pay long service levy", "Satisfy pre-CC conditions of consent (colours and materials, dilapidation, LSL)"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-certificate", why: "Fires on planning da."}
    - {label: "Tender period with site inspection", stage: procurement, fragment: null, after: ["Tender documents"], built_in: "no", why: "Tenderers inspect the sample openings."}
    - {label: "Tender evaluation and recommendation", stage: procurement, fragment: null, after: ["Tender period with site inspection"], built_in: "no", why: "Licence, DBP registration, scaffold and removal methodology, product evidence, program against the order date."}
    - {label: "General meeting resolves contract award and construction levy", stage: procurement, fragment: null, after: ["Tender evaluation and recommendation"], built_in: "no", why: "The OC's critical gate; levy or loan collection can hold the start."}
    - {label: "Contract award", stage: procurement, fragment: fr.contract-award, after: ["General meeting resolves contract award and construction levy", "Construction certificate"], built_in: partial, source: "knowledge/program/fragments.yaml fr.contract-award", why: "Gated to work_type new, extend or refurb, so false for remediation."}
    - {label: "Hold point: panel samples, colour and visual mock-up approved", stage: construction, fragment: null, after: ["Contract award"], built_in: "no", why: "Panel samples, colours and a visual mock-up approved by the architect and the OC, and against the DA colours condition, before fabrication."}
    - {label: "Council hoarding and footpath approval", stage: construction, fragment: null, after: ["Contract award"], built_in: "no", why: "Roads Act s 138 and road occupancy (verified: false)."}
    - {label: "Resident notices and pre-commencement condition surveys", stage: construction, fragment: null, after: ["Contract award"], built_in: "no", why: "Units beside the works, footpath, podium and neighbours."}
    - {label: "Site establishment and scaffold erection and certification", stage: construction, fragment: null, after: ["Council hoarding and footpath approval", "Resident notices and pre-commencement condition surveys"], built_in: "no", why: "fr.site-establishment-2 is gated to new and extend; scaffolding has no system."}
    - {label: "Remove combustible cladding and EPS, elevation by elevation", stage: construction, fragment: null, after: ["Site establishment and scaffold erection and certification"], built_in: "no", why: "Hot-works controls; temporary weather protection (if.envelope-repair-temporary-enclosure)."}
    - {label: "Hold point: substrate, subframe and fixings inspection", stage: construction, fragment: null, after: ["Remove combustible cladding and EPS, elevation by elevation"], built_in: "no", why: "Structural and facade engineers, with pull-out results. No external-wall hold point in the interfaces."}
    - {label: "Install insulation, sarking and cavity barriers", stage: construction, fragment: fr.insulation-2, after: ["Hold point: substrate, subframe and fixings inspection"], built_in: partial, source: "knowledge/program/fragments.yaml fr.insulation-2", why: "The insulation fragment exists for Class 2 but needs work type new or extend."}
    - {label: "Hold point: cavity barriers and slab-edge fire protection before close-up", stage: construction, fragment: null, after: ["Install insulation, sarking and cavity barriers"], built_in: "no", why: "Fire engineer and certifier. if.fire-facade-slab-edge has no hold_point; if.fire-stopping-before-concealment needs a fire-passive.penetrations item."}
    - {label: "Flashings and window interfaces", stage: construction, fragment: null, after: ["Hold point: cavity barriers and slab-edge fire protection before close-up"], built_in: "no", why: "Before the cladding conceals them (if.envelope-flashing-before-cladding)."}
    - {label: "Install non-combustible cladding", stage: construction, fragment: fr.facade-2, after: ["Flashings and window interfaces", "Hold point: panel samples, colour and visual mock-up approved"], built_in: partial, source: "knowledge/program/fragments.yaml fr.facade-2", why: "fr.facade-2 needs work type new or extend and action new or replace."}
    - {label: "Facade water test on sample areas", stage: construction, fragment: null, after: ["Install non-combustible cladding"], built_in: "no", why: "AS 4284 or hose test (verified: false)."}
    - {label: "Strike scaffold and make good", stage: construction, fragment: null, after: ["Facade water test on sample areas"], built_in: "no", why: "Per elevation; reinstate footpath and podium."}
    - {label: "Building compliance declaration (DBP Act)", stage: completion, fragment: null, after: ["Strike scaffold and make good"], built_in: "no", why: "Registered building practitioner declares compliance with the varied regulated designs (DBP Act, owner ruling R3; section number and timing verified: false). Comes before the OC application."}
    - {label: "Final inspection, fire safety certificate and occupation certificate", stage: completion, fragment: fr.occupation-certificate, after: ["Building compliance declaration (DBP Act)"], built_in: partial, source: "knowledge/program/fragments.yaml fr.occupation-certificate", why: "Gated to new, extend or refurb."}
    - {label: "Council confirms compliance with or revokes the fire safety order; cladding registration and fire safety schedule updated", stage: completion, fragment: null, after: ["Final inspection, fire safety certificate and occupation certificate"], built_in: "no", why: "Closes the order; the AFSS changes from the next cycle (verified: false)."}
    - {label: "Practical completion inspection", stage: completion, fragment: fr.practical-completion, after: ["Final inspection, fire safety certificate and occupation certificate"], built_in: partial, source: "knowledge/program/fragments.yaml fr.practical-completion", why: "Gated to new, extend or refurb."}
    - {label: "Handover: product register, test evidence, warranties and as-built records", stage: completion, fragment: fr.handover, after: ["Practical completion inspection"], built_in: partial, source: "knowledge/program/fragments.yaml fr.handover", why: "Gated to new, extend or refurb."}
    - {label: "Defects liability period and final inspection", stage: defects, fragment: fr.defects-liability-end, after: ["Handover: product register, test evidence, warranties and as-built records"], built_in: partial, source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "Gated to new, extend or refurb."}

rfps:
  - discipline: consultant.project_manager
    template: null
    built_in: "no"
    must_include:
      - "Liaison with council on the fire safety order: representations, progress reports, extensions and closure"
      - "Consultant procurement and management of the design team"
      - "Attendance and reports at strata committee and general meetings; levy or loan cash-flow input"
      - "Program management against the order's compliance date"
      - "Superintendent under AS 4000, including payment schedules under the NSW Security of Payment Act (verified: false)"
      - "Resident communication plan for an occupied building"
    must_not_include:
      - "Design or certification services"
      - "Cost estimating beyond reporting the QS's figures"
    app_differs:
      - {key: text.template, app: "generic tpl.rfp-capex", expect: "a project-management RFP carrying the must_include scope", why: "No knowledge/rfp file lists consultant.project_manager"}
  - discipline: consultant.architect
    template: architecture
    built_in: partial
    source: "knowledge/rfp/architecture.yaml stages"
    must_include:
      - "Existing facade survey and record drawings"
      - "Replacement cladding options and schematic design"
      - "DA drawings and photomontages for the change of appearance"
      - "Design development and documentation of the replacement facade"
      - "Regulated designs and design compliance declarations (DBP Act, owner ruling R3; practitioner classes verified: false)"
      - "Tender documents, bidding and for-construction documents"
      - "Design support during construction, including shop drawing review"
      - "Staging and occupancy inputs for the occupied building"
    must_not_include:
      - "Interiors or typical apartment interiors"
      - "BIM model for the design team"
      - "Door and hardware schedules"
      - "FF&E and tenant fit-out"
      - "Fire engineering performance solutions (fire engineer)"
    expect:
      stages_include: [concept, schematic, planning_approval, planning_response, design_development, tender_traditional, bidding, regulated_design, for_construction, construction_support]
      stages_option: [contract_admin]
      stages_absent: [brief_masterplan, interiors, house_documents, dnc_tender, post_novation]
      positions: {coordination: I, input_schedule: I, specialist_coordination: I, specification: I, finishes_schedules: I, certifier_liaison: I, existing_interfaces: I, live_staging: I, facade_certification: X, performance_solutions: X, extra_declarations: O, apartment_design: O, marketing_renders: O, tender_evaluation: O, bim_model: absent, bim_coordination: absent, door_schedule: absent, typical_interiors: absent, tenant_fitout: absent, ffe: absent}
      blocking: []
      sources:
        - "blocking empty only when proj.budget_stated is given (architecture.yaml required_facts budget)"
        - "existing_interfaces and live_staging: modules existing_building (work type) and live_site (operational_constraints)"
    app_differs:
      - {key: stage.tender_traditional, app: option, expect: include, why: "after the boundary end (interiors); resolveStages prices it as an option"}
      - {key: stage.bidding, app: option, expect: include, why: "after the boundary end"}
      - {key: stage.regulated_design, app: option, expect: include, why: "after the boundary end, though proj.regulated_design is yes"}
      - {key: stage.for_construction, app: option, expect: include, why: "after the boundary end"}
      - {key: stage.construction_support, app: option, expect: include, why: "default option and after the boundary end"}
