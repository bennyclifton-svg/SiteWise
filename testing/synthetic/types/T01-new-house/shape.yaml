  - {area: knowledge, what: "Section 73 rule overstates the requirement for one house on an existing serviced lot", evidence: "knowledge/clusters/services-wet-air/rules.yaml rule.nsw.section-73-certificate"}
  - {area: procurement, what: "No trade or supplier id for a pool builder; HBCF and the domestic deposit cap cannot be expressed", evidence: "data/intake/disciplines.json"}
  - {area: program, what: "No public holidays or industry Christmas shutdown", evidence: "knowledge/program/calendars.yaml calendars: []"}

variants: [cdc-pathway, trees-affected, sloping-site, bushfire-prone, sewer-main-in-lot, osd-required, heritage-conservation-area, swimming-pool]
