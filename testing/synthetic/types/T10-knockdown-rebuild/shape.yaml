schema: sitewise-synthetic-shape/1
type_id: T10
slug: knockdown-rebuild
name: Knock-down rebuild house
reviewed: false
state: NSW
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
# Base: architect-led traditional knock-down rebuild of a 1962 fibro and brick-veneer house, one CDC for
# demolition and the new two-storey house. The project-home package is the builder-designs trigger.
profile:
  hdr.building_class: residential
  hdr.subclass: house
  hdr.work_type: new
  hdr.cond.planning: cdc
  hdr.cond.procurement_route: traditional
  hdr.cond.quality_level: high
  hdr.cond.operational_constraints: vacant
  hdr.cond.stakeholder_complexity: single_owner
  hdr.cond.access_constraints: unrestricted
  hdr.cond.environmental_sensitivity: standard
  hdr.scale.storeys: 2
  hdr.scale.site_sqm: 620
  hdr.scale.gfa_sqm: 300
  hdr.scale.bedrooms: 4
  hdr.scale.bathrooms: 3
  hdr.scale.garage_spaces: 2
  det.ncc_class: [1a, 10a]
  det.state: NSW
  # Demolition is work to an existing building; see DOMAIN.md §3 for the knock-on RFP rows.
  det.existing_building: true
  det.existing_building_year: 1962
  det.heritage_status: none
  det.bushfire_prone_land: false
  det.flood_hazard: false
  det.climate_zone: "5"
  det.sewer_connection: reticulated
  det.water_supply_source: reticulated
  det.gas_supply: none
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  fact.contract_form: domestic_hia
  proj.regulated_design: "no"
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.basement: "no"
  flag.excavation_adjoining: "no"
  flag.authority_asset: "no"
  flag.arborist_tree_impacts: "no"
  flag.osd_required: "no"
  flag.osd_existing: "no"
  flag.cl46: "no"
  flag.public_road: "no"
  flag.norbe: "no"
  flag.stormwater_quality: "no"
  flag.sustainability_target: "no"
  flag.panel: "no"
  flag.community: "no"
  flag.groundwater: "no"
  flag.rail: "no"
  flag.transfer_structures: "no"
  flag.coastal: "no"
  flag.country: "no"
  flag.staged: "no"
  flag.multi_building: "no"
  flag.architect_lodges: "yes"

expected_derived:
  - {key: det.basix_required, value: true, source: "knowledge/clusters/envelope/rules.yaml rule.basix.certificate-required", note: "A knock-down rebuild is a new dwelling for BASIX; derivation pending in the rule, returns unknown today"}
  - {key: det.energy_compliance_pathway, value: basix, note: "no profile_group, so not settable"}

scenario_inputs:
  - {key: proj.budget_stated, note: "stated in the owner's brief; amount chosen by the scenario author; without it the architecture RFP blocks on fact:budget", phrasing: "Construction budget: $<amount> excluding GST"}
  - {key: flag.architect_lodges, note: "needs an explicit statement in a read document", phrasing: "The architect's services run from concept design through to lodging the complying development certificate application on the NSW Planning Portal"}
  - {key: det.existing_building, note: "the determinant's only trigger is the phrase 'existing building'; 'existing dwelling' alone is never asked", phrasing: "The site contains an existing building (a single-storey dwelling, detached garage and shed), all to be demolished"}
  - {key: det.existing_building_year, note: "the year triggers need 'built in <year>' or 'year built'; '1960s' is missed", phrasing: "The existing dwelling was built in 1962"}
  - {key: det.ncc_class, note: "'Class 1 dwelling' is not read as a class", phrasing: "Building classification: Class 1a dwelling with an attached Class 10a garage"}

work_items:
  - {system: site.demolition, action: remove, why: "Demolish house, garage and shed, slabs, footings, paths and old driveway; hazmat survey, licensed asbestos removal and clearance, AS 2601 work plan, waste separation; not in the default list, and implied_by strip-out gives action new"}
  - {system: site.adjoining-structures, action: investigate, why: "Pre-demolition and post-completion dilapidation surveys of the adjoining houses, fences and boundary walls; not in the default list"}
  - {system: site.trees, action: retain, why: "Protect the council street tree and retained rear-yard trees during demolition and construction; not in the default list"}
  - {system: site.survey-boundaries, action: new, why: "Building set-out and identification surveys"}
  - {system: site.ground-conditions, action: investigate, why: "AS 2870 site classification from boreholes clear of the existing house; may be confirmed after demolition; not in the default list"}
  - {system: site.earthworks, action: new, why: "Strip the old platform and fill, cut and fill to the new slab platform"}
  - {system: site.erosion-sediment-control, action: new, why: "Sediment controls before demolition, the first disturbance"}
  - {system: site.stormwater-detention, action: new, why: "New site stormwater; old earthenware line and kerb outlet replaced; illegal sewer connections removed"}
  - {system: site.services-connections, action: new, why: "Reused or upgraded meter, sewer junction and supply point; new private lines"}
  - {system: site.vehicle-access, action: new, why: "New driveway and paths; old driveway demolished"}
  - {system: site.public-domain, action: new, why: "Rebuilt vehicle crossing and redundant layback reinstated to kerb under Roads Act s138 (verified: false); not in the default list"}
  - {system: site.landscape, action: new, why: "Turf, planting, paving, fencing"}
  - {system: substructure.footings, action: new, why: "As T01"}
  - {system: substructure.slab-on-ground, action: new, why: "As T01; old footings removed, not reused"}
  - {system: substructure.termite-management, action: new, why: "AS 3660.1 barrier"}
  - {system: structure.timber, action: new, why: "Frames, trusses, upper floor, bracing"}
  - {system: structure.masonry, action: new, why: "Brick veneer; not in the default list"}
  - {system: structure.steel, action: new, why: "Steel or LVL beams; not in the default list"}
  - {system: envelope.external-walls, action: new, why: "Brick veneer and cladding"}
  - {system: envelope.roof-coverings, action: new, why: "Metal roof"}
  - {system: envelope.windows-doors, action: new, why: "Aluminium windows and doors; long lead"}
  - {system: envelope.vehicle-doors, action: new, why: "Garage door"}
  - {system: envelope.flashings-seals, action: new, why: "Flashings and DPCs"}
  - {system: envelope.pliable-membranes, action: new, why: "Sarking and wall wrap"}
  - {system: envelope.thermal-insulation, action: new, why: "NatHERS insulation"}
  - {system: envelope.thermal-performance, action: new, why: "BASIX commitments"}
  - {system: interiors.walls-linings, action: new, why: "Plasterboard"}
  - {system: interiors.ceilings, action: new, why: "Ceilings"}
  - {system: interiors.wet-area-waterproofing, action: new, why: "AS 3740"}
  - {system: interiors.tiling, action: new, why: "Wet areas"}
  - {system: interiors.floor-finishes, action: new, why: "Floors"}
  - {system: interiors.joinery, action: new, why: "Kitchen, vanities, robes; long lead"}
  - {system: interiors.internal-doors, action: new, why: "Doors"}
  - {system: interiors.internal-glazing, action: new, why: "Shower screens, mirrors"}
  - {system: interiors.painting, action: new, why: "Painting"}
  - {system: interiors.ffe, action: new, why: "Appliances as PC items; not in the default list"}
  - {system: fire-active.smoke-alarms, action: new, why: "Interconnected smoke alarms"}
  - {system: mechanical.air-conditioning, action: new, why: "Ducted AC"}
  - {system: mechanical.local-exhaust, action: new, why: "Exhaust fans and rangehood"}
  - {system: hydraulic.cold-water, action: new, why: "Water reticulation"}
  - {system: hydraulic.hot-water, action: new, why: "Heat-pump hot water"}
  - {system: hydraulic.sanitary, action: new, why: "Drainage to the existing junction"}
  - {system: hydraulic.roof-drainage, action: new, why: "Gutters and downpipes"}
  - {system: hydraulic.non-potable-water, action: new, why: "BASIX rainwater tank; not in the default list"}
  - {system: hydraulic.gas, action: remove, why: "Existing gas meter and service abolished by the network before demolition; new house all-electric; not in the default list"}
  - {system: electrical.utility-supply, action: new, why: "New DNSP service after the old overhead service is abolished; long lead"}
  - {system: electrical.temporary-power, action: new, why: "Builder's temporary supply once the house supply is abolished; not in the default list"}
  - {system: electrical.switchboards, action: new, why: "Switchboard"}
  - {system: electrical.cabling-wiring, action: new, why: "Wiring"}
  - {system: electrical.lighting, action: new, why: "Lighting"}
  - {system: comms-security.carrier-lead-in, action: new, why: "Old lead-in removed; new NBN lead-in"}
  - {system: comms-security.structured-cabling, action: new, why: "Data and TV"}
  - {system: access-egress.stairs-and-ramps, action: new, why: "Internal stair; not in the default list"}
  - {system: access-egress.barriers, action: new, why: "Balustrades and window fall protection; not in the default list"}

procurement:
  - {discipline: consultant.architect, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Design lead, demolition plan, CDC and construction documents, tender"}
  - {discipline: consultant.surveyor, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Detail survey including the existing house, trees, pits, kerb outlet and sewer junction; set-out and identification surveys"}
  - {discipline: consultant.hazmat, kind: services, need: always, built_in: "no", why: "Demolition hazardous materials survey, asbestos register, removal scope and clearance for a pre-2004 house; no package rule reads site.demolition"}
  - {discipline: consultant.geotechnical, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "AS 2870 site class from boreholes clear of the house"}
  - {discipline: consultant.structural, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Slab, footings, framing, CDC design certificate, inspections"}
  - {discipline: consultant.civil, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "New stormwater, assessment of the existing outlet line, driveway levels, sediment control"}
  - {discipline: consultant.basix, kind: services, need: always, built_in: "no", why: "NatHERS and BASIX for the new dwelling, lodged with the CDC; no package rule"}
  - {discipline: consultant.certifier, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Determines the CDC (demolition and dwelling), principal certifier, R7 inspections incl. the pre-start site inspection before the CDC is determined, OC"}
  - {discipline: consultant.building, kind: services, need: usually, built_in: "no", why: "Pre-demolition and post-completion dilapidation reports of the adjoining properties; no package rule"}
  - {discipline: consultant.quantity_surveyor, kind: services, need: optional, built_in: "no", why: "Cost plan incl. demolition, asbestos and latent-condition allowances"}
  - {discipline: trade.main_works, kind: works, need: always, built_in: "partial", source: "internal/procurement/proposed.go ProposeHeadContract", why: "Head contract including licensed demolition and asbestos removal subcontractors; proposed only from gaps on accepted work items"}

not_expected_procurement:
  - {discipline: consultant.town_planner, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "A code-compliant CDC needs no SEE or DA management; its RFP blocks on cdc"}
  - {discipline: consultant.electrical, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Design-and-install by the electrician"}
  - {discipline: consultant.hydraulic, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Design-and-install by the plumber; also reinforced by the hydraulic.gas remove item via scope_additions[3]"}
  - {discipline: consultant.mechanical, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml scope_additions[2]", why: "Design-and-install by the AC subcontractor"}

cost_plan:
  - {line: "CDC fee and certifier's lodgement charges", section: fees_and_charges, built_in: "partial", source: "knowledge/costs/starter_lines.yaml cc-fees", why: "No CDC line; the app keeps 'Construction certificate and certifier fees' on CDC though no CC issues"}
  - {line: "Development contributions (s7.11 or s7.12), if levied", section: fees_and_charges, built_in: "no", why: "The da-fees starter that holds contributions is dropped for cdc; often small or nil for one-for-one replacement (verified: false)"}
  - {line: "Service authority connection and disconnection fees (DNSP abolishment and connection, gas abolishment, Sydney Water, NBN)", section: fees_and_charges, built_in: "partial", source: "knowledge/costs/starter_lines.yaml service-authority", why: "One generic line; nothing names abolishment"}
  - {line: "Long service levy", section: fees_and_charges, built_in: "no", why: "Paid before the CDC is issued (verified: false)"}
  - {line: "Council road-reserve fees, damage deposit and street-tree bond (s138 crossing, skip and plant occupancy)", section: fees_and_charges, built_in: "no", why: "Standard for a knock-down"}
  - {line: "Home Building Compensation Fund insurance", section: fees_and_charges, built_in: "no", why: "Builder's premium inside the contract sum; listed so an exclusion is caught (R4)"}
  - {line: "Architect", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line from the adopted package"}
  - {line: "Surveyor", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line"}
  - {line: "Hazardous materials consultant", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Geotechnical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line"}
  - {line: "Structural engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line"}
  - {line: "Civil (stormwater) engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line"}
  - {line: "BASIX and NatHERS assessor", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Certifier", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Professional fee; P05 duplicates it"}
  - {line: "Dilapidation surveys (building consultant)", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Quantity surveyor (optional)", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Preliminaries and builder's margin", section: construction, built_in: "no", why: "No line; a stated budget spreads preliminaries pro rata"}
  - {line: "Demolition and hazardous materials removal", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 01", why: "site.demolition rolls into 01 Site works; no line of its own and no demolition share in residential_house_new"}
  - {line: "Services disconnections and make-safe before demolition", section: construction, built_in: "no", why: "Electrical, gas, sewer capping, telecom; no item or line"}
  - {line: "Site works and external works", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 01", why: "Earthworks, stormwater, services, driveway, crossing and layback, landscape, tree protection"}
  - {line: "Substructure", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 02", why: "As T01"}
  - {line: "Structure", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 03", why: "As T01"}
  - {line: "Building envelope", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 04", why: "As T01"}
  - {line: "Interiors and finishes", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 05", why: "As T01"}
  - {line: "Mechanical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 08", why: "As T01"}
  - {line: "Hydraulic services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 09", why: "As T01 incl. rainwater tank"}
  - {line: "Electrical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 10", why: "As T01; smoke alarms belong here"}
  - {line: "Communications and security", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 11", why: "NBN lead-in"}
  - {line: "Stairs, ramps, handrails and nosings", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 13", why: "Only when implied_by stair adds the system from a read document"}
  - {line: "Compliant balustrades and barriers", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml code 13", why: "Only when a document or the user adds access-egress.barriers; no implied_by pattern"}
  - {line: "Provisional sums and PC items", section: construction, built_in: "no", why: "Selections"}
  - {line: "Provisional sum for latent ground conditions after demolition", section: construction, built_in: "no", why: "Old footings, rubble, buried drainage, fill, unexpected asbestos"}
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml design-contingency", why: "Always"}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml construction-contingency", why: "Always"}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml escalation", why: "Always"}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml exclusions", why: "Always"}
  - {line: "Owner costs: temporary accommodation, removal and storage, vacant-house insurance", section: contingency, built_in: "no", why: "Owner's own costs during the build; no contract carries them"}

not_expected_cost_plan:
  - {line: "Town planner (consultant fee)", app_label: "F10 Town Planner", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Adopted suggestion on cost-plan prepare; not needed for a CDC"}
  - {line: "Electrical (consultant fee)", app_label: "F04 Electrical", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Adopted suggestion"}
  - {line: "Hydraulic (consultant fee)", app_label: "F06 Hydraulic", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Adopted suggestion"}
  - {line: "Mechanical (consultant fee)", app_label: "F07 Mechanical", section: consultants, source: "knowledge/works/package_defaults.yaml scope_additions[2]", why: "Adopted suggestion"}
  - {line: "Active fire protection", app_label: "07 Active fire protection", section: construction, source: "knowledge/costs/elements.yaml code 07", why: "Made from the smoke-alarm item; a QS carries it in electrical"}

program:
  skeleton: sk.new-traditional-cdc
  activities:
    - {label: "Planning certificate and title search", stage: investigation, fragment: null, after: [], built_in: "no", why: "s10.7 certificate (verified: false), title, easements, encroachments"}
    - {label: "CDC eligibility check against the Housing Code", stage: investigation, fragment: null, after: ["Planning certificate and title search"], built_in: "no", why: "Lot, heritage, bushfire, flood, easements, tree permits decide CDC or DA"}
    - {label: "Loose-fill asbestos register search", stage: investigation, fragment: null, after: [], built_in: "no", why: "NSW LFAI register"}
    - {label: "Sydney Water asset and sewer diagram check", stage: investigation, fragment: null, after: [], built_in: "no", why: "Sewer main in the lot, junction location"}
    - {label: "Services search and locating", stage: investigation, fragment: fr.investigate-services, after: [], built_in: "partial", source: "knowledge/program/fragments.yaml fr.investigate-services", why: "Needs an investigate action; default is new"}
    - {label: "Detail and boundary survey", stage: investigation, fragment: fr.investigate-survey, after: [], built_in: "partial", source: "knowledge/program/fragments.yaml fr.investigate-survey", why: "Needs an investigate action; default is new. Knock-down detail: picks up the existing house, garage, shed, trees, pits, kerb outlet and sewer junction"}
    - {label: "Demolition hazardous materials survey", stage: investigation, fragment: null, after: [], built_in: "no", why: "A hazmat activity exists only in fr.existing-conditions, gated to refurb or extend (gap)"}
    - {label: "Geotechnical investigation", stage: investigation, fragment: fr.investigate-geotech, after: [], built_in: "partial", source: "knowledge/program/fragments.yaml fr.investigate-geotech", why: "site.ground-conditions is not in default scope; boreholes clear of the house"}
    - {label: "CCTV or locate the existing drainage and kerb outlet", stage: investigation, fragment: null, after: [], built_in: "no", why: "Decides reuse of the outlet; finds illegal sewer connections"}
    - {label: "Confirm the brief", stage: concept_design, fragment: fr.concept-design-1a, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Brief"}
    - {label: "Prepare the concept design", stage: concept_design, fragment: fr.concept-design-1a, after: ["Confirm the brief", "Detail and boundary survey", "CDC eligibility check against the Housing Code"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Concept on the survey"}
    - {label: "Client review of the concept", stage: concept_design, fragment: fr.concept-design-1a, after: ["Prepare the concept design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Owner approval"}
    - {label: "Develop the design", stage: concept_design, fragment: fr.design-development-1a, after: ["Client review of the concept", "Geotechnical investigation", "Demolition hazardous materials survey"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.design-development-1a", why: "Design development"}
    - {label: "NatHERS assessment and BASIX certificate", stage: approval_documentation, fragment: null, after: ["Develop the design"], built_in: "no", why: "Lodged with the CDC"}
    - {label: "Stormwater drainage design", stage: approval_documentation, fragment: null, after: ["Develop the design", "CCTV or locate the existing drainage and kerb outlet"], built_in: "no", why: "Discharge confirmed for the CDC"}
    - {label: "Demolition plan, demolition work plan and waste plan", stage: approval_documentation, fragment: null, after: ["Demolition hazardous materials survey"], built_in: "no", why: "Demolition Code and certifier requirements; AS 2601"}
    - {label: "Prepare approval documentation", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "CDC drawings"}
    - {label: "Coordinate consultant reports", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "Survey, hazmat, geotech inputs"}
    - {label: "Prepare construction documentation", stage: approval_documentation, fragment: fr.construction-docs-1a, after: ["Prepare approval documentation"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-docs-1a", why: "The CDC needs CC-level documents; the skeleton has no construction_documentation stage so resolveStage places it here (read, not run)"}
    - {label: "Coordinate consultant documentation", stage: approval_documentation, fragment: fr.construction-docs-1a, after: ["Prepare approval documentation"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-docs-1a", why: "Structural and stormwater design for the CDC"}
    - {label: "Client sign-off for lodgement", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Prepare construction documentation", "Coordinate consultant documentation", "NatHERS assessment and BASIX certificate", "Stormwater drainage design", "Demolition plan, demolition work plan and waste plan"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "Sign-off"}
    - {label: "Client sign-off for tender", stage: approval_documentation, fragment: fr.construction-docs-1a, after: ["Client sign-off for lodgement"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-docs-1a", why: "Tender on the CDC set"}
    - {label: "Sydney Water Tap in approval", stage: approvals, fragment: null, after: ["Coordinate consultant documentation"], built_in: "no", why: "Building plan approval before the CDC"}
    - {label: "Pay long service levy", stage: approvals, fragment: null, after: ["Client sign-off for lodgement"], built_in: "no", why: "Before the CDC is issued (verified: false)"}
    - {label: "Prepare and lodge the complying development certificate", stage: approvals, fragment: fr.cdc-application, after: ["Client sign-off for lodgement"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.cdc-application", why: "One CDC for demolition and the new dwelling; the app fragment links to nothing"}
    - {label: "Certifier notifies neighbours of the CDC application", stage: approvals, fragment: null, after: ["Prepare and lodge the complying development certificate"], built_in: "no", why: "Pre-determination notice (EP&A Regulation 2021, verified: false)"}
    - {label: "Pre-start site inspection by the certifier (R7 item 1)", stage: approvals, fragment: null, after: ["Prepare and lodge the complying development certificate"], built_in: "no", why: "Before the CDC is determined, with the existing house still standing; the clause stays verified: false"}
    - {label: "Certifier determination", stage: approvals, fragment: fr.cdc-application, after: ["Certifier notifies neighbours of the CDC application", "Sydney Water Tap in approval", "Pay long service levy", "Pre-start site inspection by the certifier (R7 item 1)"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.cdc-application", why: "du.cdc-determination-period statutory row"}
