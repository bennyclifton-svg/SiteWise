  - discipline: consultant.certifier
    template: bca-certification
    built_in: "partial"
    source: "knowledge/rfp/bca-certification.yaml unsupported_pathways"
    why: "The template blocks on cdc and its certification stages need da or ssd"
    must_include: ["CDC assessment and determination for demolition and the new dwelling, with neighbour notification", "Principal certifier services", "Pre-start site inspection before determining the CDC (R7 item 1)", "Every R7 critical-stage inspection", "Occupation certificate with BASIX completion check"]
    must_not_include: ["Package A BCA advisory", "Design", "Building supervision", "Performance solution authorship", "Fire referrals"]
    expect:
      stages_include: [b2_construction_approval, b3_construction, b4_occupation]
      stages_option: []
      stages_absent: [a1_inception, a2_planning, a3_tender, a4_construction, b1_preliminary]
      positions: {statutory_functions: I, evidence_registers: I, residential_evidence: I, performance_assessment: O, extra_visits: O, specialist_design: X, other_approvals: X, supervision: X, existing_assessment: absent, classification_map: absent, staged_occupation: absent, fire_referrals: absent}
      blocking: []
      sources: ["b2_construction_approval stands for the CDC assessment; the template has no CDC stage"]
    app_differs:
      - {key: text.blocking, app: "pathway_unsupported (cdc)", expect: "none", why: "bca-certification.yaml unsupported_pathways lists cdc"}
      - {key: stage.b2_construction_approval, app: absent, expect: include, why: "when needs pathway da or ssd"}
      - {key: stage.b3_construction, app: absent, expect: include, why: "when needs pathway da or ssd"}
      - {key: stage.b4_occupation, app: absent, expect: include, why: "when needs pathway da or ssd"}
      - {key: stage.a1_inception, app: ask, expect: absent, why: "boundary falls back to a1..a3 without the client flag bca_certification"}
      - {key: stage.a3_tender, app: ask, expect: absent, why: "as above"}
      - {key: position.statutory_functions, app: ask, expect: I, why: "row needs the client flag bca_certification"}
      - {key: position.residential_evidence, app: ask, expect: I, why: "client flag bca_residential_evidence"}
  - discipline: consultant.hazmat
    template: null
    built_in: "no"
    must_include: ["Demolition hazardous materials survey of every structure with destructive sampling", "Asbestos register and removal scope by material, location and friable or bonded state", "Lead paint, SMF and PCB identification", "LFAI register check", "Clearance inspection and certificate after removal", "Option: visual soil clearance after demolition"]
    must_not_include: ["Removal works", "Soil contamination assessment", "Air monitoring for bonded removal", "Refurbishment survey limited to affected areas"]
  - discipline: consultant.basix
    template: null
    built_in: "no"
    must_include: ["NatHERS thermal assessment with stamped plans", "BASIX certificate for a new dwelling for the CDC lodgement"]
    must_not_include: ["NCC Section J", "Green Star", "NABERS"]
  - discipline: consultant.building
    template: null
    built_in: "no"
    must_include: ["Pre-demolition dilapidation report for each adjoining property: photographs, crack mapping, fences and boundary walls", "Copy to each owner", "Post-completion survey with comparison"]
    must_not_include: ["Structural design", "Vibration monitoring with trigger levels", "Defect inspections of the new house"]
  - discipline: consultant.quantity_surveyor
    template: cost-planning
    built_in: "partial"
    source: "knowledge/rfp/cost-planning.yaml"
    must_include: ["Cost basis", "Concept estimate", "Pre-tender estimate with demolition, asbestos, disconnection and latent-condition allowances", "Tender comparison"]
    must_not_include: ["Final account unless selected", "Remediation costs"]
    expect:
      stages_include: [s1_basis, s2_concept, s4_design]
      stages_option: [s3_authority, s5_tender, s7_completion]
      stages_absent: [s6_construction, s8_advice]
      blocking: []
    app_differs:
      - {key: stage.s2_concept, app: ask, expect: include, why: "client flag cost_concept"}
      - {key: stage.s4_design, app: ask, expect: include, why: "client flag cost_design"}
      - {key: stage.s3_authority, app: ask, expect: option, why: "client flag cost_authority"}
      - {key: stage.s6_construction, app: option, expect: absent, why: "default option"}

triggers:
  - id: da-pathway
    label: Development application instead of a CDC
    evidence: ["A development application will be lodged for demolition of the existing dwelling and construction of a new two-storey dwelling", "the second storey exceeds the Housing Code side setback, so complying development is not available"]
    negation: ["The demolition and new dwelling will be approved by a complying development certificate"]
    profile: [hdr.cond.planning]
    adds:
      procurement: [consultant.town_planner, consultant.landscape]
      cost_plan: ["DA fees and contributions", "Landscape designer", "Town planner"]
      program: ["Lodge the DA", "Neighbour notification", "DA assessment and determination", "Construction certificate"]
      rfps: [{discipline: consultant.town_planner, must_include: ["SEE covering demolition and the new dwelling"]}, {discipline: consultant.landscape, must_include: ["DA landscape plan to the DCP"]}, {discipline: consultant.certifier, must_include: ["CC assessment (package B)"]}]
      authority: ["DA for demolition and the new dwelling; construction certificate"]
    removes:
      cost_plan: ["CDC fee and certifier's lodgement charges"]
      program: ["Prepare and lodge the complying development certificate", "Certifier notifies neighbours of the CDC application", "Certifier determination", "CDC eligibility check against the Housing Code"]
    why: "Skeleton becomes sk.new-traditional-da; town planner becomes needed, its RFP stops blocking; certifier B stages become available"
    built_in: {procurement: "partial", program: "yes", cost_plan: "yes", rfps: "partial"}
    source: "knowledge/costs/starter_lines.yaml da-fees"
  - id: builder-designs
    label: Project-home knock-down rebuild package
    evidence: ["Knock-down rebuild package with a project-home builder, demolition included", "the builder's drafting team prepares the CDC drawings", "site costs quote after the builder's site inspection"]
    negation: ["Architect-designed house, select tender to three builders"]
    profile: [hdr.cond.procurement_route]
    adds:
      program: ["Sign the builder's preliminary agreement", "Builder's site inspection and site costs", "Builder prepares the CDC set", "Sign the new-home contract"]
      rfps: [{discipline: consultant.certifier, must_include: ["Principal certifier for a builder-designed house"]}]
    removes:
      procurement: [consultant.architect, consultant.structural, consultant.civil, consultant.geotechnical, consultant.surveyor, consultant.basix, consultant.hazmat, consultant.building]
      program: ["Assemble the tender package", "Tender period", "Evaluate tenders"]
      rfps: [consultant.architect, consultant.structural, consultant.civil, consultant.geotechnical, consultant.surveyor, consultant.basix, consultant.hazmat, consultant.building]
    why: "The builder arranges survey, soil test, BASIX, hazmat and demolition within its contract. The app sets novation option and fr.novation, and design_construct with cdc matches no skeleton (sk.generic)"
    built_in: {procurement: "no", program: "no", rfps: "no"}
  - id: separate-demolition-contract
    label: Owner engages the demolisher under a separate contract
    evidence: ["Stage 1: demolition by a separately engaged licensed demolisher; Stage 2: the new dwelling", "the site will be handed to the builder clear and level", "demolition-only complying development certificate"]
    negation: ["Demolition and asbestos removal are included in the builder's contract"]
    profile: []
    adds:
      cost_plan: ["Demolition contract (separate)", "Provisional sum for latent conditions and asbestos variations (owner-held)"]
      program: ["Engage the demolition contractor", "Demolition-only CDC, only where demolition is approved apart from the dwelling (verified: false)", "Hand over a clear site to the builder"]
      authority: ["A separate demolisher can work under the same CDC; a demolition-only CDC under the Demolition Code only where demolition is approved separately (verified: false)"]
    why: "No demolition trade id exists for the separate works package; the owner takes the latent-condition risk; 'Stage 1' wakes flag.staged. fr.demolition-1a already fires in the base, so the trigger adds nothing the app produces"
    built_in: {program: "no", cost_plan: "no"}
  - id: loose-fill-asbestos
    label: Loose-fill asbestos insulation (LFAI register)
    evidence: ["The property is listed on the NSW Loose-Fill Asbestos Insulation Register", "Mr Fluffy insulation in the roof space"]
    negation: ["A search of the LFAI register returned no listing"]
    profile: [det.potentially_contaminated_land]
    adds:
      procurement: [consultant.environmental]
      work_items: [{system: site.contamination, action: investigate}]
      cost_plan: ["Class A friable asbestos removal with enclosure and air monitoring", "Soil assessment and remediation of the footprint"]
      program: ["Friable asbestos removal under enclosure", "Licensed asbestos assessor clearance", "Post-demolition soil assessment and remediation"]
      authority: ["SafeWork NSW Class A notification; NSW loose-fill program and council process (verified: false)"]
    built_in: {procurement: "no", work_items: "no", program: "partial", cost_plan: "no"}
    source: "knowledge/program/fragments.yaml fr.investigate-contamination"
  - id: friable-asbestos
    label: Friable asbestos found by the demolition survey
    evidence: ["Friable asbestos pipe lagging was identified in the subfloor", "the hazardous materials survey found friable asbestos in the old heater flue"]
    negation: ["No friable asbestos was identified; all asbestos-containing materials are bonded"]
    profile: []
    adds:
      cost_plan: ["Class A friable asbestos removal with enclosure and air monitoring"]
      program: ["Friable asbestos removal under enclosure", "Licensed asbestos assessor clearance"]
      rfps: [{discipline: consultant.hazmat, must_include: ["Air monitoring during friable removal", "Licensed asbestos assessor clearance"]}]
      authority: ["SafeWork NSW Class A licensed removal notification (verified: false)"]
    built_in: {cost_plan: "no", program: "no", rfps: "no"}
  - id: asbestos-dividing-fence
    label: Asbestos cement dividing fence to be removed
    evidence: ["The side and rear dividing fences are fibro (asbestos cement) sheeting", "replace the existing fibro boundary fences with Colorbond by agreement with the neighbours"]
    negation: ["Dividing fences are timber paling and are retained"]
    profile: []
    adds:
      cost_plan: ["Asbestos fence removal and replacement fencing (owner share)"]
      program: ["Fencing notices and agreement with neighbours", "Licensed removal of asbestos fencing"]
      rfps: [{discipline: consultant.hazmat, must_include: ["Dividing fences in the survey and removal scope"]}]
      authority: ["Dividing Fences Act 1991 notice (verified: false)"]
    built_in: {cost_plan: "no", program: "no", rfps: "no"}
  - id: asbestos-in-soil
    label: Asbestos fragments in soil or fill
    evidence: ["Asbestos cement fragments in the soil where the old fibro garage stood", "fill in the rear yard contains asbestos fragments"]
    negation: ["No asbestos-containing material was observed in soil"]
    profile: [det.potentially_contaminated_land]
    adds:
      procurement: [consultant.environmental]
      work_items: [{system: site.contamination, action: investigate}]
      cost_plan: ["Asbestos-in-soil assessment, removal and clearance"]
      program: ["Asbestos-in-soil assessment", "Remove impacted soil and clearance"]
      rfps: [{discipline: consultant.civil, must_include: ["Earthworks suitability coordinated with the environmental advice"]}]
    built_in: {procurement: "no", work_items: "no", program: "partial", rfps: "yes", cost_plan: "no"}
    source: "knowledge/rfp/civil.yaml earthworks_suitability"
  - id: trees-affected
    label: Trees on or near the lot affected by demolition or the new house
    evidence: ["The new driveway is within the TPZ of the street tree", "remove the camphor laurel near the rear boundary", "demolition machinery must pass under the neighbour's fig"]
    negation: ["No trees are affected; all works are outside tree protection zones", "Tree removal: nil"]
    profile: [flag.arborist_tree_impacts, flag.arborist_offsite_trees]
    adds:
      procurement: [consultant.arborist]
      cost_plan: ["Arborist", "Council tree permit and tree bond"]
      program: ["Arborist impact assessment", "Council tree permit", "Install tree protection"]
      rfps: [{discipline: consultant.arborist, must_include: ["AS 4970 impact assessment", "Tree protection plan covering demolition", "Supervision hold points"]}]
      authority: ["Council tree permit; a CDC cannot approve removal of a protected tree (verified: false)"]
    built_in: {procurement: "no", program: "partial", rfps: "yes", cost_plan: "no"}
    source: "knowledge/rfp/arborist.yaml s2_impact"
  - id: heritage-conservation-area
    label: Lot in a heritage conservation area
    evidence: ["The site is within a heritage conservation area; demolition of the dwelling requires consent", "the dwelling is identified as a contributory building"]
    negation: ["The site is not a heritage item and is not in a conservation area"]
    profile: [det.heritage_status, hdr.cond.planning]
    adds:
      procurement: [consultant.heritage, consultant.town_planner]
      cost_plan: ["Heritage consultant", "DA fees and contributions"]
      program: ["Heritage impact statement justifying demolition", "Heritage referral", "Lodge the DA"]
      rfps: [{discipline: consultant.town_planner, must_include: ["Heritage controls and demolition justification in the SEE"]}]
      authority: ["DA required; council heritage referral"]
    removes:
      program: ["Prepare and lodge the complying development certificate", "Certifier determination"]
    built_in: {procurement: "yes", program: "partial", cost_plan: "yes", rfps: "partial"}
    source: "knowledge/works/package_defaults.yaml complexity_additions[1]"
  - id: stormwater-no-gravity
    label: No legal point of discharge by gravity
    evidence: ["The existing house drains to a rubble pit in the rear yard", "the lot falls to the rear; an interallotment drainage easement over No. 12 is needed", "no legal point of discharge"]
    negation: ["Stormwater discharges by gravity to the kerb through the existing outlet, to be replaced"]
    profile: []
    adds:
      cost_plan: ["Easement survey, legal and compensation costs", "Pump-out or absorption system"]
      program: ["Negotiate drainage easement with the downhill owner", "Register the easement"]
      rfps: [{discipline: consultant.civil, must_include: ["Easement or pump-out design with discharge confirmed before CDC lodgement"]}]
      authority: ["Downhill owner's consent and easement registration"]
    built_in: {cost_plan: "no", program: "no", rfps: "no"}
  - id: osd-required
    label: Council requires on-site detention for the new dwelling
    evidence: ["OSD is required because the impervious area increases", "council's stormwater policy requires on-site detention for new dwellings"]
    negation: ["No OSD is required for a replacement dwelling of similar impervious area"]
    profile: [flag.osd_required]
    adds:
      cost_plan: ["On-site detention tank"]
      program: ["Install OSD tank"]
      rfps: [{discipline: consultant.civil, must_include: ["On-site detention design"]}]
      authority: ["Positive covenant and restriction on title"]
    built_in: {rfps: "yes", cost_plan: "partial", program: "no"}
    source: "knowledge/rfp/civil.yaml osd_new"
  - id: sewer-main-in-lot
    label: Sydney Water sewer main inside the lot
    evidence: ["A Sydney Water sewer main crosses the rear of the lot under the old garage", "build over or next to a Sydney Water asset"]
    negation: ["No Sydney Water assets are within the property"]
    profile: [flag.authority_asset]
    adds:
      work_items: [{system: substructure.piles, action: new}]
      cost_plan: ["Piers below the zone of influence", "CCTV of the main before and after"]
      program: ["Sydney Water building-over or adjacent-asset approval"]
      rfps: [{discipline: consultant.structural, must_include: ["Authority asset assessment"]}, {discipline: consultant.architect, must_include: ["Water authority asset submission"]}]
      authority: ["Sydney Water Tap in asset assessment"]
    built_in: {work_items: "no", rfps: "yes", program: "no", cost_plan: "partial"}
    source: "knowledge/rfp/structural.yaml authority_asset"
  - id: excavation-adjoining
    label: Excavation or vibration next to a neighbour's house
    evidence: ["Excavation for the garage within 900 mm of the neighbour's house", "rock breaking near the side boundary", "neighbour's footings within the zone of influence"]
    negation: ["Slab on ground at natural level; no excavation near the boundaries"]
    profile: [flag.excavation_adjoining]
    adds:
      cost_plan: ["Shoring or retention at the boundary", "Vibration monitoring"]
      program: ["Excavate and shore"]
      rfps: [{discipline: consultant.structural, must_include: ["Retention design", "Option: dilapidation surveys"]}, {discipline: consultant.civil, must_include: ["Option: shoring"]}]
    built_in: {rfps: "yes", cost_plan: "partial", program: "no"}
    source: "knowledge/rfp/structural.yaml dilapidation"
  - id: bushfire-prone
    label: Bushfire-prone land with a BAL rating
    evidence: ["The site is mapped as bush fire prone land, BAL-29", "the lot backs onto the bushland reserve"]
    negation: ["The land is not identified as bush fire prone land on the planning certificate"]
    profile: [det.bushfire_prone_land, det.bal]
    adds:
      procurement: [consultant.bushfire]
      work_items: [{system: envelope.bushfire-construction, action: new}]
      cost_plan: ["Bushfire consultant", "AS 3959 construction upgrades"]
      program: ["BAL assessment", "Install bushfire construction measures"]
      authority: ["CDC unavailable at BAL-40 or FZ (verified: false)"]
    built_in: {procurement: "yes", work_items: "no", program: "partial", cost_plan: "partial"}
    source: "knowledge/works/package_defaults.yaml complexity_additions[5]"
  - id: flood-affected
    label: Flood-affected lot
    evidence: ["The land is subject to flood related development controls", "habitable floor 500 mm above the 1% AEP flood level"]
    negation: ["The land is not subject to flood related development controls"]
    profile: [det.flood_hazard]
    adds:
      work_items: [{system: site.flooding, action: new}]
      cost_plan: ["Flood report", "Flood-compatible construction below the flood planning level"]
      program: ["Obtain council flood advice", "Construct flood protection"]
      rfps: [{discipline: consultant.civil, must_include: ["Flood report and floor levels"]}]
      authority: ["Council flood advice; CDC conditions or a DA (verified: false)"]
    built_in: {work_items: "no", rfps: "yes", program: "partial", cost_plan: "no"}
    source: "knowledge/rfp/civil.yaml flood_report"
  - id: existing-pool
    label: Existing pool to be demolished
    evidence: ["Demolish the existing in-ground pool and backfill", "the old fibreglass pool in the back yard will be removed"]
    negation: ["There is no pool on the site"]
    profile: []
    adds:
      work_items: [{system: site.pools, action: remove}]
      cost_plan: ["Demolish and backfill the existing pool with compaction testing"]
      program: ["Drain, break out and backfill the pool", "Remove the pool from the register (verified: false)"]
      rfps: [{discipline: consultant.geotechnical, must_include: ["Compaction testing of pool backfill under the new footprint"]}]
    built_in: {work_items: "no", cost_plan: "no", program: "no", rfps: "no"}
  - id: old-septic-tank
    label: Disused septic tank on the lot
    evidence: ["Disused septic tank in the rear yard from before the sewer connection", "the house was connected to sewer in 1985; the old tank was never removed"]
    negation: ["No septic tank or on-site system on the lot"]
    profile: []
    adds:
      cost_plan: ["Decommission the old septic tank (provisional sum)"]
      program: ["Pump out and remove or fill the septic tank"]
      authority: ["Council approval under the Local Government Act s68 (verified: false)"]
    built_in: {cost_plan: "no", program: "no"}

gaps:
  - {area: procurement, what: "No rule reads site.demolition: hazmat, dilapidation (building consultant) and demolition consultants are never suggested; no demolition trade id for a separate contract", evidence: "knowledge/works/package_defaults.yaml; data/intake/disciplines.json"}
  - {area: scope, what: "implied_by strip-out adds site.demolition with the work-type default action new, so fr.demolition-1a never fires unless Jev reads remove; no negation check", evidence: "knowledge/profile/scope_defaults.yaml implied_by strip-out; knowledge/works/actions.yaml work_type_defaults; knowledge/program/fragments.yaml fr.demolition-1a"}
  - {area: program, what: "One activity covers demolition; no rows for disconnections and abolishment, SafeWork notification, asbestos removal, clearance, waste tracking, dilapidation, the R7 pre-start inspection or owner move-out", evidence: "knowledge/program/fragments.yaml fr.demolition-1a"}
  - {area: program, what: "No hold points for services off, asbestos clearance, dilapidation or tree protection before demolition; the only site.demolition interface is about retained structure", evidence: "knowledge/clusters/structure/interfaces.yaml if.demolition-maintains-retained-structure"}
  - {area: program, what: "Hazardous-materials survey activity is gated to refurb or extend, so a new build on a demolished lot never gets it", evidence: "knowledge/program/fragments.yaml fr.existing-conditions"}
  - {area: profile, what: "No knock-down work type; det.existing_building true turns on rows meant for kept buildings (structural existing assessment and strengthening, roof tie-in asbestos Implications), false loses the architect demolition interface and civil drainage investigation", evidence: "knowledge/rfp/modules.yaml existing_building; knowledge/rfp/structural.yaml existing_assessment; internal/rfp/drivers.go deriveFlags"}
  - {area: profile, what: "existing_building triggers only on 'existing building' (not dwelling or house); existing_building_year misses '1960s' and 'circa', so cq.pre-2004 cannot fire", evidence: "knowledge/determinants.yaml existing_building, existing_building_year"}
  - {area: knowledge, what: "uc.asbestos-found-in-existing-building fires on site.demolition new/alter/upgrade/repair/replace but not remove", evidence: "testing/synthetic/reference/index/unforeseen.md uc.asbestos-found-in-existing-building"}
  - {area: knowledge, what: "No asbestos rule (identification, licensed removal, notification, clearance, waste tracking); only rule.as2601.demolition-stability, clause unverified", evidence: "knowledge/clusters/structure/rules.yaml rule.as2601.demolition-stability"}
  - {area: rfp, what: "Certifier RFP blocks on cdc and all certification stages need da or ssd, so a CDC knock-down cannot get a certifier RFP", evidence: "knowledge/rfp/bca-certification.yaml unsupported_pathways, stages"}
  - {area: procurement, what: "Town planner suggested on a CDC through baselines[0]; its RFP blocks on cdc", evidence: "knowledge/works/package_defaults.yaml baselines[0]; testing/synthetic/reference/index/rfp-templates.md town-planning"}
  - {area: cost_plan, what: "CDC drops da-fees (losing contributions), keeps cc-fees though no CC issues, and has no CDC fee line", evidence: "knowledge/costs/starter_lines.yaml da-fees, cc-fees"}
  - {area: cost_plan, what: "No demolition and asbestos line, no disconnections line, no latent-condition provisional sum; residential_house_new split has no demolition share", evidence: "knowledge/costs/elements.yaml code 01; knowledge/costs/budget_splits.yaml residential_house_new"}
