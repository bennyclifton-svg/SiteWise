# RFP expectations use the data/eval/rfp/answer-keys keys. They state the CORRECT answer for this job.
# app_differs: {key, app, expect, why}; predicted app output = expect overridden by app_differs.
rfps:
  - discipline: consultant.architect
    template: architecture
    built_in: "partial"
    source: "knowledge/rfp/architecture.yaml existing_interfaces"
    why: "House and existing_building modules on; blocks on fact:budget until the budget is stated"
    must_include: ["Concept and schematic design on the survey of the existing site", "Demolition plan of every structure to go; investigations needed; trees to keep (existing_interfaces)", "CDC documentation to the Housing Code with survey, hazmat, BASIX, stormwater and structural inputs", "Lodging the CDC with the certifier on the NSW Planning Portal", "Design development", "House tender and construction documents (house_documents)", "Kitchen, bathroom, laundry and joinery design", "Selections schedule", "Specification", "Tender (bidding) support", "Certifier liaison", "Option: construction-phase support", "Option: contract administration"]
    must_not_include: ["DA planning response", "BIM coordination", "Tenant fit-out", "Signage", "Facade certification", "Regulated-design declarations", "D&C tender documents", "Post-novation stage", "Hazardous materials survey", "Demolition engineering"]
    expect:
      stages_include: [concept, schematic, planning_approval, design_development, house_documents, bidding]
      stages_option: [construction_support, contract_admin]
      stages_absent: [brief_masterplan, planning_response, interiors, tender_traditional, dnc_tender, regulated_design, for_construction, post_novation]
      positions: {coordination: I, input_schedule: I, specialist_coordination: I, specification: I, house_interiors: I, house_selections: I, door_schedule: I, certifier_liaison: I, document_uploads: I, lodgement: I, existing_interfaces: I, ffe: O, modifications: O, value_management: O, marketing_renders: X, court: X, as_built: X, others_fees: X, water_asset: absent, sustainability_docs: absent, country: absent, bim_model: absent, tenant_fitout: absent, signage: absent, facade_certification: absent, community: absent, live_staging: absent}
      blocking: ["fact:budget"]
      sources:
        - "existing_interfaces I because det.existing_building is true (module existing_building)"
        - "planning_response absent: pathway cdc is not in its when list"
        - "blocking clears once proj.budget_stated is read"
    app_differs:
      - {key: stage.bidding, app: option, expect: include, why: "bidding falls after the house boundary end (house_documents), as T01"}
      - {key: text.planning_approval, app: "no BASIX, demolition plan or waste plan named", expect: "named", why: "domain-only deliverables the template does not list"}
  - discipline: consultant.structural
    template: structural
    built_in: "partial"
    source: "knowledge/rfp/structural.yaml existing_assessment"
    must_include: ["Design basis with site class and AS 4055 wind class", "AS 2870 footing and slab design noting old footings and fill removed", "Residential framing review", "Footings affected by in-ground services", "Construction documents and design certificate for the CDC", "Responses to certifier requests during CDC assessment", "Option: construction-phase inspections", "Option: advice on boundary walls or neighbours' structures affected by demolition"]
    must_not_include: ["Existing structure assessment", "Strengthening design", "Shoring or retention design", "Dilapidation surveys (separate appointment)", "Demolition drawings", "Temporary works design", "Shared Revit model", "Regulated design", "D&C stages"]
    expect:
      stages_include: [concept_schematic, planning_approval, design_development, tender_traditional, construction_documents]
      stages_option: [construction_phase]
      stages_absent: [existing_assessment, authority_asset, dnc_tender, regulated_design, post_novation]
      positions: {design_basis: I, geotech_brief: I, residential_framing: I, safety_in_design: I, delegated_design: I, services_footings: I, value_management: I, inspection_schedule: O, metalwork: O, services_fixings: O, temporary_works_design: X, dilapidation: X, compaction: X, demolition_drawings: X, strengthening: absent, shared_model: absent, retention_design: absent, temporary_works_interfaces: absent, super_flat_floor: absent, specialist_element_design: absent}
      blocking: []
      sources: ["dilapidation X: client (separate survey) by the building consultant"]
    app_differs:
      - {key: stage.existing_assessment, app: include, expect: absent, why: "flag existing_building yes from det.existing_building; nothing is retained in a knock-down"}
      - {key: position.strengthening, app: O, expect: absent, why: "O whenever existing_assessment is a stage"}
      - {key: position.shared_model, app: O, expect: absent, why: "service_level simple O"}
      - {key: position.super_flat_floor, app: O, expect: absent, why: "client flag cannot be set; if_unknown option"}
      - {key: position.specialist_element_design, app: O, expect: absent, why: "O whenever procurement is not design_construct"}
  - discipline: consultant.civil
    template: civil
    built_in: "partial"
    source: "knowledge/rfp/civil.yaml retained_services"
    must_include: ["Investigation of the existing drainage and kerb outlet (CCTV or locating) and how findings change the design", "Stormwater design for the CDC with discharge point confirmed", "Detailed design incl. rainwater tank overflow", "Driveway long section and crossing levels", "Erosion and sediment control plan effective from the start of demolition", "Works-as-executed review and certificate for the OC"]
    must_not_include: ["Public road works", "MUSIC water quality modelling", "NorBE", "Flood report", "On-site detention design", "Existing OSD feasibility", "3D civil model", "Trunk drainage", "Regulated-design declarations", "D&C stages"]
    expect:
      stages_include: [schematic, detailed_tender, for_construction, construction_phase, as_built]
      stages_option: []
      stages_absent: [dnc_tender, post_novation]
      elements_include: [earthworks, roads, stormwater]
      elements_absent: [public_road]
      positions: {utility_plan: I, discharge: I, drainage_model: I, hydraulic_connection: I, retained_services: I, safety_in_design: I, retaining_structural: X, clash_check: X, design_criteria: X, water_strategy: X, quality_audit: X, services_location: X, shoring: X, trunk_drainage: X, sea: X, road_safety_audit: X, om_manual: X, quantities: X, modifications: X, water_quality: absent, norbe: absent, osd_new: absent, osd_existing: absent, osd_replacement: absent, earthworks_suitability: absent, flood_report: absent, flood_evacuation: absent, pavement_design: absent, civil_model: absent, public_road_approvals: absent, civil_declarations: absent}
      blocking: []
      sources: ["retained_services I through the existing_building module"]
    app_differs:
      - {key: position.water_quality, app: O, expect: absent, why: "I when flags, else O"}
      - {key: position.civil_model, app: O, expect: absent, why: "service_level simple O"}
      - {key: position.pavement_design, app: O, expect: absent, why: "always O"}
      - {key: stage.construction_phase, app: option, expect: include, why: "stormwater inspection before covering (R7 item 6) supports the engineer's certificate for the OC"}
      - {key: stage.as_built, app: option, expect: include, why: "follows construction_phase; WAE is needed for the OC"}
  - discipline: consultant.geotechnical
    template: geotechnical
    built_in: "partial"
    source: "knowledge/rfp/geotechnical.yaml"
    must_include: ["Investigation plan with boreholes or test pits clear of the existing house", "Field work and laboratory reactivity testing", "AS 2870 site classification and footing advice noting uncertainty under the house footprint", "Advice on removing old footings and fill", "Option: confirmation after demolition", "Option: pier and footing inspections"]
    must_not_include: ["Contamination or waste classification", "Groundwater monitoring wells", "Acid sulfate soils assessment", "Novation or transfer"]
    expect:
      stages_include: [g1_plan, g2_field, g3_report]
      stages_option: [g5_design, g6_construction]
      stages_absent: [g4_planning, g7_transfer]
      positions: {plan: I, foundation: I, clearance: I, construction: O, access: X, environment: X, monitoring: absent, asset_exposure: absent, ass: absent, defects: absent, transfer: absent}
      blocking: []
    app_differs:
      - {key: position.monitoring, app: O, expect: absent, why: "always O"}
      - {key: stage.g7_transfer, app: option, expect: absent, why: "default option"}
      - {key: position.transfer, app: O, expect: absent, why: "O unless g7 included"}
      - {key: position.defects, app: O, expect: absent, why: "always O"}
      - {key: stage.g2_field, app: ask, expect: include, why: "client flag geotech_intrusive cannot be keyed"}
      - {key: position.foundation, app: ask, expect: I, why: "client flag geotech_foundation"}
