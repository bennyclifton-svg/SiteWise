    source: "knowledge/rfp/land-surveying.yaml"
    must_include: ["Detail and contour survey on AHD showing the existing house, garage and shed with floor and ridge levels, trees, pits, kerb outlet, sewer junction and crossing", "Boundary identification with easements and encroachments of old structures or fences", "Adjoining windows and ridge heights for the Housing Code", "Buried drainage and pits", "Sewer records", "Option: set-out", "Option: identification surveys", "Option: final survey"]
