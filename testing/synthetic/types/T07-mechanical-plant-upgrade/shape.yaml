schema: sitewise-synthetic-shape/1
type_id: T07
slug: mechanical-plant-upgrade
name: Mechanical plant upgrade (chillers, AHUs)
reviewed: false
state: NSW
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.

# Base scenario: an occupied 6-storey NSW Class 5 office (about 6,000 m2 NLA),
# built 1988, one owner, tenants in occupation. Two end-of-life air-cooled
# R22 chillers on the roof plant deck and six floor AHUs (one per floor) are
# replaced like for like in their existing locations, with new chilled-water
# pumps, mechanical services switchboards and BMS integration. Chillers are
# replaced one at a time in the cooler months (N-1, no temporary cooling) and
# lifted by mobile crane from a local street. AHU fire mode is shutdown on
# smoke detection only, as listed on the building's fire safety schedule
# (effective height under 25 m, so no zone smoke control or stair
# pressurisation). Exempt pathway,
# traditional lump-sum AS 4000 contract with a mechanical contractor as head
# contractor. A mechanical engineer leads. Prose: DOMAIN.md.
profile:
  hdr.building_class: commercial
  hdr.subclass: office
  hdr.work_type: refurb
  hdr.cond.planning: exempt
  hdr.cond.procurement_route: traditional
  hdr.cond.operational_constraints: live_environment
  hdr.cond.access_constraints: urban_constrained
  hdr.cond.stakeholder_complexity: single_owner
  hdr.cond.environmental_sensitivity: standard
  hdr.scale.storeys: 6
  det.ncc_class: ["5"]
  det.state: NSW
  det.existing_building: true
  det.existing_building_year: 1988
  det.rise_in_storeys: 6
  det.heritage_status: none
  fact.contract_form: as4000
  fact.contract_basis: lump_sum
  proj.regulated_design: "no"      # DBP Act regulated design applies to Class 2 and 9c, not Class 5 (owner ruling R3)
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.staged: "yes"               # chillers replaced one at a time: construction works in stages
  flag.basement: "no"              # the building has a basement car park, but the works include no basement or excavation (see gaps)
  flag.excavation_adjoining: "no"
  flag.authority_asset: "no"
  flag.rail: "no"
  flag.transfer_structures: "no"
  flag.osd_existing: "no"
  flag.sustainability_target: "no" # no NABERS target in the base (trigger nabers-target)
  det.flood_hazard: false
  det.potentially_contaminated_land: false

# Values the app should derive rather than read from a document.
expected_derived:
  - {key: det.ncc_class, value: ["5"], source: "knowledge/profile/taxonomy.yaml office ncc_class", note: "The subclass office implies Class 5, but det.ncc_class is never derived from the subclass today (KNOWLEDGE_INDEX section 0 rule 3). Without it the fit-out fragments become If rows."}
  - {key: det.existing_building, value: true, source: "internal/rfp/drivers.go deriveFlags", note: "The RFP drivers derive flag.existing_building from work type refurb; the profile row itself is not derived."}

# Facts the scenario documents must state; the scenario author picks the values.
scenario_inputs:
  - {key: det.ncc_class, note: "Stated in the BCA consultant's advice or the fire safety schedule.", phrasing: "The building is a Class 5 office building of <n> storeys."}
  - {key: det.existing_building_year, note: "Gates the hazardous-materials implication (pre-2004) and the asbestos trigger.", phrasing: "The building was completed in <year>."}
  - {key: hdr.scale.storeys, note: "Also gives det.rise_in_storeys.", phrasing: "a <n>-storey office building"}
  - {key: hdr.cond.planning, note: "Exempt or no-consent wording in the BCA advice or the specification.", phrasing: "The like-for-like replacement of plant in its existing location is exempt development and needs no development consent or construction certificate."}
  - {key: det.heritage_status, note: "Enumerated none is evidence; silence is not.", phrasing: "The property is not a heritage item and is not within a heritage conservation area."}
  - {key: hdr.cond.operational_constraints, note: "live_environment, partial_occupation or 24_7_occupied are acceptable; vacant is wrong.", phrasing: "The building remains fully tenanted and operational throughout the works; shutdowns are out of hours."}
  - {key: fact.contract_form, note: "Stated in the tender documents.", phrasing: "AS 4000-1997 General conditions of contract, with special conditions"}
  - {key: proj.client, note: "The building owner or its fund manager; the facilities manager is its agent, not the client.", phrasing: "Client: <owner entity> (the Principal)"}
  - {key: proj.budget_stated, note: "Usually the mechanical engineer's order-of-cost estimate in the options report.", phrasing: "Estimated construction cost of the recommended option: $<amount> excluding GST"}
  - {key: flag.staged, note: "Stage wording for the chiller-by-chiller replacement.", phrasing: "The works will be carried out in two stages in the cooler months: Stage 1 chiller 1, Stage 2 chiller 2. The remaining chiller carries the load, so no temporary cooling is required."}

work_items:
  - {system: mechanical.central-plant, action: replace, why: "Two air-cooled chillers on the roof plant deck replaced with equivalent capacity, with new chilled-water pumps (VSD), valves and pipework connections. Like-for-like capacity, so replace, not upgrade; a stated capacity increase would be upgrade (knowledge/works/actions.yaml)."}
  - {system: mechanical.air-conditioning, action: replace, why: "Six floor AHUs replaced in their plant rooms. The app files air-handling units under air-conditioning (clusters/services-wet-air/systems.yaml mechanical.air-conditioning describes)."}
  - {system: mechanical.refrigerant-condensate, action: replace, why: "R22 recovered from the old chillers by a licensed refrigeration technician and returned for destruction; the new factory-charged chillers use a current refrigerant. AHU condensate trays and drains renewed (Commonwealth ozone protection law, verified: false)."}
  - {system: mechanical.controls-bms, action: alter, why: "New chiller and AHU controllers and points are integrated into the retained BMS: sequences, graphics, alarms and trend logs. No change to the BMS head end, so alter; BMS replacement is a trigger."}
  - {system: mechanical.fire-mode-air-systems, action: alter, why: "The new AHUs must keep the existing fire mode (shutdown on smoke detection, per the fire safety schedule) and be re-tested with the fire indicator panel (AS 1668.1, verified: false)."}
  - {system: mechanical.air-distribution, action: alter, why: "Supply and return duct transitions, flexible connections and dampers altered to suit the new AHU connections."}
  - {system: fire-active.detection, action: alter, why: "Duct or return-air smoke detectors and the FIP fire-trip relays to the AHUs are disconnected and reinstated by the building's fire services contractor, and the cause and effect re-tested."}
  - {system: fire-passive.penetrations, action: alter, why: "New and disturbed cable and pipe penetrations through fire-rated plant room walls, risers and slabs are fire-stopped and certified."}
  - {system: electrical.cabling-wiring, action: alter, why: "Submains and final subcircuits to the new chillers, pumps and AHUs, sized to the new nameplate loads."}
  - {system: electrical.switchboards, action: alter, why: "New outgoing protective devices on the main switchboard and replacement mechanical services switchboards in the plant room. The MSB itself is retained, so alter, not replace."}
  - {system: structure.alterations, action: investigate, why: "The structural engineer checks the roof plant deck, plinths and floor plant room slabs for the new operating weights, footprints and vibration. Strengthening is a trigger."}
  - {system: structure.steel, action: new, why: "New galvanised steel support frames (dunnage) on the existing plinths to suit the new chiller footprint, with vibration isolation and seismic restraint."}
  - {system: structure.temporary-works, action: new, why: "Mobile crane set-up, outrigger pads and load spreading for the chiller lifts; designed by the contractor's temporary works designer (clusters/structure/systems.yaml structure.temporary-works describes crane bases and outrigger pads)."}
  - {system: envelope.external-waterproofing, action: repair, why: "The roof membrane is made good around altered plinths, new frame fixings and pipe penetrations on the plant deck."}
  - {system: access-egress.maintenance-access, action: alter, why: "Walkways, platforms and guardrails to AS 1657 re-arranged to give safe service access and clearances to the new chillers (verified: false)."}

procurement:
  - {discipline: consultant.mechanical, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", aliases: [consultant.services], why: "Lead consultant: investigation of the existing plant, options and replacement strategy, design, specification and tender documents, construction-phase reviews, commissioning witness and seasonal review. Also suggested by scope_additions[2] once mechanical items exist. A multi-services firm (consultant.services) may hold this package."}
  - {discipline: consultant.structural, kind: services, built_in: "no", why: "Plant deck and plinth capacity for the new operating weights, support frame and seismic restraint design, and inspection before plant is set down. Refurb baselines (package_defaults.yaml baselines[2], [3]) do not name Structural; baselines[0] covers new and extend only."}
  - {discipline: consultant.electrical, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", aliases: [consultant.services], why: "Supply and main switchboard capacity check against the new plant demand, submain and protection design, staged isolation. Often the mechanical engineer's sister discipline in one firm. Also scope_additions[4]."}
  - {discipline: consultant.hazmat, kind: services, built_in: "no", why: "A pre-2004 workplace: a refurbishment survey of the plant rooms, risers and ceiling voids the works disturb is needed before work starts (asbestos gaskets, lagging, flexible duct connections, PCB capacitors; WHS Regulation 2017, verified: false). No package rule names Hazmat; fr.existing-conditions schedules the survey without a consultant."}
  - {discipline: consultant.bca, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Written advice confirming the exempt pathway (or that a CDC or DA is needed), the essential fire safety measures affected and the Section J Part J6 basis for the new plant (verified: false). Limited scope; no certification."}
  - {discipline: trade.mechanical, kind: works, built_in: partial, source: "internal/procurement/proposed.go ProposeHeadContract", aliases: [trade.main_works], why: "The mechanical contractor is the head contractor and principal contractor under the WHS Act, with crane, electrical, structural steel, roofing, BMS and fire subcontractors. The app proposes only a trade.main_works head contract, and only from gaps on accepted work items; trade.mechanical is a trade package only (internal/procurement/discipline.go DisciplinePackage)."}

not_expected_procurement:
  - {discipline: consultant.architect, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "No architectural scope: plant replaced in its existing location with no change to the building's appearance."}
  - {discipline: consultant.interior_design, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[4]", why: "No interiors work; ceilings are only lifted and reinstated locally by the contractor."}
  - {discipline: consultant.access, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "No accessible path, facility or egress change; plant access to AS 1657 (verified: false) is the mechanical engineer's and contractor's."}
  - {discipline: consultant.hydraulic, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Air-cooled chillers need no hydraulic design; AHU condensate drains are reconnected by the contractor. Water-cooled plant is a trigger (cooling-towers)."}
  - {discipline: consultant.fire_services, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "The fire-trip interface is specified by the mechanical engineer and done by the building's fire services contractor; no fire services design. Also fires through scope_additions[1] on the detection item. A fire engineer is a trigger (fire-engineered-smoke-control)."}
  - {discipline: consultant.certifier, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "No certificate on the exempt path. Becomes expected under the complying-development and heritage-item triggers."}

cost_plan:
  - {line: "Long service levy", section: fees_and_charges, built_in: "no", why: "NSW Long Service Corporation levy on building and construction work above the threshold, paid before work starts; with no CC it is paid directly (threshold, rate and whether plant replacement is levied: verified: false). No starter line exists."}
  - {line: "Council and road occupancy permits for the crane lifts", section: fees_and_charges, built_in: "no", why: "Council approval under the Roads Act 1993 s 138 to stand a mobile crane on the road and close the footpath, and any road occupancy licence (verified: false). Often carried by the contractor; the owner must know who pays."}
  - {line: "Mechanical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Fee line for the adopted Mechanical package (internal/costs/suggest.go Suggest). Staged: investigation and options, design and tender, construction and commissioning, seasonal."}
  - {line: "Structural engineer", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "A fee line is made per live services package, but Structural is never suggested for refurb, so the line appears only after the user adds the package."}
  - {line: "Electrical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Fee line for the adopted Electrical package."}
  - {line: "Hazardous materials consultant", section: consultants, built_in: partial, source: "internal/costs/suggest.go Suggest", why: "Fee line per package; the package is never suggested."}
  - {line: "BCA consultant", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Fee line for the adopted BCA package (advice only)."}
  - {line: "Preliminaries, site establishment and occupied-building controls", section: construction, built_in: "no", why: "Out-of-hours premiums, tenant liaison, building manager and security attendance, protection of lifts and common areas, waste removal through an occupied building. No preliminaries line; the budget split spreads it pro rata."}
  - {line: "Crane hire, lift plan and traffic control for the plant lifts", section: construction, built_in: "no", why: "Mobile crane, rigging crew, lift plan, traffic controllers and footpath closure, often at weekends. structure.temporary-works rolls into the generic 03 Structure line."}
  - {line: "Decommission existing chillers, recover refrigerant and remove", section: construction, built_in: "no", why: "Isolation, refrigerant recovery by a licensed technician, oil and glycol disposal, cutting out and scrap. Folded into 08 at best."}
  - {line: "Air-cooled chillers: supply, install and commission", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 08", why: "Appears only as the single '08 Mechanical services' line once a mechanical work item exists."}
  - {line: "Chilled water pumps, pipework, valves, flushing and water treatment", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 08", why: "Folded into the one 08 line."}
  - {line: "Floor AHUs: remove, supply, install and commission", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 08", why: "Folded into the one 08 line. AHUs are often delivered in knock-down sections."}
  - {line: "Mechanical services switchboards", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 08", why: "Built by the mechanical contractor's switchboard builder; folded into 08 (the app's electrical.switchboards item puts the MSB work under 10)."}
  - {line: "BMS integration: controllers, points, graphics and programming", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 08", why: "Usually the incumbent BMS contractor as a subcontractor or nominated subcontractor. Folded into 08."}
  - {line: "Testing, commissioning, balancing and seasonal commissioning", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 08", why: "Integrated tests, air and water balancing, fire-mode tests and a return visit in the opposite season. Folded into 08."}
  - {line: "Chiller support frames and plinth modifications", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 03", why: "Shows as '03 Structure'. A separate steel line appears only with a trade.structural_steel package (elements.yaml overrides)."}
  - {line: "Roof membrane make-good at plant supports", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 04", why: "Shows as '04 Building envelope'."}
  - {line: "Fire detection interface and fire-mode re-test", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 07", why: "Shows as '07 Active fire protection', costed under trade.fire_services. In practice the building's fire contractor does it under the head contract or directly for the owner."}
  - {line: "Fire stopping of new and disturbed penetrations", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 06", why: "Shows as '06 Passive fire protection'."}
  - {line: "Submains and main switchboard protection changes for new plant", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements code 10", why: "Shows as '10 Electrical services', costed under trade.electrical, though the electrician is the mechanical contractor's subcontractor."}
  - {line: "Plant access platforms and guardrails", section: construction, built_in: partial, source: "knowledge/costs/elements.yaml elements access-egress items", aliases: ["Plant and maintenance access"], why: "A 13.x child line labelled with the system label once an access-egress.maintenance-access item exists (internal/costs/suggest.go itemised children)."}
  - {line: "Provisional sums for latent conditions in existing plant and pipework", section: construction, built_in: "no", why: "Isolation valves that will not hold, corroded headers, undocumented cabling. Common on plant replacement (uc.existing-plant-has-no-isolation-for-live-cutover suggests a provisional sum); no provisional-sum line exists."}
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml design-contingency", why: "Always suggested."}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml construction-contingency", why: "Always suggested. Latent conditions in old plant rooms justify more than for new work."}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml escalation", why: "Always suggested. Chillers are often priced in a foreign currency and ordered months ahead."}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml exclusions", why: "Typically tenant supplementary cooling, tenant BMS points and making good tenant ceilings."}
  - {line: "Owner's building management costs during the works", section: contingency, built_in: "no", why: "After-hours building manager, security and lift operator attendance, BMS and fire contractor call-outs paid by the owner outside the contract, and tenant communication."}

# Lines the app produces that this job should not carry; a scorer reports them.
not_expected_cost_plan:
  - {line: "Construction certificate and certifier fees", app_label: "P05 Construction certificate and certifier fees", section: fees_and_charges, source: "knowledge/costs/starter_lines.yaml cc-fees", why: "Always suggested; the exempt path has no CC or CDC. Expected under complying-development and heritage-item."}
  - {line: "Service authority connection fees", app_label: "P06 Service authority connection fees", section: fees_and_charges, source: "knowledge/costs/starter_lines.yaml service-authority", why: "Always suggested; no new authority connection in the base. Expected under heating-electrification if the supply is augmented."}
  - {line: "Architect (consultant fee)", app_label: "F0n Architect", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion on cost-plan prepare (not_expected_procurement)."}
  - {line: "Interior Design (consultant fee)", app_label: "F0n Interior Design", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[4]", why: "Adopted suggestion."}
  - {line: "Access (consultant fee)", app_label: "F0n Access", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Adopted suggestion."}
  - {line: "Hydraulic (consultant fee)", app_label: "F0n Hydraulic", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion."}
  - {line: "Fire Services (consultant fee)", app_label: "F0n Fire Services", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Adopted suggestion."}
  - {line: "Certifier (consultant fee)", app_label: "F0n Certifier", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion; no certifier on the exempt path."}

program:
  skeleton: sk.refurb-traditional-cdc   # refurb + traditional + cdc or exempt; the app picks it for the base
  activities:
    - {label: "Existing plant condition, capacity and refrigerant review", stage: investigation, fragment: null, after: [], built_in: "no", why: "Condition and remaining life of chillers, pumps and AHUs; refrigerant type (R22 phase-out drives the job: uc.refrigerant-phase-out-forces-plant-replacement); actual loads from BMS trend logs, not the original design."}
    - {label: "Measure the existing building", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", aliases: ["Survey plant rooms and the plant entry and removal routes"], why: "Plant room dimensions, clearances, the crane position and the delivery route (uc.new-plant-does-not-fit-old-plant-room-or-route)."}
    - {label: "Hazardous-materials survey", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Refurbishment survey of the areas the works disturb, before design is fixed and before any disconnection (pre-2004 building)."}
    - {label: "Trace existing services", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Electrical supply and submains, BMS points and network, FIP fire-trip interfaces, isolation valves."}
    - {label: "Structural assessment of the roof plant deck and plant room slabs", stage: investigation, fragment: null, after: ["Measure the existing building"], built_in: partial, source: "internal/program/generate.go investigationRows", why: "The structure.alterations investigate item gets one generic Investigation row titled with the item, not a plant-load assessment."}
    - {label: "Maximum demand and supply capacity check", stage: investigation, fragment: null, after: ["Trace existing services"], built_in: "no", why: "Electrical engineer's logging of the MSB and submains against the new plant demand and starting currents."}
    - {label: "Confirm the brief", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Existing plant condition, capacity and refrigerant review"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Owner's performance brief: capacity, redundancy (N-1), tenant lease obligations, energy and refrigerant policy."}
    - {label: "Prepare the concept design", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Confirm the brief", "Hazardous-materials survey", "Structural assessment of the roof plant deck and plant room slabs", "Maximum demand and supply capacity check"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", aliases: ["Options and replacement strategy report"], why: "Options report: plant type and refrigerant, staging and temporary cooling, crane strategy, order-of-cost estimate. The app row is generic fit-out wording."}
    - {label: "Client review of the concept", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Prepare the concept design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Owner selects the option and approves capital expenditure; often a fund or board approval."}
    - {label: "Develop the design", stage: concept_design, fragment: fr.design-development-fitout, after: ["Client review of the concept"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.design-development-fitout", why: "Plant selections, support frames, electrical supply, BMS points and fire-mode interfaces coordinated."}
    - {label: "Mechanical specification, drawings, staging and cut-over plan", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["Develop the design"], built_in: partial, source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "The app row is 'Prepare fit-out documentation'. The documents carry the staging, shutdown windows, hold points, commissioning and Section J Part J6 requirements (verified: false)."}
    - {label: "Coordinate consultant documentation", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "Structural, electrical and hazmat inputs into one tender set."}
    - {label: "Client sign-off for tender", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["Mechanical specification, drawings, staging and cut-over plan", "Coordinate consultant documentation"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "Owner approves the tender documents."}
    - {label: "Confirm the exempt path", stage: approvals, fragment: fr.exempt-confirmation, after: ["Client review of the concept"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.exempt-confirmation", why: "BCA consultant's written advice that like-for-like replacement is exempt (Codes SEPP provision verified: false), and which essential fire safety measures are affected."}
    - {label: "Assemble the tender package", stage: procurement, fragment: fr.tender-docs-fitout, after: ["Client sign-off for tender", "Confirm the exempt path"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-docs-fitout", why: "AS 4000 with special conditions, preliminaries including the staging and out-of-hours regime, schedule of rates for latent work."}
    - {label: "Tender period", stage: procurement, fragment: fr.tender-period-fitout, after: ["Assemble the tender package"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-period-fitout", why: "With a mandatory site inspection of the plant rooms and crane position."}
    - {label: "Evaluate tenders", stage: procurement, fragment: fr.tender-evaluation-fitout, after: ["Tender period"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-evaluation-fitout", why: "Checks plant lead times, refrigerant handling and electrical licences, crane methodology, warranty and the BMS subcontractor."}
    - {label: "Award the contract", stage: procurement, fragment: fr.contract-award, after: ["Evaluate tenders"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.contract-award", why: "Gated to new, extend or refurb, so it fires."}
    - {label: "Establish the site", stage: construction, fragment: fr.site-establishment-fitout, after: ["Award the contract"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.site-establishment-fitout", why: "Site office, laydown on the roof, protection of the goods lift and common areas."}
    - {label: "Shop drawings and submittals for chillers, AHUs, frames and switchboards", stage: construction, fragment: null, after: ["Award the contract"], built_in: "no", why: "Equipment submittals, with efficiency evidence checked against Section J before ordering (uc.hvac-efficiency-below-code)."}
    - {label: "Manufacture and deliver chillers, AHUs and mechanical services switchboards", stage: construction, fragment: null, after: ["Shop drawings and submittals for chillers, AHUs, frames and switchboards"], built_in: "no", why: "The long-lead item that sets the cut-over season. The only AC lead-time row (du.ac-plant-lead-2) belongs to a Class 2 fragment."}
    - {label: "Tenant notices and shutdown schedule agreed with building management", stage: construction, fragment: null, after: ["Award the contract"], built_in: "no", why: "Shutdown windows, after-hours access and tenant lease obligations (uc.agreed-shutdown-or-cutover-window-shorter-than-changeover)."}
    - {label: "Council approval and traffic control plan for the crane lifts", stage: construction, fragment: null, after: ["Award the contract"], built_in: "no", why: "Roads Act s 138 approval for the crane on the road and the footpath closure, traffic control plan by an accredited practitioner (verified: false). Council processing can hold the lift date."}
    - {label: "Contractor's lift plan and crane temporary works design", stage: construction, fragment: null, after: ["Shop drawings and submittals for chillers, AHUs, frames and switchboards"], built_in: "no", why: "Crane selection for the heaviest pick at radius, outrigger loads, exclusion zones and overswing (uc.neighbour-boundary-risks-from-crane-and-falling-objects)."}
    - {label: "Fabricate and install chiller support frames", stage: construction, fragment: null, after: ["Shop drawings and submittals for chillers, AHUs, frames and switchboards"], built_in: "no", why: "No structure.steel fragment exists for Class 5 (fr.steel-7b and fr.steel-9b only)."}
    - {label: "Hold point: structural engineer inspects support frames before plant is set down", stage: construction, fragment: null, after: ["Fabricate and install chiller support frames"], built_in: "no", why: "Contract hold point; no interface hold point resolves for structure.steel (KNOWLEDGE_INDEX section 4.4)."}
    - {label: "Stage 1: isolate chiller 1 and recover refrigerant", stage: construction, fragment: null, after: ["Establish the site", "Tenant notices and shutdown schedule agreed with building management"], built_in: "no", why: "The remaining chiller carries the load (N-1, cooler months). Refrigerant recovered before cutting out (uc.refrigerant-in-old-plant-needs-recovery-before-removal)."}
    - {label: "Stage 1: crane out chiller 1 and lift in new chiller 1", stage: construction, fragment: null, after: ["Stage 1: isolate chiller 1 and recover refrigerant", "Council approval and traffic control plan for the crane lifts", "Contractor's lift plan and crane temporary works design", "Hold point: structural engineer inspects support frames before plant is set down", "Manufacture and deliver chillers, AHUs and mechanical services switchboards"], built_in: "no", why: "A single planned crane lift, usually at a weekend."}
    - {label: "Hold point: chilled water flushing and water treatment before commissioning", stage: construction, fragment: null, after: ["Stage 1: crane out chiller 1 and lift in new chiller 1"], built_in: "no", why: "Implication only (uc.chilled-water-flushing-delays-commissioning); no interface hold point for it."}
    - {label: "Stage 1: connect, start up and commission chiller 1", stage: construction, fragment: null, after: ["Hold point: chilled water flushing and water treatment before commissioning", "Install submains and mechanical services switchboards"], built_in: "no", why: "Manufacturer's start-up, then control and capacity tests before chiller 2 is taken out."}
    - {label: "Stage 2: replace and commission chiller 2", stage: construction, fragment: null, after: ["Stage 1: connect, start up and commission chiller 1"], built_in: "no", why: "Repeats Stage 1; a second crane day."}
    - {label: "Replace floor AHUs floor by floor, out of hours", stage: construction, fragment: fr.mechanical-fitout, after: ["Manufacture and deliver chillers, AHUs and mechanical services switchboards", "Tenant notices and shutdown schedule agreed with building management"], built_in: partial, source: "knowledge/program/fragments.yaml fr.mechanical-fitout", why: "The replace item on mechanical.air-conditioning fires fr.mechanical-fitout, labelled 'Alter ductwork and pipework', with a GFA-scaled duration."}
    - {label: "Commission AHUs and balance air", stage: construction, fragment: fr.mechanical-fitout, after: ["Replace floor AHUs floor by floor, out of hours", "Install submains and mechanical services switchboards"], built_in: partial, source: "knowledge/program/fragments.yaml fr.mechanical-fitout", why: "App row 'Commission the altered system'."}
    - {label: "Install submains and mechanical services switchboards", stage: construction, fragment: fr.electrical-fitout, after: ["Establish the site", "Manufacture and deliver chillers, AHUs and mechanical services switchboards"], built_in: partial, source: "knowledge/program/fragments.yaml fr.electrical-fitout", why: "App rows are fit-out 'Rough-in' and 'Fit off'. Staged so the existing chiller stays energised."}
    - {label: "BMS integration, points testing and graphics", stage: construction, fragment: null, after: ["Stage 1: connect, start up and commission chiller 1", "Commission AHUs and balance air"], built_in: "no", why: "No fragment for mechanical.controls-bms."}
    - {label: "Re-test fire-mode shutdown and FIP interface", stage: construction, fragment: fr.detection-fitout, after: ["Commission AHUs and balance air"], built_in: partial, source: "knowledge/program/fragments.yaml fr.detection-fitout", why: "App row 'Alter detection and warning'. The test proves each AHU shuts down on its smoke detector and on FIP alarm (if.bms-fire-mode-priority)."}
    - {label: "Seal service penetrations", stage: construction, fragment: fr.fire-stopping, after: ["Install submains and mechanical services switchboards"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fire-stopping", why: "Fires on the fire-passive.penetrations alter item for Class 5."}
    - {label: "Integrated systems test and commissioning witness", stage: construction, fragment: null, after: ["Stage 2: replace and commission chiller 2", "BMS integration, points testing and graphics", "Re-test fire-mode shutdown and FIP interface"], built_in: "no", why: "Mechanical engineer witnesses plant, controls, fire-mode and failure and recovery tests."}
    - {label: "Practical completion inspection", stage: completion, fragment: fr.practical-completion, after: ["Integrated systems test and commissioning witness", "Seal service penetrations"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.practical-completion", why: "Gated to refurb, so it fires."}
    - {label: "Update essential fire safety measure records for the next annual fire safety statement", stage: completion, fragment: null, after: ["Practical completion inspection"], built_in: "no", why: "The altered AHU shutdown and fire dampers stay listed measures; the owner's next AFSS relies on their test records (EP&A Development Certification and Fire Safety Regulation 2021, verified: false)."}
    - {label: "Handover", stage: completion, fragment: fr.handover, after: ["Practical completion inspection"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.handover", aliases: ["Handover: O&M manuals, as-builts, BMS graphics and training"], why: "Fires, but follows fr.occupation-certificate in the app, which the exempt path does not have (see gaps)."}
    - {label: "Seasonal commissioning and tuning", stage: defects, fragment: null, after: ["Handover"], built_in: "no", why: "Plant replaced in the cooler months is first proven at summer peak load; a return visit in the opposite season."}
    - {label: "Defects inspection", stage: defects, fragment: fr.defects-inspection, after: ["Handover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-inspection", why: "Gated to refurb, so it fires."}
    - {label: "Defects liability period", stage: defects, fragment: fr.defects-liability-end, after: ["Defects inspection"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "Length from the contract (verified: false)."}
    - {label: "Final defects inspection", stage: defects, fragment: fr.defects-liability-end, after: ["Defects liability period", "Seasonal commissioning and tuning"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "Closes out after the seasonal review."}

rfps:
  - discipline: consultant.mechanical
    template: mechanical-services
    built_in: partial
    source: "knowledge/rfp/mechanical-services.yaml stages"
    aliases: [consultant.services]
    must_include:
      - {text: "Existing plant condition, capacity and refrigerant survey, including BMS trend logging of actual loads", key: stage.investigation}
      - {text: "Options and replacement strategy: plant type, refrigerant, staging, temporary cooling need, crane strategy", key: stage.concept}
      - {text: "Chiller and AHU selection to the measured loads, meeting the NCC 2022 Section J Part J6 minimum efficiencies (verified: false)", key: position.hvac}
      - {text: "Fire-mode operation of the new AHUs to AS 1668.1 and the existing fire safety schedule (verified: false)", key: position.smoke}
      - {text: "BMS integration: points list, sequences of operation, graphics, alarms and trend logs", key: position.controls}
      - {text: "Coordination of plant supports, crane lifts, power supply, refrigerant and condensate", key: position.interfaces}
      - {text: "Condition and capacity investigation of the retained systems", key: position.existing}
      - {text: "Staged cut-over plan for an occupied building: shutdown windows, N-1 operation and fallback", key: position.staging}
      - "Refrigerant recovery and disposal requirements for the old plant (Commonwealth ozone protection law, verified: false)"
      - "Plant noise criteria at the nearest boundary carried into the selections"
      - {text: "Traditional tender documentation, tender queries and evaluation report", key: stage.tender}
      - {text: "Construction-phase submittal reviews, site inspections and hold points", key: stage.construction}
      - {text: "Commissioning witnessing, air and water balancing, O&M and as-built review", key: stage.handover}
      - {text: "Seasonal commissioning and tuning review", key: stage.seasonal}
      - {text: "Design certification of the mechanical services to AS 1668.1, AS 1668.2 and Section J (verified: false)", key: position.declarations}
    must_not_include:
      - {text: "Planning submission stage", key: stage.planning}
      - {text: "Post-contract continued design or novation", key: stage.continuation}
      - {text: "Kitchen or process exhaust", key: position.kitchen}
      - {text: "Toilet, car-park and refuse exhaust design", key: position.local}
      - {text: "Whole-building energy rating or NABERS modelling (base)", key: position.energy}
      - "DBP Act regulated designs and declarations (Class 5 is outside the Act: owner ruling R3)"
    # The CORRECT answer for this job, in mechanical-services.yaml's own keys.
    expect:
      stages_include: [inception, investigation, concept, design, tender, construction, handover, seasonal]
      stages_option: []
      stages_absent: [planning, continuation, advisory]
      positions: {hvac: I, smoke: I, controls: I, interfaces: I, existing: I, staging: I, declarations: I, construction: I, witness: I, seasonal: I, energy: X, acoustic: X, specialist: X, remediation: O, execution: O, local: absent, kitchen: absent, continuation: absent}
      blocking: []
      sources:
        - "investigation: the job starts from the existing plant's condition, refrigerant and actual loads"
        - "smoke I: the replaced AHUs keep their fire-mode shutdown (mechanical.fire-mode-air-systems alter)"
        - "staging I: chiller-by-chiller cut-over in an occupied building is the core risk"
        - "seasonal: plant changed in the cooler months is first proven in summer"
    app_differs:
      - {key: stage.investigation, app: ask, expect: include, why: "client flag mech_investigation, which no document can set"}
      - {key: stage.planning, app: ask, expect: absent, why: "client flag mech_planning; exempt path"}
      - {key: stage.tender, app: option, expect: include, why: "after the boundary end (design)"}
      - {key: stage.continuation, app: option, expect: absent, why: "default option; traditional with no novation"}
      - {key: stage.construction, app: option, expect: include, why: "default option, after the boundary end"}
      - {key: stage.handover, app: option, expect: include, why: "default option, after the boundary end"}
      - {key: stage.seasonal, app: option, expect: include, why: "default option, after the boundary end"}
      - {key: stage.advisory, app: option, expect: absent, why: "always option unless work type advisory"}
      - {key: position.smoke, app: ask, expect: I, why: "client flag mech_smoke"}
      - {key: position.controls, app: ask, expect: I, why: "client flag mech_controls"}
      - {key: position.interfaces, app: ask, expect: I, why: "client flag mech_interfaces"}
      - {key: position.existing, app: absent, expect: I, why: "inactive until the investigation stage (client flag mech_investigation) is answered; the stage test passes only for include or option (internal/rfp/resolve.go)"}
      - {key: position.declarations, app: ask, expect: I, why: "client flag mech_declarations"}
      - {key: position.local, app: ask, expect: absent, why: "client flag mech_local"}
      - {key: position.kitchen, app: ask, expect: absent, why: "client flag mech_kitchen"}
      - {key: position.staging, app: O, expect: I, why: "always O in the template"}
      - {key: position.continuation, app: O, expect: absent, why: "follows the continuation stage"}
      - {key: position.construction, app: O, expect: I, why: "follows the construction stage, an option in the app"}
      - {key: position.witness, app: O, expect: I, why: "follows the handover stage, an option in the app"}
      - {key: position.seasonal, app: O, expect: I, why: "follows the seasonal stage, an option in the app"}
  - discipline: consultant.structural
