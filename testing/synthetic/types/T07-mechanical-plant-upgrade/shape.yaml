      - {key: position.specialist_element_design, app: O, expect: absent, why: "O whenever procurement is not design_construct"}
      - {key: position.services_fixings, app: O, expect: I, why: "always O in the template"}
      - {key: position.super_flat_floor, app: O, expect: absent, why: "client flag cannot be set; if_unknown option"}
      - {key: position.compaction, app: X, expect: absent, why: "always X; no ground works"}
      - {key: position.demolition_drawings, app: X, expect: absent, why: "always X"}
      - {key: position.services_footings, app: I, expect: absent, why: "always I; no footings"}
