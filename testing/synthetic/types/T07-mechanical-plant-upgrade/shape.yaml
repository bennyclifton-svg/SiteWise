triggers:
  - id: cooling-towers
    label: Water-cooled chillers with rooftop cooling towers
    evidence:
      - "The two water-cooled centrifugal chillers reject heat through two induced-draft cooling towers on the roof."
      - "Condenser water dosing and monthly Legionella sampling are carried out under the cooling water system risk management plan."
      - "The cooling water system is registered with Council."
    negation:
      - "Heat rejection is by air-cooled chillers; the building has no cooling towers or evaporative condensers."
      - "The cooling towers were decommissioned and removed in 2015."
    profile: []
    adds:
      work_items:
        - {system: mechanical.cooling-towers, action: replace}
        - {system: hydraulic.backflow-prevention, action: alter}
      cost_plan: ["Cooling towers: supply, install and commission", "Condenser water pumps, pipework and water treatment", "Cooling water system risk management plan, registration update and audit"]
      program: ["Decommission, drain and disinfect the old cooling towers before removal", "Notify council of the change to the registered cooling water system", "Commission water treatment and Legionella sampling before handover"]
      rfps:
        - {discipline: consultant.mechanical, must_include: ["Cooling tower selection and microbial control design to AS/NZS 3666 (verified: false)", "Inputs to the cooling water system risk management plan (Public Health Regulation 2022, verified: false)", "Condenser water treatment and bleed-off"]}
      authority: ["Cooling water system notification and registration with the local council under the Public Health Act 2010 (verified: false)", "Sydney Water trade waste consent for tower bleed-off (verified: false)"]
    why: "rule.state.cooling-tower-registration and rule.asnzs3666.cooling-tower-microbial-control exist as draft rules (Implications only). The cooling-tower item also makes the app suggest a Hydraulic consultant again through scope_additions[3] for the backflow item; the mechanical engineer normally covers make-up water."
    built_in: {cost_plan: partial, program: "no", rfps: partial}
    source: "knowledge/costs/elements.yaml elements code 08"
  - id: temporary-cooling
    label: Temporary hire chiller needed to keep the building cooled during the change-over
    evidence:
      - "Only one chiller serves the building, so a temporary hire chiller is required during the change-over."
      - "The replacement must proceed over summer, when the remaining chiller cannot carry the building load."
      - "The level 3 data room needs cooling around the clock throughout the works."
    negation:
      - "Replacement will be staged in the cooler months with the remaining chiller carrying the load; no temporary cooling is required."
    profile: []
    adds:
      work_items:
        - {system: electrical.temporary-power, action: new}
      cost_plan: ["Temporary chiller hire, delivery, connection and removal", "Temporary power or generator for the hire chiller", "Temporary chilled water connection points and valves"]
      program: ["Install temporary chilled water connection points", "Connect temporary builders power", "Commission the temporary chiller before cut-over", "Remove the temporary chiller after the new plant is accepted"]
      rfps:
        - {discipline: consultant.mechanical, must_include: [{text: "Temporary cooling strategy, capacity and connection points", key: position.staging}]}
        - {discipline: consultant.electrical, must_include: ["Temporary supply for the hire chiller"]}
      authority: ["Council approval for the hire chiller and generator on the footpath or road, if placed there (verified: false)"]
    why: "fr.temporary-power fires on the electrical.temporary-power new item (label 'Connect temporary builders power')."
    built_in: {program: partial, cost_plan: partial, rfps: partial}
