    - {label: "Cut, fill and trim levels", stage: construction, fragment: fr.earthworks-1a, after: ["Install erosion and sediment controls", "Building set-out survey"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.earthworks-1a", why: "Slab platform"}
    - {label: "Excavate and inspect footings", stage: construction, fragment: fr.footings-1a, after: ["Cut, fill and trim levels"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.footings-1a", why: "Critical-stage inspection before footings (R7 item 2)"}
    - {label: "Under-slab sanitary drainage", stage: construction, fragment: fr.slab-on-ground-1a, after: ["Excavate and inspect footings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.slab-on-ground-1a", why: "Before the pour"}
    - {label: "Install termite management system", stage: construction, fragment: fr.termite-1a, after: ["Excavate and inspect footings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.termite-1a", why: "AS 3660.1"}
    - {label: "Reinforcement inspection before slab pour", stage: construction, fragment: null, after: ["Under-slab sanitary drainage", "Install termite management system"], built_in: "yes", source: "knowledge/clusters/structure/interfaces.yaml if.reinforcement-inspected-before-pour", why: "App hold point 'Hold point: Reinforcement inspection release identifying the pour.' (tagged rows from fr.slab-on-ground-1a); R7 item 3"}
    - {label: "Reinforce and pour slab", stage: construction, fragment: fr.slab-on-ground-1a, after: ["Reinforcement inspection before slab pour"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.slab-on-ground-1a", why: "Concrete pumped over or beside the house"}
    - {label: "Stand wall frames", stage: construction, fragment: fr.frame-timber-1a, after: ["Reinforce and pour slab"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.frame-timber-1a", why: "Prefabricated frames; long lead"}
    - {label: "Install roof trusses and bracing", stage: construction, fragment: fr.frame-timber-1a, after: ["Stand wall frames"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.frame-timber-1a", why: "Trusses or skillion rafters"}
    - {label: "Frame inspection before roof cladding", stage: construction, fragment: null, after: ["Install roof trusses and bracing"], built_in: "yes", source: "knowledge/clusters/structure/interfaces.yaml if.frame-inspected-before-roof", why: "App hold point"}
    - {label: "Install roof cover", stage: construction, fragment: fr.roof-1a, after: ["Frame inspection before roof cladding"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.roof-1a", why: "Roof"}
    - {label: "Install gutters and downpipes", stage: construction, fragment: fr.roof-drainage-1a, after: ["Install roof cover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.roof-drainage-1a", why: "Roof drainage"}
    - {label: "Deliver windows and external doors", stage: construction, fragment: fr.windows-1a, after: ["Award the contract"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.windows-1a", why: "Long lead"}
    - {label: "Install windows and external doors", stage: construction, fragment: fr.windows-1a, after: ["Deliver windows and external doors", "Install roof trusses and bracing"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.windows-1a", why: "Lock-up"}
    - {label: "Wrap and clad external walls", stage: construction, fragment: fr.external-walls-1a, after: ["Install windows and external doors"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.external-walls-1a", why: "Cladding or veneer"}
    - {label: "Rough-in sanitary, water and electrical services", stage: construction, fragment: fr.hydraulic-sanitary-1a, after: ["Install roof cover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.hydraulic-sanitary-1a", why: "Also fr.hydraulic-cold-1a, fr.hydraulic-hot-1a, fr.electrical-1a"}
    - {label: "Tie in sewer, water and sub-main to the main house's services", stage: construction, fragment: fr.services-connections-1a, after: ["Under-slab sanitary drainage"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.services-connections-1a", why: "The app's 'Lead-in connections' row stands for it, framed as an authority lead-in; the shutdown of the occupied house's water or power is not modelled"}
    - {label: "Critical-stage frame inspection before linings", stage: construction, fragment: null, after: ["Rough-in sanitary, water and electrical services", "Install windows and external doors"], built_in: "no", why: "R7 item 4: before covering the framework"}
    - {label: "Install wall and ceiling insulation", stage: construction, fragment: fr.insulation-1a, after: ["Critical-stage frame inspection before linings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.insulation-1a", why: "Before linings"}
    - {label: "Sheet and set plasterboard", stage: construction, fragment: fr.linings-1a, after: ["Install wall and ceiling insulation"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.linings-1a", why: "Linings"}
    - {label: "Install ceilings", stage: construction, fragment: fr.ceilings-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.ceilings-1a", why: "Ceilings"}
    - {label: "Hang internal doors", stage: construction, fragment: fr.internal-doors-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.internal-doors-1a", why: "Doors"}
    - {label: "Waterproof wet areas", stage: construction, fragment: fr.wet-area-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.wet-area-1a", why: "AS 3740"}
    - {label: "Waterproofing inspection before tiling", stage: construction, fragment: null, after: ["Waterproof wet areas"], built_in: "no", why: "R7 item 5"}
    - {label: "Tile wet areas", stage: construction, fragment: fr.tiling-1a, after: ["Waterproofing inspection before tiling"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tiling-1a", why: "Tiling"}
    - {label: "Manufacture joinery", stage: construction, fragment: fr.joinery-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.joinery-1a", why: "Kitchen; check measure after linings"}
    - {label: "Install joinery", stage: construction, fragment: fr.joinery-1a, after: ["Manufacture joinery", "Tile wet areas"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.joinery-1a", why: "Kitchen and vanity"}
    - {label: "Install the switchboard", stage: construction, fragment: fr.switchboard-1a, after: ["Install roof trusses and bracing"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.switchboard-1a", why: "The flat's sub-board"}
    - {label: "Install air-conditioning", stage: construction, fragment: fr.ac-1a, after: ["Sheet and set plasterboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.ac-1a", why: "Wall-mounted splits go in after linings, so the app's order is right here"}
    - {label: "Fit off services, luminaires and smoke alarms", stage: construction, fragment: fr.electrical-1a, after: ["Install joinery", "Install the switchboard"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.electrical-1a", why: "Also fr.lighting-1a, fr.smoke-alarms-1a and hydraulic fit-off"}
    - {label: "Paint internally", stage: construction, fragment: fr.painting-1a, after: ["Install joinery", "Install ceilings", "Hang internal doors"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.painting-1a", why: "Painting"}
    - {label: "Lay floor finishes", stage: construction, fragment: fr.floors-1a, after: ["Paint internally"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.floors-1a", why: "Floors"}
    - {label: "Install stormwater drainage", stage: construction, fragment: fr.stormwater-1a, after: ["Install gutters and downpipes"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.stormwater-1a", why: "Connected into the existing system or kerb"}
    - {label: "Stormwater drainage inspection before covering", stage: construction, fragment: null, after: ["Install stormwater drainage"], built_in: "no", why: "R7 item 6"}
    - {label: "Pave, turf and plant", stage: construction, fragment: fr.landscape-1a, after: ["Stormwater drainage inspection before covering", "Tie in sewer, water and sub-main to the main house's services"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.landscape-1a", why: "Path, turf reinstatement, fence panels back up"}
    # completion and defects
    - {label: "Practical completion inspection", stage: completion, fragment: fr.practical-completion, after: ["Lay floor finishes", "Pave, turf and plant", "Fit off services, luminaires and smoke alarms", "Install air-conditioning"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.practical-completion", why: "PC"}
    - {label: "Stormwater works-as-executed and engineers' certificates", stage: completion, fragment: null, after: ["Install stormwater drainage"], built_in: "no", why: "Needed for the occupation certificate"}
    - {label: "Occupation certificate", stage: completion, fragment: fr.occupation-certificate, after: ["Practical completion inspection", "Stormwater works-as-executed and engineers' certificates"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.occupation-certificate", why: "Final inspection (R7 item 8) and BASIX completion"}
    - {label: "Handover", stage: completion, fragment: fr.handover, after: ["Occupation certificate"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.handover", why: "Keys, certificates, warranties"}
    - {label: "Defects inspection", stage: defects, fragment: fr.defects-inspection, after: ["Handover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-inspection", why: "Defects"}
    - {label: "Defects liability period", stage: defects, fragment: fr.defects-liability-end, after: ["Defects inspection"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "Contract DLP length verified: false (owner ruling R8)"}

# RFP expectations use the data/eval/rfp/answer-keys keys exactly. They state the CORRECT answer for this
# granny flat. app_differs is {key, app, expect, why}; the app's predicted output = expect overridden by it.
rfps:
  - discipline: consultant.architect
    template: architecture
    built_in: "partial"
    source: "knowledge/rfp/architecture.yaml house_documents"
    why: "House module rows fit a building designer; blocks on fact:budget until the budget is stated"
    must_include: ["Concept and schematic design of a secondary dwelling within the floor-area limit", "CDC documentation: site plan with setbacks to boundaries and to the main house, private open space, services routes from the main house, BASIX commitments on the drawings", "Lodging the CDC with the certifier through the NSW Planning Portal", "Certifier liaison", "Design development", "Tender and construction documents for the quote package (house_documents)", "Kitchen, bathroom and laundry layouts", "Finishes, fixtures and appliances schedule", "Specification", "Site plan showing construction access and protection of the occupied house (live_staging)", "Option: quote (bidding) support", "Option: construction-phase support"]
    must_not_include: ["Planning response to council requests (no DA)", "Statement of environmental effects", "Measured drawings or alterations to the main house", "BIM coordination", "Tenant fit-out", "Signage", "Facade certification", "Apartment design-quality submission", "Green Star or NABERS", "Regulated-design declarations", "D&C tender documents", "Post-novation stage", "Community consultation"]
    expect:
      stages_include: [concept, schematic, planning_approval, design_development, house_documents]
      stages_option: [bidding, construction_support, contract_admin]
      stages_absent: [brief_masterplan, planning_response, interiors, tender_traditional, dnc_tender, regulated_design, for_construction, post_novation]
      positions: {coordination: I, input_schedule: I, specialist_coordination: I, specification: I, house_interiors: I, house_selections: I, door_schedule: I, certifier_liaison: I, document_uploads: I, lodgement: I, live_staging: I, consultant_selection: O, ffe: O, modifications: O, value_management: O, marketing_renders: X, court: X, as_built: X, others_fees: X, water_asset: absent, sustainability_docs: absent, country: absent, existing_interfaces: absent, bim_model: absent, tenant_fitout: absent, signage: absent, facade_certification: absent, community: absent, apartment_design: absent}
      blocking: ["fact:budget"]
      sources:
        - "planning_approval: the CDC is a planning approval (pathway cdc); planning_response is da/ssd/planning_permit/modification only"
        - "bidding: a granny-flat owner takes quotes; the designer answers questions, so bidding is an option, matching the app (after the house boundary end)"
        - "live_staging: hdr.cond.operational_constraints partial_occupation turns on the live_site module"
        - "blocking: fact:budget clears once proj.budget_stated is read"
    app_differs:
      - {key: text.R4, app: "Named director, project lead and project architect, with registration numbers", expect: "building designer's qualifications and insurance; NSW architect registration only if the firm uses the title architect", why: "A granny flat is usually drawn by a building designer, who is not a registered architect"}
      - {key: text.live_staging, app: "agreed with the operator", expect: "agreed with the occupying owners", why: "live_site wording is written for an institutional site"}
  - discipline: consultant.structural
    template: structural
    built_in: "partial"
    source: "knowledge/rfp/structural.yaml residential_framing"
    must_include: ["Design basis with the geotechnical site class and AS 4055 wind class", "AS 2870 footing and slab design", "Footings clear of the existing house drain and any sewer zone of influence (services_footings)", "Framing, bracing and tie-down incl. review of supplier frames and trusses", "Construction drawings and design certificate for the CDC", "Option: footing and slab inspections"]
    must_not_include: ["Existing structure assessment (the flat is detached)", "Shared Revit model", "Shoring or retention design", "Dilapidation surveys", "Authority asset stage (unless the sewer-main trigger)", "Regulated design", "D&C or post-novation stages", "Super-flat floor"]
    expect:
      stages_include: [concept_schematic, planning_approval, design_development, tender_traditional, construction_documents]
      stages_option: [construction_phase]
      stages_absent: [existing_assessment, authority_asset, dnc_tender, regulated_design, post_novation]
      positions: {design_basis: I, geotech_brief: I, residential_framing: I, safety_in_design: I, delegated_design: I, services_footings: I, value_management: I, inspection_schedule: I, metalwork: O, services_fixings: O, temporary_works_design: X, dilapidation: X, compaction: X, demolition_drawings: X, shared_model: absent, retention_design: absent, temporary_works_interfaces: absent, super_flat_floor: absent, strengthening: absent, specialist_element_design: absent}
      blocking: []
      sources:
        - "planning_approval included: a CDC is determined on construction-level documents, so the structural design goes in with it"
        - "existing_assessment absent because det.existing_building is false and work type is new"
        - "inspection_schedule I: the row is I whenever construction_phase is chosen, and that stage is already an option"
    app_differs:
      - {key: position.shared_model, app: O, expect: absent, why: "service_level simple O"}
      - {key: position.super_flat_floor, app: O, expect: absent, why: "client flag cannot be set; if_unknown option"}
      - {key: position.specialist_element_design, app: O, expect: absent, why: "O whenever procurement is not design_construct"}
  - discipline: consultant.civil
    template: civil
    built_in: "partial"
    source: "knowledge/rfp/civil.yaml"
    must_include: ["Stormwater plan for the CDC with the discharge point confirmed (existing system, kerb, absorption or easement)", "Capacity and condition of the existing house's stormwater line where the flat connects (CCTV or locating)", "Detailed stormwater design incl. overflow paths", "Erosion and sediment control plan", "Works-as-executed review and stormwater certificate for the OC"]
    must_not_include: ["Driveway long section or vehicle crossing (no vehicle access)", "Public road works", "MUSIC water quality modelling", "NorBE assessment", "Flood report", "OSD unless council requires it", "3D civil model", "Design criteria document", "Trunk drainage", "D&C stages"]
    expect:
      stages_include: [schematic, detailed_tender, as_built]
      stages_option: [for_construction, construction_phase]
      stages_absent: [dnc_tender, post_novation]
      elements_include: [earthworks, stormwater]
      elements_absent: [roads, public_road]
      positions: {utility_plan: I, discharge: I, drainage_model: I, hydraulic_connection: I, safety_in_design: I, retained_services: I, retaining_structural: X, clash_check: X, design_criteria: X, water_strategy: X, quality_audit: X, services_location: X, shoring: X, trunk_drainage: X, sea: X, road_safety_audit: X, om_manual: X, quantities: X, modifications: X, water_quality: absent, norbe: absent, osd_new: absent, osd_existing: absent, osd_replacement: absent, earthworks_suitability: absent, flood_report: absent, flood_evacuation: absent, pavement_design: absent, civil_model: absent, public_road_approvals: absent, civil_declarations: absent}
      blocking: []
      sources:
        - "schematic: the stormwater plan goes in with the CDC"
        - "for_construction option: its deliverable is a CC issue set; under a CDC there is no CC, and the detailed_tender set that goes in with the CDC is the construction issue for a 60 m2 flat"
        - "retained_services: the flat drains into the main house's existing stormwater system, whose condition is unknown"
    app_differs:
      - {key: element.roads, app: include, expect: absent, why: "roads is 'always'; a granny flat has a footpath, no driveway"}
      - {key: position.retained_services, app: absent, expect: I, why: "row needs the existing_building module, which is off for work type new with det.existing_building false"}
      - {key: position.water_quality, app: O, expect: absent, why: "I when flags, else O"}
      - {key: position.civil_model, app: O, expect: absent, why: "service_level simple O"}
      - {key: position.pavement_design, app: O, expect: absent, why: "always O"}
      - {key: stage.as_built, app: option, expect: include, why: "follows construction_phase, which is an option; WAE certification is needed for the OC"}
  - discipline: consultant.geotechnical
    template: geotechnical
    built_in: "partial"
    source: "knowledge/rfp/geotechnical.yaml"
    must_include: ["Investigation plan", "Two boreholes or test pits in the rear yard with DCP tests, hand or small-rig access down the side", "Laboratory reactivity testing", "Report with the AS 2870 site classification and footing recommendations", "Owner arranges access through the occupied property"]
    must_not_include: ["Contamination or waste classification", "Groundwater monitoring wells", "Acid sulfate soils assessment", "Asset exposure", "Novation or transfer"]
    expect:
      stages_include: [g1_plan, g2_field, g3_report]
      stages_option: [g5_design, g6_construction]
      stages_absent: [g4_planning, g7_transfer]
      positions: {plan: I, foundation: I, clearance: I, construction: O, access: X, environment: X, monitoring: absent, asset_exposure: absent, ass: absent, defects: absent, transfer: absent}
      blocking: []
    app_differs:
      - {key: position.monitoring, app: O, expect: absent, why: "always O"}
      - {key: stage.g7_transfer, app: option, expect: absent, why: "default option"}
      - {key: stage.g4_planning, app: option, expect: absent, why: "after the boundary end; a CDC has no planning-stage geotechnical submission"}
      - {key: position.transfer, app: O, expect: absent, why: "O unless g7 included"}
      - {key: position.defects, app: O, expect: absent, why: "always O"}
      - {key: stage.g2_field, app: ask, expect: include, why: "client flag geotech_intrusive cannot be keyed"}
      - {key: position.foundation, app: ask, expect: I, why: "client flag geotech_foundation"}
      - {key: position.clearance, app: ask, expect: I, why: "client flag geotech_intrusive"}
      - {key: position.ass, app: ask, expect: absent, why: "client flag geotech_ass"}
      - {key: position.asset_exposure, app: ask, expect: absent, why: "client flag geotech_asset_exposure"}
  - discipline: consultant.surveyor
    template: land-surveying
    built_in: "partial"
    source: "knowledge/rfp/land-surveying.yaml"
    must_include: ["Detail and contour survey of the rear yard on AHD, with the main house's floor level, fences, trees and outbuildings", "Boundary identification for the CDC setbacks", "Sydney Water main and house drain located from records, with inspection openings and pits picked up", "Access through the occupied house arranged with the owners", "Option: building set-out", "Option: final or identification survey"]
    must_not_include: ["Subdivision or strata titling (a secondary dwelling cannot be subdivided off)", "Interior scan of the main house", "Movement monitoring"]
    expect:
      stages_include: [s1_plan, s2_detail, s3_boundary, s4_services]
      stages_option: [s6_construction, s7_completion]
      stages_absent: [s5_support]
      positions: {control: I, records: I, boundary: I, adjoining: I, buried: I, sewer: I, access: I, setout: O, asbuilt: O, exposure: X, titling: absent, interior: absent, monitoring: absent}
      blocking: []
      sources:
        - "access I: live_operations is yes from partial_occupation"
        - "buried and sewer I: the house drain, pits and the sewer main decide where the flat can go"
    app_differs:
      - {key: position.titling, app: O, expect: absent, why: "always O"}
      - {key: position.interior, app: O, expect: absent, why: "always O"}
      - {key: position.monitoring, app: O, expect: absent, why: "always O"}
      - {key: stage.s5_support, app: option, expect: absent, why: "after the boundary"}
      - {key: stage.s2_detail, app: ask, expect: include, why: "client flag survey_detail"}
      - {key: stage.s3_boundary, app: ask, expect: include, why: "client flag survey_boundary"}
      - {key: stage.s4_services, app: ask, expect: include, why: "client flag survey_services"}
      - {key: position.boundary, app: ask, expect: I, why: "client flag survey_boundary"}
      - {key: position.adjoining, app: ask, expect: I, why: "client flag survey_adjoining"}
      - {key: position.buried, app: ask, expect: I, why: "client flag survey_buried"}
      - {key: position.sewer, app: ask, expect: I, why: "client flag survey_sewer"}
  - discipline: consultant.certifier
    template: bca-certification
    built_in: "no"
    source: "knowledge/rfp/bca-certification.yaml unsupported_pathways"
    why: "The certifier is the approval authority for this job, but the template blocks on cdc and its B stages need da or ssd. The owner's key bca-unsupported-cdc says a CDC needs its own scope and the CC stages are not relabelled"
    must_include: ["CDC eligibility check against the secondary dwelling standards and the planning certificate", "CDC assessment and determination", "Neighbour notices the certifier gives (verified: false)", "Principal certifier appointment", "Every critical-stage inspection in owner ruling R7, incl. the pre-commencement inspection", "Occupation certificate with the BASIX completion check"]
    must_not_include: ["Package A BCA advisory", "Construction certificate (there is none under a CDC)", "Performance solution authorship", "Design", "Building supervision", "Classification map", "Staged occupation", "Fire referrals"]
    expect:
      stages_include: []
      stages_option: []
      stages_absent: [a1_inception, a2_planning, a3_tender, a4_construction, b1_preliminary, b2_construction_approval, b3_construction, b4_occupation]
      blocking: ["pathway_unsupported"]
      sources:
        - "data/eval/rfp/answer-keys/bca-unsupported-cdc.yaml: CDC must receive its own scope; existing CC stages cannot be relabelled"
    app_differs:
      - {key: stage.a1_inception, app: ask, expect: absent, why: "client flag bca_advisory cannot be keyed"}
      - {key: stage.a3_tender, app: ask, expect: absent, why: "client flag bca_advisory cannot be keyed"}
      - {key: stage.a4_construction, app: option, expect: absent, why: "after the boundary end; no BCA advisory on a granny flat"}
      - {key: text.cdc_scope, app: "no CDC stage exists", expect: "CDC eligibility, determination, principal certifier, inspections and OC", why: "Gap: the template has no CDC scope, so the base job's approval authority cannot be sent an RFP"}
  - discipline: consultant.basix
    template: null
    built_in: "no"
    must_include: ["BASIX certificate for the new dwelling (DIY or NatHERS thermal method)", "Thermal, energy and water commitments marked on the CDC plans", "One revision if the design changes before the CDC"]
    must_not_include: ["NCC Section J", "Green Star", "NABERS", "Assessment of the main house"]

triggers:
  - id: builder-designs
    label: Turnkey design and construct by a granny-flat builder
    evidence: ["Fixed-price turnkey granny flat package: design, CDC approval and construction by the builder", "the builder's drafting team will prepare the plans, engineering, BASIX and the CDC application", "choose a floor plan from the builder's granny flat range"]
    negation: ["Our designer has documented the flat and we are seeking quotes from three builders", "Owner-engaged designer with lump-sum quotes"]
    profile: [hdr.cond.procurement_route, hdr.cond.quality_level]
    adds:
      program: ["Sign the builder's design and approvals agreement", "Builder prepares the CDC set", "Sign the building contract"]
      rfps: [{discipline: consultant.certifier, must_include: ["Principal certifier independent of the builder for a builder-designed dwelling"]}]
      authority: ["Owner, not the builder, appoints the principal certifier (verified: false)"]
    removes:
      procurement: [consultant.architect, consultant.structural, consultant.civil, consultant.geotechnical, consultant.surveyor, consultant.basix]
      cost_plan: ["Building designer", "Structural engineer", "Civil (stormwater) engineer", "Geotechnical engineer", "Surveyor", "BASIX assessor"]
