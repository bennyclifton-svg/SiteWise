schema: sitewise-synthetic-shape/1
type_id: T12
slug: granny-flat
name: Secondary dwelling (granny flat)
reviewed: false
state: NSW
# Base scenario: a detached, single-storey, two-bedroom secondary dwelling of about 60 m2 in the
# backyard of an owner-occupied house on a 600 m2 suburban Sydney lot. Complying development (CDC)
# by a registered certifier. The owners engage a building designer and a small consultant team
# directly, then take quotes from two or three builders on a lump-sum domestic contract. Services
# are taken from the main house. The owners keep living in the main house throughout. See DOMAIN.md
# section 1. Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
profile:
  hdr.building_class: residential
  hdr.subclass: house
  hdr.work_type: new
  hdr.cond.planning: cdc
  hdr.cond.procurement_route: traditional
  hdr.cond.quality_level: project_home
  # The owners live in the main house; the works zone is the backyard behind it.
  hdr.cond.operational_constraints: partial_occupation
  hdr.cond.stakeholder_complexity: single_owner
  # Construction access is down the side of the occupied house, through a gate.
  hdr.cond.access_constraints: urban_constrained
  hdr.cond.environmental_sensitivity: standard
  hdr.scale.storeys: 1
  hdr.scale.site_sqm: 600
  hdr.scale.gfa_sqm: 60
  hdr.scale.bedrooms: 2
  hdr.scale.bathrooms: 1
  hdr.scale.garage_spaces: 0
  det.ncc_class: [1a]
  det.state: NSW
  # Work is a new detached building. The main house is an interface, not the subject of the work
  # (DOMAIN.md section 3). The attached-secondary-dwelling and garage-conversion triggers set this true.
  det.existing_building: false
  det.heritage_status: none
  det.bushfire_prone_land: false
  det.flood_hazard: false
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  det.climate_zone: "5"
  det.sewer_connection: reticulated
  det.water_supply_source: reticulated
  det.gas_supply: none
  fact.contract_form: domestic_hia
  proj.regulated_design: "no"
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.architect_lodges: "yes"
  flag.basement: "no"
  flag.excavation_adjoining: "no"
  flag.authority_asset: "no"
  flag.arborist_tree_impacts: "no"
  flag.arborist_offsite_trees: "no"
  flag.osd_required: "no"
  flag.osd_existing: "no"
  flag.cl46: "no"
  flag.panel: "no"
  flag.public_road: "no"
  flag.norbe: "no"
  flag.stormwater_quality: "no"
  flag.sustainability_target: "no"
  flag.community: "no"
  flag.groundwater: "no"
  flag.rail: "no"
  flag.transfer_structures: "no"
  flag.coastal: "no"
  flag.country: "no"
  flag.staged: "no"
  flag.multi_building: "no"

# Values the app derives or cannot set through PUT /profile (no profile_group); not inputs.
expected_derived:
  - {key: det.basix_required, value: true, source: "knowledge/clusters/envelope/rules.yaml rule.basix.certificate-required", note: "A new secondary dwelling is a new Class 1a dwelling; derivation pending in the rule; returns unknown today"}
  - {key: det.energy_compliance_pathway, value: basix, note: "no profile_group, so not settable"}

scenario_inputs:
  - {key: proj.budget_stated, note: "stated in the owners' brief; amount chosen by the scenario author; without it the architecture RFP blocks on fact:budget. The range straddles the long service levy threshold ($250,000 or more incl. GST), so the levy line and row apply only when the stated cost of work is at or above it: state which side", phrasing: "Construction budget: $<amount> excluding GST"}
  - {key: flag.architect_lodges, note: "the flag needs an explicit statement in a read document", phrasing: "The designer will lodge the complying development application with the certifier through the NSW Planning Portal"}
  - {key: det.ncc_class, note: "'Class 1' alone is not read; the documents must say 1a", phrasing: "The secondary dwelling is a Class 1a building under the NCC"}
  - {key: hdr.cond.operational_constraints, note: "stated in the brief, not inferred from 'existing dwelling'", phrasing: "The owners will continue to live in the main house throughout the works"}
  - {key: hdr.scale.gfa_sqm, note: "documents also state the main house's floor area; the key is the new dwelling's", phrasing: "Secondary dwelling gross floor area: 60 m2 (main house unchanged)"}

work_items:
  # site
  - {system: site.survey-boundaries, action: investigate, why: "Detail, level and boundary survey of the rear yard before design: CDC setbacks, sewer main and house drain locations, existing house floor level; builder's set-out later"}
  - {system: site.ground-conditions, action: investigate, why: "Geotechnical site classification to AS 2870 for the new slab; not in the default list"}
  - {system: site.earthworks, action: new, why: "Minor cut and fill to the slab platform in the backyard; spoil taken out down the side passage"}
  - {system: site.erosion-sediment-control, action: new, why: "Sediment fence and stabilised access along the side passage; standard CDC condition"}
  - {system: site.stormwater-detention, action: new, why: "New roof water piped to the existing site drainage, the kerb or an absorption trench as the stormwater plan directs"}
  - {system: site.services-connections, action: alter, why: "Branch the existing water service, connect the new drainage line to the house drain or sewer junction, run the electrical sub-main from the main house; no new authority lead-in in the base"}
  - {system: site.adjoining-structures, action: retain, why: "Protect the occupied main house, its paths and the boundary fences; side fence panels taken down for access are reinstated; not in the default list"}
  - {system: site.landscape, action: new, why: "Path from the street to the flat's entry, turf reinstatement, the flat's private open space"}
  # substructure
  - {system: substructure.footings, action: new, why: "Edge beams and pads to the AS 2870 design, founded clear of the house drain and any sewer zone of influence"}
  - {system: substructure.slab-on-ground, action: new, why: "Waffle or stiffened raft slab"}
  - {system: substructure.termite-management, action: new, why: "AS 3660.1 barrier"}
  # structure
  - {system: structure.timber, action: new, why: "Prefabricated wall frames and trusses (many granny-flat builders use light steel frames instead: structure.steel)"}
  # envelope
  - {system: envelope.external-walls, action: new, why: "Brick veneer or lightweight cladding (fibre cement, AAC panel or weatherboard)"}
  - {system: envelope.roof-coverings, action: new, why: "Metal sheet roof, usually skillion or low pitch"}
  - {system: envelope.windows-doors, action: new, why: "Aluminium windows and sliding doors; long lead"}
  - {system: envelope.flashings-seals, action: new, why: "Flashings and damp-proof courses"}
  - {system: envelope.pliable-membranes, action: new, why: "Sarking and wall wrap"}
  - {system: envelope.thermal-insulation, action: new, why: "Insulation to the BASIX thermal commitments"}
  - {system: envelope.thermal-performance, action: new, why: "BASIX thermal, energy and water commitments for a new dwelling"}
  # interiors
  - {system: interiors.walls-linings, action: new, why: "Plasterboard and wet-area linings"}
  - {system: interiors.ceilings, action: new, why: "Plasterboard ceilings"}
  - {system: interiors.wet-area-waterproofing, action: new, why: "Bathroom and laundry (often a European laundry in the bathroom) to AS 3740"}
  - {system: interiors.tiling, action: new, why: "Bathroom, laundry and kitchen splashback"}
  - {system: interiors.floor-finishes, action: new, why: "Hybrid or vinyl plank flooring"}
  - {system: interiors.joinery, action: new, why: "Kitchen, vanity, robes"}
  - {system: interiors.internal-doors, action: new, why: "Doors, frames and hardware"}
  - {system: interiors.internal-glazing, action: new, why: "Shower screen and mirror"}
  - {system: interiors.painting, action: new, why: "Internal painting"}
  - {system: interiors.ffe, action: new, why: "Cooktop, oven and rangehood supplied by the builder; not in the default list"}
  # fire-active
  - {system: fire-active.smoke-alarms, action: new, why: "Hard-wired smoke alarms in the new dwelling"}
  # mechanical
  - {system: mechanical.air-conditioning, action: new, why: "One or two wall-mounted split systems, installed by the AC trade"}
  - {system: mechanical.local-exhaust, action: new, why: "Bathroom and rangehood exhaust ducted outside"}
  # hydraulic
  - {system: hydraulic.cold-water, action: new, why: "Water branched from the main house's service after the meter"}
  - {system: hydraulic.hot-water, action: new, why: "Heat-pump or electric hot water unit to the BASIX commitment"}
  - {system: hydraulic.sanitary, action: new, why: "Under-slab drainage to the existing house drain or sewer junction, with an inspection opening and overflow relief gully"}
  - {system: hydraulic.roof-drainage, action: new, why: "Gutters and downpipes"}
  # electrical
  - {system: electrical.switchboards, action: new, why: "Sub-board in the flat, plus a new sub-main circuit breaker in the main house's board"}
  - {system: electrical.cabling-wiring, action: new, why: "Sub-main trenched from the main house; final subcircuits"}
  - {system: electrical.lighting, action: new, why: "Internal and external lighting"}
  # comms
  - {system: comms-security.structured-cabling, action: new, why: "TV and data points; NBN lead-in only if the owners want a separate service"}

procurement:
  - {discipline: consultant.architect, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Usually a building designer, not a registered architect; design, CDC documents, construction drawings, quote package"}
  - {discipline: consultant.surveyor, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Detail and boundary survey: CDC setbacks, sewer and drainage locations, levels at the main house"}
  - {discipline: consultant.geotechnical, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "AS 2870 site classification for the new slab"}
  - {discipline: consultant.structural, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Slab and footing design, framing review, certificates; usually the same firm as the civil engineer"}
  - {discipline: consultant.civil, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "The added roof changes the catchment, so a stormwater plan is needed (owner ruling R1); usually the structural firm"}
  - {discipline: consultant.basix, kind: services, need: usually, built_in: "no", why: "BASIX certificate for a new dwelling; a NatHERS assessor or the designer using the BASIX DIY method; no package rule names it"}
  - {discipline: consultant.certifier, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Determines the CDC, acts as principal certifier, inspects, issues the occupation certificate"}
  - {discipline: trade.main_works, kind: works, need: always, built_in: "partial", source: "internal/procurement/proposed.go ProposeHeadContract", why: "Lump-sum domestic contract with a licensed builder, often a granny-flat specialist; proposed only from gaps on accepted work items"}

not_expected_procurement:
  - {discipline: consultant.town_planner, app_label: "Town Planner", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "CDC: there is no DA, no statement of environmental effects and nothing for a planner to lodge; the town-planning RFP also blocks on cdc"}
  - {discipline: consultant.electrical, app_label: "Electrical", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Sub-main, sub-board and circuits are designed and installed by the electrician; maximum demand is the electrician's calculation"}
  - {discipline: consultant.hydraulic, app_label: "Hydraulic", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Plumbing and the connection to the house drain are designed and certified by the licensed plumber; stormwater is the civil engineer's"}
  - {discipline: consultant.mechanical, app_label: "Mechanical", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml scope_additions[2]", why: "Split systems and exhaust fans are design-and-install by the AC trade and electrician"}

cost_plan:
  - {line: "Complying development certificate fee (certifier's determination and council registration)", section: fees_and_charges, built_in: "partial", source: "knowledge/costs/starter_lines.yaml cc-fees", why: "No CDC line; the app keeps P05 'Construction certificate and certifier fees' on a CDC, which can hold it under the wrong label"}
  - {line: "Development contributions payable on the CDC (s7.11 or s7.12, verified: false)", section: fees_and_charges, built_in: "no", why: "The da-fees starter applies only to da, so a CDC loses the contributions line"}
  - {line: "Long service levy (cost of work $250,000 or more incl. GST, 0.25%; Long Service Corporation; figure for owner confirmation)", section: fees_and_charges, built_in: "no", why: "Conditional: paid before the CDC issues only when the cost of work is at or above the threshold"}
  - {line: "Sydney Water Tap in and service connection fees", section: fees_and_charges, built_in: "partial", source: "knowledge/costs/starter_lines.yaml service-authority", why: "One generic service-authority line; no DNSP fee in the base because supply comes from the main house"}
  - {line: "Home Building Compensation Fund insurance", section: fees_and_charges, built_in: "no", why: "Required above $20,000 (owner ruling R4); builder's premium inside the contract sum, listed so an exclusion is caught"}
  - {line: "Building designer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "F-line 'Architect' from the adopted package"}
  - {line: "Structural engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line from the adopted package"}
  - {line: "Civil (stormwater) engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line; often one fee with the structural engineer"}
  - {line: "Geotechnical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Fee line from the adopted package"}
  - {line: "Surveyor", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Detail and boundary survey; set-out is the builder's"}
  - {line: "Certifier", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Professional fee; the app also adds P05, a double-count risk"}
  - {line: "BASIX assessor", section: consultants, built_in: "no", why: "No package rule"}
  - {line: "Preliminaries and builder's margin (incl. protection of the occupied house and restricted access)", section: construction, built_in: "no", why: "No line; a stated budget spreads preliminaries pro rata"}
  - {line: "Site works and external works (incl. service tie-ins to the main house)", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 01", why: "Earthworks, sediment control, stormwater, service connections, path, landscape, fence reinstatement"}
  - {line: "Substructure", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 02", why: "Slab, footings, termite management"}
  - {line: "Structure", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 03", why: "Frames and trusses"}
  - {line: "Building envelope", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 04", why: "Cladding, roof, windows, insulation"}
  - {line: "Interiors and finishes", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 05", why: "Linings, waterproofing, tiling, kitchen, floors, painting, appliances"}
  - {line: "Mechanical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 08", why: "Split systems and exhaust"}
  - {line: "Hydraulic services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 09", why: "Plumbing, drainage, hot water"}
  - {line: "Electrical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 10", why: "Sub-main, sub-board, power, lighting; smoke alarms belong here"}
  - {line: "Communications and security", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 11", why: "TV and data points"}
  - {line: "Provisional sums and PC items", section: construction, built_in: "no", why: "Allowances for undecided selections and for unknown service tie-in conditions"}
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml design-contingency", why: "Always"}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml construction-contingency", why: "Always; hidden service conditions at the main house are the usual draw"}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml escalation", why: "Always"}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml exclusions", why: "Always"}
  - {line: "Owner supply items (window furnishings, loose furniture)", section: contingency, built_in: "partial", source: "internal/store/cost_budget.go applyBriefFigures", why: "Only when proj.owner_supply_stated is read"}

not_expected_cost_plan:
  - {line: "Electrical (consultant fee)", app_label: "F04 Electrical", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Hydraulic (consultant fee)", app_label: "F06 Hydraulic", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Mechanical (consultant fee)", app_label: "F07 Mechanical", section: consultants, source: "knowledge/works/package_defaults.yaml scope_additions[2]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Town planner (consultant fee)", app_label: "F10 Town Planner", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Adopted suggestion on a CDC job"}
  - {line: "Active fire protection", app_label: "07 Active fire protection", section: construction, source: "knowledge/costs/elements.yaml code 07", why: "Made from the smoke-alarm item; a QS carries smoke alarms in electrical"}

program:
  skeleton: sk.new-traditional-cdc
  activities:
    # investigation
    - {label: "Planning certificate confirming complying development may be carried out", stage: investigation, fragment: null, after: [], built_in: "no", why: "s10.7 certificate (verified: false) shows whether the codes apply and any exclusion (heritage, flood, bushfire); decides CDC or DA"}
    - {label: "Sydney Water sewer diagram and asset check", stage: investigation, fragment: null, after: [], built_in: "no", why: "Finds a main in the backyard and the house drain route before the flat is placed"}
    - {label: "Detail and boundary survey", stage: investigation, fragment: fr.investigate-survey, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.investigate-survey", why: "Fires because site.survey-boundaries is keyed investigate; with the default action new it would not"}
    - {label: "Geotechnical investigation", stage: investigation, fragment: fr.investigate-geotech, after: [], built_in: "partial", source: "knowledge/program/fragments.yaml fr.investigate-geotech", why: "site.ground-conditions is not in the default scope"}
    - {label: "Check existing services capacity at the main house", stage: investigation, fragment: null, after: [], built_in: "no", why: "Electrician's maximum-demand check of the existing supply and board; locate the house drain, junction and water service"}
    # concept
    - {label: "Confirm the brief", stage: concept_design, fragment: fr.concept-design-1a, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Brief incl. the floor-area limit for a secondary dwelling"}
    - {label: "Prepare the concept design", stage: concept_design, fragment: fr.concept-design-1a, after: ["Confirm the brief", "Detail and boundary survey", "Planning certificate confirming complying development may be carried out", "Sydney Water sewer diagram and asset check"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Placed on the survey, clear of the sewer and inside the CDC setbacks"}
    - {label: "Client review of the concept", stage: concept_design, fragment: fr.concept-design-1a, after: ["Prepare the concept design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-1a", why: "Owner approval"}
    - {label: "Develop the design", stage: concept_design, fragment: fr.design-development-1a, after: ["Client review of the concept", "Geotechnical investigation", "Check existing services capacity at the main house"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.design-development-1a", why: "Design development"}
    # approval documentation (a CDC needs construction-level documents before lodgement)
    - {label: "BASIX certificate", stage: approval_documentation, fragment: null, after: ["Develop the design"], built_in: "no", why: "Lodged with the CDC application"}
    - {label: "Stormwater plan", stage: approval_documentation, fragment: null, after: ["Develop the design"], built_in: "no", why: "Civil engineer; discharge to the existing system, kerb or absorption confirmed"}
    - {label: "Prepare construction documentation", stage: approval_documentation, fragment: fr.construction-docs-1a, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-docs-1a", why: "sk.new-traditional-cdc has no construction_documentation stage; resolveStage places it in approval documentation (nearest earlier), which is right for a CDC"}
    - {label: "Coordinate consultant documentation", stage: approval_documentation, fragment: fr.construction-docs-1a, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.construction-docs-1a", why: "Structural and stormwater design for the CDC"}
    - {label: "Prepare approval documentation", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "CDC drawings and site plan"}
    - {label: "Coordinate consultant reports", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "Structural, stormwater and BASIX reports for the CDC set"}
    - {label: "Sydney Water Tap in building plan approval", stage: approval_documentation, fragment: null, after: ["Prepare approval documentation"], built_in: "no", why: "Stamped plans the certifier needs before determining (verified: false)"}
    - {label: "Client sign-off for lodgement", stage: approval_documentation, fragment: fr.approval-docs-1a, after: ["Prepare approval documentation", "Coordinate consultant reports", "Prepare construction documentation", "Coordinate consultant documentation", "BASIX certificate", "Stormwater plan", "Sydney Water Tap in building plan approval"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.approval-docs-1a", why: "Sign-off"}
    # approvals
    - {label: "Pay long service levy", stage: approvals, fragment: null, after: ["Client sign-off for lodgement"], built_in: "no", why: "Before the CDC issues, where the cost of work is $250,000 or more incl. GST"}
    - {label: "Prepare and lodge the complying development certificate", stage: approvals, fragment: fr.cdc-application, after: ["Client sign-off for lodgement"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.cdc-application", why: "Lodged through the NSW Planning Portal"}
    - {label: "Certifier notifies neighbours within 20 m (14 days before determination)", stage: approvals, fragment: null, after: ["Prepare and lodge the complying development certificate"], built_in: "no", why: "Certifier's notice; metropolitan area; Regulation clause verified: false"}
    - {label: "Certifier determination", stage: approvals, fragment: fr.cdc-application, after: ["Certifier notifies neighbours within 20 m (14 days before determination)", "Pay long service levy"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.cdc-application", why: "du.cdc-determination-period"}
    # procurement
    - {label: "Assemble the tender package", stage: procurement, fragment: fr.tender-docs-1a, after: ["Client sign-off for lodgement"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-docs-1a", why: "Quote package to two or three builders; runs alongside the CDC"}
    - {label: "Tender period", stage: procurement, fragment: fr.tender-period-1a, after: ["Assemble the tender package"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-period-1a", why: "Quotes, with a site visit through the occupied house"}
    - {label: "Evaluate tenders", stage: procurement, fragment: fr.tender-evaluation-1a, after: ["Tender period"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-evaluation-1a", why: "Inclusions, exclusions and provisional sums compared"}
    - {label: "Award the contract", stage: procurement, fragment: fr.contract-award, after: ["Evaluate tenders", "Certifier determination"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.contract-award", why: "Domestic lump-sum contract"}
    - {label: "Builder provides HBCF insurance certificate", stage: procurement, fragment: null, after: ["Award the contract"], built_in: "no", why: "Before deposit or work (owner ruling R4)"}
    - {label: "Appoint principal certifier and give notice of commencement", stage: procurement, fragment: null, after: ["Certifier determination", "Builder provides HBCF insurance certificate"], built_in: "no", why: "Before any work; the owner appoints"}
    - {label: "Give neighbours notice of commencement (at least 7 days before work)", stage: procurement, fragment: null, after: ["Certifier determination"], built_in: "no", why: "CDC holder's written notice; Planning Portal 'What to tell your neighbours'"}
    - {label: "Pre-commencement inspection by the principal certifier", stage: procurement, fragment: null, after: ["Appoint principal certifier and give notice of commencement"], built_in: "no", why: "Owner ruling R7 item 1"}
    # construction
    - {label: "Establish the site", stage: construction, fragment: fr.site-establishment-1a, after: ["Pre-commencement inspection by the principal certifier", "Give neighbours notice of commencement (at least 7 days before work)"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.site-establishment-1a", why: "Site fence between the works and the family's yard, side gate or fence panels taken down"}
    - {label: "Protect the occupied house and keep its access and services live", stage: construction, fragment: null, after: ["Establish the site"], built_in: "no", why: "fr.occupied-protection needs refurb and existing_building, so a new build behind an occupied house gets nothing"}
    - {label: "Install erosion and sediment controls", stage: construction, fragment: fr.erosion-control, after: ["Establish the site"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.erosion-control", why: "Before disturbance"}
