      rfps: [{discipline: consultant.hydraulic, must_include: [{text: "Trade waste drainage, grease arrestor sizing and discharge controls", key: position.trade}, "Sydney Water trade wastewater application"]}]
      authority: ["Sydney Water acceptance of the arrestor location and any pumped discharge (verified: false)"]
    why: "No profile key changes (the base value already holds). uc.shop-to-cafe-change-has-no-path-for-grease-arrestor is an Implication only. The hydraulic RFP's trade position needs the client flag hyd_trade (if_unknown option)"
