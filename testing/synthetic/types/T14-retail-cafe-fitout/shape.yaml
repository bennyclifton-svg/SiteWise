schema: sitewise-synthetic-shape/1
type_id: T14
slug: retail-cafe-fitout
name: Retail or café fit-out (kitchen, grease trap)
reviewed: false
state: NSW
# Base: a café of about 120 m2 fitted out in a vacant ground-floor shop in a single-storey 1960s strip of
# shops on a Sydney local main street. The previous use was a non-food shop, so a DA is lodged for the
# food and drink premises use, the kitchen exhaust and the signage. Commercial kitchen with an exhaust hood
# discharging through the tenancy's own roof, a new in-ground grease arrestor, an accessible unisex WC,
# about 36 seats inside. All-electric cooking. Small designer-led team: an interior designer leads, the
# tenant (café operator) is the client, the landlord approves the design, a shopfitter builds under a
# lump-sum contract, and the services trades design and certify their own work.
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
profile:
  hdr.building_class: commercial
  hdr.subclass: food_beverage
  hdr.work_type: refurb
  hdr.cond.planning: da
  hdr.cond.procurement_route: traditional
  hdr.cond.quality_level: mid
  hdr.cond.operational_constraints: vacant
  hdr.cond.stakeholder_complexity: single_owner
  hdr.cond.access_constraints: urban_constrained
  hdr.cond.environmental_sensitivity: standard
  hdr.scale.gfa_sqm: 120
  hdr.scale.existing_gfa_sqm: 120
  hdr.scale.added_gfa_sqm: 0
  hdr.scale.seats: 36
  hdr.scale.kitchen_sqm: 25
  hdr.scale.storeys: 1
  det.ncc_class: ["6"]
  det.state: NSW
  det.existing_building: true
  det.existing_building_year: 1965
  det.heritage_status: none
  det.sprinklered: false
  det.bushfire_prone_land: false
  det.flood_hazard: false
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  det.gas_supply: none
  det.sewer_connection: reticulated
  det.water_supply_source: reticulated
  fact.contract_form: abic
  fact.contract_basis: lump_sum
  proj.regulated_design: "no"
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.cl46: "no"
  flag.panel: "no"
  flag.community: "no"
  flag.staged: "no"
  flag.multi_building: "no"
  flag.architect_lodges: "no"
  flag.sustainability_target: "no"
  flag.country: "no"
  flag.basement: "no"
  flag.excavation_adjoining: "no"
  flag.authority_asset: "no"
  flag.arborist_tree_impacts: "no"
  flag.public_road: "no"
  flag.heavy_vehicles: "no"
  flag.state_road: "no"
  flag.tfnsw_referral: "no"
  flag.fire_vulnerable_occupants: "no"
  flag.fire_special_hazards: "no"
  flag.fire_specialist_systems: "no"

# Values the app derives or cannot set through PUT /profile (no profile_group); not inputs.
expected_derived:
  - {key: det.commercial_kitchen, value: true, source: "knowledge/determinants.yaml commercial_kitchen", note: "no profile_group and no triggers, so it can be neither set nor read; rule.as1668-1.kitchen-exhaust-fire-rated-duct and rule.water-authority.trade-waste-agreement gate on it and therefore never apply"}
  - {key: det.trade_waste_use, value: true, source: "knowledge/determinants.yaml trade_waste_use", note: "no profile_group and no triggers; same effect as commercial_kitchen"}
  - {key: det.energy_compliance_pathway, value: section_j_dts, source: "knowledge/determinants.yaml energy_compliance_pathway", note: "Section J applies to the new lighting and air-conditioning of a Class 6 fit-out (verified: false); no profile_group, so not settable"}
  - {key: det.occupant_load, note: "seats plus staff drive the NCC sanitary facility count (rule.ncc.sanitary-facility-quantities); no profile_group, so not settable; the scenario states seats and staff numbers"}

# Facts the scenario's documents must state; the scenario author picks the value.
scenario_inputs:
  - {key: proj.budget_stated, note: "stated in the tenant's brief; amount chosen by the scenario author; spreads by the commercial_fitout split", phrasing: "Fit-out budget: $<amount> excluding GST, excluding kitchen equipment"}
  - {key: proj.owner_supply_stated, note: "kitchen equipment is supplied by the tenant direct from a commercial kitchen supplier", phrasing: "Owner supply: commercial kitchen equipment, coffee machine and grinders, loose furniture and smallwares"}
  - {key: det.existing_building, note: "the determinant triggers only on the words 'existing building'", phrasing: "The works are a fit-out of an existing building: a ground-floor shop in a single-storey strip of shops"}
  - {key: det.existing_building_year, note: "the trigger needs 'built in <year>' or 'year built'", phrasing: "The building was built in <year>"}
  - {key: det.ncc_class, note: "never derived from the subclass; must be read from the certifier's or designer's report", phrasing: "Building classification: Class 6 (café)"}
  - {key: det.heritage_status, note: "stated as the enumerated none on the s10.7 planning certificate (verified: false)", phrasing: "The land is not a heritage item and is not within a heritage conservation area"}
  - {key: hdr.cond.planning, note: "the DA is named in the brief and the planner's or designer's letter", phrasing: "A development application will be lodged with council for the change of use to a café, the kitchen exhaust and the signage"}
  - {key: det.gas_supply, note: "base is all-electric cooking; the enumerated none must be stated", phrasing: "There is no gas supply to the tenancy and none is proposed; all cooking equipment is electric"}

work_items:
  - {system: site.demolition, action: remove, why: "Strip out the previous retail fit-out: shelving, ceiling, floor coverings and redundant services"}
  - {system: site.signage, action: new, why: "Fascia and under-awning signs; in the DA unless exempt"}
  - {system: site.waste-storage, action: new, why: "Bin storage for general waste, recycling and food organics at the rear, to the DA waste management plan"}
  - {system: envelope.windows-doors, action: alter, why: "New shopfront glazing and an accessible entry door"}
  - {system: envelope.roof-coverings, action: alter, why: "Roof penetration, flashing and fan plinth for the kitchen exhaust"}
  - {system: interiors.walls-linings, action: new, why: "Kitchen walls lined with smooth, impervious, washable finishes (FSANZ Standard 3.2.3, AS 4674; verified: false); WC partitions"}
  - {system: interiors.ceilings, action: new, why: "Sealed, washable ceiling over the kitchen; feature ceiling to the dining area"}
  - {system: interiors.floor-finishes, action: new, why: "Impervious, slip-resistant, coved kitchen floor; dining floor finish"}
  - {system: interiors.tiling, action: new, why: "Accessible WC and kitchen wall tiling"}
  - {system: interiors.wet-area-waterproofing, action: new, why: "Accessible WC and the kitchen floor graded to floor wastes"}
  - {system: interiors.joinery, action: new, why: "Front counter, coffee bar, display, back bar and banquettes"}
  - {system: interiors.internal-doors, action: new, why: "WC door and kitchen door"}
  - {system: interiors.painting, action: new, why: "Internal painting"}
  - {system: interiors.ffe, action: new, why: "Commercial kitchen equipment, coffee machine and refrigerated display; loose furniture. The scenario documents must state: supplied and installed by the tenant's kitchen supplier, outside the contract (provider owner), or it double counts with the owner-supply line"}
  - {system: fire-passive.penetrations, action: new, why: "Fire-stop service penetrations through the walls separating the tenancy from its neighbours"}
  - {system: fire-active.portable-extinguishers, action: new, why: "Extinguishers and a fire blanket at the cooking line (AS 2444; verified: false)"}
  - {system: fire-active.emergency-lighting, action: new, why: "Exit signs and emergency lighting (AS 2293.1; verified: false)"}
  - {system: mechanical.local-exhaust, action: new, why: "Kitchen exhaust hood, grease filters, duct and roof fan with vertical discharge (AS 1668.2; verified: false); WC exhaust"}
  - {system: mechanical.ventilation, action: new, why: "Make-up air to the kitchen so the hood works and doors are not pressurised"}
  - {system: mechanical.air-conditioning, action: new, why: "Split or ducted air-conditioning to the dining area"}
  - {system: hydraulic.trade-waste, action: new, why: "In-ground grease arrestor, trade waste drainage from sinks and dishwasher, sampling point; Sydney Water permit"}
  - {system: hydraulic.sanitary, action: alter, why: "New floor wastes, sinks, hand basins and the accessible WC on the existing sewer connection"}
  - {system: hydraulic.cold-water, action: alter, why: "Water to sinks, hand basins, dishwasher, coffee machine and ice machine"}
  - {system: hydraulic.hot-water, action: new, why: "Commercial hot-water unit sized for the dishwasher and hand basins"}
  - {system: hydraulic.backflow-prevention, action: new, why: "Containment device at the meter and individual protection on the coffee and ice machines"}
  - {system: electrical.switchboards, action: upgrade, why: "New tenancy distribution board for the kitchen load"}
  - {system: electrical.cabling-wiring, action: alter, why: "Dedicated circuits for kitchen equipment, coffee machine and refrigeration"}
  - {system: electrical.lighting, action: new, why: "Dining and kitchen lighting; Section J lighting power (verified: false)"}
  - {system: comms-security.structured-cabling, action: new, why: "Point-of-sale, data and Wi-Fi points"}
  - {system: access-egress.accessible-facilities, action: new, why: "Accessible unisex WC to AS 1428.1 (verified: false)"}
  - {system: access-egress.accessible-access, action: alter, why: "Accessible entry and path of travel from the street to the accessible WC (Premises Standards affected part; verified: false)"}
  - {system: access-egress.egress-doors, action: alter, why: "Entry door doubles as the exit; hardware and swing"}

procurement:
  - {discipline: consultant.interior_design, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[4]", why: "Design lead: concept, DA drawings, fit-out documentation, landlord submissions, tender; an architect is an alternative, not an addition"}
  - {discipline: consultant.certifier, kind: services, need: always, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "CC for the fit-out, principal certifier, inspections, fire safety schedule and certificate, OC for the new use; does the NCC and access assessment on a job this size. Engaged at concept: on a change of use the B1 preliminary assessment (fire safety and access upgrade risk) must come before DA lodgement"}
  - {discipline: consultant.town_planner, kind: services, need: optional, built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[0]", why: "SEE and plan of management for the change of use; the designer often writes the SEE for a simple café DA"}
  - {discipline: consultant.hazmat, kind: services, need: usually, built_in: "no", why: "Refurbishment asbestos survey of a 1965 building before strip-out, unless the landlord's asbestos register already covers the tenancy (WHS Regulation; verified: false); no package rule"}
  - {discipline: none, kind: supply, need: usually, built_in: "no", why: "Commercial kitchen designer, usually the equipment supplier: layout, equipment schedule, hood size and services loads; no discipline id (data/intake/disciplines.json); supplier.* rows are refused by DisciplinePackage. Recorded as a gap"}
  - {discipline: trade.main_works, kind: works, need: always, built_in: "partial", source: "internal/procurement/proposed.go ProposeHeadContract", why: "Shopfitter on a lump-sum contract; kitchen exhaust, plumbing (grease arrestor) and electrical are design-and-construct subcontracts under it; proposed only from gaps on accepted work items. Under the traditional route the proposal carries install lines only; design of mechanical.local-exhaust, hydraulic.trade-waste and electrical stays a gap (BuilderDesigns false)"}

not_expected_procurement:
  - {discipline: consultant.architect, app_label: "Architect", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "One design lead. The interior designer leads a small café fit-out; an architect replaces the designer, it is never added to it"}
  - {discipline: consultant.bca, app_label: "BCA", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "The certifier assesses a single-tenancy fit-out; a separate BCA consultant is needed only for a fire upgrade or performance solution (trigger bca-upgrade-on-change-of-use)"}
  - {discipline: consultant.mechanical, app_label: "Mechanical", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]; scope_additions[2]", why: "Also re-suggested by scope_additions[2] from any mechanical.* item. Kitchen exhaust through the tenancy's own roof is designed and certified by the exhaust subcontractor; an engineer is needed only for a riser through other floors (trigger exhaust-riser-through-building)"}
  - {discipline: consultant.hydraulic, app_label: "Hydraulic", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]; scope_additions[3]", why: "Also re-suggested by scope_additions[3] from any hydraulic.* item. The licensed plumber designs the drainage, sizes the grease arrestor and makes the Sydney Water application; a hydraulic engineer only when the arrestor has no room (trigger grease-arrestor-location-constrained)"}
  - {discipline: consultant.electrical, app_label: "Electrical", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]; scope_additions[4]", why: "Also re-suggested by scope_additions[4] from any electrical.* item or fire-active.emergency-lighting. Design-and-install by the electrician, including the distribution board and Section J lighting"}
  - {discipline: consultant.fire_services, app_label: "Fire Services", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "An unsprinklered single-storey shop needs only extinguishers, a fire blanket, exit signs and emergency lighting, installed by the electrician and an extinguisher supplier"}
  - {discipline: consultant.access, app_label: "Access", app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "With a level entry the certifier assesses the accessible WC and path of travel; an access consultant only for a step entry or hardship claim (trigger step-at-entry). Also suggested by scope_additions[5]"}

cost_plan:
  # fees and charges
  - {line: "DA fees and contributions", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml da-fees", why: "DA and notification fees and the s7.12 levy on the cost of works where the council plan applies one (verified: false)"}
  - {line: "Construction certificate and certifier fees", section: fees_and_charges, built_in: "yes", source: "knowledge/costs/starter_lines.yaml cc-fees", why: "Statutory CC and OC fees; the certifier's professional fee belongs on one line only"}
  - {line: "Service authority connection fees", section: fees_and_charges, built_in: "partial", source: "knowledge/costs/starter_lines.yaml service-authority", why: "Generic line; on this job it holds little unless the water meter or sewer junction changes"}
  - {line: "Sydney Water trade wastewater permit and charges", section: fees_and_charges, built_in: "no", why: "Application and ongoing trade waste charges for a food business; no starter line names Sydney Water"}
  - {line: "Sydney Water Tap in approval fee", section: fees_and_charges, built_in: "no", why: "Building plan approval before the CC (verified: false); separate from the trade wastewater permit"}
  - {line: "Long service levy", section: fees_and_charges, built_in: "no", why: "Only when the cost of works reaches the levy threshold (verified: false); the scenario budget decides. Paid before the CC"}
  - {line: "Council food premises inspection and registration fees", section: fees_and_charges, built_in: "no", why: "Council environmental health inspection before trading; NSW Food Authority notification"}
  - {line: "Landlord's design review and base-building contractor fees", section: fees_and_charges, built_in: "no", why: "Most leases charge the tenant for the landlord's review of fit-out drawings and any base-building contractor attendance"}
  - {line: "Council permits during works (skip bin, footpath occupancy)", section: fees_and_charges, built_in: "no", why: "Shopfront works on a main street need a skip bin and footpath occupancy permit; no hoarding on the base job"}
  # consultants
  - {line: "Interior designer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[4]", aliases: ["Interior Design"], why: "Fee line from the adopted package"}
  - {line: "Certifier", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Professional fee; the app also adds P05, a double-count risk"}
  - {line: "Town planner (optional)", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[0]", why: "Optional; the designer may write the SEE"}
  - {line: "Commercial kitchen designer", section: consultants, built_in: "no", why: "Kitchen layout, equipment schedule and services loads; often bundled with the equipment supply; no discipline id"}
  - {line: "Hazardous materials survey", section: consultants, built_in: "no", why: "Refurbishment asbestos survey before strip-out; no package rule"}
  # construction
  - {line: "Preliminaries and builder's margin", section: construction, built_in: "no", why: "No line; a stated budget spreads preliminaries pro rata"}
  - {line: "Strip-out and make good", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml", why: "A QS shows strip-out as its own first line; the app folds site.demolition into site works"}
  - {line: "Site works and external works", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 01", why: "Signage, bin store, and the strip-out the app folds in; the commercial_fitout split gives it no budget share"}
  - {line: "Building envelope", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 04", why: "Shopfront glazing, entry door, roof penetration; the commercial_fitout split gives it no budget share"}
  - {line: "Interiors and finishes", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 05", why: "Partitions, linings, ceilings, floors, WC, joinery, painting"}
  - {line: "Joinery: front counter, coffee bar and back bar", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml overrides interiors.joinery", why: "Split out only when a trade.joinery_kitchens package exists"}
  - {line: "Passive fire protection", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 06", why: "Fire stopping of penetrations"}
  - {line: "Active fire protection", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 07", why: "Extinguishers, fire blanket, exit signs and emergency lighting; a QS often carries the emergency lighting in electrical"}
  - {line: "Mechanical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 08", why: "Kitchen exhaust hood, duct and fan, make-up air, air-conditioning, WC exhaust"}
  - {line: "Hydraulic services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 09", why: "Grease arrestor, trade waste drainage, sanitary, hot water, backflow; the commercial_fitout split gives hydraulic 2%, far below a café's share (split verified: false)"}
  - {line: "Electrical services", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 10", why: "Distribution board, kitchen circuits, lighting"}
  - {line: "Communications and security", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 11", why: "POS and data cabling"}
  - {line: "Accessible sanitary facilities and hearing augmentation", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 13", why: "Accessible unisex WC; itemised child of access and egress"}
  - {line: "Accessible paths, TGSIs and braille/tactile signage", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 13", why: "Accessible entry and path of travel; itemised child"}
  - {line: "Egress doors and hardware", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml code 13", why: "Entry and exit door hardware; itemised child"}
  - {line: "Provisional sums and PC items", section: construction, built_in: "no", why: "Allowances for finishes not yet selected and for existing-services upgrades found on opening up"}
  # contingency and other
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml design-contingency", why: "Always"}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml construction-contingency", why: "Carries latent conditions in an old shop: sewer depth, power capacity, asbestos"}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml escalation", why: "Always"}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml exclusions", why: "Always"}
  - {line: "Owner supply items (kitchen equipment, coffee machine, furniture)", section: contingency, built_in: "partial", source: "internal/store/cost_budget.go applyBriefFigures", aliases: ["Owner supply: commercial kitchen equipment"], why: "Only when proj.owner_supply_stated is read; the biggest owner cost on a café"}

# Lines the app produces that the answer key does not expect; a scorer should report them, not miss them.
not_expected_cost_plan:
  - {line: "Access (consultant fee)", app_label: "F01 Access", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Architect (consultant fee)", app_label: "F02 Architect", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion; doubles the design lead"}
  - {line: "BCA (consultant fee)", app_label: "F03 BCA", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Adopted suggestion; duplicates the certifier's assessment"}
  - {line: "Electrical (consultant fee)", app_label: "F05 Electrical", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Fire Services (consultant fee)", app_label: "F06 Fire Services", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Hydraulic (consultant fee)", app_label: "F07 Hydraulic", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion on cost-plan prepare"}
  - {line: "Mechanical (consultant fee)", app_label: "F09 Mechanical", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Adopted suggestion on cost-plan prepare"}

program:
  skeleton: sk.refurb-traditional-da
  activities:
    # investigation
    - {label: "Review the lease, landlord's fit-out guide and base-building information", stage: investigation, fragment: null, after: [], built_in: "no", why: "Sets the landlord's works versus tenant's works, approval steps, nominated contractors and make-good"}
    - {label: "Measure the existing building", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Measure-up of the shop"}
    - {label: "Hazardous-materials survey", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", aliases: ["Asbestos refurbishment survey"], why: "1965 building; before strip-out"}
    - {label: "Trace existing services", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Sewer junction depth and route, water meter size, supply capacity, roof route for the exhaust"}
    - {label: "Planning certificate and permissible use check", stage: investigation, fragment: null, after: [], built_in: "no", why: "s10.7 certificate (verified: false), zone permits food and drink premises, prior consents, heritage"}
    - {label: "Sydney Water sewer diagram and trade waste pre-check", stage: investigation, fragment: null, after: ["Trace existing services"], built_in: "no", why: "Finds whether a grease arrestor can drain to the sewer by gravity and where it can sit"}
    # concept design
    - {label: "Confirm the brief", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Review the lease, landlord's fit-out guide and base-building information"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Menu, seats, hours, equipment, budget"}
    - {label: "Commercial kitchen layout and equipment schedule", stage: concept_design, fragment: null, after: ["Confirm the brief"], built_in: "no", why: "Kitchen designer or equipment supplier; fixes the hood, arrestor and electrical loads"}
    - {label: "Kitchen exhaust concept and discharge location for the DA", stage: concept_design, fragment: null, after: ["Commercial kitchen layout and equipment schedule"], built_in: "no", why: "Kitchen designer or an exhaust contractor engaged early: hood size, duct route, fan position, discharge height and distance to neighbours; council assesses odour and discharge at DA"}
    - {label: "Prepare the concept design", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Confirm the brief", "Measure the existing building"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Layout and look"}
    - {label: "Client review of the concept", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Prepare the concept design", "Commercial kitchen layout and equipment schedule"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Tenant approval"}
    - {label: "Landlord's approval of the concept design", stage: concept_design, fragment: null, after: ["Client review of the concept"], built_in: "no", why: "Lease condition; landlord also signs owner's consent for the DA"}
    - {label: "Develop the design", stage: concept_design, fragment: fr.design-development-fitout, after: ["Landlord's approval of the concept design", "Trace existing services", "Hazardous-materials survey", "Planning certificate and permissible use check"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.design-development-fitout", why: "Design development"}
    # approval documentation
    - {label: "Prepare DA drawings, statement of environmental effects, plan of management and waste management plan", stage: approval_documentation, fragment: null, after: ["Develop the design", "Sydney Water sewer diagram and trade waste pre-check", "Kitchen exhaust concept and discharge location for the DA"], built_in: "no", why: "No approval-documentation fragment exists for fit-out (only 1a, 2, 7b, 9b)"}
    - {label: "Landlord signs owner's consent for the DA", stage: approval_documentation, fragment: null, after: ["Prepare DA drawings, statement of environmental effects, plan of management and waste management plan"], built_in: "no", why: "The DA cannot be lodged without the land owner's consent"}
    # approvals
    - {label: "Lodge the DA", stage: approvals, fragment: fr.da-lodgement, after: ["Landlord signs owner's consent for the DA"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.da-lodgement", aliases: ["Lodge the application"], why: "NSW Planning Portal"}
    - {label: "Neighbour notification", stage: approvals, fragment: fr.da-exhibition, after: ["Lodge the DA"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.da-exhibition", aliases: ["Public exhibition"], why: "Neighbours often object to odour, noise and hours"}
