      - {text: "Clause 4.6 variation request", key: stage.variation_request}
      - {text: "Panel attendance", key: position.panel_attendance}
      - "SSD"
      - {text: "Specialist reports", key: position.specialist_reports}
    expect:
      stages_include: [prelim_advice, planning_report, lodgement, assessment, determination_review]
      stages_option: [pre_lodgement, post_approval]
      stages_absent: [variation_request]
      positions: {specialist_review: I, certificates: I, compliance_matrix: I, ad_hoc_advice: I, historic_consents: O, submissions_response: O, modification: O, court: X, authority_fees: X, specialist_reports: X, panel_attendance: absent}
      blocking: []
      sources:
        - "submissions_response O: café DAs draw objections on odour, noise and hours often enough to price it"
    app_differs:
      - {key: position.panel_attendance, app: O, expect: absent, why: "O even with flag.panel no"}
      - {key: stage.pre_lodgement, app: include, expect: option, why: "included on any DA; optional for a small café"}

triggers:
  - id: cdc-pathway
    label: Complying development instead of a DA
    evidence: ["A complying development certificate will be sought under the Commercial and Industrial Alterations Code", "the certifier confirms the change of use and fit-out can be approved as complying development"]
    negation: ["A development application will be lodged with council", "The kitchen exhaust and signage do not meet the code standards, so a DA is required"]
    profile: [hdr.cond.planning]
    adds:
      program: ["Prepare and lodge the complying development certificate", "Certifier determination", "Landlord signs owner's consent for the CDC"]
      cost_plan: ["Contributions still payable under the CDC"]
      rfps: [{discipline: consultant.certifier, must_include: ["CDC assessment and determination"]}]
      authority: ["CDC by the registered certifier; neighbour notice before work (Codes SEPP; verified: false)"]
    removes:
      procurement: [consultant.town_planner]
      cost_plan: ["DA fees and contributions"]
      program: ["Prepare DA drawings, statement of environmental effects, plan of management and waste management plan", "Landlord signs owner's consent for the DA", "Lodge the DA", "Neighbour notification", "DA assessment and determination", "Construction certificate"]
      rfps: [consultant.town_planner]
    why: "Skeleton becomes sk.refurb-traditional-cdc. The town planner drops, because complexity_additions[0] needs da or ssd. The bca-certification RFP then blocks on cdc (unsupported_pathways), so the certifier's RFP cannot issue. cc-fees is always produced (applies_when true) and is the app line that should carry the CDC and OC fees, so it is kept, not removed, and no separate CDC fee line is added (T03 convention; the trigger schema takes plain strings, so the alias cannot be keyed). A CDC also needs the land owner's consent, so the landlord's signature stays. Under a CDC the exhaust and arrestor design must be complete before determination, so the subcontractors' design moves before tender (an early exhaust contractor or a mechanical engineer)"
    built_in: {program: "yes", cost_plan: "partial", procurement: "yes", rfps: "no"}
    source: "knowledge/program/fragments.yaml fr.cdc-application"
  - id: existing-food-premises
    label: The previous tenant was a café or takeaway with an existing grease arrestor and exhaust
    evidence: ["The tenancy was previously operated as a café and has an existing 1,000 L grease arrestor in the rear yard", "the existing kitchen canopy and roof fan are to be retained and serviced"]
    negation: ["The previous use was a clothing shop; there is no grease arrestor or kitchen exhaust", "No existing trade waste connection serves the tenancy"]
    profile: []
    adds:
      work_items: [{system: hydraulic.trade-waste, action: alter}, {system: mechanical.local-exhaust, action: alter}]
      cost_plan: ["Pump out, inspect and service the existing grease arrestor and exhaust"]
      program: ["Inspect the existing grease arrestor and kitchen exhaust for reuse", "Transfer or reapply for the trade wastewater permit"]
      authority: ["A new Sydney Water trade wastewater permit for the new operator (verified: false)"]
    removes:
      program: ["Install grease arrestor and trade waste drainage"]
    why: "No profile key changes (the base value already holds). uc.existing-grease-arrestor-undersized-for-new-kitchen and uc.kitchen-exhaust-has-no-rated-riser-in-existing-shaft attach as Implications only; nothing reaches the program or cost plan"
    built_in: {work_items: "no", cost_plan: "no", program: "no"}
  - id: exhaust-riser-through-building
    label: Kitchen exhaust must rise through floors above to the roof
    evidence: ["The tenancy is on the ground floor of a three-storey shop-top building with apartments above", "the kitchen exhaust riser will run in a fire-rated shaft through levels 1 and 2 to discharge above the roof"]
    negation: ["The tenancy is single storey and the exhaust discharges directly through its own roof", "There are no floors above the tenancy"]
    profile: [det.rise_in_storeys, det.ncc_class, proj.regulated_design, hdr.cond.stakeholder_complexity]
    adds:
      procurement: [consultant.mechanical, consultant.structural, consultant.acoustic]
      work_items: [{system: fire-passive.rated-elements, action: new}, {system: structure.alterations, action: alter}, {system: interiors.acoustic-separation, action: upgrade}]
      cost_plan: ["Mechanical engineer", "Structural engineer", "Acoustic consultant", "Fire-rated exhaust shaft and duct"]
      program: ["Owners corporation or landlord approval of the riser route", "Penetrate floors and build the fire-rated shaft", "Acoustic and odour assessment for the DA", "Registered design practitioner declarations before the CC"]
      rfps: [{discipline: consultant.mechanical, must_include: [{text: "Kitchen exhaust hood, fire-rated duct and discharge design (AS 1668.1, AS 1668.2; verified: false)", key: position.kitchen}, "Make-up air", "Discharge location and odour control to the residences above"]}]
      authority: ["Strata by-law or owners corporation approval for work on common property (Strata Schemes Management Act 2015; verified: false)", "DBP Act regulated designs and compliance declarations for work affecting the Class 2 part (owner ruling R3 applied by inference: R3 covers Class 2 buildings, and the riser through the residential floors is work on the Class 2 part; whether a ground-floor Class 6 fit-out alone is caught is verified: false and flagged for the owner)"]
    why: "Mechanical is already suggested by baselines[3]; structural and acoustic are never suggested for a refurb. The mechanical RFP's kitchen position needs the client flag mech_kitchen and asks. Apartments above make the building partly Class 2 (det.ncc_class 2,6) and the owners corporation the stakeholder (strata). Applying R3 here is an inference for the owner to confirm. When proj.regulated_design becomes yes, the scorer should see the regulated-design RFP rows (for example architecture regulated_design, hydraulic and mechanical declarations) change"
    built_in: {procurement: "partial", work_items: "no", cost_plan: "partial", program: "no", rfps: "partial"}
    source: "knowledge/rfp/mechanical-services.yaml kitchen"
  - id: grease-arrestor-location-constrained
