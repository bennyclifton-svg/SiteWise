# RFP expectations use the data/eval/rfp/answer-keys keys exactly. They state the CORRECT answer for this café.
# app_differs is structured: {key, app, expect, why}. The app's predicted output = expect overridden by app_differs.
rfps:
  - discipline: consultant.interior_design
    template: null
    built_in: "partial"
    source: "knowledge/reports/templates.yaml tpl.rfp-capex"
    why: "No discipline template; the app issues the generic capital-works RFP with no scope rows"
    must_include:
      - "Measure-up and existing-conditions review"
      - "Concept design and design development with the kitchen designer's layout"
      - "DA drawings for the change of use, kitchen exhaust and signage"
      - "Fit-out documentation, finishes schedule and specification for tender"
      - "Food premises finishes to FSANZ Standard 3.2.3 and AS 4674 (verified: false)"
      - "Landlord design submissions"
      - "Performance briefs for the design-and-construct exhaust, plumbing and electrical trades"
      - "Tender support"
      - "Option: contract administration and site visits"
    must_not_include: ["Base-building design", "BIM coordination", "Green Star or NABERS", "Mechanical, hydraulic or electrical engineering design", "Novation"]
  - discipline: consultant.certifier
    template: bca-certification
    built_in: "partial"
    source: "knowledge/rfp/bca-certification.yaml"
    must_include:
      - {text: "Preliminary assessment of the change of use, fire safety and access to the affected part", key: stage.b1_preliminary}
      - {text: "Construction certificate assessment", key: stage.b2_construction_approval}
      - {text: "Principal certifier services and inspections", key: stage.b3_construction}
      - {text: "Occupation certificate and fire safety certificate", key: stage.b4_occupation}
      - {text: "Existing building and change-of-use assessment, affected part only", key: position.existing_assessment}
      - {text: "Option: performance solution assessment", key: position.performance_assessment}
    must_not_include:
      - {text: "BCA advisory stages A1 to A3 as the default appointment", key: stage.a1_inception}
      - {text: "Residential BASIX evidence review", key: position.residential_evidence}
      - {text: "Staged occupation", key: position.staged_occupation}
      - {text: "Fire system referrals and witnessing", key: position.fire_referrals}
    expect:
      stages_include: [b1_preliminary, b2_construction_approval, b3_construction, b4_occupation]
      stages_absent: [a1_inception, a2_planning, a3_tender, a4_construction]
      positions:
        statutory_functions: I
        evidence_registers: I
        existing_assessment: I
        performance_assessment: O
        extra_visits: O
        specialist_design: X
        other_approvals: X
        supervision: X
        residential_evidence: absent
        classification_map: absent
        staged_occupation: absent
        fire_referrals: absent
      blocking: []
      sources:
        - "existing_assessment I: the change of use makes the certifier decide whether the existing building needs a fire safety upgrade (verified: false)"
    app_differs:
      - {key: stage.a1_inception, app: ask, expect: absent, why: "no boundary resolves while bca_advisory and bca_certification are unknown (resolveBoundary sets one only on a yes), so every stage asks; data/eval/rfp/answer-keys/bca-unknown-decisions.yaml"}
      - {key: stage.a2_planning, app: ask, expect: absent, why: "no boundary resolves while bca_advisory and bca_certification are unknown, so every stage asks"}
      - {key: stage.a3_tender, app: ask, expect: absent, why: "no boundary resolves while bca_advisory and bca_certification are unknown, so every stage asks"}
      - {key: stage.a4_construction, app: ask, expect: absent, why: "no boundary resolves while bca_advisory and bca_certification are unknown, so every stage asks"}
      - {key: stage.b1_preliminary, app: ask, expect: include, why: "no boundary resolves while bca_advisory and bca_certification are unknown, so every stage asks"}
      - {key: stage.b2_construction_approval, app: ask, expect: include, why: "no boundary resolves while bca_advisory and bca_certification are unknown, so every stage asks"}
      - {key: stage.b3_construction, app: ask, expect: include, why: "no boundary resolves while bca_advisory and bca_certification are unknown, so every stage asks"}
      - {key: stage.b4_occupation, app: ask, expect: include, why: "no boundary resolves while bca_advisory and bca_certification are unknown, so every stage asks"}
      - {key: blocking.fact:flag.bca_advisory, app: blocking, expect: not blocking, why: "client-decision flag cannot be keyed, so the app blocks issue until the client decides (bca-unknown-decisions.yaml blocking)"}
      - {key: blocking.fact:flag.bca_certification, app: blocking, expect: not blocking, why: "client-decision flag cannot be keyed, so the app blocks issue until the client decides (bca-unknown-decisions.yaml blocking)"}
      - {key: blocking.fact:flag.bca_existing_assessment, app: blocking, expect: not blocking, why: "client-decision flag cannot be keyed, so the app blocks issue until the client decides (bca-unknown-decisions.yaml blocking)"}
      - {key: blocking.fact:flag.bca_classification_map, app: blocking, expect: not blocking, why: "client-decision flag cannot be keyed, so the app blocks issue until the client decides (bca-unknown-decisions.yaml blocking)"}
      - {key: blocking.fact:flag.bca_staged_occupation, app: blocking, expect: not blocking, why: "client-decision flag cannot be keyed, so the app blocks issue until the client decides (bca-unknown-decisions.yaml blocking)"}
      - {key: blocking.fact:flag.bca_fire_referrals, app: blocking, expect: not blocking, why: "client-decision flag cannot be keyed, so the app blocks issue until the client decides (bca-unknown-decisions.yaml blocking)"}
      - {key: blocking.fact:flag.bca_residential_evidence, app: blocking, expect: not blocking, why: "client-decision flag cannot be keyed, so the app blocks issue until the client decides (bca-unknown-decisions.yaml blocking)"}
      - {key: blocking.allowance:plan_sets, app: blocking, expect: not blocking, why: "client-owned allowance with no default and no stage gate blocks issue until the count is set (resolveAllowances, boughtNow)"}
      - {key: blocking.allowance:reports, app: blocking, expect: not blocking, why: "client-owned allowance with no default and no stage gate blocks issue until the count is set (resolveAllowances, boughtNow)"}
      - {key: blocking.allowance:meetings, app: blocking, expect: not blocking, why: "client-owned allowance with no default and no stage gate blocks issue until the count is set (resolveAllowances, boughtNow)"}
      - {key: blocking.allowance:rfi_hours, app: blocking, expect: not blocking, why: "client-owned allowance with no default and no stage gate blocks issue until the count is set (resolveAllowances, boughtNow)"}
      - {key: blocking.allowance:solution_versions, app: blocking, expect: not blocking, why: "client-owned allowance with no default and no stage gate blocks issue until the count is set (resolveAllowances, boughtNow)"}
      - {key: blocking.allowance:visits, app: blocking, expect: not blocking, why: "client-owned allowance with no default and no stage gate blocks issue until the count is set (resolveAllowances, boughtNow)"}
      - {key: blocking.allowance:witness_events, app: blocking, expect: not blocking, why: "client-owned allowance with no default and no stage gate blocks issue until the count is set (resolveAllowances, boughtNow)"}
      - {key: blocking.allowance:duration_months, app: blocking, expect: not blocking, why: "client-owned allowance with no default and no stage gate blocks issue until the count is set (resolveAllowances, boughtNow)"}
      - {key: position.statutory_functions, app: ask, expect: I, why: "row needs the client flag bca_certification"}
      - {key: position.existing_assessment, app: ask, expect: I, why: "client flag bca_existing_assessment"}
      - {key: position.residential_evidence, app: ask, expect: absent, why: "client flag bca_residential_evidence"}
      - {key: position.classification_map, app: ask, expect: absent, why: "client flag bca_classification_map"}
      - {key: position.staged_occupation, app: ask, expect: absent, why: "client flag bca_staged_occupation"}
      - {key: position.fire_referrals, app: ask, expect: absent, why: "client flag bca_fire_referrals"}
  - discipline: consultant.town_planner
    template: town-planning
    built_in: "partial"
    source: "knowledge/rfp/town-planning.yaml planning_report"
    must_include:
      - {text: "Preliminary advice on the LEP use definition and DCP controls", key: stage.prelim_advice}
      - {text: "Statement of environmental effects with a plan of management (hours, seats, odour, noise, waste)", key: stage.planning_report}
      - {text: "Lodgement", key: stage.lodgement}
      - {text: "Assessment and responses to council requests", key: stage.assessment}
      - {text: "Planning certificate and prior consents searches", key: position.certificates}
