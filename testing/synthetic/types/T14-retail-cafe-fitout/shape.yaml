gaps:
  - {area: procurement, what: "Seven of the ten suggested consultants are wrong for a small café: Architect alongside Interior Design, BCA alongside the certifier, Mechanical, Hydraulic, Electrical, Fire Services and Access. Refurb baselines do not look at size or at design-and-construct services, and scope additions re-suggest Mechanical, Hydraulic and Electrical from any services item, so a size or D&C test is needed in both rule sets", evidence: "knowledge/works/package_defaults.yaml baselines[2], baselines[3], baselines[4], scope_additions[2]-[5]"}
  - {area: procurement, what: "Hazmat surveyor never suggested for a pre-2004 tenancy", evidence: "knowledge/works/package_defaults.yaml baselines, complexity_additions name no Hazmat"}
  - {area: procurement, what: "Refurb gives no Structural or Acoustic consultant even when an exhaust riser crosses floors", evidence: "knowledge/works/package_defaults.yaml baselines[2], baselines[3]"}
  - {area: scope, what: "Refurb starts with no work items, so the kitchen exhaust, grease arrestor, accessible WC and signage appear only if a document or the user adds them; implied_by kitchen adds joinery, sanitary, water and local exhaust but never hydraulic.trade-waste, and no pattern matches grease arrestor, grease trap or canopy", evidence: "knowledge/profile/scope_defaults.yaml empty_work_types; implied_by kitchen"}
  - {area: profile, what: "det.commercial_kitchen and det.trade_waste_use have no profile_group and no triggers, so the AS 1668.1 kitchen-exhaust and trade-waste-agreement rules can never apply", evidence: "knowledge/determinants.yaml commercial_kitchen, trade_waste_use; knowledge/clusters/services-wet-air/rules.yaml rule.as1668-1.kitchen-exhaust-fire-rated-duct, rule.water-authority.trade-waste-agreement"}
  - {area: profile, what: "No work type or condition for change of use, the key planning fact of a café in a former shop", evidence: "knowledge/profile/taxonomy.yaml work_types"}
  - {area: program, what: "No fragments for hydraulic.trade-waste, mechanical.local-exhaust (kitchen exhaust), interiors.ffe (kitchen equipment), site.signage, site.public-domain, access-egress.accessible-facilities, fire-active.emergency-lighting or .portable-extinguishers, or shopfront glazing in a fit-out", evidence: "testing/synthetic/reference/index/program-fragments.md leaf systems with no work-item fragment"}
  - {area: program, what: "No approval-documentation fragment for a fit-out DA, so the approval_documentation stage is empty", evidence: "knowledge/program/fragments.yaml fr.approval-docs-1a, -2, -7b, -9b only"}
  - {area: program, what: "No rows for landlord approvals, owner's consent, Sydney Water trade wastewater permit, council food premises inspection, food business notification, fire safety certificate, notice of commencement or open for trade", evidence: "knowledge/program/fragments.yaml has no fragment naming these"}
  - {area: program, what: "Construction certificate sits in approvals, before construction documentation and tender; a fit-out with D&C services certifies after award", evidence: "knowledge/program/fragments.yaml fr.construction-certificate; knowledge/program/skeletons.yaml sk.refurb-traditional-da"}
