schema: sitewise-synthetic-shape/1
type_id: T04
slug: warehouse
name: Industrial warehouse
reviewed: false
state: NSW
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
# Base: single-storey single-tenant warehouse (about 7,500 m2) with a 500 m2 single-storey office on a vacant,
# benched 1.6 ha estate lot in Western Sydney; off-site precast panels, portal frame, ESFR sprinklers, large
# isolated building; local DA; D&C (AS 4902) with the architect, structural, civil and landscape novated.
profile:
  hdr.building_class: industrial
  hdr.subclass: warehouse
  hdr.work_type: new
  hdr.cond.planning: da
  hdr.cond.procurement_route: design_construct
  hdr.cond.operational_constraints: vacant
  hdr.cond.stakeholder_complexity: single_owner
  hdr.cond.access_constraints: unrestricted
  hdr.cond.environmental_sensitivity: standard
  hdr.cond.power_source: grid
  hdr.cond.hazardous_process: none
  hdr.scale.site_sqm: 16000
  hdr.scale.gfa_sqm: 8000
  hdr.scale.clear_height_m: 12
  hdr.scale.dock_doors: 12
  hdr.scale.hardstand_sqm: 6000
  hdr.scale.office_percent: 6
  det.ncc_class: [7b, "5"]
  det.rise_in_storeys: 1
  det.sprinklered: true
  det.floor_area: 8000
  det.storage_height: 11
  det.state: NSW
  det.existing_building: false
  det.heritage_status: none
  det.bushfire_prone_land: false
  det.flood_hazard: false
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  det.facade_type: standard
  det.sewer_connection: reticulated
  det.water_supply_source: reticulated
  det.gas_supply: none
  fact.contract_form: as4902
  fact.contract_basis: lump_sum
  proj.regulated_design: "no"
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.heavy_vehicles: "yes"
  flag.osd_required: "yes"
  flag.stormwater_quality: "yes"
  flag.basement: "no"
  flag.excavation_adjoining: "no"
  flag.transfer_structures: "no"
  flag.osd_existing: "no"
  flag.authority_asset: "no"
  flag.rail: "no"
  flag.groundwater: "no"
  flag.norbe: "no"
  flag.public_road: "yes"  # R15: the heavy-duty vehicle crossings are work in the public road
  flag.state_road: "no"
  flag.tfnsw_referral: "no"
  flag.intersection_modelling: "no"
  flag.gtp_required: "no"
  flag.cl46: "no"
  flag.panel: "no"
  flag.community: "no"
  flag.architect_lodges: "no"
  flag.sustainability_target: "no"
  flag.coastal: "no"
  flag.country: "no"
  flag.staged: "no"
  flag.multi_building: "no"
  flag.arborist_tree_impacts: "no"
  flag.fire_vulnerable_occupants: "no"
  flag.fire_special_hazards: "no"
  flag.fire_specialist_systems: "no"

# Values the app derives or cannot set through PUT /profile; checked, never PUT.
expected_derived:
  - {key: det.type_of_construction, value: C, source: "knowledge/tables/type_of_construction.yaml", note: "Class 5 and 7b at rise 1 give Type C (Table C2D2, verified: true); the rule says mixed classifications need C2D4 assessment first. Returns unknown today: rule/table unreviewed (Go run, profile.Build, 4 November 2026)"}
  - {key: det.max_floor_area_m2, value: 2000, source: "knowledge/tables/compartment_limits.yaml", note: "Class 7b Type C limit from Table C3D3 (verified: true). The 8,000 m2 compartment exceeds it, so the C3D4 large isolated building route applies; the table's exclusions say C3D4 needs separate assessment. Returns unknown today: rule/table unreviewed (Go run)"}
  - {key: det.max_volume_m3, value: 12000, source: "knowledge/tables/compartment_limits.yaml", note: "Class 7b Type C volume limit (Table C3D3, verified: true). Returns unknown today: rule/table unreviewed (Go run)"}
  - {key: det.ev_readiness_required, value: true, source: "knowledge/clusters/electrical-comms/rules.yaml rule.ncc.ev-charging-readiness", note: "applies to 5 and 7b with car parking; derivation pending; the requirement itself is verified: false"}
  - {key: det.energy_compliance_pathway, value: section_j_dts, note: "Section J DTS for the office (JV3 is the alternative); no profile_group, so not settable"}

scenario_inputs:
  - {key: proj.budget_stated, note: "stated in the developer's feasibility or brief; amount chosen by the scenario author. Without it the architecture RFP blocks on fact:budget", phrasing: "Construction budget: $<amount> excluding GST"}
  - {key: det.ncc_class, note: "never derived from the subclass; must be read from the BCA report", phrasing: "Building classification: Class 7b (warehouse) and Class 5 (office)"}
  - {key: hdr.cond.procurement_route, note: "D&C with named novated consultants", phrasing: "The works will be procured as a design and construct lump sum under AS 4902; the architect, structural and civil engineers and landscape architect will be novated to the contractor"}
  - {key: det.sprinklered, note: "the trigger is 'sprinkler'; keep 'storage' more than 90 characters from 'fire' in the same sentence (flag.fire_special_hazards trap)", phrasing: "The building will be sprinkler protected throughout with ceiling-level ESFR heads."}
  - {key: det.rise_in_storeys, note: "trigger 'rise in storeys'", phrasing: "Rise in storeys: 1"}
  - {key: det.storage_height, note: "trigger 'racking height' or 'top of storage'", phrasing: "Maximum top of storage: 11 m in selective pallet racking"}
  - {key: flag.heavy_vehicles, note: "regex 'b-double' or 'heavy vehicle'", phrasing: "The site is designed for 26 m B-double access to the hardstand and docks"}
  - {key: flag.osd_required, note: "civil or council statement", phrasing: "On-site detention is required under council's stormwater policy"}
  - {key: flag.stormwater_quality, note: "regex 'stormwater quality' or 'MUSIC model'", phrasing: "Stormwater quality targets are demonstrated with a MUSIC model"}
  - {key: flag.public_road, note: "R15: vehicle crossings are public road works, so the base reads yes from the crossings sentence; 'road reserve' also matches the flag", phrasing: "No works in the public road other than the two heavy-duty vehicle crossings and making good the footpath"}
  - {key: flag.basement, note: "geotechnical pits 'excavated to a depth' match the basement pattern; state the denial", phrasing: "No basement is proposed; the building is slab on ground"}
  - {key: det.potentially_contaminated_land, note: "trigger 'contaminat'; the estate validation report is the evidence", phrasing: "The estate developer's validation report confirms the lot is suitable for industrial use and is not contaminated"}
  - {key: det.existing_building, note: "trigger is the singular 'existing building'", phrasing: "There is no existing building on the site"}
  - {key: hdr.scale.gfa_sqm, note: "GFA trigger phrasing", phrasing: "Gross floor area: 8,000 m2 (warehouse 7,500 m2, office 500 m2)"}
  - {key: det.floor_area, note: "state the compartment volume too, so the base cannot read as over the C3D4 limits by accident (7,500 m2 at a 12 m haunch plus the roof rise is close to 100,000 m3)", phrasing: "Floor area 8,000 m2; volume of the single fire compartment about 100,000 m3 (below the C3D4(1) limits of 18,000 m2 and 108,000 m3)"}

work_items:
  - {system: site.survey-boundaries, action: new, why: "Set-out, level control and as-built survey"}
  - {system: site.ground-conditions, action: investigate, why: "Boreholes, test pits, CBR, reactivity and salinity; not in the default list"}
  - {system: site.earthworks, action: new, why: "Bulk earthworks to the pad with Level 1 compaction testing (AS 3798)"}
  - {system: site.erosion-sediment-control, action: new, why: "Sediment basin and controls over a large disturbed area"}
  - {system: site.stormwater-detention, action: new, why: "OSD and water-quality treatment (GPT, bioretention or filters)"}
  - {system: site.services-connections, action: new, why: "Water, sewer, fire-water main, electricity and NBN lead-ins"}
  - {system: site.vehicle-access, action: new, why: "Heavy-duty concrete hardstand, car park, internal roads, line marking"}
  - {system: site.loading-docks, action: new, why: "Recessed docks with levellers, shelters and bumpers; not in the default list"}
  - {system: site.impact-protection, action: new, why: "Bollards, column and door-jamb guards, dock edge protection"}
  - {system: site.public-domain, action: new, why: "Two heavy-duty crossings, kerb and footpath reinstatement, street trees (s138 consent; verified: false); not in the default list"}
  - {system: site.waste-storage, action: new, why: "Bin enclosure and collection point; not in the default list"}
  - {system: site.signage, action: new, why: "Building identification and traffic signage"}
  - {system: site.landscape, action: new, why: "Street setback landscaping, car park trees, security fencing and gates"}
  - {system: substructure.footings, action: new, why: "Pad footings to the portal columns, strip footings to the precast panels"}
  - {system: substructure.slab-on-ground, action: new, why: "Industrial slab for racking leg and forklift loads, joints and flatness specification"}
  - {system: structure.steel, action: new, why: "Portal frame, purlins, girts, dock awnings"}
  - {system: structure.precast, action: new, why: "Off-site precast wall panels to the dock face, front and boundaries"}
  - {system: structure.temporary-works, action: new, why: "Panel bracing until the frame and roof tie in, crane pads; not in the default list"}
  - {system: envelope.external-walls, action: new, why: "Metal cladding above the panels and the office facade"}
  - {system: envelope.roof-coverings, action: new, why: "Low-pitch metal deck roof, skylights and safety mesh"}
  - {system: envelope.windows-doors, action: new, why: "Office glazing and personnel doors"}
  - {system: envelope.vehicle-doors, action: new, why: "Panel-lift dock doors and roller shutters; long lead"}
  - {system: envelope.thermal-insulation, action: new, why: "Roof insulation blanket and office walls"}
  - {system: envelope.flashings-seals, action: new, why: "Roof and wall flashings and precast panel joint sealants; not in the default list"}
  - {system: envelope.thermal-performance, action: new, why: "NCC Section J for the office and warehouse lighting (verified: false); not in the default list"}
  - {system: interiors.walls-linings, action: new, why: "Office partitions and linings"}
  - {system: interiors.ceilings, action: new, why: "Office suspended ceilings"}
  - {system: interiors.wet-area-waterproofing, action: new, why: "Amenities and showers"}
  - {system: interiors.tiling, action: new, why: "Amenities"}
  - {system: interiors.floor-finishes, action: new, why: "Office carpet and vinyl"}
  - {system: interiors.internal-doors, action: new, why: "Office doors and hardware"}
  - {system: interiors.joinery, action: new, why: "Office kitchen and vanities; arrives via implied_by kitchen when a read document says kitchen"}
  - {system: interiors.painting, action: new, why: "Office painting and warehouse line marking"}
  - {system: fire-active.sprinklers, action: new, why: "Ceiling-level ESFR sprinklers for storage to about 11 m; required by C3D4(1)(b) (large isolated building) and E1D13 (storage over 4 m), NCC 2022 Vol One (verified: true); not in the default list"}
  - {system: fire-active.fire-water, action: new, why: "Sprinkler and hydrant tanks, diesel and electric pumps, booster"}
  - {system: fire-active.hydrants, action: new, why: "Hydrant ring main, external hydrants, hose reels"}
  - {system: fire-active.occupant-warning, action: new, why: "Building occupant warning on sprinkler activation (verified: false); not in the default list"}
  - {system: fire-active.emergency-lighting, action: new, why: "Emergency and exit lighting"}
  - {system: fire-active.portable-extinguishers, action: new, why: "Extinguishers to AS 2444"}
  - {system: mechanical.air-conditioning, action: new, why: "Office split or VRF air-conditioning"}
  - {system: mechanical.local-exhaust, action: new, why: "Amenities exhaust"}
  - {system: mechanical.ventilation, action: new, why: "Office outside air and warehouse roof ventilators; not in the default list"}
  - {system: hydraulic.cold-water, action: new, why: "Water service and amenities"}
  - {system: hydraulic.hot-water, action: new, why: "Amenities hot water"}
  - {system: hydraulic.sanitary, action: new, why: "Amenities drainage to the sewer"}
  - {system: hydraulic.roof-drainage, action: new, why: "Box gutters and siphonic or gravity downpipes for the large roof"}
  - {system: hydraulic.non-potable-water, action: new, why: "Rainwater reuse for toilets and irrigation; not in the default list"}
  - {system: hydraulic.backflow-prevention, action: new, why: "Containment devices on the water and fire services; not in the default list"}
  - {system: electrical.utility-supply, action: new, why: "Kiosk substation and consumer mains from the DNSP; long lead"}
  - {system: electrical.temporary-power, action: new, why: "Builder's temporary supply; not in the default list"}
  - {system: electrical.switchboards, action: new, why: "Main switchboard; long lead"}
  - {system: electrical.cabling-wiring, action: new, why: "Submains and power to docks, doors, pumps and the office"}
  - {system: electrical.lighting, action: new, why: "High-bay LED with controls and external lighting"}
  - {system: electrical.metering, action: new, why: "Main metering and energy monitoring where Section J requires it"}
  - {system: electrical.earthing-lightning, action: new, why: "Lightning risk assessment and protection to AS/NZS 1768; not in the default list"}
  - {system: comms-security.carrier-lead-in, action: new, why: "NBN pit and pipe"}
  - {system: comms-security.structured-cabling, action: new, why: "Office data; not in the default list"}
  - {system: comms-security.cctv, action: new, why: "Site, gate and dock cameras; not in the default list"}
  - {system: comms-security.access-control, action: new, why: "Office entry and gates; not in the default list"}
  - {system: access-egress.exits, action: new, why: "Exit layout and travel distances, often by performance solution"}
  - {system: access-egress.egress-doors, action: new, why: "Warehouse exit doors and hardware; not in the default list"}
  - {system: access-egress.accessible-access, action: new, why: "Accessible parking, path from the street and office entry"}
  - {system: access-egress.accessible-facilities, action: new, why: "Accessible toilet and shower"}
  - {system: access-egress.stairs-and-ramps, action: new, why: "Dock stairs and the office entry ramp; not in the default list"}
  - {system: access-egress.maintenance-access, action: new, why: "Roof access, walkways, anchors and ladders"}

procurement:
