  - {discipline: consultant.town_planner, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[0]", why: "Planning advice, SEE, lodgement and assessment"}
  - {discipline: consultant.surveyor, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Detail and boundary survey, easements, services records"}
  - {discipline: consultant.geotechnical, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Footing, slab and pavement parameters, fill, salinity"}
  - {discipline: consultant.civil, kind: services, need: always, novation: "yes", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Earthworks, hardstand pavements, stormwater, OSD and water quality, crossings; novated"}
  - {discipline: consultant.structural, kind: services, need: always, novation: "yes", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Portal frame, panels, footings, industrial slab; novated"}
  - {discipline: consultant.traffic, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[1]", why: "Traffic and parking report, B-double swept paths, hardstand certification"}
  - {discipline: consultant.bca, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[1]", why: "BCA report for the DA and tender, large isolated building strategy"}
  - {discipline: consultant.certifier, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Staged CCs, principal certifier, fire safety schedule, OC; owner-appointed, never novated"}
  - {discipline: consultant.fire_services, kind: services, need: always, novation: "option", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[1]", why: "Fire-water strategy, pressure and flow enquiry, tanks, pumps, booster and sprinkler concept for the D&C brief; novated or replaced by the D&C fire contractor's designer (C1)"}
  - {discipline: consultant.fire_engineer, kind: services, need: usually, novation: "option", built_in: "no", why: "Performance solutions (perimeter access, travel distance, smoke hazard management) and FRNSW consultation; no package rule names it"}
  - {discipline: consultant.electrical, kind: services, need: usually, novation: "option", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "DNSP application, substation siting, external lighting spill for the DA; then the D&C electrical designer (C1)"}
  - {discipline: consultant.hydraulic, kind: services, need: usually, novation: "option", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Sydney Water servicing, fire-water supply, rainwater reuse; then the D&C hydraulic designer (C1)"}
  - {discipline: consultant.access, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[1]", why: "DA and CC access reports"}
  - {discipline: consultant.landscape, kind: services, need: always, novation: "yes", built_in: "no", why: "DA landscape plan to the DCP for the street setback; no package rule"}
  - {discipline: consultant.acoustic, kind: services, need: usually, novation: "no", built_in: "no", why: "Noise impact assessment for 24-hour truck movements and plant; no package rule"}
  - {discipline: consultant.esd, kind: services, need: usually, novation: "no", built_in: "no", why: "Section J report for the office and lighting, council ESD controls (C2); no package rule"}
  - {discipline: consultant.quantity_surveyor, kind: services, need: always, novation: "no", built_in: "no", why: "Feasibility, cost estimate report for the DA fee (verified: false), D&C tender evaluation; no package rule"}
  - {discipline: consultant.waste, kind: services, need: usually, novation: "no", built_in: "no", why: "Operational and C&D waste management plans for the DA; no package rule"}
  - {discipline: trade.main_works, kind: works, need: always, built_in: "partial", source: "internal/procurement/proposed.go ProposeHeadContract", why: "D&C head contract (AS 4902) with design lines; proposed only from gaps on accepted work items"}

not_expected_procurement:
