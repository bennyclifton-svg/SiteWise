triggers:
  - id: traditional-lump-sum
    label: Traditional fully documented lump-sum tender instead of D&C
    evidence: ["The architect will fully document the works for a lump-sum tender to selected builders", "construct-only contract under AS 4000; no design responsibility passes to the builder"]
    negation: ["Design and construct lump sum under AS 4902 with novation of the architect and engineers"]
    profile: [hdr.cond.procurement_route]
    adds:
      procurement: [consultant.mechanical]
      cost_plan: ["Contract administration (superintendent's representative)"]
      program: ["Prepare construction documentation before tender", "Tender (bidding) support by the architect"]
      rfps: [{discipline: consultant.architect, must_include: [{text: "Tender documents", key: stage.tender_traditional}, {text: "Bidding", key: stage.bidding}, {text: "For-construction documents", key: stage.for_construction}]}, {discipline: consultant.civil, must_include: [{text: "Detailed design for tender", key: stage.detailed_tender}, {text: "Final design for construction", key: stage.for_construction}]}, {discipline: consultant.structural, must_include: [{text: "Tender documents", key: stage.tender_traditional}, {text: "Construction documents", key: stage.construction_documents}]}]
    removes:
      program: ["Novate the design consultants", "D&C subcontractor design of fire, electrical, hydraulic and mechanical services", "Principal's review of the contractor's design"]
    why: "The skeleton moves to sk.new-traditional-da and fr.novation drops out; services consultants document fully, so a mechanical consultant is now needed for the office and roof ventilation"
    built_in: {program: "partial", rfps: "yes", procurement: "yes", cost_plan: "no"}
    source: "knowledge/program/skeletons.yaml sk.new-traditional-da"
  - id: cdc-industrial-code
    label: Complying development under the Industrial and Business Buildings Code
    evidence: ["Complying development certificate under Part 5A Industrial and Business Buildings Code of the Codes SEPP (verified: false)", "the warehouse meets the code's setbacks, height and landscaping standards, so the certifier can determine it"]
    negation: ["A development application will be lodged with council", "The building exceeds the code's height standard, so a DA is required"]
    profile: [hdr.cond.planning]
    adds:
      program: ["Prepare and lodge the complying development certificate", "Certifier determination"]
      cost_plan: ["CDC fee", "Contributions under the CDC"]
      rfps: [{discipline: consultant.certifier, must_include: ["CDC assessment and determination"]}]
      authority: ["CDC by the registered certifier; neighbour notice before work; contributions still payable"]
    removes:
      procurement: [consultant.town_planner]
      cost_plan: ["DA fees and contributions", "Construction certificate and certifier fees"]
      program: ["Lodge the DA", "DA notification", "DA assessment and determination", "Construction certificate: early works", "Construction certificate: building", "Pre-DA meeting with council"]
      rfps: [consultant.town_planner]
    why: "D&C plus CDC falls back to sk.generic; the town-planning and bca-certification RFPs block on cdc; the app still suggests the town planner through baselines[0]"
    built_in: {program: "partial", cost_plan: "partial", procurement: "no", rfps: "no"}
    source: "knowledge/program/fragments.yaml fr.cdc-application"
  - id: large-isolated-building-over-limit
    label: Fire compartment over the large isolated building area or volume limit
    evidence: ["The warehouse is a single fire compartment of 24,000 m2", "the fire compartment exceeds 18,000 m2, so smoke exhaust and a fire control centre are required", "a fire control centre is provided next to the main entry"]
    negation: ["Floor area 8,000 m2; volume of the single fire compartment about 100,000 m3 (below the C3D4(1) limits of 18,000 m2 and 108,000 m3)"]
    profile: [det.floor_area, det.sprinklered]
    adds:
      procurement: [consultant.fire_engineer]
      work_items: [{system: fire-active.fire-control, action: new}, {system: fire-active.smoke-control, action: new}]
      cost_plan: ["Fire engineer", "Fire control centre", "Smoke exhaust"]
      program: ["Fire engineering brief consultation with FRNSW", "Fire engineering report"]
      rfps: [{discipline: consultant.fire_engineer, must_include: [{text: "Performance design brief", key: stage.s3_brief}, {text: "FER", key: stage.s4_report}]}, {discipline: consultant.civil, must_include: ["Perimeter vehicular access road design"]}]
      authority: ["FRNSW consultation on the performance solutions (verified: false)"]
    why: "NCC 2022 Vol One, Parts C3, E1 and E2 on the ABCB site (verified: true). Above 18,000 m2 or 108,000 m3 a Class 5-9 building stays sprinklered with perimeter vehicular access (C3D4(2); C3D5(2): at least 6 m wide, furthest boundary within 18 m), as the base already is under C3D4(1)(b). The variant adds: a fire control centre only where the total floor area exceeds 18,000 m2 (E1D15(b), C4); smoke exhaust or smoke-and-heat vents where the area or volume exceeds the limits (E2D10(2)); smoke exhaust only where the ceiling is over 12 m. The base clear height is 12 m at the haunch, so the variant expects smoke exhaust. The fire engineer moves from usually to always"
    built_in: {procurement: "no", work_items: "no", program: "no", rfps: "partial", cost_plan: "partial"}
    source: "knowledge/tables/compartment_limits.yaml exclusions"
  - id: tilt-up-on-site
    label: Tilt-up panels cast on site instead of off-site precast
    evidence: ["Tilt-up concrete wall panels cast on the warehouse slab and lifted into place", "panels to be cast on site on the floor slab as the casting bed", "tilt panels with temporary bracing"]
    negation: ["Precast panels manufactured off site and delivered", "Metal-clad walls with a precast dado"]
    profile: []
    adds:
      work_items: [{system: structure.precast, action: new}, {system: structure.temporary-works, action: new}]
      cost_plan: ["Crane hire and panel bracing"]
      program: ["Pour the floor slab as the casting bed", "Cast tilt-up panels", "Lift and brace tilt-up panels", "Remove panel bracing after the roof diaphragm is complete"]
      rfps: [{discipline: consultant.structural, must_include: [{text: "Tilt-up panel design, lifting inserts and bracing, or a delegated design schedule", key: position.delegated_design}]}]
      authority: ["SafeWork NSW: tilt-up erection is high-risk construction work needing a SWMS (NSW WHS Regulation 2025, which replaced the 2017 Regulation (C4); clause verified: false)"]
    removes:
      program: ["Manufacture precast wall panels"]
    why: "The slab precedes the walls, the reverse of fr.slab-7b's attach after the roof; no tilt-up fragment exists"
    built_in: {program: "no", rfps: "partial", cost_plan: "partial", work_items: "partial"}
    source: "knowledge/rfp/structural.yaml delegated_design"
  - id: traffic-generating-development
    label: Traffic-generating development referred to TfNSW
    evidence: ["The development is traffic generating development under Schedule 3 of the Transport and Infrastructure SEPP and is referred to TfNSW (verified: false)", "SIDRA modelling of the Mamre Road intersection", "intersection counts at the estate entry"]
    negation: ["The development is below the Schedule 3 thresholds, so it will not be referred to TfNSW"]
    profile: [flag.tfnsw_referral, flag.intersection_modelling]
    adds:
      cost_plan: ["Traffic surveys and intersection modelling"]
      program: ["Traffic counts", "TfNSW referral and response"]
      rfps: [{discipline: consultant.traffic, must_include: [{text: "Surveys", key: stage.surveys}, {text: "Intersection modelling", key: stage.modelling}, {text: "Consultation with TfNSW", key: position.consultation}]}]
      authority: ["TfNSW comments on the DA (Transport and Infrastructure SEPP; clause verified: false)"]
    built_in: {rfps: "yes", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/traffic.yaml modelling"
  - id: classified-road-frontage
    label: Site fronts or takes access from a classified road
    evidence: ["The site fronts the Great Western Highway, a classified road", "access requires a new left-in left-out intersection and deceleration lane", "road works under a Works Authorisation Deed with TfNSW"]
    negation: ["Access is from a local industrial road; the site has no classified road frontage"]
    profile: [flag.state_road, flag.public_road]
    adds:
      work_items: [{system: site.public-domain, action: new}]
      cost_plan: ["Public road works", "TfNSW WAD fees and bonds"]
      program: ["TfNSW concurrence for the access", "Works Authorisation Deed", "Road occupancy licence"]
      rfps: [{discipline: consultant.civil, must_include: [{text: "Public road works", key: element.public_road}, {text: "Authority submission schedule", key: position.public_road_approvals}, {text: "Road safety audit (option)", key: position.road_safety_audit}]}, {discipline: consultant.traffic, must_include: [{text: "Road safety audit (option)", key: position.road_safety_audit}]}]
      authority: ["TfNSW concurrence under Roads Act s138 (verified: false); WAD; road occupancy licence"]
    why: "Civil scale goes complex (public_road); traffic is already complex through heavy vehicles"
    built_in: {rfps: "yes", program: "no", cost_plan: "no", work_items: "no"}
    source: "knowledge/rfp/civil.yaml public_road"
  - id: flood-affected
    label: Flood planning area or overland flow on the lot
    evidence: ["The land is within the flood planning area", "warehouse floor level set 500 mm above the 1% AEP flood level", "an overland flow path runs along the eastern boundary"]
    negation: ["The s10.7 certificate shows no flood related development controls"]
    profile: [det.flood_hazard, det.flood_planning_level]
    adds:
      work_items: [{system: site.flooding, action: investigate}]
      cost_plan: ["Flood impact assessment", "Raised pad and flood-compatible materials"]
      program: ["Council flood advice", "Flood impact assessment"]
      rfps: [{discipline: consultant.civil, must_include: [{text: "Flood report and floor levels for the DA", key: position.flood_report}, {text: "Flood evacuation plan (option)", key: position.flood_evacuation}]}]
      authority: ["Council flood advice letter"]
    why: "fr.flood-1a and fr.flood-2 do not apply to 7b; the investigate item gets fr.investigate-flooding. Civil scale goes complex"
    built_in: {work_items: "no", rfps: "yes", program: "partial", cost_plan: "no"}
    source: "knowledge/rfp/civil.yaml flood_report"
  - id: contaminated-land
    label: Contaminated or potentially contaminated land
    evidence: ["The site is a former market garden; a preliminary site investigation is required", "the PSI found elevated TRH and asbestos fragments in the fill", "a remedial action plan and site audit statement will be prepared"]
    negation: ["The estate developer's validation report confirms the lot is suitable for industrial use"]
    profile: [det.potentially_contaminated_land]
    adds:
      procurement: [consultant.environmental]
      work_items: [{system: site.contamination, action: investigate}]
      cost_plan: ["Environmental consultant", "Remediation and validation", "Waste classification and disposal of fill"]
      program: ["Preliminary site investigation", "Detailed site investigation", "Remedial action plan", "Remediation and validation"]
      rfps: [{discipline: consultant.civil, must_include: [{text: "Earthworks reuse and disposal coordinated with the environmental advice", key: position.earthworks_suitability}]}]
      authority: ["SEPP (Resilience and Hazards) 2021 Chapter 4 (verified: false); NSW EPA-accredited site auditor where required"]
    why: "complexity_additions[2] keys det.potentially_contaminated_land since F41 (local main 3adc511), so the environmental consultant is suggested, and its package gives the consultant cost line; remediation and fill disposal have no cost line"
    built_in: {procurement: "yes", work_items: "no", program: "partial", rfps: "yes", cost_plan: "partial"}
    source: "knowledge/rfp/civil.yaml earthworks_suitability; knowledge/works/package_defaults.yaml complexity_additions[2] potentially_contaminated_land"
  - id: bushfire-prone
    label: Bushfire-prone land at the estate edge
    evidence: ["The site is mapped as bush fire prone land (vegetation buffer)", "a bushfire assessment report to Planning for Bush Fire Protection 2019 is required (verified: false)", "asset protection zone along the riparian corridor"]
    negation: ["The land is not identified as bush fire prone land"]
    profile: [det.bushfire_prone_land, det.bal]
    adds:
      procurement: [consultant.bushfire]
      work_items: [{system: envelope.bushfire-construction, action: new}]
      cost_plan: ["Bushfire consultant", "Bushfire construction measures and APZ landscaping"]
      program: ["Bushfire assessment report"]
      authority: ["s4.14 EP&A Act assessment (verified: false); RFS advice"]
    why: "fr.bushfire-1a and fr.bushfire-9b do not apply to 7b; no RFP row tests bushfire"
    built_in: {procurement: "yes", work_items: "no", program: "no", cost_plan: "partial"}
    source: "knowledge/works/package_defaults.yaml complexity_additions[5]"
  - id: sloping-site-retaining
    label: Sloping lot needing a large cut and fill pad with retaining walls
    evidence: ["a cut of up to 6 m at the rear and 4 m of fill at the front to form the pad", "keystone retaining walls along the side boundaries", "imported fill placed under Level 1 supervision"]
    negation: ["The lot was benched by the estate developer; no retaining walls"]
    profile: []
    adds:
      work_items: [{system: site.retaining-walls, action: new}]
