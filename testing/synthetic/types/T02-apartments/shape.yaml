      blocking: []
      sources: ["scale complex: Class 2 part", "blocking fact:budget clears once proj.budget_stated is read"]
    app_differs:
      - {key: stage.regulated_design, app: option, expect: include, why: "D&C boundary ends at dnc_tender, so every later stage is priced as an option"}
      - {key: stage.post_novation, app: option, expect: include, why: "same boundary; the post-novation stage is the core of a novated appointment"}
      - {key: stage.contract_admin, app: option, expect: absent, why: "client flag contract_admin cannot be keyed; the novated architect cannot administer the contract"}
