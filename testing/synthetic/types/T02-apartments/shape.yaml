    expect:
      stages_include: [concept, schematic, planning_approval, planning_response, design_development, dnc_tender, regulated_design, post_novation]
      stages_absent: [brief_masterplan, interiors, house_documents, tender_traditional, bidding, for_construction, construction_support, contract_admin]
