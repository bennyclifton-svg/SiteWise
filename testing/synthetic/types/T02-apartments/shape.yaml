procurement:
  - {discipline: consultant.architect, kind: services, need: always, novation: "yes", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Design lead, SEPP 65/ADG design, design verification statement, DA, D&C tender set, then novated for construction documentation and regulated designs"}
  - {discipline: consultant.town_planner, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml complexity_additions[0]", why: "SEE, ADG and LEP compliance, pre-DA, panel; not novated"}
  - {discipline: consultant.surveyor, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Detail and boundary survey, neighbours' levels, later the strata plan"}
  - {discipline: consultant.geotechnical, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Boreholes, rock, groundwater, retention parameters; reliance given to the contractor"}
  - {discipline: consultant.structural, kind: services, need: always, novation: "yes", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Retention, transfer, PT slabs; regulated designs and declarations under the DBP Act"}
  - {discipline: consultant.civil, kind: services, need: always, novation: "yes", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Stormwater, OSD, MUSIC, driveway and public-domain levels, s138 drawings"}
  - {discipline: consultant.hydraulic, kind: services, need: always, novation: "option", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Water, sewer, rainwater, Sydney Water s73 through a Water Servicing Coordinator. Novation option (CONVENTIONS C1): builders often bring their own D&C services trades"}
  - {discipline: consultant.electrical, kind: services, need: always, novation: "option", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "Power, lighting, substation coordination with the ASP Level 3, comms, EV"}
  - {discipline: consultant.mechanical, kind: services, need: always, novation: "option", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[1]", why: "Car park ventilation, corridor ventilation, exhaust, AC; arrives through the 7a class mapping and scope_additions[2]"}
  - {discipline: consultant.fire_services, kind: services, need: always, novation: "option", built_in: "yes", source: "knowledge/works/package_defaults.yaml scope_additions[1]", why: "Sprinklers, hydrants, booster, pump, detection"}
  - {discipline: consultant.bca, kind: services, need: always, novation: "option", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[1]", why: "BCA report for the DA and design advice; arrives only because 7a maps to industrial"}
  - {discipline: consultant.certifier, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[0]", why: "CC, principal certifier, Class 2 critical-stage inspections, OC; never novated"}
  - {discipline: consultant.access, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml scope_additions[5]", why: "Access report for the DA, ADG livable and adaptable units, CC review"}
  - {discipline: consultant.traffic, kind: services, need: always, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[1]", why: "Traffic and parking report, ramps and swept paths; arrives only through the 7a mapping"}
  - {discipline: consultant.acoustic, kind: services, need: always, novation: "option", built_in: "no", why: "DA acoustic report (road, plant, ADG), NCC F7 SOU separation, pre-OC testing; no package rule"}
  - {discipline: consultant.basix, kind: services, need: always, novation: "option", built_in: "no", why: "NatHERS for every apartment and the BASIX certificate (often an ESD firm); no package rule"}
  - {discipline: consultant.waste, kind: services, need: always, novation: "no", built_in: "no", why: "Operational and demolition/construction waste management plans for the DA; template exists, no package rule"}
  - {discipline: consultant.landscape, kind: services, need: always, novation: "yes", built_in: "no", why: "ADG deep soil and communal open space, landscape plan for the DA, podium build-ups; template exists, no package rule"}
  - {discipline: consultant.quantity_surveyor, kind: services, need: always, novation: "no", built_in: "no", why: "Feasibility and cost plans, the registered QS cost report for the DA fee, D&C tender review, progress claims"}
  - {discipline: consultant.fire_engineer, kind: services, need: usually, novation: "option", built_in: "no", why: "Performance solutions are common in Class 2 (travel distance, booster location, car park); template exists, no package rule"}
  - {discipline: consultant.hazmat, kind: services, need: always, novation: "no", built_in: "no", why: "Hazardous materials survey of the existing dwellings, asbestos clearance after demolition"}
  - {discipline: consultant.vertical_transport, kind: services, need: optional, novation: "no", built_in: "yes", source: "knowledge/works/package_defaults.yaml scope_additions[0]", why: "Lift traffic and specification for one or two lifts; often left to the electrical engineer or the lift subcontractor"}
  - {discipline: trade.main_works, kind: works, need: always, novation: "no", built_in: "partial", source: "internal/procurement/proposed.go ProposeHeadContract", why: "D&C head contract under AS 4902 with a licensed builder; proposed only from gaps on accepted work items"}

not_expected_procurement: []

