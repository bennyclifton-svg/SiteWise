triggers:
  - id: traditional-procurement
    label: Full documentation and lump-sum tender instead of D&C with novation
    evidence: ["The architect will prepare full construction documentation for a lump-sum tender under AS 4000", "Consultants remain engaged by the developer through construction; no novation"]
    negation: ["Design and construct with novation of the design team after DA"]
    profile: [hdr.cond.procurement_route]
    adds:
      program: ["Prepare construction documentation before tender", "Construction certificate before award"]
      rfps:
        - discipline: consultant.architect
          must_include: [{text: "Tender documents", key: stage.tender_traditional}, {text: "For-construction documents", key: stage.for_construction}, "Option: design support during construction"]
          must_not_include: [{text: "D&C tender documents", key: stage.dnc_tender}, {text: "Post-novation", key: stage.post_novation}]
        - discipline: consultant.structural
          must_include: [{text: "Tender documents", key: stage.tender_traditional}, {text: "Construction documents", key: stage.construction_documents}]
          must_not_include: [{text: "D&C tender documents", key: stage.dnc_tender}, {text: "Post-novation", key: stage.post_novation}]
        - discipline: consultant.civil
          must_include: [{text: "Detailed design for tender", key: stage.detailed_tender}, {text: "Final design for construction", key: stage.for_construction}]
          must_not_include: [{text: "Design for the D&C tender", key: stage.dnc_tender}, {text: "Final design after novation", key: stage.post_novation}]
    removes:
      program: ["Novate the design consultants"]
    why: "Every package's novation becomes no (internal/procurement/packages.go DefaultNovation), so the D&C and post-novation stages drop out of the architect, structural and civil RFPs (removes.rfps is not used because the RFPs themselves stay). App caveats (trigger RFP items carry no app_differs): for a non-house traditional job the architecture boundary is brief_masterplan → interiors (architecture.yaml boundary[3]), so tender_traditional, bidding and for_construction come after it and the app prices them as options. Civil's non-D&C boundary is schematic → detailed_tender (civil.yaml boundary[1]), so the app prices for_construction as an option. The structural boundary runs to construction_documents, so both structural stages are included. The services templates keep their fixed inception → design boundary, so their tender stage stays an option"
    built_in: {program: "yes", rfps: "partial", procurement: "yes"}
    source: "knowledge/program/skeletons.yaml sk.new-traditional-da"
  - id: groundwater-dewatering
    label: Groundwater above the base of the basement
    evidence: ["Groundwater was measured at RL 14.2, about 3 m above bulk excavation level", "dewatering will be required during excavation", "a tanked basement is recommended"]
    negation: ["No groundwater was encountered in the boreholes to the depth investigated"]
    profile: [flag.groundwater]
    adds:
      cost_plan: ["Dewatering, treatment and discharge", "Tanked basement"]
      program: ["Groundwater monitoring", "Dewatering approval", "Dewater during excavation"]
      rfps: [{discipline: consultant.civil, must_include: ["Earthworks suitability coordinated with groundwater advice"]}, {discipline: consultant.geotechnical, must_include: ["Groundwater monitoring and hydrogeological assessment"]}]
      authority: ["WaterNSW or NRAR dewatering approval; DA integrated development referral (verified: false)"]
    built_in: {rfps: "yes", cost_plan: "no", program: "no"}
    source: "knowledge/rfp/civil.yaml earthworks_suitability"
  - id: cl46-variation
    label: Height or FSR exceeds the LEP standard (clause 4.6)
    evidence: ["A clause 4.6 written request is submitted to vary the height of buildings standard", "the lift overrun exceeds the 21 m height control by 1.4 m"]
    negation: ["The proposal complies with the height and FSR development standards"]
    profile: [flag.cl46]
    adds:
      program: ["Prepare the clause 4.6 variation request"]
      rfps: [{discipline: consultant.town_planner, must_include: ["Clause 4.6 variation request"]}]
    built_in: {rfps: "yes", program: "no"}
    source: "knowledge/rfp/town-planning.yaml variation_request"
  - id: heritage-conservation-area
    label: Site in a heritage conservation area or next to a heritage item
    evidence: ["The site adjoins a local heritage item listed in Schedule 5", "within the Ashwell Heritage Conservation Area"]
    negation: ["The site is not a heritage item, is not in a conservation area and is not in the vicinity of an item"]
    profile: [det.heritage_status]
    adds:
      procurement: [consultant.heritage]
      cost_plan: ["Heritage consultant"]
      program: ["Heritage impact statement", "Heritage referral"]
      rfps: [{discipline: consultant.town_planner, must_include: ["Heritage controls in the SEE"]}]
    built_in: {procurement: "yes", program: "yes", cost_plan: "yes", rfps: "partial"}
    source: "knowledge/works/package_defaults.yaml complexity_additions[1]"
  - id: flood-affected
    label: Flood-affected site
    evidence: ["The site is subject to flood related development controls", "basement entry crest set above the PMF level"]
    negation: ["The land is not subject to flood related development controls"]
    profile: [det.flood_hazard]
    adds:
      work_items: [{system: site.flooding, action: new}]
      cost_plan: ["Flood study", "Flood barriers and raised entry crest"]
      program: ["Council flood advice", "Construct flood protection"]
      rfps: [{discipline: consultant.civil, must_include: ["Flood report and floor levels", "Flood evacuation plan option"]}]
    built_in: {rfps: "yes", program: "partial", work_items: "no", cost_plan: "no"}
    source: "knowledge/rfp/civil.yaml flood_report"
  - id: contaminated-land
    label: Former industrial or service-station use
    evidence: ["The site was a service station until 1994", "a preliminary site investigation is required under the Resilience and Hazards SEPP", "fill containing ash and slag"]
    negation: ["Historical searches show continuous residential use; no contamination is expected"]
    profile: [det.potentially_contaminated_land]
    adds:
      procurement: [consultant.environmental]
      work_items: [{system: site.contamination, action: investigate}]
      cost_plan: ["Contamination investigation, remediation and validation", "Site auditor"]
      program: ["Preliminary and detailed site investigation", "Remedial action plan", "Remediation and validation"]
      rfps: [{discipline: consultant.civil, must_include: ["Earthworks reuse and disposal coordinated with environmental advice"]}]
      authority: ["SEPP (Resilience and Hazards) 2021 Chapter 4; site audit statement (verified: false)"]
    built_in: {procurement: "no", work_items: "no", program: "partial", rfps: "yes", cost_plan: "no"}
    source: "knowledge/rfp/civil.yaml earthworks_suitability"
  - id: acid-sulfate-soils
    label: Acid sulfate soils mapped
    evidence: ["Class 2 on the Acid Sulfate Soils Map", "an acid sulfate soils management plan is required for the basement excavation"]
    negation: ["The land is not mapped as acid sulfate soils"]
    profile: [det.acid_sulfate_soils_mapped]
    adds:
      work_items: [{system: site.acid-sulfate-soils, action: investigate}]
      cost_plan: ["Acid sulfate soils assessment and treatment"]
      program: ["Acid sulfate soils assessment"]
      rfps: [{discipline: consultant.geotechnical, must_include: ["Acid sulfate soils assessment and management plan"]}]
    built_in: {work_items: "no", program: "partial", rfps: "partial", cost_plan: "no"}
    source: "knowledge/program/fragments.yaml fr.investigate-acid-sulfate"
  - id: trees-affected
    label: Street or neighbouring trees affected by excavation
    evidence: ["the basement wall is within the tree protection zone of two street trees", "the neighbour's fig overhangs the boundary where the shoring is proposed"]
    negation: ["No trees on or next to the site are affected by the works"]
    profile: [flag.arborist_tree_impacts, flag.arborist_offsite_trees]
    adds:
      procurement: [consultant.arborist]
      work_items: [{system: site.trees, action: retain}]
      cost_plan: ["Arborist", "Tree protection and root investigation"]
      program: ["Arborist impact assessment", "Install tree protection"]
      rfps: [{discipline: consultant.arborist, must_include: ["AS 4970 impact assessment", "Tree protection plan", "Root mapping where shoring is in the TPZ"]}]
      authority: ["Council tree permit or DA consent; street tree bond"]
    why: "fr.tree-protection exists but retain brings no fragment; arborist is never suggested, so the arborist RFP exists only if the user creates the package"
    built_in: {procurement: "no", work_items: "no", program: "partial", rfps: "yes", cost_plan: "no"}
    source: "knowledge/rfp/arborist.yaml s2_impact"
  - id: sydney-water-asset
    label: Sydney Water main crosses or adjoins the site
    evidence: ["A 225 mm Sydney Water sewer main crosses the rear of the lots", "the basement is within the zone of influence of the sewer"]
    negation: ["No Sydney Water assets are within or adjacent to the property", "Connection to the existing water main in the street; no Sydney Water assets cross the site"]
    profile: [flag.authority_asset]
    adds:
      cost_plan: ["Sewer diversion or encasement"]
      program: ["Sydney Water building-over or diversion approval", "Divert the sewer main"]
      rfps: [{discipline: consultant.structural, must_include: ["Authority asset assessment"]}, {discipline: consultant.hydraulic, must_include: ["Sewer diversion design through the Water Servicing Coordinator"]}]
      authority: ["Sydney Water asset adjustment or building-over approval"]
    built_in: {rfps: "yes", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/structural.yaml authority_asset"
  - id: rail-corridor
    label: Site next to a rail corridor
    evidence: ["The site adjoins the Sydney Trains corridor on its eastern boundary", "excavation within 25 m of the rail corridor"]
    negation: ["The site is not near a rail corridor"]
    profile: [flag.rail]
    adds:
      cost_plan: ["Rail noise and vibration treatment", "Sydney Trains external interface fees"]
      program: ["Transport for NSW concurrence", "Rail corridor dilapidation and monitoring"]
      rfps: [{discipline: consultant.structural, must_include: ["Rail corridor assessment and monitoring"]}, {discipline: consultant.acoustic, must_include: ["Rail noise and vibration assessment to the Transport and Infrastructure SEPP criteria (verified: false)"]}, {discipline: consultant.geotechnical, must_include: ["Asset exposure assessment for the rail corridor (client flag geotech_asset_exposure, app: ask)"]}]
      authority: ["Transport and Infrastructure SEPP rail concurrence (verified: false)"]
    built_in: {rfps: "yes", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/structural.yaml authority_asset"
  - id: transfer-structure
    label: Transfer slab between the car park grid and the apartments
    evidence: ["A transfer slab at ground floor picks up the apartment columns", "transfer beams over the basement entry"]
    negation: ["Columns run straight from the basement to the roof; no transfer structure"]
    profile: [flag.transfer_structures]
    adds:
      cost_plan: ["Transfer slab"]
      program: ["Form and pour the transfer slab"]
    built_in: {cost_plan: "no", program: "no"}
    why: "Zero RFP delta: structural is already complex for Class 2"
  - id: noise-affected-site
    label: Busy road or aircraft noise
    evidence: ["The site fronts a road carrying over 20,000 vehicles a day", "within the 20 ANEF contour"]
    negation: ["The site is on a quiet local street; no road or aircraft noise controls apply", "The acoustic report assesses road traffic noise from a local street and standard glazing achieves the internal criteria"]
    profile: [det.noise_affected_site]
    adds:
      cost_plan: ["Acoustic glazing and facade upgrade", "Mechanical ventilation for closed windows"]
      rfps: [{discipline: consultant.acoustic, must_include: ["Road or aircraft noise intrusion assessment"]}]
      authority: ["Transport and Infrastructure SEPP road noise criteria (verified: false)"]
    built_in: {cost_plan: "no", rfps: "no"}
  - id: underpinning-neighbour
    label: Neighbouring footings need underpinning
    evidence: ["The neighbour's footings are shallow and within the excavation zone; underpinning is required", "underpin the party wall"]
    negation: ["The basement is set back from the boundaries so no underpinning is needed"]
    profile: []
    why: "Delta is the work item only; base already sets flag.excavation_adjoining yes, and no flag or determinant names underpinning"
    adds:
      work_items: [{system: substructure.underpinning, action: new}]
      cost_plan: ["Underpinning of neighbouring footings"]
      program: ["Underpin adjoining structures"]
      authority: ["Neighbour's consent; Access to Neighbouring Land Act order if refused (verified: false)"]
    built_in: {work_items: "no", program: "partial", cost_plan: "partial"}
    source: "knowledge/program/fragments.yaml fr.underpinning-2"
  - id: gas-reticulation
    label: Natural gas to apartments
    evidence: ["Gas cooktops to each apartment and a central gas hot water plant", "Jemena gas meter room"]
    negation: ["All-electric building: induction cooktops and heat-pump hot water"]
    profile: [det.gas_supply]
    adds:
      work_items: [{system: hydraulic.gas, action: new}]
      program: ["Install consumer gas", "Jemena network connection"]
      rfps: [{discipline: consultant.hydraulic, must_include: ["Gas design and meter room"]}]
      authority: ["Jemena network extension and meter approval"]
    built_in: {work_items: "no", program: "partial", rfps: "partial"}
    source: "knowledge/program/fragments.yaml fr.gas-commercial"
  - id: two-buildings-shared-basement
    label: Two buildings over a shared basement
    evidence: ["Building A and Building B share a two-level basement", "two residential flat buildings"]
    negation: ["A single residential flat building", "Demolition of the existing buildings; a single residential flat building is proposed"]
    profile: [flag.multi_building, flag.staged]
    adds:
      cost_plan: ["Cost allocation by building"]
      program: ["Staged occupation certificates"]
      rfps: [{discipline: consultant.architect, must_include: ["Brief and masterplan"]}, {discipline: consultant.certifier, must_include: ["Staged occupation"]}]
      authority: ["Strata management statement or building management statement"]
    built_in: {rfps: "yes", program: "no", cost_plan: "no"}
    source: "knowledge/rfp/architecture.yaml brief_masterplan"
  - id: complex-facade
    label: Rainscreen or unitised facade designed by a facade engineer
    evidence: ["A ventilated rainscreen of terracotta baguettes on an aluminium subframe", "the facade will be designed by a specialist facade engineer"]
    negation: ["Face brick and rendered masonry with standard aluminium windows"]
    profile: [det.facade_type]
    adds:
      procurement: [consultant.facade]
      cost_plan: ["Facade engineer"]
    built_in: {procurement: "yes", cost_plan: "yes"}
    source: "knowledge/works/package_defaults.yaml complexity_additions[7]"
    why: "No RFP template for the facade engineer (generic tpl.rfp-capex)"
  - id: ssd-affordable-housing
    label: State significant development with the in-fill affordable housing bonus
    evidence: ["The proposal includes in-fill affordable housing under the Housing SEPP and seeks the floor space and height bonus", "The application is state significant development; SEARs have been requested from the Department"]
