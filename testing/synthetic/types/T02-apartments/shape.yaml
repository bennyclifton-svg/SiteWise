schema: sitewise-synthetic-shape/1
type_id: T02
slug: apartments
name: Multi-residential apartments, 4–8 storeys
reviewed: false
state: NSW
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
# App predictions marked "verified by run" came from running the real Go (rfp.Resolve,
# program.Generate) against this profile through `go test -overlay`, with no file written in the repo.
profile:
  hdr.building_class: residential
  hdr.subclass: apartments
  hdr.work_type: new
  hdr.cond.planning: da
  hdr.cond.procurement_route: design_construct
  hdr.cond.quality_level: mid
  hdr.cond.operational_constraints: vacant
  hdr.cond.stakeholder_complexity: single_owner
  hdr.cond.access_constraints: urban_constrained
  hdr.cond.environmental_sensitivity: standard
  hdr.scale.storeys: 6
  hdr.scale.site_sqm: 2400
  hdr.scale.gfa_sqm: 6200
  hdr.scale.units: 64
  hdr.scale.avg_unit_size_sqm: 80
  det.ncc_class: ["2", 7a]
  det.rise_in_storeys: 6
  det.sprinklered: true
  det.state: NSW
  det.existing_building: false
  det.existing_building_year: 1962
  det.heritage_status: none
  det.bushfire_prone_land: false
  det.flood_hazard: false
  det.potentially_contaminated_land: false
  det.acid_sulfate_soils_mapped: false
  det.noise_affected_site: false
  det.facade_type: standard
  det.climate_zone: "5"
  det.sewer_connection: reticulated
  det.water_supply_source: reticulated
  det.gas_supply: none
  fact.contract_form: as4902
  proj.regulated_design: "yes"
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.basement: "yes"
  flag.excavation_adjoining: "yes"
  flag.transfer_structures: "no"
  flag.authority_asset: "no"
  flag.rail: "no"
  flag.groundwater: "no"
  flag.osd_existing: "no"
  flag.osd_required: "yes"
  flag.norbe: "no"
  flag.stormwater_quality: "yes"
  flag.public_road: "yes"
  flag.state_road: "no"
  flag.heavy_vehicles: "no"
  flag.tfnsw_referral: "no"
  flag.intersection_modelling: "no"
  flag.gtp_required: "no"
  flag.cl46: "no"
  flag.panel: "yes"
  flag.community: "no"
  flag.architect_lodges: "no"
  flag.sustainability_target: "no"
  flag.coastal: "no"
  flag.country: "no"
  flag.staged: "no"
  flag.multi_building: "no"
  flag.arborist_offsite_trees: "no"
  flag.arborist_tree_impacts: "no"
  flag.arborist_pruning: "no"
  flag.fire_vulnerable_occupants: "no"
  flag.fire_special_hazards: "no"
  flag.fire_specialist_systems: "no"

expected_derived:
  - {key: det.type_of_construction, value: A, source: "knowledge/tables/type_of_construction.yaml rows[0]", note: "Class 2 at rise in storeys 4+ is Type A (Table C2D2, verified: true in the knowledge); mixed 2/7a needs C2D4 first, which the table does not do"}
  - {key: det.basix_required, value: true, source: "knowledge/clusters/envelope/rules.yaml rule.basix.certificate-required", note: "derivation pending in the rule; returns unknown today"}
  - {key: det.energy_compliance_pathway, value: basix, note: "no profile_group, so not settable; BASIX covers Class 2 SOUs in NSW, Section J the common areas (verified: false)"}

scenario_inputs:
  - {key: proj.budget_stated, note: "stated in the developer's brief or feasibility; the architecture RFP blocks on fact:budget without it", phrasing: "Construction budget: $<amount> excluding GST"}
  - {key: proj.regulated_design, note: "the app never infers it from the class; a read document must say it", phrasing: "The building is a Class 2 building under the Design and Building Practitioners Act 2020; regulated designs and design compliance declarations are required"}
  - {key: hdr.cond.procurement_route, note: "D&C with novation must be stated; there is no novated-D&C route, novation is a per-package election", phrasing: "Design and construct under AS 4902, with the architect and engineering consultants novated to the contractor after DA"}
  - {key: flag.panel, note: "a Housing SEPP Chapter 4 DA of 4+ storeys goes to a planning panel: the local planning panel, or the Sydney district planning panel when the CIV makes it regionally significant (threshold verified: false); flag.panel is yes either way", phrasing: "The application will be determined by the <Local | Sydney District> Planning Panel (keep consistent with the stated CIV; regionally significant threshold verified: false)"}
  - {key: flag.basement, note: "geotechnical brief or architectural report", phrasing: "Two basement levels excavated to a depth of about 7 m"}
  - {key: flag.excavation_adjoining, note: "geotechnical or structural report", phrasing: "Excavation extends to within 1 m of the northern boundary and the neighbouring dwelling"}
  - {key: flag.osd_required, note: "civil concept or council pre-DA notes", phrasing: "On-site detention is required under council's stormwater policy"}
  - {key: flag.stormwater_quality, note: "civil concept", phrasing: "MUSIC modelling is required to show the pollutant reduction targets are met"}
  - {key: flag.public_road, note: "pre-DA notes or civil scope", phrasing: "Works within the road reserve: new footpath, kerb and gutter and vehicle crossing under a s138 consent"}
  # Keyword-trap guidance (review finding 3). Base documents naturally use these phrases; each trips a regex.
  # A clean-tier scenario should state the base value explicitly beside the phrase.
  - {key: det.existing_building, note: "'existing building on the site will be demolished' matches the existing_building trigger; base stays false (no retained building)", phrasing: "The existing dwellings will be demolished; no existing building is retained or altered"}
  - {key: flag.multi_building, note: "'four existing buildings' or 'building a minimum 6 m from the boundary' match the multi_building patterns; base is one building", phrasing: "A single residential flat building is proposed"}
  - {key: flag.staged, note: "'Stage 1 CC (excavation and shoring)' matches the staged pattern; CC stages are not construction stages", phrasing: "The works are delivered in one stage; the construction certificate is issued in two parts"}
  - {key: flag.authority_asset, note: "'connect to the water main / sewer main in the street' matches authority_asset; base is no", phrasing: "Connection to the existing water main in the street; no Sydney Water assets cross or adjoin the site"}
  - {key: det.noise_affected_site, note: "'road traffic noise assessment' in the base acoustic report matches the noise trigger; base is false", phrasing: "Road traffic noise from the local street is low and standard glazing achieves the internal criteria"}
  - {key: flag.arborist_offsite_trees, note: "'new street trees' in the public-domain scope matches arborist_offsite_trees; planting new trees affects none", phrasing: "New street trees will be planted; no existing street or neighbouring trees are affected"}

work_items:
  - {system: site.survey-boundaries, action: new, why: "Set-out, level control and identification surveys; the strata plan survey is a consultant task"}
  - {system: site.ground-conditions, action: investigate, why: "Geotechnical and groundwater investigation for basement retention design; not in the default list"}
  - {system: site.demolition, action: remove, why: "Demolish the existing dwellings on the amalgamated lots after hazmat removal; not in the default list"}
  - {system: site.earthworks, action: new, why: "Bulk excavation, rock excavation, spoil classification and disposal"}
  - {system: site.erosion-sediment-control, action: new, why: "Sediment controls, wheel wash, dust; standard DA condition"}
  - {system: site.stormwater-detention, action: new, why: "OSD tank, water-quality treatment, site drainage to council's system"}
  - {system: site.services-connections, action: new, why: "Water, sewer, fire service, NBN and electrical lead-ins; Section 73 works"}
  - {system: site.vehicle-access, action: new, why: "Driveway, basement ramp and car park layout to AS 2890.1"}
  - {system: site.waste-storage, action: new, why: "Bin room, bulky goods room, collection point to the waste management plan"}
  - {system: site.public-domain, action: new, why: "Footpath, kerb and gutter, vehicle crossing, street trees under s138 (verified: false)"}
  - {system: site.adjoining-structures, action: new, why: "Dilapidation, support and protection of neighbouring buildings and boundary walls"}
  - {system: site.landscape, action: new, why: "Deep soil, communal open space, podium planting to the ADG and landscape plan"}
  - {system: substructure.basement-retention, action: new, why: "Piled or shotcrete retention, anchors or props, two basement levels"}
  - {system: substructure.footings, action: new, why: "Pad or strip footings on rock or piers at basement level"}
  - {system: substructure.damp-waterproofing, action: new, why: "Drained cavity or tanked basement walls, under-slab drainage"}
  - {system: structure.concrete, action: new, why: "Post-tensioned or reinforced slabs, columns, blade walls, cores"}
  - {system: envelope.external-walls, action: new, why: "Masonry, precast or FC facade; non-combustible for Type A"}
  - {system: envelope.windows-doors, action: new, why: "Aluminium windows and balcony doors; long lead"}
  - {system: envelope.external-waterproofing, action: new, why: "Balconies, podium, planters and roof membrane; the Class 2 defect hot spot"}
  - {system: envelope.flashings-seals, action: new, why: "Sill and head flashings, balcony door thresholds; not in the default list"}
  - {system: envelope.thermal-insulation, action: new, why: "Roof, facade and slab insulation to the NatHERS specification"}
  - {system: envelope.thermal-performance, action: new, why: "BASIX commitments for every apartment"}
  - {system: envelope.facade-acoustics, action: new, why: "Glazing and facade sound ratings from the acoustic report"}
  - {system: interiors.walls-linings, action: new, why: "Plasterboard and SOU separating walls"}
  - {system: interiors.ceilings, action: new, why: "Ceilings and services bulkheads"}
  - {system: interiors.wet-area-waterproofing, action: new, why: "Every bathroom and laundry to AS 3740"}
  - {system: interiors.tiling, action: new, why: "Wet areas, splashbacks, lobbies"}
  - {system: interiors.floor-finishes, action: new, why: "Timber or vinyl over acoustic underlay, carpet"}
  - {system: interiors.joinery, action: new, why: "Kitchens, vanities, robes; long lead"}
  - {system: interiors.internal-doors, action: new, why: "Apartment internal doors"}
  - {system: interiors.internal-glazing, action: new, why: "Shower screens and mirrors"}
  - {system: interiors.painting, action: new, why: "Apartments and common areas"}
  - {system: interiors.acoustic-separation, action: new, why: "Sound insulation between SOUs, NCC Part F7 (verified: false)"}
  - {system: interiors.ffe, action: new, why: "Cooktops, ovens, rangehoods, dishwashers as PC items; not in the default list"}
  - {system: fire-passive.rated-elements, action: new, why: "Type A FRLs to structure, shafts and SOU bounding walls"}
  - {system: fire-passive.compartments, action: new, why: "Separation of the Class 7a car park from the Class 2 part, fire-isolated stairs"}
  - {system: fire-passive.penetrations, action: new, why: "Fire stopping at every service penetration"}
  - {system: fire-passive.openings, action: new, why: "Fire-rated SOU entry doors and self-closers; not in the default list"}
  - {system: fire-passive.external-walls, action: new, why: "External wall combustibility evidence for Type A; not in the default list"}
  - {system: fire-active.sprinklers, action: new, why: "NCC 2022 E1D6 (whole building, rise in storeys >= 4, effective height <= 25 m); E1D4(2): Specification 17 and 18 as applicable (verified: true, ABCB NCC 2022 Part E1); not in the default list"}
  - {system: fire-active.fire-water, action: new, why: "Fire service connection, booster and usually a pump set; not in the default list"}
  - {system: fire-active.hydrants, action: new, why: "Hydrants and booster to AS 2419.1"}
  - {system: fire-active.detection, action: new, why: "Smoke detection and building occupant warning in common areas"}
  - {system: fire-active.smoke-alarms, action: new, why: "Smoke alarms in each SOU"}
  - {system: fire-active.emergency-lighting, action: new, why: "Emergency lights and exit signs"}
  - {system: fire-active.portable-extinguishers, action: new, why: "Car park and plant rooms"}
