triggers:
  - id: tank-needs-consent
    label: Tank or pump house fails the Fire Safety Code standards, or the land is excluded from complying development
    evidence:
      - "Two of the basement car spaces will be lost to the new tank, below the number required by the original consent."
      - "Council advised that the tank and pump house are not complying development and a DA is required."
      - "The proposed external pump house would sit over a registered easement, so it fails the Fire Safety Code standards."
    negation:
      - "The tank fits within the existing basement store; no car spaces or external areas are affected."
      - "The certifier confirmed the tank and pump house meet the Fire Safety Code development standards."
    profile: [hdr.cond.planning]
    skeleton: sk.refurb-traditional-da
    adds:
      procurement: [consultant.town_planner, consultant.bca]
      cost_plan: ["DA fees and contributions", "Construction certificate and certifier fees", "Town planner"]
      program: ["Lodge the application", "Public exhibition", "Assessment", "Construction certificate", "Fire safety schedule issued with the construction certificate"]
      rfps:
        - {discipline: consultant.town_planner, must_include: ["Statement of environmental effects for the tank and screening", "Car parking assessment"]}
        - discipline: consultant.certifier
          must_include: [{text: "Construction certificate assessment with the fire safety schedule", key: stage.b2_construction_approval}]
          expect:
            stages_include: [a2_planning, b2_construction_approval]
            stages_absent: [b2_cdc]
        - discipline: consultant.bca
          must_include: [{text: "BCA report supporting the DA", key: stage.a2_planning}, {text: "Detailed design BCA advice for the CC", key: stage.a3_tender}]
          must_not_include: [{text: "Principal certifier functions", key: position.statutory_functions}, {text: "Building supervision", key: position.supervision}]
          expect:
            stages_include: [a1_inception, a2_planning, a3_tender]
            stages_option: [a4_construction]
            stages_absent: [b1_preliminary, b2_construction_approval, b2_cdc, b3_construction, b4_occupation]
          app_differs:
            - {key: stage.a1_inception, app: ask, expect: include, why: "client flag bca_advisory cannot be keyed"}
            - {key: stage.a2_planning, app: ask, expect: include, why: "client flag bca_advisory"}
            - {key: stage.a3_tender, app: ask, expect: include, why: "client flag bca_advisory"}
            - {key: stage.b1_preliminary, app: option, expect: absent, why: "after the a1..a3 boundary; Package B is the certifier's"}
            - {key: stage.b2_construction_approval, app: option, expect: absent, why: "after the boundary; the CC is the certifier's"}
            - {key: stage.b3_construction, app: option, expect: absent, why: "after the boundary"}
            - {key: stage.b4_occupation, app: option, expect: absent, why: "after the boundary"}
            - {key: position.statutory_functions, app: ask, expect: absent, why: "row needs client flag bca_certification (as T03)"}
      authority: ["Development consent", "Construction certificate"]
    removes:
      cost_plan: ["Complying development certificate and certifier fees"]
      program: ["Prepare and lodge the complying development certificate", "Certifier determination", "Prepare and lodge the fit-out CDC", "Fire safety schedule issued with the fit-out CDC"]
      rfps:
        - {discipline: consultant.certifier, must_include: ["CDC assessment under each code: the Fire Safety Code (Part 8) for the pump works and the commercial internal alterations code for level 3 (verified: false)", "Fire safety schedule with the fit-out CDC, listing existing and new measures; confirm whether the Fire Safety Code CDC needs one (verified: false)"], must_not_include: ["Construction certificate (there is none under a CDC)", "Development application advice"]}
    why: "An external tank alone is not a DA trigger: the Fire Safety Code has standards for water storage tanks and external pump houses (Info Sheet 8.1; verified: false). The DA and CC fragments fire on hdr.cond.planning alone and the skeleton becomes sk.refurb-traditional-da. The certifier's B2 becomes the CC (b2_construction_approval) in place of the CDC (b2_cdc), and a2_planning comes in for it; the BCA consultant's RFP carries A1 to A3. The town planner's fee line joins with its package. BCA joins for the design-side compliance report; the app suggests it anyway. Assumes the fit-out is folded into the DA (a separate fit-out CDC is possible). The levy and the award re-link to 'Construction certificate'. The app has no fire safety schedule row, hence program partial."
    built_in: {procurement: "yes", cost_plan: "yes", program: "partial", rfps: "yes"}
    source: "knowledge/works/package_defaults.yaml complexity_additions[0]"
  - id: performance-solution
    label: Fire-engineered performance solution (pump room access, tank capacity or booster location)
    evidence:
      - "The pump room is not directly accessible from outside; a performance solution is proposed."
      - "A fire engineer will prepare a fire engineering brief and report for the reduced tank capacity."
      - "The proposal departs from the deemed-to-satisfy provisions for the sprinkler water supply."
    negation:
      - "The design complies with the deemed-to-satisfy provisions; no performance solution is proposed."
    profile: [flag.fire_specialist_systems]
    adds:
      procurement: [consultant.fire_engineer, consultant.bca]
      cost_plan: ["Fire engineer", "BCA consultant", "FRNSW referral fees"]
      program: ["Fire engineering brief and stakeholder meeting", "Initial fire safety report referred to FRNSW", "Fire engineering report", "Final fire safety report to FRNSW"]
      rfps:
        - {discipline: consultant.fire_engineer, must_include: ["Fire engineering brief", "Performance solution report against the sprinkler supply provisions", "FRNSW referral responses"]}
      authority: ["FRNSW referral for a performance solution against a Category 2 fire safety provision (verified: false)", "Whether a CDC can still be used (verified: false)"]
    why: "No package rule suggests a fire engineer; the fire-engineering template exists but needs the package added. Nothing models the FRNSW referral. Under this trigger the app's BCA suggestion becomes correct."
    built_in: {procurement: "no", rfps: "partial", program: "no", cost_plan: "partial"}
    source: "knowledge/rfp/fire-engineering.yaml"
  - id: town-main-inadequate
    label: Town main cannot fill or supply the system; new or upsized fire service connection
    evidence:
      - "Sydney Water's statement shows the 100 mm main cannot meet the tank refill rate."
      - "A new 150 mm fire service connection will be made to the main in George Street, with a road opening permit."
      - "Sydney Water may require the main to be upgraded as a condition of the connection."
    negation:
      - "The existing fire service connection is retained; Sydney Water confirmed the main is adequate."
    profile: [flag.public_road]
    adds:
      work_items:
        - {system: site.services-connections, action: upgrade}
      cost_plan: ["New fire service connection and road restoration", "Provisional sum: Sydney Water main augmentation", "Council road opening permit fee"]
      program: ["Sydney Water connection application and design", "Road opening permit and traffic control plan", "Connect the new fire service in the road"]
      authority: ["Sydney Water connection approval (verified: false)", "Council road opening permit under Roads Act 1993 s 138 (verified: false)"]
    why: "fr.services-connections-major fires for class 5 with a site.services-connections upgrade item. Augmentation is a client cost (uc.authority-requires-water-main-upgrade, an Implication only)."
    built_in: {program: "partial", cost_plan: "partial", work_items: "partial"}
    source: "knowledge/program/fragments.yaml fr.services-connections-major"
  - id: hydrant-system-upgrade
    label: Hydrant system or booster also upgraded (combined pumps, AS 2419.1)
    evidence:
      - "The new pumps will serve both the sprinkler and hydrant systems."
      - "The booster assembly will be relocated to the street frontage within sight of the main entry."
      - "The hydrant system will be brought up to AS 2419.1-2021 as part of the works."
    negation:
      - "The hydrant system is unaffected and remains town-main fed through the existing booster."
    profile: []
    adds:
      work_items:
        - {system: fire-active.hydrants, action: upgrade}
      cost_plan: ["Hydrant pumps, booster relocation and block plan"]
      program: ["Booster location agreed with FRNSW", "Hydrant flow and pressure test", "Update the block plan at the booster"]
      rfps:
        - {discipline: consultant.fire_services, must_include: ["Hydrant system upgrade design to AS 2419.1 (verified: false)", "Booster location and brigade access"]}
      authority: ["FRNSW consultation on booster location (verified: false)"]
    removes:
      work_items: [{system: fire-active.hydrants, action: retain}]
    why: "Hydrant fragments exist only for classes 2 and 7b, new or extend."
    built_in: {cost_plan: "partial", program: "no", rfps: "partial"}
    source: "knowledge/costs/elements.yaml elements code 07"
  - id: asbestos-found
    label: Asbestos found in the pump room or the level 3 strip-out zone
    evidence:
      - "The survey identified asbestos-containing gaskets and fibre cement lining in the pump room."
      - "The asbestos register lists vinyl floor tiles under the level 3 carpet."
      - "Bonded asbestos sheeting lines the existing store to be taken into the pump room."
    negation:
      - "The 2024 hazardous materials survey found no asbestos in the areas affected by the works."
    profile: [det.existing_building_year]
    adds:
      cost_plan: ["Licensed asbestos removal", "Air monitoring and clearance certificate"]
      program: ["SafeWork NSW notification before licensed removal", "Asbestos removal", "Clearance inspection before works resume"]
      authority: ["SafeWork NSW notification (period verified: false)"]
    why: "fr.existing-conditions gives the survey; nothing gives removal. cq.pre-2004-fabric-hazardous-materials-survey is an Implication only."
    built_in: {program: "partial", cost_plan: "no"}
    source: "knowledge/program/fragments.yaml fr.existing-conditions"
  - id: diesel-noise-exhaust
    label: Diesel pump noise or exhaust affects tenants or neighbours
    evidence:
      - "The weekly diesel pump test run will be audible in the ground-floor tenancy."
      - "The diesel exhaust must discharge above the roof, through the existing riser."
      - "A residential building adjoins the rear lane where the exhaust would discharge."
    negation:
      - "The diesel exhaust discharges through the existing basement plant exhaust shaft, clear of tenancies, air intakes and neighbours; the weekly test run is not audible in the tenancies."
    profile: []
    adds:
      procurement: [consultant.acoustic]
      work_items:
        - {system: interiors.acoustic-separation, action: new}
      cost_plan: ["Acoustic consultant", "Acoustic treatment of the pump room", "Exhaust flue riser to roof"]
      program: ["Acoustic assessment of the pump test run", "Install acoustic treatment and flue"]
      rfps:
        - {discipline: consultant.acoustic, must_include: ["Pump test run noise assessment against tenancy and neighbour criteria", "Treatment design and verification"]}
    why: "No package rule names Acoustic and there is no acoustic RFP template."
    built_in: {procurement: "no", cost_plan: "partial", program: "no", rfps: "no"}
    source: "knowledge/costs/elements.yaml elements code 05"
  - id: electrical-supply-upgrade
    label: Main switchboard or incoming supply cannot take the fire pump
    evidence:
      - "The main switchboard has no space for a supply-side fire pump connection; a new section is needed."
      - "Maximum demand with the new pump exceeds the supply capacity; an Ausgrid application is required."
    negation:
      - "The electrical engineer confirmed the MSB has capacity and a spare supply-side connection."
    profile: [det.network_operator]
    adds:
      work_items:
        - {system: electrical.switchboards, action: upgrade}
        - {system: electrical.utility-supply, action: upgrade}
      cost_plan: ["New MSB section for the fire pump", "DNSP connection application and supply upgrade"]
      program: ["Procure and deliver the MSB section", "Install the MSB section", "DNSP connection application"]
      rfps:
        - {discipline: consultant.electrical, must_include: ["DNSP application and supply upgrade", "MSB section design"]}
      authority: ["DNSP connection application (Ausgrid, Endeavour Energy or Essential Energy; verified: false)"]
    removes:
      work_items: [{system: electrical.switchboards, action: alter}]
    why: "fr.switchboard-major fires for class 5 with an upgrade item, but prints the generic 'Procure and deliver' and 'Install', which clash with joinery, so the descriptive labels here are scored as no. fr.utility-major is gated to classes 2, 7b and 9b. The electrical RFP planning stage carries the DNSP application."
    built_in: {program: "no", cost_plan: "partial", rfps: "partial"}
    source: "knowledge/program/fragments.yaml fr.switchboard-major"
  - id: pump-tank-only
    label: Fire services upgrade only, no fit-out
    evidence:
      - "The scope is limited to the fire pump and tank upgrade; no tenancy works are included."
      - "Level 3 remains leased to the existing tenant and is not affected."
    negation:
      - "The level 3 fit-out is delivered with the fire services upgrade."
    profile: [hdr.cond.operational_constraints, proj.budget_stated]   # live_environment once every floor is tenanted (keys accept partial_occupation too); removing the fit-out removes its budget, so the stated budget becomes the fire services figure
    adds:
      program: []
      authority: ["One CDC under the Fire Safety Code (verified: false)", "Fire safety schedule and final fire safety certificate may not be required for a Fire Safety Code alteration to a hydraulic fire safety system (verified: false)"]
    removes:
      procurement: [consultant.interior_design, trade.main_works]
      rfps: [consultant.interior_design]
      work_items:
        - {system: interiors.walls-linings, action: new}
        - {system: interiors.ceilings, action: alter}
        - {system: interiors.internal-doors, action: new}
        - {system: interiors.internal-glazing, action: new}
        - {system: interiors.joinery, action: new}
        - {system: interiors.painting, action: replace}
        - {system: interiors.floor-finishes, action: replace}
        - {system: mechanical.air-distribution, action: alter}
        - {system: mechanical.air-conditioning, action: new}
        - {system: hydraulic.cold-water, action: alter}
        - {system: hydraulic.hot-water, action: new}
        - {system: hydraulic.sanitary, action: alter}
        - {system: electrical.lighting, action: replace}
        - {system: fire-active.occupant-warning, action: alter}
        - {system: fire-active.emergency-lighting, action: alter}
        - {system: comms-security.structured-cabling, action: new}
      cost_plan: ["Interior designer", "Level 3 soft strip", "Interiors and finishes", "Fit-out mechanical: air distribution and comms room cooling", "Tea point plumbing", "Fit-out lighting and power", "Communications and security", "Fit-out sprinkler, detection, EWIS and emergency lighting alterations"]
