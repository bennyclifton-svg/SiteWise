schema: sitewise-synthetic-shape/1
type_id: T06
slug: sprinkler-pump-tank-upgrade
name: Sprinkler pump and tank upgrade, with fit-out
reviewed: false
state: NSW
# Every yes/no/partial value is quoted: bare yes/no are YAML 1.1 booleans.
#
# Base scenario: an occupied 1988 Class 5 office building in Sydney, six storeys
# over one basement car park (Class 7a), sprinklered throughout. The last AFSS
# round and a Sydney Water pressure and flow statement show the town-main-fed
# sprinkler supply no longer meets AS 2118.1 demand. The owner replaces the old
# single electric pump with a new electric duty pumpset, a diesel standby
# pumpset, a jockey pump and a fire water storage tank in an enlarged basement
# pump room. The owner is also fitting out the vacant level 3 floor for a new
# tenant; its sprinkler layout is calculated against the new supply, so the
# fit-out's sprinkler commissioning waits on the new pumps. A hydraulic and fire
# services engineer leads the upgrade, an interior designer the fit-out. One
# principal certifier and two CDCs: the pump, tank, pump room and fire service
# works under the Fire Safety Code (Part 8, EPI 2013 No 706; verified: false);
# the level 3 fit-out, including its sprinkler, detection and EWIS changes,
# under the commercial internal alterations code (Part 5 or now Part 5A;
# verified: false). Two works
# contracts: a fire protection contractor (AS 4000) for the base-building
# upgrade and a fit-out builder (AS 4000) for level 3. Prose: DOMAIN.md.
profile:
  hdr.building_class: commercial
  hdr.subclass: office
  hdr.work_type: refurb
  hdr.cond.planning: cdc
  hdr.cond.procurement_route: traditional
  hdr.cond.operational_constraints: partial_occupation   # levels 1-2 and 4-6 tenanted; level 3 vacant; the keys accept live_environment too (R19)
  hdr.cond.access_constraints: urban_constrained   # R19: the keys accept urban_constrained or restricted_hours
  hdr.cond.stakeholder_complexity: single_owner
  hdr.cond.quality_level: mid        # residential-only field (taxonomy.yaml applies_to); the keys mark it not_read
  hdr.cond.environmental_sensitivity: standard
  hdr.scale.storeys: 6
  det.ncc_class: ["5", "7a"]        # office over a basement car park
  det.state: NSW
  det.existing_building: true
  det.existing_building_year: 1988
  det.rise_in_storeys: 6
  det.sprinklered: true
  det.heritage_status: none
  det.flood_hazard: false            # 'pump room flooding' passages must not set it (keyword traps)
  det.potentially_contaminated_land: false   # 'backflow ... contamination of the water supply' must not set it
  det.bushfire_prone_land: false
  det.water_supply_source: reticulated
  fact.contract_form: as4000
  fact.contract_basis: lump_sum
  proj.regulated_design: "no"        # DBP Act covers Class 2 and 9c (owner ruling R3), not Class 5
  # RFP flags set explicitly so unknowns do not turn excluded rows into priced options.
  flag.basement: "no"                # the pump room is in the existing basement; no basement is built or excavated
  flag.excavation_adjoining: "no"
  flag.authority_asset: "no"         # connecting to the street water main is not building over an asset
  flag.rail: "no"
  flag.transfer_structures: "no"
  flag.osd_existing: "no"
  flag.osd_required: "no"
  flag.staged: "no"                  # 'stage 1 cut-over' is impairment sequencing, not staged construction
  flag.multi_building: "no"
  flag.public_road: "no"             # base keeps the existing fire service connection; no road opening
  flag.state_road: "no"
  flag.heavy_vehicles: "no"
  flag.sustainability_target: "no"
  flag.fire_special_hazards: "no"    # 'fire water storage tank' and 'diesel fuel storage' are not special hazards
  flag.fire_specialist_systems: "no"
  flag.fire_vulnerable_occupants: "no"
  flag.groundwater: "no"
  flag.coastal: "no"
  flag.panel: "no"
  flag.cl46: "no"

# Values the app derives or cannot set through PUT /profile; not inputs.
expected_derived:
  - {key: det.ncc_class, value: ["5", "7a"], source: "knowledge/profile/taxonomy.yaml office ncc_class", note: "The subclass office implies Class 5, but det.ncc_class is never derived from the subclass (KNOWLEDGE_INDEX §0 rule 3). The basement car park adds 7a, which a document must state."}
  - {key: det.existing_building, value: true, source: "internal/rfp/drivers.go deriveFlags", note: "The RFP drivers derive flag.existing_building from work type refurb; the profile row itself is not derived."}
  - {key: det.type_of_construction, value: A, source: "knowledge/clusters/fire/rules.yaml rule.ncc.type-of-construction", note: "Table C2D2 (verified: true in the rule): Class 5 and 7 at rise 4 or more give Type A. Derived by profile reconcile; whether the lookup accepts two classes on one part is unverified."}

# Facts the scenario documents must state; the scenario author picks the values.
scenario_inputs:
  - {key: det.ncc_class, note: "Both classes, in the fire safety schedule or BCA wording.", phrasing: "The building is Class 5 (office) with a Class 7a basement car park."}
  - {key: det.existing_building_year, note: "Gates the hazardous-materials survey implication and the asbestos trigger.", phrasing: "The building was constructed in <year>."}
  - {key: det.rise_in_storeys, note: "Feeds the Type of Construction lookup.", phrasing: "The building has a rise in storeys of <n>."}
  - {key: det.sprinklered, note: "The trigger word 'sprinkler' is everywhere in these documents; the statement must be explicit.", phrasing: "The building is sprinkler protected throughout to AS 2118.1."}
  - {key: hdr.cond.planning, note: "CDC wording in the certifier's fee proposal. Two CDCs: Fire Safety Code for the pump works, the commercial alterations code for level 3.", phrasing: "The works will be approved by two complying development certificates under the Codes SEPP: one under the Fire Safety Code and one for the level 3 fit-out."}
  - {key: hdr.cond.operational_constraints, note: "partial_occupation or live_environment are both acceptable.", phrasing: "All floors except level 3 remain tenanted and in use throughout the works."}
  - {key: det.heritage_status, note: "Enumerated none is evidence; silence is not.", phrasing: "The site is not a heritage item and is not in a heritage conservation area."}
  - {key: proj.budget_stated, note: "Owner's capital works budget; amount chosen by the scenario author. Ideally split base building and fit-out.", phrasing: "Approved budget: $<amount> excluding GST (fire services upgrade $<amount>; level 3 fit-out $<amount>)"}
  - {key: fact.contract_form, note: "Stated in the tender documents.", phrasing: "AS 4000-1997 General conditions of contract, with special conditions"}

work_items:
  # Base-building fire services upgrade
  - {system: fire-active.fire-water, action: upgrade, why: "New electric duty and diesel standby pumpsets, a jockey pump, controllers and a fire water storage tank replace a single town-main-assisted pump. Capacity rises, so upgrade, not replace."}
  - {system: fire-active.sprinklers, action: alter, why: "Connect the new pump discharge to the existing control valve sets; relocate and add level 3 heads with new hydraulic calculations against the new supply. No change in hazard or design density."}
  - {system: fire-active.hydrants, action: retain, why: "The hydrant system and booster stay in service on the town main during the works; protect and keep operating."}
  - {system: hydraulic.backflow-prevention, action: upgrade, why: "Containment backflow device on the fire service brought to current Sydney Water requirements and registered (verified: false)."}
  - {system: structure.alterations, action: alter, why: "Tank and pump plinths, any slab strengthening found by the assessment, and core holes for suction, test and fill pipes."}
  - {system: fire-passive.rated-elements, action: alter, why: "The pump room is enlarged into the adjoining store; new fire-resisting walls and a rated door enclose it (AS 2941, verified: false)."}
  - {system: fire-passive.penetrations, action: new, why: "New pipe and cable penetrations through rated walls and slabs are fire-stopped."}
  - {system: mechanical.local-exhaust, action: new, why: "Pump room ventilation: diesel combustion and cooling make-up air, plant room exhaust and the engine exhaust flue discharge. Plant room exhaust is local exhaust, not outdoor-air ventilation (services-wet-air/systems.yaml mechanical.ventilation excludes)."}
  - {system: electrical.switchboards, action: alter, why: "New fire pump supply connected at the main switchboard on the supply side of the main switch (AS/NZS 3000, verified: false)."}
  - {system: electrical.cabling-wiring, action: alter, why: "Fire-rated submain to the electric fire pump controller; level 3 power and data reticulation."}
  - {system: site.demolition, action: remove, why: "Decommission and remove the old pump, controller and redundant pipework; soft strip of level 3."}
  # Level 3 fit-out
  - {system: interiors.walls-linings, action: new, why: "Partitions for offices, meeting rooms and a comms room."}
  - {system: interiors.ceilings, action: alter, why: "Existing suspended grid kept; new tiles, bulkheads and set-out to the new layout."}
  - {system: interiors.internal-doors, action: new, why: "Doors and hardware to new rooms."}
  - {system: interiors.internal-glazing, action: new, why: "Glazed meeting-room fronts."}
  - {system: interiors.joinery, action: new, why: "Tea point and reception joinery."}
  - {system: interiors.painting, action: replace, why: "Repaint the floor."}
  - {system: interiors.floor-finishes, action: replace, why: "New carpet tiles and vinyl to the tea point."}
  - {system: mechanical.air-distribution, action: alter, why: "Relocate VAV boxes and diffusers off the base-building AHU to suit the new layout."}
  - {system: mechanical.air-conditioning, action: new, why: "Supplementary split system to the comms room."}
  - {system: hydraulic.cold-water, action: alter, why: "Tea point sink and boiling and chilled water unit."}
  - {system: hydraulic.hot-water, action: new, why: "Point-of-use hot water unit at the tea point."}
  - {system: hydraulic.sanitary, action: alter, why: "Tea point waste connected to the existing stack."}
  - {system: electrical.lighting, action: replace, why: "New LED luminaires and controls."}
  - {system: fire-active.detection, action: alter, why: "Relocate detectors to the new room layout; add pump run, fault and diesel signals to the FIP."}
  - {system: fire-active.occupant-warning, action: alter, why: "Relocate and add EWIS speakers to new rooms."}
  - {system: fire-active.emergency-lighting, action: alter, why: "Relocate exit signs and emergency luminaires to the new layout."}
  - {system: comms-security.structured-cabling, action: new, why: "Data outlets and cabling to the comms room."}

procurement:
  - {discipline: consultant.fire_services, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", aliases: [consultant.hydraulic, consultant.services], why: "Lead designer: a hydraulic and fire services engineer. Investigates the supply, designs the pumps, tank and pipework, documents, witnesses commissioning, and designs the level 3 wet and dry fire alterations. Also suggested by scope_additions[1] via fire-active.fire-water. A combined 'Hydraulic and Fire Services' proposal may file as Hydraulic, hence the alias."}
  - {discipline: consultant.structural, kind: services, built_in: "no", why: "Tank operating load, plinths, any slab strengthening and core holes in post-tensioned or conventional slabs [K: if.fire-tanks-load-structure]. The refurb baseline (baselines[2]) has no Structural, and no scope addition names structure."}
  - {discipline: consultant.electrical, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Maximum demand check, fire pump supply and fire-rated submain, MSB alteration; level 3 lighting and power. Also scope_additions[4]."}
  - {discipline: consultant.mechanical, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Diesel pump room ventilation and exhaust; level 3 air distribution and comms room cooling. Also scope_additions[2]."}
  - {discipline: consultant.certifier, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Registered certifier: CDCs, fire safety schedule, principal certifier, inspections, occupation certificate, receives the final fire safety certificate."}
  - {discipline: consultant.interior_design, kind: services, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[4]", aliases: [consultant.architect], why: "Fit-out designer for level 3: brief, concept, design development, documentation, CDC drawings, tender, site queries. An architect firm often does it, hence the alias."}
  - {discipline: consultant.hazmat, kind: services, built_in: "no", why: "1988 building: a pre-refurbishment hazardous materials survey of the pump room, the store being taken in, the risers and level 3 before strip-out; update the asbestos register (WHS Regulation 2025 (NSW; clause numbers verified: false)). No package rule names Hazmat."}
  - {discipline: trade.fire_services, kind: works, built_in: "no", why: "Licensed fire protection contractor under a direct AS 4000 lump sum for the pumps, tank, pipework, pump room builder's works (subcontracted), electrical supply (subcontracted), cut-over and commissioning. Trade packages are never suggested (KNOWLEDGE_INDEX §2.4)."}
  - {discipline: trade.main_works, kind: works, built_in: "partial", source: "internal/procurement/proposed.go ProposeHeadContract", why: "Fit-out builder for level 3 under AS 4000. The app proposes a head contract only from gaps on accepted work items, and refurb starts with none; it would also fold the fire upgrade into the same head contract."}

not_expected_procurement:
  - {discipline: consultant.architect, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "The fit-out needs one designer; the app suggests both Architect and Interior Design. Counts only when Interior Design is also present (the alias covers the other case)."}
  - {discipline: consultant.hydraulic, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "The fire services engineer covers the fire service connection and backflow device; the tea point plumbing is plumber design-and-install. A separate hydraulic engineer is not needed unless amenities change (fit-out-amenities)."}
  - {discipline: consultant.bca, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "On a deemed-to-satisfy CDC the certifier's assessment and the engineers' design certificates cover compliance. A separate BCA consultant comes with a performance solution (performance-solution trigger). Owner to confirm (DOMAIN.md §12)."}
  - {discipline: consultant.access, app_suggests: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Open-plan refit with no change to amenities, entrances or paths of travel beyond the floor; the certifier checks access within the new work. Access joins under fit-out-amenities or affected-part-access."}

cost_plan:
  # Fees and charges
  - {line: "Complying development certificate and certifier fees", section: fees_and_charges, built_in: "partial", source: "knowledge/costs/starter_lines.yaml cc-fees", aliases: ["Construction certificate and certifier fees"], why: "No CDC line; the app keeps P05 'Construction certificate and certifier fees' on a CDC, which holds it under the wrong label. Certifier also appears as a fee line (double-count risk)."}
  - {line: "Long service levy", section: fees_and_charges, built_in: "no", why: "0.25% of the cost of building work of $250,000 or more, including GST (CONVENTIONS C4, checked). Paid before work starts; paying it before the CDC issues is verified: false. No starter line."}
  - {line: "Sydney Water: statement of available pressure and flow, fire service alteration approval and backflow registration", section: fees_and_charges, built_in: "partial", source: "knowledge/costs/starter_lines.yaml service-authority", aliases: ["Service authority connection fees"], why: "One generic P06 line; no Sydney Water fire service items (statement requested through Tap in; product names and fees verified: false)."}
  # Consultants
  - {line: "Fire services engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Fee line per adopted package."}
  - {line: "Structural engineer", section: consultants, built_in: "partial", source: "internal/costs/suggest.go Suggest", why: "Fee line per package, but the package is never suggested for refurb."}
  - {line: "Electrical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Fee line per adopted package."}
  - {line: "Mechanical engineer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Fee line per adopted package."}
  - {line: "Certifier", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Professional fee; P05 duplicates it."}
  - {line: "Interior designer", section: consultants, built_in: "yes", source: "knowledge/works/package_defaults.yaml baselines[4]", why: "Fee line per adopted package."}
  - {line: "Hazardous materials consultant", section: consultants, built_in: "partial", source: "internal/costs/suggest.go Suggest", why: "Fee line per package; the package is never suggested."}
  - {line: "Fire safety practitioner assessments for the final fire safety certificate", section: consultants, built_in: "no", why: "An accredited practitioner assesses each new or altered measure (EP&A (Development Certification and Fire Safety) Regulation 2021, verified: false). Usually the building's AS 1851 maintenance contractor; no discipline id."}
  # Construction: base-building fire services upgrade (fire protection contract)
  - {line: "Decommission and remove the existing fire pump, controller and redundant pipework", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 01", why: "site.demolition prices under '01 Site works and external works', a misleading label for plant removal inside the building."}
  - {line: "Fire pumpsets: electric duty, diesel standby, jockey and controllers", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 07", why: "Folded into one '07 Active fire protection' line with the fit-out's sprinkler, detection and EWIS work."}
  - {line: "Fire water storage tank, level controls and fill valves", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 07", why: "Folded into '07 Active fire protection'."}
  - {line: "Pump room pipework, valves, test line and connection to the sprinkler valve sets", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 07", why: "Folded into '07 Active fire protection'."}
  - {line: "Diesel fuel tank, bunding and exhaust flue", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 07", why: "Diesel fuel storage for fire pumps is part of fire-active.fire-water (systems.yaml describes); still one 07 line."}
  - {line: "Pump room ventilation", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 08", why: "Shares '08 Mechanical services' with the level 3 air distribution, under a different contract."}
  - {line: "Structural works: plinths, slab strengthening and core holes", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 03", why: "'03 Structure' once structure.alterations exists."}
  - {line: "Pump room fire-rated enclosure, door and fire stopping", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 06", why: "'06 Passive fire protection'."}
  - {line: "Fire pump electrical supply: MSB connection and fire-rated submain", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 10", why: "Shares '10 Electrical services' with the fit-out lighting and power."}
  - {line: "Fire service backflow prevention device", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 09", why: "'09 Hydraulic services'; mapped to trade.hydraulic_plumbing only if that works package exists, else the head contract. In practice the fire contractor carries it."}
  - {line: "Temporary fire protection during impairment: hire pump, fire watch, out-of-hours cut-over", section: construction, built_in: "no", why: "A real cost on a live building; no line or system models it."}
  - {line: "Testing and commissioning: hydrostatic, pump flow and integrated tests", section: construction, built_in: "no", why: "No testing or commissioning line exists."}
  - {line: "Preliminaries and occupied-building controls", section: construction, built_in: "no", why: "Site establishment, after-hours work, dock and lift bookings, protection of the car park. No preliminaries line; the split spreads it pro rata."}
  # Construction: level 3 fit-out (fit-out contract)
  - {line: "Level 3 soft strip", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 01", why: "Same '01 Site works and external works' line as the pump removal."}
  - {line: "Interiors and finishes", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml elements code 05", why: "Partitions, ceilings, doors, glazing, joinery, paint and floors: the app's '05 Interiors and finishes' fits the fit-out."}
  - {line: "Fit-out sprinkler, detection, EWIS and emergency lighting alterations", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 07", why: "Merged into the same 07 line as the pumps and tank, though a different contract."}
  - {line: "Fit-out mechanical: air distribution and comms room cooling", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 08", why: "Merged with pump room ventilation in 08."}
  - {line: "Tea point plumbing", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 09", why: "Merged with the backflow device in 09."}
  - {line: "Fit-out lighting and power", section: construction, built_in: "partial", source: "knowledge/costs/elements.yaml elements code 10", why: "Merged with the fire pump supply in 10."}
  - {line: "Communications and security", section: construction, built_in: "yes", source: "knowledge/costs/elements.yaml elements code 11", why: "Structured cabling to level 3."}
  # Contingency
  - {line: "Design contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml design-contingency", why: "Always suggested."}
  - {line: "Construction contingency", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml construction-contingency", why: "Always suggested. Latent conditions in the pump room and the supply test result make it matter."}
  - {line: "Escalation", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml escalation", why: "Always suggested."}
  - {line: "Exclusions", section: contingency, built_in: "yes", source: "knowledge/costs/starter_lines.yaml exclusions", why: "Tenant FF&E and IT equipment, Sydney Water main augmentation, asbestos removal unless found."}
  - {line: "Provisional sum: asbestos removal found by the survey", section: contingency, built_in: "no", why: "Pre-2004 building; extent unknown until the survey. No provisional-sum line."}

not_expected_cost_plan:
  - {line: "Architect (consultant fee)", app_label: "F0n Architect", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion on cost-plan prepare; duplicates the interior designer."}
  - {line: "Hydraulic (consultant fee)", app_label: "F0n Hydraulic", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[2]", why: "Adopted suggestion; see not_expected_procurement."}
  - {line: "BCA (consultant fee)", app_label: "F0n BCA", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Adopted suggestion; not needed on a deemed-to-satisfy CDC."}
  - {line: "Access (consultant fee)", app_label: "F0n Access", section: consultants, source: "knowledge/works/package_defaults.yaml baselines[3]", why: "Adopted suggestion; no amenities or entry change."}
  - {line: "Stairs, ramps, handrails and nosings", app_label: "13.x Stairs, ramps, handrails and nosings", section: construction, source: "knowledge/profile/scope_defaults.yaml implied_by stair", why: "Fires when 'fire stairs' wording in the impairment plan implies access-egress.stairs-and-ramps (keyword trap)."}

program:
  skeleton: sk.refurb-traditional-cdc
  activities:
    # Investigation
    - {label: "Collect the fire safety schedule, last AFSS, AS 1851 records and as-built fire drawings", stage: investigation, fragment: null, after: [], built_in: "no", why: "The existing approval basis and the defects that started the job. cq.nsw-essential-measures-continuity-review raises this only as an Implication."}
    - {label: "Apply to Sydney Water for a statement of available pressure and flow", stage: investigation, fragment: null, after: [], built_in: "no", why: "The design supply case, requested through Sydney Water Tap in; FRNSW expects one for any hydraulic fire safety system design or alteration (verified: false). uc.authority-requires-water-main-upgrade is an Implication only."}
    - {label: "Flow and pressure test of the existing fire water supply", stage: investigation, fragment: null, after: ["Collect the fire safety schedule, last AFSS, AS 1851 records and as-built fire drawings"], built_in: "no", why: "Test at the booster or test line before design. uc.existing-fire-water-fails-flow-test proposes it as an Implication only."}
    - {label: "Measure the existing building", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Pump room, store and level 3 survey."}
    - {label: "Hazardous-materials survey", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "1988 building; before any strip-out or pump room demolition."}
    - {label: "Trace existing services", stage: investigation, fragment: fr.existing-conditions, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.existing-conditions", why: "Existing fire mains, valve sets, MSB and risers."}
    - {label: "Structural assessment of the tank location and pump room slab", stage: investigation, fragment: null, after: ["Measure the existing building"], built_in: "no", why: "Tank operating load on the basement slab; scan before coring. No structural package or investigate item."}
    - {label: "Maximum demand and main switchboard capacity check for the fire pump", stage: investigation, fragment: null, after: ["Trace existing services"], built_in: "no", why: "Fire pump start current and supply-side connection space (fm.fire-pump-start-drops-board-voltage)."}
    # Concept design
    - {label: "Fire services options report: supply strategy, pump configuration, tank size and location", stage: concept_design, fragment: null, after: ["Flow and pressure test of the existing fire water supply", "Apply to Sydney Water for a statement of available pressure and flow", "Structural assessment of the tank location and pump room slab", "Maximum demand and main switchboard capacity check for the fire pump"], built_in: "no", why: "The decision the whole job hangs on. No fire-water fragment exists."}
    - {label: "Impairment and staging strategy for the occupied building", stage: concept_design, fragment: null, after: ["Fire services options report: supply strategy, pump configuration, tank size and location"], built_in: "no", why: "How the sprinkler system stays protected during cut-over (rule.project.fire-system-impairment applies only when fire-control or exits are present, and reaches no generator)."}
    - {label: "Owner approves the upgrade option and budget", stage: concept_design, fragment: null, after: ["Fire services options report: supply strategy, pump configuration, tank size and location"], built_in: "no", why: "Client gate before documentation."}
    - {label: "Confirm the brief", stage: concept_design, fragment: fr.concept-design-fitout, after: [], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Level 3 tenant brief."}
    - {label: "Prepare the concept design", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Confirm the brief"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Fit-out test fit and concept."}
    - {label: "Client review of the concept", stage: concept_design, fragment: fr.concept-design-fitout, after: ["Prepare the concept design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.concept-design-fitout", why: "Owner and tenant sign-off."}
    - {label: "Develop the design", stage: concept_design, fragment: fr.design-development-fitout, after: ["Client review of the concept"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.design-development-fitout", why: "Fit-out design development."}
    # Construction documentation
    - {label: "Fire services design, hydraulic calculations and specification", stage: construction_documentation, fragment: null, after: ["Owner approves the upgrade option and budget", "Impairment and staging strategy for the occupied building"], built_in: "no", why: "Pumps, tank, pipework, controls, cut-over sequence and the level 3 head layout calculated on the new supply."}
    - {label: "Structural design: tank plinth, slab strengthening and penetrations", stage: construction_documentation, fragment: null, after: ["Fire services design, hydraulic calculations and specification"], built_in: "no", why: "Needs the selected tank's operating load (if.fire-tanks-load-structure)."}
    - {label: "Electrical design: fire pump supply and fire-rated submain", stage: construction_documentation, fragment: null, after: ["Fire services design, hydraulic calculations and specification"], built_in: "no", why: "Supply-side connection, cable route protection (if.essential-power-supplies-fire-water)."}
    - {label: "Competent fire safety practitioner endorses the fire services plans and specifications", stage: construction_documentation, fragment: null, after: ["Fire services design, hydraulic calculations and specification"], built_in: "no", why: "Plans and specifications for installing or modifying a relevant fire safety system (sprinklers) are prepared or endorsed by a competent fire safety practitioner and lodged with the CDC application (EP&A (DCFS) Regulation 2021, verified: false). Covers both the pump works and the level 3 sprinkler changes."}
    - {label: "Prepare fit-out documentation", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["Develop the design"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "Level 3 drawings and specification."}
    - {label: "Coordinate consultant documentation", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["Prepare fit-out documentation"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "Generic; does not name the fire services upgrade."}
    - {label: "Client sign-off for tender", stage: construction_documentation, fragment: fr.fitout-documentation, after: ["Coordinate consultant documentation", "Fire services design, hydraulic calculations and specification", "Structural design: tank plinth, slab strengthening and penetrations", "Electrical design: fire pump supply and fire-rated submain"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fitout-documentation", why: "Both packages signed off."}
    # Approvals
    - {label: "Prepare and lodge the complying development certificate", stage: approvals, fragment: fr.cdc-application, after: ["Client sign-off for tender", "Competent fire safety practitioner endorses the fire services plans and specifications"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.cdc-application", why: "The Fire Safety Code CDC (Part 8, verified: false) for the pump, tank, pump room and fire service works. The app has one CDC fragment."}
    - {label: "Prepare and lodge the fit-out CDC", stage: approvals, fragment: null, after: ["Client sign-off for tender", "Competent fire safety practitioner endorses the fire services plans and specifications"], built_in: "no", why: "Second code: the Codes SEPP code for internal alterations to commercial buildings (historically Part 5 Commercial and Industrial Alterations Code; now possibly Part 5A Industrial and Business Buildings Code; verified: false). Carries the level 3 sprinkler, detection and EWIS changes. The app has one CDC fragment."}
    - {label: "Pay the long service levy", stage: approvals, fragment: null, after: ["Prepare and lodge the complying development certificate"], built_in: "no", why: "Before the CDC issues (verified: false)."}
    - {label: "Certifier determination", stage: approvals, fragment: fr.cdc-application, after: ["Prepare and lodge the complying development certificate", "Pay the long service levy"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.cdc-application", why: "CDC determination."}
    - {label: "Fire safety schedule issued with the fit-out CDC", stage: approvals, fragment: null, after: ["Certifier determination", "Prepare and lodge the fit-out CDC"], built_in: "no", why: "Lists existing and new essential fire safety measures and their standards of performance. The Fire Safety Code CDC may be exempt from the schedule and the fire safety certificate for an alteration to a hydraulic fire safety system (Info Sheet 8.1, citing the 2000 Regulation; 2021 provision verified: false). Also stands for the fit-out CDC determination; the app has one CDC fragment."}
    - {label: "Sydney Water approval of the fire service and backflow alterations", stage: approvals, fragment: null, after: ["Client sign-off for tender"], built_in: "no", why: "Application process verified: false."}
    # Procurement
    - {label: "Assemble the tender package", stage: procurement, fragment: fr.tender-docs-fitout, after: ["Client sign-off for tender"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.tender-docs-fitout", why: "One tender row; the job has two tenders (fire protection contractor and fit-out builder)."}
    - {label: "Tender period", stage: procurement, fragment: fr.tender-period-fitout, after: ["Assemble the tender package"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-period-fitout", why: "Site inspection of the pump room is essential."}
    - {label: "Evaluate tenders", stage: procurement, fragment: fr.tender-evaluation-fitout, after: ["Tender period"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.tender-evaluation-fitout", why: "Check contractor licence, pumpset make and lead time, impairment method."}
    - {label: "Award the contract", stage: procurement, fragment: fr.contract-award, after: ["Evaluate tenders", "Certifier determination"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.contract-award", why: "Two awards in practice."}
    - {label: "Fire services engineer reviews pumpset, controller and tank submittals", stage: procurement, fragment: null, after: ["Award the contract"], built_in: "no", why: "Pump curves checked against the duty points before ordering; the commonest cause of a failed acceptance test (fm.fire-pump-fails-flow-test)."}
    - {label: "Order long-lead pumpsets, controllers and tank", stage: procurement, fragment: null, after: ["Fire services engineer reviews pumpset, controller and tank submittals"], built_in: "no", why: "Diesel pumpsets and controllers are long-lead items; no lead-time row exists for fire-water."}
    # Construction: base-building upgrade
    - {label: "Appoint the principal certifier and give notice of commencement", stage: construction, fragment: null, after: ["Award the contract", "Fire safety schedule issued with the fit-out CDC"], built_in: "no", why: "Before work starts (notice period verified: false)."}
    - {label: "Establish the site", stage: construction, fragment: fr.site-establishment-fitout, after: ["Appoint the principal certifier and give notice of commencement"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.site-establishment-fitout", why: "Basement compound, dock bookings, protection."}
    - {label: "Notify the impairment: building manager, tenants, fire wardens, monitoring provider and insurer", stage: construction, fragment: null, after: ["Establish the site"], built_in: "no", why: "Before any isolation (process verified: false). Nothing in the app models it."}
    - {label: "Isolate services and protect adjacent areas", stage: construction, fragment: fr.strip-out-fitout, after: ["Establish the site"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.strip-out-fitout", why: "Level 3 strip-out."}
    - {label: "Soft-strip partitions, ceilings and services", stage: construction, fragment: fr.strip-out-fitout, after: ["Isolate services and protect adjacent areas"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.strip-out-fitout", why: "Level 3 strip-out."}
    - {label: "Make good retained structure and services", stage: construction, fragment: fr.strip-out-fitout, after: ["Soft-strip partitions, ceilings and services"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.strip-out-fitout", why: "Level 3."}
    - {label: "Alter and protect retained structure", stage: construction, fragment: fr.structure-alterations, after: ["Establish the site"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.structure-alterations", why: "Plinths and core holes. The app links it after the level 3 strip-out, which is a different area."}
    - {label: "Pump room fire-rated enclosure and door", stage: construction, fragment: null, after: ["Alter and protect retained structure"], built_in: "no", why: "fire-passive.rated-elements has no fragment."}
    - {label: "Assemble the fire water tank and install pumpsets, controllers and pipework", stage: construction, fragment: null, after: ["Alter and protect retained structure", "Order long-lead pumpsets, controllers and tank"], built_in: "no", why: "The core of the job. fire-active.fire-water has no fragment (KNOWLEDGE_INDEX §8 gap 3)."}
    - {label: "Pump room ventilation and diesel exhaust flue", stage: construction, fragment: null, after: ["Pump room fire-rated enclosure and door"], built_in: "no", why: "mechanical.local-exhaust has no fragment."}
    - {label: "Fire pump electrical supply: main switchboard alteration and fire-rated submain", stage: construction, fragment: null, after: ["Establish the site"], built_in: "no", why: "fr.switchboard-major needs new, replace or upgrade; an alter item gets nothing."}
    - {label: "Seal service penetrations", stage: construction, fragment: fr.fire-stopping, after: ["Assemble the fire water tank and install pumpsets, controllers and pipework"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.fire-stopping", why: "The fragment has no predecessor, so the app floats it from the stage start."}
    - {label: "Hold point: a location-based inspection record for concealed fire stopping", stage: construction, fragment: null, after: ["Seal service penetrations"], built_in: "yes", source: "knowledge/clusters/fire/interfaces.yaml if.fire-stopping-before-concealment", why: "Fires; the app places it before every interiors row, including the level 3 partitions."}
    - {label: "Install the fire service backflow device and register it with Sydney Water", stage: construction, fragment: null, after: ["Sydney Water approval of the fire service and backflow alterations", "Establish the site"], built_in: "no", why: "hydraulic.backflow-prevention has no fragment."}
    - {label: "Hydrostatic test of the new fire pipework", stage: construction, fragment: null, after: ["Assemble the fire water tank and install pumpsets, controllers and pipework"], built_in: "no", why: "AS 2118.1 test pressure and duration verified: false."}
    - {label: "Planned impairment: cut the sprinkler system over to the new pumps and tank", stage: construction, fragment: null, after: ["Hydrostatic test of the new fire pipework", "Fire pump electrical supply: main switchboard alteration and fire-rated submain", "Install the fire service backflow device and register it with Sydney Water", "Notify the impairment: building manager, tenants, fire wardens, monitoring provider and insurer", "Pump room ventilation and diesel exhaust flue"], built_in: "no", why: "Out of hours, with temporary protection and a restoration test before the isolation is withdrawn."}
    - {label: "Pump commissioning: flow tests at duty points, diesel start tests and alarm signals to the FIP", stage: construction, fragment: null, after: ["Planned impairment: cut the sprinkler system over to the new pumps and tank"], built_in: "no", why: "AS 2941 acceptance tests (verified: false); witnessed by the fire services engineer (fm.fire-pump-fails-flow-test)."}
    - {label: "Remove the old pump and redundant pipework", stage: construction, fragment: null, after: ["Pump commissioning: flow tests at duty points, diesel start tests and alarm signals to the FIP"], built_in: "no", why: "Only after the new system is proven; the app's strip-out rows sit at the start of construction."}
    # Construction: level 3 fit-out
    - {label: "Frame and line partitions", stage: construction, fragment: fr.partitions-fitout, after: ["Make good retained structure and services"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.partitions-fitout", why: "Fit-out."}
    - {label: "Alter ductwork and pipework", stage: construction, fragment: fr.mechanical-fitout, after: ["Make good retained structure and services"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.mechanical-fitout", why: "Fires through the mechanical.air-conditioning item; the air-distribution item has no fragment."}
    - {label: "Electrical rough-in", stage: construction, fragment: fr.electrical-fitout, aliases: ["Rough-in"], after: ["Make good retained structure and services"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.electrical-fitout", why: "Fit-out power and lighting rough-in."}
    - {label: "Sanitary rough-in", stage: construction, fragment: fr.hydraulic-sanitary-fitout, aliases: ["Rough-in"], after: ["Make good retained structure and services"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.hydraulic-sanitary-fitout", why: "Tea point waste."}
    - {label: "Alter cold water", stage: construction, fragment: fr.hydraulic-cold-fitout, after: ["Make good retained structure and services"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.hydraulic-cold-fitout", why: "Tea point."}
    - {label: "Install or alter the local hot-water unit", stage: construction, fragment: fr.hydraulic-hot-fitout, after: ["Make good retained structure and services"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.hydraulic-hot-fitout", why: "Tea point."}
    - {label: "Install structured cabling", stage: construction, fragment: fr.comms-fitout, after: ["Frame and line partitions"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.comms-fitout", why: "Fit-out."}
    - {label: "Alter and test sprinklers", stage: construction, fragment: fr.sprinklers-fitout, after: ["Frame and line partitions", "Alter ductwork and pipework"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.sprinklers-fitout", why: "Pipework and drops above the ceiling grid, before tiles close. The app links it after fr.ceilings-fitout, the wrong way round."}
    - {label: "Hold point: a recorded pressure test of the sprinkler pipework", stage: construction, fragment: null, after: ["Alter and test sprinklers"], built_in: "yes", source: "knowledge/clusters/fire/interfaces.yaml if.sprinkler-pressure-test-before-ceilings", why: "Fires, but its link to the ceilings is dropped as a loop (addGuarded), so the ceilings are not held."}
    - {label: "Install ceilings", stage: construction, fragment: fr.ceilings-fitout, after: ["Hold point: a recorded pressure test of the sprinkler pipework", "Hold point: a location-based inspection record for concealed fire stopping"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.ceilings-fitout", why: "Ceiling tiles close only after the pressure test."}
    - {label: "Alter detection and warning", stage: construction, fragment: fr.detection-fitout, after: ["Install ceilings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.detection-fitout", why: "Detectors in the new ceiling."}
    - {label: "Relocate EWIS speakers, exit signs and emergency lighting", stage: construction, fragment: null, after: ["Install ceilings"], built_in: "no", why: "fire-active.occupant-warning and fire-active.emergency-lighting have no fragment."}
    - {label: "Install luminaires", stage: construction, fragment: fr.lighting-fitout, after: ["Install ceilings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.lighting-fitout", why: "Fit-out."}
    - {label: "Hang doors", stage: construction, fragment: fr.internal-doors-fitout, after: ["Frame and line partitions"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.internal-doors-fitout", why: "Fit-out."}
    - {label: "Procure and deliver joinery", stage: construction, fragment: fr.joinery-fitout, aliases: ["Procure and deliver"], after: ["Award the contract"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.joinery-fitout", why: "Fit-out."}
    - {label: "Install joinery", stage: construction, fragment: fr.joinery-fitout, aliases: ["Install"], after: ["Frame and line partitions", "Procure and deliver joinery"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.joinery-fitout", why: "Fit-out."}
    - {label: "Sanitary fit-off", stage: construction, fragment: fr.hydraulic-sanitary-fitout, aliases: ["Fit off"], after: ["Install joinery", "Sanitary rough-in"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.hydraulic-sanitary-fitout", why: "Tea point."}
    - {label: "Electrical fit-off", stage: construction, fragment: fr.electrical-fitout, aliases: ["Fit off"], after: ["Install ceilings", "Electrical rough-in"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.electrical-fitout", why: "Fit-out."}
    - {label: "Commission the altered system", stage: construction, fragment: fr.mechanical-fitout, after: ["Install ceilings"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.mechanical-fitout", why: "Air balancing of level 3."}
    - {label: "Paint the fit-out", stage: construction, fragment: fr.painting-fitout, after: ["Install joinery"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.painting-fitout", why: "Fit-out."}
    - {label: "Lay floor finishes", stage: construction, fragment: fr.floors-fitout, after: ["Paint the fit-out"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.floors-fitout", why: "Fit-out."}
    - {label: "Integrated fire system test: pumps, flow switches, FIP, EWIS and monitoring", stage: construction, fragment: null, after: ["Pump commissioning: flow tests at duty points, diesel start tests and alarm signals to the FIP", "Alter detection and warning", "Relocate EWIS speakers, exit signs and emergency lighting"], built_in: "no", why: "rule.project.integrated-fire-testing needs fire-control present; no fragment."}
    # Completion
    - {label: "Fire safety practitioner assessment of each new and altered measure", stage: completion, fragment: null, after: ["Integrated fire system test: pumps, flow switches, FIP, EWIS and monitoring"], built_in: "no", why: "Competent fire safety practitioner (verified: false)."}
    - {label: "Owner issues the final fire safety certificate; copy to FRNSW with the fire safety schedule; displayed in the building", stage: completion, fragment: null, after: ["Fire safety practitioner assessment of each new and altered measure"], built_in: "no", why: "Owner's certificate before the OC; copy to FRNSW with the current fire safety schedule and displayed in the building (s 85 per FRNSW 'Lodge a fire safety certificate'; verified: false). The council receives it from the principal certifier with the OC. Needed for the level 3 measures; the Fire Safety Code works may be exempt (verified: false). No NSW fire safety step exists in the knowledge."}
    - {label: "Practical completion inspection", stage: completion, fragment: fr.practical-completion, after: ["Lay floor finishes", "Remove the old pump and redundant pipework", "Integrated fire system test: pumps, flow switches, FIP, EWIS and monitoring", "Electrical fit-off", "Sanitary fit-off", "Commission the altered system", "Install luminaires", "Hang doors", "Install structured cabling"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.practical-completion", why: "Two contracts reach PC separately in practice."}
    - {label: "Final inspection by the principal certifier", stage: completion, fragment: null, after: ["Owner issues the final fire safety certificate; copy to FRNSW with the fire safety schedule; displayed in the building"], built_in: "no", why: "Before the OC (critical-stage inspections for Class 5 verified: false)."}
    - {label: "Occupation certificate", stage: completion, fragment: fr.occupation-certificate, after: ["Final inspection by the principal certifier", "Practical completion inspection"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.occupation-certificate", why: "Needed before the tenant occupies level 3; the app has no link to the fire safety certificate."}
    - {label: "Handover", stage: completion, fragment: fr.handover, after: ["Occupation certificate"], built_in: "partial", source: "knowledge/program/fragments.yaml fr.handover", why: "Generic. The job needs as-builts, block plan, pump test logbook, O&M manuals and handover to the AS 1851 maintenance contractor."}
    - {label: "Update the essential measures register and AS 1851 maintenance schedule", stage: completion, fragment: null, after: ["Handover"], built_in: "no", why: "rule.as1851.fire-system-maintenance names it but reaches no generator."}
    # Defects
    - {label: "Defects inspection", stage: defects, fragment: fr.defects-inspection, after: ["Handover"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-inspection", why: "Standard."}
    - {label: "Defects liability period", stage: defects, fragment: fr.defects-liability-end, after: ["Defects inspection"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "AS 4000 period (length verified: false)."}
    - {label: "Final defects inspection", stage: defects, fragment: fr.defects-liability-end, after: ["Defects liability period"], built_in: "yes", source: "knowledge/program/fragments.yaml fr.defects-liability-end", why: "Standard."}
    - {label: "Next annual fire safety statement covers the new measures", stage: defects, fragment: null, after: ["Update the essential measures register and AS 1851 maintenance schedule"], built_in: "no", why: "The owner's AFSS falls due annually; the new measures join it (verified: false)."}

rfps:
  - discipline: consultant.fire_services
    template: fire-services
    built_in: "partial"
    source: "knowledge/rfp/fire-services.yaml"
    aliases: [consultant.hydraulic]
    must_include:
      - {text: "Review of the fire safety schedule, last AFSS, AS 1851 records and as-built drawings", key: stage.inception}
      - {text: "Investigation of the existing supply, pump, valve sets and booster, with a flow and pressure test", key: stage.investigation}
      - {text: "Sydney Water statement of available pressure and flow (Tap in), and approval of the fire service and backflow alterations", key: position.authority}
      - {text: "Demand and storage calculations to AS 2118.1 (verified: false)", key: position.supply}
      - {text: "Pumpset and tank design to AS 2941: electric duty, diesel standby, jockey, controllers (verified: false)", key: position.wet}
      - {text: "Upgrade design of the existing system", key: position.upgrade}
      - {text: "Pump room interfaces: structure, power, ventilation, drainage and brigade access", key: position.plant}
      - {text: "Impairment, staging and restoration plan for the occupied building", key: position.staging}
      - {text: "Level 3 sprinkler, detection and EWIS alterations", key: position.dry}
      - {text: "Pump signals to the FIP and monitoring: cause-and-effect coordination", key: position.controls}
      - {text: "Tender documentation: drawings, calculations, specification", key: stage.tender}
      - {text: "Construction-phase reviews and hold-point inspections", key: stage.construction}
      - {text: "Commissioning witness: hydrostatic, pump flow, diesel start and integrated tests", key: stage.handover}
      - {text: "Design compliance certificates for the CDC", key: position.declarations}
    must_not_include:
      - {text: "Fire engineering strategy or performance solutions", key: position.strategy}
      - {text: "Special hazard suppression", key: position.hazards}
      - "Development application documentation"
      - {text: "Advisory-only report", key: stage.advisory}
    expect:
      stages_include: [inception, investigation, concept, design, tender, construction, handover]
      stages_option: [continuation]
      stages_absent: [advisory]
      positions: {wet: I, supply: I, authority: I, dry: I, controls: I, plant: I, existing: I, upgrade: I, staging: I, remediation: O, hazards: X, strategy: X, declarations: I, continuation: O, construction: I, witness: I, execution: O}
      blocking: []
      sources:
        - "boundary always inception..design (fire-services.yaml boundary); a traditional consultant-designed upgrade needs documentation, construction support and commissioning witness"
    app_differs:
      - {key: stage.investigation, app: ask, expect: include, why: "client flag fs_investigation cannot be keyed"}
      - {key: stage.tender, app: option, expect: include, why: "after the boundary end (design)"}
      - {key: stage.construction, app: option, expect: include, why: "after the boundary end; default option"}
      - {key: stage.handover, app: option, expect: include, why: "after the boundary end; commissioning witness is core on a pump upgrade"}
      - {key: stage.advisory, app: option, expect: absent, why: "always option"}
      - {key: position.wet, app: ask, expect: I, why: "client flag fs_wet"}
      - {key: position.supply, app: ask, expect: I, why: "client flag fs_supply"}
      - {key: position.authority, app: ask, expect: I, why: "client flag fs_authority"}
      - {key: position.dry, app: ask, expect: I, why: "client flag fs_dry"}
      - {key: position.controls, app: ask, expect: I, why: "client flag fs_controls"}
      - {key: position.plant, app: ask, expect: I, why: "client flag fs_plant_interfaces"}
      - {key: position.existing, app: absent, expect: I, why: "row needs the investigation stage included or optioned; it is ask (client flag fs_investigation), so the row is left out (as T03)"}
      - {key: position.upgrade, app: ask, expect: I, why: "client flag fs_upgrade"}
      - {key: position.declarations, app: ask, expect: I, why: "client flag fs_declarations"}
      - {key: position.staging, app: O, expect: I, why: "always O; impairment management is core in an occupied building"}
      - {key: position.construction, app: O, expect: I, why: "follows the construction stage, which the app prices as an option"}
      - {key: position.witness, app: O, expect: I, why: "follows the handover stage, which the app prices as an option"}
  - discipline: consultant.structural
    template: structural
    built_in: "partial"
    source: "knowledge/rfp/structural.yaml stages existing_assessment"
    why: "The template fits once the user adds the package; the package is never suggested for refurb."
    must_include:
      - {text: "Assessment of the existing slab for the tank operating load", key: stage.existing_assessment}
      - "Tank and pump plinth design; slab strengthening if the assessment needs it"
      - {text: "Fixing and seismic restraint of the tank, pumpsets and pipework", key: position.services_fixings}
      - "Core hole and penetration review, with scanning before coring"
      - {text: "Structural certification for the CDC", key: stage.planning_approval}
      - {text: "Inspection of plinths and strengthening before concrete", key: stage.construction_phase}
    must_not_include:
      - {text: "Geotechnical brief", key: position.geotech_brief}
      - {text: "Shoring or retention design", key: position.retention_design}
      - {text: "Revit model shared with the design team", key: position.shared_model}
      - {text: "Regulated design (DBP Act)", key: stage.regulated_design}
      - {text: "Authority asset assessment", key: stage.authority_asset}
      - "Construction certificate certification"
    expect:
      stages_include: [existing_assessment, planning_approval, design_development, tender_traditional, construction_documents, construction_phase]
      stages_option: []
      stages_absent: [concept_schematic, authority_asset, dnc_tender, regulated_design, post_novation]
