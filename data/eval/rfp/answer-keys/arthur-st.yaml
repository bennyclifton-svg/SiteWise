sources:
- "Owner decisions 1 and 3 (13 October 2026, docs/plans/2026-10-13-house-rfp-brief.md): the architect RFP prints the construction
  budget, so a missing budget blocks issue; who engages each consultant is a stated input (client here)."
- "Parts and areas: architecture ledger header (nettletontribe: warehouse 2,135 m², mezzanine office 215 m², site 31,720
