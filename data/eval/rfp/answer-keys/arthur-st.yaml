- "GFA dispute: traffic ledger note (BG&E 2,895 m² vs 2,135 m² elsewhere); the project table must carry one figure, so
  the conflict blocks issue."
- "Existing OSD and Sydney Water asset: civil ledger (keep existing OSD; option to design a new OSD) and structural ledger
  #47-48."
- "Strengthening stays an option pending the existing structure assessment (peer review: no unsupported strengthening
  assumption)."
- "Geotechnical engineer has no package in this fixture, so compaction inspections show as unallocated (advisory)."
