- "Peer review scenario: a small Class 1 extension gets footing and framing scope and existing-work scope, with no warehouse
  BIM, SIDRA or campus allowances."
- "Owner decisions of 13 October 2026 (docs/plans/2026-10-13-house-rfp-brief.md): a Class 1 house gets one documentation
