sources:
  - "Owner critique of the Custom Home 2 architect RFP, 13 October 2026 (docs/plans/2026-10-13-house-rfp-brief.md): commercial rows leave a house RFP and the unallocated façade, signage, performance-solution and civil checks go with them."
  - "Owner decision 4 (13 October 2026): a Class 1 house gets one documentation set for tender and construction, so tender_traditional and for_construction give way to house_documents, which the base fee includes."
  - "Owner decision 5: who lodges is a question; here the owner lodges, so lodgement is excluded and the client does it."
  - "Golden specification (Newham on York builder's project specification) is produced by the architect at the end of design: kitchen, bathroom and joinery design, the finishes and fixtures schedule and the specification are included for a house."
  - "The Sydney Water asset flag prices the building-plan approval as an option; who prepares it varies."
